name: Build reviewed app installation entry
on:
  push:
    branches: [feat/app-install-31]
    paths:
      - manifest.webmanifest
      - assets/icons/**
      - scripts/app-install.js
      - scripts/app-install.css
      - scripts/apply-app-install.py
      - scripts/test-app-install.cjs
      - scripts/app-install-build.json
      - .github/workflows/build-app-install.yml
permissions:
  contents: write
concurrency:
  group: app-install-31-builder
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feat/app-install-31'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify branch and exact lease
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(git rev-parse --show-toplevel)"
          test "$repo_root" = "$GITHUB_WORKSPACE"
          test "$repo_root" != /Users/wangtingwei
          test "$GITHUB_REF_NAME" = feat/app-install-31
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/app-install-31 | cut -f1)" = "$GITHUB_SHA"
      - name: Build and validate installation entry
        run: |
          python3 scripts/apply-app-install.py
          python3 scripts/apply-app-install.py --check
          python3 scripts/apply-enrichment.py --check
          python3 scripts/apply-textbook.py --check
          python3 scripts/apply-learning-project.py --check
          python3 scripts/apply-advanced-training.py --check
          python3 scripts/apply-exam-schedule.py --check
          python3 - <<'PY'
          import json,hashlib,pathlib
          expected=json.loads(pathlib.Path('scripts/app-install-build.json').read_text())
          for name,sha in expected['sources'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha,name
          assert hashlib.sha256(pathlib.Path('index.html').read_bytes()).hexdigest()==expected['indexSha256'],'generated index differs from reviewed candidate'
          PY
          node scripts/test-app-install.cjs
          node scripts/test-progress-sync.cjs
          node scripts/test-practice-sections.cjs
      - name: Commit reviewed generated index on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(git rev-parse --show-toplevel)"
          test "$repo_root" = "$GITHUB_WORKSPACE"
          test "$repo_root" != /Users/wangtingwei
          test "$GITHUB_REF_NAME" = feat/app-install-31
          test "$(git ls-remote origin refs/heads/feat/app-install-31 | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- index.html
          if git diff --cached --quiet -- index.html; then
            echo 'Reviewed index is already current.'
          else
            git commit -m 'Build reviewed app installation entry'
            test "$(git ls-remote origin refs/heads/feat/app-install-31 | cut -f1)" = "$GITHUB_SHA"
            git push origin HEAD:feat/app-install-31
          fi
