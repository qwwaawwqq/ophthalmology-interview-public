name: Build reviewed exam schedule on its feature branch
on:
  push:
    branches: [feat/exam-schedule-25]
    paths:
      - scripts/exam-schedule.js
      - scripts/exam-schedule.css
      - scripts/apply-exam-schedule.py
      - scripts/test-exam-schedule.cjs
      - scripts/build-exam-schedule.json
      - content/exam-schedule.json
      - .github/workflows/build-exam-schedule.yml
permissions:
  contents: write
concurrency:
  group: exam-schedule-25-builder
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feat/exam-schedule-25'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify feature-only workspace and exact branch lease
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(git rev-parse --show-toplevel)"
          test "$repo_root" = "$GITHUB_WORKSPACE"
          test "$repo_root" != /Users/wangtingwei
          test "$GITHUB_REF_NAME" = feat/exam-schedule-25
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/exam-schedule-25 | cut -f1)" = "$GITHUB_SHA"
      - name: Build and validate reviewed schedule
        run: |
          python3 scripts/apply-exam-schedule.py
          python3 scripts/apply-exam-schedule.py --check
          python3 scripts/apply-learning-project.py --check
          python3 scripts/apply-textbook.py --check
          python3 scripts/apply-advanced-training.py --check
          python3 - <<'PY'
          import json,hashlib,pathlib
          expected=json.loads(pathlib.Path('scripts/build-exam-schedule.json').read_text())
          for name,sha in expected['sources'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha,name
          assert hashlib.sha256(pathlib.Path('index.html').read_bytes()).hexdigest()==expected['indexSha256'],'generated index differs from reviewed candidate'
          PY
          node scripts/test-exam-schedule.cjs
          node scripts/test-integrated-lessons.cjs
          node scripts/test-source-coverage.cjs
          node scripts/test-learning-project.cjs
          node scripts/test-study-srs.cjs
          node scripts/test-advanced-training.cjs
          node scripts/test-progress-sync.cjs
      - name: Commit reviewed generated index to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(git rev-parse --show-toplevel)"
          test "$repo_root" = "$GITHUB_WORKSPACE"
          test "$repo_root" != /Users/wangtingwei
          test "$GITHUB_REF_NAME" = feat/exam-schedule-25
          test "$(git ls-remote origin refs/heads/feat/exam-schedule-25 | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- index.html
          if git diff --cached --quiet -- index.html; then
            echo 'Reviewed index is already current.'
          else
            git commit -m 'Build reviewed exam schedule'
            test "$(git ls-remote origin refs/heads/feat/exam-schedule-25 | cut -f1)" = "$GITHUB_SHA"
            git push origin HEAD:feat/exam-schedule-25
          fi
