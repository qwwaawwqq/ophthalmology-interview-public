name: Test learning project without repository writes
on:
  pull_request:
    paths:
      - index.html
      - manifest.webmanifest
      - assets/icons/**
      - content/exam-schedule.json
      - scripts/**
      - .github/workflows/*learning-project.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate hooks and run behavior checks
        run: |
          python3 scripts/apply-enrichment.py --check
          python3 scripts/apply-textbook.py --check
          python3 scripts/apply-learning-project.py --check
          python3 scripts/apply-exam-schedule.py --check
          python3 scripts/apply-app-install.py --check
          node scripts/test-app-install.cjs
          node scripts/test-exam-schedule.cjs
          node scripts/test-integrated-lessons.cjs
          node scripts/test-source-coverage.cjs
          node scripts/test-practice-sections.cjs
          node scripts/test-progress-sync.cjs
          node scripts/test-textbook-depth.cjs
          node scripts/test-study-srs.cjs
          node scripts/test-learning-project.cjs
