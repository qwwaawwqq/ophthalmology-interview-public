<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ent02-title ent02-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="ent02-title">中耳鬆弛部膽脂瘤侵蝕路徑與 Wullstein 鼓室成形術第 I–V 型傳音重建圖譜</title>
  <desc id="ent02-desc">雙聯式中耳外科解剖圖，左側為冠狀面中耳腔顯示鬆弛部膽脂瘤侵蝕盾板與砧骨長突及鄰近面神經與水平半規管，右側為 Wullstein 第 I 至 V 型鼓室成形術結構比較。</desc>

  <!-- Background -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="28" y="28" width="904" height="46" rx="10" fill="#0f766e"/>
  <text x="480" y="49" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">中耳鬆弛部膽脂瘤侵蝕路徑與 Wullstein 鼓室成形術第 I–V 型傳音重建</text>
  <text x="480" y="66" text-anchor="middle" fill="#ccfbf1" font-size="11.5">上鼓室 Prussak 間隙負壓內陷袋骨破壞警訊 · PORP／TORP 聽小骨鏈介面重建與完壁／開放式乳突手術</text>

  <!-- ==================== LEFT PANEL: CHOLESTEATOMA ANATOMY ==================== -->
  <rect x="28" y="84" width="442" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="84" width="442" height="32" rx="10" fill="#fee2e2"/>
  <text x="249" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">① 冠狀面原發後天膽脂瘤（珍珠瘤）與四大併發症路徑</text>

  <!-- Coronal Middle Ear Schematic Box: x=42..456, y=126..396 -->
  <rect x="42" y="126" width="414" height="270" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Tegmen tympani (Roof separating middle cranial fossa) -->
  <path d="M 150 156 L 420 156" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <text x="275" y="145" text-anchor="middle" fill="#1e293b" font-size="10.5" font-weight="700">顱中窩（硬腦膜／顳葉）</text>
  <text x="205" y="172" text-anchor="middle" fill="#475569" font-size="9.5">鼓室蓋（Tegmen tympani）</text>

  <!-- Superior EAC bony wall & Scutum (eroded/blunted) -->
  <path d="M 56 226 L 178 226 L 194 205" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <!-- Inferior EAC wall -->
  <path d="M 56 318 L 196 318" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text x="108" y="276" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">外耳道（EAC）</text>

  <!-- Scutum blunting highlight -->
  <circle cx="192" cy="212" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="126" y="204" text-anchor="middle" fill="#b45309" font-size="10" font-weight="700">盾板（Scutum）侵蝕鈍化</text>
  <line x1="172" y1="204" x2="184" y2="210" stroke="#b45309" stroke-width="1.2"/>

  <!-- Pars tensa (intact below) -->
  <path d="M 196 250 L 196 318" stroke="#0f766e" stroke-width="3.2"/>
  <text x="160" y="308" text-anchor="end" fill="#0f766e" font-size="9.5" font-weight="600">鼓膜緊張部</text>

  <!-- Pars flaccida retraction pocket -> Cholesteatoma sac in Prussak space / Epitympanum -->
  <path d="M 192 214 C 212 182, 278 174, 304 206 C 322 228, 296 258, 254 256 C 224 255, 206 248, 196 250" fill="#ffe4e6" stroke="#be123c" stroke-width="2.4"/>
  <!-- Concentric keratin lamellae inside cholesteatoma -->
  <ellipse cx="256" cy="216" rx="34" ry="20" fill="none" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="4,2"/>
  <ellipse cx="258" cy="216" rx="18" ry="10" fill="#fecdd3" stroke="#be123c" stroke-width="1.2"/>
  <text x="258" y="219" text-anchor="middle" fill="#881337" font-size="10" font-weight="700">角質膽脂瘤</text>
  <text x="258" y="247" text-anchor="middle" fill="#be123c" font-size="9.5" font-weight="600">鬆弛部內陷袋（Prussak 間隙）</text>

  <!-- Ossicles: Malleus, Incus (eroded long process), Stapes -->
  <path d="M 218 202 L 200 278" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="222" cy="198" r="8" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <!-- Incus body + eroded long process -->
  <path d="M 236 198 L 266 242" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M 266 242 L 284 268" stroke="#be123c" stroke-width="2.5" stroke-dasharray="3,3"/>
  <text x="266" y="286" text-anchor="middle" fill="#be123c" font-size="9.5" font-weight="700">砧骨長突最易侵蝕斷離</text>

  <!-- Stapes on Oval Window & Inner Ear Medial Wall -->
  <path d="M 286 268 L 320 260 M 286 268 L 320 276 M 320 256 L 320 280" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Medial wall: LSCC, CN VII, Promontory, Round window -->
  <path d="M 356 196 C 326 196, 326 226, 356 226" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="398" y="214" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="700">水平半規管（LSCC）</text>

  <!-- Facial nerve tympanic segment -->
  <circle cx="332" cy="242" r="7" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
  <text x="394" y="245" text-anchor="middle" fill="#b45309" font-size="10" font-weight="700">CN VII 鼓室段骨管</text>

  <!-- Cochlear promontory & Eustachian tube -->
  <path d="M 320 280 Q 345 312 320 342 L 260 378" fill="none" stroke="#64748b" stroke-width="4"/>
  <text x="382" y="316" text-anchor="middle" fill="#334155" font-size="10">耳蝸岬與圓窗龕</text>
  <!-- Eustachian tube negative pressure arrow -->
  <path d="M 244 378 L 210 348" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <polygon points="248,381 238,379 243,372" fill="#6d28d9"/>
  <text x="172" y="362" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="700">耳咽管慢性負壓吸引</text>

  <!-- Erosion / Complication Red Arrows -->
  <line x1="272" y1="184" x2="272" y2="162" stroke="#be123c" stroke-width="2"/>
  <polygon points="272,158 268,165 276,165" fill="#be123c"/>
  <line x1="306" y1="210" x2="328" y2="210" stroke="#be123c" stroke-width="2"/>
  <polygon points="332,210 325,206 325,214" fill="#be123c"/>
  <line x1="304" y1="230" x2="322" y2="239" stroke="#be123c" stroke-width="2"/>
  <polygon points="325,241 317,241 320,234" fill="#be123c"/>

  <!-- Left Panel Summary Box -->
  <rect x="42" y="404" width="414" height="114" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="423" fill="#be123c" font-size="10.5" font-weight="700">· 骨侵蝕四大危險併發症（須急做高解析度顳骨 CT／MRI 並手術清創）：</text>
  <text x="58" y="441" fill="#0f172a" font-size="10.5">1. 向外後侵蝕盾板（Scutum）與砧骨長突 → 進行性傳導性／混合性聽損</text>
  <text x="58" y="459" fill="#0f172a" font-size="10.5">2. 向內侵蝕水平半規管 → 迷路瘻管（耳道加壓誘發眩暈眼震 Fistula sign+）</text>
  <text x="58" y="477" fill="#0f172a" font-size="10.5">3. 侵犯顏面神經骨管 → 周邊型面癱（須緊急乳突手術減壓，非單純觀察）</text>
  <text x="58" y="495" fill="#0f172a" font-size="10.5">4. 向上穿破鼓室蓋／向後波及乙狀竇 → 硬膜外／顳葉膿瘍、弛張熱血栓靜脈炎</text>
  <text x="52" y="512" fill="#0f766e" font-size="10" font-weight="600">· 先天性膽脂瘤：完整鼓膜前上象限後方白色球狀腫塊，無中耳炎或穿孔病史</text>

  <!-- ==================== RIGHT PANEL: WULLSTEIN I-V ==================== -->
  <rect x="484" y="84" width="448" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="484" y="84" width="448" height="32" rx="10" fill="#e0f2fe"/>
  <text x="708" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">② Wullstein 鼓室成形術第 I–V 型與聽小骨重建</text>

  <!-- Row 1: Type I -->
  <rect x="498" y="126" width="420" height="58" rx="7" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
  <rect x="498" y="126" width="76" height="58" rx="7" fill="#0f766e"/>
  <text x="536" y="151" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 I 型</text>
  <text x="536" y="169" text-anchor="middle" fill="#ccfbf1" font-size="9.5">鼓膜成形術</text>
  <!-- Mini schematic I -->
  <line x1="590" y1="134" x2="590" y2="176" stroke="#0f766e" stroke-width="3.5"/>
  <polyline points="590,150 612,140 632,155 652,155" fill="none" stroke="#334155" stroke-width="2.5"/>
  <line x1="652" y1="146" x2="652" y2="164" stroke="#1d4ed8" stroke-width="3"/>
  <text x="670" y="148" fill="#0f172a" font-size="11" font-weight="700">錘 · 砧 · 鐙三骨完整且可動（Myringoplasty）</text>
  <text x="670" y="168" fill="#475569" font-size="10.2">取自體顳肌筋膜或耳珠軟骨膜修補穿孔，完全恢復面積比增益</text>

  <!-- Row 2: Type II -->
  <rect x="498" y="192" width="420" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="498" y="192" width="76" height="58" rx="7" fill="#334155"/>
  <text x="536" y="217" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 II 型</text>
  <text x="536" y="235" text-anchor="middle" fill="#e2e8f0" font-size="9.5">搭接砧骨</text>
  <line x1="604" y1="200" x2="604" y2="242" stroke="#0f766e" stroke-width="3.5"/>
  <polyline points="604,214 630,221 652,221" fill="none" stroke="#334155" stroke-width="2.5"/>
  <line x1="652" y1="212" x2="652" y2="230" stroke="#1d4ed8" stroke-width="3"/>
  <text x="670" y="214" fill="#0f172a" font-size="11" font-weight="700">錘骨柄缺損 · 砧骨與鐙骨完整</text>
  <text x="670" y="234" fill="#475569" font-size="10.2">新鼓膜移植物直接貼附於砧骨長突或殘餘錘骨以維持槓桿傳導</text>

  <!-- Row 3: Type III -->
  <rect x="498" y="258" width="420" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <rect x="498" y="258" width="76" height="62" rx="7" fill="#1d4ed8"/>
  <text x="536" y="284" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 III 型</text>
  <text x="536" y="302" text-anchor="middle" fill="#dbeafe" font-size="9.5">PORP／小柱</text>
  <line x1="604" y1="266" x2="604" y2="312" stroke="#0f766e" stroke-width="3.5"/>
  <rect x="606" y="284" width="26" height="10" rx="2" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M 632 289 L 652 282 M 632 289 L 652 296 M 652 279 L 652 299" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="670" y="280" fill="#1e3a8a" font-size="11" font-weight="700">錘砧缺損 · 鐙骨上部結構完整（臨床極常考！）</text>
  <text x="670" y="298" fill="#1e293b" font-size="10.2">新鼓膜或部分聽小骨贗復物（PORP）直連鐙骨頭（Columella 效應）</text>
  <text x="670" y="313" fill="#475569" font-size="9.6">常於表面加墊耳珠軟骨片防止人工聽小骨穿出移植物</text>

  <!-- Row 4: Type IV -->
  <rect x="498" y="328" width="420" height="62" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <rect x="498" y="328" width="76" height="62" rx="7" fill="#b45309"/>
  <text x="536" y="354" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 IV 型</text>
  <text x="536" y="372" text-anchor="middle" fill="#fef3c7" font-size="9.5">TORP／足板</text>
  <line x1="604" y1="336" x2="604" y2="382" stroke="#0f766e" stroke-width="3.5"/>
  <rect x="606" y="352" width="44" height="8" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <line x1="652" y1="346" x2="652" y2="366" stroke="#1d4ed8" stroke-width="3"/>
  <text x="670" y="350" fill="#78350f" font-size="11" font-weight="700">鐙骨上部缺損 · 僅剩「可活動」之鐙骨足板</text>
  <text x="670" y="368" fill="#1e293b" font-size="10.2">聲波直入卵圓窗或以全聽小骨贗復物（TORP）連結新鼓膜至足板</text>
  <text x="670" y="383" fill="#475569" font-size="9.6">必須維持耳咽管至圓窗小鼓室氣腔（Cavum minor）確保雙窗相位差</text>

  <!-- Row 5: Type V -->
  <rect x="498" y="398" width="420" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="498" y="398" width="76" height="54" rx="7" fill="#be123c"/>
  <text x="536" y="422" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 V 型</text>
  <text x="536" y="439" text-anchor="middle" fill="#ffe4e6" font-size="9.5">開窗手術</text>
  <path d="M 608 416 C 646 410, 646 440, 608 434" fill="none" stroke="#be123c" stroke-width="2.5"/>
  <circle cx="636" cy="425" r="5" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <text x="670" y="419" fill="#881337" font-size="11" font-weight="700">鐙骨足板固著不動（如耳硬化症／重度鼓室硬化）</text>
  <text x="670" y="438" fill="#475569" font-size="10.2">傳統行水平半規管開窗（Va）或現代鐙骨足板開窗置放活塞（Vb）</text>

  <!-- Bottom Surgical Safety Bar -->
  <rect x="498" y="460" width="420" height="58" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="508" y="479" fill="#0f172a" font-size="10.5" font-weight="700">· 乳突切除術抉擇：CWU（保留後耳道壁、防水佳但膽脂瘤復發率較高）vs</text>
  <text x="516" y="495" fill="#0f172a" font-size="10.5">CWD（移除後壁形成開放乳突腔、根除率高，但灌冷水易致溫差眩暈）</text>
  <text x="508" y="511" fill="#be123c" font-size="10.2" font-weight="700">· 鼓膜穿孔耳漏僅能點 Fluoroquinolone 耳滴劑，嚴禁耳毒性 Aminoglycoside！</text>
</svg>
