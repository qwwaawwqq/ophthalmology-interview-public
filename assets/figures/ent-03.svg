<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ent03-title ent03-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="ent03-title">耳神經學眩暈精準分流：半規管耳石復位力學（Dix-Hallpike／Supine Roll）與 HINTS 中樞鑑別</title>
  <desc id="ent03-desc">耳神經學雙聯臨床示意圖，左側顯示三半規管解剖與後半規管及水平半規管耳石誘發眼振方向，右側顯示 HINTS Plus 四項指標在周邊前庭神經炎與後循環腦幹小腦中風之對比。</desc>

  <!-- Background -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="28" y="28" width="904" height="46" rx="10" fill="#0f766e"/>
  <text x="480" y="49" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">耳神經學眩暈精準分流：半規管耳石復位力學與 HINTS Plus 後循環中風鑑別</text>
  <text x="480" y="66" text-anchor="middle" fill="#ccfbf1" font-size="11.5">發作持續時間分流（秒／分時／數日）· Dix-Hallpike 與 Supine Roll 誘發眼震 · AVS 床邊四紅旗決策</text>

  <!-- ==================== LEFT PANEL: BPPV & LABYRINTH ==================== -->
  <rect x="28" y="84" width="442" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="84" width="442" height="32" rx="10" fill="#e0f2fe"/>
  <text x="249" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">① 三半規管耳石脫落（BPPV）誘發眼震與復位力學</text>

  <!-- Membranous Labyrinth Schematic: x=42..234, y=126..336 -->
  <rect x="42" y="126" width="192" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="138" y="145" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">內耳膜性迷路與游離耳石</text>

  <!-- Superior canal -->
  <path d="M 118 228 C 98 158, 168 152, 162 222" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <path d="M 118 228 C 98 158, 168 152, 162 222" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <text x="140" y="164" text-anchor="middle" fill="#475569" font-size="9.5">前半規管</text>

  <!-- Lateral (Horizontal) canal (tilted 30 deg) -->
  <path d="M 122 238 C 188 214, 218 252, 148 262" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round"/>
  <path d="M 122 238 C 188 214, 218 252, 148 262" fill="none" stroke="#dbeafe" stroke-width="3"/>
  <text x="192" y="226" text-anchor="middle" fill="#1d4ed8" font-size="9.5" font-weight="700">水平半規管</text>

  <!-- Posterior canal (85-90% BPPV, highlighted crimson/amber) -->
  <path d="M 116 244 C 54 218, 56 308, 130 278" fill="none" stroke="#be123c" stroke-width="8" stroke-linecap="round"/>
  <path d="M 116 244 C 54 218, 56 308, 130 278" fill="none" stroke="#ffe4e6" stroke-width="3.5"/>
  <!-- Otoconia particles inside posterior canal -->
  <circle cx="76" cy="276" r="3" fill="#be123c"/>
  <circle cx="84" cy="282" r="2.8" fill="#be123c"/>
  <circle cx="92" cy="285" r="2.6" fill="#be123c"/>
  <text x="97" y="308" text-anchor="middle" fill="#be123c" font-size="10" font-weight="700">後半規管（85–90%）</text>

  <!-- Utricle & Cochlea -->
  <ellipse cx="136" cy="248" rx="22" ry="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="136" y="252" text-anchor="middle" fill="#0f766e" font-size="9.5" font-weight="700">橢圓囊</text>
  <path d="M 156 264 C 194 274, 206 314, 174 322 C 154 326, 152 298, 172 296" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text x="196" y="325" text-anchor="middle" fill="#0f766e" font-size="9.5">耳蝸</text>

  <!-- BPPV Subtype Cards on right half of Panel 1: x=242..456 -->
  <rect x="242" y="126" width="214" height="102" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
  <text x="250" y="145" fill="#9f1239" font-size="10.5" font-weight="700">後半規管 BPPV（最常見）</text>
  <text x="248" y="163" fill="#0f172a" font-size="9.5">· 誘發：Dix-Hallpike（轉45°仰20°）</text>
  <text x="250" y="180" fill="#0f172a" font-size="9.6">· 眼震：潛伏 2–10s、向上＋扭轉向地性</text>
  <text x="250" y="197" fill="#0f172a" font-size="9.6">· 持續 &lt;1 分鐘、反覆測試具疲勞性</text>
  <text x="250" y="216" fill="#be123c" font-size="10" font-weight="700">→ 治療首選：Epley 耳石復位術</text>

  <rect x="242" y="234" width="214" height="102" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="250" y="253" fill="#1e3a8a" font-size="10.5" font-weight="700">水平半規管 BPPV（次常見）</text>
  <text x="250" y="271" fill="#0f172a" font-size="9.6">· 誘發：仰臥轉頭試驗（Supine Roll）</text>
  <text x="248" y="288" fill="#0f172a" font-size="9.5">· 管耳石：水平「向地」眼震（強側患耳）</text>
  <text x="248" y="305" fill="#0f172a" font-size="9.5">· 嵴頂石：水平「背地」眼震（弱側患耳）</text>
  <text x="250" y="324" fill="#1d4ed8" font-size="9.6" font-weight="700">→ 治療：Lempert（BBQ 翻滾）／Gufoni</text>

  <!-- Duration Triage Timeline Bar: y=346..518 -->
  <rect x="42" y="346" width="414" height="172" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="366" fill="#0f172a" font-size="11.5" font-weight="700">眩暈「單次持續時間 × 伴隨聽損」臨床三分流：</text>

  <rect x="54" y="376" width="126" height="84" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="117" y="395" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="700">數秒 ～ &lt;1 分鐘</text>
  <text x="117" y="414" text-anchor="middle" fill="#0f172a" font-size="10.5" font-weight="600">BPPV · SSCD</text>
  <text x="117" y="432" text-anchor="middle" fill="#475569" font-size="9.5">頭位變化或強聲誘發</text>
  <text x="117" y="449" text-anchor="middle" fill="#0f766e" font-size="9.5">BPPV 無聽力損失</text>

  <rect x="186" y="376" width="126" height="84" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="249" y="395" text-anchor="middle" fill="#b45309" font-size="11" font-weight="700">20 分鐘 ～ 12 小時</text>
  <text x="249" y="414" text-anchor="middle" fill="#0f172a" font-size="10.5" font-weight="600">梅尼爾氏症</text>
  <text x="249" y="432" text-anchor="middle" fill="#475569" font-size="9.5">內淋巴水腫反覆發作</text>
  <text x="249" y="449" text-anchor="middle" fill="#b45309" font-size="9.5">單側低頻波動感音聽損</text>

  <rect x="318" y="376" width="126" height="84" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="381" y="395" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="700">持續數日（AVS）</text>
  <text x="381" y="414" text-anchor="middle" fill="#0f172a" font-size="10.5" font-weight="600">前庭神經炎／中風</text>
  <text x="381" y="432" text-anchor="middle" fill="#475569" font-size="9.5">前庭炎無聽損；迷路炎</text>
  <text x="381" y="449" text-anchor="middle" fill="#be123c" font-size="9.5">或 AICA 中風伴聽損</text>

  <text x="54" y="480" fill="#334155" font-size="9.8">· Ewald 定律：水平半規管「向壺腹」興奮；前、後半規管「背離壺腹」興奮</text>
  <text x="54" y="497" fill="#334155" font-size="9.8">· 雙溫試驗（仰臥抬頭 30° 測水平半規管）：快相遵循 COWS（冷對側、溫同側）</text>
  <text x="54" y="512" fill="#be123c" font-size="9.8" font-weight="600">· 無潛伏期、純垂直向下且無疲勞之姿勢眼震 → 立即排腦部 MRI 排除小腦病灶</text>

  <!-- ==================== RIGHT PANEL: HINTS PLUS ==================== -->
  <rect x="484" y="84" width="448" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="484" y="84" width="448" height="32" rx="10" fill="#fef3c7"/>
  <text x="708" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">② 急性持續性眩暈（AVS）床邊 HINTS Plus 決策矩陣</text>

  <!-- Column Headers -->
  <rect x="498" y="126" width="110" height="30" rx="5" fill="#334155"/>
  <text x="553" y="145" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">檢查項目</text>
  <rect x="614" y="126" width="148" height="30" rx="5" fill="#0f766e"/>
  <text x="688" y="145" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700">周邊前庭神經炎（安心）</text>
  <rect x="768" y="126" width="150" height="30" rx="5" fill="#be123c"/>
  <text x="843" y="145" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700">腦幹／小腦中風（紅旗）</text>

  <!-- Row 1: Head Impulse -->
  <rect x="498" y="164" width="110" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="553" y="192" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Head Impulse</text>
  <text x="553" y="211" text-anchor="middle" fill="#475569" font-size="10">快速甩頭試驗</text>

  <rect x="614" y="164" width="148" height="68" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="688" y="187" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="700">單側異常（陽性）</text>
  <text x="688" y="205" text-anchor="middle" fill="#0f172a" font-size="10">甩向患側時 VOR 失效</text>
  <text x="688" y="221" text-anchor="middle" fill="#0f172a" font-size="10">出現明顯矯正性跳視</text>

  <rect x="768" y="164" width="150" height="68" rx="6" fill="#fff1f2" stroke="#be123c"/>
  <text x="843" y="187" text-anchor="middle" fill="#be123c" font-size="11" font-weight="700">雙側正常（陰性！）</text>
  <text x="843" y="205" text-anchor="middle" fill="#0f172a" font-size="10">VOR 反射弧未受損</text>
  <text x="843" y="221" text-anchor="middle" fill="#881337" font-size="9.5">（AICA 梗塞可呈異常）</text>

  <!-- Row 2: Nystagmus -->
  <rect x="498" y="240" width="110" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="553" y="268" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Nystagmus</text>
  <text x="553" y="287" text-anchor="middle" fill="#475569" font-size="10">凝視誘發眼震</text>

  <rect x="614" y="240" width="148" height="68" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="688" y="263" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="700">單向水平扭轉眼震</text>
  <text x="688" y="281" text-anchor="middle" fill="#0f172a" font-size="9.5">快相恆朝健側（Alexander）</text>
  <text x="688" y="297" text-anchor="middle" fill="#0f172a" font-size="10">視覺固視可明顯抑制</text>

  <!-- Row 2 Right -->
  <rect x="768" y="240" width="150" height="68" rx="6" fill="#fff1f2" stroke="#be123c"/>
  <text x="843" y="263" text-anchor="middle" fill="#be123c" font-size="10.5" font-weight="700">方向改變／純垂直扭轉</text>
  <text x="843" y="281" text-anchor="middle" fill="#0f172a" font-size="10">左看快相左、右看快相右</text>
  <text x="843" y="297" text-anchor="middle" fill="#0f172a" font-size="10">固視無法抑制眼震</text>

  <!-- Row 3: Test of Skew -->
  <rect x="498" y="316" width="110" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="553" y="343" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Test of Skew</text>
  <text x="553" y="362" text-anchor="middle" fill="#475569" font-size="10">交替遮蓋試驗</text>

  <rect x="614" y="316" width="148" height="62" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="688" y="343" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="700">無垂直斜視（陰性）</text>
  <text x="688" y="362" text-anchor="middle" fill="#0f172a" font-size="10">雙眼垂直軸線穩定</text>

  <rect x="768" y="316" width="150" height="62" rx="6" fill="#fff1f2" stroke="#be123c"/>
  <text x="843" y="343" text-anchor="middle" fill="#be123c" font-size="11" font-weight="700">垂直斜視矯正（陽性）</text>
  <text x="843" y="362" text-anchor="middle" fill="#0f172a" font-size="10">腦幹耳石重力通路受損</text>

  <!-- Row 4: Plus (New Hearing Loss) -->
  <rect x="498" y="386" width="110" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="553" y="413" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">HINTS Plus</text>
  <text x="553" y="432" text-anchor="middle" fill="#475569" font-size="10">指擦音／音叉聽力</text>

  <rect x="614" y="386" width="148" height="64" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="688" y="413" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="700">聽力完全正常</text>
  <text x="688" y="432" text-anchor="middle" fill="#0f172a" font-size="10">單純上前庭神經受累</text>

  <rect x="768" y="386" width="150" height="64" rx="6" fill="#fff1f2" stroke="#be123c"/>
  <text x="843" y="411" text-anchor="middle" fill="#be123c" font-size="11" font-weight="700">合併新發單側聽損！</text>
  <text x="843" y="431" text-anchor="middle" fill="#881337" font-size="9.8">警覺 AICA 迷路動脈梗塞</text>

  <!-- Bottom Clinical Red Line Box -->
  <rect x="498" y="458" width="420" height="60" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="506" y="477" fill="#92400e" font-size="9.6" font-weight="700">· 決策鐵律：四項只要出現「任一紅旗（INFARCT＋聽損）」即視同中樞中風！</text>
  <text x="506" y="494" fill="#0f172a" font-size="9.6">· 發病 24–48h 內 HINTS Plus 敏感度高於早期腦部 DWI MRI（偽陰性 12–20%）</text>
  <text x="506" y="511" fill="#0f172a" font-size="9.6">· 突發性耳聾（3天·3頻率·≥30 dB）黃金 2 週類固醇，必排內聽道顯影 MRI</text>
</svg>
