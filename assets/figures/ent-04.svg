<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ent04-title ent04-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="ent04-title">冠狀面竇口鼻道複合體（OMC）鼻竇引流解剖與 Chandler 眼眶併發症五期分級圖譜</title>
  <desc id="ent04-desc">鼻科學冠狀面解剖與併發症分期圖，左側顯示中鼻道竇口鼻道複合體引流路徑與高危氣房位置，右側顯示 Chandler 第 I 期隔前蜂窩組織炎至第 V 期海綿竇血栓之解剖進展。</desc>

  <!-- Background -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="28" y="28" width="904" height="46" rx="10" fill="#0f766e"/>
  <text x="480" y="49" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">冠狀面竇口鼻道複合體（OMC）引流解剖與鼻竇炎 Chandler 眼眶併發症五期</text>
  <text x="480" y="66" text-anchor="middle" fill="#ccfbf1" font-size="11.5">中鼻道前群鼻竇匯流樞紐 · Keros 篩頂／紙樣板／Haller 氣房安全界線 · 眼眶至海綿竇急診減壓指徵</text>

  <!-- ==================== LEFT PANEL: CORONAL OMC ==================== -->
  <rect x="28" y="84" width="442" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="84" width="442" height="32" rx="10" fill="#ccfbf1"/>
  <text x="249" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">① 冠狀面鼻腔側壁與竇口鼻道複合體（OMC）</text>

  <!-- Coronal CT-like Schematic: x=42..456, y=126..396 -->
  <rect x="42" y="126" width="414" height="270" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Cribriform plate & Fovea ethmoidalis (Keros) -->
  <path d="M 56 164 L 146 164 L 154 182 L 182 182 L 190 164 L 250 164" fill="none" stroke="#be123c" stroke-width="3.2"/>
  <text x="168" y="148" text-anchor="middle" fill="#be123c" font-size="10" font-weight="700">篩板與 Keros 嗅溝側板</text>
  <text x="168" y="160" text-anchor="middle" fill="#be123c" font-size="9">（Keros III 最薄易 CSF 鼻漏）</text>

  <!-- Nasal Septum (Midline at x=168) -->
  <line x1="168" y1="182" x2="168" y2="372" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="372" x2="360" y2="372" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <text x="148" y="362" text-anchor="end" fill="#334155" font-size="10" font-weight="700">鼻中膈</text>

  <!-- Orbit (Right side of diagram = patient's left side) -->
  <ellipse cx="368" cy="212" rx="68" ry="48" fill="#fef9c3" stroke="#b45309" stroke-width="2.2"/>
  <circle cx="372" cy="212" r="22" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
  <text x="372" y="216" text-anchor="middle" fill="#78350f" font-size="11" font-weight="700">眼眶</text>
  <!-- Lamina papyracea highlight -->
  <path d="M 300 176 Q 294 212 304 248" fill="none" stroke="#be123c" stroke-width="3.5"/>
  <text x="348" y="156" text-anchor="middle" fill="#be123c" font-size="10" font-weight="700">紙樣板（極薄骨壁）</text>

  <!-- Ethmoid bulla & Anterior ethmoid cells -->
  <rect x="242" y="172" width="52" height="58" rx="12" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="268" y="198" text-anchor="middle" fill="#1e3a8a" font-size="10" font-weight="700">篩泡</text>
  <text x="268" y="213" text-anchor="middle" fill="#1e3a8a" font-size="9">前篩竇</text>

  <!-- Haller cell (Infraorbital ethmoid cell) -->
  <ellipse cx="308" cy="256" rx="18" ry="11" fill="#ffedd5" stroke="#b45309" stroke-width="1.8"/>
  <text x="358" y="274" text-anchor="middle" fill="#b45309" font-size="9.5" font-weight="700">Haller 眶下氣房</text>
  <line x1="324" y1="260" x2="340" y2="268" stroke="#b45309" stroke-width="1.2"/>

  <!-- Maxillary Sinus -->
  <path d="M 272 268 L 418 268 L 404 364 L 266 364 L 266 286" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.2"/>
  <text x="342" y="318" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">上頷竇</text>
  <text x="342" y="335" text-anchor="middle" fill="#0f766e" font-size="9.5">自然開口高居內上壁</text>
  <text x="342" y="352" text-anchor="middle" fill="#475569" font-size="9.5">底部鄰上顎臼齒根尖</text>

  <!-- Uncinate process (sickle-shaped) & OMC circle -->
  <path d="M 266 286 L 248 248" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="244" cy="242" r="28" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="242" y="280" text-anchor="end" fill="#0f766e" font-size="10" font-weight="700">鉤狀突與 OMC</text>

  <!-- Mucociliary drainage arrows into Middle Meatus -->
  <path d="M 304 304 Q 282 264 252 246" fill="none" stroke="#0f766e" stroke-width="2"/>
  <polygon points="248,244 257,244 253,251" fill="#0f766e"/>
  <path d="M 224 166 L 232 228" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="3,2"/>
  <text x="218" y="160" text-anchor="end" fill="#1d4ed8" font-size="9.5" font-weight="700">額竇引流 ↓</text>

  <!-- Middle Turbinate & Inferior Turbinate -->
  <path d="M 242 174 Q 204 205 208 262 Q 218 266 222 246" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="198" y="226" text-anchor="end" fill="#0f172a" font-size="10" font-weight="700">中鼻甲</text>
  <text x="205" y="256" text-anchor="end" fill="#1d4ed8" font-size="9.5" font-weight="700">中鼻道</text>

  <path d="M 266 314 Q 206 318 206 350 Q 222 356 238 336" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="200" y="326" text-anchor="end" fill="#0f172a" font-size="10" font-weight="700">下鼻甲</text>
  <text x="234" y="365" text-anchor="middle" fill="#6d28d9" font-size="9.5" font-weight="700">下鼻道（鼻淚管開口）</text>

  <!-- Left Panel Summary Box -->
  <rect x="42" y="404" width="414" height="114" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="423" fill="#0f766e" font-size="10.5" font-weight="700">· 各鼻道引流鐵律（FESS 手術導航核心）：</text>
  <text x="58" y="441" fill="#0f172a" font-size="10.5">1. 下鼻道：鼻淚管（Hasner 瓣） ｜ 中鼻道（OMC）：額竇、前篩竇、上頷竇</text>
  <text x="58" y="459" fill="#0f172a" font-size="10.5">2. 上鼻道：後篩竇（中鼻甲基板後方） ｜ 蝶篩隱窩：蝶竇開口</text>
  <text x="52" y="478" fill="#be123c" font-size="10.5" font-weight="700">· Onodi 蝶篩氣房：後篩竇向後上包覆蝶竇，視神經與內頸動脈緊貼氣房壁</text>
  <text x="52" y="496" fill="#0f172a" font-size="10.2">· 鼻出血：90% 前鼻 Kiesselbach 叢；後鼻蝶腭動脈（SPA）內視鏡結紮止血</text>
  <text x="52" y="512" fill="#334155" font-size="10">· 內鼻閥（鼻中膈 · 上外側軟骨 · 下鼻甲前端 · 鼻底）占總氣道阻力約 50%</text>

  <!-- ==================== RIGHT PANEL: CHANDLER I-V ==================== -->
  <rect x="484" y="84" width="448" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="484" y="84" width="448" height="32" rx="10" fill="#fee2e2"/>
  <text x="708" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">② 急性鼻竇炎眼眶併發症 Chandler 第 I–V 期階梯</text>

  <!-- Stage I -->
  <rect x="498" y="126" width="420" height="58" rx="7" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
  <rect x="498" y="126" width="84" height="58" rx="7" fill="#0f766e"/>
  <text x="540" y="151" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 I 期</text>
  <text x="540" y="168" text-anchor="middle" fill="#ccfbf1" font-size="9.5">眶隔前</text>
  <text x="594" y="147" fill="#0f172a" font-size="11" font-weight="700">隔前蜂窩組織炎（Preseptal cellulitis）</text>
  <text x="594" y="166" fill="#475569" font-size="10">感染侷限眶隔前方眼瞼紅腫；無凸眼、眼球轉動與視力完全正常 → 抗生素治療</text>

  <!-- Stage II -->
  <rect x="498" y="192" width="420" height="58" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <rect x="498" y="192" width="84" height="58" rx="7" fill="#1d4ed8"/>
  <text x="540" y="217" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 II 期</text>
  <text x="540" y="234" text-anchor="middle" fill="#dbeafe" font-size="9.5">眶隔後瀰漫</text>
  <text x="594" y="213" fill="#1e3a8a" font-size="11" font-weight="700">眼眶蜂窩組織炎（Orbital cellulitis）</text>
  <text x="594" y="232" fill="#334155" font-size="10">突破眶隔致瀰漫水腫：出現凸眼、結膜水腫、眼球轉動疼痛受限 → 住院靜脈抗生素</text>

  <!-- Stage III -->
  <rect x="498" y="258" width="420" height="62" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <rect x="498" y="258" width="84" height="62" rx="7" fill="#b45309"/>
  <text x="540" y="284" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 III 期</text>
  <text x="540" y="302" text-anchor="middle" fill="#fef3c7" font-size="9.5">骨膜下積膿</text>
  <text x="594" y="279" fill="#78350f" font-size="11" font-weight="700">骨膜下膿瘍（Subperiosteal abscess）</text>
  <text x="594" y="297" fill="#1e293b" font-size="10">膿液積聚於紙樣板與眼眶骨膜間，將眼球向外下方推擠移位</text>
  <text x="594" y="313" fill="#b45309" font-size="9.8" font-weight="700">→ 大膿瘍、視力下降或靜脈抗生素 24–48h 未改善：內視鏡經篩竇減壓引流</text>

  <!-- Stage IV -->
  <rect x="498" y="328" width="420" height="62" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <rect x="498" y="328" width="84" height="62" rx="7" fill="#e11d48"/>
  <text x="540" y="354" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 IV 期</text>
  <text x="540" y="372" text-anchor="middle" fill="#ffe4e6" font-size="9.5">眶內實質膿瘍</text>
  <text x="594" y="349" fill="#881337" font-size="11" font-weight="700">眶內膿瘍（Intraorbital abscess）</text>
  <text x="594" y="367" fill="#1e293b" font-size="10">重度凸眼、全眼肌麻痺、紅綠色覺減退與相對性傳入瞳孔障礙（Marcus Gunn pupil）</text>
  <text x="594" y="383" fill="#be123c" font-size="9.8" font-weight="700">→ 高度失明危機：緊急手術切開減壓引流＋廣效靜脈抗生素</text>

  <!-- Stage V -->
  <rect x="498" y="398" width="420" height="62" rx="7" fill="#fef2f2" stroke="#991b1b" stroke-width="1.6"/>
  <rect x="498" y="398" width="84" height="62" rx="7" fill="#881337"/>
  <text x="540" y="424" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">第 V 期</text>
  <text x="540" y="442" text-anchor="middle" fill="#fecdd3" font-size="9.5">顱內靜脈竇</text>
  <text x="594" y="419" fill="#7f1d1d" font-size="11" font-weight="700">海綿竇血栓性靜脈炎（Cavernous sinus thrombosis）</text>
  <text x="594" y="437" fill="#1e293b" font-size="10">經無瓣膜眼靜脈逆流波及對側眼！高燒頭痛、雙側凸眼與多發腦神經麻痺</text>
  <text x="594" y="453" fill="#991b1b" font-size="9.8" font-weight="700">→ 穿行竇腔內之「CN VI 外展神經」最早麻痺，繼而波及側壁 CN III·IV·V1·V2</text>

  <!-- Fungal Rhinosinusitis Pearl Bar -->
  <rect x="498" y="468" width="420" height="50" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="508" y="487" fill="#0f172a" font-size="10.2" font-weight="700">· 黴菌性鼻竇炎對照：單側上頷竇黴菌球（免疫正常、CT 鈣化亮點、內視鏡清除免抗黴菌藥）</text>
  <text x="508" y="506" fill="#be123c" font-size="10.2" font-weight="700">· 急性猛爆侵襲性黴菌鼻竇炎（免疫抑制／DKA、鼻甲黑痂壞死麻木）→ 急診清創＋Amphotericin B</text>
</svg>
