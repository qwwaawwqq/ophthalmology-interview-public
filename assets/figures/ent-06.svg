<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ent06-title ent06-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="ent06-title">口腔七大次分區、AJCC 第 8 版口腔鱗癌侵襲深度（DOI）／包膜外侵犯（ENE）與 OSA 塌陷層次</title>
  <desc id="ent06-desc">口腔與口咽臨床三聯示意圖，左側為口腔七大次分區與舌部神經分佈，中間為口腔鱗癌 DOI 基底膜深度測量與淋巴結 ENE 示意，右側為上呼吸道睡眠塌陷四個解剖層次。</desc>

  <!-- Background -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="28" y="28" width="904" height="46" rx="10" fill="#0f766e"/>
  <text x="480" y="49" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">口腔七大次分區 · AJCC 第 8 版口腔癌 DOI／ENE 分期 · OSA 睡眠內視鏡塌陷層次</text>
  <text x="480" y="66" text-anchor="middle" fill="#ccfbf1" font-size="11.5">舌部運動味覺雙重支配與紅斑惡變警訊 · 基底膜鉛垂侵襲深度（5／10 mm）與 CCRT 雙指徵 · DISE VOTE 與 p16+ 口咽癌</text>

  <!-- ==================== PANEL 1: ORAL 7 SUBSITES & TONGUE NERVES ==================== -->
  <rect x="28" y="84" width="292" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="84" width="292" height="32" rx="10" fill="#ccfbf1"/>
  <text x="174" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">① 口腔七大次分區與舌神經支配</text>

  <!-- Oral Cavity Schematic: x=42..306, y=124..324 -->
  <rect x="42" y="124" width="264" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Outer Lip & Alveolar Arch -->
  <ellipse cx="174" cy="224" rx="112" ry="86" fill="#ffe4e6" stroke="#be123c" stroke-width="2.2"/>
  <!-- Hard Palate (top half) -->
  <path d="M 88 206 C 98 148, 250 148, 260 206" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="174" y="175" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="700">⑤ 硬腭（Hard palate）</text>
  <text x="174" y="149" text-anchor="middle" fill="#9f1239" font-size="10" font-weight="700">① 唇 · ③ 上下齒齦與齒槽脊</text>

  <!-- Retromolar trigone & Buccal mucosa -->
  <circle cx="84" cy="220" r="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="84" y="224" text-anchor="middle" fill="#1e3a8a" font-size="9.5" font-weight="700">④</text>
  <text x="64" y="246" fill="#1e3a8a" font-size="9.5" font-weight="700">④ 臼齒後三角</text>
  <text x="248" y="222" fill="#9f1239" font-size="9.5" font-weight="700">② 頰黏膜</text>

  <!-- Oral Tongue (Anterior 2/3) & Floor of mouth -->
  <path d="M 118 228 C 118 296, 230 296, 230 228 Q 174 214 118 228 Z" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
  <!-- Sulcus terminalis V-shaped circumvallate papillae -->
  <polyline points="132,230 174,218 216,230" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="174" y="256" text-anchor="middle" fill="#881337" font-size="10.5" font-weight="700">⑥ 活動舌前 2/3</text>
  <text x="174" y="273" text-anchor="middle" fill="#9f1239" font-size="9.5">（外側緣最常好發舌癌）</text>
  <text x="174" y="303" text-anchor="middle" fill="#0f766e" font-size="10" font-weight="700">⑦ 口底（Floor of mouth）</text>
  <text x="174" y="206" text-anchor="middle" fill="#6d28d9" font-size="9.5" font-weight="700">界溝後方（軟腭·扁桃·舌根）屬口咽</text>

  <!-- Nerve & OPMD Summary Box -->
  <rect x="42" y="332" width="264" height="186" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="351" fill="#0f172a" font-size="10.5" font-weight="700">舌部神經支配高頻考點：</text>
  <text x="52" y="369" fill="#0f172a" font-size="9.6">· 運動：舌內外肌皆 CN XII（除顎舌肌為 CN X）</text>
  <text x="52" y="386" fill="#1d4ed8" font-size="9.8" font-weight="600">· 前 2/3 一般痛觸覺：CN V3（舌神經）</text>
  <text x="52" y="403" fill="#0f766e" font-size="9.8" font-weight="600">· 前 2/3 特殊味覺：CN VII（鼓索神經）</text>
  <text x="52" y="420" fill="#6d28d9" font-size="9.8" font-weight="600">· 輪廓乳突＋後 1/3 感覺與味覺：皆 CN IX</text>
  <line x1="52" y1="430" x2="296" y2="430" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="448" fill="#be123c" font-size="10" font-weight="700">· 惡變率最高 OPMD：口腔紅斑（50–90%）</text>
  <text x="52" y="466" fill="#0f172a" font-size="9.8">· 檳榔鹼致口腔黏膜下纖維化（張口受限不可逆）</text>
  <text x="52" y="484" fill="#0f172a" font-size="9.8">· 菸＋酒＋檳榔協同致口腔癌風險飆升 123 倍</text>
  <text x="52" y="502" fill="#b45309" font-size="9.8" font-weight="700">· 固定潰瘍 &gt;2 週未癒合 → 必須立即切片！</text>

  <!-- ==================== PANEL 2: AJCC 8TH DOI & ENE ==================== -->
  <rect x="334" y="84" width="292" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="334" y="84" width="292" height="32" rx="10" fill="#fee2e2"/>
  <text x="480" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">② AJCC 第 8 版口腔癌 DOI 與 ENE</text>

  <!-- DOI Measurement Diagram: x=348..612, y=124..310 -->
  <rect x="348" y="124" width="264" height="186" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="142" text-anchor="middle" fill="#0f172a" font-size="10.5" font-weight="700">侵襲深度（DOI）≠ 腫瘤總厚度（Thickness）</text>

  <!-- Normal Basement Membrane Horizon Line -->
  <line x1="358" y1="188" x2="602" y2="188" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="5,3"/>
  <text x="480" y="182" text-anchor="middle" fill="#0f766e" font-size="9.5" font-weight="700">鄰近正常黏膜基底膜水平連線（基準面）</text>

  <!-- Left Tumor: Exophytic (tall above, shallow DOI <= 5mm) -->
  <path d="M 366 188 L 382 188 C 382 152, 434 152, 434 188 L 444 188" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
  <path d="M 386 188 Q 408 216 430 188" fill="#fca5a5" stroke="#be123c" stroke-width="1.8"/>
  <!-- Plumb line shallow DOI -->
  <line x1="408" y1="188" x2="408" y2="203" stroke="#be123c" stroke-width="2.2"/>
  <text x="408" y="218" text-anchor="middle" fill="#0f766e" font-size="9.5" font-weight="700">外生型：DOI ≤5 mm</text>
  <text x="408" y="233" text-anchor="middle" fill="#475569" font-size="9.5">雖厚但浸潤淺（T1）</text>

  <!-- Right Tumor: Ulcerative endophytic (crater below, deep DOI > 10mm) -->
  <path d="M 486 188 L 502 188 Q 536 208 570 188 L 592 188" fill="none" stroke="#334155" stroke-width="1.8"/>
  <path d="M 502 188 C 504 260, 568 260, 570 188 Z" fill="#fecdd3" stroke="#be123c" stroke-width="2.2"/>
  <!-- Plumb line deep DOI -->
  <line x1="536" y1="188" x2="536" y2="244" stroke="#be123c" stroke-width="2.5"/>
  <polygon points="536,246 532,238 540,238" fill="#be123c"/>
  <text x="536" y="261" text-anchor="middle" fill="#be123c" font-size="9.6" font-weight="700">潰瘍內生型：DOI &gt;10 mm</text>
  <text x="536" y="276" text-anchor="middle" fill="#881337" font-size="9.5">鉛垂深浸潤（直接升 T3！）</text>

  <!-- DOI Threshold strip -->
  <rect x="352" y="284" width="256" height="20" rx="4" fill="#eff6ff"/>
  <text x="480" y="298" text-anchor="middle" fill="#1e3a8a" font-size="9.5" font-weight="700">T1 ≤5mm｜T2 &gt;5–10mm｜T3 DOI &gt;10mm</text>

  <!-- ENE Diagram & Adjuvant CCRT Box: y=318..518 -->
  <rect x="348" y="318" width="264" height="200" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
  <text x="480" y="333" text-anchor="middle" fill="#881337" font-size="9.8" font-weight="700">淋巴結包膜外侵犯（ENE）AJCC 8th 分期：</text>
  <text x="480" y="348" text-anchor="middle" fill="#be123c" font-size="9.5" font-weight="700">cENE+→cN3b；pENE+ ≤3cm單顆→pN2a／餘pN3b</text>

  <!-- Node ENE- vs ENE+ -->
  <ellipse cx="410" cy="384" rx="34" ry="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.2"/>
  <circle cx="410" cy="384" r="11" fill="#fdba74"/>
  <text x="410" y="418" text-anchor="middle" fill="#0f766e" font-size="9.5" font-weight="700">ENE 陰性（被膜完整）</text>

  <ellipse cx="536" cy="384" rx="34" ry="20" fill="#ffe4e6" stroke="#be123c" stroke-width="2.2" stroke-dasharray="5,2"/>
  <path d="M 522 378 C 534 360, 570 358, 584 380 C 588 396, 560 408, 536 396 Z" fill="#e11d48"/>
  <text x="536" y="418" text-anchor="middle" fill="#be123c" font-size="9.5" font-weight="700">ENE 陽性（破被膜入脂肪）</text>

  <rect x="358" y="426" width="244" height="82" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="1.2"/>
  <text x="366" y="444" fill="#9f1239" font-size="10" font-weight="700">術後同步放化療（CCRT）兩大絕對指徵：</text>
  <text x="372" y="462" fill="#0f172a" font-size="9.8" font-weight="600">1. 手術病理切緣陽性（Positive margin）</text>
  <text x="372" y="479" fill="#0f172a" font-size="9.8" font-weight="600">2. 淋巴結包膜外侵犯（ENE 陽性）</text>
  <text x="366" y="498" fill="#1d4ed8" font-size="9.5" font-weight="600">· cN0 但 DOI &gt;3–4mm → 選擇性頸部廓清</text>

  <!-- ==================== PANEL 3: OSA VOTE & HPV+ OPSCC ==================== -->
  <rect x="640" y="84" width="292" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="640" y="84" width="292" height="32" rx="10" fill="#e0f2fe"/>
  <text x="786" y="105" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="700">③ OSA 塌陷四層次（VOTE）與口咽癌</text>

  <!-- DISE VOTE 4-Level Stack: x=654..918, y=124..348 -->
  <rect x="654" y="124" width="264" height="224" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="786" y="143" text-anchor="middle" fill="#1e3a8a" font-size="10.8" font-weight="700">睡眠內視鏡（DISE）VOTE 解剖定位</text>

  <rect x="666" y="152" width="240" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="676" y="170" fill="#1d4ed8" font-size="10.5" font-weight="700">V · Velum（軟腭／懸雍垂）</text>
  <text x="676" y="185" fill="#334155" font-size="9.5">前後向或同心圓塌陷（同心圓單做 UPPP 差）</text>

  <rect x="666" y="198" width="240" height="40" rx="6" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="676" y="216" fill="#0f766e" font-size="10.5" font-weight="700">O · Oropharynx（口咽側壁／扁桃腺）</text>
  <text x="676" y="231" fill="#334155" font-size="9.5">扁桃腺肥大與側咽壁內擠（兒童 OSA 首因）</text>

  <rect x="666" y="244" width="240" height="40" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="676" y="262" fill="#b45309" font-size="10.5" font-weight="700">T · Tongue Base（舌根後墜）</text>
  <text x="676" y="277" fill="#334155" font-size="9.5">舌扁桃肥大或睡眠肌張力下降壓迫復發區</text>

  <rect x="666" y="290" width="240" height="40" rx="6" fill="#fff1f2" stroke="#be123c"/>
  <text x="676" y="308" fill="#be123c" font-size="10.5" font-weight="700">E · Epiglottis（會厭軟骨塌陷）</text>
  <text x="676" y="323" fill="#334155" font-size="9.5">吸氣時會厭向後蓋住聲門（Trap-door 效應）</text>

  <text x="786" y="343" text-anchor="middle" fill="#0f172a" font-size="9.5" font-weight="700">成人 AHI：5–14輕·15–29中·≥30重（CPAP）</text>

  <!-- HPV+ Oropharyngeal Cancer & Tonsillectomy Box: y=356..518 -->
  <rect x="654" y="356" width="264" height="162" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="664" y="376" fill="#0f766e" font-size="10.5" font-weight="700">HPV 相關口咽鱗狀細胞癌（p16 陽性）：</text>
  <text x="664" y="394" fill="#0f172a" font-size="9.8">· 起源：腭扁桃腺隱窩與舌根淋巴上皮</text>
  <text x="664" y="411" fill="#0f172a" font-size="9.8">· 表現：年輕不菸酒患者、早期上頸囊狀淋巴轉移</text>
  <text x="664" y="428" fill="#0f766e" font-size="9.6" font-weight="600">· 預後優於菸酒型 p16-，採獨立降階 AJCC 分期</text>
  <line x1="664" y1="438" x2="908" y2="438" stroke="#cbd5e1" stroke-width="1"/>
  <text x="664" y="456" fill="#0f172a" font-size="9.8" font-weight="700">· 扁桃腺周圍膿瘍：懸雍垂偏健側＋牙關緊閉＋</text>
  <text x="672" y="473" fill="#0f172a" font-size="9.8">熱土豆音 → 穿刺抽吸或切開引流＋抗生素</text>
  <text x="664" y="491" fill="#be123c" font-size="9.5" font-weight="600">· Paradise 切除門檻：1年≥7·2年≥5·3年≥3次</text>
  <text x="664" y="508" fill="#475569" font-size="9.5">· 術後第 5–10 天痂皮脫落期嚴防繼發性大出血</text>
</svg>
