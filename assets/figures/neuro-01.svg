<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro01-title neuro01-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro01-title">腦幹橫切面「4 的法則」血管交叉症候群與昏迷腦死定位圖</title>
  <desc id="neuro01-desc">三層腦幹橫切面（中腦、橋腦、延髓）呈現內側群 4M 與外側群 4S 解剖定位，對照 Weber、Benedikt、Millard-Gubler、Foville、閉鎖症候群與延髓外側 Wallenberg 症候群，右側整合天幕上下意識障礙呼吸瞳孔表現與法定腦死判定要點。</desc>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="42" y="51" fill="#ffffff" font-size="18" font-weight="700">腦幹橫切面「4 的法則（Rule of 4）」血管交叉症候群與昏迷／腦死定位</text>
  <text x="918" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-01 · 解剖定位與腦幹反射</text>

  <!-- Tier 1: Midbrain -->
  <rect x="34" y="82" width="576" height="142" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="82" width="8" height="142" rx="4" fill="#1d4ed8"/>
  <text x="52" y="104" fill="#1d4ed8" font-size="14" font-weight="700">1. 中腦切面（Midbrain · CN III / IV）— PCA 穿通支與基底動脈頂端</text>
  <!-- Midbrain schematic -->
  <path d="M90,122 C110,110 135,118 145,132 C155,118 180,110 200,122 C215,140 206,184 186,204 C172,214 156,202 145,192 C134,202 118,214 104,204 C84,184 75,140 90,122 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <!-- Cerebral peduncle Weber zone -->
  <ellipse cx="114" cy="192" rx="18" ry="11" fill="#fecdd3" stroke="#be123c" stroke-width="1.5"/>
  <ellipse cx="176" cy="192" rx="18" ry="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <!-- Red nucleus Benedikt zone -->
  <circle cx="126" cy="162" r="11" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="164" cy="162" r="11" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <!-- Aqueduct & CN III -->
  <circle cx="145" cy="138" r="4" fill="#0f172a"/>
  <line x1="138" y1="150" x2="122" y2="214" stroke="#be123c" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="145" y="218" fill="#be123c" font-size="10.5" font-weight="600" text-anchor="middle">CN III 纖維穿出</text>
  <text x="228" y="128" fill="#be123c" font-size="12.5" font-weight="700">● Weber 症候群（腹側大腦腳＋CN III）</text>
  <text x="240" y="146" fill="#334155" font-size="11.5">同側動眼神經麻痺（眼外下斜、眼瞼下垂、瞳孔散大）＋對側上下肢偏癱</text>
  <text x="228" y="172" fill="#b45309" font-size="12.5" font-weight="700">● Benedikt 症候群（中腦被蓋紅核＋CN III）</text>
  <text x="240" y="190" fill="#334155" font-size="11.5">同側動眼神經麻痺＋對側小腦意向性顫抖、舞蹈徐動與深部感覺減退</text>
  <text x="228" y="212" fill="#475569" font-size="11">背側中腦頂蓋壓迫（Parinaud）：垂直向上凝視麻痺、光近反射分離、聚合退縮眼震</text>

  <!-- Tier 2: Pons -->
  <rect x="34" y="234" width="576" height="142" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="234" width="8" height="142" rx="4" fill="#0f766e"/>
  <text x="52" y="256" fill="#0f766e" font-size="14" font-weight="700">2. 橋腦切面（Pons · CN V–VIII）— 基底動脈旁正中支 vs 前下小腦動脈（AICA）</text>
  <!-- Pons schematic -->
  <ellipse cx="145" cy="312" rx="58" ry="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
  <!-- Ventral basis pontis -->
  <rect x="104" y="324" width="82" height="22" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <!-- Lateral AICA zone -->
  <ellipse cx="102" cy="296" rx="14" ry="18" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <!-- PPRF & CN VI/VII -->
  <circle cx="135" cy="296" r="6" fill="#be123c"/>
  <text x="145" y="366" fill="#0f766e" font-size="10.5" font-weight="600" text-anchor="middle">腹側基底橋腦（CST＋CN VI/VII）</text>
  <text x="228" y="280" fill="#0f766e" font-size="12.5" font-weight="700">● Millard-Gubler／Foville（腹內側橋腦）</text>
  <text x="240" y="298" fill="#334155" font-size="11.5">同側外旋（CN VI）與周邊型顏面麻痺（CN VII）＋對側偏癱；波及 PPRF 則雙眼偏向對側</text>
  <text x="228" y="322" fill="#b45309" font-size="12.5" font-weight="700">● 橋腦外側 AICA 症候群（Marie-Foix）</text>
  <text x="240" y="340" fill="#334155" font-size="11.5">同側眩暈伴單側突發耳聾耳鳴（內聽動脈）、同側顏面麻痺、Horner 與小腦失調</text>
  <text x="228" y="363" fill="#be123c" font-size="11" font-weight="600">★ 雙側腹側橋腦梗塞 → 閉鎖症候群（意識清醒、四肢全癱無語，僅存垂直動眼與眨眼）</text>

  <!-- Tier 3: Medulla -->
  <rect x="34" y="386" width="576" height="142" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="386" width="8" height="142" rx="4" fill="#be123c"/>
  <text x="52" y="408" fill="#be123c" font-size="14" font-weight="700">3. 延髓切面（Medulla · CN IX–XII）— 前脊髓動脈（內側）vs PICA（外側）</text>
  <!-- Medulla schematic -->
  <path d="M100,432 C120,420 170,420 190,432 C202,452 194,492 170,506 C154,514 136,514 120,506 C96,492 88,452 100,432 Z" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
  <!-- Medial pyramid + ML -->
  <rect x="133" y="452" width="12" height="50" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
  <!-- Lateral Wallenberg -->
  <ellipse cx="106" cy="458" rx="15" ry="20" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/>
  <text x="145" y="520" fill="#be123c" font-size="10.5" font-weight="600" text-anchor="middle">左：PICA 外側｜中：ASA 內側</text>
  <text x="228" y="432" fill="#1d4ed8" font-size="12.5" font-weight="700">● 延髓內側症候群（Dejerine · ASA／椎動脈）</text>
  <text x="240" y="450" fill="#334155" font-size="11.5">同側舌下神經麻痺（伸舌偏向病灶側）＋對側肢體偏癱＋對側震動本體覺喪失</text>
  <text x="228" y="474" fill="#be123c" font-size="12.5" font-weight="700">● Wallenberg 延髓外側症候群（PICA／椎動脈顱內段）</text>
  <text x="240" y="492" fill="#334155" font-size="11.5">疑核（吞嚥困難／聲音沙啞）＋交叉痛溫覺喪失（同側臉 V、對側軀幹）＋同側 Horner／失調</text>
  <text x="228" y="514" fill="#475569" font-size="11">註：延髓外側未波及腹側錐體束，故無肢體偏癱（與橋腦腹側病變關鍵區分）</text>

  <!-- Right Column: Rule of 4 + Coma/Brain Death -->
  <rect x="622" y="82" width="304" height="216" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="622" y="82" width="304" height="32" rx="10" fill="#eff6ff"/>
  <text x="636" y="103" fill="#1e3a8a" font-size="13.5" font-weight="700">腦幹「4M 內側 vs 4S 外側」快速口訣</text>
  <text x="636" y="128" fill="#1d4ed8" font-size="12" font-weight="700">內側旁正中群（4M · 運動與本體覺）</text>
  <text x="644" y="146" fill="#334155" font-size="11.2">1. Motor pathway：皮質脊髓束（對側偏癱）</text>
  <text x="644" y="163" fill="#334155" font-size="11.2">2. Medial lemniscus：內側蹄系（對側本體覺）</text>
  <text x="644" y="180" fill="#334155" font-size="11.2">3. MLF：內側縱束（核間性眼肌麻痺 INO）</text>
  <text x="644" y="197" fill="#334155" font-size="11.2">4. Motor nuclei：能整除 12 之運動核（3, 4, 6, 12）</text>
  <line x1="636" y1="208" x2="912" y2="208" stroke="#e2e8f0" stroke-width="1"/>
  <text x="636" y="226" fill="#be123c" font-size="12" font-weight="700">外側圓周支群（4S · 痛溫覺與交感小腦）</text>
  <text x="644" y="244" fill="#334155" font-size="11.2">1. Spinocerebellar：小腦腳（同側運動失調）</text>
  <text x="644" y="261" fill="#334155" font-size="11.2">2. Spinothalamic：脊髓視丘束（對側軀幹痛溫覺）</text>
  <text x="644" y="278" fill="#334155" font-size="11.2">3. Sensory V：三叉脊髓核（同側顏面痛溫覺）</text>
  <text x="644" y="293" fill="#334155" font-size="11.2">4. Sympathetic：下行交感徑路（同側 Horner）</text>

  <rect x="622" y="308" width="304" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="622" y="308" width="304" height="32" rx="10" fill="#fef2f2"/>
  <text x="636" y="329" fill="#991b1b" font-size="13.5" font-weight="700">昏迷層級與臺灣法定腦死判定核心</text>
  <text x="636" y="352" fill="#0f172a" font-size="11.5" font-weight="700">● 呼吸與姿勢向尾端惡化順序：</text>
  <text x="644" y="369" fill="#334155" font-size="11">間腦皮質：Cheyne-Stokes 呼吸＋去皮質屈曲（M3）</text>
  <text x="644" y="385" fill="#334155" font-size="11">中腦上橋腦：中樞過度換氣＋去大腦伸展（M2）</text>
  <text x="644" y="401" fill="#334155" font-size="11">橋腦被蓋：針尖樣瞳孔（1 mm）＋長吸式呼吸</text>
  <text x="644" y="417" fill="#334155" font-size="11">延髓網狀體：失調式（Ataxic）呼吸→呼吸停止</text>
  <line x1="636" y1="427" x2="912" y2="427" stroke="#e2e8f0" stroke-width="1"/>
  <text x="636" y="444" fill="#be123c" font-size="11.5" font-weight="700">● 腦死判定（不可逆腦幹死 · 觀察 ≥12h 後啟動）：</text>
  <text x="644" y="461" fill="#334155" font-size="11">先決排除：低體溫（核心須 ≥35°C）、鎮靜肌鬆藥、</text>
  <text x="644" y="477" fill="#334155" font-size="11">嚴重代謝內分泌危象、休克（SBP 須 ≥90 mmHg）</text>
  <text x="644" y="494" fill="#334155" font-size="11">7 項腦幹反射全失：光反射、角膜、前庭動眼、頭眼、</text>
  <text x="644" y="510" fill="#334155" font-size="11">顱神經痛覺、作嘔、咳嗽反射消失</text>
  <text x="644" y="524" fill="#0f766e" font-size="11" font-weight="600">Apnea test：PaCO2 ≥60 mmHg 無呼吸（2 次間隔 ≥4h）</text>
</svg>
