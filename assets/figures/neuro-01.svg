<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro01-title neuro01-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro01-title">腦幹橫切面「4 的法則」血管交叉症候群與昏迷腦死定位圖</title>
  <desc id="neuro01-desc">三層腦幹橫切面（中腦、橋腦、延髓）呈現內側群 4M 與外側群 4S 解剖定位，對照 Weber、Benedikt、Millard-Gubler、Foville、閉鎖症候群與延髓外側 Wallenberg 症候群，右側整合天幕上下意識障礙呼吸瞳孔表現與法定腦死判定要點。</desc>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="42" y="51" fill="#ffffff" font-size="18" font-weight="700">腦幹橫切面「4 的法則（Rule of 4）」血管交叉症候群與昏迷／腦死定位</text>
  <text x="918" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-01 · 解剖定位與腦幹反射</text>

  <!-- Tier 1: Midbrain -->
  <rect x="34" y="82" width="576" height="142" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="82" width="8" height="142" rx="4" fill="#1d4ed8"/>
  <text x="52" y="104" fill="#1d4ed8" font-size="13.2" font-weight="700">1. 中腦切面（Midbrain · CN III / IV）— PCA 穿通支與基底動脈頂端</text>
  <!-- Midbrain schematic -->
  <path d="M90,122 C110,110 135,118 145,132 C155,118 180,110 200,122 C215,140 206,184 186,204 C172,214 156,202 145,192 C134,202 118,214 104,204 C84,184 75,140 90,122 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <ellipse cx="114" cy="192" rx="18" ry="11" fill="#fecdd3" stroke="#be123c" stroke-width="1.5"/>
  <ellipse cx="176" cy="192" rx="18" ry="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <circle cx="126" cy="162" r="11" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="164" cy="162" r="11" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="145" cy="138" r="4" fill="#0f172a"/>
  <line x1="138" y1="150" x2="122" y2="214" stroke="#be123c" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="145" y="218" fill="#be123c" font-size="10.2" font-weight="600" text-anchor="middle">CN III 纖維穿出</text>
  <text x="222" y="127" fill="#be123c" font-size="12" font-weight="700">● Weber 症候群（腹側大腦腳＋CN III）</text>
  <text x="232" y="145" fill="#334155" font-size="10.5">同側動眼神經麻痺（外下斜、垂瞼、散瞳）＋對側上下肢偏癱</text>
  <text x="222" y="169" fill="#b45309" font-size="12" font-weight="700">● Benedikt 症候群（中腦被蓋紅核＋CN III）</text>
  <text x="232" y="187" fill="#334155" font-size="10.5">同側動眼神經麻痺＋對側小腦意向顫抖、舞蹈徐動與深感覺減退</text>
  <text x="222" y="210" fill="#475569" font-size="10.2">背側頂蓋壓迫（Parinaud）：上視麻痺、光近反射分離、聚合退縮眼震</text>

  <!-- Tier 2: Pons -->
  <rect x="34" y="234" width="576" height="142" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="234" width="8" height="142" rx="4" fill="#0f766e"/>
  <text x="52" y="255" fill="#0f766e" font-size="13" font-weight="700">2. 橋腦切面（Pons · CN V–VIII）— 旁正中支 vs 前下小腦動脈 AICA</text>
  <!-- Pons schematic -->
  <ellipse cx="138" cy="308" rx="54" ry="42" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
  <rect x="98" y="320" width="80" height="20" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <ellipse cx="97" cy="294" rx="13" ry="17" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="129" cy="294" r="5.5" fill="#be123c"/>
  <text x="138" y="365" fill="#0f766e" font-size="9.8" font-weight="600" text-anchor="middle">腹側橋腦（CST＋CN VI/VII）</text>
  <text x="222" y="274" fill="#0f766e" font-size="11.6" font-weight="700">● Millard-Gubler／Foville（腹內側橋腦）</text>
  <text x="232" y="290" fill="#334155" font-size="10">同側外旋（CN VI）與周邊顏面麻痺（CN VII）＋對側偏癱；</text>
  <text x="232" y="305" fill="#334155" font-size="10">若波及 PPRF 則雙眼偏向對側（看向偏癱肢體側）</text>
  <text x="222" y="323" fill="#b45309" font-size="11.6" font-weight="700">● 橋腦外側 AICA 症候群（Marie-Foix）</text>
  <text x="232" y="339" fill="#334155" font-size="10.2">同側眩暈伴單側突發耳聾耳鳴（內聽動脈）、顏面麻痺、Horner／失調</text>
  <text x="222" y="360" fill="#be123c" font-size="10.1" font-weight="600">★ 雙側腹側橋腦梗塞 → 閉鎖症候群（清醒四肢癱無語，僅存垂直動眼眨眼）</text>

  <!-- Tier 3: Medulla -->
  <rect x="34" y="386" width="576" height="142" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="386" width="8" height="142" rx="4" fill="#be123c"/>
  <text x="52" y="407" fill="#be123c" font-size="13" font-weight="700">3. 延髓切面（Medulla · CN IX–XII）— 前脊髓動脈 vs 外側 PICA</text>
  <!-- Medulla schematic -->
  <path d="M96,430 C116,418 164,418 184,430 C196,450 188,490 164,504 C148,512 130,512 114,504 C90,490 82,450 96,430 Z" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
  <rect x="128" y="450" width="12" height="48" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
  <ellipse cx="102" cy="456" rx="14" ry="19" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/>
  <text x="140" y="519" fill="#be123c" font-size="9.8" font-weight="600" text-anchor="middle">左：PICA 外側｜中：ASA 內側</text>
  <text x="222" y="427" fill="#1d4ed8" font-size="11.6" font-weight="700">● 延髓內側症候群（Dejerine · ASA／椎動脈）</text>
  <text x="232" y="443" fill="#334155" font-size="10.2">同側舌下神經麻痺（伸舌偏病灶側）＋對側偏癱＋對側震動本體覺喪失</text>
  <text x="222" y="462" fill="#be123c" font-size="11.6" font-weight="700">● Wallenberg 延髓外側症候群（PICA／椎動脈顱內段）</text>
  <text x="232" y="478" fill="#334155" font-size="10.1">疑核（吞嚥困難／聲音沙啞）＋交叉痛溫覺喪失（同側臉 V、對側軀幹）</text>
  <text x="232" y="493" fill="#334155" font-size="10.1">＋同側 Horner 症候群、前庭眩暈眼震與下小腦腳運動失調</text>
  <text x="222" y="513" fill="#475569" font-size="10.1">註：延髓外側未波及腹側錐體束，故無肢體偏癱（異於橋腦腹側病變）</text>

  <!-- Right Column: Rule of 4 + Coma/Brain Death -->
  <rect x="622" y="82" width="304" height="216" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="622" y="82" width="304" height="32" rx="10" fill="#eff6ff"/>
  <text x="634" y="103" fill="#1e3a8a" font-size="13" font-weight="700">腦幹「4M 內側 vs 4S 外側」快速口訣</text>
  <text x="634" y="128" fill="#1d4ed8" font-size="11.5" font-weight="700">內側旁正中群（4M · 運動與本體覺）</text>
  <text x="638" y="145" fill="#334155" font-size="10.4">1. Motor pathway：皮質脊髓束（對側偏癱）</text>
  <text x="638" y="162" fill="#334155" font-size="10.4">2. Medial lemniscus：內側蹄系（對側本體覺）</text>
  <text x="638" y="179" fill="#334155" font-size="10.4">3. MLF：內側縱束（核間性眼肌麻痺 INO）</text>
  <text x="638" y="196" fill="#334155" font-size="10.4">4. Motor nuclei：整除 12 運動核（3,4,6,12）</text>
  <line x1="634" y1="207" x2="914" y2="207" stroke="#e2e8f0" stroke-width="1"/>
  <text x="634" y="225" fill="#be123c" font-size="11.5" font-weight="700">外側圓周支群（4S · 痛溫覺與交感小腦）</text>
  <text x="638" y="242" fill="#334155" font-size="10.4">1. Spinocerebellar：小腦腳（同側運動失調）</text>
  <text x="638" y="259" fill="#334155" font-size="10.4">2. Spinothalamic：脊髓視丘束（對側痛溫覺）</text>
  <text x="638" y="276" fill="#334155" font-size="10.4">3. Sensory V：三叉脊髓核（同側顏面痛溫覺）</text>
  <text x="638" y="292" fill="#334155" font-size="10.4">4. Sympathetic：下行交感徑路（同側 Horner）</text>

  <rect x="622" y="308" width="304" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="622" y="308" width="304" height="32" rx="10" fill="#fef2f2"/>
  <text x="634" y="329" fill="#991b1b" font-size="13" font-weight="700">昏迷層級與臺灣法定腦死判定核心</text>
  <text x="634" y="352" fill="#0f172a" font-size="11" font-weight="700">● 呼吸與姿勢向尾端惡化順序：</text>
  <text x="638" y="368" fill="#334155" font-size="10.3">間腦皮質：Cheyne-Stokes 呼吸＋去皮質（M3）</text>
  <text x="638" y="384" fill="#334155" font-size="10.3">中腦上橋腦：中樞過度換氣＋去大腦伸展（M2）</text>
  <text x="638" y="400" fill="#334155" font-size="10.3">橋腦被蓋：針尖樣瞳孔（1 mm）＋長吸式呼吸</text>
  <text x="638" y="416" fill="#334155" font-size="10.3">延髓網狀體：失調式（Ataxic）呼吸→呼吸停止</text>
  <line x1="634" y1="426" x2="914" y2="426" stroke="#e2e8f0" stroke-width="1"/>
  <text x="634" y="442" fill="#be123c" font-size="10.5" font-weight="700">● 腦死判定（不可逆腦幹死 · 觀察 ≥12h 啟動）：</text>
  <text x="638" y="458" fill="#334155" font-size="10.2">先決排除：低體溫（須 ≥35°C）、鎮靜肌鬆藥、</text>
  <text x="638" y="473" fill="#334155" font-size="10.2">嚴重代謝內分泌危象、休克（SBP ≥90 mmHg）</text>
  <text x="638" y="489" fill="#334155" font-size="10.2">7 項腦幹反射全失：光反射、角膜、前庭動眼、</text>
  <text x="638" y="504" fill="#334155" font-size="10.2">頭眼、顱神經痛覺、作嘔、咳嗽反射消失</text>
  <text x="638" y="520" fill="#0f766e" font-size="9.9" font-weight="600">Apnea test：PaCO2 ≥60 無呼吸（2 次隔 ≥4h）</text>
</svg>
