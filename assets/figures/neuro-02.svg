<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro02-title neuro02-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro02-title">大腦皮質運動小人血管流域與超急性缺血性中風再灌流路徑圖</title>
  <desc id="neuro02-desc">左側呈現冠狀切面大腦半球 ACA、MCA、PCA 三大血管灌流區與運動感覺小人對應症狀及分水嶺區；右側呈現缺血核心與可挽救半影區灌流不匹配（rCBF 小於 30% 與 Tmax 大於 6 秒），以及 4.5 小時靜脈溶栓與 6 至 24 小時動脈機械取栓決策流程。</desc>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="42" y="51" fill="#ffffff" font-size="18" font-weight="700">大腦血管流域皮質小人（ACA／MCA／PCA）與超急性中風再灌流決策路徑</text>
  <text x="918" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-02 · 血管流域與再灌流治療</text>

  <!-- Left Panel: Coronal Vascular Territories & Homunculus -->
  <rect x="32" y="82" width="418" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="105" fill="#0f172a" font-size="14" font-weight="700">A. 大腦冠狀切面血管流域與皮質運動小人定位</text>

  <!-- Coronal Brain Hemisphere Drawing -->
  <g transform="translate(-14, 0)">
    <path d="M235,126 L235,232 L182,212 C180,165 202,132 235,126 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <path d="M182,212 L235,232 L212,272 L120,278 C102,240 112,175 156,144 C168,136 176,133 182,132 C178,158 178,186 182,212 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <path d="M120,278 L212,272 L235,232 L235,298 C196,312 142,306 120,278 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <circle cx="176" cy="144" r="9" fill="#be123c"/>
    <text x="176" y="148" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">W</text>
    <text x="206" y="168" fill="#1e3a8a" font-size="12.5" font-weight="700">ACA</text>
    <text x="148" y="226" fill="#0f766e" font-size="13.5" font-weight="700">MCA</text>
    <text x="182" y="294" fill="#b45309" font-size="12.5" font-weight="700">PCA</text>
  </g>

  <!-- Homunculus callouts -->
  <rect x="230" y="120" width="210" height="58" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="238" y="137" fill="#1d4ed8" font-size="11" font-weight="700">前大腦動脈（ACA · 內側額頂）</text>
  <text x="238" y="153" fill="#334155" font-size="10">對側下肢無力麻木 ＞ 上肢</text>
  <text x="238" y="168" fill="#334155" font-size="9.8">伴尿失禁、冷漠無語、握持反射</text>

  <rect x="230" y="184" width="210" height="72" rx="7" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="238" y="201" fill="#0f766e" font-size="11" font-weight="700">中大腦動脈（MCA · 外側凸面）</text>
  <text x="238" y="217" fill="#334155" font-size="9.8">對側臉與上肢無力 ＞ 下肢＋偏病灶</text>
  <text x="238" y="232" fill="#334155" font-size="9.8">左：Broca（上支）／Wernicke（下）</text>
  <text x="238" y="247" fill="#334155" font-size="9.8">右：左側空間忽略（Neglect）</text>

  <rect x="230" y="262" width="210" height="58" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="238" y="279" fill="#b45309" font-size="11" font-weight="700">後大腦動脈（PCA · 枕葉視丘）</text>
  <text x="238" y="295" fill="#334155" font-size="9.8">對側同向偏盲（黃斑部常保留）</text>
  <text x="238" y="310" fill="#334155" font-size="9.8">優勢側胼胝體壓部：失讀不失寫</text>

  <!-- Additional Vascular Pearls Box -->
  <rect x="42" y="328" width="398" height="188" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="346" fill="#0f172a" font-size="11.8" font-weight="700">臨床高頻血管定位與 TOAST 病因關鍵</text>
  <text x="50" y="364" fill="#be123c" font-size="9.7" font-weight="600">● W 分水嶺梗塞（ACA-MCA／MCA-PCA）：低血壓休克或重度頸狹窄</text>
  <text x="50" y="381" fill="#334155" font-size="9.7">● 內頸動脈（ICA）眼動脈栓子：同側突發單眼黑矇（amaurosis fugax）</text>
  <text x="50" y="398" fill="#334155" font-size="9.7">● 深部穿通支小洞梗塞（Lacunar）：內囊純運動、視丘純感覺無皮質徵</text>
  <text x="50" y="415" fill="#334155" font-size="9.7">● 東亞特色：顱內動脈粥狀硬化狹窄率高；心房顫動栓塞須長期抗凝</text>
  <text x="50" y="432" fill="#1d4ed8" font-size="9.7" font-weight="600">● 臺灣年輕中風必查：NOTCH3 R544C（CADASIL · 外囊前顳極白質）</text>
  <text x="50" y="449" fill="#475569" font-size="9.7">● 內囊警訊（Capsular warning）：穿通支反覆單側偏癱，易轉全梗塞</text>
  <text x="50" y="466" fill="#475569" font-size="9.7">● 基底動脈主幹阻塞：四肢癱、構音吞嚥障礙、針尖瞳孔或昏迷致死高</text>
  <text x="50" y="484" fill="#0f766e" font-size="9.7" font-weight="600">● 急性輸液鐵律：一律等張 0.9% NS，嚴禁低張含糖 D5W（防腦水腫）</text>
  <text x="50" y="502" fill="#475569" font-size="9.6">● 吞嚥安全：進食飲水與口服藥前必先完成床邊吞嚥篩檢防吸入肺炎</text>

  <!-- Right Panel: Hyperacute Reperfusion & Perfusion Mismatch -->
  <rect x="460" y="82" width="468" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="474" y="105" fill="#0f172a" font-size="14" font-weight="700">B. 灌流不匹配（Core vs Penumbra）與再灌流時間窗流程</text>

  <!-- Core vs Penumbra graphic -->
  <rect x="472" y="116" width="444" height="84" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <ellipse cx="542" cy="158" rx="56" ry="30" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
  <ellipse cx="532" cy="158" rx="24" ry="15" fill="#be123c"/>
  <text x="532" y="162" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Core</text>
  <text x="577" y="162" fill="#92400e" font-size="9.8" font-weight="700" text-anchor="middle">Penumbra</text>
  <text x="614" y="136" fill="#be123c" font-size="10.4" font-weight="700">缺血核心（Core）：CTP rCBF &lt;30%／DWI 亮</text>
  <text x="614" y="153" fill="#b45309" font-size="10.4" font-weight="700">可挽救半影（Penumbra）：Tmax &gt;6s 低灌流</text>
  <text x="614" y="170" fill="#334155" font-size="9.9">Mismatch：低灌流／核心 ≥1.8、核心 &lt;70 mL、</text>
  <text x="614" y="186" fill="#334155" font-size="9.9">可挽救半影 ≥15 mL（DEFUSE-3 擴大取栓判準）</text>

  <!-- Step 1: Initial Gate -->
  <rect x="472" y="208" width="444" height="54" rx="8" fill="#0f172a"/>
  <text x="484" y="228" fill="#ffffff" font-size="10.6" font-weight="700">Step 1 · 急診啟動：確認最後正常時間（LKW）＋指尖血糖＋平掃 CT 排出血</text>
  <text x="484" y="247" fill="#cbd5e1" font-size="9.8">唯一必等檢驗為血糖（排除 &lt;50 mg/dL 低血糖模仿症）；同步做頭頸 CTA 評大血管</text>

  <!-- Two parallel tracks: IVT vs EVT -->
  <rect x="472" y="272" width="216" height="172" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="482" y="293" fill="#0f766e" font-size="11.5" font-weight="700">靜脈溶栓（IV rt-PA / TNK）</text>
  <text x="482" y="312" fill="#0f172a" font-size="10.2" font-weight="600">● 時間窗：發作 ≤4.5 小時</text>
  <text x="482" y="328" fill="#334155" font-size="9.8">醒後：MRI DWI(+) 且 FLAIR(−)</text>
  <text x="482" y="344" fill="#334155" font-size="9.8">或 4.5–9h CTP 半影不匹配評估</text>
  <text x="482" y="362" fill="#be123c" font-size="10.2" font-weight="700">● 血壓紅線：給藥前 &lt;185/110</text>
  <text x="482" y="378" fill="#be123c" font-size="9.8">給藥後 24h 嚴控 ≤180/105 mmHg</text>
  <text x="482" y="396" fill="#334155" font-size="9.8">● Alteplase 0.9 mg/kg（上限 90）</text>
  <text x="482" y="412" fill="#334155" font-size="9.8">10% 推注 1 min，90% 滴 60 min</text>
  <text x="482" y="429" fill="#475569" font-size="9.7">24h 內禁抗血栓，追蹤 CT 無血再給</text>

  <rect x="700" y="272" width="216" height="172" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="710" y="293" fill="#1d4ed8" font-size="11.5" font-weight="700">動脈機械取栓（EVT）</text>
  <text x="710" y="312" fill="#0f172a" font-size="10.2" font-weight="600">● 早期窗（≤6 小時）：</text>
  <text x="710" y="328" fill="#334155" font-size="9.8">前循環 ICA／M1 阻塞、NIHSS ≥6</text>
  <text x="710" y="344" fill="#334155" font-size="9.8">ASPECTS ≥6、發病前 mRS 0–1</text>
  <text x="710" y="362" fill="#1d4ed8" font-size="10.2" font-weight="700">● 擴大窗（6–24 小時）：</text>
  <text x="710" y="378" fill="#334155" font-size="9.8">DAWN（臨床與核心不匹配）或</text>
  <text x="710" y="394" fill="#334155" font-size="9.8">DEFUSE-3（6–16h 灌流不匹配）</text>
  <text x="710" y="412" fill="#be123c" font-size="9.8" font-weight="600">★ 符合溶栓須先打 IVT 再送導管，</text>
  <text x="710" y="428" fill="#be123c" font-size="9.8" font-weight="600">絕不為觀察溶栓療效延誤取栓！</text>

  <!-- Bottom Box: Deterioration & Permissive HTN -->
  <rect x="472" y="454" width="444" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="484" y="473" fill="#0f172a" font-size="10.8" font-weight="700">未溶栓允許性高血壓與住院神經惡化緊急處置：</text>
  <text x="484" y="490" fill="#334155" font-size="9.7">● 未再灌流者血壓 ≥220/120 才溫和降壓（首日降 15%）；血糖控 140–180 mg/dL</text>
  <text x="484" y="506" fill="#be123c" font-size="9.7" font-weight="600">● 惡性 MCA 大梗塞水腫（48h 內 NIHSS 惡化）：急排 CT，評估半顱骨減壓切除術</text>
</svg>
