<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro03-title neuro03-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro03-title">自發性腦內出血定位與逆轉劑、蜘蛛膜下腔出血時序及腦靜脈竇栓塞影像圖</title>
  <desc id="neuro03-desc">三欄整合圖：左欄呈現高血壓性深部腦出血（殼核、視丘、橋腦、小腦）與腦葉澱粉樣血管病變、CTA Spot Sign 及抗凝血逆轉劑；中欄呈現動脈瘤性蜘蛛膜下腔出血再出血、血管痙攣與水腦症三大時序關卡；右欄呈現腦靜脈竇栓塞空三角徵與腦動靜脈畸形伽瑪刀適應症。</desc>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="42" y="51" fill="#ffffff" font-size="18" font-weight="700">自發性腦出血（ICH）逆轉、蜘蛛膜下腔出血（SAH）時序與腦靜脈竇栓塞（CVST）</text>
  <text x="918" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-03 · 出血性腦血管疾病與次級預防</text>

  <!-- Column 1: ICH Location, Spot Sign & Reversal -->
  <rect x="34" y="82" width="292" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="82" width="292" height="32" rx="10" fill="#fef2f2"/>
  <text x="48" y="103" fill="#991b1b" font-size="13.5" font-weight="700">1. 自發性 ICH 定位、Spot Sign 與逆轉</text>

  <!-- Axial Brain ICH schematic -->
  <ellipse cx="180" cy="182" rx="74" ry="56" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <path d="M180,126 L180,238" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Deep putaminal hematoma + Spot sign -->
  <ellipse cx="146" cy="178" rx="18" ry="24" fill="#be123c" opacity="0.88"/>
  <circle cx="142" cy="172" r="4.5" fill="#fef08a" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Lobar CAA hematoma -->
  <ellipse cx="226" cy="154" rx="16" ry="12" fill="#f97316" opacity="0.82"/>
  <text x="108" y="226" fill="#be123c" font-size="10.5" font-weight="700">深部高血壓血腫＋Spot sign</text>
  <text x="196" y="138" fill="#b45309" font-size="10.5" font-weight="700">皮質腦葉（CAA）</text>

  <text x="48" y="254" fill="#0f172a" font-size="11.5" font-weight="700">● 四大高血壓穿通支定位特徵：</text>
  <text x="54" y="271" fill="#334155" font-size="10.8">殼核：對側偏癱＋雙眼偏向病灶同側</text>
  <text x="54" y="287" fill="#334155" font-size="10.8">視丘：對側全感覺喪失＋眼球向內下看鼻尖</text>
  <text x="54" y="303" fill="#334155" font-size="10.8">橋腦：深昏迷、四肢癱、針尖樣瞳孔（1 mm）</text>
  <text x="54" y="319" fill="#be123c" font-size="10.8" font-weight="600">小腦：眩暈嘔吐失調；血腫 &gt;3 cm 緊急後顱窩減壓</text>

  <line x1="48" y1="330" x2="312" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="348" fill="#1d4ed8" font-size="11.5" font-weight="700">● 急性降壓與抗凝血劑專一逆轉：</text>
  <text x="54" y="365" fill="#334155" font-size="10.8">SBP 150–220：平穩降至 140 mmHg（禁 &lt;130）</text>
  <text x="54" y="382" fill="#334155" font-size="10.8">CTA Spot sign 陽性：預示活動性外滲與血塊擴大</text>
  <rect x="48" y="392" width="264" height="122" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="411" fill="#0f766e" font-size="11" font-weight="700">抗凝藥物相關 ICH 緊急解毒劑：</text>
  <text x="58" y="429" fill="#334155" font-size="10.6">• Dabigatran → Idarucizumab 5 g IV</text>
  <text x="58" y="446" fill="#334155" font-size="10.6">• Xa 抑制劑（Apixaban / Rivaroxaban 等）</text>
  <text x="68" y="462" fill="#334155" font-size="10.6">→ Andexanet alfa 或 4-factor PCC</text>
  <text x="58" y="479" fill="#334155" font-size="10.6">• Warfarin → 4F-PCC＋Vit K1 10 mg IV</text>
  <text x="58" y="496" fill="#334155" font-size="10.6">• Unfractionated Heparin → Protamine</text>
  <text x="58" y="510" fill="#64748b" font-size="10">（CPP = MAP − ICP 維持 60–75 mmHg）</text>

  <!-- Column 2: Aneurysmal SAH Timeline & Three Hurdles -->
  <rect x="336" y="82" width="292" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="336" y="82" width="292" height="32" rx="10" fill="#fffbeb"/>
  <text x="350" y="103" fill="#92400e" font-size="13.5" font-weight="700">2. 動脈瘤性 SAH 與三大併發症時序</text>

  <!-- Timeline chart -->
  <rect x="350" y="124" width="264" height="132" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="368" y1="232" x2="598" y2="232" stroke="#475569" stroke-width="1.4"/>
  <line x1="368" y1="138" x2="368" y2="232" stroke="#475569" stroke-width="1.4"/>
  <!-- Rebleeding curve (Day 0-2 peak) -->
  <path d="M368,146 Q384,150 404,205 T460,228" fill="none" stroke="#be123c" stroke-width="2.4"/>
  <!-- Vasospasm curve (Day 4-14, peak 7-10) -->
  <path d="M402,230 Q442,226 472,152 Q502,152 536,228" fill="none" stroke="#b45309" stroke-width="2.4"/>
  <!-- Hydrocephalus curve (acute + >14d chronic) -->
  <path d="M372,188 Q420,218 510,204 Q556,192 594,180" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="372" y="142" fill="#be123c" font-size="10" font-weight="700">再出血高峰(首24h)</text>
  <text x="448" y="146" fill="#b45309" font-size="10" font-weight="700">血管痙攣(D4–14, 峰D7–10)</text>
  <text x="520" y="176" fill="#1d4ed8" font-size="10" font-weight="700">慢性水腦(&gt;2週)</text>
  <text x="368" y="246" fill="#475569" font-size="10">D0</text>
  <text x="424" y="246" fill="#475569" font-size="10">D4</text>
  <text x="478" y="246" fill="#475569" font-size="10">D7–10</text>
  <text x="536" y="246" fill="#475569" font-size="10">D14</text>
  <text x="580" y="246" fill="#475569" font-size="10">D21</text>

  <text x="350" y="276" fill="#0f172a" font-size="11.5" font-weight="700">● 診斷與動脈瘤定位鐵律：</text>
  <text x="356" y="293" fill="#334155" font-size="10.8">雷擊頭痛（1 分鐘達極限）：6h 內薄切 CT 高敏感；</text>
  <text x="356" y="309" fill="#334155" font-size="10.8">&gt;6h CT 陰性仍高度懷疑須做腰椎穿刺驗黃變症</text>
  <text x="356" y="326" fill="#be123c" font-size="10.8" font-weight="600">PComA 動脈瘤壓迫 CN III 外層副交感纖維：</text>
  <text x="356" y="342" fill="#be123c" font-size="10.8" font-weight="600">→ 同側動眼神經麻痺伴瞳孔散大無光反應（急做 CTA）</text>
  <text x="356" y="358" fill="#334155" font-size="10.8">好發分岔處：AComA 最常見、PComA、MCA 分岔</text>

  <line x1="350" y1="369" x2="614" y2="369" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="387" fill="#0f766e" font-size="11.5" font-weight="700">● 三大次發關卡標準處置：</text>
  <text x="356" y="405" fill="#334155" font-size="10.8">1. 防再出血：24–72h 內栓塞（Coiling）或夾閉（Clipping）；</text>
  <text x="366" y="421" fill="#334155" font-size="10.8">未處理動脈瘤前 SBP 控於 &lt;160 mmHg</text>
  <text x="356" y="439" fill="#334155" font-size="10.8">2. 防血管痙攣與遲發性腦缺血（DCI）：</text>
  <text x="366" y="455" fill="#0f766e" font-size="10.8" font-weight="600">口服 Nimodipine 60 mg q4h × 21 天＋維持正常血容積</text>
  <text x="366" y="471" fill="#334155" font-size="10.8">發生症狀性痙攣：誘導性升壓或動脈內擴張／成形術</text>
  <text x="356" y="489" fill="#334155" font-size="10.8">3. 水腦症：急性阻塞置 EVD，慢性交通性評估 VP shunt</text>
  <text x="356" y="507" fill="#64748b" font-size="10.3">（mFisher 分級依基底池血塊厚度與腦室出血預測痙攣風險）</text>

  <!-- Column 3: CVST Empty Delta & AVM / Secondary Prevention -->
  <rect x="638" y="82" width="288" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="638" y="82" width="288" height="32" rx="10" fill="#f0fdfa"/>
  <text x="652" y="103" fill="#0f766e" font-size="13.5" font-weight="700">3. CVST 空三角徵、AVM 與次級預防</text>

  <!-- Empty Delta Sign Schematic -->
  <rect x="652" y="124" width="260" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="708" cy="176" r="38" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
  <!-- Superior sagittal sinus Empty Delta at posterior vertex -->
  <polygon points="708,196 695,212 721,212" fill="#ffffff" stroke="#be123c" stroke-width="2.5"/>
  <circle cx="708" cy="206" r="4" fill="#334155"/>
  <text x="758" y="148" fill="#be123c" font-size="11.5" font-weight="700">Empty Delta Sign</text>
  <text x="758" y="165" fill="#334155" font-size="10.6">顯影 CT／MRV 見上矢狀竇</text>
  <text x="758" y="180" fill="#334155" font-size="10.6">硬膜壁強化包圍中央血栓</text>
  <text x="758" y="198" fill="#0f766e" font-size="10.6" font-weight="700">★ 伴靜脈性出血仍首選</text>
  <text x="758" y="213" fill="#0f766e" font-size="10.6" font-weight="700">LMWH／UFH 抗凝治療！</text>

  <text x="652" y="248" fill="#0f172a" font-size="11.5" font-weight="700">● 腦血管畸形與煙霧病（Moyamoya）：</text>
  <text x="658" y="266" fill="#334155" font-size="10.8">• AVM（動靜脈畸形）：動脈期即見早期引流靜脈，</text>
  <text x="666" y="282" fill="#334155" font-size="10.8">病理切片夾雜腦實質；深部小型病灶適用伽瑪刀</text>
  <text x="666" y="298" fill="#334155" font-size="10.8">立體定位放射手術（單次高劑量漸進閉塞血管巢）</text>
  <text x="658" y="315" fill="#334155" font-size="10.8">• 海綿狀血管瘤：MRI 爆米花樣含鐵血黃素環，</text>
  <text x="666" y="331" fill="#334155" font-size="10.8">病理無腦實質夾雜，血管攝影隱匿，症狀者手術切除</text>
  <text x="658" y="348" fill="#334155" font-size="10.8">• 煙霧病：雙側 ICA 末端狹窄伴顱底煙霧側枝（兒童</text>
  <text x="666" y="364" fill="#334155" font-size="10.8">過度換氣誘發缺血、成人出血），評估顱內外吻合術</text>

  <line x1="652" y1="376" x2="912" y2="376" stroke="#e2e8f0" stroke-width="1"/>
  <text x="652" y="394" fill="#1d4ed8" font-size="11.5" font-weight="700">● 缺血性中風精準抗血栓次級預防：</text>
  <text x="658" y="412" fill="#334155" font-size="10.7">• 輕微非心因中風（NIHSS ≤3）／高危 TIA（ABCD2 ≥4）：</text>
  <text x="666" y="428" fill="#334155" font-size="10.7">24h 內啟動 DAPT 21 天後轉單抗（勿長期雙抗增出血）</text>
  <text x="658" y="445" fill="#334155" font-size="10.7">• 臺灣 CYP2C19 失能基因率高：帶因者可改 Ticagrelor</text>
  <text x="658" y="462" fill="#334155" font-size="10.7">• 顱內大動脈 70–99% 狹窄：首選積極內科雙抗 90 天＋</text>
  <text x="666" y="478" fill="#334155" font-size="10.7">LDL-C &lt;70 mg/dL（SAMMPRIS 證實常規支架不利）</text>
  <text x="658" y="495" fill="#334155" font-size="10.7">• 非瓣膜性 AF：依梗塞大小銜接 DOAC；機械瓣膜或</text>
  <text x="666" y="511" fill="#334155" font-size="10.7">中重度二尖瓣狹窄則必須使用 Warfarin</text>
</svg>
