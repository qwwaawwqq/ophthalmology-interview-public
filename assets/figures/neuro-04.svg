<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro04-title neuro04-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro04-title">癲癇發作網路分類、經典腦波棘慢波圖譜與癲癇重積狀態階梯搶救時間軸</title>
  <desc id="neuro04-desc">左上呈現 ILAE 焦點起始與全般起始發作網路分類及臺灣 HLA-B*15:02 藥物基因安全警示；右上繪製兒童失神 3 Hz 棘慢波、Lennox-Gastaut 慢棘慢波與嬰兒點頭痙攣高度節律不整三種腦波；下方呈現痙攣型癲癇重積狀態 0 至 5、5 至 20、20 至 40 及大於 40 分鐘之階梯治療時間軸。</desc>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="42" y="51" fill="#ffffff" font-size="18" font-weight="700">ILAE 癲癇發作網路分類、經典腦波圖譜與癲癇重積狀態（SE）搶救時間軸</text>
  <text x="918" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-04 · 腦波症候群與急症搶救</text>

  <!-- Top-Left: Focal vs Generalized Network + HLA-B*15:02 -->
  <rect x="34" y="80" width="424" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="103" fill="#0f172a" font-size="14" font-weight="700">A. ILAE 發作起始網路與臺灣藥物基因紅線</text>

  <!-- Focal hemisphere schematic -->
  <rect x="48" y="114" width="190" height="106" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <ellipse cx="96" cy="158" rx="34" ry="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="96" y1="132" x2="96" y2="184" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="80" cy="154" r="9" fill="#be123c"/>
  <path d="M89,154 L108,154" stroke="#be123c" stroke-width="1.8" stroke-dasharray="2,2"/>
  <text x="140" y="138" fill="#1d4ed8" font-size="11.5" font-weight="700">Focal Onset</text>
  <text x="140" y="154" fill="#334155" font-size="10.3">單側半球局部起始</text>
  <text x="140" y="169" fill="#334155" font-size="10.3">• 意識保留／受損</text>
  <text x="58" y="200" fill="#334155" font-size="10.3">• 可續發雙側強直陣攣（F2BTC）</text>
  <text x="58" y="213" fill="#475569" font-size="10">首選：LEV / LTG / OXC / LCM</text>

  <!-- Generalized hemisphere schematic -->
  <rect x="250" y="114" width="194" height="106" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <ellipse cx="298" cy="158" rx="34" ry="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="298" y1="132" x2="298" y2="184" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="282" cy="150" r="7" fill="#b45309"/>
  <circle cx="314" cy="150" r="7" fill="#b45309"/>
  <circle cx="284" cy="166" r="6" fill="#b45309"/>
  <circle cx="312" cy="166" r="6" fill="#b45309"/>
  <text x="342" y="138" fill="#0f766e" font-size="11.5" font-weight="700">Generalized</text>
  <text x="342" y="154" fill="#334155" font-size="10.3">雙側網路同步放電</text>
  <text x="342" y="169" fill="#334155" font-size="10.3">• GTCS／失神／肌陣攣</text>
  <text x="260" y="200" fill="#334155" font-size="10.3">• 未目擊起始歸入 Unknown onset</text>
  <text x="260" y="213" fill="#475569" font-size="10">廣效：VPA / LEV / LTG；失神：ESM</text>

  <!-- HLA-B*15:02 Warning Box -->
  <rect x="48" y="228" width="396" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="60" y="247" fill="#be123c" font-size="11.8" font-weight="700">★ 臺灣健保用藥安全鐵律：HLA-B*15:02 基因篩檢與致畸胎防範</text>
  <text x="60" y="264" fill="#334155" font-size="10.6">• 處方 Carbamazepine（及結構相近之 OXC、PHT、LTG）前必驗 HLA-B*15:02，陽性禁用以防 SJS/TEN</text>
  <text x="60" y="280" fill="#334155" font-size="10.6">• 育齡女性首避 Valproate（神經管缺陷與後代認知下降風險最高）；窄效鈉離子通道阻斷劑會惡化失神與 JME</text>
  <text x="60" y="296" fill="#475569" font-size="10.3">• 癲癇症定義：≥2 次非誘發發作間隔 &gt;24h，或單次發作伴結構病灶使 10 年復發率 &gt;60%，或符合癲癇症候群</text>

  <!-- Top-Right: Three Classic EEG Waveforms -->
  <rect x="470" y="80" width="456" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="486" y="103" fill="#0f172a" font-size="14" font-weight="700">B. 三大必考癲癇症候群腦波（EEG）波形對照</text>

  <!-- EEG 1: 3 Hz Spike-and-Wave -->
  <rect x="486" y="114" width="424" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="498" y="133" fill="#1d4ed8" font-size="11.5" font-weight="700">1. 兒童失神癲癇（CAE）：規則對稱 3 Hz 棘慢複合波</text>
  <text x="498" y="150" fill="#475569" font-size="10.3">過度換氣易誘發，突發凝視 &lt;20 秒無發作後混亂；首選 Ethosuximide／VPA</text>
  <path d="M748,148 L754,148 L758,120 L762,156 Q772,126 782,148 L788,148 L792,120 L796,156 Q806,126 816,148 L822,148 L826,120 L830,156 Q840,126 850,148 L856,148 L860,120 L864,156 Q874,126 884,148 L896,148" fill="none" stroke="#1d4ed8" stroke-width="2"/>

  <!-- EEG 2: LGS Slow Spike-and-Wave -->
  <rect x="486" y="180" width="424" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="498" y="199" fill="#b45309" font-size="11.5" font-weight="700">2. Lennox-Gastaut 症候群：慢速 &lt;2.5 Hz 棘慢波</text>
  <text x="498" y="216" fill="#475569" font-size="10.3">多重發作型態（強直／失張力跌倒）＋智能障礙，多屬藥物難治型腦病變</text>
  <path d="M748,214 L756,214 L762,188 L768,224 Q788,190 808,214 L818,214 L824,188 L830,224 Q850,190 870,214 L896,214" fill="none" stroke="#b45309" stroke-width="2"/>

  <!-- EEG 3: Hypsarrhythmia -->
  <rect x="486" y="246" width="424" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="498" y="265" fill="#be123c" font-size="11.5" font-weight="700">3. 嬰兒點頭痙攣（West）：高度節律不整（Hypsarrhythmia）</text>
  <text x="498" y="282" fill="#475569" font-size="10.3">高振幅混亂慢波夾雜多焦點棘波＋發育退化；首選 ACTH／Vigabatrin</text>
  <path d="M748,282 Q756,250 764,292 L770,254 Q780,296 790,262 L796,294 L804,252 Q816,295 826,266 L834,292 L842,254 Q854,296 866,260 L874,290 Q886,256 896,280" fill="none" stroke="#be123c" stroke-width="2"/>

  <!-- Bottom Panel: Status Epilepticus 0-60 min Escalation Timeline -->
  <rect x="34" y="328" width="892" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="352" fill="#0f172a" font-size="14.5" font-weight="700">C. 痙攣型癲癇重積狀態（Convulsive Status Epilepticus · 連續抽搐 ≥5 分鐘）階梯搶救時間軸</text>

  <!-- Timeline horizontal bar -->
  <line x1="60" y1="376" x2="900" y2="376" stroke="#334155" stroke-width="3"/>
  <circle cx="80" cy="376" r="7" fill="#0f766e"/>
  <circle cx="290" cy="376" r="7" fill="#1d4ed8"/>
  <circle cx="515" cy="376" r="7" fill="#b45309"/>
  <circle cx="740" cy="376" r="7" fill="#be123c"/>

  <!-- Stage 1: 0-5 min -->
  <rect x="48" y="392" width="198" height="122" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.3"/>
  <text x="58" y="411" fill="#0f766e" font-size="12" font-weight="700">0–5 min · 生命徵象穩定</text>
  <text x="58" y="429" fill="#334155" font-size="10.6">• 維持呼吸道暢通、給氧、側臥防嗆</text>
  <text x="58" y="446" fill="#be123c" font-size="10.6" font-weight="700">• 立即測指尖血糖！</text>
  <text x="58" y="463" fill="#334155" font-size="10.4">• 若低血糖：先 IV Thiamine 100 mg</text>
  <text x="66" y="479" fill="#334155" font-size="10.4">再給 D50W（防 Wernicke 腦病變）</text>
  <text x="58" y="497" fill="#475569" font-size="10.2">• 建立雙管路，抽電解質／ASM 濃度</text>

  <!-- Stage 2: 5-20 min -->
  <rect x="258" y="392" width="212" height="122" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="268" y="411" fill="#1d4ed8" font-size="12" font-weight="700">5–20 min · 第一線 BZD 止痙</text>
  <text x="268" y="429" fill="#334155" font-size="10.6">• 有 IV 管路首選：</text>
  <text x="276" y="445" fill="#1e3a8a" font-size="10.6" font-weight="700">IV Lorazepam 0.1 mg/kg（上限 4 mg）</text>
  <text x="268" y="463" fill="#334155" font-size="10.6">• 院前或無 IV 管路首選：</text>
  <text x="276" y="479" fill="#1e3a8a" font-size="10.6" font-weight="700">IM Midazolam 10 mg（&gt;40 kg）</text>
  <text x="268" y="497" fill="#be123c" font-size="10.2">★ 最常失敗原因：BZD 劑量給不足！</text>

  <!-- Stage 3: 20-40 min -->
  <rect x="482" y="392" width="214" height="122" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="492" y="411" fill="#b45309" font-size="12" font-weight="700">20–40 min · 第二線靜脈 ASM</text>
  <text x="492" y="429" fill="#334155" font-size="10.6">ESETT 證實三藥療效相當（約 50%）：</text>
  <text x="492" y="446" fill="#334155" font-size="10.5">1. Levetiracetam 60 mg/kg（上限 4500）</text>
  <text x="492" y="463" fill="#334155" font-size="10.5">2. Valproate 40 mg/kg（上限 3000 mg）</text>
  <text x="492" y="480" fill="#334155" font-size="10.5">3. Fosphenytoin 20 mg PE/kg</text>
  <text x="492" y="497" fill="#475569" font-size="10.2">（Phenytoin 須監測低血壓與心律不整）</text>

  <!-- Stage 4: >40 min -->
  <rect x="708" y="392" width="204" height="122" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="718" y="411" fill="#be123c" font-size="12" font-weight="700">&gt;40 min · 難治型 RSE 麻醉</text>
  <text x="718" y="429" fill="#334155" font-size="10.6">• 氣管內插管保護呼吸道與升壓支持</text>
  <text x="718" y="446" fill="#334155" font-size="10.6">• 持續靜脈麻醉輸注：</text>
  <text x="726" y="462" fill="#334155" font-size="10.5">Midazolam / Propofol / Pentobarbital</text>
  <text x="718" y="480" fill="#be123c" font-size="10.5" font-weight="700">• 必接持續腦波（cEEG）監測！</text>
  <text x="718" y="497" fill="#475569" font-size="10.1">抽搐停止後未醒須立即排除 NCSE</text>
</svg>
