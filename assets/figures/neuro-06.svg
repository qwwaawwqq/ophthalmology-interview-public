<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro06-title neuro06-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro06-title">基底核直接間接運動迴路、深腦刺激術標靶與非典型巴金森 MRI 徵象圖</title>
  <desc id="neuro06-desc">左側呈現巴金森氏病黑質緻密部多巴胺退化導致直接路徑減弱與間接路徑視丘下核及蒼白球內側部過度活化、進而過度抑制視丘與皮質之神經迴路，並標示 STN-DBS 與 GPi-DBS 刺激標靶；右側對照進行性核上眼神經麻痺症中腦蜂鳥徵與多發性系統退化症橋腦十字麵包徵。</desc>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="40" y="51" fill="#ffffff" font-size="16" font-weight="700">基底核運動迴路失衡、深腦刺激標靶（STN／GPi）與非典型巴金森 MRI 徵象</text>
  <text x="918" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-06 · 巴金森迴路與立體定位治療</text>

  <!-- Left Panel: Basal Ganglia Circuit & DBS Targets -->
  <rect x="34" y="82" width="510" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="48" y="106" fill="#0f172a" font-size="14" font-weight="700">A. 巴金森氏病基底核迴路病理與 DBS 立體定位標靶</text>

  <!-- Circuit Nodes -->
  <!-- Motor Cortex -->
  <rect x="158" y="120" width="260" height="36" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="288" y="143" fill="#1e3a8a" font-size="11.5" font-weight="700" text-anchor="middle">運動皮質（Motor Cortex）↓ 動作遲緩</text>

  <!-- Striatum -->
  <rect x="48" y="192" width="188" height="44" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="142" y="211" fill="#0f766e" font-size="11.5" font-weight="700" text-anchor="middle">紋狀體（Striatum）</text>
  <text x="142" y="227" fill="#334155" font-size="9.8" text-anchor="middle">D1 直接路徑↓｜D2 間接去抑制↑</text>

  <!-- SNc degenerated -->
  <rect x="320" y="192" width="212" height="44" rx="8" fill="#fef2f2" stroke="#be123c" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="426" y="211" fill="#be123c" font-size="11.5" font-weight="700" text-anchor="middle">黑質緻密部（SNc）退化 ✕</text>
  <text x="426" y="227" fill="#991b1b" font-size="9.8" text-anchor="middle">α-Synuclein 路易氏體 · 多巴胺枯竭</text>

  <!-- GPe -->
  <rect x="48" y="270" width="136" height="36" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="116" y="292" fill="#334155" font-size="10.8" font-weight="600" text-anchor="middle">蒼白球外側（GPe）↓</text>

  <!-- STN (Hyperactive + DBS target 1) -->
  <rect x="44" y="336" width="182" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="135" y="354" fill="#b45309" font-size="11.2" font-weight="700" text-anchor="middle">視丘下核（STN）↑↑</text>
  <text x="135" y="371" fill="#92400e" font-size="9.6" font-weight="700" text-anchor="middle">⚡ 標靶 1：STN-DBS（顯著減藥）</text>

  <!-- GPi / SNr (Hyperactive + DBS target 2) -->
  <rect x="234" y="336" width="184" height="44" rx="8" fill="#fef2f2" stroke="#be123c" stroke-width="2"/>
  <text x="326" y="354" fill="#be123c" font-size="11.2" font-weight="700" text-anchor="middle">蒼白球內側（GPi/SNr）↑↑</text>
  <text x="326" y="371" fill="#991b1b" font-size="9.6" font-weight="700" text-anchor="middle">⚡ 標靶 2：GPi-DBS（強抑異動）</text>

  <!-- Thalamus -->
  <rect x="400" y="270" width="136" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="468" y="289" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">視丘（VL/VA）↓↓</text>
  <text x="468" y="305" fill="#475569" font-size="9.6" text-anchor="middle">受 GPi 過度 GABA 抑制</text>

  <!-- Connecting Lines -->
  <line x1="226" y1="156" x2="152" y2="192" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="320" y1="214" x2="236" y2="214" stroke="#be123c" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="116" y1="236" x2="116" y2="270" stroke="#64748b" stroke-width="1.8"/>
  <line x1="116" y1="306" x2="116" y2="336" stroke="#b45309" stroke-width="2"/>
  <line x1="186" y1="236" x2="296" y2="336" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4,2"/>
  <line x1="226" y1="358" x2="234" y2="358" stroke="#be123c" stroke-width="2.4"/>
  <line x1="372" y1="336" x2="452" y2="314" stroke="#be123c" stroke-width="2.6"/>
  <line x1="462" y1="270" x2="356" y2="156" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- DBS & Medication Pearls Box -->
  <rect x="46" y="394" width="486" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="413" fill="#0f172a" font-size="11.2" font-weight="700">深腦刺激術（DBS）適應症篩選與藥物調控鐵律：</text>
  <text x="56" y="430" fill="#334155" font-size="9.8">• 最佳候選：原發性 PD 對左旋多巴反應佳（Levodopa 測試顯著改善），但約 5 年後</text>
  <text x="64" y="446" fill="#334155" font-size="9.8">出現嚴重劑末現象（Wearing-off）、開關波動或左旋多巴誘發異動症（Dyskinesia）</text>
  <text x="56" y="464" fill="#be123c" font-size="9.8" font-weight="600">• 手術排除：非典型巴金森（PSP／MSA 療效差）、明顯失智、未控制重度精神病</text>
  <text x="56" y="482" fill="#0f766e" font-size="9.8" font-weight="600">• 用藥安全：禁驟停左旋多巴（防惡性高熱橫紋肌溶解）；促效劑留意衝動控制障礙</text>
  <text x="56" y="500" fill="#475569" font-size="9.6">• &lt;40 歲動作障礙／構音吞嚥異常：必查銅藍蛋白、24h 尿銅與 K-F 環排除威爾森氏症</text>

  <!-- Right Panel: Atypical Parkinsonism MRI Signs -->
  <rect x="556" y="82" width="370" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="570" y="106" fill="#0f172a" font-size="14" font-weight="700">B. 非典型巴金森症候群經典腦幹 MRI 徵象</text>

  <!-- PSP Hummingbird Sign Card -->
  <rect x="570" y="120" width="344" height="184" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="584" y="142" fill="#b45309" font-size="12.5" font-weight="700">1. PSP（進行性核上眼神經麻痺 · Tau 蛋白）</text>
  <rect x="584" y="154" width="112" height="134" rx="8" fill="#1e293b"/>
  <path d="M612,178 L642,172 C650,170 654,176 652,184 C666,194 668,224 652,238 L650,274 L632,274 L630,238 C614,226 616,196 634,188 L612,182 Z" fill="#cbd5e1" stroke="#fef08a" stroke-width="1.8"/>
  <text x="640" y="167" fill="#fef08a" font-size="9.5" font-weight="700" text-anchor="middle">中腦萎縮扁平</text>
  <text x="640" y="216" fill="#0f172a" font-size="9.5" font-weight="700" text-anchor="middle">橋腦保留</text>
  <text x="706" y="168" fill="#92400e" font-size="11" font-weight="700">Hummingbird Sign（蜂鳥徵）</text>
  <text x="706" y="185" fill="#334155" font-size="10.2">• 矢狀切面中腦背蓋顯著萎縮而</text>
  <text x="714" y="201" fill="#334155" font-size="10.2">橋腦膨隆保留；軸狀見牽牛花徵</text>
  <text x="706" y="219" fill="#be123c" font-size="10.2" font-weight="700">• 早期（首年內）反覆向後跌倒</text>
  <text x="706" y="236" fill="#be123c" font-size="10.2" font-weight="700">• 垂直向下凝視麻痺（核上性：頭</text>
  <text x="714" y="252" fill="#334155" font-size="10.2">眼反射仍可誘發眼球垂直轉動）</text>
  <text x="706" y="270" fill="#475569" font-size="10">• 軸性頸軀幹僵硬、左旋多巴反應差</text>

  <!-- MSA Hot-Cross Bun Sign Card -->
  <rect x="570" y="316" width="344" height="198" rx="9" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.4"/>
  <text x="584" y="338" fill="#0f766e" font-size="12.5" font-weight="700">2. MSA（多發性系統退化症 · α-Synuclein）</text>
  <rect x="584" y="350" width="112" height="128" rx="8" fill="#1e293b"/>
  <ellipse cx="640" cy="414" rx="38" ry="34" fill="#475569" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="610" y1="414" x2="670" y2="414" stroke="#fef08a" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="640" y1="386" x2="640" y2="442" stroke="#fef08a" stroke-width="3.2" stroke-linecap="round"/>
  <text x="640" y="468" fill="#5eead4" font-size="9.5" font-weight="700" text-anchor="middle">T2 橋腦十字亮線</text>

  <text x="706" y="364" fill="#0f766e" font-size="10.6" font-weight="700">Hot-Cross Bun Sign（十字麵包徵）</text>
  <text x="706" y="381" fill="#334155" font-size="10.2">• MSA-C：橋腦橫行橋小腦纖維退化</text>
  <text x="714" y="397" fill="#334155" font-size="10.2">呈 T2 十字高訊號＋小腦失調</text>
  <text x="706" y="414" fill="#334155" font-size="10.2">• MSA-P：殼核萎縮伴外側高訊號環</text>
  <text x="714" y="430" fill="#334155" font-size="10.2">（Putaminal rim）＋對稱巴金森症</text>
  <text x="706" y="447" fill="#be123c" font-size="10.2" font-weight="700">• 早期嚴重自主神經衰竭（姿勢性</text>
  <text x="714" y="463" fill="#be123c" font-size="10.2" font-weight="700">低血壓、尿滯留失禁）＋夜間喘鳴</text>
  <text x="582" y="498" fill="#475569" font-size="9.8">補充 CBD（皮質基底核退化）：極度不對稱僵硬失用症＋異己手症候群</text>
</svg>
