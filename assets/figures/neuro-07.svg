  <text x="387" y="343" fill="#0f172a" font-size="9.6">· 標的：外層髓鞘 MOG 蛋白</text>
  <text x="387" y="360" fill="#0f172a" font-size="9.6">· 兒童多為 ADEM（伴腦病變）</text>
  <text x="387" y="377" fill="#0f172a" font-size="9.6">· 成人多嚴重前段視神經炎</text>
  <text x="387" y="394" fill="#0f172a" font-size="9.6">· CSF：OCB 極少見（&lt;15%）</text>
  <text x="387" y="411" fill="#0f172a" font-size="9.6">· 預後：視力恢復優於 AQP4</text>
  <rect x="386" y="426" width="154" height="82" rx="6" fill="#ccfbf1"/>
  <text x="394" y="444" fill="#115e59" font-size="10" font-weight="700">類固醇敏感與防反彈</text>
  <text x="394" y="460" fill="#115e59" font-size="9.5">IVMP 後口服類固醇遞減</text>
  <text x="394" y="476" fill="#115e59" font-size="9.5">緩減 1–3 個月防早期復發</text>
  <text x="394" y="494" fill="#0f766e" font-size="9.5" font-weight="600">復發選月輸 IVIG／RTX</text>

