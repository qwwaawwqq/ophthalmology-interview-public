  <line x1="215" y1="326" x2="368" y2="326" stroke="#fecdd3" stroke-width="1"/>
  <text x="215" y="343" fill="#0f172a" font-size="9.6">· 標的：星狀細胞 AQP4 通道</text>
  <text x="215" y="360" fill="#0f172a" font-size="9.6">· 表型：視神經／LETM／極後區</text>
  <text x="215" y="377" fill="#0f172a" font-size="9.6">  腦幹／間腦猝睡／胼胝體灶</text>
  <text x="215" y="394" fill="#0f172a" font-size="9.6">· CSF：OCB 多陰性（&lt;20%）</text>
  <text x="215" y="411" fill="#0f172a" font-size="9.6">· 急性：IVMP＋及早血漿置換</text>
