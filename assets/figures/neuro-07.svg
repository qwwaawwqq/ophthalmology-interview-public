  <text x="46" y="360" fill="#0f172a" font-size="9.6">· 準則：DIS（≥2 區）＋DIT</text>
  <text x="46" y="377" fill="#0f172a" font-size="9.6">· CSF：OCB (+) 替代 DIT</text>
  <text x="46" y="394" fill="#0f172a" font-size="9.6">· 瞳孔：Marcus Gunn 瞳孔</text>
  <text x="46" y="411" fill="#0f172a" font-size="9.6">· 假復發：發燒 Uhthoff 徵</text>
