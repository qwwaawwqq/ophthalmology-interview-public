  <text x="835" y="203" fill="#92400e" font-size="9.5" font-weight="600" text-anchor="middle">MHC-I 呈獻 · 神經元凋亡</text>
  <text x="754" y="220" fill="#0f172a" font-size="9.6" font-weight="700">· Anti-Hu（ANNA-1）</text>
  <text x="758" y="235" fill="#334155" font-size="9.5">&gt;80% SCLC · 感覺神經元病</text>
  <text x="754" y="252" fill="#0f172a" font-size="9.6" font-weight="700">· Anti-Yo（PCA-1）</text>
  <text x="758" y="267" fill="#334155" font-size="9.5">卵巢／乳癌 · 小腦退化</text>
  <text x="754" y="284" fill="#0f172a" font-size="9.6" font-weight="700">· Anti-Ma2（睪丸腫瘤）</text>
  <text x="758" y="299" fill="#334155" font-size="9.5">年輕男 · 間腦猝睡上視麻痺</text>
  <text x="758" y="316" fill="#be123c" font-size="9.5" font-weight="700">急尋隱匿癌（PET／超音波）</text>

  <!-- Right Bottom Panel: Acute Rescue & Escalation Flow -->
  <rect x="560" y="352" width="370" height="176" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="572" y="374" fill="#0f172a" font-size="13.5" font-weight="700">三、急性免疫搶救與 10–14 天二線升級流程</text>

  <rect x="568" y="384" width="354" height="60" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="576" y="401" fill="#1e3a8a" font-size="10.2" font-weight="700">Step 1 一線搶救（排除 HSV-1 PCR 後即刻啟動，不等抗體）</text>
  <text x="576" y="417" fill="#0f172a" font-size="9.6">· IVMP 1 g/d×3–5d ＋ IVIG（2 g/kg）或隔日 PLEX 5–7 次</text>
  <text x="576" y="433" fill="#be123c" font-size="9.6" font-weight="600">· 鐵律：先做 PLEX 再輸 IVIG（防洗除）＋ 儘早切畸胎瘤</text>

  <path d="M745,445 L745,456 M740,452 L745,457 L750,452" fill="none" stroke="#475569" stroke-width="1.8"/>

  <rect x="568" y="458" width="354" height="60" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="576" y="475" fill="#14532d" font-size="10.2" font-weight="700">Step 2 二線升級（10–14 天仍昏迷／重積癲癇／中樞低通氣）</text>
  <text x="576" y="491" fill="#0f172a" font-size="9.6">· 表面抗體選 Rituximab（抗 CD20）；T 細胞選 Cyclophosphamide</text>
  <text x="576" y="507" fill="#166534" font-size="9.6" font-weight="600">· 給藥前必檢 HBsAg、anti-HBc（防猛爆 B 肝）與結核 IGRA</text>
</svg>
