  <text x="50" y="460" fill="#1e3a8a" font-size="9.5">Ocrelizumab / Natalizumab</text>
  <text x="50" y="476" fill="#1e3a8a" font-size="9.5">S1P 調控劑 · 干擾素-β</text>
  <text x="50" y="494" fill="#1d4ed8" font-size="9.5" font-weight="600">85% 初診屬復發緩解 RRMS</text>

