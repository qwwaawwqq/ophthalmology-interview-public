<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro07-title neuro07-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro07-title">中樞去髓鞘疾病（MS · AQP4-NMOSD · MOGAD）病灶分布與自體免疫腦炎雙軌機轉圖</title>
  <desc id="neuro07-desc">左側三欄對照多發性硬化症（側腦室垂直 Dawson fingers、單側短節段視神經炎、脊髓短節段偏背側索病灶）、AQP4-NMOSD（第三四腦室與極後區病灶、雙側視交叉侵犯、跨三節以上中央灰質 LETM）與 MOGAD（視神經鞘強化、圓錐 H-sign）；右側對照細胞表面突觸抗體與細胞內腫瘤伴生抗體機轉及一二線免疫搶救流程。</desc>

  <!-- Outer background and header -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="40" y="51" fill="#ffffff" font-size="17.5" font-weight="700">中樞去髓鞘三大光譜（MS · AQP4-NMOSD · MOGAD）與自體免疫腦炎雙軌決策</text>
  <text x="920" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-07 · 中樞神經免疫學</text>

  <!-- Left Main Panel: Demyelinating Triad -->
  <rect x="32" y="82" width="516" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="105" fill="#0f172a" font-size="14" font-weight="700">一、中樞神經去髓鞘三大疾病解剖病灶與治療禁忌對照</text>

  <!-- Column 1: MS -->
  <rect x="44" y="116" width="160" height="400" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="44" y="116" width="160" height="30" rx="8" fill="#1d4ed8"/>
  <text x="124" y="136" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">多發性硬化症（MS）</text>

  <!-- MS Brain + Optic + Cord schematic -->
  <text x="54" y="163" fill="#1e3a8a" font-size="11" font-weight="700">腦室旁 · 視神經 · 脊髓</text>
  <!-- Lateral ventricle + Dawson fingers -->
  <ellipse cx="92" cy="198" rx="32" ry="20" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M76,198 Q92,186 108,198 Q92,194 76,198 Z" fill="#cbd5e1"/>
  <ellipse cx="82" cy="182" rx="3.5" ry="7" fill="#1d4ed8"/>
  <ellipse cx="93" cy="180" rx="3.5" ry="8" fill="#1d4ed8"/>
  <ellipse cx="104" cy="183" rx="3.5" ry="7" fill="#1d4ed8"/>
  <text x="92" y="230" fill="#1e40af" font-size="10" text-anchor="middle">Dawson fingers</text>

  <!-- MS Unilateral short optic nerve -->
  <circle cx="152" cy="178" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <circle cx="182" cy="178" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <path d="M152,185 L167,208 L182,185" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <line x1="154" y1="188" x2="160" y2="197" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <text x="167" y="230" fill="#1e40af" font-size="10" text-anchor="middle">單側短節段</text>

  <!-- MS Cord short peripheral wedge -->
  <rect x="64" y="244" width="34" height="58" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <line x1="64" y1="263" x2="98" y2="263" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="64" y1="283" x2="98" y2="283" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="85" y="266" width="10" height="14" rx="3" fill="#1d4ed8"/>
  <ellipse cx="154" cy="273" rx="28" ry="20" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M144,267 L150,273 L144,279 M164,267 L158,273 L164,279 M150,273 L158,273" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M154,253 A28,20 0 0,1 180,268 L164,273 Z" fill="#1d4ed8" opacity="0.85"/>
  <text x="124" y="317" fill="#1e3a8a" font-size="10.5" font-weight="600" text-anchor="middle">&lt;2 椎體 · 偏背／側索楔形灶</text>

  <!-- MS Key bullets -->
  <line x1="54" y1="326" x2="194" y2="326" stroke="#bfdbfe" stroke-width="1"/>
  <text x="54" y="344" fill="#0f172a" font-size="10.5">· 標的：少突膠細胞與髓鞘</text>
  <text x="54" y="362" fill="#0f172a" font-size="10.5">· 準則：DIS（4 區 ≥2）＋DIT</text>
  <text x="54" y="380" fill="#0f172a" font-size="10.5">· CSF：專屬寡株帶 OCB (+) 替代 DIT</text>
  <text x="54" y="398" fill="#0f172a" font-size="10.5">· 瞳孔：Marcus Gunn 瞳孔反應</text>
  <text x="54" y="416" fill="#0f172a" font-size="10.5">· 假復發：發燒 Uhthoff 現象</text>
  <rect x="52" y="430" width="144" height="76" rx="6" fill="#dbeafe"/>
  <text x="60" y="448" fill="#1e3a8a" font-size="10.5" font-weight="700">維持治療（DMT）</text>
  <text x="60" y="465" fill="#1e3a8a" font-size="10">Ocrelizumab、Natalizumab</text>
  <text x="60" y="481" fill="#1e3a8a" font-size="10">S1P 調控劑、干擾素-β</text>
  <text x="60" y="497" fill="#1d4ed8" font-size="10" font-weight="600">85% 初診為復發緩解型 RRMS</text>

  <!-- Column 2: AQP4-NMOSD -->
  <rect x="212" y="116" width="160" height="400" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <rect x="212" y="116" width="160" height="30" rx="8" fill="#be123c"/>
  <text x="292" y="136" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">AQP4-NMOSD</text>

  <text x="222" y="163" fill="#881337" font-size="11" font-weight="700">室管膜周圍 · 視交叉 · LETM</text>
  <!-- Periependymal / Area postrema -->
  <ellipse cx="260" cy="198" rx="32" ry="20" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <rect x="255" y="186" width="10" height="22" rx="3" fill="#cbd5e1"/>
  <circle cx="253" cy="194" r="4" fill="#be123c"/>
  <circle cx="267" cy="194" r="4" fill="#be123c"/>
  <circle cx="260" cy="210" r="5" fill="#be123c"/>
  <text x="260" y="230" fill="#9f1239" font-size="10" text-anchor="middle">極後區／三四腦室旁</text>

  <!-- Bilateral posterior optic + chiasm -->
  <circle cx="320" cy="178" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <circle cx="350" cy="178" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <path d="M320,185 L335,208 L350,185 L343,217 M335,208 L327,217" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <path d="M325,193 L335,208 L345,193" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="335" cy="208" r="4.5" fill="#be123c"/>
  <text x="335" y="230" fill="#9f1239" font-size="10" text-anchor="middle">雙側長節段＋視交叉</text>

  <!-- NMOSD LETM >=3 segments + central gray -->
  <rect x="232" y="244" width="34" height="58" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <line x1="232" y1="263" x2="266" y2="263" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="232" y1="283" x2="266" y2="283" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="242" y="248" width="14" height="50" rx="5" fill="#be123c"/>
  <ellipse cx="322" cy="273" rx="28" ry="20" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <ellipse cx="322" cy="273" rx="14" ry="10" fill="#be123c" opacity="0.88"/>
  <text x="292" y="317" fill="#881337" font-size="10.5" font-weight="600" text-anchor="middle">≥3 椎體中央灰質腫脹 LETM</text>

  <line x1="222" y1="326" x2="362" y2="326" stroke="#fecdd3" stroke-width="1"/>
  <text x="222" y="344" fill="#0f172a" font-size="10.5">· 標的：星狀細胞足突 AQP4 水通道</text>
  <text x="222" y="362" fill="#0f172a" font-size="10.5">· 六大表型：視神經／LETM／極後區</text>
  <text x="222" y="380" fill="#0f172a" font-size="10.5">  腦幹／間腦猝睡／大型胼胝體灶</text>
  <text x="222" y="398" fill="#0f172a" font-size="10.5">· CSF：OCB 多陰性（&lt;20%）</text>
  <text x="222" y="416" fill="#0f172a" font-size="10.5">· 急性：IVMP＋及早血漿置換 PLEX</text>
  <rect x="220" y="430" width="144" height="76" rx="6" fill="#ffe4e6"/>
  <text x="228" y="448" fill="#9f1239" font-size="10.5" font-weight="700">生物製劑與絕對禁忌</text>
  <text x="228" y="465" fill="#881337" font-size="10">選 Eculizumab／Inebilizumab</text>
  <text x="228" y="481" fill="#881337" font-size="10">Satralizumab／Rituximab</text>
  <text x="228" y="497" fill="#be123c" font-size="10" font-weight="700">禁 IFN-β · Fingolimod（惡化）</text>

  <!-- Column 3: MOGAD & ADEM -->
  <rect x="380" y="116" width="156" height="400" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <rect x="380" y="116" width="156" height="30" rx="8" fill="#0f766e"/>
  <text x="458" y="136" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">MOGAD · ADEM</text>

  <text x="390" y="163" fill="#115e59" font-size="11" font-weight="700">絨毛白質 · 視神經鞘 · 圓錐</text>
  <!-- Fluffy bilateral lesions -->
  <ellipse cx="426" cy="198" rx="30" ry="20" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="415" cy="194" r="9" fill="#0f766e" opacity="0.45"/>
  <circle cx="437" cy="201" r="8" fill="#0f766e" opacity="0.45"/>
  <text x="426" y="230" fill="#115e59" font-size="10" text-anchor="middle">大型模糊白質／視丘</text>

  <!-- Perineural optic enhancement + disc edema -->
  <circle cx="486" cy="178" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <circle cx="486" cy="184" r="3" fill="#0f766e"/>
  <circle cx="514" cy="178" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <circle cx="514" cy="184" r="3" fill="#0f766e"/>
  <path d="M486,185 L500,208 L514,185" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="487" y1="186" x2="495" y2="199" stroke="#0f766e" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
  <line x1="513" y1="186" x2="505" y2="199" stroke="#0f766e" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
  <text x="500" y="230" fill="#115e59" font-size="10" text-anchor="middle">前段鞘強化＋視乳頭腫</text>

  <!-- Conus + Axial H-sign -->
  <path d="M400,244 L432,244 L432,282 L416,304 L400,282 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M406,272 L426,272 L416,300 Z" fill="#0f766e" opacity="0.85"/>
  <ellipse cx="488" cy="273" rx="28" ry="20" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M477,263 L477,283 M499,263 L499,283 M477,273 L499,273" fill="none" stroke="#0f766e" stroke-width="4.5" stroke-linecap="round"/>
  <text x="458" y="317" fill="#115e59" font-size="10.5" font-weight="600" text-anchor="middle">脊髓圓錐好發 · 軸切 H-sign</text>

  <line x1="390" y1="326" x2="526" y2="326" stroke="#99f6e4" stroke-width="1"/>
  <text x="390" y="344" fill="#0f172a" font-size="10.5">· 標的：外層髓鞘 MOG 糖蛋白</text>
  <text x="390" y="362" fill="#0f172a" font-size="10.5">· 兒童多表現 ADEM（必伴腦病變）</text>
  <text x="390" y="380" fill="#0f172a" font-size="10.5">· 成人多表現嚴重前段視神經炎</text>
  <text x="390" y="398" fill="#0f172a" font-size="10.5">· CSF：OCB 極少陽性（&lt;15%）</text>
  <text x="390" y="416" fill="#0f172a" font-size="10.5">· 預後：視力與運動恢復優於 AQP4</text>
  <rect x="388" y="430" width="140" height="76" rx="6" fill="#ccfbf1"/>
  <text x="396" y="448" fill="#115e59" font-size="10.5" font-weight="700">類固醇敏感與防反彈</text>
  <text x="396" y="465" fill="#115e59" font-size="10">IVMP 後需口服類固醇</text>
  <text x="396" y="481" fill="#115e59" font-size="10">緩慢遞減 1–3 個月防復發</text>
  <text x="396" y="497" fill="#0f766e" font-size="10" font-weight="600">復發型選月輸注 IVIG／RTX</text>

  <!-- Right Top Panel: Autoimmune Encephalitis Dual-Track -->
  <rect x="560" y="82" width="368" height="262" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="574" y="105" fill="#0f172a" font-size="14" font-weight="700">二、自體免疫腦炎雙軌抗體病理與腫瘤配對</text>

  <!-- Track A: Cell-surface -->
  <rect x="572" y="116" width="166" height="216" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <rect x="572" y="116" width="166" height="26" rx="8" fill="#0f766e"/>
  <text x="655" y="134" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">細胞表面突觸抗體（可逆）</text>
  <!-- Synapse receptor internalization icon -->
  <path d="M590,168 Q655,156 720,168" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="618" y="156" width="10" height="14" rx="2" fill="#0d9488"/>
  <rect x="678" y="156" width="10" height="14" rx="2" fill="#0d9488"/>
  <circle cx="655" cy="182" r="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="655" y="204" fill="#115e59" font-size="10" font-weight="600" text-anchor="middle">IgG 交聯受體內吞 · 神經元存活</text>
  <text x="580" y="223" fill="#0f172a" font-size="10" font-weight="700">· Anti-NMDAR（送檢 CSF）</text>
  <text x="586" y="238" fill="#334155" font-size="9.8">年輕女 · 卵巢畸胎瘤 · 口臉異動</text>
  <text x="586" y="252" fill="#334155" font-size="9.8">精神症狀 · extreme delta brush</text>
  <text x="580" y="270" fill="#0f172a" font-size="10" font-weight="700">· Anti-LGI1（血清＋CSF）</text>
  <text x="586" y="285" fill="#334155" font-size="9.8">中老年男 · FBDS 抽動 · 低血鈉</text>
  <text x="580" y="303" fill="#0f172a" font-size="10" font-weight="700">· GABA-B（SCLC）／CASPR2（胸腺）</text>
  <text x="586" y="319" fill="#0f766e" font-size="10" font-weight="700">免疫治療反應佳（約 75–80% 恢復）</text>

  <!-- Track B: Intracellular Onconeuronal -->
  <rect x="748" y="116" width="168" height="216" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <rect x="748" y="116" width="168" height="26" rx="8" fill="#b45309"/>
  <text x="832" y="134" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">細胞內腫瘤伴生抗體（毒殺）</text>
  <!-- CD8+ T cell neuronal apoptosis icon -->
  <circle cx="810" cy="170" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="810" cy="170" r="5" fill="#b45309"/>
  <circle cx="856" cy="170" r="11" fill="#be123c"/>
  <text x="856" y="174" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">CD8+</text>
  <line x1="843" y1="170" x2="826" y2="170" stroke="#be123c" stroke-width="2"/>
  <text x="832" y="204" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">MHC-I 呈獻 · 不可逆神經元凋亡</text>
  <text x="756" y="223" fill="#0f172a" font-size="10" font-weight="700">· Anti-Hu（ANNA-1）</text>
  <text x="762" y="238" fill="#334155" font-size="9.8">&gt;80% 小細胞肺癌 · 感覺神經元病</text>
  <text x="756" y="256" fill="#0f172a" font-size="10" font-weight="700">· Anti-Yo（PCA-1）</text>
  <text x="762" y="271" fill="#334155" font-size="9.8">卵巢癌／乳癌 · 亞急性小腦退化</text>
  <text x="756" y="289" fill="#0f172a" font-size="10" font-weight="700">· Anti-Ma2</text>
  <text x="762" y="304" fill="#334155" font-size="9.8">年輕男睪丸腫瘤 · 間腦猝睡上視麻痺</text>
  <text x="762" y="320" fill="#be123c" font-size="10" font-weight="700">急尋隱匿癌症（FDG-PET／超音波）</text>

  <!-- Right Bottom Panel: Acute Rescue & Escalation Flow -->
  <rect x="560" y="356" width="368" height="172" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="574" y="379" fill="#0f172a" font-size="14" font-weight="700">三、急性免疫搶救與 10–14 天二線升級流程</text>

  <rect x="572" y="390" width="344" height="54" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="582" y="408" fill="#1e3a8a" font-size="11" font-weight="700">Step 1 一線搶救（排除 HSV-1 PCR 等感染後即刻啟動，不等抗體）</text>
  <text x="582" y="425" fill="#0f172a" font-size="10.2">· IVMP 1000 mg/d × 3–5 天 ＋ IVIG（2 g/kg 分 5 天）或隔日 PLEX 5–7 次</text>
  <text x="582" y="439" fill="#be123c" font-size="10" font-weight="600">· 順序鐵律：先做 PLEX 再輸 IVIG（防球蛋白被洗除）＋ 儘早切除畸胎瘤</text>

  <!-- Down arrow -->
  <path d="M744,445 L744,458 M739,454 L744,460 L749,454" fill="none" stroke="#475569" stroke-width="1.8"/>

  <rect x="572" y="462" width="344" height="54" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="582" y="480" fill="#14532d" font-size="11" font-weight="700">Step 2 二線升級（一線後 10–14 天仍昏迷／重積癲癇／中樞低通氣）</text>
  <text x="582" y="497" fill="#0f172a" font-size="10.2">· 表面抗體首選 Rituximab（抗 CD20）；T 細胞毒殺選 Cyclophosphamide</text>
  <text x="582" y="511" fill="#166534" font-size="10" font-weight="600">· 給藥前必檢 HBsAg、anti-HBc（防猛爆性 B 肝再活化）與潛伏結核 IGRA</text>
</svg>
