  <text x="574" y="220" fill="#0f172a" font-size="9.6" font-weight="700">· Anti-NMDAR（驗 CSF）</text>
  <text x="578" y="235" fill="#334155" font-size="9.5">年輕女 · 畸胎瘤 · 口臉異動</text>
  <text x="578" y="250" fill="#334155" font-size="9.5">精神症狀 · extreme delta</text>
  <text x="574" y="267" fill="#0f172a" font-size="9.6" font-weight="700">· Anti-LGI1（血清＋CSF）</text>
  <text x="578" y="282" fill="#334155" font-size="9.5">中老年男 · FBDS · 低血鈉</text>
  <text x="574" y="299" fill="#0f172a" font-size="9.5" font-weight="700">· GABA-B(SCLC) / CASPR2</text>
  <text x="578" y="315" fill="#0f766e" font-size="9.5" font-weight="700">免疫治療佳（75–80% 恢復）</text>

