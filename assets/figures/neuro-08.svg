<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro08-title neuro08-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro08-title">中樞神經感染 CSF 四軸判讀、環狀強化病灶 DWI 鑑別與顱內高壓（IICP）階梯處置圖</title>
  <desc id="neuro08-desc">左上整合腰椎穿刺前頭部電腦斷層紅旗指徵、經驗性抗生素不延誤鐵律與四大腦膜腦炎腦脊髓液判讀；左下比較化膿性腦膿瘍與壞死性膠質母細胞瘤之擴散加權影像（DWI/ADC）及 WHO CNS5 膠質瘤分子分流；右側呈現 Monro-Kellie 容積壓力指數曲線、腦灌流壓公式與顱內高壓四階降壓策略。</desc>

  <!-- Outer background and header -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="40" y="51" fill="#ffffff" font-size="17.5" font-weight="700">中樞神經感染 CSF 判讀 · 環狀強化腦瘤／膿瘍 DWI 鑑別 · 顱內高壓階梯處置</text>
  <text x="920" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-08 · 感染 · 腫瘤 · 重症腦壓</text>

  <!-- Top-Left Panel: LP Red Flags & CSF 4-Infection Matrix -->
  <rect x="32" y="82" width="484" height="218" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="104" fill="#0f172a" font-size="13.5" font-weight="700">一、腰穿前頭部 CT 紅旗指徵與四大腦膜腦炎腦脊髓液（CSF）判讀</text>

  <rect x="44" y="112" width="460" height="44" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.1"/>
  <text x="54" y="129" fill="#9f1239" font-size="10.5" font-weight="700">CT 紅旗：免疫不全 · 中樞病灶史 · 新發癲癇 · 視乳頭水腫 · 意識改變 · 局部神經缺損</text>
  <text x="54" y="146" fill="#be123c" font-size="10.2" font-weight="600">鐵律：先抽血培養＋立即給 Dexamethasone＋Ceftriaxone＋Vancomycin（&gt;50 歲加 Ampicillin），絕不等 CT！</text>

  <!-- CSF compact table -->
  <rect x="44" y="162" width="460" height="22" rx="4" fill="#1e293b"/>
  <text x="52" y="177" fill="#ffffff" font-size="10" font-weight="700">病原類型</text>
  <text x="142" y="177" fill="#ffffff" font-size="10" font-weight="700">開放壓／優勢細胞</text>
  <text x="278" y="177" fill="#ffffff" font-size="10" font-weight="700">蛋白 · 糖比值</text>
  <text x="382" y="177" fill="#ffffff" font-size="10" font-weight="700">關鍵確診／治療</text>

  <rect x="44" y="186" width="460" height="25" fill="#eff6ff"/>
  <text x="52" y="202" fill="#1e3a8a" font-size="10" font-weight="700">細菌性腦膜炎</text>
  <text x="142" y="202" fill="#0f172a" font-size="9.8">&gt;250 · PMN 飆升(&gt;80%)</text>
  <text x="278" y="202" fill="#be123c" font-size="9.8" font-weight="600">蛋白↑↑↑ · 糖比 &lt;0.4</text>
  <text x="382" y="202" fill="#0f172a" font-size="9.8">培養／Dex＋3代頭孢＋Vanc</text>

  <rect x="44" y="213" width="460" height="25" fill="#f8fafc"/>
  <text x="52" y="229" fill="#0f766e" font-size="10" font-weight="700">結核性腦膜炎</text>
  <text x="142" y="229" fill="#0f172a" font-size="9.8">升高 · 淋巴球優勢</text>
  <text x="278" y="229" fill="#0f766e" font-size="9.8" font-weight="600">蛋白極高 · 糖比 &lt;0.4</text>
  <text x="382" y="229" fill="#0f172a" font-size="9.8">Xpert／RIPE＋類固醇防腦水腫</text>

  <rect x="44" y="240" width="460" height="25" fill="#fffbeb"/>
  <text x="52" y="256" fill="#b45309" font-size="10" font-weight="700">隱球菌腦膜炎</text>
  <text x="142" y="256" fill="#b45309" font-size="9.8" font-weight="600">極高(&gt;300) · 淋巴球</text>
  <text x="278" y="256" fill="#0f172a" font-size="9.8">蛋白↑↑ · 糖輕中度↓</text>
  <text x="382" y="256" fill="#0f172a" font-size="9.8">CrAg 抗原／AmB＋5-FC＋引流</text>

  <rect x="44" y="267" width="460" height="25" fill="#f0fdf4"/>
  <text x="52" y="283" fill="#166534" font-size="10" font-weight="700">病毒／HSV-1</text>
  <text x="142" y="283" fill="#0f172a" font-size="9.8">正常或微升 · 淋巴球(±RBC)</text>
  <text x="278" y="283" fill="#166534" font-size="9.8" font-weight="600">蛋白輕升 · 糖比正常 ≥0.6</text>
  <text x="382" y="283" fill="#0f172a" font-size="9.8">HSV PCR／靜脈 Acyclovir</text>

  <!-- Bottom-Left Panel: Ring-Enhancing DWI & WHO CNS5 -->
  <rect x="32" y="310" width="484" height="218" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="332" fill="#0f172a" font-size="13.5" font-weight="700">二、環狀強化病灶 DWI 鑑別與成人腦瘤（WHO CNS5）分子分流</text>

  <!-- Abscess vs GBM schematic -->
  <rect x="44" y="342" width="138" height="174" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.1"/>
  <text x="113" y="360" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">化膿性腦膿瘍</text>
  <circle cx="113" cy="402" r="28" fill="#fde68a" stroke="#dc2626" stroke-width="3.5"/>
  <circle cx="113" cy="402" r="21" fill="#fef08a"/>
  <text x="113" y="400" fill="#7f1d1d" font-size="9.5" font-weight="700" text-anchor="middle">DWI 亮</text>
  <text x="113" y="413" fill="#7f1d1d" font-size="9" text-anchor="middle">ADC 暗</text>
  <text x="52" y="446" fill="#0f172a" font-size="9.8">· 膿液高黏稠擴散受限</text>
  <text x="52" y="462" fill="#0f172a" font-size="9.8">· 薄平滑環（腦室側薄）</text>
  <text x="52" y="478" fill="#be123c" font-size="9.8" font-weight="700">· 禁做腰穿（防腦疝氣）</text>
  <text x="52" y="494" fill="#0f172a" font-size="9.8">· 立體定位抽吸＋抗生素</text>

  <rect x="190" y="342" width="142" height="174" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="261" y="360" fill="#1e3a8a" font-size="11" font-weight="700" text-anchor="middle">膠質母細胞瘤 GBM</text>
  <path d="M232,398 Q236,372 262,374 Q290,375 291,401 Q288,428 260,429 Q234,426 232,398 Z" fill="#1e293b" stroke="#2563eb" stroke-width="5"/>
  <text x="261" y="400" fill="#e2e8f0" font-size="9.5" font-weight="700" text-anchor="middle">DWI 暗</text>
  <text x="261" y="413" fill="#93c5fd" font-size="9" text-anchor="middle">ADC 亮</text>
  <text x="198" y="446" fill="#0f172a" font-size="9.8">· 中央液化壞死非受限</text>
  <text x="198" y="462" fill="#0f172a" font-size="9.8">· 厚壁不規則跨胼胝體</text>
  <text x="198" y="478" fill="#1d4ed8" font-size="9.8" font-weight="700">· Dexamethasone 消水腫</text>
  <text x="198" y="494" fill="#0f172a" font-size="9.8">· 切除＋TMZ 同步放化療</text>

  <!-- WHO CNS5 + PCNSL / Mets box -->
  <rect x="340" y="342" width="164" height="174" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="422" y="360" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">WHO CNS5 與腫瘤要點</text>
  <text x="348" y="379" fill="#0f766e" font-size="9.8" font-weight="700">· IDH 突變＋1p/19q 共缺失</text>
  <text x="354" y="393" fill="#334155" font-size="9.5">→ 少突膠質細胞瘤（常鈣化）</text>
  <text x="348" y="410" fill="#1d4ed8" font-size="9.8" font-weight="700">· IDH 突變＋ATRX/TP53 變異</text>
  <text x="354" y="424" fill="#334155" font-size="9.5">→ IDH 突變型星狀細胞瘤</text>
  <text x="348" y="441" fill="#b45309" font-size="9.8" font-weight="700">· 腦／脊椎轉移瘤（最常見惡性）</text>
  <text x="354" y="455" fill="#334155" font-size="9.5">灰白質交界；攝護腺為成骨性</text>
  <rect x="346" y="464" width="152" height="44" rx="5" fill="#ffe4e6"/>
  <text x="352" y="480" fill="#be123c" font-size="9.6" font-weight="700">PCNSL 淋巴瘤切片鐵律</text>
  <text x="352" y="495" fill="#881337" font-size="9.3">切片前禁先給類固醇防腫瘤溶解</text>

  <!-- Right Panel: Monro-Kellie Curve & IICP Staircase -->
  <rect x="528" y="82" width="400" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="542" y="104" fill="#0f172a" font-size="13.5" font-weight="700">三、Monro-Kellie 壓力曲線 · 水腦引流與 IICP 階梯處置</text>

  <!-- Monro-Kellie Chart -->
  <rect x="542" y="114" width="372" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Axes -->
  <line x1="582" y1="236" x2="892" y2="236" stroke="#475569" stroke-width="1.5"/>
  <line x1="582" y1="236" x2="582" y2="128" stroke="#475569" stroke-width="1.5"/>
  <text x="576" y="138" fill="#475569" font-size="9.5" text-anchor="end">ICP</text>
  <text x="576" y="188" fill="#be123c" font-size="9.5" font-weight="700" text-anchor="end">22</text>
  <line x1="582" y1="185" x2="892" y2="185" stroke="#fda4af" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="890" y="252" fill="#475569" font-size="9.5" text-anchor="end">顱內腫塊／水腫／CSF 容積 →</text>

  <!-- Exponential curve -->
  <path d="M586,226 Q680,224 736,206 Q784,185 826,130" fill="none" stroke="#be123c" stroke-width="3"/>
  <circle cx="766" cy="185" r="4.5" fill="#be123c"/>
  <text x="640" y="218" fill="#0f766e" font-size="10" font-weight="600">代償期（CSF／靜脈血外移）</text>
  <text x="776" y="176" fill="#be123c" font-size="10" font-weight="700">失代償陡升（腦疝氣危象）</text>

  <!-- CPP Badge -->
  <rect x="594" y="124" width="184" height="36" rx="6" fill="#0f172a"/>
  <text x="686" y="140" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">CPP = MAP − ICP（目標 60–70）</text>
  <text x="686" y="154" fill="#e2e8f0" font-size="9.5" text-anchor="middle">ICP 控制目標 &lt; 22 mmHg</text>

  <!-- Staircase Tiers -->
  <rect x="542" y="272" width="372" height="54" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.1"/>
  <text x="552" y="290" fill="#14532d" font-size="11" font-weight="700">Tier 0 基礎靜脈回流保護與環境穩定</text>
  <text x="552" y="306" fill="#0f172a" font-size="10">· 床頭抬高 30° 且頭頸正中（防內頸靜脈受壓）· 鎮靜止痛 · 控制發燒與癲癇</text>
  <text x="552" y="320" fill="#166534" font-size="9.8">· 維持正常血氧與正常偏低二氧化碳（PaCO2 35–40 mmHg），避免低張輸液</text>

  <rect x="542" y="332" width="372" height="58" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="552" y="350" fill="#1e3a8a" font-size="11" font-weight="700">Tier 1 顱內壓黃金監測（EVD）與水腦症解剖分流</text>
  <text x="552" y="366" fill="#0f172a" font-size="10">· GCS ≤ 8 置放腦室外引流管 EVD（測壓黃金標準＋即時引流 CSF 降壓）</text>
  <text x="552" y="381" fill="#1e40af" font-size="9.8">· 導水管腫瘤阻塞水腦行內視鏡第三腦室造口 ETV；交通性水腦行 VP shunt</text>

  <rect x="542" y="396" width="372" height="60" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="552" y="414" fill="#92400e" font-size="11" font-weight="700">Tier 2 高滲透壓療法與腦水腫機轉對症用藥</text>
  <text x="552" y="430" fill="#0f172a" font-size="10">· 3% 高張鹽水（擴容保血壓護 CPP，低血壓首選）vs Mannitol（低血壓／腎衰禁）</text>
  <text x="552" y="446" fill="#b45309" font-size="9.8" font-weight="600">· 腫瘤／膿瘍「血管源性水腫」給 Dexamethasone；中風「細胞毒性水腫」禁類固醇</text>

  <rect x="542" y="462" width="372" height="56" rx="7" fill="#fff1f2" stroke="#fda4af" stroke-width="1.1"/>
  <text x="552" y="480" fill="#9f1239" font-size="11" font-weight="700">Tier 3 鉤回疝氣危象（同側瞳孔散大 · Cushing 三徵象）救援</text>
  <text x="552" y="496" fill="#0f172a" font-size="10">· 僅限橋接手術短暫過度換氣（PaCO2 30–35，嚴禁 &lt;25 mmHg 防腦缺血梗塞）</text>
  <text x="552" y="511" fill="#be123c" font-size="9.8" font-weight="600">· 緊急減壓性顱骨切除術／血腫腫塊清除，或難治型給予高劑量巴比妥酸鹽昏迷</text>
</svg>
