<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro08-title neuro08-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro08-title">中樞神經感染 CSF 四軸判讀、環狀強化病灶 DWI 鑑別與顱內高壓（IICP）階梯處置圖</title>
  <desc id="neuro08-desc">左上整合腰椎穿刺前頭部電腦斷層紅旗指徵、經驗性抗生素不延誤鐵律與四大腦膜腦炎腦脊髓液判讀；左下比較化膿性腦膿瘍與壞死性膠質母細胞瘤之擴散加權影像（DWI/ADC）及 WHO CNS5 膠質瘤分子分流；右側呈現 Monro-Kellie 容積壓力指數曲線、腦灌流壓公式與顱內高壓四階降壓策略。</desc>

  <!-- Outer background and header -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="40" y="51" fill="#ffffff" font-size="15.8" font-weight="700">中樞神經感染 CSF 判讀 · 環狀強化腦瘤／膿瘍 DWI 鑑別 · 顱內高壓階梯處置</text>
  <text x="920" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-08 · 感染 · 腫瘤 · 重症腦壓</text>

  <!-- Top-Left Panel: LP Red Flags & CSF 4-Infection Matrix -->
  <rect x="32" y="82" width="484" height="218" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="104" fill="#0f172a" font-size="13" font-weight="700">一、腰穿前頭部 CT 紅旗指徵與四大腦膜腦炎腦脊髓液（CSF）判讀</text>

  <rect x="42" y="112" width="464" height="44" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.1"/>
  <text x="50" y="128" fill="#9f1239" font-size="9.8" font-weight="700">CT 紅旗：免疫不全 · 病灶史 · 新癲癇 · 視乳頭腫 · 意識變 · 局部缺損</text>
  <text x="50" y="145" fill="#be123c" font-size="9.6" font-weight="600">鐵律：血培養後即給 Dex＋Ceftriaxone＋Vanc（&gt;50 歲＋Amp），不等 CT！</text>

  <!-- CSF compact table -->
  <rect x="42" y="162" width="464" height="22" rx="4" fill="#1e293b"/>
  <text x="50" y="177" fill="#ffffff" font-size="9.8" font-weight="700">病原類型</text>
  <text x="134" y="177" fill="#ffffff" font-size="9.8" font-weight="700">開放壓／優勢細胞</text>
  <text x="262" y="177" fill="#ffffff" font-size="9.8" font-weight="700">蛋白 · 糖比值</text>
  <text x="366" y="177" fill="#ffffff" font-size="9.8" font-weight="700">關鍵確診／治療</text>

  <rect x="42" y="186" width="464" height="25" fill="#eff6ff"/>
  <text x="50" y="202" fill="#1e3a8a" font-size="9.8" font-weight="700">細菌性腦膜炎</text>
  <text x="134" y="202" fill="#0f172a" font-size="9.5">&gt;250 · PMN(&gt;80%)</text>
  <text x="262" y="202" fill="#be123c" font-size="9.5" font-weight="600">蛋白↑↑↑ · 糖 &lt;0.4</text>
  <text x="366" y="202" fill="#0f172a" font-size="9.5">培養／Dex＋3代頭孢＋Vanc</text>

  <rect x="42" y="213" width="464" height="25" fill="#f8fafc"/>
  <text x="50" y="229" fill="#0f766e" font-size="9.8" font-weight="700">結核性腦膜炎</text>
  <text x="134" y="229" fill="#0f172a" font-size="9.5">升高 · 淋巴球優勢</text>
  <text x="262" y="229" fill="#0f766e" font-size="9.5" font-weight="600">蛋白極高 · 糖 &lt;0.4</text>
  <text x="366" y="229" fill="#0f172a" font-size="9.5">Xpert／RIPE＋輔助類固醇</text>

  <rect x="42" y="240" width="464" height="25" fill="#fffbeb"/>
  <text x="50" y="256" fill="#b45309" font-size="9.8" font-weight="700">隱球菌腦膜炎</text>
  <text x="134" y="256" fill="#b45309" font-size="9.5" font-weight="600">極高(&gt;300) · 淋巴球</text>
  <text x="262" y="256" fill="#0f172a" font-size="9.5">蛋白↑↑ · 糖輕中↓</text>
  <text x="366" y="256" fill="#0f172a" font-size="9.5">CrAg／AmB＋5-FC＋引流</text>

  <rect x="42" y="267" width="464" height="25" fill="#f0fdf4"/>
  <text x="50" y="283" fill="#166534" font-size="9.8" font-weight="700">病毒／HSV-1</text>
  <text x="134" y="283" fill="#0f172a" font-size="9.5">正常或升 · 淋巴(±RBC)</text>
  <text x="262" y="283" fill="#166534" font-size="9.5" font-weight="600">蛋白輕升 · 糖 ≥0.6</text>
  <text x="366" y="283" fill="#0f172a" font-size="9.5">HSV PCR／IV Acyclovir</text>

  <!-- Bottom-Left Panel: Ring-Enhancing DWI & WHO CNS5 -->
  <rect x="32" y="310" width="484" height="218" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="332" fill="#0f172a" font-size="13" font-weight="700">二、環狀強化病灶 DWI 鑑別與成人腦瘤（WHO CNS5）分子分流</text>

  <!-- Abscess vs GBM schematic -->
  <rect x="42" y="342" width="138" height="174" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.1"/>
  <text x="111" y="360" fill="#991b1b" font-size="10.8" font-weight="700" text-anchor="middle">化膿性腦膿瘍</text>
  <circle cx="111" cy="402" r="28" fill="#fde68a" stroke="#dc2626" stroke-width="3.5"/>
  <circle cx="111" cy="402" r="21" fill="#fef08a"/>
  <text x="111" y="398" fill="#7f1d1d" font-size="9.5" font-weight="700" text-anchor="middle">DWI 亮</text>
  <text x="111" y="413" fill="#7f1d1d" font-size="9.5" text-anchor="middle">ADC 暗</text>
  <text x="50" y="446" fill="#0f172a" font-size="9.6">· 膿液高黏稠擴散受限</text>
  <text x="50" y="462" fill="#0f172a" font-size="9.6">· 薄平滑環（腦室側薄）</text>
  <text x="50" y="478" fill="#be123c" font-size="9.6" font-weight="700">· 禁做腰穿（防腦疝氣）</text>
  <text x="50" y="494" fill="#0f172a" font-size="9.6">· 立體定位抽吸＋抗生素</text>

  <rect x="188" y="342" width="142" height="174" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="259" y="360" fill="#1e3a8a" font-size="10.8" font-weight="700" text-anchor="middle">膠質母細胞瘤 GBM</text>
  <path d="M230,398 Q234,372 260,374 Q288,375 289,401 Q286,428 258,429 Q232,426 230,398 Z" fill="#1e293b" stroke="#2563eb" stroke-width="5"/>
  <text x="259" y="398" fill="#e2e8f0" font-size="9.5" font-weight="700" text-anchor="middle">DWI 暗</text>
  <text x="259" y="413" fill="#93c5fd" font-size="9.5" text-anchor="middle">ADC 亮</text>
  <text x="196" y="446" fill="#0f172a" font-size="9.6">· 中央液化壞死非受限</text>
  <text x="196" y="462" fill="#0f172a" font-size="9.6">· 厚壁不規則跨胼胝體</text>
  <text x="196" y="478" fill="#1d4ed8" font-size="9.6" font-weight="700">· Dexamethasone 消水腫</text>
  <text x="196" y="494" fill="#0f172a" font-size="9.6">· 切除＋TMZ 同步放化療</text>

  <!-- WHO CNS5 + PCNSL / Mets box -->
  <rect x="338" y="342" width="168" height="174" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="422" y="360" fill="#0f172a" font-size="10.8" font-weight="700" text-anchor="middle">WHO CNS5 與腫瘤要點</text>
  <text x="345" y="378" fill="#0f766e" font-size="9.5" font-weight="700">· IDH 突變＋1p/19q 共缺失</text>
  <text x="351" y="393" fill="#334155" font-size="9.5">→ 少突膠質細胞瘤（常鈣化）</text>
  <text x="345" y="409" fill="#1d4ed8" font-size="9.5" font-weight="700">· IDH 突變＋ATRX/TP53</text>
  <text x="351" y="424" fill="#334155" font-size="9.5">→ IDH 突變型星狀細胞瘤</text>
  <text x="345" y="440" fill="#b45309" font-size="9.5" font-weight="700">· 腦／脊椎轉移（最常見惡性）</text>
  <text x="351" y="455" fill="#334155" font-size="9.5">灰白質交界；攝護腺成骨性</text>
  <rect x="344" y="464" width="156" height="44" rx="5" fill="#ffe4e6"/>
  <text x="350" y="479" fill="#be123c" font-size="9.6" font-weight="700">PCNSL 淋巴瘤切片鐵律</text>
  <text x="350" y="495" fill="#881337" font-size="9.5">切片前禁類固醇防腫瘤溶解</text>

  <!-- Right Panel: Monro-Kellie Curve & IICP Staircase -->
  <rect x="526" y="82" width="404" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="538" y="104" fill="#0f172a" font-size="12.5" font-weight="700">三、Monro-Kellie 壓力曲線 · 水腦引流與 IICP 階梯處置</text>

  <!-- Monro-Kellie Chart -->
  <rect x="538" y="114" width="382" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="582" y1="236" x2="902" y2="236" stroke="#475569" stroke-width="1.5"/>
  <line x1="582" y1="236" x2="582" y2="128" stroke="#475569" stroke-width="1.5"/>
  <text x="576" y="138" fill="#475569" font-size="9.5" text-anchor="end">ICP</text>
  <text x="576" y="188" fill="#be123c" font-size="9.5" font-weight="700" text-anchor="end">22</text>
  <line x1="582" y1="185" x2="902" y2="185" stroke="#fda4af" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="900" y="252" fill="#475569" font-size="9.5" text-anchor="end">顱內腫塊／水腫／CSF 容積 →</text>

  <path d="M586,226 Q680,224 736,206 Q784,185 826,130" fill="none" stroke="#be123c" stroke-width="3"/>
  <circle cx="766" cy="185" r="4.5" fill="#be123c"/>
  <text x="640" y="218" fill="#0f766e" font-size="9.8" font-weight="600">代償期（CSF／靜脈血外移）</text>
  <text x="774" y="176" fill="#be123c" font-size="9.8" font-weight="700">失代償陡升（腦疝危象）</text>

  <!-- CPP Badge -->
  <rect x="590" y="122" width="206" height="38" rx="6" fill="#0f172a"/>
  <text x="693" y="138" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">CPP = MAP − ICP（目標 60–70）</text>
  <text x="693" y="153" fill="#e2e8f0" font-size="9.5" text-anchor="middle">ICP 控制目標 &lt; 22 mmHg</text>

  <!-- Staircase Tiers -->
  <rect x="538" y="270" width="382" height="56" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.1"/>
  <text x="546" y="287" fill="#14532d" font-size="10.6" font-weight="700">Tier 0 基礎靜脈回流保護與環境穩定</text>
  <text x="546" y="303" fill="#0f172a" font-size="9.6">· 床頭抬高 30° 頭頸正中（防頸靜脈受壓）· 鎮靜止痛 · 控燒止痙</text>
  <text x="546" y="319" fill="#166534" font-size="9.6">· 維持正常血氧與 PaCO2 35–40 mmHg，嚴禁含糖或低張輸液</text>

  <rect x="538" y="332" width="382" height="58" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="546" y="349" fill="#1e3a8a" font-size="10.6" font-weight="700">Tier 1 顱內壓黃金監測（EVD）與水腦症解剖分流</text>
  <text x="546" y="365" fill="#0f172a" font-size="9.6">· GCS ≤ 8 置腦室外引流 EVD（測壓黃金標準＋引流 CSF 降壓）</text>
  <text x="546" y="381" fill="#1e40af" font-size="9.6">· 導水管阻塞水腦行內視鏡造口 ETV；交通性水腦行 VP shunt</text>

  <rect x="538" y="396" width="382" height="58" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="546" y="413" fill="#92400e" font-size="10.6" font-weight="700">Tier 2 高滲透壓療法與腦水腫機轉對症用藥</text>
  <text x="546" y="429" fill="#0f172a" font-size="9.6">· 3% 高張鹽水（保血壓護 CPP，低血壓首選）vs Mannitol（腎衰禁）</text>
  <text x="546" y="445" fill="#b45309" font-size="9.6" font-weight="600">· 腫瘤膿瘍「血管源水腫」給類固醇；中風「細胞毒水腫」禁類固醇</text>

  <rect x="538" y="460" width="382" height="58" rx="7" fill="#fff1f2" stroke="#fda4af" stroke-width="1.1"/>
  <text x="546" y="477" fill="#9f1239" font-size="10.6" font-weight="700">Tier 3 鉤回疝氣危象（同側瞳孔散大 · Cushing 三徵象）救援</text>
  <text x="546" y="493" fill="#0f172a" font-size="9.6">· 僅限橋接手術短暫過度換氣（PaCO2 30–35，禁 &lt;25 防腦缺血）</text>
  <text x="546" y="509" fill="#be123c" font-size="9.6" font-weight="600">· 緊急減壓性顱骨切除／血腫清除，難治型予巴比妥酸鹽昏迷</text>
</svg>
