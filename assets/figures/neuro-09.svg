<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro09-title neuro09-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro09-title">脊髓橫切面三大傳導徑路症候群定位與周邊神經病變（GBS · CIDP · 代謝遺傳型）電生理分流圖</title>
  <desc id="neuro09-desc">左側繪製脊髓橫切面後索、外側皮質脊髓徑與前外側脊髓視丘徑及其內頸外薦體位排列，對照中央髓、前髓、Brown-Sequard 半切與圓錐馬尾症候群；右側整合格林巴利症候群 20/30/40 插管警戒值、神經傳導檢查軸索對脫髓鞘波形比較及糖尿病、CMT1A 與台灣晚發型 ATTRv 類澱粉神經病變鑑別。</desc>

  <!-- Outer background and header -->
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="40" y="51" fill="#ffffff" font-size="17.5" font-weight="700">脊髓橫切面三大徑路症候群定位 · GBS 呼吸門檻與周邊神經病變電生理分流</text>
  <text x="920" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Neuro-09 · 脊髓與周邊神經</text>

  <!-- Left Panel: Spinal Cord Cross-Section & Syndromes -->
  <rect x="32" y="82" width="468" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="104" fill="#0f172a" font-size="13.5" font-weight="700">一、脊髓橫切面三大傳導徑路（體位排列）與經典脊髓症候群</text>

  <!-- Large Spinal Cord Cross-Section -->
  <rect x="44" y="114" width="444" height="176" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Cord oval -->
  <ellipse cx="232" cy="200" rx="92" ry="64" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <!-- Median sulci -->
  <line x1="232" y1="136" x2="232" y2="176" stroke="#64748b" stroke-width="1.2"/>
  <line x1="232" y1="224" x2="232" y2="264" stroke="#64748b" stroke-width="2"/>
  <!-- Gray matter H-shape -->
  <path d="M196,158 C206,174 214,188 214,200 C214,214 202,226 194,238 C208,242 220,226 222,208 L242,208 C244,226 256,242 270,238 C262,226 250,214 250,200 C250,188 258,174 268,158 C256,162 246,178 242,192 L222,192 C218,178 208,162 196,158 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>

  <!-- Dorsal columns (Blue) -->
  <path d="M202,142 Q232,135 262,142 L248,178 L216,178 Z" fill="#1d4ed8" opacity="0.82"/>
  <text x="232" y="160" fill="#ffffff" font-size="9.2" font-weight="700" text-anchor="middle">後索（內薄／外楔）</text>

  <!-- Lateral Corticospinal Tracts (Red) with C->S somatotopy -->
  <ellipse cx="168" cy="192" rx="22" ry="15" fill="#be123c" opacity="0.85"/>
  <text x="168" y="195" fill="#ffffff" font-size="8.8" font-weight="700" text-anchor="middle">S←L←C</text>
  <ellipse cx="296" cy="192" rx="22" ry="15" fill="#be123c" opacity="0.85"/>
  <text x="296" y="195" fill="#ffffff" font-size="8.8" font-weight="700" text-anchor="middle">C→L→S</text>

  <!-- Spinothalamic Tracts (Teal) -->
  <path d="M152,220 Q168,248 204,254 L208,238 Q180,232 168,214 Z" fill="#0f766e" opacity="0.88"/>
  <path d="M312,220 Q296,248 260,254 L256,238 Q284,232 296,214 Z" fill="#0f766e" opacity="0.88"/>
  <text x="232" y="279" fill="#475569" font-size="9.5" font-weight="600" text-anchor="middle">腹側（前脊髓動脈灌流前 2/3）· 體位排列皆為「內頸 C → 外薦 S」</text>

  <!-- Callout legends on right of cord -->
  <rect x="336" y="122" width="144" height="46" rx="5" fill="#eff6ff"/>
  <text x="342" y="137" fill="#1e3a8a" font-size="9.8" font-weight="700">後索（藍）</text>
  <text x="342" y="151" fill="#334155" font-size="9.2">同側震動本體覺 · 延髓交叉</text>
  <text x="342" y="163" fill="#334155" font-size="9.2">內側下肢（薄束）／外側上肢</text>

  <rect x="336" y="174" width="144" height="46" rx="5" fill="#fff1f2"/>
  <text x="342" y="189" fill="#9f1239" font-size="9.8" font-weight="700">外側皮質脊髓徑（紅）</text>
  <text x="342" y="203" fill="#334155" font-size="9.2">同側運動 · 延髓錐體交叉</text>
  <text x="342" y="215" fill="#be123c" font-size="9.2" font-weight="600">內側頸上肢 · 外側薦下肢</text>

  <rect x="336" y="226" width="144" height="54" rx="5" fill="#f0fdfa"/>
  <text x="342" y="241" fill="#115e59" font-size="9.8" font-weight="700">脊髓視丘徑（綠）</text>
  <text x="342" y="255" fill="#334155" font-size="9.2">對側痛溫覺 · 入髓升 1–2 節</text>
  <text x="342" y="268" fill="#0f766e" font-size="9.2" font-weight="600">經白質前連合交叉至對側</text>

  <!-- 2x2 Spinal Syndrome Cards -->
  <rect x="44" y="298" width="216" height="104" rx="7" fill="#fff1f2" stroke="#fda4af" stroke-width="1.1"/>
  <text x="54" y="316" fill="#9f1239" font-size="11" font-weight="700">1. 中央髓症候群（最常見不完全傷）</text>
  <text x="54" y="333" fill="#0f172a" font-size="9.8">· 機轉：高齡頸椎狹窄跌倒頸部過度伸展</text>
  <text x="54" y="349" fill="#be123c" font-size="9.8" font-weight="700">· 特徵：上肢無力遠重於下肢（內頸先傷）</text>
  <text x="54" y="365" fill="#0f172a" font-size="9.8">· 披肩樣痛溫覺減退 · 外側薦髓感覺常保留</text>
  <text x="54" y="381" fill="#475569" font-size="9.5">· 脊髓空洞症亦破壞前連合致披肩分離感覺喪失</text>

  <rect x="268" y="298" width="220" height="104" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="278" y="316" fill="#92400e" font-size="11" font-weight="700">2. 前髓症候群 vs Brown-Séquard</text>
  <text x="278" y="333" fill="#0f172a" font-size="9.8">· 前髓（前脊髓動脈缺血）：雙下肢癱＋痛溫失</text>
  <text x="284" y="348" fill="#b45309" font-size="9.8" font-weight="700">但後索本體震動覺完整保留！</text>
  <text x="278" y="365" fill="#0f172a" font-size="9.8">· 半切（Brown-Séquard）：同側無力與本體失</text>
  <text x="284" y="381" fill="#0f766e" font-size="9.8" font-weight="700">＋對側低 1–2 節以下痛溫覺喪失</text>

  <rect x="44" y="410" width="216" height="106" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="54" y="428" fill="#1e3a8a" font-size="11" font-weight="700">3. 圓錐（L1–L2）vs 馬尾急症</text>
  <text x="54" y="445" fill="#0f172a" font-size="9.8">· 圓錐：急發對稱鞍麻、極早期大小便失禁</text>
  <text x="60" y="460" fill="#334155" font-size="9.5">膝反射常保留／亢進，踝反射消失（UMN+LMN）</text>
  <text x="54" y="476" fill="#0f172a" font-size="9.8">· 馬尾：劇烈不對稱根痛、鬆弛無力、膝踝無反射</text>
  <text x="54" y="493" fill="#1d4ed8" font-size="9.8" font-weight="700">· 尿滯留急排腰薦 MRI → 24–48h 內緊急減壓</text>

  <rect x="268" y="410" width="220" height="106" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.1"/>
  <text x="278" y="428" fill="#14532d" font-size="11" font-weight="700">4. 外傷休克與腰椎狹窄跛行鑑別</text>
  <text x="278" y="445" fill="#0f172a" font-size="9.8">· 神經性休克（T6↑交感斷）：低血壓＋心搏過緩</text>
  <text x="278" y="461" fill="#0f172a" font-size="9.8">· 脊髓休克：急性損傷下暫時全反射與張力消失</text>
  <text x="278" y="477" fill="#166534" font-size="9.8" font-weight="700">· 腰椎狹窄神經性跛行：前傾推購物車緩解</text>
  <text x="284" y="493" fill="#334155" font-size="9.5">（SLRT 陰性 · 足背脈搏正常，異於血管性跛行）</text>

  <!-- Right Panel: GBS, NCS Waveforms & Peripheral Neuropathy -->
  <rect x="512" y="82" width="416" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="526" y="104" fill="#0f172a" font-size="13.5" font-weight="700">二、GBS 呼吸門檻 · 電生理波形與周邊神經病變分流</text>

  <!-- GBS vs CIDP & 20/30/40 rule -->
  <rect x="524" y="114" width="392" height="134" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.1"/>
  <text x="534" y="132" fill="#9f1239" font-size="11.2" font-weight="700">格林-巴利症候群（GBS ≤4 週達峰）vs CIDP（&gt;8 週進展）</text>
  <text x="534" y="149" fill="#0f172a" font-size="10">· GBS：感染後上行無力＋無反射 · 第 2 週 CSF 蛋白細胞分離 · MFS 查 anti-GQ1b</text>
  <text x="534" y="165" fill="#be123c" font-size="10" font-weight="700">· 治療鐵律：GBS 選 IVIG 或 PLEX（皮質類固醇無效！）；CIDP 類固醇／IVIG／PLEX 皆有效</text>

  <rect x="534" y="175" width="372" height="64" rx="6" fill="#0f172a"/>
  <text x="720" y="193" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">GBS 預防性插管「20 / 30 / 40」警戒紅線（勿等血氧 SpO2 掉！）</text>
  <text x="598" y="214" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">肺活量 VC</text>
  <text x="598" y="230" fill="#ffffff" font-size="10.5" text-anchor="middle">&lt; 20 mL/kg</text>
  <text x="720" y="214" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">最大吸氣壓 MIP</text>
  <text x="720" y="230" fill="#ffffff" font-size="10.5" text-anchor="middle">弱於 −30 cmH2O</text>
  <text x="842" y="214" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">最大吐氣壓 MEP</text>
  <text x="842" y="230" fill="#ffffff" font-size="10.5" text-anchor="middle">&lt; 40 cmH2O</text>

  <!-- NCS Waveforms: Normal vs Axonal vs Demyelinating -->
  <rect x="524" y="258" width="392" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="534" y="276" fill="#0f172a" font-size="11" font-weight="700">神經傳導檢查（NCS）複合肌肉動作電位（CMAP）鑑別</text>

  <!-- Waveform 1: Normal -->
  <rect x="534" y="284" width="118" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="593" y="299" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">正常傳導</text>
  <path d="M544,334 L562,334 Q572,302 582,334 Q592,354 602,334 L642,334" fill="none" stroke="#334155" stroke-width="2.2"/>
  <text x="593" y="362" fill="#475569" font-size="9.2" text-anchor="middle">潛時短 · 振幅高</text>

  <!-- Waveform 2: Axonal -->
  <rect x="661" y="284" width="118" height="86" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="720" y="299" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">軸索退化型</text>
  <path d="M671,334 L690,334 Q698,323 706,334 Q714,341 722,334 L769,334" fill="none" stroke="#b45309" stroke-width="2.2"/>
  <text x="720" y="351" fill="#92400e" font-size="9.2" font-weight="600" text-anchor="middle">CMAP/SNAP 振幅↓↓</text>
  <text x="720" y="364" fill="#475569" font-size="8.8" text-anchor="middle">糖尿病／毒性／AMAN／ATTRv</text>

  <!-- Waveform 3: Demyelinating -->
  <rect x="788" y="284" width="118" height="86" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="847" y="299" fill="#1e3a8a" font-size="10" font-weight="700" text-anchor="middle">脫髓鞘病變型</text>
  <path d="M796,334 L828,334 Q836,315 844,332 Q850,322 858,336 Q866,346 876,334 L898,334" fill="none" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="847" y="351" fill="#1e3a8a" font-size="9.2" font-weight="600" text-anchor="middle">速度↓↓ · 潛時↑ · 色散阻滯</text>
  <text x="847" y="364" fill="#475569" font-size="8.8" text-anchor="middle">AIDP／CIDP／CMT1A</text>

  <!-- Chronic Polyneuropathy 4W + CMT1A vs Taiwan ATTRv -->
  <rect x="524" y="390" width="392" height="126" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.1"/>
  <text x="534" y="408" fill="#115e59" font-size="11" font-weight="700">慢性多發神經病變篩檢與台灣關鍵遺傳鑑別</text>
  <text x="534" y="425" fill="#0f172a" font-size="9.8">· 後天首因：糖尿病（襪套手套樣）· 一線抽血查 HbA1c、維生素 B12、免疫固定電泳 SPEP</text>
  <text x="534" y="441" fill="#0f172a" font-size="9.8">· 多發性單神經炎（不對稱接連垂足／尺神經麻痺）：急查 ANCA／PAN 系統性神經血管炎</text>
  <text x="534" y="458" fill="#1e3a8a" font-size="9.8" font-weight="700">· CMT1A（17p11.2 PMP22 倍增）：幼年起病 · 高足弓鶴腿 · 禁用 Vincristine（同位缺失為 HNPP）</text>
  <rect x="534" y="467" width="372" height="41" rx="5" fill="#ccfbf1"/>
  <text x="542" y="483" fill="#115e59" font-size="9.8" font-weight="700">· 台灣晚發型 ATTRv（TTR p.Ala97Ser）：&gt;50 歲快速痛麻無力＋腹瀉便秘＋姿勢低血壓</text>
  <text x="548" y="499" fill="#0f766e" font-size="9.6" font-weight="600">雙側腕隧道史＋心肌肥厚 → 切勿誤診 CIDP！及早投予 Tafamidis 或 RNA 基因靜默藥</text>
</svg>
