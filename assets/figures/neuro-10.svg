<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro-10-title neuro-10-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro-10-title">神經肌肉接合處突觸病生理、重複電刺激波形與肌肉失養症讀框機制圖</title>
  <desc id="neuro-10-desc">三欄式臨床示意圖：左欄呈現突觸前 LEMS 與肉毒桿菌毒素及突觸後重症肌無力受體標靶；中欄比較 3 至 5 Hz 低頻遞減與 20 至 50 Hz 高頻遞增重複電刺激波形及單纖維肌電圖 Jitter；右欄圖解 dystrophin 讀框假說與五大肌炎自體抗體。</desc>

  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="28" y="28" width="904" height="46" rx="10" fill="#0f766e"/>
  <text x="44" y="49" font-size="16" font-weight="700" fill="#ffffff">神經肌肉接合處突觸定位 · 重複電刺激波形 · 讀框假說與肌炎抗體譜</text>
  <text x="44" y="66" font-size="11" fill="#ccfbf1">NMJ 突觸前後機轉（MG / LEMS / 肉毒桿菌） · 3–5 Hz vs 20–50 Hz RNS · SFEMG Jitter · DMD/BMD 與五大 MSAs</text>

  <!-- PANEL A -->
  <rect x="30" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="30" y="82" width="292" height="28" rx="10" fill="#e0f2fe"/>
  <text x="42" y="101" font-size="13" font-weight="700" fill="#0f172a">A. 神經肌肉接合處（NMJ）病灶標靶</text>

  <path d="M128,118 L224,118 L224,152 C252,162 262,202 246,226 C234,242 118,242 106,226 C90,202 100,162 128,152 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="176" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">突觸前運動神經末梢</text>

  <circle cx="148" cy="176" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="148" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e40af">ACh</text>
  <circle cx="178" cy="168" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="178" y="172" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e40af">ACh</text>
  <circle cx="206" cy="180" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="206" y="184" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e40af">ACh</text>

  <rect x="142" y="218" width="68" height="14" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="176" y="228" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">SNARE 胞吐蛋白</text>

  <rect x="96" y="190" width="22" height="16" rx="4" fill="#1d4ed8"/>
  <text x="107" y="201" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">VGCC</text>
  <text x="64" y="198" font-size="9.5" font-weight="700" fill="#1d4ed8">Ca²⁺ →</text>

  <rect x="234" y="190" width="22" height="16" rx="4" fill="#1d4ed8"/>
  <text x="245" y="201" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">VGCC</text>
  <text x="262" y="198" font-size="9.5" font-weight="700" fill="#1d4ed8">← Ca²⁺</text>

  <text x="90" y="256" font-size="9.5" fill="#0f766e" font-weight="600">突觸間隙 · AChE（Pyridostigmine 抑制分解）</text>
  <circle cx="152" cy="266" r="3" fill="#0f766e"/>
  <circle cx="176" cy="264" r="3" fill="#0f766e"/>
  <circle cx="200" cy="267" r="3" fill="#0f766e"/>

  <path d="M46,282 L88,282 L88,306 L108,306 L108,282 L142,282 L142,306 L162,306 L162,282 L196,282 L196,306 L216,306 L216,282 L250,282 L250,306 L270,306 L270,282 L306,282 L306,334 L46,334 Z" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
  <rect x="112" y="274" width="28" height="12" rx="3" fill="#be123c"/>
  <text x="126" y="283" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">AChR</text>
  <rect x="166" y="274" width="28" height="12" rx="3" fill="#be123c"/>
  <text x="180" y="283" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">AChR</text>
  <rect x="220" y="274" width="28" height="12" rx="3" fill="#9f1239"/>
  <text x="234" y="283" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">MuSK</text>
  <text x="176" y="324" text-anchor="middle" font-size="10.5" font-weight="700" fill="#881337">突觸後運動終板皺摺（降低安全係數）</text>

  <rect x="40" y="344" width="272" height="54" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="360" font-size="10.5" font-weight="700" fill="#1e3a8a">突觸前｜LEMS（抗 P/Q-VGCC 抗體）</text>
  <text x="48" y="375" font-size="9.5" fill="#1e293b">· 下肢近端無力＋口乾自主神經異常；用力後反射增強</text>
  <text x="48" y="390" font-size="9.5" fill="#1d4ed8">· 逾 50% 伴小細胞肺癌（SCLC）；給 3,4-DAP</text>

  <rect x="40" y="404" width="272" height="54" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="48" y="420" font-size="10.5" font-weight="700" fill="#92400e">突觸前｜肉毒桿菌中毒（裂解 SNARE 蛋白）</text>
  <text x="48" y="435" font-size="9.5" fill="#1e293b">· 急性下行對稱腦神經麻痺（散瞳、複視、吞嚥難）</text>
  <text x="48" y="450" font-size="9.5" fill="#b45309">· 無發燒、感覺正常；即刻護氣道＋及早給抗毒素</text>

  <rect x="40" y="464" width="272" height="56" rx="7" fill="#fff1f2" stroke="#fda4af"/>
  <text x="48" y="480" font-size="10.5" font-weight="700" fill="#9f1239">突觸後｜重症肌無力 MG（抗 AChR / MuSK）</text>
  <text x="48" y="495" font-size="9.5" fill="#1e293b">· 晨輕暮重眼瞼下垂複視；DTR 正常；CT 排查胸腺瘤</text>
  <text x="48" y="510" font-size="9.5" fill="#be123c">· MuSK 型球部危象多、AChEI 反應差，首選血漿置換</text>

  <!-- PANEL B -->
  <rect x="334" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="334" y="82" width="292" height="28" rx="10" fill="#ccfbf1"/>
  <text x="346" y="101" font-size="13" font-weight="700" fill="#0f172a">B. 重複神經電刺激（RNS）與危象判讀</text>

  <rect x="344" y="118" width="272" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="354" y="135" font-size="11" font-weight="700" fill="#be123c">3–5 Hz 低頻 RNS：重症肌無力（遞減 ＞10%）</text>
  <line x1="360" y1="214" x2="602" y2="214" stroke="#64748b" stroke-width="1.2"/>
  <line x1="360" y1="150" x2="602" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="374" y="150" width="18" height="64" rx="2" fill="#be123c"/>
  <rect x="418" y="160" width="18" height="54" rx="2" fill="#e11d48"/>
  <rect x="462" y="169" width="18" height="45" rx="2" fill="#f43f5e"/>
  <rect x="506" y="176" width="18" height="38" rx="2" fill="#fb7185"/>
  <rect x="550" y="173" width="18" height="41" rx="2" fill="#f43f5e"/>
  <text x="383" y="227" text-anchor="middle" font-size="9" fill="#334155">S1</text>
  <text x="427" y="227" text-anchor="middle" font-size="9" fill="#334155">S2</text>
  <text x="471" y="227" text-anchor="middle" font-size="9" fill="#334155">S3</text>
  <text x="515" y="227" text-anchor="middle" font-size="9" font-weight="700" fill="#be123c">S4 (↓＞10%)</text>
  <text x="559" y="227" text-anchor="middle" font-size="9" fill="#334155">S5</text>
  <text x="354" y="241" font-size="9" fill="#475569">機制：囊泡補充需 1–2 秒 ＞ 鈣清除 0.2 秒 → 耗竭可用 ACh</text>

  <rect x="344" y="254" width="272" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="354" y="271" font-size="11" font-weight="700" fill="#1d4ed8">20–50 Hz 高頻 RNS／用力 10s：LEMS 遞增</text>
  <line x1="360" y1="348" x2="602" y2="348" stroke="#64748b" stroke-width="1.2"/>
  <rect x="374" y="330" width="16" height="18" rx="2" fill="#93c5fd"/>
  <rect x="412" y="320" width="16" height="28" rx="2" fill="#60a5fa"/>
  <rect x="450" y="306" width="16" height="42" rx="2" fill="#3b82f6"/>
  <rect x="488" y="292" width="16" height="56" rx="2" fill="#2563eb"/>
  <rect x="526" y="280" width="16" height="68" rx="2" fill="#1d4ed8"/>
  <text x="382" y="361" text-anchor="middle" font-size="9" fill="#334155">基線低</text>
  <text x="534" y="361" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">遞增 ＞60%–100%</text>
  <text x="354" y="374" font-size="9" fill="#475569">機制：高頻刺激使突觸前 Ca²⁺ 累積，克服 VGCC 抗體阻斷</text>

  <rect x="344" y="388" width="272" height="64" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="354" y="405" font-size="10.5" font-weight="700" fill="#0f766e">單纖維肌電圖（SFEMG）：眼肌型最高敏感度</text>
  <path d="M356,426 L378,426 L383,410 L388,434 L393,426 L432,426 L437,410 L442,434 L447,426 L480,426" fill="none" stroke="#0f766e" stroke-width="1.8"/>
  <path d="M424,426 L429,412 L434,432" fill="none" stroke="#be123c" stroke-width="1.3" stroke-dasharray="2,2"/>
  <path d="M446,426 L451,412 L456,432" fill="none" stroke="#be123c" stroke-width="1.3" stroke-dasharray="2,2"/>
  <text x="490" y="421" font-size="9.5" font-weight="700" fill="#0f172a">眼輪匝肌 MCD ＞40 µs</text>
  <text x="490" y="435" font-size="9" fill="#be123c">嚴重時出現傳導阻斷 Block</text>
  <text x="354" y="446" font-size="9" fill="#334155">量化同一運動單位雙肌纖維放電時間差變異（Jitter）</text>

  <rect x="344" y="460" width="272" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="354" y="476" font-size="10.5" font-weight="700" fill="#991b1b">肌無力危象搶救紅線與絕對禁忌藥</text>
  <text x="354" y="492" font-size="9.5" fill="#1e293b">· FVC ＜15–20 mL/kg 或 NIF 惡化 → 即刻插管停 AChEI</text>
  <text x="354" y="508" font-size="9.5" font-weight="600" fill="#be123c">· 禁給：Aminoglycoside · FQ · Macrolide · Mg²⁺ · β阻斷劑</text>

  <!-- PANEL C -->
  <rect x="638" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="638" y="82" width="292" height="28" rx="10" fill="#fef3c7"/>
  <text x="650" y="101" font-size="13" font-weight="700" fill="#0f172a">C. 讀框假說（DMD/BMD）與肌炎抗體</text>

  <rect x="648" y="118" width="272" height="162" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="658" y="135" font-size="10.5" font-weight="700" fill="#0f172a">Xp21 Dystrophin 基因讀框假說（Monaco Rule）</text>

  <rect x="658" y="145" width="48" height="22" rx="4" fill="#1d4ed8"/>
  <text x="682" y="160" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Ex 48</text>
  <rect x="712" y="145" width="66" height="22" rx="4" fill="#fee2e2" stroke="#be123c" stroke-dasharray="3,2"/>
  <text x="745" y="160" text-anchor="middle" font-size="8.5" font-weight="700" fill="#be123c">Δ49–50 移位</text>
  <rect x="784" y="145" width="48" height="22" rx="4" fill="#991b1b"/>
  <text x="808" y="160" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">STOP!</text>
  <text x="840" y="160" font-size="10" font-weight="700" fill="#be123c">→ 重度 DMD</text>
  <text x="658" y="181" font-size="9" fill="#475569">讀框破壞無蛋白：＜5 歲發病 · Gowers 徵象 · 腓腸肌假性肥大</text>

  <rect x="658" y="192" width="48" height="22" rx="4" fill="#0f766e"/>
  <text x="682" y="207" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Ex 48</text>
  <rect x="712" y="192" width="66" height="22" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="745" y="207" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f766e">跳躍 Ex 51</text>
  <rect x="784" y="192" width="48" height="22" rx="4" fill="#0f766e"/>
  <text x="808" y="207" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Ex 52</text>
  <text x="840" y="207" font-size="10" font-weight="700" fill="#0f766e">→ 輕緩 BMD</text>
  <text x="658" y="228" font-size="9" fill="#475569">讀框保留（In-frame）：產出截短功能蛋白（核酸跳躍療法原理）</text>

  <line x1="658" y1="238" x2="910" y2="238" stroke="#e2e8f0"/>
  <text x="658" y="253" font-size="9.5" font-weight="700" fill="#b45309">DM1（DMPK CTG 擴增）：遠端無力＋肌強直＋白內障＋房室阻滯</text>
  <text x="658" y="270" font-size="9" fill="#334155">類固醇肌病變：CK 正常、不致橫紋肌溶解（對比 Statin 肌毒性）</text>

  <text x="650" y="300" font-size="11" font-weight="700" fill="#0f172a">五大肌炎特異抗體（MSAs）與運動神經元核心鑑別</text>

  <rect x="648" y="308" width="272" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="656" y="323" font-size="9.5" font-weight="700" fill="#1e3a8a">Anti-Mi-2｜典型皮肌炎（Dermatomyositis）</text>
  <text x="656" y="338" font-size="9" fill="#334155">向陽疹、Gottron 丘疹、切片肌束周圍萎縮；成人必篩惡性腫瘤</text>

  <rect x="648" y="351" width="272" height="38" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="656" y="366" font-size="9.5" font-weight="700" fill="#0f766e">Antisynthetase（Anti-Jo-1）｜抗合成酶症候群</text>
  <text x="656" y="381" font-size="9" fill="#334155">肌炎＋間質性肺病（ILD）＋技工手＋雷諾氏現象＋多關節炎</text>

  <rect x="648" y="394" width="272" height="38" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="656" y="409" font-size="9.5" font-weight="700" fill="#9f1239">Anti-SRP / Anti-HMGCR｜免疫介導壞死性肌炎</text>
  <text x="656" y="424" font-size="9" fill="#334155">CK 極高（＞5,000 U/L）；Statin 停藥仍惡化，需積極免疫治療</text>

  <rect x="648" y="437" width="272" height="38" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="656" y="452" font-size="9.5" font-weight="700" fill="#92400e">Anti-cN-1A｜偶發性包涵體肌炎（sIBM）</text>
  <text x="656" y="467" font-size="9" fill="#334155">高齡男股四頭肌＋深指屈肌無力、鑲邊空泡；免疫抑制劑無效</text>

  <rect x="648" y="480" width="272" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="656" y="495" font-size="9.5" font-weight="700" fill="#0f172a">ALS vs MMN｜運動神經元關鍵鑑別</text>
  <text x="656" y="511" font-size="9" fill="#334155">ALS 上下運動神經元並存＋TDP-43；MMN 見傳導阻滯且 IVIG 有效</text>
</svg>
