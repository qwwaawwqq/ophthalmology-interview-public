<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro-11-title neuro-11-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro-11-title">原發與次發性頭痛鑑別光譜、三叉神經血管路徑與床邊 HINTS 眩暈決策圖</title>
  <desc id="neuro-11-desc">三欄式臨床示意圖：左欄對比三叉神經痛、叢發性頭痛、偏頭痛與緊縮型及藥物過度使用頭痛之發作時程與標靶治療；中欄呈現雷擊頭痛 SAH 與 RCVS 串珠血管痙攣、低腦壓與高腦壓及顳動脈炎紅旗；右欄圖解急性持續眩暈床邊 HINTS Plus 四步驟鑑別。</desc>

  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="28" y="28" width="904" height="46" rx="10" fill="#1d4ed8"/>
  <text x="44" y="49" font-size="16" font-weight="700" fill="#ffffff">原發與次發性頭痛鑑別光譜 · 三叉神經痛 · 急性前庭症候群 HINTS Plus</text>
  <text x="44" y="66" font-size="11" fill="#dbeafe">ICHD-3 時程與 CGRP 標靶 · SNOOP10 紅旗（SAH / RCVS / SIH / IIH / 顳動脈炎） · 後循環中風床邊篩檢</text>

  <!-- ==================== PANEL A: PRIMARY HEADACHES & TN ==================== -->
  <rect x="30" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="30" y="82" width="292" height="28" rx="10" fill="#dbeafe"/>
  <text x="42" y="101" font-size="13" font-weight="700" fill="#0f172a">A. 原發頭痛與顏面痛時程及標靶治療</text>

  <!-- Time-scale axis bar -->
  <text x="42" y="126" font-size="9.5" font-weight="700" fill="#475569">單次未治療發作時程光譜（秒 → 分 → 小時 → 天）</text>
  <line x1="42" y1="134" x2="310" y2="134" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Card 1: Trigeminal Neuralgia -->
  <rect x="40" y="144" width="272" height="86" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="48" y="152" width="76" height="18" rx="4" fill="#b45309"/>
  <text x="86" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">＜1 秒–2 分鐘</text>
  <text x="132" y="165" font-size="11" font-weight="700" fill="#92400e">典型三叉神經痛（V2＞V3）</text>
  <text x="48" y="183" font-size="9.5" fill="#1e293b">· 口角鼻翼觸發區電擊劇痛；88% 橋腦 REZ 微血管壓迫</text>
  <text x="48" y="198" font-size="9.5" font-weight="600" fill="#b45309">· 首選 Carbamazepine（啟用前必驗 HLA-B*15:02）</text>
  <text x="48" y="213" font-size="9" fill="#475569">· V1 排查帶狀疱疹；年輕雙側查 MS；難治型微血管減壓</text>

  <!-- Card 2: Cluster Headache -->
  <rect x="40" y="238" width="272" height="86" rx="7" fill="#fff1f2" stroke="#fda4af"/>
  <rect x="48" y="246" width="76" height="18" rx="4" fill="#be123c"/>
  <text x="86" y="258" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">15–180 分鐘</text>
  <text x="132" y="259" font-size="11" font-weight="700" fill="#9f1239">叢發性頭痛（三叉自主神經）</text>
  <text x="48" y="277" font-size="9.5" fill="#1e293b">· 青壯吸菸男多；單側眼眶鑽痛、痛極躁動來回踱步</text>
  <text x="48" y="292" font-size="9.5" fill="#1e293b">· 同側結膜充血、流淚、鼻塞流涕、縮瞳垂瞼</text>
  <text x="48" y="307" font-size="9.5" font-weight="600" fill="#be123c">· 急性：100% 純氧 12–15 L/min＋鼻噴/皮下 Triptan</text>
  <text x="48" y="320" font-size="8.5" fill="#475569">· 預防首選 Verapamil（追蹤心電圖 PR 間期）</text>

  <!-- Card 3: Migraine -->
  <rect x="40" y="332" width="272" height="100" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="48" y="340" width="76" height="18" rx="4" fill="#1d4ed8"/>
  <text x="86" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">4–72 小時</text>
  <text x="132" y="353" font-size="11" font-weight="700" fill="#1e3a8a">偏頭痛（CGRP 三叉血管活化）</text>
  <text x="48" y="371" font-size="9.5" fill="#1e293b">· 單側搏動中重度、走動惡化喜暗室靜臥＋噁心畏光怕吵</text>
  <text x="48" y="386" font-size="9.5" fill="#1e293b">· 可逆預兆（CSD 波）持續 5–60 分鐘；發作 1h 內給藥</text>
  <text x="48" y="401" font-size="9.5" font-weight="600" fill="#1d4ed8">· Triptan 禁於冠心病／中風 → 改選 Gepants 或 Ditans</text>
  <text x="48" y="416" font-size="9" fill="#475569">· 預防：Propranolol（氣喘禁）、Topiramate、抗 CGRP 單抗</text>

  <!-- Card 4: TTH & MOH -->
  <rect x="40" y="440" width="272" height="80" rx="7" fill="#f0fdfa" stroke="#5eead4"/>
  <rect x="48" y="448" width="76" height="18" rx="4" fill="#0f766e"/>
  <text x="86" y="460" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">30 分–7 天</text>
  <text x="132" y="461" font-size="10.5" font-weight="700" fill="#0f766e">緊縮型頭痛與藥物過度使用（MOH）</text>
  <text x="48" y="479" font-size="9.5" fill="#1e293b">· 緊縮型：雙側緊箍壓迫感、輕中度、日常活動不惡化</text>
  <text x="48" y="495" font-size="9.5" font-weight="600" fill="#0f766e">· MOH 紅線（＞3 個月）：Triptan/複方 ≥10 天/月</text>
  <text x="48" y="510" font-size="9.5" font-weight="600" fill="#0f766e">  單純 NSAIDs / Acetaminophen ≥15 天/月 → 停減急性藥</text>

  <!-- ==================== PANEL B: SECONDARY RED FLAGS ==================== -->
  <rect x="334" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="334" y="82" width="292" height="28" rx="10" fill="#fee2e2"/>
  <text x="346" y="101" font-size="13" font-weight="700" fill="#0f172a">B. SNOOP10 次發紅旗與血管／顱壓急症</text>

  <!-- Thunderclap Subbox: SAH vs RCVS -->
  <rect x="344" y="118" width="272" height="162" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="354" y="135" font-size="11" font-weight="700" fill="#9f1239">雷擊性頭痛（＜1 分鐘達最高峰）：先排 SAH！</text>
  <text x="354" y="152" font-size="9.5" fill="#1e293b">1. 動脈瘤 SAH：單次爆痛＋頸僵硬 → NCCT（陰性必做</text>
  <text x="354" y="166" font-size="9.5" fill="#1e293b">   腰穿驗黃變 Xanthochromia）＋CTA 急栓塞／夾除</text>
  <text x="354" y="183" font-size="9.5" fill="#1e293b">2. RCVS：熱水澡／用力反覆誘發 → MRA 串珠樣痙攣</text>

  <!-- String-of-beads MRA schematic -->
  <rect x="354" y="192" width="252" height="48" rx="6" fill="#ffffff" stroke="#fecdd3"/>
  <text x="362" y="207" font-size="8.5" font-weight="700" fill="#64748b">正常腦動脈</text>
  <path d="M424,204 L594,204" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <text x="362" y="229" font-size="8.5" font-weight="700" fill="#be123c">RCVS 串珠狀</text>
  <path d="M424,225 C436,217 444,217 454,225 C462,225 466,225 474,225 C484,217 492,217 502,225 C510,225 514,225 522,225 C532,217 540,217 550,225 L594,225" fill="none" stroke="#be123c" stroke-width="3.5"/>
  <ellipse cx="439" cy="225" rx="11" ry="5.5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>
  <ellipse cx="488" cy="225" rx="11" ry="5.5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>
  <ellipse cx="537" cy="225" rx="11" ry="5.5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>
  <ellipse cx="578" cy="225" rx="10" ry="5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>

  <text x="354" y="256" font-size="9.5" font-weight="700" fill="#be123c">RCVS 首選 Nimodipine（12 週可逆）</text>
  <text x="354" y="271" font-size="9" fill="#881337">絕對禁給：Triptans／血管收縮劑與高劑量類固醇！</text>

  <!-- Intracranial Pressure Subbox: SIH vs IIH -->
  <rect x="344" y="288" width="272" height="156" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="354" y="305" font-size="11" font-weight="700" fill="#0f172a">姿勢與顱內壓異常雙極鑑別（SIH vs IIH）</text>

  <rect x="352" y="313" width="256" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="360" y="328" font-size="10" font-weight="700" fill="#1e3a8a">低腦壓頭痛 SIH／PDPH（開口壓 ＜60 mmH₂O）</text>
  <text x="360" y="343" font-size="9" fill="#1e293b">· 坐立站起劇痛、平躺迅速緩解（脊髓硬腦膜滲漏）</text>
  <text x="360" y="358" font-size="9" fill="#1d4ed8">· MRI 瀰漫硬腦膜強化＋小腦下沉 → 硬腦膜外血液貼片</text>

  <rect x="352" y="378" width="256" height="60" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="360" y="393" font-size="10" font-weight="700" fill="#0f766e">特發性顱內高壓 IIH（開口壓 ＞250 mmH₂O）</text>
  <text x="360" y="408" font-size="9" fill="#1e293b">· 肥胖育齡女 · 平躺清晨惡化＋視乳頭水腫＋CN VI 麻痺</text>
  <text x="360" y="423" font-size="9" fill="#0f766e">· 先排 MRI＋MRV 排除靜脈竇栓塞 → 給 Acetazolamide</text>

  <!-- Temporal Arteritis Subbox -->
  <rect x="344" y="452" width="272" height="68" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="354" y="469" font-size="10.5" font-weight="700" fill="#92400e">＞50 歲新發頭痛紅旗：巨細胞（顳）動脈炎</text>
  <text x="354" y="485" font-size="9.5" fill="#1e293b">· 單側顳部搏動痛＋顳動脈壓痛脈減弱＋咀嚼間歇跛行</text>
  <text x="354" y="501" font-size="9.5" font-weight="700" fill="#b45309">· ESR / CRP 顯著上升 → 即給高劑量類固醇防突發單眼失明</text>
  <text x="354" y="514" font-size="8.5" fill="#475569">（切勿因等待顳淺動脈切片排程而延誤類固醇投予！）</text>

  <!-- ==================== PANEL C: AVS & HINTS PLUS ==================== -->
  <rect x="638" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="638" y="82" width="292" height="28" rx="10" fill="#ccfbf1"/>
  <text x="650" y="101" font-size="13" font-weight="700" fill="#0f172a">C. 急性前庭症候群（AVS）HINTS Plus</text>

  <rect x="648" y="118" width="272" height="48" rx="7" fill="#0f172a"/>
  <text x="784" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">適用前提：急性持續眩暈＋自發眼振</text>
  <text x="784" y="153" text-anchor="middle" font-size="9" fill="#99f6e4">床邊敏感度優於發病 48h 內 MRI DWI（偶發 BPPV 用 Dix-Hallpike）</text>

  <!-- Column Headers -->
  <rect x="648" y="174" width="132" height="24" rx="5" fill="#0f766e"/>
  <text x="714" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">周邊型（前庭神經炎）</text>
  <rect x="788" y="174" width="132" height="24" rx="5" fill="#be123c"/>
  <text x="854" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">中樞型（後循環中風）</text>

  <!-- Row 1: Head Impulse -->
  <rect x="648" y="204" width="132" height="62" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="656" y="220" font-size="9.5" font-weight="700" fill="#0f766e">1. 頭衝測試（HI）</text>
  <text x="656" y="236" font-size="9" fill="#1e293b">甩向病側前庭反射喪失</text>
  <text x="656" y="252" font-size="9.5" font-weight="700" fill="#0f766e">陽性（見矯正跳視）</text>

  <rect x="788" y="204" width="132" height="62" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="220" font-size="9.5" font-weight="700" fill="#be123c">1. 頭衝測試（HI）</text>
  <text x="796" y="236" font-size="9" fill="#1e293b">前庭眼反射迴路常保留</text>
  <text x="796" y="252" font-size="9.5" font-weight="700" fill="#be123c">正常！（無矯正跳視）</text>

  <!-- Row 2: Nystagmus -->
  <rect x="648" y="272" width="132" height="62" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="656" y="288" font-size="9.5" font-weight="700" fill="#0f766e">2. 眼振方向（N）</text>
  <text x="656" y="304" font-size="9" fill="#1e293b">單向水平扭轉眼振</text>
  <text x="656" y="320" font-size="9" fill="#0f766e">快相固定朝向健側</text>

  <rect x="788" y="272" width="132" height="62" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="288" font-size="9.5" font-weight="700" fill="#be123c">2. 眼振方向（N）</text>
  <text x="796" y="304" font-size="9" fill="#1e293b">隨左右凝視改變方向</text>
  <text x="796" y="320" font-size="9.5" font-weight="700" fill="#be123c">或純垂直／純扭轉眼振</text>

  <!-- Row 3: Test of Skew -->
  <rect x="648" y="340" width="132" height="58" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="656" y="356" font-size="9.5" font-weight="700" fill="#0f766e">3. 垂直斜視（TS）</text>
  <text x="656" y="372" font-size="9" fill="#1e293b">交替遮蓋眼球穩定</text>
  <text x="656" y="388" font-size="9.5" font-weight="700" fill="#0f766e">陰性（無垂直偏移）</text>

  <rect x="788" y="340" width="132" height="58" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="356" font-size="9.5" font-weight="700" fill="#be123c">3. 垂直斜視（TS）</text>
  <text x="796" y="372" font-size="9" fill="#1e293b">腦幹耳石重力路徑受損</text>
  <text x="796" y="388" font-size="9.5" font-weight="700" fill="#be123c">陽性（見垂直重對焦）</text>

  <!-- Row 4: Plus Hearing & Gait -->
  <rect x="648" y="404" width="132" height="58" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="656" y="420" font-size="9.5" font-weight="700" fill="#0f766e">4. Plus 聽力與站立</text>
  <text x="656" y="436" font-size="9" fill="#1e293b">雙耳聽力完全正常</text>
  <text x="656" y="452" font-size="9" fill="#0f766e">保護下尚可扶持站立</text>

  <rect x="788" y="404" width="132" height="58" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="420" font-size="9.5" font-weight="700" fill="#be123c">4. Plus 聽力與站立</text>
  <text x="796" y="436" font-size="9.5" font-weight="700" fill="#be123c">新發單側聽損（AICA）</text>
  <text x="796" y="452" font-size="9" fill="#1e293b">或嚴重軀幹失調無法站</text>

  <!-- Decision Footer -->
  <rect x="648" y="470" width="272" height="50" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="656" y="487" font-size="10" font-weight="700" fill="#991b1b">判讀鐵律（INFARCT 口訣）：任一中樞紅旗陽性</text>
  <text x="656" y="505" font-size="9.5" fill="#1e293b">→ 立即啟動後循環中風評估（NCCT＋CTA／腦部 MRI）</text>
</svg>
