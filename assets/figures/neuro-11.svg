<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro-11-title neuro-11-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro-11-title">原發與次發性頭痛鑑別光譜、三叉神經血管路徑與床邊 HINTS 眩暈決策圖</title>
  <desc id="neuro-11-desc">三欄式臨床示意圖：左欄對比三叉神經痛、叢發性頭痛、偏頭痛與緊縮型及藥物過度使用頭痛之發作時程與標靶治療；中欄呈現雷擊頭痛 SAH 與 RCVS 串珠血管痙攣、低腦壓與高腦壓及顳動脈炎紅旗；右欄圖解急性持續眩暈床邊 HINTS Plus 四步驟鑑別。</desc>

  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="28" y="28" width="904" height="46" rx="10" fill="#1d4ed8"/>
  <text x="44" y="49" font-size="16" font-weight="700" fill="#ffffff">原發與次發性頭痛鑑別光譜 · 三叉神經痛 · 急性前庭症候群 HINTS Plus</text>
  <text x="44" y="66" font-size="11" fill="#dbeafe">ICHD-3 時程與 CGRP 標靶 · SNOOP10 紅旗（SAH / RCVS / SIH / IIH / 顳動脈炎） · 後循環中風床邊篩檢</text>

  <!-- ==================== PANEL A: PRIMARY HEADACHES & TN ==================== -->
  <rect x="30" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="30" y="82" width="292" height="28" rx="10" fill="#dbeafe"/>
  <text x="42" y="101" font-size="13" font-weight="700" fill="#0f172a">A. 原發頭痛與顏面痛時程及標靶治療</text>

  <text x="42" y="125" font-size="9.5" font-weight="700" fill="#475569">單次未治療發作時程光譜（秒 → 分 → 小時 → 天）</text>
  <line x1="42" y1="133" x2="310" y2="133" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Card 1: Trigeminal Neuralgia -->
  <rect x="38" y="141" width="276" height="87" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="46" y="148" width="88" height="20" rx="4" fill="#b45309"/>
  <text x="90" y="162" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">＜1s–2 分鐘</text>
  <text x="140" y="162" font-size="10.5" font-weight="700" fill="#92400e">典型三叉神經痛（V2＞V3）</text>
  <text x="46" y="180" font-size="9.5" fill="#1e293b">· 口角鼻翼觸發電擊痛；88% 橋腦 REZ 血管壓迫</text>
  <text x="46" y="196" font-size="9.5" font-weight="600" fill="#b45309">· 首選 Carbamazepine（啟用必驗 HLA-B*15:02）</text>
  <text x="46" y="212" font-size="9.5" fill="#475569">· V1 查帶狀疱疹；年輕雙側查 MS；難治減壓術</text>

  <!-- Card 2: Cluster Headache -->
  <rect x="38" y="234" width="276" height="92" rx="7" fill="#fff1f2" stroke="#fda4af"/>
  <rect x="46" y="241" width="88" height="20" rx="4" fill="#be123c"/>
  <text x="90" y="255" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">15–180 分</text>
  <text x="140" y="255" font-size="10.5" font-weight="700" fill="#9f1239">叢發性頭痛（三叉自主神經）</text>
  <text x="46" y="272" font-size="9.5" fill="#1e293b">· 青壯吸菸男；單側眼眶鑽痛、躁動來回踱步</text>
  <text x="46" y="287" font-size="9.5" fill="#1e293b">· 同側結膜充血、流淚、鼻塞流涕、縮瞳垂瞼</text>
  <text x="46" y="302" font-size="9.5" font-weight="600" fill="#be123c">· 急性：純氧 12–15 L/min＋鼻噴／皮下 Triptan</text>
  <text x="46" y="317" font-size="9.5" fill="#475569">· 預防首選 Verapamil（追蹤心電圖 PR 間期）</text>

  <!-- Card 3: Migraine -->
  <rect x="38" y="332" width="276" height="98" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="46" y="339" width="88" height="20" rx="4" fill="#1d4ed8"/>
  <text x="90" y="353" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">4–72 小時</text>
  <text x="140" y="353" font-size="10.5" font-weight="700" fill="#1e3a8a">偏頭痛（CGRP 三叉血管）</text>
  <text x="46" y="370" font-size="9.5" fill="#1e293b">· 單側搏動中重度、走動惡化喜暗室＋噁心畏光</text>
  <text x="46" y="386" font-size="9.5" fill="#1e293b">· 可逆預兆（CSD 波）5–60 分鐘；1h 內給藥</text>
  <text x="46" y="402" font-size="9.5" font-weight="600" fill="#1d4ed8">· Triptan 禁冠心病／中風 → 選 Gepants／Ditans</text>
  <text x="46" y="418" font-size="9.5" fill="#475569">· 預防：Propranolol（氣喘禁）、Topiramate、CGRP</text>

  <!-- Card 4: TTH & MOH -->
  <rect x="38" y="436" width="276" height="86" rx="7" fill="#f0fdfa" stroke="#5eead4"/>
  <rect x="46" y="443" width="88" height="20" rx="4" fill="#0f766e"/>
  <text x="90" y="457" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">30 分–7 天</text>
  <text x="140" y="457" font-size="10.2" font-weight="700" fill="#0f766e">緊縮型與藥物過度（MOH）</text>
  <text x="46" y="475" font-size="9.5" fill="#1e293b">· 緊縮型：雙側緊箍壓迫、輕中度、活動不惡化</text>
  <text x="46" y="491" font-size="9.5" font-weight="600" fill="#0f766e">· MOH（＞3 月）：Triptan／複方 ≥10 天／月</text>
  <text x="46" y="507" font-size="9.5" font-weight="600" fill="#0f766e">  單純 NSAIDs／普拿疼 ≥15 天／月 → 停減急性藥</text>

  <!-- ==================== PANEL B: SECONDARY RED FLAGS ==================== -->
  <rect x="334" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="334" y="82" width="292" height="28" rx="10" fill="#fee2e2"/>
  <text x="346" y="101" font-size="13" font-weight="700" fill="#0f172a">B. SNOOP10 次發紅旗與血管／顱壓急症</text>

  <!-- Thunderclap Subbox: SAH vs RCVS -->
  <rect x="342" y="118" width="276" height="162" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="350" y="135" font-size="10.5" font-weight="700" fill="#9f1239">雷擊性頭痛（＜1 分鐘達峰）：首排 SAH！</text>
  <text x="350" y="151" font-size="9.5" fill="#1e293b">1. 動脈瘤 SAH：爆痛頸硬 → NCCT（陰性必腰穿</text>
  <text x="350" y="166" font-size="9.5" fill="#1e293b">   驗黃變 Xanthochromia）＋CTA 急栓塞／夾除</text>
  <text x="350" y="182" font-size="9.5" fill="#1e293b">2. RCVS：洗澡／用力反覆誘發 → MRA 串珠痙攣</text>

  <!-- String-of-beads MRA schematic -->
  <rect x="350" y="191" width="260" height="48" rx="6" fill="#ffffff" stroke="#fecdd3"/>
  <text x="358" y="207" font-size="9.5" font-weight="700" fill="#64748b">正常動脈</text>
  <path d="M432,203 L598,203" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <text x="358" y="229" font-size="9.5" font-weight="700" fill="#be123c">RCVS 串珠</text>
  <path d="M432,225 C444,217 452,217 462,225 C470,225 474,225 482,225 C492,217 500,217 510,225 C518,225 522,225 530,225 C540,217 548,217 558,225 L598,225" fill="none" stroke="#be123c" stroke-width="3.5"/>
  <ellipse cx="447" cy="225" rx="11" ry="5.5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>
  <ellipse cx="496" cy="225" rx="11" ry="5.5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>
  <ellipse cx="545" cy="225" rx="11" ry="5.5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>
  <ellipse cx="584" cy="225" rx="10" ry="5" fill="#fda4af" stroke="#be123c" stroke-width="1.4"/>

  <text x="350" y="255" font-size="9.5" font-weight="700" fill="#be123c">RCVS 首選 Nimodipine（12 週可逆）</text>
  <text x="350" y="271" font-size="9.5" fill="#881337">絕對禁給：Triptans／血管收縮劑與高劑量類固醇</text>

  <!-- Intracranial Pressure Subbox: SIH vs IIH -->
  <rect x="342" y="286" width="276" height="158" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="350" y="303" font-size="10.5" font-weight="700" fill="#0f172a">姿勢與顱內壓異常雙極鑑別（SIH vs IIH）</text>

  <rect x="348" y="311" width="264" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="355" y="327" font-size="9.8" font-weight="700" fill="#1e3a8a">低腦壓頭痛 SIH／PDPH（壓 ＜60 mmH₂O）</text>
  <text x="355" y="343" font-size="9.5" fill="#1e293b">· 坐立站起劇痛、平躺迅速緩解（硬腦膜滲漏）</text>
  <text x="355" y="359" font-size="9.5" fill="#1d4ed8">· MRI 硬腦膜強化＋小腦下沉 → 硬膜外血貼片</text>

  <rect x="348" y="376" width="264" height="60" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="355" y="392" font-size="9.8" font-weight="700" fill="#0f766e">特發性顱內高壓 IIH（壓 ＞250 mmH₂O）</text>
  <text x="355" y="408" font-size="9.5" fill="#1e293b">· 肥胖育齡女 · 平躺惡化＋視乳頭腫＋CN VI 麻</text>
  <text x="355" y="424" font-size="9.5" fill="#0f766e">· 先排 MRI＋MRV 排除竇栓塞 → Acetazolamide</text>

  <!-- Temporal Arteritis Subbox -->
  <rect x="342" y="450" width="276" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="350" y="466" font-size="10.2" font-weight="700" fill="#92400e">＞50 歲新發頭痛紅旗：巨細胞（顳）動脈炎</text>
  <text x="350" y="482" font-size="9.5" fill="#1e293b">· 單側顳痛＋顳動脈壓痛脈減＋咀嚼間歇跛行</text>
  <text x="350" y="498" font-size="9.5" font-weight="700" fill="#b45309">· ESR/CRP 升 → 即給高劑量類固醇防單眼失明</text>
  <text x="350" y="514" font-size="9.5" fill="#475569">（切勿因等待顳淺動脈切片而延誤類固醇！）</text>

  <!-- ==================== PANEL C: AVS & HINTS PLUS ==================== -->
  <rect x="638" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="638" y="82" width="292" height="28" rx="10" fill="#ccfbf1"/>
  <text x="650" y="101" font-size="13" font-weight="700" fill="#0f172a">C. 急性前庭症候群（AVS）HINTS Plus</text>

  <rect x="646" y="118" width="276" height="48" rx="7" fill="#0f172a"/>
  <text x="784" y="135" text-anchor="middle" font-size="10.2" font-weight="700" fill="#ffffff">適用前提：急性持續眩暈＋自發眼振</text>
  <text x="784" y="152" text-anchor="middle" font-size="9.5" fill="#99f6e4">敏感度優於 48h 內 MRI（偶發 BPPV 用耳石復位）</text>

  <!-- Column Headers -->
  <rect x="646" y="174" width="134" height="24" rx="5" fill="#0f766e"/>
  <text x="713" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">周邊型（前庭神經炎）</text>
  <rect x="788" y="174" width="134" height="24" rx="5" fill="#be123c"/>
  <text x="855" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">中樞型（後循環中風）</text>

  <!-- Row 1: Head Impulse -->
  <rect x="646" y="204" width="134" height="62" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="654" y="220" font-size="9.5" font-weight="700" fill="#0f766e">1. 頭衝測試（HI）</text>
  <text x="654" y="236" font-size="9.5" fill="#1e293b">甩病側前庭反射喪失</text>
  <text x="654" y="252" font-size="9.5" font-weight="700" fill="#0f766e">陽性（見矯正跳視）</text>

  <rect x="788" y="204" width="134" height="62" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="220" font-size="9.5" font-weight="700" fill="#be123c">1. 頭衝測試（HI）</text>
  <text x="796" y="236" font-size="9.5" fill="#1e293b">前庭眼反射迴路保留</text>
  <text x="796" y="252" font-size="9.5" font-weight="700" fill="#be123c">正常！（無矯正跳視）</text>

  <!-- Row 2: Nystagmus -->
  <rect x="646" y="272" width="134" height="62" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="654" y="288" font-size="9.5" font-weight="700" fill="#0f766e">2. 眼振方向（N）</text>
  <text x="654" y="304" font-size="9.5" fill="#1e293b">單向水平扭轉眼振</text>
  <text x="654" y="320" font-size="9.5" fill="#0f766e">快相固定朝向健側</text>

  <rect x="788" y="272" width="134" height="62" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="288" font-size="9.5" font-weight="700" fill="#be123c">2. 眼振方向（N）</text>
  <text x="796" y="304" font-size="9.5" fill="#1e293b">隨凝視方向而改變</text>
  <text x="796" y="320" font-size="9.5" font-weight="700" fill="#be123c">或純垂直／純扭轉</text>

  <!-- Row 3: Test of Skew -->
  <rect x="646" y="340" width="134" height="58" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="654" y="356" font-size="9.5" font-weight="700" fill="#0f766e">3. 垂直斜視（TS）</text>
  <text x="654" y="372" font-size="9.5" fill="#1e293b">交替遮蓋眼球穩定</text>
  <text x="654" y="388" font-size="9.5" font-weight="700" fill="#0f766e">陰性（無垂直偏移）</text>

  <rect x="788" y="340" width="134" height="58" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="356" font-size="9.5" font-weight="700" fill="#be123c">3. 垂直斜視（TS）</text>
  <text x="796" y="372" font-size="9.5" fill="#1e293b">腦幹耳石重力徑受損</text>
  <text x="796" y="388" font-size="9.5" font-weight="700" fill="#be123c">陽性（見垂直重對焦）</text>

  <!-- Row 4: Plus Hearing & Gait -->
  <rect x="646" y="404" width="134" height="58" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="654" y="420" font-size="9.5" font-weight="700" fill="#0f766e">4. Plus 聽力與站立</text>
  <text x="654" y="436" font-size="9.5" fill="#1e293b">雙耳聽力完全正常</text>
  <text x="654" y="452" font-size="9.5" fill="#0f766e">保護下尚可扶持站立</text>

  <rect x="788" y="404" width="134" height="58" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="796" y="420" font-size="9.5" font-weight="700" fill="#be123c">4. Plus 聽力與站立</text>
  <text x="796" y="436" font-size="9.5" font-weight="700" fill="#be123c">新發單側聽損(AICA)</text>
  <text x="796" y="452" font-size="9.5" fill="#1e293b">或重度軀幹失調難站</text>

  <!-- Decision Footer -->
  <rect x="646" y="470" width="276" height="50" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="654" y="487" font-size="9.8" font-weight="700" fill="#991b1b">判讀鐵律（INFARCT）：任一中樞紅旗陽性</text>
  <text x="654" y="505" font-size="9.5" fill="#1e293b">→ 立即啟動後循環中風評估（CTA／腦部 MRI）</text>
</svg>
