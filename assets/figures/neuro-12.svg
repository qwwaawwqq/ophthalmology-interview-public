<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="neuro-12-title neuro-12-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="neuro-12-title">臨床神經電生理定位矩陣、成人神經可塑性與 PGY／R1 病房安全網整合圖</title>
  <desc id="neuro-12-desc">三欄式臨床示意圖：左欄圖解背根神經節前後 SNAP 定位、軸索退化與脫髓鞘波形、針極肌電圖及誘發電位；中欄整理中樞再生阻礙 Nogo-A 與 CSPG、人類碳十四成人神經新生實證及中風跨半球抑制調控；右欄歸納病房中風血壓輸液、腰椎穿刺四管檢核與夜間值班急症處置。</desc>

  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="28" y="28" width="904" height="46" rx="10" fill="#0f172a"/>
  <text x="44" y="49" font-size="16" font-weight="700" fill="#ffffff">臨床神經電生理定位 · 成人神經新生與中風可塑性 · PGY／R1 病房值班安全網</text>
  <text x="44" y="66" font-size="11" fill="#99f6e4">NCS / EMG / 誘發電位 · SVZ/SGZ 碳十四實證與跨胼胝體抑制調控 · 中風控壓 · 腰椎穿刺 · 夜間 NIHSS 惡化處置</text>

  <!-- ==================== PANEL A: ELECTROPHYSIOLOGY ==================== -->
  <rect x="30" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="30" y="82" width="292" height="28" rx="10" fill="#e0f2fe"/>
  <text x="42" y="101" font-size="13" font-weight="700" fill="#0f172a">A. 神經傳導（NCS）與肌電圖定位邏輯</text>

  <!-- Step 1: DRG Watershed -->
  <rect x="40" y="118" width="272" height="94" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="135" font-size="10.5" font-weight="700" fill="#1e3a8a">第一步：以感覺電位（SNAP）切分背根神經節前後</text>
  <rect x="48" y="144" width="124" height="58" rx="5" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="54" y="159" font-size="9.5" font-weight="700" fill="#0f766e">節前（神經根／前角）</text>
  <text x="54" y="174" font-size="9" fill="#1e293b">遠端感覺軸索仍完好</text>
  <text x="54" y="190" font-size="9.5" font-weight="700" fill="#0f766e">→ SNAP 完全正常</text>

  <rect x="180" y="144" width="124" height="58" rx="5" fill="#ffffff" stroke="#fecdd3"/>
  <text x="186" y="159" font-size="9.5" font-weight="700" fill="#be123c">節後（神經叢／周邊）</text>
  <text x="186" y="174" font-size="9" fill="#1e293b">感覺神經纖維瓦勒退化</text>
  <text x="186" y="190" font-size="9.5" font-weight="700" fill="#be123c">→ SNAP 下降或消失</text>

  <!-- Step 2: Axonal vs Demyelinating NCS Waveforms -->
  <rect x="40" y="220" width="272" height="156" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="237" font-size="10.5" font-weight="700" fill="#0f172a">第二步：CMAP 波形鑑別軸索退化 vs 脫髓鞘</text>

  <!-- Normal curve -->
  <text x="48" y="262" font-size="9" font-weight="700" fill="#475569">正常對照</text>
  <path d="M100,260 L122,260 Q132,236 142,260 Q150,274 158,260 L298,260" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="172" y="256" font-size="8.5" fill="#0f766e">潛伏期短 · 波幅高</text>

  <!-- Axonal curve -->
  <text x="48" y="302" font-size="9" font-weight="700" fill="#1d4ed8">軸索退化</text>
  <path d="M100,300 L124,300 Q134,290 144,300 Q152,306 160,300 L298,300" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="172" y="296" font-size="8.5" font-weight="600" fill="#1d4ed8">振幅顯著↓ · 速度保留（＞75%）</text>
  <text x="172" y="309" font-size="8" fill="#475569">EMG 見纖顫正銳波＋巨大多相波</text>

  <!-- Demyelinating curve -->
  <text x="48" y="346" font-size="9" font-weight="700" fill="#be123c">脫髓鞘型</text>
  <path d="M100,344 L156,344 Q172,324 190,344 Q204,356 218,344 L298,344" fill="none" stroke="#be123c" stroke-width="2"/>
  <text x="48" y="366" font-size="8.5" font-weight="600" fill="#be123c">潛伏期與 F 波顯著延長 · 速度↓↓ · 後天型見傳導阻滯</text>

  <!-- Step 3: Needle EMG & Evoked Potentials -->
  <rect x="40" y="384" width="272" height="136" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="48" y="401" font-size="10.5" font-weight="700" fill="#0f766e">第三步：針極 EMG 徵召與誘發電位（EP）</text>
  <text x="48" y="418" font-size="9" fill="#1e293b">· 肌源性 EMG：低振幅、短時程多相波＋早期過度徵召</text>
  <text x="48" y="433" font-size="9" fill="#1e293b">· 神經源性 EMG：高振幅長時程巨大 MUAP＋徵召減少</text>
  <text x="48" y="448" font-size="9" fill="#1e293b">· 晚期反應：F 波（GBS 早期異常）· H 反射（S1 神經根）</text>
  <line x1="48" y1="458" x2="302" y2="458" stroke="#99f6e4"/>
  <text x="48" y="474" font-size="9" font-weight="700" fill="#0f766e">中樞誘發電位三劍客（確認肢溫避免假性減慢）：</text>
  <text x="48" y="490" font-size="9" fill="#1e293b">· VEP（P100 視神經炎） · BAEP（I–V 波橋腦小腦角）</text>
  <text x="48" y="506" font-size="9" fill="#1e293b">· SSEP（脊髓後索本體感覺與缺氧性腦病變預後）</text>

  <!-- ==================== PANEL B: NEUROGENESIS & PLASTICITY ==================== -->
  <rect x="334" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="334" y="82" width="292" height="28" rx="10" fill="#fef3c7"/>
  <text x="346" y="101" font-size="13" font-weight="700" fill="#0f172a">B. 成人神經新生實證與中風跨半球可塑性</text>

  <!-- PNS vs CNS Regeneration Barriers -->
  <rect x="344" y="118" width="272" height="106" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="354" y="135" font-size="10.5" font-weight="700" fill="#92400e">周邊修復優勢 vs 中樞雙重再生分子屏障</text>
  <text x="354" y="152" font-size="9" fill="#0f766e" font-weight="600">· PNS 許旺細胞：清除髓鞘碎片＋分泌滋養因子＋引導再生</text>
  <text x="354" y="168" font-size="9" fill="#be123c" font-weight="600">· CNS 寡突膠質細胞：釋出 Nogo-A / MAG / OMgp 塌陷生長錐</text>
  <text x="354" y="184" font-size="9" fill="#be123c" font-weight="600">· CNS 反應性星狀膠質：分泌 CSPG 形成緻密膠質瘢痕阻隔</text>
  <text x="354" y="201" font-size="8.5" fill="#475569">結論：中樞斷裂難自發長距離再生，功能恢復仰賴「突觸可塑性」</text>
  <text x="354" y="215" font-size="8.5" fill="#475569">（存活神經元軸索側枝發芽 Sprouting ＋ Hebbian LTP 突觸強化）</text>

  <!-- Adult Human Neurogenesis Niches (C14 Birth-Dating) -->
  <rect x="344" y="232" width="272" height="128" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="354" y="249" font-size="10.5" font-weight="700" fill="#1e3a8a">成人哺乳類神經幹細胞雙利基與人類 C¹⁴ 差異</text>
  <rect x="354" y="258" width="122" height="36" rx="5" fill="#1d4ed8"/>
  <text x="415" y="274" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">側腦室下區（SVZ）</text>
  <text x="415" y="287" text-anchor="middle" font-size="8" fill="#dbeafe">人類移行至紋狀體中介元</text>

  <rect x="484" y="258" width="122" height="36" rx="5" fill="#0f766e"/>
  <text x="545" y="274" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">海馬齒狀迴（SGZ）</text>
  <text x="545" y="287" text-anchor="middle" font-size="8" fill="#ccfbf1">年更新 ~1.75% · 運動促進</text>

  <text x="354" y="312" font-size="9" font-weight="700" fill="#be123c">必考物種差異：成年人類「嗅球」與「大腦皮質」無神經新生！</text>
  <text x="354" y="328" font-size="9" fill="#1e293b">· 促進因子：有氧運動、豐富環境學習；抑制：慢性壓力、老化</text>
  <text x="354" y="344" font-size="8.5" fill="#475569">· 外源幹細胞挑戰：旁分泌免疫調節為主，須防範品質與致瘤風險</text>

  <!-- Stroke Interhemispheric Inhibition Diagram -->
  <rect x="344" y="368" width="272" height="152" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="354" y="385" font-size="10.5" font-weight="700" fill="#0f172a">腦中風跨胼胝體半球間抑制失衡與 rTMS 復健</text>

  <!-- Two Hemispheres -->
  <ellipse cx="412" cy="434" rx="52" ry="34" fill="#fee2e2" stroke="#be123c" stroke-width="1.8"/>
  <circle cx="394" cy="424" r="9" fill="#991b1b"/>
  <text x="416" y="427" font-size="9" font-weight="700" fill="#991b1b">病灶側皮質</text>
  <text x="412" y="445" text-anchor="middle" font-size="8.5" fill="#be123c">興奮性下降 ↓</text>
  <text x="412" y="458" text-anchor="middle" font-size="8" font-weight="700" fill="#0f766e">高頻 rTMS 興奮</text>

  <ellipse cx="548" cy="434" rx="52" ry="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="548" y="427" text-anchor="middle" font-size="9" font-weight="700" fill="#1e3a8a">健側運動皮質</text>
  <text x="548" y="445" text-anchor="middle" font-size="8.5" fill="#1d4ed8">代償活性過高 ↑</text>
  <text x="548" y="458" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">低頻 rTMS 抑制</text>

  <!-- Transcallosal excessive inhibition arrow -->
  <path d="M494,428 L468,428" stroke="#be123c" stroke-width="2.5"/>
  <polygon points="468,428 475,423 475,433" fill="#be123c"/>
  <text x="480" y="418" text-anchor="middle" font-size="8" font-weight="700" fill="#be123c">過度跨半球抑制</text>

  <text x="354" y="488" font-size="9" fill="#1e293b">· 主動任務導向重複復健＋限制健肢療法驅動皮質突觸重組</text>
  <text x="354" y="505" font-size="9" fill="#0f766e" font-weight="600">· 專科訓練基準：核心輪訓＋電生理判讀＋ANLS 高級神經救命術</text>

  <!-- ==================== PANEL C: PGY/R1 WARD SAFETY NET ==================== -->
  <rect x="638" y="82" width="292" height="448" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="638" y="82" width="292" height="28" rx="10" fill="#ccfbf1"/>
  <text x="650" y="101" font-size="13" font-weight="700" fill="#0f172a">C. PGY／R1 神經科病房值班三大安全網</text>

  <!-- Ward Card 1: Stroke Admission & BP/Fluids -->
  <rect x="648" y="118" width="272" height="124" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="658" y="135" font-size="10.5" font-weight="700" fill="#0f766e">1. 急性中風入院評估、吞嚥與血壓輸液紅線</text>
  <text x="658" y="152" font-size="9.2" fill="#1e293b">· 未完成床邊吞嚥飲水篩檢前：嚴禁由口喝水與口服給藥！</text>
  <text x="658" y="168" font-size="9.2" fill="#1e293b">· 輸液首選等張 0.9% 生理食鹽水（禁含糖低張液防腦水腫）</text>
  <text x="658" y="184" font-size="9.2" font-weight="700" fill="#0f766e">· 未溶栓血壓：＜220/120 mmHg 採容許性高血壓保灌流</text>
  <text x="658" y="200" font-size="9.2" font-weight="700" fill="#be123c">· 靜脈溶栓：給藥前 ＜185/110 · 給藥後 24h ＜180/105 mmHg</text>
  <text x="658" y="216" font-size="8.8" fill="#475569">· 同步監測心電圖排查陣發心房顫動、血糖控制 140–180 mg/dL</text>
  <text x="658" y="232" font-size="8.8" fill="#475569">· 癲癇住院：床欄防撞軟墊、備妥靜脈管路與抽吸給氧設備</text>

  <!-- Ward Card 2: Lumbar Puncture Checklist -->
  <rect x="648" y="250" width="272" height="134" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="658" y="267" font-size="10.5" font-weight="700" fill="#1e3a8a">2. 腰椎穿刺（LP）安全檢核與腦脊髓液四管判讀</text>
  <text x="658" y="284" font-size="9.2" font-weight="700" fill="#be123c">· 視乳頭水腫／局部缺損／意識改變／免疫不全 → 先排 CT！</text>
  <text x="658" y="300" font-size="9.2" fill="#1e293b">· 確認血小板 ＞50,000/µL、INR 與抗凝血劑停藥安全時窗</text>
  <text x="658" y="316" font-size="9.2" fill="#1e293b">· L3–L4 / L4–L5 入針後「雙腿微伸放鬆」測壓（70–180 mmH₂O）</text>
  <text x="658" y="332" font-size="9.2" fill="#1d4ed8">· 四管順序：1 生化糖蛋白（同步抽血糖）· 2 微生物培養</text>
  <text x="658" y="348" font-size="9.2" fill="#1d4ed8">  3 細胞計數（1→4 管紅血球遞減＝創傷；離心黃變＝SAH）· 4 細胞學</text>
  <text x="658" y="364" font-size="9" fill="#0f766e">· 選用細徑無創筆尖針預防 PDPH；發生予水化咖啡因或血貼片</text>
  <text x="658" y="377" font-size="8.5" fill="#475569">· 細菌性腦膜炎 CSF：PMN↑↑ · 蛋白↑↑ · 糖比值 ＜0.4</text>

  <!-- Ward Card 3: Night On-Call Emergencies -->
  <rect x="648" y="392" width="272" height="128" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="658" y="409" font-size="10.5" font-weight="700" fill="#9f1239">3. 夜間值班急症：意識改變 · NIHSS 惡化 · 撞頭</text>
  <text x="658" y="426" font-size="9.2" font-weight="700" fill="#0f172a">· 床邊 3 分鐘必做：生命徵象＋血氧＋指尖血糖＋瞳孔 GCS</text>
  <text x="658" y="442" font-size="9.2" font-weight="700" fill="#be123c">· NIHSS 惡化 ≥4 分：即刻急排 NCCT 排除出血轉化／腦水腫</text>
  <text x="658" y="458" font-size="9.2" fill="#1e293b">· 疑似院內急性大血管阻塞：啟動中風碼 NCCT＋CTA＋CTP</text>
  <text x="658" y="474" font-size="9.2" fill="#1e293b">· 病房跌倒撞頭：查抗凝劑、低門檻排 NCCT 防遲發硬腦膜下血腫</text>
  <text x="658" y="490" font-size="9.2" fill="#1e293b">· 高齡夜間譫妄：清查感染缺氧尿滯留與藥物，非藥物定向優先</text>
  <text x="658" y="507" font-size="9" font-weight="700" fill="#991b1b">· 禁忌：巴金森譫妄禁打 Haloperidol；老人躁動忌反射給 BZD</text>
</svg>
