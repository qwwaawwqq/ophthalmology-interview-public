<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">單光子閃爍攝影（SPECT）鉛隔準直與正子斷層（PET）雙光子符合偵測原理對照</title>
  <desc id="desc">比較單光子 SPECT 物理鉛準直儀與正子 PET 511 keV 雙光子電子符合偵測機制，並彙整孳生器品管與醫用核種半衰期選擇原則。</desc>
  <defs>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif" fill="#0f172a">
    <text x="42" y="54" font-size="20" font-weight="700">核醫造影物理核心對照：SPECT 物理鉛隔準直 vs PET 511 keV 雙光子電子符合偵測</text>
    <text x="42" y="75" font-size="12.5" fill="#475569">Hevesy 追蹤劑原理（nM–pM 級功能分子影像）· 準直幾何決定靈敏度與空間解析度權衡</text>

    <!-- Left Card: SPECT -->
    <rect x="38" y="90" width="432" height="300" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <rect x="38" y="90" width="432" height="34" rx="10" fill="#ccfbf1"/>
    <text x="54" y="112" font-size="14.5" font-weight="700" fill="#0f766e">A. 閃爍攝影機／SPECT（物理鉛隔準直 · 140 keV 單光子）</text>

    <!-- PMT + Crystal + Collimator Stack -->
    <rect x="92" y="138" width="230" height="24" rx="4" fill="#e2e8f0" stroke="#64748b"/>
    <text x="207" y="154" font-size="11.5" font-weight="600" text-anchor="middle">光電倍增管陣列（PMT）＋ PHA ±10% 能窗</text>
    <rect x="92" y="166" width="230" height="22" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
    <text x="207" y="181" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">NaI(Tl) 閃爍晶體（γ 轉可見光）</text>

    <!-- Lead Collimator Septa -->
    <rect x="92" y="192" width="230" height="32" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <line x1="115" y1="192" x2="115" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="138" y1="192" x2="138" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="161" y1="192" x2="161" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="184" y1="192" x2="184" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="207" y1="192" x2="207" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="230" y1="192" x2="230" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="253" y1="192" x2="253" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="276" y1="192" x2="276" y2="224" stroke="#334155" stroke-width="4"/>
    <line x1="299" y1="192" x2="299" y2="224" stroke="#334155" stroke-width="4"/>
    <text x="334" y="212" font-size="11" font-weight="600" fill="#334155">鉛隔吸收斜向光子</text>

    <!-- Patient Organ & Rays -->
    <ellipse cx="207" cy="286" rx="86" ry="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="172" cy="284" r="11" fill="#f59e0b"/>
    <text x="228" y="290" font-size="12" font-weight="700" fill="#92400e">Tc-99m 病灶 (140 keV)</text>
    <!-- Vertical accepted rays -->
    <line x1="172" y1="272" x2="172" y2="190" stroke="#0f766e" stroke-width="2" marker-end="url(#arrTeal)"/>
    <line x1="149" y1="274" x2="149" y2="190" stroke="#0f766e" stroke-width="2" marker-end="url(#arrTeal)"/>
    <!-- Oblique blocked ray -->
    <line x1="172" y1="272" x2="230" y2="212" stroke="#be123c" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>
    <text x="242" y="246" font-size="10.5" fill="#be123c">斜射被鉛阻擋 (&gt;99.9% 濾除)</text>

    <!-- Collimator mini-note -->
    <rect x="54" y="328" width="400" height="50" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="64" y="346" font-size="11.5" font-weight="600" fill="#0f766e">· 平行孔 LEHR（高解析）vs HEGP（I-131 364 keV 防鉛隔穿透星狀假影）</text>
    <text x="64" y="366" font-size="11.5" fill="#334155">· 針孔（Pinhole）：貼近甲狀腺具放大效應 · SPECT 靈敏度 ~0.01%、解析度 7–12 mm</text>

    <!-- Right Card: PET -->
    <rect x="490" y="90" width="432" height="300" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
    <rect x="490" y="90" width="432" height="34" rx="10" fill="#dbeafe"/>
    <text x="506" y="112" font-size="14.5" font-weight="700" fill="#1d4ed8">B. 正子斷層 PET/CT（電子符合偵測 · 511 keV 互毀雙光子）</text>

    <!-- PET Detector Ring -->
    <circle cx="655" cy="226" r="82" fill="none" stroke="#1e40af" stroke-width="12" stroke-dasharray="18,4"/>
    <circle cx="655" cy="226" r="50" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <!-- Positron & Annihilation -->
    <circle cx="642" cy="232" r="6" fill="#be123c"/>
    <text x="612" y="250" font-size="10.5" font-weight="700" fill="#be123c">β+ 核種</text>
    <path d="M648 230 Q654 220 660 222" fill="none" stroke="#be123c" stroke-width="2"/>
    <circle cx="662" cy="221" r="5" fill="#f59e0b" stroke="#b45309"/>
    <!-- 180 deg 511 keV photons -->
    <line x1="662" y1="221" x2="582" y2="195" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arrBlue)"/>
    <line x1="662" y1="221" x2="736" y2="246" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arrBlue)"/>
    <text x="615" y="185" font-size="10.5" font-weight="700" fill="#1d4ed8">511 keV</text>
    <text x="678" y="262" font-size="10.5" font-weight="700" fill="#1d4ed8">511 keV (180°±0.25°)</text>

    <!-- Right side annotations inside Card B -->
    <rect x="752" y="138" width="156" height="172" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="762" y="158" font-size="12" font-weight="700" fill="#1e3a8a">電子準直與物理極限</text>
    <text x="762" y="178" font-size="11" fill="#334155">1. 免鉛隔！靈敏度高 &gt;100 倍</text>
    <text x="762" y="197" font-size="11" fill="#334155">2. LSO/LYSO 晶體＋TOF 定位</text>
    <text x="762" y="216" font-size="11" fill="#334155">3. 解析度 4–5 mm 受限於：</text>
    <text x="770" y="234" font-size="10.5" fill="#be123c">· 正子射程 (Rb-82/Ga-68 &gt; F-18)</text>
    <text x="770" y="251" font-size="10.5" fill="#be123c">· 雙光子非共線性 (±0.25°)</text>
    <text x="762" y="272" font-size="11" font-weight="600" fill="#0f766e">4. 放療生物靶體積 (BTV)：</text>
    <text x="770" y="290" font-size="10.5" fill="#334155">FDG 糖解·FLT 增殖·FMISO 缺氧</text>

    <rect x="506" y="328" width="400" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="516" y="346" font-size="11.5" font-weight="600" fill="#1d4ed8">· FDG 代謝滯留：GLUT1 入胞 → 己糖激酶磷酸化為 FDG-6-P 卡在胞內</text>
    <text x="516" y="366" font-size="11.5" fill="#334155">· 高血糖競爭致腫瘤 SUV 偽低；&lt;8–10 mm 小結節具部分體積效應低估</text>

    <!-- Bottom Strip: Generator QC & Half-Life Selection -->
    <rect x="38" y="404" width="884" height="120" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
    <rect x="38" y="404" width="884" height="30" rx="10" fill="#fef3c7"/>
    <text x="54" y="424" font-size="13.5" font-weight="700" fill="#92400e">C. 孳生器平衡、放射化學品管假影與體內／體外核種半衰期鐵律</text>

    <text x="54" y="454" font-size="12" font-weight="700" fill="#0f172a">1. 母子核種平衡與突破上限：</text>
    <text x="54" y="474" font-size="11.5" fill="#334155">· 暫態平衡：Mo-99/Tc-99m (66h : 6h) · 永恆平衡：Ge-68/Ga-68、Sr-82/Rb-82</text>
    <text x="54" y="494" font-size="11.5" fill="#be123c">· 品管紅線：Mo-99 &lt; 0.15 μCi/mCi Tc-99m；氧化鋁 Al3+ &lt; 10 μg/mL（防肝肺凝集）</text>
    <text x="54" y="514" font-size="11.5" fill="#334155">· 薄層層析：游離 TcO4-（丙酮跑頂端 → 胃/甲狀腺/唾液腺亮）vs 膠體 TcO2（食鹽水留原點 → 肝脾亮）</text>

    <line x1="560" y1="440" x2="560" y2="516" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="578" y="454" font-size="12" font-weight="700" fill="#0f766e">2. 歷屆必考核種半衰期與儀器配對：</text>
    <text x="578" y="475" font-size="11.5" fill="#334155">· 體內 SPECT 造影：選「適中半衰期＋無粒子」(Tc-99m 6h)</text>
    <text x="578" y="495" font-size="11.5" fill="#334155">· 體外 RIA 免疫檢驗：選「長半衰期」(I-125 60d)＋Gamma counter</text>
    <text x="578" y="514" font-size="11.5" fill="#1d4ed8">· 骨掃描僅 5% 骨礦質變化即顯影（傳統 X 光需 30–50% 脫鈣）</text>
  </g>
</svg>
