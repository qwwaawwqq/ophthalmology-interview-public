<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">心肌灌注左心室牛眼圖血管支配、可逆缺血與冬眠存活心肌判讀圖譜</title>
  <desc id="desc">呈現 17 節段牛眼圖三大冠狀動脈流域、可逆性缺血對比冬眠存活心肌 FDG 不匹配與穿壁疤痕，以及缺血瀑布與壓力負荷藥物安全選擇。</desc>
  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif" fill="#0f172a">
    <text x="40" y="52" font-size="20" font-weight="700">核子心臟學整合圖譜：17 節段牛眼圖、冬眠存活心肌配對與壓力負荷決策</text>
    <text x="40" y="73" font-size="12.5" fill="#475569">SPECT RAO 45°–LPO 45° (180°) 取像 · 缺血心肌 &gt;= 10% 建議血管重建 · TID &gt; 1.2 / LHR &gt; 0.5 高危警訊</text>

    <!-- Panel A: Bull's-Eye -->
    <rect x="36" y="88" width="276" height="434" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <rect x="36" y="88" width="276" height="32" rx="10" fill="#ccfbf1"/>
    <text x="50" y="109" font-size="14" font-weight="700" fill="#0f766e">A. 牛眼圖冠脈流域與衰減假影</text>

    <!-- Polar Plot Circles -->
    <circle cx="174" cy="238" r="88" fill="#fef2f2" stroke="#334155" stroke-width="1.8"/>
    <!-- Inferior sector RCA -->
    <path d="M112 300 A88 88 0 0 0 236 300 L174 238 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
    <!-- Lateral sector LCx -->
    <path d="M236 176 A88 88 0 0 1 236 300 L174 238 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
    <circle cx="174" cy="238" r="56" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
    <circle cx="174" cy="238" r="24" fill="#fee2e2" stroke="#be123c" stroke-width="1.5"/>

    <text x="174" y="142" font-size="11.5" font-weight="700" fill="#be123c" text-anchor="middle">前壁 Anterior (LAD)</text>
    <text x="72" y="242" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">中隔</text>
    <text x="72" y="256" font-size="10.5" fill="#991b1b" text-anchor="middle">(LAD)</text>
    <text x="274" y="242" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">側壁</text>
    <text x="274" y="256" font-size="10.5" fill="#1d4ed8" text-anchor="middle">(LCx)</text>
    <text x="174" y="242" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle">心尖</text>
    <text x="174" y="344" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">下壁 Inferior (RCA)</text>

    <rect x="48" y="360" width="252" height="148" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="58" y="380" font-size="12" font-weight="700" fill="#0f172a">常見假影與校正法則：</text>
    <text x="58" y="400" font-size="11" fill="#334155">· 女性乳房遮蔽 → 前壁固定低計數</text>
    <text x="58" y="419" font-size="11" fill="#0f766e">· 肥胖男性橫膈 → 下壁低計數</text>
    <text x="66" y="436" font-size="10.5" fill="#0f766e">（改採俯臥位 Prone 或門控增厚校正）</text>
    <text x="58" y="456" font-size="11" fill="#be123c">· LBBB 運動負荷 → 中隔假陽性缺損</text>
    <text x="58" y="476" font-size="11" fill="#1d4ed8">· 三支均衡狹窄 → 半定量易偽陰性</text>
    <text x="62" y="494" font-size="10.5" fill="#1d4ed8">（靠 TID&gt;1.2 或 PET/CZT 測 CFR）</text>

    <!-- Panel B: Stress / Rest / FDG Matrix -->
    <rect x="326" y="88" width="320" height="434" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
    <rect x="326" y="88" width="320" height="32" rx="10" fill="#dbeafe"/>
    <text x="340" y="109" font-size="14" font-weight="700" fill="#1d4ed8">B. 負荷／休息灌注與 FDG 存活心肌配對</text>

    <text x="382" y="140" font-size="11.5" font-weight="700" text-anchor="middle">負荷 Stress</text>
    <text x="466" y="140" font-size="11.5" font-weight="700" text-anchor="middle">休息 Rest</text>
    <text x="556" y="140" font-size="11.5" font-weight="700" text-anchor="middle">糖負荷 FDG</text>

    <!-- Row 1: Reversible Ischemia -->
    <rect x="338" y="150" width="296" height="106" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <circle cx="382" cy="190" r="26" fill="none" stroke="#f59e0b" stroke-width="10"/>
    <path d="M364 170 A26 26 0 0 1 400 170" fill="none" stroke="#cbd5e1" stroke-width="11"/>
    <circle cx="466" cy="190" r="26" fill="none" stroke="#f59e0b" stroke-width="10"/>
    <rect x="522" y="172" width="70" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="557" y="194" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">免做即可定</text>
    <text x="348" y="242" font-size="11" font-weight="700" fill="#b45309">1. 可逆性缺血（Reversible）：≥10% 血管重建</text>

    <!-- Row 2: Hibernating Viable (Mismatch) -->
    <rect x="338" y="268" width="296" height="114" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="382" cy="310" r="26" fill="none" stroke="#f59e0b" stroke-width="10"/>
    <path d="M364 290 A26 26 0 0 1 400 290" fill="none" stroke="#94a3b8" stroke-width="11"/>
    <circle cx="466" cy="310" r="26" fill="none" stroke="#f59e0b" stroke-width="10"/>
    <path d="M448 290 A26 26 0 0 1 484 290" fill="none" stroke="#94a3b8" stroke-width="11"/>
    <circle cx="556" cy="310" r="26" fill="none" stroke="#0f766e" stroke-width="10"/>
    <path d="M538 290 A26 26 0 0 1 574 290" fill="none" stroke="#be123c" stroke-width="12"/>
    <text x="348" y="360" font-size="11" font-weight="700" fill="#0f766e">2. 冬眠存活心肌（低血流＋高 FDG Mismatch）</text>
    <text x="348" y="376" font-size="10.5" fill="#334155">無氧糖解求生 → CABG／PCI 重建後收縮力顯著恢復</text>

    <!-- Row 3: Transmural Scar (Match) -->
    <rect x="338" y="394" width="296" height="114" rx="8" fill="#fef2f2" stroke="#fecdd3"/>
    <circle cx="382" cy="436" r="26" fill="none" stroke="#f59e0b" stroke-width="10"/>
    <path d="M364 416 A26 26 0 0 1 400 416" fill="none" stroke="#94a3b8" stroke-width="11"/>
    <circle cx="466" cy="436" r="26" fill="none" stroke="#f59e0b" stroke-width="10"/>
    <path d="M448 416 A26 26 0 0 1 484 416" fill="none" stroke="#94a3b8" stroke-width="11"/>
    <circle cx="556" cy="436" r="26" fill="none" stroke="#0f766e" stroke-width="10"/>
    <path d="M538 416 A26 26 0 0 1 574 416" fill="none" stroke="#94a3b8" stroke-width="11"/>
    <text x="348" y="486" font-size="11" font-weight="700" fill="#be123c">3. 穿壁心肌疤痕（血流與 FDG 皆缺 Match）</text>
    <text x="348" y="502" font-size="10.5" fill="#334155">壞死逾壁厚 50% → 血管重建無益，採心衰竭藥物治療</text>

    <!-- Panel C: Cascade + Stress Drugs + Tracers -->
    <rect x="660" y="88" width="264" height="434" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <rect x="660" y="88" width="264" height="32" rx="10" fill="#fef3c7"/>
    <text x="674" y="109" font-size="14" font-weight="700" fill="#92400e">C. 缺血瀑布與負荷／心功能考點</text>

    <text x="670" y="138" font-size="12" font-weight="700" fill="#0f172a">1. 缺血瀑布（由早到晚必考）：</text>
    <rect x="670" y="146" width="244" height="86" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="678" y="164" font-size="10.5" font-weight="600" fill="#92400e">① 冠脈血流灌注不均 (MPI 最早抓到)</text>
    <text x="678" y="181" font-size="10.5" font-weight="600" fill="#be123c">② 舒張功能下降 (PFR↓，早於收縮！)</text>
    <text x="678" y="198" font-size="10" fill="#334155">③ 收縮壁運動與 EF↓ → ④ ECG ST 變化</text>
    <text x="678" y="215" font-size="10.5" fill="#475569">⑤ 臨床心絞痛胸痛（最晚出現）</text>

    <text x="670" y="254" font-size="12" font-weight="700" fill="#0f172a">2. 藥物壓力負荷與解毒劑：</text>
    <rect x="670" y="262" width="244" height="104" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="678" y="280" font-size="10" font-weight="700" fill="#1d4ed8">· 擴張劑 (Adenosine / Dipyridamole)</text>
    <text x="678" y="297" font-size="10" fill="#334155">A2A 擴張冠脈；禁於氣喘、高度 AV block</text>
    <text x="678" y="313" font-size="10" font-weight="600" fill="#be123c">停咖啡因 12–24h · 解毒 Aminophylline</text>
    <text x="678" y="333" font-size="10.5" font-weight="700" fill="#0f766e">· Dobutamine (β1 強心耗氧負荷)</text>
    <text x="678" y="350" font-size="10" fill="#334155">氣喘替代首選 · 避 LBBB · 解毒 Esmolol</text>

    <text x="670" y="386" font-size="12" font-weight="700" fill="#0f172a">3. 示蹤劑與特殊心肌病變珍珠：</text>
    <rect x="670" y="394" width="244" height="116" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="678" y="412" font-size="10" fill="#334155">· Tl-201：心肌佔 3–4%，單針看再分布</text>
    <text x="678" y="429" font-size="10" fill="#334155">· Rb-82 PET：T1/2 75s，檢查約 40m</text>
    <text x="678" y="446" font-size="10" fill="#334155">· MUGA (LAO 45°)：RBC 精算 EF/PFR</text>
    <text x="678" y="463" font-size="10" fill="#0f766e">· 類肉瘤 FDG：高脂低碳水＋禁食 12–18h</text>
    <text x="678" y="480" font-size="10" fill="#1d4ed8">· Tc-99m PYP：排除 AL 後確診 ATTR-CM</text>
    <text x="678" y="497" font-size="10" fill="#be123c">· I-123 MIBG：心衰/PD 延遲 H/M 比值↓</text>
  </g>
</svg>
