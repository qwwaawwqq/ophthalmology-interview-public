<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title-nm-07 desc-nm-07" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="title-nm-07">精準診療合一（Theranostics）分子配對、射線物理射程與關鍵器官保護總覽</title>
  <desc id="desc-nm-07">呈現核醫精準診療合一閉環（伴隨診斷造影確認受體表現、配對標靶治療核種擊殺與治療後定量劑量學），並比較 α 與 β 粒子射程及護腎、護唾液腺、肝肺分流與 FDG 胰島素安全規範。</desc>

  <rect x="20" y="20" width="920" height="520" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 36 20 H 924 A 16 16 0 0 1 940 36 V 74 H 20 V 36 A 16 16 0 0 1 36 20 Z" fill="#1d4ed8"/>
  <text x="46" y="54" font-size="20" font-weight="700" fill="#ffffff">腫瘤核醫與精準診療合一（Theranostics）：分子配對 · 射程物理 · 關鍵器官防護</text>

  <!-- Top Closed-Loop Banner -->
  <rect x="38" y="88" width="272" height="72" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="174" y="114" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">1 · 伴隨式診斷（Seeing）</text>
  <text x="174" y="136" font-size="11" fill="#0f172a" text-anchor="middle">Ga-68/F-18 PET · I-123/MAA SPECT</text>
  <text x="174" y="152" font-size="10.5" fill="#475569" text-anchor="middle">確認全身標靶高表現、排除無標靶去分化灶</text>

  <path d="M 316 124 L 348 124" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="348,118 360,124 348,130" fill="#0f172a"/>

  <rect x="364" y="88" width="232" height="72" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="480" y="114" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">2 · 專一細胞受體／微血管</text>
  <text x="480" y="136" font-size="11" fill="#0f172a" text-anchor="middle">SSTR2 · PSMA · NIS · NET-1</text>
  <text x="480" y="152" font-size="10.5" fill="#475569" text-anchor="middle">同一配體切換診斷與治療放射性同位素</text>

  <path d="M 602 124 L 634 124" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="634,118 646,124 634,130" fill="#0f172a"/>

  <rect x="650" y="88" width="272" height="72" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="786" y="114" font-size="15" font-weight="700" fill="#be123c" text-anchor="middle">3 · 標靶核種擊殺＋劑量驗證</text>
  <text x="786" y="136" font-size="11.5" fill="#0f172a" text-anchor="middle">Lu-177 · I-131 · Ra-223 · Y-90</text>
  <text x="786" y="152" font-size="10.5" fill="#475569" text-anchor="middle">β-/α 擊殺腫瘤＋治療後 SPECT/PET 定量</text>

  <!-- Left Matrix: 5 Classic Pairings & Organ Protection -->
  <rect x="38" y="176" width="548" height="346" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="204" font-size="15" font-weight="700" fill="#0f172a">五大臨床診療合一配對與限制劑量器官保護鐵律</text>

  <!-- Row headers -->
  <rect x="52" y="216" width="520" height="28" rx="6" fill="#e2e8f0"/>
  <text x="64" y="235" font-size="12" font-weight="700" fill="#0f172a">腫瘤／標靶</text>
  <text x="198" y="235" font-size="12" font-weight="700" fill="#1d4ed8">診斷 → 治療核種</text>
  <text x="360" y="235" font-size="12" font-weight="700" fill="#be123c">必考器官防護與禁忌</text>

  <!-- Row 1: NET -->
  <rect x="52" y="250" width="520" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="270" font-size="11" font-weight="700" fill="#0f172a">分化良好 G1–G3 NET</text>
  <text x="60" y="288" font-size="10" fill="#475569">SSTR2（NEC 轉吃 FDG）</text>
  <text x="198" y="272" font-size="12" font-weight="600" fill="#1d4ed8">Ga-68 → Lu-177</text>
  <text x="198" y="288" font-size="10" fill="#334155">DOTATATE（G3 宜搭 FDG）</text>
  <text x="346" y="270" font-size="11" font-weight="700" fill="#be123c">護腎：先止吐＋L-Lys/L-Arg ≥ 4h</text>
  <text x="346" y="288" font-size="10.5" fill="#334155">長效體抑素須停滿 ≥ 4 週</text>

  <!-- Row 2: mCRPC PSMA -->
  <rect x="52" y="304" width="520" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="324" font-size="12" font-weight="700" fill="#0f172a">去勢抗性攝護腺癌</text>
  <text x="64" y="342" font-size="11" fill="#475569">標靶：PSMA 跨膜蛋白</text>
  <text x="198" y="326" font-size="12" font-weight="600" fill="#1d4ed8">Ga-68/F-18 → Lu-177</text>
  <text x="198" y="342" font-size="11" fill="#334155">PSMA-617（排除陰性大灶）</text>
  <text x="346" y="324" font-size="11" font-weight="700" fill="#be123c">護腺／骨髓：防口乾與血小板低下</text>
  <text x="346" y="342" font-size="10.5" fill="#334155">多喝水排尿（無須正電胺基酸）</text>

  <!-- Row 3: Bone Ra-223 -->
  <rect x="52" y="358" width="520" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="378" font-size="12" font-weight="700" fill="#0f172a">mCRPC 單純骨轉移</text>
  <text x="64" y="396" font-size="11" fill="#475569">標靶：成骨類鈣羥基磷灰石</text>
  <text x="198" y="380" font-size="12" font-weight="600" fill="#0f766e">MDP 骨掃描 → Ra-223</text>
  <text x="198" y="396" font-size="11" fill="#334155">高能 α 粒子（T1/2 11.4d）</text>
  <text x="346" y="378" font-size="11" font-weight="700" fill="#b45309">無內臟轉移才可用；延長整體存活</text>
  <text x="346" y="396" font-size="10.5" fill="#334155">超短射程 &lt;100 μm 保護鄰近紅骨髓</text>

  <!-- Row 4: Liver Y-90 -->
  <rect x="52" y="412" width="520" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="432" font-size="12" font-weight="700" fill="#0f172a">肝癌／大腸癌肝轉移</text>
  <text x="64" y="450" font-size="11" fill="#475569">標靶：肝動脈新生血管床</text>
  <text x="198" y="434" font-size="12" font-weight="600" fill="#1d4ed8">Tc-99m MAA → Y-90</text>
  <text x="198" y="450" font-size="11" fill="#334155">微球 SIRT（純高能 β-）</text>
  <text x="346" y="432" font-size="11" font-weight="700" fill="#be123c">必測肺分流（防 &gt;30 Gy 肺炎）</text>
  <text x="346" y="450" font-size="10.5" fill="#334155">栓塞胃十二指腸分支防放射性潰瘍</text>

  <!-- Row 5: DTC & MIBG -->
  <rect x="52" y="466" width="520" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="485" font-size="12" font-weight="700" fill="#0f172a">甲狀腺癌 / 神經嵴腫瘤</text>
  <text x="64" y="502" font-size="11" fill="#475569">標靶：NIS / 正腎上腺素 NET-1</text>
  <text x="198" y="486" font-size="12" font-weight="600" fill="#0f766e">I-123 → I-131 / MIBG</text>
  <text x="198" y="502" font-size="11" fill="#334155">TENIS 轉排 F-18 FDG</text>
  <text x="346" y="485" font-size="10.5" font-weight="700" fill="#0f766e">驗孕陰性＋停乳 ≥6–12w；封甲狀腺</text>
  <text x="346" y="502" font-size="10.5" fill="#334155">MIBG 前停三環抗憂鬱藥與 labetalol</text>

  <!-- Right Panel: Alpha vs Beta Range & FDG Insulin Trap -->
  <rect x="602" y="176" width="320" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="616" y="204" font-size="15" font-weight="700" fill="#0f172a">治療核種射程與 LET 對決</text>

  <!-- Alpha bar -->
  <text x="616" y="232" font-size="12" font-weight="700" fill="#0f766e">α 粒子（Ra-223 / Ac-225）</text>
  <rect x="616" y="240" width="36" height="16" rx="4" fill="#0f766e"/>
  <text x="660" y="252" font-size="10.5" fill="#0f172a">2–10 細胞 (&lt;0.1 mm) · 高 LET 斷雙股</text>

  <!-- Lu-177 Beta bar -->
  <text x="616" y="282" font-size="12" font-weight="700" fill="#1d4ed8">中低能 β-（Lu-177，0.50 MeV）</text>
  <rect x="616" y="290" width="108" height="16" rx="4" fill="#1d4ed8"/>
  <text x="732" y="302" font-size="10.5" fill="#0f172a">最大 ~2 mm · 護小病灶周邊</text>

  <!-- Y-90 Beta bar -->
  <text x="616" y="332" font-size="12" font-weight="700" fill="#be123c">高能純 β-（Y-90，2.28 MeV）</text>
  <rect x="616" y="340" width="248" height="16" rx="4" fill="#be123c"/>
  <text x="616" y="365" font-size="10.5" fill="#475569">平均 2.5 mm／最大 11 mm · 交叉火力覆蓋大腫瘤</text>

  <!-- Bottom Right: FDG Insulin & G-6-Pase Box -->
  <rect x="602" y="386" width="320" height="136" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="614" y="410" font-size="14" font-weight="700" fill="#b45309">F-18 FDG PET 考場生死線</text>
  <text x="614" y="431" font-size="11" font-weight="700" fill="#be123c">· 血糖 240 嚴禁剛打速效胰島素接打 FDG！</text>
  <text x="614" y="449" font-size="10.5" fill="#0f172a">  活化肌肉心肌 GLUT4 → Insulin scan 全作廢</text>
  <text x="614" y="467" font-size="10.5" fill="#0f172a">  （速效胰島素須隔 ≥ 4h；空腹 ≥ 4–6h）</text>
  <text x="614" y="487" font-size="10.5" fill="#0f172a">· 高分化 HCC 富 G-6-Pase 易偽陰（搭 Acetate）</text>
  <text x="614" y="506" font-size="10.5" fill="#0f172a">· Sestamibi 快速洗出 ＝ P-gp（MDR1）抗藥</text>
</svg>
