<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title-nm-08 desc-nm-08" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="title-nm-08">肺通氣灌注 V/Q 配對判讀與肝膽 HIDA 急性膽囊炎決策流程對照</title>
  <desc id="desc-nm-08">左半部呈現急性肺栓塞 V/Q 不一致缺損（灌注楔形冷區而通氣正常）及肺外腦腎顯影右向左分流與胃甲狀腺游離過鎝酸根鑑別；右半部呈現 HIDA 60 分鐘膽囊未顯影之 Morphine 加壓流程、壞疽 Rim sign 與腸出血發炎核醫重點。</desc>

  <rect x="20" y="20" width="920" height="520" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="20" width="920" height="54" rx="16" fill="#0f766e"/>
  <rect x="20" y="54" width="920" height="20" fill="#0f766e"/>
  <text x="46" y="54" font-size="20" font-weight="700" fill="#ffffff">呼吸、消化肝膽與發炎感染核醫：V/Q 肺栓塞配對 · HIDA 膽囊炎與 Rim Sign</text>

  <!-- Left Panel: V/Q & Shunt -->
  <rect x="38" y="88" width="432" height="434" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="116" font-size="16" font-weight="700" fill="#0f172a">A · 肺通氣／灌注（V/Q）PIOPED II 與肺外顯影</text>
  <text x="56" y="136" font-size="12" fill="#475569">平躺注射 Tc-99m MAA（10–90 μm）· 針筒嚴禁回血防血栓熱點</text>

  <!-- Ventilation Lung Box -->
  <rect x="56" y="150" width="188" height="156" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="150" y="172" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">通氣相（Ventilation）</text>
  <path d="M 136 190 C 102 190 88 228 92 276 C 95 288 136 286 140 274 L 140 198 Z" fill="#14b8a6" opacity="0.8"/>
  <path d="M 164 190 C 198 190 212 228 208 276 C 205 288 164 286 160 274 L 160 198 Z" fill="#14b8a6" opacity="0.8"/>
  <text x="150" y="298" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">雙肺氣道通氣均勻正常</text>

  <!-- Perfusion Lung Box with Wedge Defects -->
  <rect x="260" y="150" width="192" height="156" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="356" y="172" font-size="13" font-weight="700" fill="#be123c" text-anchor="middle">灌注相（Perfusion MAA）</text>
  <path d="M 342 190 C 308 190 294 228 298 276 C 301 288 342 286 346 274 L 346 198 Z" fill="#0f766e" opacity="0.82"/>
  <!-- Wedge defect 1 on right lung (viewer left) -->
  <polygon points="296,222 332,238 297,258" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <path d="M 370 190 C 404 190 418 228 414 276 C 411 288 370 286 366 274 L 366 198 Z" fill="#0f766e" opacity="0.82"/>
  <!-- Wedge defect 2 on left lung (viewer right) -->
  <polygon points="413,208 380,226 415,245" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <text x="356" y="298" font-size="11.5" font-weight="700" fill="#be123c" text-anchor="middle">≥2 大節段楔形缺損＝PE 高機率</text>

  <!-- Extrapulmonary Comparison Cards -->
  <rect x="56" y="318" width="396" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="70" y="340" font-size="13" font-weight="700" fill="#1d4ed8">肺灌注見到「肺外器官發亮」秒殺鑑別：</text>
  <text x="70" y="362" font-size="12" font-weight="700" fill="#be123c">· 大腦皮質 ＋ 雙側腎皮質亮 ＝ 右向左分流（肝硬化肝肺症候群／心內分流）</text>
  <text x="70" y="382" font-size="11.5" fill="#334155">  （已知右向左分流或重度肺高壓，MAA 注射微粒數須減半至 10–20 萬顆）</text>
  <text x="70" y="400" font-size="12" font-weight="600" fill="#0f766e">· 胃黏膜 ＋ 甲狀腺 ＋ 唾液腺亮 ＝ 游離過鎝酸根（Free TcO4-）製劑不純物</text>

  <!-- Infection / Sarcoidosis Pearl Box -->
  <rect x="56" y="416" width="396" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="70" y="438" font-size="13" font-weight="700" fill="#0f172a">發炎與感染核醫黃金分流：</text>
  <text x="70" y="458" font-size="11.5" fill="#0f172a">· 四肢人工關節感染：標幟白血球 ＋ 硫膠體骨髓相（空間不一致＝感染）</text>
  <text x="70" y="478" font-size="11.5" font-weight="700" fill="#be123c">· 中軸脊椎骨髓炎 / FUO：首選 F-18 FDG PET/CT（白血球易冷區偽陰性！）</text>
  <text x="70" y="498" font-size="11.5" fill="#0f172a">· 胸腔類肉瘤病（Ga-67）：頭頸 Panda sign ＋ 縱膈肺門 Lambda sign</text>

  <!-- Right Panel: HIDA Cholecystitis & GI Bleed -->
  <rect x="486" y="88" width="436" height="434" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="504" y="116" font-size="16" font-weight="700" fill="#0f172a">B · 急性膽囊炎 HIDA 決策鏈與消化道出血定位</text>
  <text x="504" y="136" font-size="12" fill="#475569">Tc-99m Mebrofenin（抗高膽紅素最佳）· 空腹黃金窗 4–24 小時</text>

  <!-- Step 1 -->
  <rect x="504" y="150" width="400" height="54" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="518" y="171" font-size="12.5" font-weight="700" fill="#0f766e">Step 1 · 受檢前空腹時數核對（防偽陽性）</text>
  <text x="518" y="191" font-size="11.5" fill="#0f172a">禁食 &lt;4h 膽囊正收縮排膽；禁食 &gt;24h 或 TPN 必先慢滴 Sincalide 排膽泥！</text>

  <line x1="704" y1="204" x2="704" y2="220" stroke="#334155" stroke-width="2"/>
  <polygon points="698,218 704,226 710,218" fill="#334155"/>

  <!-- Step 2 -->
  <rect x="504" y="228" width="400" height="62" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="518" y="249" font-size="12.5" font-weight="700" fill="#1d4ed8">Step 2 · 60 分鐘膽囊未顯影 → 先看「小腸通不通」！</text>
  <text x="518" y="268" font-size="11.5" fill="#0f172a">· 總膽管與小腸已亮 → 靜脈給 Morphine 0.04 mg/kg 收縮括約肌續拍 30m</text>
  <text x="518" y="284" font-size="11.5" font-weight="700" fill="#be123c">· 若連總膽管與小腸都全黑 ＝ 急性總膽管完全阻塞（嚴禁施打嗎啡！）</text>

  <line x1="704" y1="290" x2="704" y2="306" stroke="#334155" stroke-width="2"/>
  <polygon points="698,304 704,312 710,304" fill="#334155"/>

  <!-- Step 3: Rim Sign & Diagnosis -->
  <rect x="504" y="314" width="400" height="84" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
  <text x="518" y="336" font-size="13" font-weight="700" fill="#be123c">Step 3 · Morphine 後 30m（或延遲 4h）膽囊仍不顯影</text>
  <text x="518" y="356" font-size="12" font-weight="700" fill="#0f172a">→ 確診「急性膽囊管阻塞（急性膽囊炎）」</text>
  <text x="518" y="376" font-size="12" font-weight="700" fill="#9f1239">紅旗：膽囊窩周圍肝緣彎月帶狀高活性（Pericholecystic Rim Sign）</text>
  <text x="518" y="392" font-size="11.5" fill="#0f172a">＝ 急性壞疽性膽囊炎高穿孔風險 → 立即危急值通報外科急刀／引流！</text>

  <!-- GI Bleeding & Meckel Box -->
  <rect x="504" y="410" width="400" height="98" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="518" y="432" font-size="13" font-weight="700" fill="#b45309">腸胃道出血（Tc-99m RBC）與梅克爾氏憩室必背要點</text>
  <text x="518" y="452" font-size="11.5" fill="#0f172a">· RBC 腸出血（體外法標幟 &gt;95%，偵測 0.05–0.1 mL/min 連續電影收像）：</text>
  <text x="518" y="470" font-size="11.5" font-weight="700" fill="#0f172a">  確診三要件：①原無後有熱區 ＋ ②隨時間變濃 ＋ ③沿腸腔順／逆向移動</text>
  <text x="518" y="490" font-size="11.5" fill="#0f172a">· 梅克爾氏憩室（TcO4-）：預給 H2 阻斷劑增敏，右下腹與胃同步顯影變亮</text>
</svg>
