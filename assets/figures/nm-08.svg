<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title-nm-08 desc-nm-08" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="title-nm-08">肺通氣灌注 V/Q 配對判讀與肝膽 HIDA 急性膽囊炎決策流程對照</title>
  <desc id="desc-nm-08">左半部呈現急性肺栓塞 V/Q 不一致缺損（灌注楔形冷區而通氣正常）及肺外腦腎顯影右向左分流與胃甲狀腺游離過鎝酸根鑑別；右半部呈現 HIDA 60 分鐘膽囊未顯影之 Morphine 加壓流程、壞疽 Rim sign 與腸出血發炎核醫重點。</desc>

  <rect x="20" y="20" width="920" height="520" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 36 20 H 924 A 16 16 0 0 1 940 36 V 74 H 20 V 36 A 16 16 0 0 1 36 20 Z" fill="#0f766e"/>
  <text x="46" y="54" font-size="20" font-weight="700" fill="#ffffff">呼吸、消化肝膽與發炎感染核醫：V/Q 肺栓塞配對 · HIDA 膽囊炎與 Rim Sign</text>

  <!-- Left Panel: V/Q & Shunt -->
  <rect x="38" y="88" width="432" height="434" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="116" font-size="15" font-weight="700" fill="#0f172a">A · 肺通氣／灌注（V/Q）PIOPED II 與肺外顯影</text>
  <text x="54" y="136" font-size="11.5" fill="#475569">平躺注射 Tc-99m MAA（10–90 μm）· 針筒嚴禁回血防血栓熱點</text>

  <!-- Ventilation Lung Box -->
  <rect x="54" y="150" width="190" height="156" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="149" y="172" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">通氣相（Ventilation）</text>
  <path d="M 136 190 C 102 190 88 228 92 276 C 95 288 136 286 140 274 L 140 198 Z" fill="#14b8a6" opacity="0.8"/>
  <path d="M 164 190 C 198 190 212 228 208 276 C 205 288 164 286 160 274 L 160 198 Z" fill="#14b8a6" opacity="0.8"/>
  <text x="149" y="298" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">雙肺氣道通氣均勻正常</text>

  <!-- Perfusion Lung Box with Wedge Defects -->
  <rect x="258" y="150" width="198" height="156" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="357" y="172" font-size="12.5" font-weight="700" fill="#be123c" text-anchor="middle">灌注相（Perfusion MAA）</text>
  <path d="M 342 190 C 308 190 294 228 298 276 C 301 288 342 286 346 274 L 346 198 Z" fill="#0f766e" opacity="0.82"/>
  <!-- Wedge defect 1 on right lung (viewer left) -->
  <polygon points="296,222 332,238 297,258" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <path d="M 370 190 C 404 190 418 228 414 276 C 411 288 370 286 366 274 L 366 198 Z" fill="#0f766e" opacity="0.82"/>
  <!-- Wedge defect 2 on left lung (viewer right) -->
  <polygon points="413,208 380,226 415,245" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <text x="357" y="298" font-size="10.5" font-weight="700" fill="#be123c" text-anchor="middle">≥2 大節段楔形缺損＝PE 高機率</text>

  <!-- Extrapulmonary Comparison Cards -->
  <rect x="52" y="314" width="404" height="94" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="335" font-size="12.5" font-weight="700" fill="#1d4ed8">肺灌注見到「肺外器官發亮」秒殺鑑別：</text>
  <text x="64" y="355" font-size="10.5" font-weight="700" fill="#be123c">· 腦皮質＋雙腎皮質亮 ＝ 右向左分流（肝肺症候群／心內分流）</text>
  <text x="64" y="373" font-size="10" fill="#334155">  （已知分流或重度肺高壓，MAA 微粒數須減半至 10–20 萬顆）</text>
  <text x="64" y="393" font-size="10.5" font-weight="600" fill="#0f766e">· 胃黏膜＋甲狀腺＋唾液腺亮 ＝ 游離過鎝酸根（Free TcO4-）</text>

  <!-- Infection / Sarcoidosis Pearl Box -->
  <rect x="52" y="416" width="404" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="64" y="436" font-size="12.5" font-weight="700" fill="#0f172a">發炎與感染核醫黃金分流：</text>
  <text x="64" y="456" font-size="10.5" fill="#0f172a">· 四肢人工關節感染：白血球＋硫膠體骨髓相（不一致＝感染）</text>
  <text x="64" y="476" font-size="10.5" font-weight="700" fill="#be123c">· 中軸脊椎骨髓炎/FUO：首選 FDG PET（白血球易冷區偽陰！）</text>
  <text x="64" y="496" font-size="10.5" fill="#0f172a">· 胸腔類肉瘤病（Ga-67）：頭頸 Panda ＋ 肺門 Lambda sign</text>

  <!-- Right Panel: HIDA Cholecystitis & GI Bleed -->
  <rect x="486" y="88" width="436" height="434" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="502" y="116" font-size="15.5" font-weight="700" fill="#0f172a">B · 急性膽囊炎 HIDA 決策鏈與消化道出血定位</text>
  <text x="502" y="136" font-size="11.5" fill="#475569">Tc-99m Mebrofenin（抗高膽紅素最佳）· 空腹黃金窗 4–24 小時</text>

  <!-- Step 1 -->
  <rect x="500" y="150" width="408" height="54" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="512" y="170" font-size="12" font-weight="700" fill="#0f766e">Step 1 · 受檢前空腹時數核對（防偽陽性）</text>
  <text x="512" y="190" font-size="10.5" fill="#0f172a">禁食 &lt;4h 膽囊正收縮排膽；禁食 &gt;24h 或 TPN 先慢滴 Sincalide！</text>

  <line x1="704" y1="204" x2="704" y2="218" stroke="#334155" stroke-width="2"/>
  <polygon points="698,216 704,224 710,216" fill="#334155"/>

  <!-- Step 2 -->
  <rect x="500" y="224" width="408" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="510" y="244" font-size="12" font-weight="700" fill="#1d4ed8">Step 2 · 60 分鐘膽囊未顯影 → 先看「小腸通不通」！</text>
  <text x="510" y="262" font-size="10.5" fill="#0f172a">· 總膽管與小腸已亮 → IV Morphine 0.04 mg/kg 收縮括約肌拍 30m</text>
  <text x="510" y="280" font-size="10" font-weight="700" fill="#be123c">· 60m 小腸未亮：禁打嗎啡！須看肝排泄＋延遲 2–4h 鑑別遲排或總膽管阻塞</text>

  <line x1="704" y1="288" x2="704" y2="302" stroke="#334155" stroke-width="2"/>
  <polygon points="698,300 704,308 710,300" fill="#334155"/>

  <!-- Step 3: Rim Sign & Diagnosis -->
  <rect x="500" y="308" width="408" height="88" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
  <text x="512" y="328" font-size="12.5" font-weight="700" fill="#be123c">Step 3 · Morphine 後 30m（或延遲 4h）膽囊仍不顯影</text>
  <text x="512" y="347" font-size="11.5" font-weight="700" fill="#0f172a">→ 確診「急性膽囊管阻塞（急性膽囊炎）」</text>
  <text x="512" y="366" font-size="10.5" font-weight="700" fill="#9f1239">紅旗：膽囊窩肝緣彎月高活性（Pericholecystic Rim Sign）</text>
  <text x="512" y="384" font-size="10.5" fill="#0f172a">＝ 急性壞疽性膽囊炎高穿孔風險 → 危急值通報外科急刀／引流！</text>

  <!-- GI Bleeding & Meckel Box -->
  <rect x="500" y="408" width="408" height="102" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="512" y="428" font-size="12.5" font-weight="700" fill="#b45309">腸胃道出血（Tc-99m RBC）與梅克爾氏憩室必背要點</text>
  <text x="512" y="448" font-size="10.5" fill="#0f172a">· RBC 腸出血（體外標幟 &gt;95%，抓 0.05–0.1 mL/min 連續收像）：</text>
  <text x="512" y="467" font-size="10.5" font-weight="700" fill="#0f172a">  三要件：①原無後有熱區 ＋ ②隨時間變濃 ＋ ③沿腸順／逆向動</text>
  <text x="512" y="488" font-size="10.5" fill="#0f172a">· 梅克爾氏憩室（TcO4-）：預給 H2 阻斷劑，右下腹與胃同步亮</text>
</svg>
