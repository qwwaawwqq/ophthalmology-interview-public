<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">基本檢查：先安全，再定位</title><desc id="desc">先辨識化學傷或開放性眼球傷，再依病情測視力、瞳孔、前節、眼壓及眼底。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">基本檢查：先安全，再定位</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">從視覺功能出發，逐步整合前節、後節與神經徵象。</text>
<rect x="32" y="108" width="896" height="69" rx="15" fill="#fff0ef" stroke="#e8c3c5"/><text x="52" y="137" font-size="20" fill="#a73337" font-weight="700" text-anchor="start">先排除會改變檢查流程的危急情境</text><text x="52" y="164" font-size="18" fill="#a73337" font-weight="400" text-anchor="start">化學傷：立即沖洗；疑眼球破裂：避免壓眼、眼壓測量及不必要操作。</text><rect x="32" y="218" width="215" height="166" rx="15" fill="white" stroke="#dce3ed"/><text x="50" y="251" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">01  視力與病史</text><text x="50" y="282" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">雙眼分開測量</text><text x="50" y="310" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">起始時間、疼痛、外傷</text><path d="M247 300 L258 300" fill="none" stroke="#087e77" stroke-width="2" marker-end="url(#arrow)"/><rect x="259" y="218" width="215" height="166" rx="15" fill="white" stroke="#dce3ed"/><text x="277" y="251" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">02  瞳孔與功能</text><text x="277" y="282" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">瞳孔反應、RAPD</text><text x="277" y="310" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">視野、眼位與眼球運動</text><path d="M474 300 L485 300" fill="none" stroke="#087e77" stroke-width="2" marker-end="url(#arrow)"/><rect x="486" y="218" width="215" height="166" rx="15" fill="white" stroke="#dce3ed"/><text x="504" y="251" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">03  前節與眼壓</text><text x="504" y="282" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">外觀、裂隙燈、角膜</text><text x="504" y="310" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">安全時再量眼壓</text><path d="M701 300 L712 300" fill="none" stroke="#087e77" stroke-width="2" marker-end="url(#arrow)"/><rect x="713" y="218" width="215" height="166" rx="15" fill="white" stroke="#dce3ed"/><text x="731" y="251" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">04  眼底與定位</text><text x="731" y="282" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">依適應症散瞳眼底檢查</text><text x="731" y="310" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">整合為前節／後節／神經</text><text x="40" y="437" font-size="22" fill="#132743" font-weight="700" text-anchor="start">每一步都回答：視力受影響嗎？病灶在哪裡？需要立即升級處理嗎？</text><text x="40" y="473" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">這是組織檢查的框架；急症處置與完整檢查可依臨床狀況並行。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 01</text>
</g></svg>