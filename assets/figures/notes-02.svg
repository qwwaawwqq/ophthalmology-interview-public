<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">屈光狀態：焦點與視網膜的位置</title><desc id="desc">三幅概念光線圖比較近視焦點在視網膜前、正視在視網膜、遠視在視網膜後，透鏡代表整體屈光系統。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">屈光狀態：焦點與視網膜的位置</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">看焦點落在哪裡，而非只背「眼球長或短」。</text>
<rect x="32" y="111" width="288" height="315" rx="15" fill="white" stroke="#dce3ed"/><text x="176" y="148" font-size="24" fill="#132743" font-weight="700" text-anchor="middle">近視</text><path d="M50 269 L306 269" fill="none" stroke="#dce3ed" stroke-width="1" stroke-dasharray="7 5"/><ellipse cx="107" cy="269" rx="15" ry="70" fill="#eaf8f1" stroke="#087e77" stroke-width="2"/><path d="M259 186 L259 349" fill="none" stroke="#a73337" stroke-width="4"/><text x="255" y="377" font-size="17" fill="#a73337" font-weight="400" text-anchor="middle">視網膜</text><path d="M49 225 L107 225" fill="none" stroke="#087e77" stroke-width="2"/><path d="M107 225 L215 269" fill="none" stroke="#087e77" stroke-width="2"/><path d="M215 269 L259 286.9259259259259" fill="none" stroke="#087e77" stroke-width="2"/><path d="M49 313 L107 313" fill="none" stroke="#087e77" stroke-width="2"/><path d="M107 313 L215 269" fill="none" stroke="#087e77" stroke-width="2"/><path d="M215 269 L259 251.07407407407408" fill="none" stroke="#087e77" stroke-width="2"/><circle cx="215" cy="269" r="5" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="176" y="407" font-size="19" fill="#132743" font-weight="700" text-anchor="middle">焦點在視網膜前</text><rect x="336" y="111" width="288" height="315" rx="15" fill="white" stroke="#dce3ed"/><text x="480" y="148" font-size="24" fill="#132743" font-weight="700" text-anchor="middle">正視</text><path d="M354 269 L610 269" fill="none" stroke="#dce3ed" stroke-width="1" stroke-dasharray="7 5"/><ellipse cx="411" cy="269" rx="15" ry="70" fill="#eaf8f1" stroke="#087e77" stroke-width="2"/><path d="M563 186 L563 349" fill="none" stroke="#a73337" stroke-width="4"/><text x="559" y="377" font-size="17" fill="#a73337" font-weight="400" text-anchor="middle">視網膜</text><path d="M353 225 L411 225" fill="none" stroke="#087e77" stroke-width="2"/><path d="M411 225 L563 269" fill="none" stroke="#087e77" stroke-width="2"/><path d="M353 313 L411 313" fill="none" stroke="#087e77" stroke-width="2"/><path d="M411 313 L563 269" fill="none" stroke="#087e77" stroke-width="2"/><circle cx="563" cy="269" r="5" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="480" y="407" font-size="19" fill="#132743" font-weight="700" text-anchor="middle">焦點落在視網膜</text><rect x="640" y="111" width="288" height="315" rx="15" fill="white" stroke="#dce3ed"/><text x="784" y="148" font-size="24" fill="#132743" font-weight="700" text-anchor="middle">遠視</text><path d="M658 269 L914 269" fill="none" stroke="#dce3ed" stroke-width="1" stroke-dasharray="7 5"/><ellipse cx="715" cy="269" rx="15" ry="70" fill="#eaf8f1" stroke="#087e77" stroke-width="2"/><path d="M867 186 L867 349" fill="none" stroke="#a73337" stroke-width="4"/><text x="863" y="377" font-size="17" fill="#a73337" font-weight="400" text-anchor="middle">視網膜</text><path d="M657 225 L715 225" fill="none" stroke="#087e77" stroke-width="2"/><path d="M715 225 L903 269" fill="none" stroke="#087e77" stroke-width="2"/><path d="M657 313 L715 313" fill="none" stroke="#087e77" stroke-width="2"/><path d="M715 313 L903 269" fill="none" stroke="#087e77" stroke-width="2"/><circle cx="903" cy="269" r="5" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="784" y="407" font-size="19" fill="#132743" font-weight="700" text-anchor="middle">焦點在視網膜後</text><text x="40" y="467" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">平行光、調節放鬆時的概念圖；以單一等效透鏡代表整體屈光系統。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 02</text>
</g></svg>