<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">視野缺損：先判斷「一眼」或「同一側」</title><desc id="desc">左眼視野畫在左、右眼畫在右。比較單眼全部缺損、雙眼顳側缺損及雙眼右半視野缺損；分別提示視交叉前、視交叉、左側視交叉後病灶。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">視野缺損：先判斷「一眼」或「同一側」</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">圖示的是病人看到的視野，不是視網膜影像，也不是面對病人的眼別。</text>
<text x="32" y="114" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">病人視野座標：上方＝上視野；每圈中央十字＝注視點；深色＝缺損</text><rect x="32" y="134" width="288" height="290" rx="15" fill="white" stroke="#dce3ed"/><text x="176" y="170" font-size="23" fill="#132743" font-weight="700" text-anchor="middle">單眼缺損</text><defs><clipPath id="f00"><circle cx="110" cy="265" r="48" fill="white" stroke="#087e77" stroke-width="2"/></clipPath></defs><circle cx="110" cy="265" r="48" fill="white" stroke="#dce3ed" stroke-width="2"/><circle cx="110" cy="265" r="48" fill="#132743" stroke="#132743" stroke-width="2"/><path d="M102 265 L118 265" fill="none" stroke="#087e77" stroke-width="2"/><path d="M110 257 L110 273" fill="none" stroke="#087e77" stroke-width="2"/><text x="110" y="201" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">左眼 OS</text><defs><clipPath id="f01"><circle cx="242" cy="265" r="48" fill="white" stroke="#087e77" stroke-width="2"/></clipPath></defs><circle cx="242" cy="265" r="48" fill="white" stroke="#dce3ed" stroke-width="2"/><path d="M234 265 L250 265" fill="none" stroke="#087e77" stroke-width="2"/><path d="M242 257 L242 273" fill="none" stroke="#087e77" stroke-width="2"/><text x="242" y="201" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">右眼 OD</text><text x="176" y="358" font-size="21" fill="#087e77" font-weight="700" text-anchor="middle">提示視交叉前</text><text x="176" y="391" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">定位線索，需合併完整檢查</text><rect x="336" y="134" width="288" height="290" rx="15" fill="white" stroke="#dce3ed"/><text x="480" y="170" font-size="23" fill="#132743" font-weight="700" text-anchor="middle">雙顳側偏盲</text><defs><clipPath id="f10"><circle cx="414" cy="265" r="48" fill="white" stroke="#087e77" stroke-width="2"/></clipPath></defs><circle cx="414" cy="265" r="48" fill="white" stroke="#dce3ed" stroke-width="2"/><rect x="366" y="217" width="48" height="96" fill="#132743" clip-path="url(#f10)"/><path d="M406 265 L422 265" fill="none" stroke="#087e77" stroke-width="2"/><path d="M414 257 L414 273" fill="none" stroke="#087e77" stroke-width="2"/><text x="414" y="201" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">左眼 OS</text><defs><clipPath id="f11"><circle cx="546" cy="265" r="48" fill="white" stroke="#087e77" stroke-width="2"/></clipPath></defs><circle cx="546" cy="265" r="48" fill="white" stroke="#dce3ed" stroke-width="2"/><rect x="546" y="217" width="48" height="96" fill="#132743" clip-path="url(#f11)"/><path d="M538 265 L554 265" fill="none" stroke="#087e77" stroke-width="2"/><path d="M546 257 L546 273" fill="none" stroke="#087e77" stroke-width="2"/><text x="546" y="201" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">右眼 OD</text><text x="480" y="358" font-size="21" fill="#087e77" font-weight="700" text-anchor="middle">提示視交叉</text><text x="480" y="391" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">定位線索，需合併完整檢查</text><rect x="640" y="134" width="288" height="290" rx="15" fill="white" stroke="#dce3ed"/><text x="784" y="170" font-size="23" fill="#132743" font-weight="700" text-anchor="middle">右同向偏盲</text><defs><clipPath id="f20"><circle cx="718" cy="265" r="48" fill="white" stroke="#087e77" stroke-width="2"/></clipPath></defs><circle cx="718" cy="265" r="48" fill="white" stroke="#dce3ed" stroke-width="2"/><rect x="718" y="217" width="48" height="96" fill="#132743" clip-path="url(#f20)"/><path d="M710 265 L726 265" fill="none" stroke="#087e77" stroke-width="2"/><path d="M718 257 L718 273" fill="none" stroke="#087e77" stroke-width="2"/><text x="718" y="201" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">左眼 OS</text><defs><clipPath id="f21"><circle cx="850" cy="265" r="48" fill="white" stroke="#087e77" stroke-width="2"/></clipPath></defs><circle cx="850" cy="265" r="48" fill="white" stroke="#dce3ed" stroke-width="2"/><rect x="850" y="217" width="48" height="96" fill="#132743" clip-path="url(#f21)"/><path d="M842 265 L858 265" fill="none" stroke="#087e77" stroke-width="2"/><path d="M850 257 L850 273" fill="none" stroke="#087e77" stroke-width="2"/><text x="850" y="201" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">右眼 OD</text><text x="784" y="358" font-size="21" fill="#087e77" font-weight="700" text-anchor="middle">提示左側視交叉後</text><text x="784" y="391" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">定位線索，需合併完整檢查</text><text x="40" y="459" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">左圈左半、右圈右半為各眼顳側；同向缺損是兩眼同一側的視野缺損。</text><text x="40" y="490" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">實際缺損可不完整、不對稱；單靠示意形狀不能判定病因。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 03</text>
</g></svg>