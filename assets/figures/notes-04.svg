<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">遮蓋試驗：遮住哪眼？觀察哪眼？</title><desc id="desc">單眼遮蓋時觀察未遮眼是否重定位，去遮時觀察原遮眼回復。交替遮蓋解離融合以顯示總偏斜，可加稜鏡量化。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">遮蓋試驗：遮住哪眼？觀察哪眼？</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">單眼遮蓋分辨顯斜與隱斜；交替遮蓋讓融合持續中斷。</text>
<rect x="32" y="109" width="436" height="345" rx="15" fill="white" stroke="#dce3ed"/><rect x="492" y="109" width="436" height="345" rx="15" fill="white" stroke="#dce3ed"/><text x="54" y="148" font-size="25" fill="#132743" font-weight="700" text-anchor="start">Cover–uncover</text><text x="54" y="180" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">單眼遮蓋，再去遮蓋</text><rect x="54" y="204" width="392" height="90" rx="15" fill="#eaf8f1" stroke="#dce3ed"/><text x="72" y="237" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">遮蓋時：看未遮眼</text><text x="72" y="268" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">若移動接替注視 → 提示顯斜</text><rect x="54" y="314" width="392" height="113" rx="15" fill="#f2f5fa" stroke="#dce3ed"/><text x="72" y="347" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">去遮時：看原遮眼</text><text x="72" y="378" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">若恢復融合時回復正位，</text><text x="72" y="406" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">可提示隱斜成分。</text><text x="514" y="148" font-size="25" fill="#132743" font-weight="700" text-anchor="start">Alternate cover</text><text x="514" y="180" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">交替遮蓋，持續解離融合</text><ellipse cx="576" cy="230" rx="31" ry="16" fill="white" stroke="#087e77" stroke-width="3"/><circle cx="576" cy="230" r="8" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="576" y="269" font-size="18" fill="#62728a" font-weight="400" text-anchor="middle">左</text><ellipse cx="795" cy="230" rx="31" ry="16" fill="white" stroke="#087e77" stroke-width="3"/><circle cx="795" cy="230" r="8" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="795" y="269" font-size="18" fill="#62728a" font-weight="400" text-anchor="middle">右</text><rect x="536" y="207" width="55" height="43" rx="7" fill="#132743" stroke="#132743"/><path d="M608 231 L746 231" fill="none" stroke="#087e77" stroke-width="3" marker-end="url(#arrow)"/><text x="514" y="313" font-size="21" fill="#132743" font-weight="700" text-anchor="start">看剛去遮眼的重定位動作</text><text x="514" y="350" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">顯示總偏斜（顯斜＋隱斜）</text><text x="514" y="391" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">加入稜鏡中和可量化偏斜。</text><text x="40" y="491" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">先建立注視目標；分別評估遠、近距離。眼球動作需由受訓人員判讀。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 04</text>
</g></svg>