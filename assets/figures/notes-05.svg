<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">角膜五層：由外向內</title><desc id="desc">從淚膜側到前房側，依序上皮、Bowman 層、基質、Descemet 膜、內皮。光線由外向內，圖層厚度不是量測比例。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">角膜五層：由外向內</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">傳統五層教學架構；以功能理解上皮、基質與內皮。</text>
<text x="55" y="122" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">外界／淚膜側</text><text x="55" y="462" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">前房／房水側</text><rect x="55" y="140" width="390" height="49" rx="0" fill="#ccefe5" stroke="white"/><text x="76" y="171.5" font-size="20" fill="#132743" font-weight="600" text-anchor="start">上皮 Epithelium</text><rect x="55" y="189" width="390" height="29" rx="0" fill="#e8efef" stroke="white"/><text x="76" y="210.5" font-size="20" fill="#132743" font-weight="600" text-anchor="start">Bowman 層</text><rect x="55" y="218" width="390" height="132" rx="0" fill="#c9deee" stroke="white"/><text x="76" y="291.0" font-size="20" fill="#132743" font-weight="600" text-anchor="start">基質 Stroma</text><rect x="55" y="350" width="390" height="29" rx="0" fill="#d7e2e8" stroke="white"/><text x="76" y="371.5" font-size="20" fill="#132743" font-weight="600" text-anchor="start">Descemet 膜</text><rect x="55" y="379" width="390" height="46" rx="0" fill="#a9dbd2" stroke="white"/><text x="76" y="409.0" font-size="20" fill="#132743" font-weight="600" text-anchor="start">內皮 Endothelium</text><path d="M480 145 L480 416" fill="none" stroke="#087e77" stroke-width="4" marker-end="url(#arrow)"/><text x="503" y="277" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">光線</text><text x="503" y="304" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">方向</text><rect x="586" y="130" width="341" height="92" rx="15" fill="white" stroke="#dce3ed"/><text x="604" y="163" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">上皮：屏障</text><text x="604" y="194" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">維持表面完整與平滑。</text><rect x="586" y="237" width="341" height="92" rx="15" fill="white" stroke="#dce3ed"/><text x="604" y="270" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">基質：透明與支撐</text><text x="604" y="301" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">規則膠原排列、含水控制。</text><rect x="586" y="344" width="341" height="108" rx="15" fill="white" stroke="#dce3ed"/><text x="604" y="377" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">內皮：屏障與幫浦</text><text x="604" y="408" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">維持基質適度脫水，</text><text x="604" y="436" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">協助角膜透明。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 05</text>
</g></svg>