<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">白內障：混濁發生在哪一區？</title><desc id="desc">三幅晶狀體側面概念圖，分別標示中央核、周邊皮質，以及位於後囊前的後囊下混濁。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">白內障：混濁發生在哪一區？</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">核性、皮質性、後囊下型，以位置建立第一層辨識。</text>
<text x="32" y="116" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">每幅均為側面概念圖：左＝前方；右＝後方／玻璃體側</text><rect x="32" y="139" width="288" height="288" rx="15" fill="white" stroke="#dce3ed"/><text x="176" y="177" font-size="23" fill="#132743" font-weight="700" text-anchor="middle">核性</text><ellipse cx="176" cy="272" rx="63" ry="82" fill="#eef8f8" stroke="#087e77" stroke-width="3"/><ellipse cx="176" cy="272" rx="30" ry="46" fill="#d7b571" stroke="#855116" stroke-width="2"/><text x="73" y="278" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">前</text><text x="262" y="278" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">後</text><text x="176" y="391" font-size="20" fill="#087e77" font-weight="700" text-anchor="middle">中央晶狀體核</text><rect x="336" y="139" width="288" height="288" rx="15" fill="white" stroke="#dce3ed"/><text x="480" y="177" font-size="23" fill="#132743" font-weight="700" text-anchor="middle">皮質性</text><ellipse cx="480" cy="272" rx="63" ry="82" fill="#eef8f8" stroke="#087e77" stroke-width="3"/><path d="M444 209 L471 246 L487 196Z M452 342 L486 299 L503 345Z" fill="#d7b571" stroke="#855116" stroke-width="2"/><text x="377" y="278" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">前</text><text x="566" y="278" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">後</text><text x="480" y="391" font-size="20" fill="#087e77" font-weight="700" text-anchor="middle">周邊皮質區</text><rect x="640" y="139" width="288" height="288" rx="15" fill="white" stroke="#dce3ed"/><text x="784" y="177" font-size="23" fill="#132743" font-weight="700" text-anchor="middle">後囊下（PSC）</text><ellipse cx="784" cy="272" rx="63" ry="82" fill="#eef8f8" stroke="#087e77" stroke-width="3"/><ellipse cx="838" cy="272" rx="6" ry="24" fill="#d7b571" stroke="#855116" stroke-width="2"/><text x="681" y="278" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">前</text><text x="870" y="278" font-size="17" fill="#62728a" font-weight="400" text-anchor="start">後</text><text x="784" y="391" font-size="20" fill="#087e77" font-weight="700" text-anchor="middle">後囊前方的中央區</text><text x="40" y="468" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">示意混濁所在區域；實際外觀須由裂隙燈與散瞳檢查判讀，類型可以並存。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 06</text>
</g></svg>