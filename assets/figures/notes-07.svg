<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">房水動線：產生、通過、流出</title><desc id="desc">房水由睫狀體到後房，經瞳孔到前房，再分為小樑網及 Schlemm 管路徑與葡萄膜鞏膜路徑。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">房水動線：產生、通過、流出</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">後房與玻璃體腔不同；前房角是傳統流出途徑的關鍵位置。</text>
<rect x="32" y="127" width="203" height="112" rx="15" fill="#eaf8f1" stroke="#dce3ed"/><text x="50" y="160" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">睫狀體</text><text x="50" y="191" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">產生房水</text><path d="M235 183 L256 183" fill="none" stroke="#087e77" stroke-width="3" marker-end="url(#arrow)"/><rect x="263" y="127" width="203" height="112" rx="15" fill="#eaf8f1" stroke="#dce3ed"/><text x="281" y="160" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">後房</text><text x="281" y="191" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">虹膜後方</text><path d="M466 183 L487 183" fill="none" stroke="#087e77" stroke-width="3" marker-end="url(#arrow)"/><rect x="494" y="127" width="203" height="112" rx="15" fill="#eaf8f1" stroke="#dce3ed"/><text x="512" y="160" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">瞳孔</text><text x="512" y="191" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">由此通過</text><path d="M697 183 L718 183" fill="none" stroke="#087e77" stroke-width="3" marker-end="url(#arrow)"/><rect x="725" y="127" width="203" height="112" rx="15" fill="#eaf8f1" stroke="#dce3ed"/><text x="743" y="160" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">前房</text><text x="743" y="191" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">虹膜前方</text><path d="M826 239 L826 283" fill="none" stroke="#087e77" stroke-width="3"/><path d="M826 283 L272 283" fill="none" stroke="#087e77" stroke-width="3"/><path d="M272 283 L272 321" fill="none" stroke="#087e77" stroke-width="3" marker-end="url(#arrow)"/><path d="M826 283 L739 283" fill="none" stroke="#087e77" stroke-width="3"/><path d="M739 283 L739 321" fill="none" stroke="#087e77" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="329" width="446" height="126" rx="15" fill="white" stroke="#dce3ed"/><text x="50" y="362" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">小樑／Schlemm 路徑</text><text x="50" y="393" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">前房角小樑網 → Schlemm 管</text><text x="50" y="421" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">集液管／房水靜脈 → 鞏膜上靜脈</text><rect x="500" y="329" width="428" height="126" rx="15" fill="white" stroke="#dce3ed"/><text x="518" y="362" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">葡萄膜鞏膜路徑</text><text x="518" y="393" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">經睫狀肌間隙 → 睫狀體上／脈絡膜上</text><text x="518" y="421" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">空間，再經鞏膜等途徑流出</text><text x="40" y="491" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">眼壓反映房水產生與流出之間的平衡；此圖不表示各途徑的流量比例。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 07</text>
</g></svg>