<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">眼眶感染：以眶隔與視功能判斷風險</title><desc id="desc">概念圖區分眶隔前眼瞼與眶內組織，並列出眼球運動、突出、複視及視神經功能的警訊。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">眼眶感染：以眶隔與視功能判斷風險</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">眶隔是概念定位界線；眶內病變可能威脅視力。</text>
<rect x="32" y="119" width="896" height="141" rx="15" fill="white" stroke="#dce3ed"/><text x="59" y="151" font-size="22" fill="#132743" font-weight="700" text-anchor="start">眼瞼／眶隔前</text><text x="377" y="151" font-size="22" fill="#087e77" font-weight="700" text-anchor="start">眶隔</text><text x="562" y="151" font-size="22" fill="#132743" font-weight="700" text-anchor="start">眶內組織</text><text x="805" y="151" font-size="22" fill="#a73337" font-weight="700" text-anchor="start">視神經</text><rect x="54" y="176" width="245" height="49" rx="6" fill="#eaf8f1" stroke="#dce3ed"/><path d="M390 168 L390 244" fill="none" stroke="#087e77" stroke-width="6"/><ellipse cx="575" cy="211" rx="59" ry="28" fill="#eef8f8" stroke="#087e77" stroke-width="2"/><path d="M634 211 L822 211" fill="none" stroke="#087e77" stroke-width="10"/><circle cx="842" cy="211" r="15" fill="#fff0ef" stroke="#a73337" stroke-width="2"/><text x="68" y="208" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">發炎位於眶隔之前</text><text x="457" y="246" font-size="16" fill="#62728a" font-weight="400" text-anchor="start">眼球、眼外肌與眶內軟組織</text><rect x="32" y="288" width="282" height="157" rx="15" fill="white" stroke="#dce3ed"/><text x="50" y="321" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">眶隔前病變</text><text x="50" y="352" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">以眼瞼紅腫為主。</text><text x="50" y="380" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">眼球運動、視力與瞳孔</text><text x="50" y="408" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">通常維持正常。</text><rect x="334" y="288" width="290" height="157" rx="15" fill="white" stroke="#dce3ed"/><text x="352" y="321" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">眶內受累警訊</text><text x="352" y="352" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">眼球運動痛或受限、</text><text x="352" y="380" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">眼球突出、複視。</text><text x="352" y="408" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">須緊急評估。</text><rect x="644" y="288" width="284" height="157" rx="15" fill="#fff0ef" stroke="#dce3ed"/><text x="662" y="321" font-size="21" fill="#a73337" font-weight="700" text-anchor="start">視神經受累警訊</text><text x="662" y="352" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">視力／色覺下降、</text><text x="662" y="380" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">RAPD 等提示功能受損。</text><text x="662" y="408" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">立即升級處理。</text><text x="40" y="485" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">這些徵象用於辨識危險程度；不能只憑眼瞼外觀排除眶內病變。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 08</text>
</g></svg>