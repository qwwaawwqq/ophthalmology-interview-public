<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">葡萄膜炎：發炎的主要位置</title><desc id="desc">表格標示前葡萄膜炎主要在前房，中間型在玻璃體，後葡萄膜炎在視網膜或脈絡膜，全葡萄膜炎跨越各區且無主要部位。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">葡萄膜炎：發炎的主要位置</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">解剖分類幫助安排檢查；病因診斷仍需完整病史、眼部表徵與必要檢驗。</text>
<text x="302" y="127" font-size="19" fill="#132743" font-weight="700" text-anchor="middle">前房</text><text x="548" y="127" font-size="19" fill="#132743" font-weight="700" text-anchor="middle">玻璃體</text><text x="788" y="127" font-size="19" fill="#132743" font-weight="700" text-anchor="middle">視網膜／脈絡膜</text><text x="35" y="183" font-size="19" fill="#132743" font-weight="700" text-anchor="start">前葡萄膜炎</text><rect x="209" y="146" width="221" height="58" rx="8" fill="#adebdd" stroke="#dce3ed"/><text x="319" y="182" font-size="18" fill="#087e77" font-weight="600" text-anchor="middle">主要部位</text><rect x="454" y="146" width="221" height="58" rx="8" fill="#e9edf2" stroke="#dce3ed"/><text x="564" y="182" font-size="18" fill="#62728a" font-weight="600" text-anchor="middle">—</text><rect x="699" y="146" width="221" height="58" rx="8" fill="#e9edf2" stroke="#dce3ed"/><text x="809" y="182" font-size="18" fill="#62728a" font-weight="600" text-anchor="middle">—</text><text x="35" y="259" font-size="19" fill="#132743" font-weight="700" text-anchor="start">中間型葡萄膜炎</text><rect x="209" y="222" width="221" height="58" rx="8" fill="#e9edf2" stroke="#dce3ed"/><text x="319" y="258" font-size="18" fill="#62728a" font-weight="600" text-anchor="middle">—</text><rect x="454" y="222" width="221" height="58" rx="8" fill="#adebdd" stroke="#dce3ed"/><text x="564" y="258" font-size="18" fill="#087e77" font-weight="600" text-anchor="middle">主要部位</text><rect x="699" y="222" width="221" height="58" rx="8" fill="#e9edf2" stroke="#dce3ed"/><text x="809" y="258" font-size="18" fill="#62728a" font-weight="600" text-anchor="middle">—</text><text x="35" y="335" font-size="19" fill="#132743" font-weight="700" text-anchor="start">後葡萄膜炎</text><rect x="209" y="298" width="221" height="58" rx="8" fill="#e9edf2" stroke="#dce3ed"/><text x="319" y="334" font-size="18" fill="#62728a" font-weight="600" text-anchor="middle">—</text><rect x="454" y="298" width="221" height="58" rx="8" fill="#e9edf2" stroke="#dce3ed"/><text x="564" y="334" font-size="18" fill="#62728a" font-weight="600" text-anchor="middle">—</text><rect x="699" y="298" width="221" height="58" rx="8" fill="#adebdd" stroke="#dce3ed"/><text x="809" y="334" font-size="18" fill="#087e77" font-weight="600" text-anchor="middle">主要部位</text><text x="35" y="411" font-size="19" fill="#132743" font-weight="700" text-anchor="start">全葡萄膜炎</text><rect x="209" y="374" width="221" height="58" rx="8" fill="#adebdd" stroke="#dce3ed"/><text x="319" y="410" font-size="18" fill="#087e77" font-weight="600" text-anchor="middle">共同受累</text><rect x="454" y="374" width="221" height="58" rx="8" fill="#adebdd" stroke="#dce3ed"/><text x="564" y="410" font-size="18" fill="#087e77" font-weight="600" text-anchor="middle">共同受累</text><rect x="699" y="374" width="221" height="58" rx="8" fill="#adebdd" stroke="#dce3ed"/><text x="809" y="410" font-size="18" fill="#087e77" font-weight="600" text-anchor="middle">共同受累</text><text x="40" y="486" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">依「主要發炎部位」分類；全葡萄膜炎涉及各區域，沒有單一主要部位。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 09</text>
</g></svg>