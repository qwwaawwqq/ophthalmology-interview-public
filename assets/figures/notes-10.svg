<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">視網膜層次：由內向外讀圖</title><desc id="desc">十層由玻璃體側到脈絡膜側排列。內層主要由視網膜循環供應，外層光感受器主要依靠脈絡膜，分界及厚度僅為概念。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">視網膜層次：由內向外讀圖</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">ILM → RPE 的順序；區分光線入射方向與血液供應來源。</text>
<text x="65" y="124" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">玻璃體側（內）</text><text x="65" y="466" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">脈絡膜側（外）</text><rect x="64" y="141" width="399" height="28" rx="0" fill="#d6efe8" stroke="white"/><text x="80" y="162" font-size="17" fill="#132743" font-weight="700" text-anchor="start">ILM</text><text x="175" y="162" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">內界膜</text><rect x="64" y="170" width="399" height="28" rx="0" fill="#d6efe8" stroke="white"/><text x="80" y="191" font-size="17" fill="#132743" font-weight="700" text-anchor="start">RNFL</text><text x="175" y="191" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">神經纖維層</text><rect x="64" y="199" width="399" height="28" rx="0" fill="#d6efe8" stroke="white"/><text x="80" y="220" font-size="17" fill="#132743" font-weight="700" text-anchor="start">GCL</text><text x="175" y="220" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">神經節細胞層</text><rect x="64" y="228" width="399" height="28" rx="0" fill="#d6efe8" stroke="white"/><text x="80" y="249" font-size="17" fill="#132743" font-weight="700" text-anchor="start">IPL</text><text x="175" y="249" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">內叢狀層</text><rect x="64" y="257" width="399" height="28" rx="0" fill="#d6efe8" stroke="white"/><text x="80" y="278" font-size="17" fill="#132743" font-weight="700" text-anchor="start">INL</text><text x="175" y="278" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">內核層</text><rect x="64" y="286" width="399" height="28" rx="0" fill="#d6efe8" stroke="white"/><text x="80" y="307" font-size="17" fill="#132743" font-weight="700" text-anchor="start">OPL</text><text x="175" y="307" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">外叢狀層</text><rect x="64" y="315" width="399" height="28" rx="0" fill="#f4e4cf" stroke="white"/><text x="80" y="336" font-size="17" fill="#132743" font-weight="700" text-anchor="start">ONL</text><text x="175" y="336" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">外核層</text><rect x="64" y="344" width="399" height="28" rx="0" fill="#f4e4cf" stroke="white"/><text x="80" y="365" font-size="17" fill="#132743" font-weight="700" text-anchor="start">ELM</text><text x="175" y="365" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">外界膜</text><rect x="64" y="373" width="399" height="28" rx="0" fill="#f4e4cf" stroke="white"/><text x="80" y="394" font-size="17" fill="#132743" font-weight="700" text-anchor="start">PR</text><text x="175" y="394" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">光感受器內／外節</text><rect x="64" y="402" width="399" height="28" rx="0" fill="#f4e4cf" stroke="white"/><text x="80" y="423" font-size="17" fill="#132743" font-weight="700" text-anchor="start">RPE</text><text x="175" y="423" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">視網膜色素上皮</text><path d="M501 144 L501 425" fill="none" stroke="#087e77" stroke-width="4" marker-end="url(#arrow)"/><text x="521" y="273" font-size="18" fill="#087e77" font-weight="700" text-anchor="start">入射光</text><text x="521" y="300" font-size="18" fill="#087e77" font-weight="700" text-anchor="start">向外層</text><rect x="628" y="150" width="299" height="117" rx="15" fill="white" stroke="#dce3ed"/><text x="646" y="183" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">內層視網膜</text><text x="646" y="214" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">以視網膜循環供應為主。</text><text x="646" y="242" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">內核／叢狀層有毛細血管叢。</text><rect x="628" y="296" width="299" height="123" rx="15" fill="white" stroke="#dce3ed"/><text x="646" y="329" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">外層視網膜</text><text x="646" y="360" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">光感受器等主要仰賴</text><text x="646" y="388" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">脈絡膜毛細血管供應。</text><text x="40" y="490" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">血供為概念分區，並非硬性邊界；中央凹等位置具有特殊血管分布。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 10</text>
</g></svg>