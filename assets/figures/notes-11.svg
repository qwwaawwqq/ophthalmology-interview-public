<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">上瞼下垂：位置與功能分開量</title><desc id="desc">左圖標示正視時角膜光反射點到上瞼緣的 MRD1。右圖標示固定眉部後由下視到上視的上瞼位移 LF，不提供診斷界值。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">上瞼下垂：位置與功能分開量</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">MRD1 ≠ 提上瞼肌功能；量測需控制頭位、注視與眉部代償。</text>
<rect x="32" y="117" width="436" height="326" rx="15" fill="white" stroke="#dce3ed"/><rect x="492" y="117" width="436" height="326" rx="15" fill="white" stroke="#dce3ed"/><text x="54" y="154" font-size="23" fill="#132743" font-weight="700" text-anchor="start">MRD1：反光點到上瞼緣</text><text x="514" y="154" font-size="23" fill="#132743" font-weight="700" text-anchor="start">LF：固定眉部後的上瞼位移</text><path d="M95 285 Q250 137 405 285 Q250 355 95 285Z" fill="#eef8f8" stroke="#087e77" stroke-width="3"/><circle cx="250" cy="280" r="39" fill="#adebdd" stroke="#087e77" stroke-width="2"/><circle cx="250" cy="280" r="18" fill="#132743" stroke="#132743" stroke-width="2"/><circle cx="250" cy="275" r="5" fill="white" stroke="white" stroke-width="2"/><path d="M277 215 L277 275" fill="none" stroke="#a73337" stroke-width="3"/><path d="M268 215 L286 215" fill="none" stroke="#a73337" stroke-width="2"/><path d="M268 275 L286 275" fill="none" stroke="#a73337" stroke-width="2"/><text x="291" y="250" font-size="20" fill="#a73337" font-weight="700" text-anchor="start">MRD1</text><text x="56" y="382" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">正視時，量角膜光反射點</text><text x="56" y="410" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">到上眼瞼緣的垂直距離。</text><path d="M561 203 L857 203" fill="none" stroke="#132743" stroke-width="6"/><text x="709" y="186" font-size="17" fill="#62728a" font-weight="400" text-anchor="middle">固定眉部，抑制額肌代償</text><path d="M557 269 Q708 220 859 269" fill="none" stroke="#087e77" stroke-width="4"/><path d="M557 335 Q708 287 859 335" fill="none" stroke="#62728a" stroke-width="3" stroke-dasharray="8 5"/><path d="M705 246 L705 311" fill="none" stroke="#a73337" stroke-width="3"/><path d="M697 246 L713 246" fill="none" stroke="#a73337" stroke-width="2"/><path d="M697 311 L713 311" fill="none" stroke="#a73337" stroke-width="2"/><text x="727" y="280" font-size="19" fill="#a73337" font-weight="700" text-anchor="start">LF</text><text x="868" y="252" font-size="17" fill="#087e77" font-weight="400" text-anchor="end">上視</text><text x="868" y="321" font-size="17" fill="#62728a" font-weight="400" text-anchor="end">下視</text><text x="514" y="383" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">下視到上視時，追蹤上瞼緣。</text><text x="514" y="411" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">LF 反映提上瞼肌功能。</text><text x="40" y="487" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">兩項量測不同：MRD1 看正視時的位置；LF 看最大眼位轉換時的移動幅度。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 11</text>
</g></svg>