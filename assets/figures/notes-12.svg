<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">淚膜：脂質表層與黏蛋白－水液連續相</title><desc id="desc">圖示空氣下的表層脂質，下面是黏蛋白水液連續相，再下方是上皮與糖萼。比較瞼板腺功能異常和水液不足，兩者可並存。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">淚膜：脂質表層與黏蛋白－水液連續相</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">以功能理解乾眼，避免把淚膜背成三個完全分離的液層。</text>
<text x="54" y="124" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">空氣側</text><rect x="54" y="145" width="405" height="33" rx="0" fill="#d7b571" stroke="white"/><text x="74" y="169" font-size="18" fill="#132743" font-weight="700" text-anchor="start">表層脂質</text><rect x="54" y="178" width="405" height="160" rx="0" fill="#d6eee9" stroke="white"/><text x="76" y="227" font-size="23" fill="#132743" font-weight="700" text-anchor="start">黏蛋白－水液連續相</text><text x="76" y="264" font-size="19" fill="#087e77" font-weight="400" text-anchor="start">mucoaqueous</text><text x="76" y="306" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">並非三個互不混合的獨立液層</text><rect x="54" y="338" width="405" height="55" rx="0" fill="#caddeb" stroke="white"/><text x="75" y="373" font-size="20" fill="#132743" font-weight="700" text-anchor="start">角結膜上皮／表面糖萼</text><rect x="505" y="145" width="423" height="120" rx="15" fill="white" stroke="#dce3ed"/><text x="523" y="178" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">MGD／脂質異常</text><text x="523" y="209" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">瞼板腺功能異常可使淚膜不穩定，</text><text x="523" y="237" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">增加蒸發型乾眼風險。</text><rect x="505" y="286" width="423" height="120" rx="15" fill="white" stroke="#dce3ed"/><text x="523" y="319" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">水液不足</text><text x="523" y="350" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">淚腺水液分泌不足，</text><text x="523" y="378" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">可伴淚膜不穩定與眼表發炎。</text><text x="40" y="468" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">蒸發過強與水液不足可並存；症狀、染色與淚膜檢查需要一起解讀。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 12</text>
</g></svg>