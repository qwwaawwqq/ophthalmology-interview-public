<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">藥物眼毒性：先找到可能的受影響部位</title><desc id="desc">列表將 amiodarone 對應角膜沉積、類固醇對應晶狀體和眼壓、hydroxychloroquine 對應視網膜、ethambutol 對應視神經。只列風險線索，不代表必然發生。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">藥物眼毒性：先找到可能的受影響部位</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">由角膜、晶狀體、眼壓、視網膜到視神經，建立病史詢問的定位地圖。</text>
<text x="34" y="116" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">例示非完整清單；藥物可能影響多處，沉積不等於必然造成視力下降。</text><rect x="32" y="137" width="896" height="52" rx="9" fill="white" stroke="#dce3ed"/><circle cx="57" cy="163" r="13" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="57" y="169" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text x="83" y="170" font-size="19" fill="#132743" font-weight="700" text-anchor="start">角膜</text><text x="287" y="170" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">Amiodarone</text><text x="601" y="170" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">可見渦狀角膜沉積</text><rect x="32" y="198" width="896" height="52" rx="9" fill="white" stroke="#dce3ed"/><circle cx="57" cy="224" r="13" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="57" y="230" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text x="83" y="231" font-size="19" fill="#132743" font-weight="700" text-anchor="start">晶狀體</text><text x="287" y="231" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">Corticosteroids</text><text x="601" y="231" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">後囊下白內障風險</text><rect x="32" y="259" width="896" height="52" rx="9" fill="white" stroke="#dce3ed"/><circle cx="57" cy="285" r="13" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="57" y="291" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text x="83" y="292" font-size="19" fill="#132743" font-weight="700" text-anchor="start">眼壓／房水流出</text><text x="287" y="292" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">Corticosteroids</text><text x="601" y="292" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">類固醇反應性眼壓升高</text><rect x="32" y="320" width="896" height="52" rx="9" fill="white" stroke="#dce3ed"/><circle cx="57" cy="346" r="13" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="57" y="352" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text x="83" y="353" font-size="19" fill="#132743" font-weight="700" text-anchor="start">視網膜</text><text x="287" y="353" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">Hydroxychloroquine</text><text x="601" y="353" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">毒性視網膜病變風險</text><rect x="32" y="381" width="896" height="52" rx="9" fill="white" stroke="#dce3ed"/><circle cx="57" cy="407" r="13" fill="#087e77" stroke="#087e77" stroke-width="2"/><text x="57" y="413" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text x="83" y="414" font-size="19" fill="#132743" font-weight="700" text-anchor="start">視神經</text><text x="287" y="414" font-size="19" fill="#087e77" font-weight="700" text-anchor="start">Ethambutol</text><text x="601" y="414" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">毒性視神經病變風險</text><text x="40" y="485" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">出現視覺症狀應評估；依藥物安排基準與追蹤檢查，不可只憑圖示自行停藥。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 13</text>
</g></svg>