<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">突發視力下降：用兩個問題組織急診線索</title><desc id="desc">二乘二矩陣以疼痛和眼別整理急診詢問及檢查方向。所有突發視力下降都需立即評估，無痛不代表良性；合併神經徵象須評估腦中風等急症。 教學示意，非臨床影像，比例非解剖量測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087e77"/></marker></defs>
<g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, system-ui, sans-serif">
<rect x="0" y="0" width="960" height="560" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="32" y="46" font-size="28" fill="#132743" font-weight="700" text-anchor="start">突發視力下降：用兩個問題組織急診線索</text><text x="32" y="79" font-size="18" fill="#62728a" font-weight="400" text-anchor="start">疼不疼？分別遮住一眼後，是一眼、兩眼，還是同一側視野出問題？</text>
<rect x="32" y="105" width="896" height="57" rx="15" fill="#fff0ef" stroke="#e8c3c5"/><text x="52" y="141" font-size="21" fill="#a73337" font-weight="700" text-anchor="start">新發突發視力下降：先視為急症，記錄起始時間並立即評估。</text><text x="392" y="194" font-size="22" fill="#132743" font-weight="700" text-anchor="middle">單眼</text><text x="740" y="194" font-size="22" fill="#132743" font-weight="700" text-anchor="middle">雙眼／同向視野</text><text x="41" y="264" font-size="21" fill="#132743" font-weight="700" text-anchor="start">疼痛</text><text x="41" y="390" font-size="21" fill="#132743" font-weight="700" text-anchor="start">無痛</text><rect x="177" y="212" width="359" height="116" rx="15" fill="white" stroke="#dce3ed"/><text x="195" y="245" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">檢查前節，也評估視神經</text><text x="195" y="276" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">紅眼、角膜、眼壓及眼球運動痛</text><text x="195" y="304" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">皆是追查方向，非確診依據。</text><rect x="553" y="212" width="375" height="116" rx="15" fill="white" stroke="#dce3ed"/><text x="571" y="245" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">同時評估眼部與神經急症</text><text x="571" y="276" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">若合併劇烈頭痛、複視、神經缺損</text><text x="571" y="304" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">立即啟動相應急診評估。</text><rect x="177" y="343" width="359" height="116" rx="15" fill="white" stroke="#dce3ed"/><text x="195" y="376" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">檢查視網膜／視神經與血管</text><text x="195" y="407" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">追問黑矇、閃光飛蚊、幕狀遮蔽。</text><text x="195" y="435" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">無痛也可能威脅視力或生命。</text><rect x="553" y="343" width="375" height="116" rx="15" fill="white" stroke="#dce3ed"/><text x="571" y="376" font-size="21" fill="#087e77" font-weight="700" text-anchor="start">辨別雙眼受損或同向缺損</text><text x="571" y="407" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">分眼測試與神經檢查協助定位；</text><text x="571" y="435" font-size="18" fill="#20324a" font-weight="400" text-anchor="start">疑腦中風時立即走中風流程。</text><text x="40" y="492" font-size="18" fill="#a73337" font-weight="600" text-anchor="start">疼痛 × 眼別只用於整理線索；任何一格都不能用來排除急症。</text>
<path d="M32 513 L928 513" fill="none" stroke="#dce3ed" stroke-width="1"/><text x="32" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="start">教學示意・非臨床影像・比例非解剖量測</text><text x="928" y="540" font-size="15" fill="#62728a" font-weight="400" text-anchor="end">眼科圖解 14</text>
</g></svg>