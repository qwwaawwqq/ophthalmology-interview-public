<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="rad02-title rad02-desc">
  <title id="rad02-title">正面胸部 X 光輪廓徵象（Silhouette Sign）肺葉邊界定位與 HRCT 次級肺小葉微結節分布圖</title>
  <desc id="rad02-desc">雙欄胸腔影像解剖示意圖：左側為正面胸腔輪廓徵象對應之各肺葉解剖邊界，右側為 HRCT 多邊形次級肺小葉內三種微結節分布模式與間質性肺炎對照。</desc>

  <g font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
    <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Header -->
    <text x="36" y="48" font-size="18" font-weight="700" fill="#0f172a">胸部 X 光輪廓徵象（Silhouette Sign）定位 · HRCT 次級肺小葉與間質性肺炎鑑別</text>
    <text x="36" y="68" font-size="12" fill="#475569">正面平片軟組織邊界消失定位肺葉實變／塌陷 · 薄切 HRCT（≤1 mm）微結節解剖分布與 UIP／NSIP 對照</text>

    <!-- Left Panel: Frontal CXR Silhouette Sign -->
    <rect x="30" y="80" width="442" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="30" y="80" width="442" height="32" rx="10" fill="#e2e8f0"/>
    <text x="251" y="101" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">1. 正面胸部 X 光輪廓徵象（右←解剖視角→左）</text>

    <!-- Thorax Dark Box -->
    <rect x="46" y="122" width="410" height="330" rx="8" fill="#0f172a"/>

    <!-- Trachea & Bronchi -->
    <path d="M 244 134 L 244 196 L 214 226 M 244 196 L 278 224" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>

    <!-- Right Lung (viewer left) & Left Lung (viewer right) -->
    <path d="M 218 148 C 145 148, 108 205, 104 374 Q 162 352, 212 374 L 214 228 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 272 148 C 345 148, 384 205, 390 380 Q 332 358, 282 376 L 274 228 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Mediastinum & Heart Silhouette -->
    <path d="M 224 190 C 212 214, 210 242, 218 262 C 202 288, 200 336, 212 372 L 316 376 C 328 338, 314 282, 286 254 C 296 226, 292 184, 266 180 Z" fill="#334155"/>

    <!-- Color-coded Silhouette Borders -->
    <!-- 1. Ascending Aorta / Right upper border -> RUL anterior -->
    <path d="M 222 192 C 211 216, 211 240, 218 260" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 2. Right Heart Border -> RML -->
    <path d="M 216 264 C 200 292, 200 338, 212 372" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 3. Right Diaphragm -> RLL -->
    <path d="M 104 374 Q 160 350, 212 374" fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 4. Aortic Knob -> LUL apicoposterior -->
    <path d="M 266 180 C 296 182, 300 218, 282 236" fill="none" stroke="#f472b6" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 5. Left Heart Border -> Lingula -->
    <path d="M 288 258 C 316 290, 326 336, 316 376" fill="none" stroke="#fb7185" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 6. Left Diaphragm + Descending Aorta -> LLL -->
    <path d="M 282 376 Q 336 356, 390 380" fill="none" stroke="#a78bfa" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="274" y1="238" x2="274" y2="372" stroke="#a78bfa" stroke-width="3" stroke-dasharray="5,3"/>

    <!-- Callout Labels on CXR -->
    <line x1="212" y1="222" x2="158" y2="196" stroke="#38bdf8" stroke-width="1.4"/>
    <rect x="54" y="176" width="106" height="34" rx="5" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="107" y="191" font-size="10.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">升主動脈右緣消失</text>
    <text x="107" y="205" font-size="10" fill="#7dd3fc" text-anchor="middle">→ 右上葉 (RUL)</text>

    <line x1="202" y1="316" x2="156" y2="306" stroke="#2dd4bf" stroke-width="1.4"/>
    <rect x="54" y="286" width="104" height="34" rx="5" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="106" y="301" font-size="10.5" font-weight="700" fill="#ccfbf1" text-anchor="middle">右心緣模糊消失</text>
    <text x="106" y="315" font-size="10" fill="#5eead4" text-anchor="middle">→ 右中葉 (RML)</text>

    <line x1="158" y1="364" x2="138" y2="404" stroke="#fbbf24" stroke-width="1.4"/>
    <rect x="54" y="404" width="128" height="34" rx="5" fill="#78350f" stroke="#fbbf24"/>
    <text x="118" y="419" font-size="10.5" font-weight="700" fill="#fef3c7" text-anchor="middle">右橫膈圓頂輪廓消失</text>
    <text x="118" y="433" font-size="10" fill="#fde68a" text-anchor="middle">→ 右下葉 (RLL)</text>

    <line x1="294" y1="202" x2="334" y2="188" stroke="#f472b6" stroke-width="1.4"/>
    <rect x="334" y="168" width="114" height="36" rx="5" fill="#831843" stroke="#f472b6"/>
    <text x="391" y="183" font-size="10.5" font-weight="700" fill="#fce7f3" text-anchor="middle">主動脈弓結消失</text>
    <text x="391" y="198" font-size="10" fill="#f9a8d4" text-anchor="middle">→ 左上葉尖後段</text>

    <line x1="316" y1="316" x2="342" y2="304" stroke="#fb7185" stroke-width="1.4"/>
    <rect x="342" y="284" width="106" height="36" rx="5" fill="#881337" stroke="#fb7185"/>
    <text x="395" y="299" font-size="10.5" font-weight="700" fill="#ffe4e6" text-anchor="middle">左心緣模糊消失</text>
    <text x="395" y="314" font-size="10" fill="#fda4af" text-anchor="middle">→ 左上葉舌部</text>

    <line x1="336" y1="368" x2="352" y2="404" stroke="#a78bfa" stroke-width="1.4"/>
    <rect x="304" y="404" width="144" height="34" rx="5" fill="#4c1d95" stroke="#a78bfa"/>
    <text x="376" y="419" font-size="10.5" font-weight="700" fill="#ede9fe" text-anchor="middle">左橫膈／降主動脈消失</text>
    <text x="376" y="433" font-size="10" fill="#ddd6fe" text-anchor="middle">→ 左下葉 (LLL)</text>

    <!-- Bottom clinical pearl Left -->
    <rect x="46" y="462" width="410" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="56" y="480" font-size="10.5" font-weight="700" fill="#0f766e">胸腔急症平片關鍵鑑別：</text>
    <text x="56" y="495" font-size="10.5" fill="#334155">· 單側整片白肺：大量肋膜積液「推向健側」vs 主支氣管阻塞全肺塌陷「拉向患側」</text>
    <text x="56" y="509" font-size="10.5" fill="#334155">· 仰臥位氣胸：氣體積聚前下肋膈竇形成高透亮「深溝徵（Deep Sulcus Sign）」</text>

    <!-- Right Panel: HRCT Secondary Pulmonary Lobule & ILD -->
    <rect x="486" y="80" width="444" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="486" y="80" width="444" height="32" rx="10" fill="#e2e8f0"/>
    <text x="708" y="101" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">2. HRCT 次級肺小葉微結節三型分布與 ILD 對照</text>

    <!-- 3 Hexagonal Lobule Cards -->
    <!-- Card A: Centrilobular -->
    <rect x="500" y="124" width="132" height="214" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="1.3"/>
    <text x="566" y="143" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">小葉中心型</text>
    <!-- Pleural surface line at top -->
    <line x1="514" y1="158" x2="618" y2="158" stroke="#0f172a" stroke-width="2.5"/>
    <text x="566" y="154" font-size="9" fill="#475569" text-anchor="middle">臟層肋膜面（保留空隙）</text>
    <!-- Hexagon -->
    <polygon points="566,166 608,188 608,232 566,254 524,232 524,188" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <!-- Tree in bud in center -->
    <path d="M 566 192 L 566 212 L 552 224 M 566 212 L 580 224" fill="none" stroke="#0f766e" stroke-width="2"/>
    <circle cx="566" cy="192" r="3.5" fill="#0f766e"/>
    <circle cx="552" cy="224" r="3.5" fill="#0f766e"/>
    <circle cx="580" cy="224" r="3.5" fill="#0f766e"/>
    <circle cx="566" cy="232" r="3" fill="#0f766e"/>
    <text x="566" y="274" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle">保留肋膜下 5–10 mm</text>
    <text x="566" y="290" font-size="9.5" fill="#334155" text-anchor="middle">常伴「樹芽徵 Tree-in-bud」</text>
    <text x="566" y="306" font-size="9.5" fill="#475569" text-anchor="middle">結核支氣管內播散</text>
    <text x="566" y="321" font-size="9.5" fill="#475569" text-anchor="middle">感染性細支氣管炎 · HP</text>

    <!-- Card B: Perilymphatic -->
    <rect x="642" y="124" width="132" height="214" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="708" y="143" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">淋巴管周圍型</text>
    <line x1="656" y1="158" x2="760" y2="158" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="708,166 750,188 750,232 708,254 666,232 666,188" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <!-- Nodules along septa & pleural edge & central BV bundle -->
    <circle cx="684" cy="158" r="3.3" fill="#1d4ed8"/>
    <circle cx="708" cy="158" r="3.3" fill="#1d4ed8"/>
    <circle cx="732" cy="158" r="3.3" fill="#1d4ed8"/>
    <circle cx="666" cy="208" r="3.3" fill="#1d4ed8"/>
    <circle cx="750" cy="208" r="3.3" fill="#1d4ed8"/>
    <circle cx="686" cy="243" r="3.3" fill="#1d4ed8"/>
    <circle cx="730" cy="243" r="3.3" fill="#1d4ed8"/>
    <circle cx="708" cy="208" r="3.3" fill="#1d4ed8"/>
    <text x="708" y="274" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">貼附葉間裂·小葉間隔</text>
    <text x="708" y="290" font-size="9.5" fill="#334155" text-anchor="middle">沿支氣管血管束串珠狀</text>
    <text x="708" y="306" font-size="9.5" fill="#475569" text-anchor="middle">類肉瘤病 (Sarcoidosis)</text>
    <text x="708" y="321" font-size="9.5" fill="#475569" text-anchor="middle">癌性淋巴管炎 · 矽肺症</text>

    <!-- Card C: Random -->
    <rect x="784" y="124" width="132" height="214" rx="8" fill="#f8fafc" stroke="#be123c" stroke-width="1.3"/>
    <text x="850" y="143" font-size="11.5" font-weight="700" fill="#be123c" text-anchor="middle">隨機粟粒型</text>
    <line x1="798" y1="158" x2="902" y2="158" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="850,166 892,188 892,232 850,254 808,232 808,188" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <!-- Uniform random dots including pleura -->
    <circle cx="822" cy="158" r="3" fill="#be123c"/>
    <circle cx="872" cy="158" r="3" fill="#be123c"/>
    <circle cx="834" cy="186" r="3" fill="#be123c"/>
    <circle cx="868" cy="192" r="3" fill="#be123c"/>
    <circle cx="820" cy="214" r="3" fill="#be123c"/>
    <circle cx="850" cy="210" r="3" fill="#be123c"/>
    <circle cx="882" cy="220" r="3" fill="#be123c"/>
    <circle cx="838" cy="238" r="3" fill="#be123c"/>
    <circle cx="866" cy="240" r="3" fill="#be123c"/>
    <text x="850" y="274" font-size="10" font-weight="700" fill="#be123c" text-anchor="middle">均勻散佈且累及肋膜面</text>
    <text x="850" y="290" font-size="9.5" fill="#334155" text-anchor="middle">無特定小葉結構偏好</text>
    <text x="850" y="306" font-size="9.5" fill="#475569" text-anchor="middle">粟粒性結核 (Miliary TB)</text>
    <text x="850" y="321" font-size="9.5" fill="#475569" text-anchor="middle">血行性肺轉移 · 黴菌播散</text>

    <!-- Bottom Row: UIP vs NSIP Comparison -->
    <rect x="500" y="350" width="204" height="164" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
    <text x="602" y="370" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">UIP 型態（特發性肺纖維化 IPF）</text>
    <!-- Clustered subpleural honeycomb cysts -->
    <line x1="518" y1="426" x2="686" y2="426" stroke="#78350f" stroke-width="2.2"/>
    <circle cx="536" cy="417" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="552" cy="417" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="568" cy="417" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="544" cy="403" r="7" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <circle cx="560" cy="403" r="7" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <circle cx="634" cy="417" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="650" cy="417" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="666" cy="417" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="642" cy="403" r="7" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <text x="512" y="448" font-size="10" font-weight="700" fill="#78350f">· 雙下肺基底＋緊貼肋膜多層「蜂巢肺」</text>
    <text x="512" y="466" font-size="10" fill="#334155">· 伴網狀纖維化與牽引性支氣管擴張</text>
    <text x="512" y="484" font-size="10" fill="#334155">· 典型 UIP 排除次發病因可免肺切片</text>
    <text x="512" y="502" font-size="10" fill="#b45309">· 毛玻璃影極少（若有應懷疑急性惡化）</text>

    <rect x="712" y="350" width="204" height="164" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
    <text x="814" y="370" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">NSIP 型態（結締組織疾病相關）</text>
    <!-- Subpleural sparing band + GGO -->
    <rect x="730" y="384" width="168" height="28" rx="4" fill="#99f6e4" opacity="0.7" stroke="#0f766e" stroke-dasharray="3,2"/>
    <text x="814" y="402" font-size="9.5" font-weight="700" fill="#134e4a" text-anchor="middle">廣泛對稱毛玻璃影 (GGO)</text>
    <rect x="730" y="414" width="168" height="12" fill="#ffffff"/>
    <line x1="730" y1="426" x2="898" y2="426" stroke="#134e4a" stroke-width="2.2"/>
    <text x="724" y="448" font-size="10" font-weight="700" fill="#0f766e">· 特徵性「肋膜下保留 Subpleural sparing」</text>
    <text x="724" y="466" font-size="10" fill="#334155">· 雙下肺對稱毛玻璃與細網狀影為主</text>
    <text x="724" y="484" font-size="10" fill="#334155">· 蜂巢肺罕見或極輕微，預後優於 UIP</text>
    <text x="724" y="502" font-size="10" fill="#0f766e">· 必查全身硬皮症·皮肌炎·類風濕關節炎</text>
  </g>
</svg>
