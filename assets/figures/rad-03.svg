<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="rad03-title rad03-desc">
  <title id="rad03-title">Stanford Type A／B 主動脈剝離真假腔橫斷面特徵與急性肺栓塞 CTPA 右心負荷判讀圖</title>
  <desc id="rad03-desc">三欄心血管急症影像圖：左側為 Stanford A 與 B 型主動脈剝離解剖範圍，中側為主動脈真假腔橫斷面徵象與壁內血腫對照，右側為肺動脈栓塞 CTPA 充盈缺損與右心室擴大負荷指標。</desc>
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
    <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Header -->
    <text x="36" y="48" font-size="18" font-weight="700" fill="#0f172a">急性主動脈症候群（Stanford A／B · 真假腔 · IMH）與急性肺栓塞 CTPA 判讀</text>
    <text x="36" y="68" font-size="12" fill="#475569">升主動脈受累決定緊急開刀 · 真假腔鳥嘴／蜘蛛網徵與無顯影壁內血腫 · 肺動脈充盈缺損與 RV/LV &gt; 1.0 右心負荷</text>

    <!-- Column 1: Stanford Type A vs B -->
    <rect x="30" y="80" width="286" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="30" y="80" width="286" height="32" rx="10" fill="#e2e8f0"/>
    <text x="173" y="101" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">1. Stanford 主動脈剝離分型</text>

    <!-- Type A Box -->
    <rect x="44" y="122" width="258" height="190" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
    <text x="56" y="142" font-size="12.5" font-weight="700" fill="#be123c">Stanford Type A（波及升主動脈）</text>
    <!-- Arch schematic Type A -->
    <path d="M 102 256 L 102 192 C 102 156, 178 156, 178 196 L 178 274" fill="none" stroke="#be123c" stroke-width="22" stroke-linecap="round"/>
    <path d="M 102 256 L 102 192 C 102 156, 178 156, 178 196 L 178 274" fill="none" stroke="#fda4af" stroke-width="16" stroke-linecap="round"/>
    <!-- Intimal flap in ascending + arch + descending -->
    <path d="M 99 250 L 99 192 C 99 160, 174 160, 174 196 L 174 268" fill="none" stroke="#881337" stroke-width="2.5" stroke-dasharray="5,3"/>
    <!-- Supra-aortic branches -->
    <line x1="124" y1="164" x2="118" y2="148" stroke="#be123c" stroke-width="5"/>
    <line x1="142" y1="162" x2="142" y2="146" stroke="#be123c" stroke-width="5"/>
    <line x1="160" y1="166" x2="168" y2="148" stroke="#be123c" stroke-width="5"/>
    <text x="188" y="182" font-size="10.2" font-weight="700" fill="#9f1239">絕對外科急症！</text>
    <text x="188" y="199" font-size="9.6" fill="#334155">· 心包填塞致死</text>
    <text x="188" y="215" font-size="9.6" fill="#334155">· 冠狀動脈口阻塞</text>
    <text x="188" y="231" font-size="9.6" fill="#334155">· 急性主動脈瓣逆流</text>
    <text x="188" y="247" font-size="9.6" fill="#334155">· 頸動脈腦灌流不良</text>
    <text x="54" y="298" font-size="9.8" font-weight="700" fill="#be123c">不論破口位置，凡累及升主動脈皆屬 Type A</text>

    <!-- Type B Box -->
    <rect x="44" y="324" width="258" height="190" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="56" y="344" font-size="12.5" font-weight="700" fill="#1d4ed8">Stanford Type B（僅限降主動脈）</text>
    <!-- Arch schematic Type B -->
    <path d="M 102 458 L 102 396 C 102 360, 178 360, 178 400 L 178 476" fill="none" stroke="#1d4ed8" stroke-width="22" stroke-linecap="round"/>
    <path d="M 102 458 L 102 396 C 102 360, 178 360, 178 400 L 178 476" fill="none" stroke="#bfdbfe" stroke-width="16" stroke-linecap="round"/>
    <!-- Flap only in descending distal to LSA -->
    <path d="M 174 398 L 174 472" fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="5,3"/>
    <line x1="124" y1="368" x2="118" y2="352" stroke="#1d4ed8" stroke-width="5"/>
    <line x1="142" y1="366" x2="142" y2="350" stroke="#1d4ed8" stroke-width="5"/>
    <line x1="160" y1="370" x2="168" y2="352" stroke="#1d4ed8" stroke-width="5"/>
    <text x="188" y="386" font-size="10" font-weight="700" fill="#1e40af">左鎖骨下動脈遠端</text>
    <text x="188" y="403" font-size="9.6" fill="#334155">· 單純型：嚴格控壓</text>
    <text x="194" y="418" font-size="9.5" fill="#334155">與心率 (β-blocker)</text>
    <text x="188" y="436" font-size="9.6" fill="#be123c">· 破裂／臟器缺血</text>
    <text x="194" y="451" font-size="9.6" font-weight="700" fill="#be123c">→ 覆膜支架 TEVAR</text>
    <text x="54" y="500" font-size="9.8" font-weight="700" fill="#1e3a8a">升主動脈與主動脈弓未受累（DeBakey III）</text>

    <!-- Column 2: True vs False Lumen & IMH -->
    <rect x="330" y="80" width="298" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="330" y="80" width="298" height="32" rx="10" fill="#e2e8f0"/>
    <text x="479" y="101" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">2. 真假腔橫斷面與壁內血腫 (IMH)</text>

    <!-- Upper: Classic Dissection Cross Section -->
    <text x="346" y="132" font-size="12" font-weight="700" fill="#0f172a">典型雙腔剝離（CTA 動脈期橫斷面）</text>
    <!-- Outer Aortic Wall -->
    <circle cx="430" cy="212" r="62" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
    <!-- False Lumen (larger, crescentic, dimmer, cobweb + beak) -->
    <path d="M 384 170 A 58 58 0 1 1 392 256 C 422 238, 424 188, 384 170 Z" fill="#64748b"/>
    <!-- True Lumen (smaller, bright contrast) -->
    <path d="M 384 170 C 424 188, 422 238, 392 256 A 56 56 0 0 1 384 170 Z" fill="#fef08a" stroke="#0f172a" stroke-width="2"/>
    <!-- Displaced Intimal Calcification -->
    <circle cx="408" cy="194" r="3" fill="#ffffff" stroke="#0f172a"/>
    <circle cx="412" cy="212" r="3" fill="#ffffff" stroke="#0f172a"/>
    <circle cx="407" cy="230" r="3" fill="#ffffff" stroke="#0f172a"/>
    <!-- Cobweb strands inside False Lumen -->
    <line x1="444" y1="168" x2="466" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="454" y1="226" x2="480" y2="210" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="436" y1="252" x2="462" y2="244" stroke="#cbd5e1" stroke-width="1.5"/>

    <text x="387" y="216" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">真腔</text>
    <text x="454" y="210" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">假腔</text>

    <!-- Annotations right of circle -->
    <text x="496" y="160" font-size="10.2" font-weight="700" fill="#b45309">真腔 (True Lumen)：</text>
    <text x="496" y="175" font-size="9.6" fill="#334155">· 管徑小·早期高強化</text>
    <text x="496" y="190" font-size="9.6" fill="#334155">· 外緣伴內膜鈣化內移</text>
    <text x="496" y="212" font-size="10.2" font-weight="700" fill="#be123c">假腔 (False Lumen)：</text>
    <text x="496" y="227" font-size="9.5" fill="#334155">· 管徑大·常伴附壁血栓</text>
    <text x="496" y="242" font-size="9.6" font-weight="700" fill="#be123c">· 鳥嘴徵 (Beak sign)</text>
    <text x="496" y="257" font-size="9.6" font-weight="700" fill="#be123c">· 蛛網徵 (Cobweb sign)</text>

    <line x1="344" y1="286" x2="614" y2="286" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Lower: IMH on NCCT + ULP vs IBP -->
    <text x="346" y="308" font-size="12" font-weight="700" fill="#0f172a">主動脈壁內血腫 IMH（必做無顯影 NCCT！）</text>
    <circle cx="408" cy="378" r="52" fill="#be123c" stroke="#334155" stroke-width="2.5"/>
    <circle cx="390" cy="378" r="34" fill="#475569" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="390" y="382" font-size="9.5" font-weight="700" fill="#f8fafc" text-anchor="middle">管腔40HU</text>
    <text x="442" y="374" font-size="9.5" font-weight="700" fill="#ffe4e6" text-anchor="middle">新月高密</text>
    <text x="442" y="389" font-size="9.5" fill="#ffe4e6" text-anchor="middle">60–70HU</text>

    <text x="472" y="336" font-size="9.8" font-weight="700" fill="#be123c">NCCT 高密度新月壁厚 ≥5mm</text>
    <text x="472" y="353" font-size="9.6" fill="#334155">· 滋養血管破裂無內膜破口</text>
    <text x="472" y="370" font-size="9.6" fill="#334155">· 內膜鈣化被血腫推向內側</text>
    <text x="472" y="391" font-size="9.8" font-weight="700" fill="#9f1239">· 潰瘍樣投射 (ULP)：</text>
    <text x="478" y="406" font-size="9.5" fill="#334155">寬口(&gt;3mm)連通主腔→高危</text>
    <text x="472" y="424" font-size="9.8" font-weight="700" fill="#0f766e">· 壁內血池 (IBP／九環刀)：</text>
    <text x="478" y="439" font-size="9.5" fill="#334155">連通肋間動脈分支→多吸收</text>

    <rect x="342" y="456" width="274" height="58" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="350" y="473" font-size="10.2" font-weight="700" fill="#b45309">穿透性動脈硬化潰瘍 (PAU) 高危鑑別：</text>
    <text x="350" y="489" font-size="9.6" fill="#334155">重度鈣化降主動脈龕影蝕穿內彈力層外凸</text>
    <text x="350" y="505" font-size="9.6" font-weight="700" fill="#be123c">高危閾值：直徑≥13–20mm／深度≥10mm 易破！</text>

    <!-- Column 3: Acute PE CTPA & RV Strain -->
    <rect x="642" y="80" width="288" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="642" y="80" width="288" height="32" rx="10" fill="#e2e8f0"/>
    <text x="786" y="101" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">3. 急性肺栓塞 CTPA 與右心負荷</text>

    <!-- Upper: Saddle Embolus + Polo Mint -->
    <text x="656" y="132" font-size="12" font-weight="700" fill="#0f172a">肺動脈直接充盈缺損徵象</text>
    <!-- Bifurcating PA -->
    <path d="M 738 256 L 738 198 L 682 158 M 738 198 L 794 158" fill="none" stroke="#bae6fd" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Saddle thrombus straddling bifurcation -->
    <path d="M 696 168 Q 738 196, 780 168 Q 752 206, 738 212 Q 724 206, 696 168 Z" fill="#be123c"/>
    <text x="738" y="238" font-size="10.5" font-weight="700" fill="#be123c" text-anchor="middle">鞍狀血栓 (Saddle Embolus)</text>

    <!-- Polo Mint cross section -->
    <circle cx="868" cy="186" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <circle cx="868" cy="186" r="16" fill="#be123c"/>
    <text x="868" y="230" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">薄荷糖徵</text>
    <text x="868" y="244" font-size="9.5" fill="#475569" text-anchor="middle">(Polo Mint)</text>

    <line x1="656" y1="274" x2="916" y2="274" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Lower: 4-Chamber RV/LV > 1.0 + Septal Bowing -->
    <text x="656" y="298" font-size="12" font-weight="700" fill="#0f172a">四腔室切面：急性右心室壓力負荷過重</text>
    <!-- Heart 4-chamber outline -->
    <ellipse cx="766" cy="378" rx="92" ry="62" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
    <!-- Dilated RV (left side of diagram) pushing septum into compressed LV (right side) -->
    <path d="M 684 378 C 684 334, 774 328, 796 346 C 774 368, 774 392, 796 412 C 774 428, 684 422, 684 378 Z" fill="#fecdd3" stroke="#be123c" stroke-width="2"/>
    <path d="M 802 348 C 836 352, 848 366, 848 378 C 848 392, 836 406, 802 410 C 782 392, 782 368, 802 348 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>

    <!-- Dimension arrows -->
    <line x1="694" y1="378" x2="774" y2="378" stroke="#be123c" stroke-width="2" marker-end="url(#arrRed)"/>
    <text x="734" y="370" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">RV 擴大</text>
    <text x="822" y="382" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">LV 受壓</text>

    <!-- Septal bowing label -->
    <text x="786" y="458" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle">RV / LV 短軸內徑比 &gt; 1.0 ＋ 室中隔左偏反弓</text>

    <rect x="654" y="470" width="264" height="44" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="662" y="486" font-size="9.8" font-weight="700" fill="#0f766e">高死亡率警訊（次大面積／大面積 PE）：</text>
    <text x="662" y="503" font-size="9.6" fill="#334155">下腔／肝靜脈顯影逆流 · 肋膜下楔形肺梗塞</text>
  </g>
</svg>
