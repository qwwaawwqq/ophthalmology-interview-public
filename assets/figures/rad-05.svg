<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="rad05-title rad05-desc">
  <title id="rad05-title">肝臟多相動態顯影（動脈晚期／門脈期／延遲期／肝膽特異期）時間衰減曲線與四大局灶病灶鑑別圖</title>
  <desc id="rad05-desc">肝臟動態四期顯影曲線與病灶對照圖：比較肝細胞癌快進快出、海綿狀血管瘤周邊結節向心填滿、局部結節性增生星狀疤痕與肝膽期滯留，以及轉移瘤環狀強化。</desc>
  <defs>
    <marker id="arrAxis5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
    <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Header -->
    <text x="36" y="48" font-size="18" font-weight="700" fill="#0f172a">肝臟多相動態顯影時間－強化曲線與四大局灶病灶（LI-RADS · Gd-EOB-DTPA）鑑別</text>
    <text x="36" y="68" font-size="12" fill="#475569">正常肝實質 75% 門脈供血 vs 肝癌新生動脈供血 · 動脈晚期（30–35s）／門脈期（60–75s）／延遲期（3–5m）／肝膽特異期（20m）</text>

    <!-- Upper Panel: Time-Attenuation / Signal Curve -->
    <rect x="30" y="80" width="900" height="198" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="46" y="102" font-size="13" font-weight="700" fill="#0f172a">動態四期＋肝膽特異期相對強化曲線（對照正常背景肝實質）</text>

    <!-- Axes -->
    <line x1="90" y1="246" x2="660" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrAxis5)"/>
    <line x1="90" y1="246" x2="90" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#arrAxis5)"/>
    <text x="44" y="126" font-size="10.5" fill="#475569">強化度</text>

    <!-- Phase vertical guides: Pre=110, LateArt=235, PVP=375, Delayed=505, HBP=625 -->
    <line x1="235" y1="114" x2="235" y2="246" stroke="#e2e8f0" stroke-dasharray="4,3"/>
    <line x1="375" y1="114" x2="375" y2="246" stroke="#e2e8f0" stroke-dasharray="4,3"/>
    <line x1="505" y1="114" x2="505" y2="246" stroke="#e2e8f0" stroke-dasharray="4,3"/>
    <line x1="625" y1="114" x2="625" y2="246" stroke="#cbd5e1" stroke-dasharray="3,2"/>

    <text x="110" y="264" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">無顯影平掃</text>
    <text x="235" y="264" font-size="10.5" font-weight="700" fill="#be123c" text-anchor="middle">動脈晚期 (30–35s)</text>
    <text x="375" y="264" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">門靜脈期 (60–75s)</text>
    <text x="505" y="264" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">延遲平衡期 (3–5m)</text>
    <text x="625" y="264" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">肝膽期 (20m EOB)</text>

    <!-- Normal Liver Parenchyma Curve (gray dashed) -->
    <path d="M 110 222 L 235 198 L 375 154 L 505 174 L 625 142" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6,3"/>

    <!-- HCC Curve (Red): fast wash-in at Late Art, washout below liver in PVP & Delayed, very dark in HBP -->
    <path d="M 110 228 L 235 130 L 375 196 L 505 214 L 625 232" fill="none" stroke="#be123c" stroke-width="2.8"/>
    <circle cx="235" cy="130" r="4" fill="#be123c"/>
    <circle cx="375" cy="196" r="4" fill="#be123c"/>
    <circle cx="625" cy="232" r="4" fill="#be123c"/>

    <!-- FNH Curve (Teal): intense homogeneous APHE, iso/slightly hyper in PVP/Delayed, iso/hyper in HBP! -->
    <path d="M 110 224 L 235 118 L 375 148 L 505 168 L 625 134" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <circle cx="235" cy="118" r="4" fill="#0f766e"/>
    <circle cx="625" cy="134" r="4" fill="#0f766e"/>

    <!-- Hemangioma Curve (Blue): peripheral nodular matching aorta, progressive centripetal fill-in (ECF delayed high, note EOB pseudo-washout) -->
    <path d="M 110 232 L 235 146 L 375 142 L 505 150" fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
    <path d="M 505 150 L 625 218" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="3,3"/>

    <!-- Cholangiocarcinoma / Fibrous Metastasis (Amber): rim APHE, progressive central delayed retention, HBP low -->
    <path d="M 110 234 L 235 206 L 375 184 L 505 158 L 625 224" fill="none" stroke="#b45309" stroke-width="2.3"/>

    <!-- Legend Box on right of chart -->
    <rect x="676" y="96" width="240" height="168" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <line x1="688" y1="116" x2="714" y2="116" stroke="#64748b" stroke-width="2.2" stroke-dasharray="5,3"/>
    <text x="720" y="120" font-size="10.5" font-weight="700" fill="#475569">正常肝實質（門脈期與肝膽期亮）</text>

    <line x1="688" y1="142" x2="714" y2="142" stroke="#be123c" stroke-width="2.8"/>
    <text x="720" y="146" font-size="10.5" font-weight="700" fill="#be123c">典型 HCC (LR-5)：快進快出＋包膜</text>

    <line x1="688" y1="168" x2="714" y2="168" stroke="#0f766e" stroke-width="2.5"/>
    <text x="720" y="172" font-size="10.5" font-weight="700" fill="#0f766e">FNH：強動脈強化＋肝膽期滯留亮</text>

    <line x1="688" y1="194" x2="714" y2="194" stroke="#1d4ed8" stroke-width="2.4"/>
    <text x="720" y="198" font-size="10.5" font-weight="700" fill="#1d4ed8">血管瘤：周邊結節向心填滿 (ECF)</text>
    <text x="720" y="212" font-size="9.5" fill="#475569">（註：EOB 肝膽期無肝細胞呈假性暗影）</text>

    <line x1="688" y1="234" x2="714" y2="234" stroke="#b45309" stroke-width="2.3"/>
    <text x="720" y="238" font-size="10.5" font-weight="700" fill="#b45309">膽管癌／轉移 (LR-M)：環狀＋延遲亮</text>

    <!-- Lower Panel: 4 Lesion Morphology Cards -->
    <!-- Card 1: HCC (LR-5) -->
    <rect x="30" y="290" width="216" height="236" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.4"/>
    <rect x="30" y="290" width="216" height="28" rx="10" fill="#ffe4e6"/>
    <text x="138" y="309" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">1. 肝細胞癌 HCC (LR-5)</text>
    <!-- 3 mini circles: Art / PVP / HBP -->
    <circle cx="72" cy="356" r="22" fill="#fca5a5" stroke="#be123c" stroke-width="2"/>
    <text x="72" y="360" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">動脈亮</text>
    <circle cx="138" cy="356" r="22" fill="#475569" stroke="#f59e0b" stroke-width="3"/>
    <text x="138" y="360" font-size="9.5" font-weight="700" fill="#fef3c7" text-anchor="middle">洗脫+包膜</text>
    <circle cx="204" cy="356" r="22" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="204" y="360" font-size="9.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">肝膽暗</text>

    <text x="42" y="400" font-size="10" font-weight="700" fill="#be123c">· 適用：肝硬化／慢性 B 肝高危群</text>
    <text x="42" y="418" font-size="10" fill="#334155">· 非環狀動脈高強化 (Non-rim APHE)</text>
    <text x="42" y="436" font-size="10" fill="#334155">· 門脈／延遲期洗脫＋強化纖維包膜</text>
    <text x="42" y="454" font-size="10" fill="#334155">· ≥20mm(≥1項) 或 10–19mm(洗脫)</text>
    <text x="42" y="472" font-size="10" font-weight="700" fill="#9f1239">→ LR-5 免穿刺切片直接確診！</text>
    <text x="42" y="492" font-size="9.5" fill="#475569">· 門脈腫瘤血栓 (LR-TIV)：撐大＋強化</text>
    <text x="42" y="508" font-size="9.5" fill="#475569">· 浸潤型 HCC 界線模糊易侵犯門脈</text>

    <!-- Card 2: Cavernous Hemangioma -->
    <rect x="258" y="290" width="216" height="236" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
    <rect x="258" y="290" width="216" height="28" rx="10" fill="#dbeafe"/>
    <text x="366" y="309" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. 海綿狀血管瘤 (LR-1 良性)</text>
    <!-- Peripheral discontinuous nodular -> progressive centripetal -->
    <circle cx="300" cy="356" r="22" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="284" cy="346" r="5" fill="#93c5fd"/>
    <circle cx="315" cy="345" r="5" fill="#93c5fd"/>
    <circle cx="302" cy="373" r="5" fill="#93c5fd"/>
    <circle cx="366" cy="356" r="22" fill="#334155" stroke="#93c5fd" stroke-width="6" stroke-dasharray="12,4"/>
    <circle cx="432" cy="356" r="22" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="432" y="360" font-size="9.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">向心填滿</text>

    <text x="270" y="400" font-size="10" font-weight="700" fill="#1d4ed8">· 周邊「不連續結節狀」動脈強化</text>
    <text x="270" y="418" font-size="10" fill="#334155">· 門脈至延遲期由外向內漸進填滿</text>
    <text x="270" y="436" font-size="10" fill="#334155">· 各期強化密度與「主動脈血池」同步</text>
    <text x="270" y="454" font-size="10" fill="#334155">· 超音波均質高回音 · MRI T2 燈泡亮</text>
    <text x="270" y="472" font-size="10" font-weight="700" fill="#be123c">· 陷阱：勿把「完整連續環狀強化」</text>
    <text x="278" y="489" font-size="9.5" fill="#334155">（轉移／膽管癌）誤當不連續結節！</text>
    <text x="270" y="508" font-size="9.5" fill="#475569">· 良性免切片（穿刺有腹腔出血風險）</text>

    <!-- Card 3: FNH -->
    <rect x="486" y="290" width="216" height="236" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
    <rect x="486" y="290" width="216" height="28" rx="10" fill="#ccfbf1"/>
    <text x="594" y="309" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">3. 局部結節性增生 (FNH)</text>
    <!-- Popcorn APHE + Central Scar + HBP bright -->
    <circle cx="528" cy="356" r="22" fill="#5eead4" stroke="#0f766e" stroke-width="2"/>
    <path d="M 528 346 L 528 366 M 518 356 L 538 356" stroke="#134e4a" stroke-width="2"/>
    <circle cx="594" cy="356" r="22" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 594 345 L 594 367 M 583 356 L 605 356" stroke="#fef08a" stroke-width="2.8"/>
    <circle cx="660" cy="356" r="22" fill="#99f6e4" stroke="#0f766e" stroke-width="2.2"/>
    <text x="660" y="360" font-size="9.5" font-weight="700" fill="#134e4a" text-anchor="middle">肝膽期亮</text>

    <text x="498" y="400" font-size="10" font-weight="700" fill="#0f766e">· 動脈期極強均勻強化（爆米花狀）</text>
    <text x="498" y="418" font-size="10" fill="#334155">· 門脈期與正常肝等密度（隱形病灶）</text>
    <text x="498" y="436" font-size="10" fill="#334155">· 中央星狀疤痕：T2 亮＋延遲期強化</text>
    <text x="498" y="454" font-size="10" font-weight="700" fill="#0f766e">· EOB 肝膽期呈「等至高訊號滯留」</text>
    <text x="498" y="472" font-size="10" fill="#334155">（具正常 OATP 轉運子與盲端膽小管）</text>
    <text x="498" y="492" font-size="9.5" font-weight="700" fill="#b45309">· 一舉鑑別「肝細胞腺瘤」（口服避孕藥</text>
    <text x="506" y="508" font-size="9.5" fill="#475569">相關·易出血·肝膽期呈明確低訊號）</text>

    <!-- Card 4: Rim APHE Metastasis & Cholangiocarcinoma -->
    <rect x="714" y="290" width="216" height="236" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
    <rect x="714" y="290" width="216" height="28" rx="10" fill="#fef3c7"/>
    <text x="822" y="309" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">4. 轉移瘤／膽管癌 (LR-M)</text>
    <!-- Continuous Rim APHE -> Delayed central fibrous enhancement -->
    <circle cx="756" cy="356" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="5"/>
    <text x="756" y="360" font-size="9" font-weight="700" fill="#fef3c7" text-anchor="middle">環狀強化</text>
    <circle cx="822" cy="356" r="22" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
    <text x="822" y="360" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">延遲滯留</text>
    <circle cx="888" cy="356" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="888" y="360" font-size="9" font-weight="700" fill="#cbd5e1" text-anchor="middle">標靶徵</text>

    <text x="726" y="400" font-size="10" font-weight="700" fill="#b45309">· 連續完整「周邊環狀強化 Rim APHE」</text>
    <text x="726" y="418" font-size="10" fill="#334155">· 大腸胃胰腺癌：多發乏血管牛眼轉移</text>
    <text x="726" y="436" font-size="10" fill="#334155">· NET／RCC／甲狀腺／黑色素瘤：富血管</text>
    <text x="726" y="454" font-size="10" fill="#334155">· 肝內膽管癌 (iCCA)：延遲期中央纖維</text>
    <text x="734" y="470" font-size="10" fill="#334155">強化＋肝包膜凹陷＋遠端膽管擴張</text>
    <text x="726" y="490" font-size="9.5" font-weight="700" fill="#0f766e">· 化膿性肝膿瘍：雙環徵＋團簇徵＋</text>
    <text x="734" y="508" font-size="9.5" fill="#475569">中央膿腔 DWI 強烈擴散受限 (ADC 低)</text>
  </g>
</svg>
