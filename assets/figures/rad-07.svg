<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="rad07-title rad07-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="rad07-title">顱內腦膜血腫解剖邊界鑑別與腦實質血腫五期 MRI 訊號演變圖</title>
  <desc id="rad07-desc">左側比較硬腦膜外血腫雙凸透鏡不跨顱縫與硬腦膜下血腫新月狀不跨大腦鐮之解剖邊界，左下呈現急性缺血中風灌流核心與半影區不匹配，右側彙整腦實質血腫五期血紅素氧化產物與 T1WI、T2WI 及 SWI 訊號演變。</desc>

  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="40" y="51" fill="#ffffff" font-size="17.5" font-weight="700">顱內腦膜血腫解剖邊界鑑別 · 缺血灌流半影區與腦血腫五期 MRI 訊號</text>
  <text x="920" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Rad-07 · 神經放射急症判讀</text>

  <!-- Panel 1: EDH vs SDH -->
  <rect x="34" y="82" width="442" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="82" width="442" height="32" rx="10" fill="#eff6ff"/>
  <rect x="34" y="102" width="442" height="12" fill="#eff6ff"/>
  <text x="48" y="103" fill="#1d4ed8" font-size="13.5" font-weight="700">1. 軸外腦膜血腫橫切面邊界：EDH（雙凸透鏡）對 SDH（新月形）</text>

  <!-- Axial skull schematic -->
  <ellipse cx="255" cy="206" rx="104" ry="82" fill="#f1f5f9" stroke="#334155" stroke-width="4"/>
  <!-- Brain parenchyma -->
  <ellipse cx="255" cy="206" rx="90" ry="69" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <!-- Falx cerebri -->
  <line x1="255" y1="126" x2="255" y2="286" stroke="#0f172a" stroke-width="2.4" stroke-dasharray="5,3"/>
  <!-- Cranial sutures (coronal left & right) -->
  <line x1="176" y1="146" x2="188" y2="158" stroke="#0f766e" stroke-width="3"/>
  <line x1="334" y1="146" x2="322" y2="158" stroke="#0f766e" stroke-width="3"/>
  <text x="255" y="122" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">大腦鐮 Falx</text>

  <!-- Left: EDH biconvex lens between coronal & lambdoid sutures -->
  <path d="M161,168 C192,176 194,232 160,242 C148,218 148,192 161,168 Z" fill="#be123c" fill-opacity="0.86" stroke="#881337" stroke-width="1.6"/>
  <!-- Right: SDH crescentic crossing suture along hemisphere -->
  <path d="M260,137 C316,140 356,174 355,212 C354,248 318,274 264,276 C298,266 334,242 335,210 C336,176 302,150 260,145 Z" fill="#1d4ed8" fill-opacity="0.82" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Labels Left EDH -->
  <text x="44" y="142" fill="#be123c" font-size="12" font-weight="700">硬腦膜外 EDH</text>
  <text x="44" y="159" fill="#334155" font-size="10">· 中腦膜動脈撕裂(顳骨骨折)</text>
  <text x="44" y="175" fill="#334155" font-size="10">· 雙凸透鏡狀 (Biconvex)</text>
  <text x="44" y="191" fill="#be123c" font-size="10" font-weight="700">· 不跨顱縫 · 可跨大腦鐮</text>
  <text x="196" y="138" fill="#0f766e" font-size="9.8" font-weight="700" text-anchor="middle">顱縫阻擋</text>

  <!-- Labels Right SDH -->
  <text x="362" y="142" fill="#1d4ed8" font-size="12" font-weight="700">硬腦膜下 SDH</text>
  <text x="362" y="159" fill="#334155" font-size="10">· 橋接靜脈撕裂</text>
  <text x="362" y="175" fill="#334155" font-size="9.6">· 新月形鋪展貼腦表</text>
  <text x="362" y="191" fill="#1d4ed8" font-size="9.6" font-weight="700">· 跨顱縫·不跨大腦鐮</text>
  <text x="362" y="214" fill="#64748b" font-size="9.6">亞急性等密度期檢視</text>
  <text x="362" y="230" fill="#64748b" font-size="9.6">皮質腦溝向內推移徵</text>

  <!-- Panel 2: Acute Stroke Core vs Penumbra -->
  <rect x="34" y="316" width="442" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="316" width="442" height="32" rx="10" fill="#f0fdfa"/>
  <rect x="34" y="336" width="442" height="12" fill="#f0fdfa"/>
  <text x="48" y="337" fill="#0f766e" font-size="13.5" font-weight="700">2. 急性缺血性中風灌流不匹配（CTP Core vs Penumbra）</text>

  <!-- Perfusion schematic -->
  <ellipse cx="120" cy="434" rx="68" ry="74" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="360" x2="120" y2="508" stroke="#94a3b8" stroke-width="1.4"/>
  <!-- Penumbra outer wedge -->
  <path d="M120,426 L60,384 C44,412 44,456 64,482 L120,442 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <!-- Core inner wedge -->
  <path d="M106,428 L74,408 C66,424 66,444 76,456 L106,438 Z" fill="#be123c" stroke="#881337" stroke-width="1.4"/>
  <text x="84" y="436" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Core</text>
  <text x="82" y="394" fill="#b45309" font-size="10.5" font-weight="700" text-anchor="middle">Penumbra</text>

  <!-- Perfusion text rules -->
  <rect x="202" y="358" width="262" height="50" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="210" y="376" fill="#be123c" font-size="11.5" font-weight="700">不可逆缺血核心（Ischemic Core）</text>
  <text x="210" y="395" fill="#334155" font-size="9.8">rCBF&lt;30% · CBF↓且CBV↓ · DWI亮/ADC暗</text>

  <rect x="202" y="415" width="262" height="50" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="210" y="433" fill="#b45309" font-size="11.5" font-weight="700">可挽救缺血半影區（Penumbra）</text>
  <text x="210" y="452" fill="#334155" font-size="9.8">Tmax&gt;6秒 · CBF↓但CBV正常或微升</text>

  <rect x="202" y="472" width="262" height="42" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="210" y="489" fill="#0f766e" font-size="11" font-weight="700">延長時間窗（6–24h）機械取栓門檻</text>
  <text x="210" y="505" fill="#334155" font-size="9.5">Core&lt;70mL · Mismatch≥1.8 · 醒後DWI-FLAIR</text>

  <!-- Panel 3: 5-Stage ICH MRI Hemoglobin Evolution -->
  <rect x="490" y="82" width="436" height="444" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="490" y="82" width="436" height="32" rx="10" fill="#fdf2f8"/>
  <rect x="490" y="102" width="436" height="12" fill="#fdf2f8"/>
  <text x="504" y="103" fill="#be123c" font-size="13.5" font-weight="700">3. 腦實質血腫（ICH）五期血紅素演變與 MRI T1／T2 訊號</text>

  <!-- Column headers -->
  <rect x="502" y="122" width="412" height="26" rx="5" fill="#f1f5f9"/>
  <text x="512" y="139" fill="#0f172a" font-size="11" font-weight="700">演變分期（時間）</text>
  <text x="626" y="139" fill="#0f172a" font-size="11" font-weight="700">主要血紅素產物與狀態</text>
  <text x="822" y="139" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">T1WI</text>
  <text x="880" y="139" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">T2WI</text>

  <!-- Row 1: Hyperacute -->
  <rect x="502" y="156" width="412" height="62" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="512" y="178" fill="#0f172a" font-size="11.5" font-weight="700">超急性期</text>
  <text x="512" y="196" fill="#64748b" font-size="10.5">&lt; 24 小時</text>
  <text x="626" y="178" fill="#1e293b" font-size="10.2" font-weight="600">細胞內氧合血紅素 (Oxy-Hb)</text>
  <text x="626" y="196" fill="#64748b" font-size="9.8">反磁性無奇電子 · 富含水份</text>
  <rect x="798" y="170" width="48" height="28" rx="14" fill="#94a3b8"/>
  <text x="822" y="189" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">等</text>
  <rect x="856" y="170" width="48" height="28" rx="14" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="880" y="189" fill="#854d0e" font-size="11" font-weight="700" text-anchor="middle">亮 ↑</text>

  <!-- Row 2: Acute -->
  <rect x="502" y="226" width="412" height="62" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="512" y="248" fill="#0f172a" font-size="11.5" font-weight="700">急性期</text>
  <text x="512" y="266" fill="#64748b" font-size="10.5">1–3 天</text>
  <text x="626" y="248" fill="#1e293b" font-size="10.2" font-weight="600">細胞內去氧血紅素 (Deoxy-Hb)</text>
  <text x="626" y="266" fill="#64748b" font-size="9.8">順磁性致 T2 去相位顯著變暗</text>
  <rect x="798" y="240" width="48" height="28" rx="14" fill="#94a3b8"/>
  <text x="822" y="259" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">等</text>
  <rect x="856" y="240" width="48" height="28" rx="14" fill="#1e293b"/>
  <text x="880" y="259" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">暗 ↓</text>

  <!-- Row 3: Early Subacute -->
  <rect x="502" y="296" width="412" height="62" rx="7" fill="#fffbeb" stroke="#fde68a"/>
  <text x="512" y="318" fill="#b45309" font-size="11.5" font-weight="700">早期亞急性</text>
  <text x="512" y="336" fill="#92400e" font-size="10.5">3–7 天</text>
  <text x="626" y="318" fill="#1e293b" font-size="10" font-weight="600">胞內高鐵血紅素 (Intra-MetHb)</text>
  <text x="626" y="336" fill="#92400e" font-size="9.8">紅血球膜完整 · T1 偶極轉亮</text>
  <rect x="798" y="310" width="48" height="28" rx="14" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="822" y="329" fill="#854d0e" font-size="11" font-weight="700" text-anchor="middle">亮 ↑</text>
  <rect x="856" y="310" width="48" height="28" rx="14" fill="#1e293b"/>
  <text x="880" y="329" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">暗 ↓</text>

  <!-- Row 4: Late Subacute -->
  <rect x="502" y="366" width="412" height="62" rx="7" fill="#fffbeb" stroke="#fde68a"/>
  <text x="512" y="388" fill="#b45309" font-size="11.5" font-weight="700">晚期亞急性</text>
  <text x="512" y="406" fill="#92400e" font-size="10.5">7–14 天（至月）</text>
  <text x="626" y="388" fill="#1e293b" font-size="10" font-weight="600">胞外高鐵血紅素 (Extra-MetHb)</text>
  <text x="626" y="406" fill="#92400e" font-size="9.8">紅血球溶解 · 去相位解除雙亮</text>
  <rect x="798" y="380" width="48" height="28" rx="14" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="822" y="399" fill="#854d0e" font-size="11" font-weight="700" text-anchor="middle">亮 ↑</text>
  <rect x="856" y="380" width="48" height="28" rx="14" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="880" y="399" fill="#854d0e" font-size="11" font-weight="700" text-anchor="middle">亮 ↑</text>

  <!-- Row 5: Chronic -->
  <rect x="502" y="436" width="412" height="78" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="512" y="456" fill="#0f172a" font-size="11.5" font-weight="700">慢性期</text>
  <text x="512" y="474" fill="#64748b" font-size="10.5">&gt; 14–28 天</text>
  <text x="626" y="456" fill="#1e293b" font-size="9.8" font-weight="600">血鐵質鐵蛋白環 (Hemosiderin)</text>
  <text x="626" y="474" fill="#64748b" font-size="9.8">超順磁巨噬細胞沉積於血腫邊緣</text>
  <text x="512" y="502" fill="#0f766e" font-size="9.8" font-weight="600">要點：CTA 點狀外滲（Spot sign）預示血腫擴大；SWI 對微出血最敏感</text>
  <rect x="798" y="446" width="48" height="28" rx="14" fill="#0f172a"/>
  <text x="822" y="465" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">暗 ↓</text>
  <rect x="856" y="446" width="48" height="28" rx="14" fill="#0f172a"/>
  <text x="880" y="465" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">暗 ↓</text>
</svg>
