<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="rad09-title rad09-desc" font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif">
  <title id="rad09-title">長骨腫瘤解剖好發位置 · 骨膜反應分級與五大關節炎侵蝕增生鑑別圖</title>
  <desc id="rad09-desc">左側呈現長骨骨骺、幹骺端與骨幹三大區段之良惡性骨腫瘤好發定位及 Lodwick 邊緣與骨膜反應特徵；右側對照退化性、類風濕性、僵直性、乾癬性與痛風五大關節炎之影像鑑別及關鍵運動傷害徵象。</desc>

  <rect x="20" y="20" width="920" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="920" height="50" rx="14" fill="#0f172a"/>
  <rect x="20" y="54" width="920" height="16" fill="#0f172a"/>
  <text x="40" y="51" fill="#ffffff" font-size="17.5" font-weight="700">長骨腫瘤解剖好發位置 · 骨膜反應分級與五大關節炎侵蝕增生鑑別</text>
  <text x="920" y="50" fill="#94a3b8" font-size="12" text-anchor="end">Rad-09 · 骨骼肌肉與關節影像</text>

  <!-- Left Panel: Long Bone Tumor Zones & Periosteal Reaction -->
  <rect x="34" y="82" width="404" height="444" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="34" y="82" width="404" height="32" rx="10" fill="#eff6ff"/>
  <rect x="34" y="102" width="404" height="12" fill="#eff6ff"/>
  <text x="48" y="103" fill="#1d4ed8" font-size="13.5" font-weight="700">1. 長骨縱軸三區段骨腫瘤定位與侵襲性骨膜反應</text>

  <!-- Stylized Long Bone Silhouette -->
  <!-- Epiphysis top -->
  <path d="M62,150 C52,126 84,120 98,132 C112,120 144,126 134,150 L126,174 L70,174 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <!-- Physeal line -->
  <path d="M68,174 Q98,168 128,174" fill="none" stroke="#be123c" stroke-width="2.2" stroke-dasharray="4,2"/>
  <!-- Metaphysis -->
  <path d="M70,174 L126,174 L116,258 L80,258 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <!-- Sunburst & Codman triangle schematic on metaphysis -->
  <line x1="122" y1="204" x2="138" y2="198" stroke="#be123c" stroke-width="1.8"/>
  <line x1="120" y1="214" x2="140" y2="214" stroke="#be123c" stroke-width="1.8"/>
  <line x1="119" y1="224" x2="138" y2="230" stroke="#be123c" stroke-width="1.8"/>
  <path d="M78,240 L66,254 L80,254" fill="none" stroke="#be123c" stroke-width="2"/>
  <!-- Diaphysis -->
  <rect x="80" y="258" width="36" height="124" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <!-- Onion-skin periosteal lines on diaphysis -->
  <line x1="75" y1="278" x2="75" y2="356" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="71" y1="288" x2="71" y2="346" stroke="#0f766e" stroke-width="1.2"/>

  <text x="98" y="156" fill="#1e3a8a" font-size="10.5" font-weight="700" text-anchor="middle">骨骺</text>
  <text x="98" y="218" fill="#92400e" font-size="10.5" font-weight="700" text-anchor="middle">幹骺端</text>
  <text x="98" y="324" fill="#115e59" font-size="10.5" font-weight="700" text-anchor="middle">骨幹</text>

  <!-- Zone Cards -->
  <rect x="150" y="122" width="276" height="74" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="156" y="140" fill="#1d4ed8" font-size="11.8" font-weight="700">骨骺區（Epiphysis）</text>
  <text x="156" y="157" fill="#334155" font-size="9.8">· 生長板閉合前：軟骨母細胞瘤 (Chondroblastoma)</text>
  <text x="156" y="173" fill="#334155" font-size="9.8">· 生長板閉合後：骨巨細胞瘤 GCT (偏心貼關節無硬化)</text>
  <text x="156" y="189" fill="#64748b" font-size="9.8">（鑑別：透明細胞軟骨肉瘤 · Geode 軟骨下囊腫）</text>

  <rect x="150" y="204" width="276" height="90" rx="7" fill="#fffbeb" stroke="#fde68a"/>
  <text x="156" y="222" fill="#b45309" font-size="11.8" font-weight="700">幹骺端（Metaphysis · 血流最豐富）</text>
  <text x="156" y="239" fill="#be123c" font-size="10" font-weight="700">· 骨肉瘤：雲絮類骨質 + 日光放射／Codman 三角</text>
  <text x="156" y="255" fill="#334155" font-size="9.8">· 骨軟骨瘤：皮質骨髓與母骨相連 (帽&gt;2cm防惡變)</text>
  <text x="156" y="271" fill="#334155" font-size="10">· 良性囊／纖維灶：SBC·ABC (液液平面)·NOF</text>
  <text x="156" y="287" fill="#64748b" font-size="9.8">兒童血源性骨髓炎亦好發於幹骺端靜脈竇</text>

  <rect x="150" y="302" width="276" height="84" rx="7" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="156" y="320" fill="#0f766e" font-size="11.8" font-weight="700">骨幹區（Diaphysis）</text>
  <text x="156" y="337" fill="#be123c" font-size="9.8" font-weight="700">· 尤文氏肉瘤：滲透蟲蝕破壞 + 洋蔥皮骨膜反應</text>
  <text x="156" y="353" fill="#334155" font-size="10">· 纖維性發育不良：毛玻璃基質 (Ground-glass)</text>
  <text x="156" y="369" fill="#334155" font-size="9.8">· 類骨質骨瘤：緻密皮質增生伴 &lt;1.5cm 透亮 Nidus</text>

  <!-- Bottom Margin & Age Rule Box -->
  <rect x="46" y="396" width="380" height="118" rx="7" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="54" y="415" fill="#be123c" font-size="12" font-weight="700">Lodwick 邊緣過渡帶與年齡鐵律</text>
  <text x="54" y="434" fill="#334155" font-size="10">· 窄過渡帶 (地圖狀 IA 硬化邊／IB)：生長慢、多屬良性</text>
  <text x="54" y="451" fill="#334155" font-size="10">· 寬過渡帶 (蟲蝕 II／滲透 III) + 中斷骨膜：高度惡性／感染</text>
  <text x="54" y="468" fill="#be123c" font-size="10" font-weight="700">· ≥40 歲多發蝕骨灶：首查骨轉移與多發性骨髓瘤 (骨掃描冷區)</text>
  <text x="54" y="486" fill="#0f766e" font-size="9.8" font-weight="600">· DXA 骨鬆：停經女／≥50男 T-score≤-2.5；年輕 Z-score≤-2.0</text>
  <text x="54" y="503" fill="#64748b" font-size="10">· 副甲狀腺亢進特異徵象：食中指中節指骨「橈側」骨膜下骨吸收</text>

  <!-- Right Panel: 5 Arthritides Matrix + Sports MRI Pearls -->
  <rect x="452" y="82" width="474" height="444" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="452" y="82" width="474" height="32" rx="10" fill="#f0fdfa"/>
  <rect x="452" y="102" width="474" height="12" fill="#f0fdfa"/>
  <text x="466" y="103" fill="#0f766e" font-size="13.5" font-weight="700">2. 五大關節炎影像鑑別矩陣與運動傷害 MRI 經典徵象</text>

  <!-- Table Header -->
  <rect x="464" y="122" width="450" height="25" rx="5" fill="#0f172a"/>
  <text x="472" y="139" fill="#ffffff" font-size="11" font-weight="700">關節炎類型（好發部位）</text>
  <text x="630" y="139" fill="#ffffff" font-size="11" font-weight="700">骨密度 · 關節腔</text>
  <text x="748" y="139" fill="#ffffff" font-size="11" font-weight="700">骨侵蝕與新骨增生標誌</text>

  <!-- Row 1: OA -->
  <rect x="464" y="152" width="450" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="472" y="171" fill="#0f172a" font-size="11.5" font-weight="700">退化性 OA</text>
  <text x="472" y="189" fill="#64748b" font-size="9.8">膝髖負重·手 DIP／PIP／CMC1</text>
  <text x="630" y="171" fill="#334155" font-size="10.4">骨密度正常</text>
  <text x="630" y="189" fill="#1d4ed8" font-size="10.4" font-weight="600">非均勻狹窄</text>
  <text x="748" y="171" fill="#334155" font-size="10.2">無發炎性邊緣侵蝕</text>
  <text x="748" y="189" fill="#0f766e" font-size="10" font-weight="700">軟骨下硬化·囊腫·邊緣骨刺</text>

  <!-- Row 2: RA -->
  <rect x="464" y="208" width="450" height="50" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="472" y="227" fill="#be123c" font-size="11.5" font-weight="700">類風濕性 RA</text>
  <text x="472" y="245" fill="#64748b" font-size="9.8">對稱腕·MCP·PIP·環樞椎</text>
  <text x="630" y="227" fill="#be123c" font-size="10.4" font-weight="600">關節旁骨鬆</text>
  <text x="630" y="245" fill="#334155" font-size="10.4">早期均勻狹窄</text>
  <text x="748" y="227" fill="#be123c" font-size="10" font-weight="700">裸區邊緣侵蝕 (Marginal)</text>
  <text x="748" y="245" fill="#334155" font-size="9.8">缺新骨增生 (C1-2 ADI&gt;3mm)</text>

  <!-- Row 3: AS -->
  <rect x="464" y="264" width="450" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="472" y="283" fill="#1d4ed8" font-size="11.5" font-weight="700">僵直性脊椎炎 AS</text>
  <text x="472" y="301" fill="#64748b" font-size="9.8">雙側對稱薦腸關節 (腸骨側早)</text>
  <text x="630" y="283" fill="#334155" font-size="10.4">晚期骨強直</text>
  <text x="630" y="301" fill="#1d4ed8" font-size="10.4" font-weight="600">STIR 早期水腫</text>
  <text x="748" y="283" fill="#334155" font-size="10">椎體角發亮方形椎 (Romanus)</text>
  <text x="748" y="301" fill="#1d4ed8" font-size="10" font-weight="700">細垂直韌帶骨贅→竹節脊椎</text>

  <!-- Row 4: Psoriatic -->
  <rect x="464" y="320" width="450" height="50" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="472" y="339" fill="#b45309" font-size="11.5" font-weight="700">乾癬性關節炎 PsA</text>
  <text x="472" y="357" fill="#64748b" font-size="9.8">手足非對稱 DIP·臘腸指</text>
  <text x="630" y="339" fill="#334155" font-size="10.4">骨密度多保留</text>
  <text x="630" y="357" fill="#334155" font-size="10.4">關節毀損強直</text>
  <text x="748" y="339" fill="#b45309" font-size="10" font-weight="700">侵蝕與絨毛骨膜增生並存</text>
  <text x="748" y="357" fill="#334155" font-size="9.8">筆套杯畸形 (Pencil-in-cup)</text>

  <!-- Row 5: Gout & CPPD -->
  <rect x="464" y="376" width="450" height="54" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="472" y="395" fill="#0f766e" font-size="11.5" font-weight="700">慢性痛風 Gout</text>
  <text x="472" y="413" fill="#64748b" font-size="9.8">第一蹠趾 MTP1·耳手足痛風石</text>
  <text x="630" y="395" fill="#0f766e" font-size="10.4" font-weight="600">骨密度正常</text>
  <text x="630" y="413" fill="#0f766e" font-size="10.4" font-weight="600">關節腔長期保留</text>
  <text x="748" y="395" fill="#0f766e" font-size="10" font-weight="700">偏心打孔侵蝕 + 懸垂骨緣</text>
  <text x="748" y="413" fill="#64748b" font-size="9.8">(CPPD：半月板／TFCC 軟骨鈣化)</text>

  <!-- Sports MRI & MSK US Callout -->
  <rect x="464" y="438" width="450" height="76" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="474" y="457" fill="#0f172a" font-size="11.5" font-weight="700">運動傷害 MRI 與骨骼肌肉超音波必考配對</text>
  <text x="474" y="475" fill="#334155" font-size="10">· 肩前下脫位：前下盂唇撕裂 (Bankart) + 肱骨頭後外壓陷 (Hill-Sachs)</text>
  <text x="474" y="492" fill="#334155" font-size="10">· 膝 ACL 斷裂：股骨外髁與外脛平台後緣接吻骨挫傷 · Segond 撕脫骨折</text>
  <text x="474" y="508" fill="#1d4ed8" font-size="9.8" font-weight="600">· 桶柄半月板撕裂：雙 PCL 徵 (Double PCL) · 肌腱音波垂直避順向異性假影</text>
</svg>
