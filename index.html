大瞳孔"]}, {"title": "深層疼痛、轉眼更痛", "points": ["鞏膜炎", "深層血管充血，需評估全身病"]}], "notes": "本主題為辨識原則，臨床表現可重疊。疑感染性角膜炎時，避免未經專科評估自行加類固醇。", "refs": ["https://aao.org/eye-health/diseases/pink-eye-conjunctivitis", "https://aao.org/eye-health/diseases/what-is-glaucoma"]}, {"id": "vision-loss", "title": "突然視力下降：先定位，再判斷急迫性", "summary": "CRAO屬急性缺血性中風範疇，不能只安排門診追蹤。", "sections": [{"title": "單眼突然無痛、明顯下降", "points": ["CRAO、缺血性視神經病變", "急診／中風與眼科評估"]}, {"title": "飛蚊、閃光、幕簾遮擋", "points": ["視網膜裂孔或剝離", "散瞳周邊眼底檢查"]}, {"title": "轉眼疼痛、色覺下降、RAPD", "points": ["視神經炎", "視神經與神經系統評估"]}, {"title": "紅痛、虹視、噁心", "points": ["急性隅角閉鎖", "即時降眼壓與專科處置"]}, {"title": "雙眼同側視野缺損", "points": ["後視路病變／中風", "神經定位與急診影像"]}], "notes": "RAPD表示傳入路徑不對稱功能受損，可見於視神經病變與嚴重視網膜病變。", "refs": ["https://professional.heart.org/en/science-news/management-of-central-retinal-artery-occlusion/top-things-to-know", "https://eyewiki.aao.org/Demyelinating_Optic_Neuritis", "https://eyewiki.aao.org/Acquired_Oculomotor_Nerve_Palsy", "https://aao.org/eye-health/diseases/detached-torn-retina"]}, {"id": "trauma", "title": "眼外傷：處置順序常比診斷名稱重要", "summary": "突出、視力惡化、RAPD與眼眶緊繃等組合，需警覺眼眶腔室症候群。", "sections": [{"title": "化學傷", "points": ["單純化學暴露、未疑開放性眼球傷時，立即大量沖洗，勿等待完整病史。移除殘留顆粒並持續評估pH。"]}, {"title": "疑開放性眼球傷", "points": ["硬式眼罩保護，避免加壓、眼壓測量或強行翻眼瞼，緊急眼科處置。"]}, {"title": "疑金屬異物", "points": ["確認機轉並考慮影像。尚未排除金屬異物前，避免MRI。"]}, {"title": "鈍傷或眼眶傷", "points": ["確認視力、瞳孔、眼球運動與複視，留意眼眶腔室症候群。"]}, {"title": "眼眶腔室症候群", "points": ["若有視神經受損警訊，立即升級求助。快速非接觸評估未疑開放性眼球傷時，由具資格且受訓醫師緊急減壓，不為等待CT而延誤。", "若同時疑開放性眼球傷與眼眶腔室症候群，立即由眼科與創傷團隊個別評估處置。"]}], "notes": "此頁聚焦檢傷與第一步，並非完整治療方案。化學傷與疑眼球破裂需要緊急專科處置。", "refs": ["https://eyewiki.aao.org/Pre-Ophthalmologist_Management_of_Eye_Trauma", "https://eyewiki.aao.org/Ruptured_Globe", "https://eyewiki.aao.org/Orbital_Compartment_Syndrome"]}, {"id": "glaucoma", "title": "青光眼：結構、功能與隅角需一起看", "summary": "正常OCT或單次正常視野不能替代整體評估，結果需考量品質與重複性。", "sections": [{"title": "定義", "points": ["以視神經病變與對應視野損害為核心"]}, {"title": "眼壓", "points": ["高眼壓是危險因子，正常眼壓不能排除青光眼"]}, {"title": "檢查", "points": ["眼壓、隅角鏡、視神經盤、OCT RNFL/GCC與視野"]}, {"title": "開放隅角", "points": ["通常漸進、早期可無症狀，追蹤進展很重要"]}, {"title": "急性隅角閉鎖", "points": ["先緊急控制眼壓，後續解除機轉並評估對側眼"]}], "notes": "藥物選擇需考量禁忌與共病，本教材不提供個案處方。正常眼壓型青光眼與眼壓高症是常見觀念對照。", "refs": ["https://aao.org/eye-health/diseases/what-is-glaucoma", "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/glaucoma/glaucoma-and-eye-pressure"]}, {"id": "vascular-retina", "title": "視網膜血管疾病：眼底線索與全身風險", "summary": "診斷題答出眼病後，要補一句「需處理的全身風險」。", "sections": [{"title": "糖尿病視網膜病變", "points": ["微血管瘤、出血、滲出或新生血管", "分期、黃斑水腫、轉診與全身控制"]}, {"title": "CRVO", "points": ["廣泛視網膜出血、靜脈擴張迂曲", "缺血與非缺血、黃斑水腫、新生血管"]}, {"title": "CRAO", "points": ["突然無痛下降、視網膜蒼白，可有櫻桃紅點", "立即評估，不等待所有典型眼底徵象"]}, {"title": "GCA相關缺血", "points": ["年長、新頭痛、咀嚼疼痛與視覺症狀", "緊急全身與眼科評估，不能延遲處置"]}], "notes": "典型徵象並非每位病人均出現，病程早期亦可能不完整。GCA可無典型全身症狀。", "refs": ["https://professional.heart.org/en/science-news/management-of-central-retinal-artery-occlusion/top-things-to-know", "https://doi.org/10.1016/j.ophtha.2024.12.020"]}, {"id": "retina-macula", "title": "視網膜裂孔、剝離與黃斑病變", "summary": "散瞳眼底與OCT回答的問題不同。OCT不能取代周邊視網膜檢查。", "sections": [{"title": "飛蚊與閃光", "points": ["新發症狀需找裂孔。視力正常也不能排除周邊裂孔。"]}, {"title": "幕簾或視野缺損", "points": ["視網膜剝離警訊，需緊急眼科評估與處置安排。"]}, {"title": "視物變形", "points": ["中央視覺問題提示黃斑病變，OCT有助辨識病灶。"]}, {"title": "AMD重點", "points": ["分辨萎縮與滲出型病變。新發變形或中央暗點需及早評估。"]}], "notes": "口述練習：病人有新發飛蚊但視力仍好，為什麼不能直接說「只是老化」？", "refs": ["https://aao.org/eye-health/diseases/detached-torn-retina", "https://aao.org/eye-health/diseases/amd-macular-degeneration"]}, {"id": "neuro", "title": "神經眼科：瞳孔、視野與視神經定位", "summary": "「瞳孔保留」不能單獨當成排除動脈瘤或其他壓迫病因的依據。", "sections": [{"title": "RAPD", "points": ["不對稱視神經或嚴重視網膜功能受損"]}, {"title": "雙顳側偏盲", "points": ["視交叉病變"]}, {"title": "同向偏盲", "points": ["視交叉後視路病變"]}, {"title": "視乳頭水腫", "points": ["需考慮顱內壓升高，與其他視神經盤腫脹鑑別"]}, {"title": "上瞼下垂、散大瞳孔、眼偏外下", "points": ["動眼神經麻痺，需緊急排除壓迫性病因"]}], "notes": "神眼題先說病灶位置，再列對應鑑別。所有新發動眼神經麻痺需完整評估，影像策略依臨床情境。", "refs": ["https://eyewiki.aao.org/Demyelinating_Optic_Neuritis", "https://eyewiki.aao.org/Acquired_Oculomotor_Nerve_Palsy"]}, {"id": "diplopia", "title": "複視與眼球運動", "summary": "眼球運動檢查同時看眼位、單眼轉動與雙眼共同運動。", "sections": [{"title": "單眼或雙眼複視", "points": ["遮住任一眼即消失：支持雙眼複視"]}, {"title": "水平或垂直", "points": ["水平可見於外展神經問題，垂直需考慮滑車神經等"]}, {"title": "隨注視方向變化", "points": ["受限方向與影像分離程度，有助定位受影響肌肉"]}, {"title": "疲勞性與變動性", "points": ["重症肌無力可有波動性複視／眼瞼下垂"]}, {"title": "外傷後複視", "points": ["眼眶骨折、嵌頓或神經傷皆需考慮"]}], "notes": "單眼複視常與屈光、角膜或晶狀體光學異常相關，但仍需依檢查確認。", "refs": ["https://eyewiki.aao.org/Basic_Approach_to_Diplopia"]}, {"id": "pediatric", "title": "斜弱視與白瞳：兒童題的優先順序", "summary": "兒童「不配合」不能直接當成視力不良的解釋。", "sections": [{"title": "弱視", "points": ["視覺發育期間形成的視力障礙，先找屈光、斜視或遮蔽因素。"]}, {"title": "基本處理", "points": ["適當屈光矯正，必要時依專科評估安排遮眼或其他治療。"]}, {"title": "白瞳", "points": ["需緊急評估，鑑別含視網膜母細胞瘤與先天性白內障等。"]}, {"title": "嬰幼兒斜視", "points": ["年齡、恆定或間歇、角膜反光與遮蓋試驗都有幫助。"]}], "notes": "弱視治療與年齡、病因及既有治療史相關。本主題不指定遮眼時數或處方。白瞳屬需迅速處理的警訊。", "refs": ["https://www.aapos.org/glossary/amblyopia", "https://www.aapos.org/glossary/strabismus", "https://www.aapos.org/glossary/strabismus-measurements", "https://www.aapos.org/glossary/leukocoria"]}, {"id": "cataract", "title": "白內障與術後視力不佳", "summary": "不能把術後視力下降一律歸因於「還在恢復」。", "sections": [{"title": "漸進、無痛、眩光", "points": ["符合白內障常見表現，仍需確認其他眼病"]}, {"title": "手術評估", "points": ["以視覺功能、生活需求與風險討論為核心"]}, {"title": "術前檢查", "points": ["角膜、眼壓、眼底與黃斑，必要時生物測量"]}, {"title": "術後紅痛且視力下降", "points": ["警覺眼內炎，需緊急眼科評估"]}, {"title": "術後漸進性模糊", "points": ["後囊混濁等可考慮，但需檢查排除其他病因"]}], "notes": "本主題為考試鑑別架構。術後眼內炎可有不同表現，不能以缺少單一症狀排除。", "refs": ["https://aao.org/eye-health/diseases/what-are-cataracts"]}, {"id": "notes-01", "title": "眼科基本檢查", "summary": "從視力、驗光與眼壓，到裂隙燈、瞳孔、眼底與影像；先學會描述，再下診斷。", "sections": [{"title": "視力與針孔的正確讀法", "points": ["OD／OS／OU分別為右／左／雙眼。Snellen 6/12＝小數0.5；分子是測試距離，不是近視度數。先測單眼裸視與最佳矯正視力；針孔改善支持屈光或光學因素，但不等於排除角膜、黃斑或其他病變。"], "recall": "6/12代表什麼？針孔改善與未改善各能、不能推論什麼？", "ref": "3–4", "medicalReview": null}, {"title": "看懂驗光單", "points": ["S是球面、C是柱面，單位均為D；axis是柱鏡軸向，單位為度。球面等效SE＝S＋C/2，例如−3.00/−1.00×180的SE為−3.50 D。SE壓縮了散光資訊，不能直接當成完整眼鏡處方。"], "recall": "如何解讀−3.00/−1.00×180？為何不能只給SE？", "ref": "4–5", "medicalReview": null}, {"title": "角膜曲率、地形圖與生物測量", "points": ["K值描述主要子午線角膜屈光力；地形圖顯示規則性、對稱性與局部陡峭。偏下方陡峭、非對稱蝴蝶結須考慮圓錐角膜。IOL估算要用眼軸長、角膜測量及適當公式，不能只用眼球總屈光力相減。"], "recall": "K值、角膜地形圖、眼軸長分別回答哪個問題？", "ref": "5–6", "medicalReview": null}, {"title": "眼壓：量測值不等於診斷", "points": ["Goldmann為壓平式眼壓計，標準壓平直徑3.06 mm；Tono-Pen與非接觸式儀器也有各自誤差。常見參考範圍10–21 mmHg，但正常眼壓也可有青光眼。角膜厚度與生物力學影響讀值，不宜套一個通用公式「校正」所有人。"], "recall": "眼壓18能排除青光眼嗎？薄角膜會如何影響解讀？", "ref": "7", "medicalReview": null}, {"title": "眼位與眼球運動", "points": ["Hirschberg看雙眼角膜光反射相對位置；內斜眼的反射相對偏顳側，外斜則偏鼻側。EOM要分辨眼位偏斜、運動不足與機械限制，並詢問複視方向。單張正面照片不能取代遮蓋試驗及完整運動檢查。"], "recall": "內斜眼的角膜反射往哪邊？眼位與運動檢查有何差別？", "ref": "8–10", "medicalReview": null}, {"title": "外觀與眼瞼功能", "points": ["檢查眼瞼高度、閉眼是否完全、瞼緣及淚點位置。兒童上瞼下垂需評估遮蔽視軸與散光／屈光參差造成弱視的風險；抬下巴不代表安全。Graves可有lid retraction與lid lag；顏面神經麻痺可造成閉合不全及外翻。"], "recall": "兒童下垂與成人閉合不全，各最怕漏掉什麼？", "ref": "9–10", "medicalReview": null}, {"title": "裂隙燈：先定位層次", "points": ["以光束寬度與角度形成光學切面，按眼瞼、結膜、角膜、前房、虹膜、晶狀體描述。組織學角膜五層不等於所有儀器上可辨的五條線。AS-OCT適合定位前節結構、厚度及液體／混濁所在層次，不能單靠一條高反射線命名感染。"], "recall": "裂隙燈與AS-OCT如何互補？如何客觀描述角膜白點？", "ref": "11–19", "medicalReview": null}, {"title": "螢光染色不是病原檢驗", "points": ["Fluorescein主要顯示角膜上皮屏障缺損、淚膜與滲漏線索。SPK是點狀上皮病變的形態描述；要再整合分布、角膜感覺、暴露、接觸鏡與用藥。染色陽性不等於細菌感染，陰性也不排除深層病變。"], "recall": "SPK與感染性角膜潰瘍，還需要哪些資料才能區分？", "ref": "20", "medicalReview": null}, {"title": "前房cells、flare與晶狀體", "points": ["Cells為可見發炎細胞；flare為蛋白造成光散射，是血房水屏障受損的線索。兩者不是同義詞，也不能單靠混濁程度判斷病原。晶狀體檢查需定位核性、皮質或後囊下混濁，並與真正後囊混濁區分。"], "recall": "Cells與flare各代表什麼？後囊下白內障與後囊混濁相同嗎？", "ref": "21–22", "medicalReview": null}, {"title": "瞳孔與RAPD", "points": ["記錄亮／暗處大小、對光反應與是否不等大。擺動手電筒測試比較兩眼傳入訊號；光移至患眼時雙眼相對擴大支持該眼RAPD。RAPD常見於不對稱視神經或嚴重視網膜病變，並不等於瞳孔括約肌麻痺。"], "recall": "右RAPD時，光由左移至右，兩眼會如何變化？", "ref": "23；No.03：42–45", "medicalReview": null}, {"title": "眼底與結構／功能配對", "points": ["直接眼底鏡像正立、放大較大但視野較窄；間接眼底鏡利於周邊視網膜及立體觀察。視乳頭、RNFL-OCT、黃斑OCT與視野回答不同問題；結構異常應與功能與臨床相符。不要只讀機器的紅綠分類。"], "recall": "視野、RNFL-OCT、黃斑OCT各自最主要測什麼？", "ref": "24–30", "medicalReview": null}, {"title": "血管攝影與安全順序", "points": ["FA偏重視網膜循環及滲漏；ICGA利於脈絡膜血管評估。急症先做能改變處置的檢查，而不是把所有儀器開一遍。外傷若疑開放性眼球傷，避免眼壓、眼球加壓與不必要接觸，先硬式眼罩保護並緊急求援。"], "recall": "疑眼球破裂時，平常的標準檢查中有哪些應暫停？", "ref": "31–36；補充E04", "medicalReview": null}], "notes": "原稿axis單位改為「度」；SE不能取代散光處方。眼壓／角膜厚度關係是判讀因素，不提供通用數值校正式。", "refs": [], "chapter": 1, "source": "眼科學No.01.pdf", "compare": [["視力 vs 度數", "視力是辨識能力；度數是光學屈光力", "看得差不能直接推估近視幾度"], ["RAPD vs 瞳孔不等大", "前者比較傳入功能；後者是大小差異", "可以只有RAPD而沒有anisocoria"], ["Cells vs flare", "細胞 vs 蛋白散射", "不能互當分級或病原判斷"], ["OCT vs 視野", "結構 vs 功能", "兩者須對照，任一異常皆需驗證"], ["Fluorescein染色 vs FA", "眼表上皮檢查 vs 血管攝影", "同名染劑，檢查目標與給予方式不同"]], "cases": [{"prompt": "視力下降病人到診，請用90秒說明你的基本檢查順序，並提出一個必須中止常規檢查的例外。", "answer": "先釐清急慢、單雙眼、痛與外傷／接觸鏡；單眼視力含矯正或針孔，再看瞳孔／RAPD、眼位與EOM、前節、適當眼壓及眼底。檢查依急症調整；疑開放性眼球傷時不要接觸加壓、不要量眼壓，眼罩與緊急轉介優先。", "ref": "3–36；E04"}, {"prompt": "你看到術後病人角膜中央白點與SPK，AS-OCT顯示白點偏表層。請描述而不要立即命名病因。", "answer": "說明側別、位置、大小、層次、邊界、染色型態、有無基質浸潤／前房反應及視力變化；再問時序、接觸鏡、用藥與疼痛。表層定位支持上皮病變，但不能單憑乾淨介面排除所有感染或其他病因；紅旗出現需眼科立即評估。", "ref": "11–21、33–36"}], "images": [{"ref": "6", "prompt": "查看角膜地形圖：描述對稱性、最陡區位置，再說一個不能僅靠地形圖回答的問題。", "answer": "應描述地圖而非只背「蝴蝶結」；偏下陡峭須考慮擴張。不能單靠前表面圖判斷所有後表面變化、進展或手術適應症。"}, {"ref": "27–30", "prompt": "查看視神經／OCT／視野圖：各選一張，說出量測對象、異常線索與一項限制。", "answer": "視乳頭／RNFL屬結構，視野屬功能；必須核對側別及上下對應。分割錯誤、信號不足與測試可靠度均可能造成假異常。"}], "correction": "原稿axis單位改為「度」；SE不能取代散光處方。眼壓／角膜厚度關係是判讀因素，不提供通用數值校正式。", "ext": ["E04"], "sourceUrl": "", "sourcePages": 44, "canonicalSource": "眼科學No.01.pdf"}, {"id": "notes-02", "title": "光學與臨床屈光", "summary": "把公式、成像與矯正原理連起來；計算題必須寫單位與符號。", "sections": [{"title": "光的波長、能量與雷射", "points": ["光子能量E＝hc/λ，波長愈短能量愈高。雷射的單色性、方向性與同調性有助聚焦能量，但實際組織作用仍取決於波長、脈衝與能量密度，不能只以顏色猜手術用途。"], "recall": "波長與能量如何成反比？雷射組織作用還取決於哪些因素？", "ref": "3–6", "medicalReview": null}, {"title": "三類雷射作用", "points": ["Excimer 193 nm用於角膜光切削，如PRK／LASIK；Nd:YAG 1064 nm可光破裂，常用於後囊切開與虹膜切開；視網膜光凝藉熱效應處理目標組織。飛秒雷射也屬光破裂原理，並不是把角膜燒掉。"], "recall": "把PRK、後囊切開、PRP分別配對作用機轉。", "ref": "3–6", "medicalReview": null}, {"title": "屈光力、Snell與全反射", "points": ["在空氣中薄透鏡F＝1/f，f以公尺計；凸鏡正、凹鏡負。Snell定律描述跨介質折射；由高折射率往低折射率且超過臨界角才有全反射。Gonioscopy透鏡可消除角膜－空氣界面的全反射障礙，讓隅角可見。"], "recall": "+4 D透鏡焦距多少？為什麼直接看不到前房隅角？", "ref": "7–10", "medicalReview": null}, {"title": "眼軸與偏心測量", "points": ["光軸、視軸、瞳孔軸有不同定義，角kappa傳統上指視軸與瞳孔軸夾角。儀器報告的chord偏移是線性距離，不能把mm直接當角度。屈光手術對中需依測量方式與臨床條件，不可只背單一「正常0.5 mm」判斷。"], "recall": "角kappa與以毫米表示的偏移為何不能混用？", "ref": "11–14", "medicalReview": null}, {"title": "像差：先分低階與高階", "points": ["近視、遠視、規則散光主要以球柱鏡矯正；球面像差、彗差等高階像差不由單純球柱鏡完整描述。球面像差是中央與周邊光線焦點不同；彗差常見於非對稱光學系統。色差來自不同波長折射率不同，通常短波長折射較強。"], "recall": "球面像差、彗差與色差各用一句話區別。", "ref": "15–18、45–48", "medicalReview": null}, {"title": "近視、遠視與散光", "points": ["調節放鬆時，近視焦點在視網膜前，通常用負鏡；遠視在後，通常用正鏡。規則散光有兩主要子午線，不是單一焦點。屈光參差是兩眼屈光狀態不同，可能造成影像大小差與兒童弱視。"], "recall": "遠視兒童為何可能看得清楚，卻仍有內斜視風險？", "ref": "19–23", "medicalReview": null}, {"title": "調節與老花", "points": ["看近時睫狀肌收縮、懸韌帶鬆弛、晶狀體變凸，屈光力增加。睫狀肌放鬆只代表調節減少，不是晶狀體屈光力歸零。老花是調節能力下降；近視患者即使能摘眼鏡看近，仍可能已有老花。"], "recall": "從肌肉到晶狀體形狀，說明完整調節鏈。", "ref": "30–31、37–39", "medicalReview": null}, {"title": "遠點與近點計算", "points": ["未矯正近視M D、調節幅度A D：遠點＝1/M公尺，近點＝1/(M＋A)。正視近點＝1/A。遠視H D若A>H，近點＝1/(A−H)；其遠點是眼後虛點，不能當成眼前實際最遠閱讀距離。所有計算需先說假設：薄透鏡、忽略頂點距離。"], "recall": "−2 D近視、調節4 D，未矯正近點與遠點各多少？", "ref": "30–31", "medicalReview": null}, {"title": "頂點距離與隱形眼鏡", "points": ["高屈光度眼鏡改接觸鏡需考慮頂點距離。以眼鏡到角膜距離d公尺，FCL＝Fs/(1−dFs)。負鏡靠近角膜後通常需要較小負度數，正鏡通常需要較大正度數；低度數差異較小。"], "recall": "−10 D眼鏡、頂點12 mm，接觸鏡近似需多少度？", "ref": "32–36", "medicalReview": null}, {"title": "眼鏡、稜鏡與多焦點", "points": ["稜鏡使光向基底偏折，所見影像向頂端偏移；1稜鏡度在1 m產生1 cm偏移。高屈光參差眼鏡可能有影像大小與稜鏡效應問題，接觸鏡有時較適合。多焦點有區域與適應限制，並非所有視覺品質問題皆能靠加度數解決。"], "recall": "光與影像在稜鏡中的偏移方向相同嗎？", "ref": "19–23、32–39", "medicalReview": null}, {"title": "接觸鏡與角膜屈光手術", "points": ["接觸鏡要注意缺氧與感染風險，尤其過夜及接觸水。PRK處理表層後切削；LASIK製作角膜瓣再切削；SMILE以小切口取出基質透鏡，沒有LASIK式角膜瓣，但仍可能乾眼、發炎或視覺症狀。術前排除擴張風險的重要性勝過背術式廣告。"], "recall": "PRK、LASIK、SMILE各用一個構造差異區分。", "ref": "40–44", "medicalReview": null}, {"title": "晶狀體式矯正與選擇", "points": ["Phakic IOL保留天然晶狀體，仍有眼壓、內皮及白內障等風險。白內障手術的IOL則替代已移除的晶狀體；toric矯正規則散光，多焦點需評估對比、眩光與共病。術式選擇需結合角膜、前房、晶狀體、眼底與病人需求。"], "recall": "Phakic IOL與白內障IOL手術，是否都移除原生晶狀體？", "ref": "42–44；No.06：31", "medicalReview": null}], "notes": "原稿「睫狀肌放鬆→晶狀體沒有屈光力」應改為「調節力下降」；axis／角kappa的角度與毫米需分清；SMILE無乾眼、無神經影響等絕對說法不採用。", "refs": [], "chapter": 2, "source": "眼科學No.02.pdf", "compare": [["近視 vs 遠視", "焦點在前、負鏡 vs 焦點在後、正鏡", "年輕遠視可藉調節掩蓋"], ["球面像差 vs 彗差", "中心／周邊焦點不同 vs 非對稱拖尾", "兩者皆不等於規則散光"], ["PRK vs LASIK vs SMILE", "表層切削 vs 角膜瓣下切削 vs 透鏡取出", "無瓣不等於無併發症"], ["眼鏡 vs 接觸鏡", "有頂點距離 vs 近角膜平面", "高度數不可直接照抄"], ["屈光參差 vs 不等像", "兩眼度數不同 vs 兩眼影像大小不同", "相關，但不是同一定義"]], "cases": [{"prompt": "−8 D近視患者想做屈光手術，說明你會先問／檢查什麼，而不是立即推薦某術式。", "answer": "釐清屈光穩定、用眼需求、乾眼與接觸鏡史；量測角膜形態／厚度、眼表、瞳孔、前房與眼底。解釋LASIK、PRK、SMILE與phakic IOL的結構差別與風險；高近視矯正不等於消除視網膜風險，不承諾零乾眼或零併發症。", "ref": "32–44；No.10：48"}, {"prompt": "考官給你−3 D近視、調節幅度2 D；請算未矯正遠近點，再比較全矯正後近點。", "answer": "未矯正遠點1/3 m約33 cm、近點1/(3＋2) m＝20 cm；忽略頂點與鏡片誘發效應，完全矯正後近點約1/2 m＝50 cm。必須先說明簡化假設，並解釋為何近視摘鏡可方便看近，但不等於未老花。", "ref": "30–39"}], "images": [{"ref": "15–18", "prompt": "找出球面像差與彗差的光路／成像示意，分別用一句機制描述，不只念名稱。", "answer": "球面像差比較同軸中央與周邊光線焦點；彗差強調離軸／非對稱成像拖尾，屬不同像差。"}, {"ref": "43–44", "prompt": "比較PDF第43–44頁的角膜屈光手術描述與圖，再自行畫出PRK、LASIK及SMILE的組織層次差異。", "answer": "PRK先處理表面再切削基質，LASIK瓣下切削，SMILE基質透鏡取出；無角膜瓣不等於完全沒有組織與神經損傷。"}], "correction": "原稿「睫狀肌放鬆→晶狀體沒有屈光力」應改為「調節力下降」；axis／角kappa的角度與毫米需分清；SMILE無乾眼、無神經影響等絕對說法不採用。", "ext": [], "sourceUrl": "", "sourcePages": 50, "canonicalSource": "眼科學No.02.pdf"}, {"id": "notes-03", "title": "神經眼科", "summary": "用視野、瞳孔、眼位與眼球運動定位；急性危險病因先於精緻命名。", "sections": [{"title": "視路與單眼／雙眼缺損", "points": ["視交叉前病變通常造成單眼視功能異常；視交叉受壓常見雙顳側缺損；視交叉後造成對側同向缺損。鼻側視網膜纖維在交叉處跨中線；顳側纖維不交叉。視野名稱以病人看不到的空間命名，不以受損視網膜命名。"], "recall": "右視束受損會造成哪一側、哪種視野缺損？", "ref": "3–9", "medicalReview": null}, {"title": "視放射、枕葉與垂直中線", "points": ["顳葉Meyer loop攜帶對側上方視野；頂葉放射攜帶對側下方視野。枕葉病變可高度一致，偶有黃斑保留，但不能把黃斑保留當成必要條件。尊重垂直中線的缺損需考慮神經定位。原稿將Meyer loop寫成額葉應修正。"], "recall": "右顳葉病變和右頂葉病變，各是哪個象限缺損？", "ref": "7–9、17–20", "medicalReview": null}, {"title": "視乳頭水腫不等於papilledema", "points": ["Optic disc edema是外觀總稱；papilledema特指顱內壓上升造成的視乳頭水腫。早期中央視力可能保留、盲點擴大，不能因VA正常就放心。頭痛、暫時視黑及雙側水腫須評估顱內病因；腰穿應先確認安全與適當影像。"], "recall": "為何視力1.0仍不能排除危險的papilledema？", "ref": "10–11", "medicalReview": null}, {"title": "缺血性視神經病變", "points": ["AION可有突發單眼無痛視力下降、視乳頭水腫及高度性視野缺損。NAION常見擁擠視乳頭與血管風險；GCA相關AAION應問新頭痛、咀嚼跛行及全身症狀。高度懷疑GCA須立即高劑量全身性glucocorticoids並緊急專科評估，不能等待檢驗或切片結果；有視力威脅時考慮靜脈pulse治療。"], "recall": "遇到老年AION，哪些問題會立即改變處置急迫性？", "ref": "11–13", "medicalReview": {"date": "2026-10-10", "reason": "現有內容方向正確，但需明確說出GCA立即類固醇治療。", "sources": [{"url": "https://academic.oup.com/rheumatology/article/59/3/e1/5714024", "title": "BSR guideline on diagnosis and treatment of giant cell arteritis", "conclusion": "高度懷疑GCA須立即給高劑量全身性glucocorticoids，不等檢驗結果；有視力症狀須當日緊急眼科評估。"}, {"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12344504/", "title": "2021 ACR/Vasculitis Foundation GCA guideline", "conclusion": "GCA合併視力威脅時，條件式建議靜脈pulse glucocorticoids優於高劑量口服；證據確定性低，途徑依個案判斷。"}]}}, {"title": "視神經炎及其他視神經病變", "points": ["典型視神經炎可眼球轉動疼痛、色覺／紅色飽和度下降、中央暗點與RAPD，眼底可正常。雙眼、極重度、非典型年齡或恢復不佳需考慮其他病因如AQP4／MOG相關疾病。營養／毒性常為雙側中央－盲點暗點；LHON有粒線體遺傳背景。"], "recall": "正常視乳頭外觀為何不能排除視神經炎？", "ref": "14–16", "medicalReview": null}, {"title": "六條外眼肌與基本動作", "points": ["LR由VI、SO由IV，其餘主要眼外肌由III支配。外直肌外轉、內直肌內轉；上直肌與下直肌在外轉位較能測垂直作用；斜肌在內轉位較能測垂直作用。Saccade、smooth pursuit與VOR測不同運動系統。"], "recall": "在內轉位測向下動作，主要測哪條肌？", "ref": "29–34", "medicalReview": null}, {"title": "INO與one-and-a-half", "points": ["INO是MLF病變：患側內轉不足、對側外轉眼震；集合可保留但不是必要條件。One-and-a-half為同側水平凝視中心／VI核，加同側MLF病變，只剩對側眼外轉。不要把眼位限制一律視為周邊肌肉麻痺。"], "recall": "右INO與右one-and-a-half，哪一個保留動作不同？", "ref": "35–36", "medicalReview": null}, {"title": "第三神經麻痺", "points": ["典型下垂、眼球外下偏，可伴散瞳。新發III麻痺需評估壓迫性／血管性病因；瞳孔保留不能單獨排除動脈瘤，部分性麻痺尤其不能套舊「rule of pupil」。合併急痛、頭痛或神經症狀應立即處理。"], "recall": "為何糖尿病加瞳孔正常，不足以直接結案III麻痺？", "ref": "37–38；補充E01", "medicalReview": null}, {"title": "第四與第六神經麻痺", "points": ["單側IV麻痺常患眼高位，對側注視與同側頭傾時惡化；患者可代償向對側傾頭。VI麻痺造成患側外轉不足、內斜與水平複視，遠距及看患側更明顯；需依病程與伴隨徵象評估。"], "recall": "右IV與右VI麻痺，各用兩個誘發條件區分。", "ref": "39–41", "medicalReview": null}, {"title": "光反射與Adie", "points": ["對光反射傳入CN II、傳出CN III副交感；近反射不完全走同一中樞路徑。Adie tonic pupil為節後副交感／睫狀神經節相關病變，常有光近分離、緩慢再擴大；稀釋pilocarpine反應有時間與特異性限制，不能單項定論。"], "recall": "RAPD、Adie與III麻痺，各主要在反射弧哪一段？", "ref": "42–43", "medicalReview": null}, {"title": "Horner定位與急症", "points": ["Horner為交感路徑中斷：縮瞳、輕度上瞼下垂、暗處擴瞳延遲；無汗的分布依位置而不同。第三級眼部交感纖維沿內頸動脈入顱，非外頸動脈。急性疼痛性Horner要緊急排除頸動脈剝離，不等待藥物確認才啟動評估。"], "recall": "暗處與亮處何者更凸顯Horner瞳孔差？痛性急發時最怕什麼？", "ref": "44–45；補充E02", "medicalReview": null}, {"title": "面試用神經定位順序", "points": ["先確認單雙眼、急慢與疼痛；依視力／色覺／RAPD分視神經，依視野分交叉前後，依眼位與運動分核上、核間、神經、神經肌肉或機械性。定位不能取代病因搜尋。對不確定結果先補關鍵證據，切勿宣稱VEP正常就證明裝病。"], "recall": "請用視野、瞳孔與EOM三類證據說明定位，而非直接猜病名。", "ref": "3–20、29–48", "medicalReview": null}], "notes": "重點修正：Meyer loop在顳葉；眼部Horner第三級纖維沿內頸動脈；瞳孔保留不能獨立排除III麻痺的動脈瘤病因。", "refs": [], "chapter": 3, "source": "眼科學No.03.pdf", "compare": [["視交叉 vs 枕葉", "雙顳側 vs 對側同向缺損", "先按視野空間命名，再推纖維"], ["Meyer loop vs 頂葉放射", "對側上象限 vs 對側下象限", "Meyer在顳葉，不在額葉"], ["Papilledema vs disc edema", "高顱壓特定病因 vs 外觀總稱", "AION也可disc edema但非papilledema"], ["III麻痺 vs Horner", "常散瞳、重度下垂及EOM障礙 vs 縮瞳、輕度下垂", "兩者均可能有危險急性病因"], ["INO vs VI麻痺", "內轉不足＋對側外轉眼震 vs 外轉不足", "集合保留不是INO必備條件"]], "cases": [{"prompt": "60歲糖尿病病人突然眼瞼下垂、眼球外下偏，但瞳孔正常。考官問：「是不是微血管性，追蹤就好？」", "answer": "不能只據糖尿病與瞳孔保留定論；先確認完整或部分III麻痺、疼痛／頭痛、起病及其他神經徵象。新發III麻痺需及時血管／影像評估並與神經眼科協作。可將微血管性列鑑別，但不能用它直接排除動脈瘤。", "ref": "37–38；E01"}, {"prompt": "病人右眼縮瞳、輕度下垂，暗處差異更大，並有新發右側頸痛。請定位及說明第一步。", "answer": "這組合支持右Horner，暗處交感擴瞳障礙更明顯；眼部第三級神經沿ICA。急性疼痛使頸動脈剝離成為先排急症，需立即血管／神經評估；藥物試驗不能延誤。無明顯無汗不能排除節後Horner。", "ref": "44–45；E02"}], "images": [{"ref": "7–9", "prompt": "遮住圖上的病灶名稱，以每個視野圖說出側別與交叉前／中／後定位；特別比較上、下象限缺損。", "answer": "單眼偏交叉前、雙顳偏交叉、同向偏交叉後；右顳葉為左上，右頂葉為左下。原稿Meyer loop的額葉描述勿照背。"}, {"ref": "35–36", "prompt": "看核間性眼肌麻痺／one-and-a-half示意，指出每眼在左右看時仍保留的運動。", "answer": "INO患側內轉不足、對側外轉眼震；one-and-a-half再加同側水平凝視障礙，僅對側外轉保留。"}], "correction": "重點修正：Meyer loop在顳葉；眼部Horner第三級纖維沿內頸動脈；瞳孔保留不能獨立排除III麻痺的動脈瘤病因。", "ext": ["E01", "E02"], "sourceUrl": "", "sourcePages": 53, "canonicalSource": "眼科學No.03.pdf"}, {"id": "notes-04", "title": "弱視與斜視", "summary": "把感覺功能、眼位測量、眼外肌定位與治療目的分清；不是把眼睛擺正就完成治療。", "sections": [{"title": "視覺發育與弱視定義", "points": ["弱視是視覺發育期異常視覺經驗導致的最佳矯正視力缺損，需排除足以解釋程度的器質病。常見斜視性、屈光參差性與形覺剝奪性，也有雙側高度屈光不正。兩眼差兩行可支持單側弱視，但不是所有弱視必有左右差。"], "recall": "為何雙眼同樣看不好仍可能是弱視？", "ref": "6–11", "medicalReview": null}, {"title": "Crowding與幼兒視力", "points": ["弱視眼常在成排字標比單個字標更難辨識，稱crowding。依年齡採固視、追視、圖形或字標，單眼分開檢查；偏好固定用一眼是線索但非精確視力。眼底正常不等於視覺發育正常。"], "recall": "單字標正常但整行較差，對弱視評估有何提示？", "ref": "8–10", "medicalReview": null}, {"title": "弱視治療的順序", "points": ["先解除剝奪原因、給予適當屈光矯正，再依需求以遮蓋或atropine懲罰較好眼。治療需追蹤依從性、視力與逆向弱視，不能擅自把好眼全天遮蓋。愈早介入通常愈好，但不應把7或8歲當「以後完全無效」的硬界線。"], "recall": "治療弱視遮哪眼？為何還要追蹤未患眼？", "ref": "9–11；補充E05", "medicalReview": null}, {"title": "眼外肌作用與雙眼視", "points": ["眼位對準使兩眼影像可融合，視網膜對應與眼球運動共同支持立體視。上／下直肌在外轉位、上／下斜肌在內轉位較易單獨測垂直作用。看到複視先分單眼或雙眼；遮任一眼後消失者支持雙眼對位問題。"], "recall": "斜視引起的複視，遮住任一眼會如何？", "ref": "12–16", "medicalReview": null}, {"title": "抑制與異常視網膜對應", "points": ["兒童可藉抑制偏斜眼影像避免複視，代價可能是弱視或失去立體視。異常視網膜對應是感覺適應，不是長出新的解剖中央凹。Worth四點需先確認眼鏡顏色及距離，再判斷融合、抑制與複視。"], "recall": "為何先天斜視兒童不一定抱怨複視？", "ref": "22–23", "medicalReview": null}, {"title": "Hirschberg、Krimsky與遮蓋試驗", "points": ["Hirschberg用光反射粗估眼位，Krimsky加稜鏡中和。Cover-uncover測顯性偏斜，alternate cover破壞融合後觀察總解離偏斜；搭配稜鏡可量化。兩者不能只用「有遮眼」當同一檢查。"], "recall": "顯斜與總偏斜分別用哪種遮蓋試驗評估？", "ref": "24–25", "medicalReview": null}, {"title": "旋轉複視與AC/A", "points": ["Double Maddox rod評估主觀眼球旋轉；AC/A描述調節帶來的集合量。近距內斜大於遠距可提示高AC/A，但仍須確認屈光與測量條件。共同性斜視各方向偏斜量相近；非共同性提示麻痺、限制或其他運動問題。"], "recall": "近距離內斜明顯大於遠距，還要補查哪些條件？", "ref": "26–27", "medicalReview": null}, {"title": "假性、嬰兒型與調節性內斜", "points": ["寬鼻樑與內眥贅皮可看似內斜，但對稱光反射與遮蓋無重新固視支持假性。嬰兒型內斜常在6個月內出現；調節性內斜與遠視、調節集合有關，先做睫狀肌麻痺驗光及適當遠視全矯正，再評殘餘偏斜。"], "recall": "如何不靠照片外觀區分假性與真正內斜？", "ref": "28–30", "medicalReview": null}, {"title": "外斜、控制力與感覺性斜視", "points": ["間歇性外斜可在疲勞、發呆或遠望時出現，要看頻率、控制力、立體視與進展，不只量單次角度。單眼視力差可造成感覺性外斜，需先找視力低下病因。下斜肌過動可有內轉位過度上轉，須與其他垂直偏斜鑑別。"], "recall": "外斜只在疲倦時出現，除了角度還要追蹤什麼？", "ref": "35–37", "medicalReview": null}, {"title": "機械限制與眼眶外傷", "points": ["Forced duction協助分辨機械性受限與神經麻痺，但不是所有急性眼傷都可直接操作。兒童眼眶trapdoor骨折可能外觀瘀青不多，卻有運動受限、噁心與心搏過緩；需警覺肌肉夾困，及時眼眶專科處理。"], "recall": "眼外傷後抬眼受限伴嘔吐，為何不能因瘀青少而放心？", "ref": "38–39；補充E04", "medicalReview": null}, {"title": "Duane與先天神經支配異常", "points": ["Duane syndrome屬先天性神經支配異常，常有外轉受限及內轉時眼球後縮、眼裂變窄。I型外轉限制為主，II型內轉，III型兩者。不能把所有先天外轉不足都當成新發VI麻痺。"], "recall": "Duane最能和單純VI麻痺區分的動態徵象是什麼？", "ref": "40–41", "medicalReview": null}, {"title": "斜視手術與長期目標", "points": ["Recession將肌附著點後移以減弱，resection縮短肌肉以增強。手術改善眼位，感覺功能仍取決於病程、視力與融合；弱視治療與屈光矯正可能仍需持續。評估成功需同時看眼位、複視、頭位、雙眼視與患者生活。"], "recall": "手術後兩眼變正，為何不能自動停止弱視治療？", "ref": "42–45", "medicalReview": null}], "notes": "弱視可為雙側；「左右差兩行」不是全部定義。早期治療最佳，但超過7–8歲不等於完全無治療價值。異常視網膜對應不是解剖新中央凹。", "refs": [], "chapter": 4, "source": "眼科學No.04.pdf", "compare": [["弱視 vs 斜視", "視覺發育功能缺損 vs 眼位不正", "可共存，也可各自存在"], ["Cover-uncover vs alternate cover", "顯斜 vs 解離後總偏斜", "須觀察哪隻眼重新固視"], ["假性內斜 vs 調節性內斜", "外觀因素、試驗無真偏斜 vs 遠視調節集合", "假性仍要正常視覺發育評估"], ["Recession vs resection", "後移減弱 vs 縮短增強", "手術名稱不等於治好弱視"], ["Duane vs VI麻痺", "先天、內轉後縮窄眼裂 vs 外轉神經障礙", "病程和動態表現重要"]], "cases": [{"prompt": "4歲小朋友右眼0.3、左眼1.0，右眼有較高遠視，眼底無可解釋病灶。如何向家長說明治療？", "answer": "支持屈光參差性弱視，但先完成適齡視力與睫狀肌麻痺驗光；提供清楚影像的眼鏡，再依反應安排較好眼遮蓋或其他專科治療。說明治療需持續使用較差眼與追蹤，不能自行加長遮蓋而傷害較好眼，也不承諾固定時間恢復正常。", "ref": "6–11；E05"}, {"prompt": "青少年右眼外轉不足，家長說自幼如此；內轉時右眼後縮且眼裂變窄。請與VI麻痺區分。", "answer": "先天病程和內轉時後縮／窄眼裂支持Duane而非單純VI麻痺；評估頭位、眼位、雙眼視與其他運動。不要把新發神經麻痺的處理直接套上；同樣不能因先天就忽略視力、弱視或功能問題。", "ref": "40–45"}], "images": [{"ref": "24–25", "prompt": "看遮蓋試驗圖，指出正在觀察被遮眼或未遮眼、重新固視代表什麼，並區分兩種試驗。", "answer": "Cover-uncover用於顯斜，alternate cover解離融合後測總偏斜；需描述運動方向，不是只認遮眼動作。"}, {"ref": "40–41", "prompt": "從Duane圖中找內轉與外轉時的眼裂差，說出最有辨識力的動態表現。", "answer": "內轉時眼球後縮、眼裂變窄，搭配先天運動限制；單張靜態內斜不能單獨診斷Duane。"}], "correction": "弱視可為雙側；「左右差兩行」不是全部定義。早期治療最佳，但超過7–8歲不等於完全無治療價值。異常視網膜對應不是解剖新中央凹。", "ext": ["E04", "E05"], "sourceUrl": "", "sourcePages": 48, "canonicalSource": "眼科學No.04.pdf"}, {"id": "notes-05", "title": "角膜與鞏膜", "summary": "先判斷上皮、基質或內皮，再辨感染、免疫、退化、創傷；疼痛不等於病情嚴重度。", "sections": [{"title": "五層與透明機制", "points": ["由前至後為epithelium、Bowman、stroma、Descemet、endothelium。規則基質膠原、無血管與適當含水量支持透明；內皮泵維持脫水狀態，功能不足會水腫。上皮能再生不等於基質疤痕也能完全恢復透明。"], "recall": "五層依序說出，哪一層功能不足最直接造成水腫？", "ref": "4–9", "medicalReview": null}, {"title": "知覺、營養與角膜緣", "points": ["角膜知覺主要來自V1；營養與氧來自淚膜、房水及周邊循環。角膜緣幹細胞支持上皮更新，嚴重破壞可造成結膜化、血管與持續上皮缺損。Specular microscopy看內皮，topography看曲率形狀，兩者不可互換。"], "recall": "角膜緣缺血為何比表面「看起來白一點」更值得擔心？", "ref": "4–9", "medicalReview": null}, {"title": "感染性角膜炎的證據", "points": ["紅、痛、畏光、視力下降，合併基質浸潤與上皮缺損，需警覺感染。接觸鏡提示Pseudomonas等風險，植物傷提示真菌，水接觸提示Acanthamoeba；這些是線索而非一對一確診。中央、大片、深層、非典型或重症由眼科評估刮片／培養及立即治療。"], "recall": "接觸鏡、植物傷、水接觸，各提示什麼但不能證明什麼？", "ref": "10–11", "medicalReview": null}, {"title": "HSV與VZV", "points": ["HSV上皮炎典型樹枝狀潰瘍與末端膨大，VZV可見較隆起、染色較弱的假樹枝狀病灶。HSV可降低角膜知覺；HZO需看V1皮節與眼部受累。活動性HSV上皮炎不可用類固醇單方；部分基質性疾病可在抗病毒與專科監督下使用抗發炎治療。"], "recall": "為何不能把所有皰疹角膜炎都背成「永遠不用類固醇」？", "ref": "12–14", "medicalReview": null}, {"title": "周邊潰瘍與免疫性融解", "points": ["Peripheral ulcerative keratitis可伴RA、GPA等全身疾病，需描述周邊新月形缺損、基質變薄與鞏膜炎。感染也能造成變薄，不能看到融解就直接給免疫抑制。進行性變薄或穿孔是眼科急症，治療需處理眼部與全身病因。"], "recall": "PUK要先排哪些病因？何種變化表示需立即升級處理？", "ref": "15–16", "medicalReview": null}, {"title": "暴露性角膜病變", "points": ["閉合不全、眼瞼後縮、突眼或VII麻痺使眼表暴露，常下方較明顯。檢查自然眨眼、用力閉眼、Bell現象與眼瞼位置，不能只問「乾不乾」。處理需保護眼表與改善暴露機制；嚴重缺損時需專科介入。"], "recall": "暴露性病變與單純淚液不足，檢查重點哪裡不同？", "ref": "17–19", "medicalReview": null}, {"title": "神經滋養性角膜病變", "points": ["V1感覺受損造成上皮修復不良，可有持續缺損、潰瘍甚至融解，但病人疼痛不明顯。皰疹、三叉神經損傷、糖尿病等背景可提供線索。不要以「不太痛」排除嚴重角膜病，也不應讓病人在家反覆點表面麻醉藥。"], "recall": "嚴重缺損卻不痛時，為什麼一定要測角膜感覺？", "ref": "20–22", "medicalReview": null}, {"title": "開放性眼球傷與異物", "points": ["全層傷可有尖瞳、組織脫出或滲漏；高速小傷口也可能伴眼內異物。疑似病例先硬式眼罩、避免壓迫與自行取出異物，及時眼科與影像評估；不要量眼壓或用壓力貼布。眼表擦傷與眼球穿孔不是同一安全層級。"], "recall": "哪些外傷徵象會讓你停止接觸式檢查？", "ref": "23–24；補充E04", "medicalReview": null}, {"title": "營養不良、退化與沈積", "points": ["典型角膜dystrophy常遺傳、雙側並累及特定層次；degeneration較偏後天，但勿將典型當絕對。Fuchs為內皮問題，可guttata及晨起較模糊。Arcus為周邊脂質；Kayser–Fleischer為Descemet附近銅沈積；Fleischer ring則圓錐角膜的上皮鐵沈積。"], "recall": "三種角膜環的物質與位置能否不看書配對？", "ref": "32–40、43", "medicalReview": null}, {"title": "圓錐角膜與移植層次", "points": ["圓錐角膜為擴張、變薄與不規則散光，可見Vogt striae、Fleischer ring。Cross-linking主要為控制進展，不是保證消除既有散光。內皮病變可考慮DSAEK／DMEK；DMEK移植Descemet與內皮，DSAEK另帶薄後基質；全層PK與保留內皮的DALK目標不同。"], "recall": "DMEK、DSAEK、PK的被置換層次如何不同？", "ref": "34–42", "medicalReview": null}, {"title": "化學傷：先沖洗", "points": ["化學暴露要立即大量沖洗，不因等完整病史、視力或專用液而延誤；安全情況下移除隱形眼鏡及穹窿殘留顆粒，反覆確認pH。評估角膜混濁與角膜緣缺血。鹼性傷常深，但酸傷也可能很重；不可背「酸都比較安全」。"], "recall": "化學傷最先做什麼？為何沖完表面還要翻眼瞼及重測pH？", "ref": "45–46；補充E04", "medicalReview": null}, {"title": "表層鞏膜炎、鞏膜炎與眼表腫瘤", "points": ["Episcleritis常較表淺且疼痛輕；scleritis常深部鑽痛、夜痛或轉眼痛，可伴全身免疫病與感染。血管能否退色是線索，不是唯一診斷條件。角膜緣膠狀／白斑性腫塊或進展性病灶需考慮OSSN，而不是一律當翼狀贅片。"], "recall": "疼痛深度、血管層次與全身病史如何幫助分辨紅眼？", "ref": "44、47", "medicalReview": null}], "notes": "原稿中的風險比例與「酸傷一定輕」不當作硬規則；「上皮HSV禁用類固醇單方」不等於所有基質性HSV永遠不能使用類固醇。", "refs": [], "chapter": 5, "source": "眼科學No.05.pdf", "compare": [["HSV樹枝狀 vs VZV假樹枝狀", "典型HSV有末端膨大；VZV較隆起且染色不同", "單靠外型仍需病史與專科評估"], ["暴露性 vs 神經滋養性", "閉合／位置失常 vs 感覺與修復失常", "兩者可共存，皆可能潰瘍"], ["Fleischer vs Kayser–Fleischer", "上皮鐵、圓錐角膜 vs Descemet銅、Wilson", "名稱接近，物質／層次不同"], ["DMEK vs DSAEK", "DM＋內皮 vs 薄後基質＋DM＋內皮", "都是選定內皮疾病的層狀手術"], ["Episcleritis vs scleritis", "表淺、通常較輕 vs 深痛、可威脅視力", "需區分免疫性與感染性病因"]], "cases": [{"prompt": "戴接觸鏡患者紅眼疼痛，中央角膜有2 mm浸潤與上皮缺損。請說明你會先做與不做什麼。", "answer": "記錄視力、位置／深度／大小、前房反應，問過夜、水接觸、植物外傷及用藥；停止戴鏡並及時眼科處理，中央病灶需由眼科評估刮片與適當抗感染。不要只叫他換人工淚液、不要用類固醇單方或自行包覆掩蓋惡化。", "ref": "10–14"}, {"prompt": "病人兩年前帶狀皰疹，現在角膜上皮缺損很大但不痛，感覺降低。診斷方向與危險在哪？", "answer": "神經滋養性角膜病變是重要方向；應同時排感染、暴露及藥物毒性。感覺低造成保護與修復不足，疼痛輕不代表安全；評估基質變薄、融解及穿孔風險並及時眼科治療。", "ref": "12–14、17–22"}], "images": [{"ref": "12–14", "prompt": "比較皰疹相關角膜圖片：先描述分支、末端、染色與病灶是否隆起，再提出鑑別。", "answer": "典型HSV dendrite末端膨大且潰瘍染色，VZV pseudodendrite常較隆起；形態不是病原檢驗的替代品。"}, {"ref": "41–43", "prompt": "查看圓錐角膜與環狀沈積圖：指出最陡／最薄方向，區別Fleischer與KF環。", "answer": "圓錐角膜有變薄與不規則散光；Fleischer為上皮鐵，KF為Descemet附近銅，不可因名字相像就互換。"}], "correction": "原稿中的風險比例與「酸傷一定輕」不當作硬規則；「上皮HSV禁用類固醇單方」不等於所有基質性HSV永遠不能使用類固醇。", "ext": ["E04"], "sourceUrl": "", "sourcePages": 54, "canonicalSource": "眼科學No.05.pdf"}, {"id": "notes-06", "title": "晶狀體與白內障", "summary": "用胚胎、懸韌帶、代謝與混濁位置解釋症狀；手術方式與術後問題分開記。", "sections": [{"title": "胚胎來源與終生生長", "points": ["晶狀體來自表面外胚層的placode、pit與vesicle，不是視網膜來源的神經外胚層。後壁細胞拉長成初級纖維，赤道附近持續產生次級纖維，使晶狀體終生增加纖維層。正常晶狀體無血管，透明依賴有序結構與蛋白／水分平衡。"], "recall": "晶狀體與視網膜的胚胎來源如何不同？", "ref": "4–8", "medicalReview": null}, {"title": "胚胎血管殘跡", "points": ["Persistent pupillary membrane在虹膜／瞳孔區；Mittendorf dot常為後囊鼻下方玻璃體動脈殘跡；Bergmeister papilla位於視乳頭。三者都可與胚胎結構殘留有關，但位置不可互換，也不是每個殘跡都影響視力。"], "recall": "Mittendorf dot與Bergmeister papilla分別在哪裡？", "ref": "9", "medicalReview": null}, {"title": "形狀異常與症候群", "points": ["Anterior lenticonus與Alport相關，posterior lenticonus常為單眼。Microspherophakia為小而球形晶狀體，可有高度近視與瞳孔阻滯，與Weill–Marchesani相關。晶狀體coloboma常是懸韌帶缺失造成輪廓凹陷，不是晶狀體真的被咬掉一塊。"], "recall": "Alport、Weill–Marchesani各配對哪一種晶狀體形態？", "ref": "10–12", "medicalReview": null}, {"title": "囊膜、懸韌帶與假性剝脫", "points": ["晶狀體囊膜為基底膜，主要含type IV collagen；懸韌帶與睫狀體相連。Pseudoexfoliation為異常纖維性物質沈積，可伴懸韌帶脆弱、散瞳不佳與青光眼；真性exfoliation為囊膜分層，經典與高熱／紅外線暴露相關。"], "recall": "PEX為何會同時影響眼壓與白內障手術風險？", "ref": "13–14", "medicalReview": null}, {"title": "晶狀體異位", "points": ["Marfan常有向上顳側偏位；homocystinuria常偏下鼻側，且需注意全身血栓風險。方向是典型趨勢，不是確診或排除基因病的單一條件。外傷亦可造成zonular dialysis、晶狀體半脫位及視力波動。"], "recall": "晶狀體偏位時，除了方向還要問哪些全身與外傷病史？", "ref": "15–16", "medicalReview": null}, {"title": "調節的力學", "points": ["睫狀肌收縮使懸韌帶張力下降，晶狀體較圓、屈光力增加；放鬆則相反。老化主要使調節能力下降；晶狀體不會因睫狀肌放鬆而完全沒有屈光力。晶狀體蛋白如α-crystallin亦參與維持透明與蛋白穩定。"], "recall": "把看近的完整力學鏈講清楚，不可只說「肌肉用力」。", "ref": "22", "medicalReview": null}, {"title": "代謝與糖尿病", "points": ["晶狀體主要依賴無氧糖解提供能量，抗氧化系統如glutathione保護透明。高葡萄糖經aldose reductase生成sorbitol，滲透性負荷可能促進混濁與屈光變化。血糖波動時度數可能變，不宜把單次新度數直接當永久處方。"], "recall": "Sorbitol如何造成滲透效應？糖尿病患者度數為何會波動？", "ref": "23–24", "medicalReview": null}, {"title": "三種常見白內障", "points": ["核性白內障可有核硬化、黃褐化與近視位移；皮質性有放射狀spokes及眩光；後囊下型在後方中央，近用與亮光下可能特別困擾，與類固醇等因素相關。混合型常見，症狀需與裂隙燈位置及其他眼病對照。"], "recall": "近視突然加深、夜間眩光、類固醇暴露各提示哪種型態？", "ref": "25–27", "medicalReview": null}, {"title": "白內障手術何時考慮", "points": ["重點是視覺功能、日常需求、其他眼病與預期效益，不只用一個固定VA門檻。需評估角膜、眼底、眼壓、瞳孔與懸韌帶，並做生物測量選擇IOL。術前共病會影響術後視力上限與鏡片選擇。"], "recall": "為何白內障看起來很白，不代表所有視力下降都由它造成？", "ref": "25–31", "medicalReview": null}, {"title": "ICCE、ECCE與phaco", "points": ["ICCE連囊膜一併取出；ECCE保留後囊；現代phaco以超音波乳化吸除晶狀體核，常保留囊袋放IOL。常見順序包含切口、capsulorhexis、水分離、乳化／吸除、IOL與傷口處理；實際手術因風險而調整。"], "recall": "哪種手術保留囊袋？超音波乳化是否就是雷射切削？", "ref": "28–30", "medicalReview": null}, {"title": "IOL選擇", "points": ["Monofocal可選定遠或近的目標，不等於只能看遠。Toric矯正規則角膜散光；多焦點／延伸焦深需考慮眩光、對比及角膜、黃斑／視神經共病。IOL計算不是簡單度數相減，眼軸與角膜測量的可靠度非常重要。"], "recall": "Toric與多焦點IOL各主要解決什麼問題？", "ref": "31", "medicalReview": null}, {"title": "PSC、PCO與術後紅旗", "points": ["PSC是原生晶狀體後囊下混濁；PCO為白內障術後殘留晶狀體上皮細胞相關的後囊混濁，常以Nd:YAG處理。術後新發疼痛、紅眼與視力下降，需及時排除眼內炎、高眼壓等急症，不能先當成「又長白內障」。"], "recall": "術後數月漸糊與術後數日痛紅且降視力，處置差在哪？", "ref": "25–31；No.02：3–6；No.10：54", "medicalReview": null}], "notes": "分清PSC與PCO；Mittendorf dot在後囊、Bergmeister papilla在視乳頭。IOL選擇與手術時機不可僅由單一視力數字或廣告式優缺點決定。", "refs": [], "chapter": 6, "source": "眼科學No.06.pdf", "compare": [["核性 vs 皮質性 vs PSC", "近視位移 vs spokes／眩光 vs 後方中央混濁", "症狀有重疊，不只憑一個症狀分型"], ["PSC vs PCO", "原生晶狀體病變 vs 術後後囊問題", "PCO常用YAG，並非再次摘晶狀體"], ["Marfan vs homocystinuria", "典型上顳偏 vs 典型下鼻偏", "後者血栓風險重要；偏位方向非絕對"], ["真剝脫 vs 假性剝脫", "囊膜分層 vs 纖維性物質沈積", "PEX增加zonule與眼壓風險"], ["Toric vs multifocal", "散光矯正 vs 多距離焦點", "不能當作同一光學設計"]], "cases": [{"prompt": "70歲患者說最近摘眼鏡反而看近較清楚，近視逐漸增加。請解釋可能病因與評估。", "answer": "核性白內障造成myopic shift是可能原因，不應直接稱老花消失。做矯正視力與裂隙燈分型，檢查黃斑／視神經等共病、血糖或其他屈光變動因素；是否手術按功能需求與預期效益共同決策。", "ref": "22–31"}, {"prompt": "你在白內障術前看到PEX與晶狀體晃動。需要向手術團隊提醒哪些風險？", "answer": "PEX提示懸韌帶不穩、小瞳孔及伴隨青光眼風險；補充散瞳、IOP／視神經與zonular instability評估。告知需調整囊袋支撐及手術策略，而非把它當單純外觀沈積；IOL選擇與定位穩定性亦要考慮。", "ref": "13–16、28–31"}], "images": [{"ref": "15–16", "prompt": "從晶狀體異位圖指出邊緣、偏位與無晶狀體區，再提出兩種非僅憑方向的鑑別線索。", "answer": "描述偏位／zonule，再問Marfan體徵、homocystinuria及血栓史、外傷等；方向只能支持而不能確診。"}, {"ref": "25–27", "prompt": "比較核性、皮質性與後囊下型圖片，逐一指出混濁所在層次及可能主訴。", "answer": "核性偏核硬化與近視位移，皮質spokes眩光，PSC後方中央、亮光／近距困擾；症狀可能重疊。"}], "correction": "分清PSC與PCO；Mittendorf dot在後囊、Bergmeister papilla在視乳頭。IOL選擇與手術時機不可僅由單一視力數字或廣告式優缺點決定。", "ext": [], "sourceUrl": "", "sourcePages": 36, "canonicalSource": "眼科學No.06.pdf"}, {"id": "notes-07", "title": "青光眼", "summary": "以結構、功能、隅角與眼壓建立診斷；先判機轉，再選降眼壓方式。", "sections": [{"title": "定義不是「眼壓高」", "points": ["青光眼是視網膜神經節細胞／視神經纖維的特徵性進行性病變；眼壓是重要可修改因子，卻非診斷必要條件。Ocular hypertension是眼壓升高但尚無相應神經損害；normal-tension glaucoma則在常見壓力範圍仍有典型損害。"], "recall": "正常眼壓、眼高壓與青光眼三者如何區別？", "ref": "5–8、19–20", "medicalReview": null}, {"title": "視乳頭與RNFL", "points": ["觀察rim變薄、notching、RNFL局部缺損與disc hemorrhage；C/D要放在視乳頭大小與左右差的背景，不能只以0.6或0.7定罪。OCT須核對掃描品質、分割與高度近視的正常資料庫限制。結構與功能應有合理位置對應。"], "recall": "大C/D與青光眼有何不同？為何近視眼的紅色OCT不一定是真病變？", "ref": "5–10", "medicalReview": null}, {"title": "視野圖的方向", "points": ["常見鼻側階梯、弓形與旁中央缺損，與RNFL走向相關，常尊重水平中線。上方視野對應下方視網膜／神經纖維，反之亦然。視野先看可靠度與重複性，假陽性過高可讓結果失真，不能只記MD一個數字。"], "recall": "下方rim缺損會較對應上方還是下方視野異常？", "ref": "11–14", "medicalReview": null}, {"title": "房水路徑", "points": ["非色素睫狀上皮產生房水，流入後房、經瞳孔至前房。主要經小樑網與Schlemm管進入靜脈，另有葡萄膜鞏膜流出。後房不是玻璃體腔；瞭解路徑才能解釋瞳孔阻滯、藥物與手術。"], "recall": "從產生到流出完整畫一遍，再指出LPI繞過哪個阻力？", "ref": "15–18", "medicalReview": null}, {"title": "風險、眼壓及目標值", "points": ["考慮基線眼壓、薄角膜、家族史、年齡、出血與病變進展。Target IOP依初始損害、進展速度、壽命與耐受度訂定，需重新評估，不是「所有人低於21就好」。不套通用角膜厚度校正式，也不要單靠一次壓力代表全天狀態。"], "recall": "已到目標眼壓但仍持續惡化，下一步應重新評估什麼？", "ref": "15–20、32–34", "medicalReview": null}, {"title": "Gonioscopy與隅角分類", "points": ["Gonioscopy直接判隅角是否開放、閉鎖、PAS、色素或新生血管。由前向後辨Schwalbe line、小樑網、scleral spur、ciliary body band。周邊前房深度是篩檢線索，不能完全取代隅角鏡；壓陷檢查可協助分接觸性與黏連性閉鎖。"], "recall": "Van Herick看起來淺，為何仍要適當gonioscopy判斷？", "ref": "29–31", "medicalReview": null}, {"title": "POAG、NTG與SLT", "points": ["POAG／NTG須整合排除其他視神經病變，尤其蒼白不成比例、垂直視野或快速惡化。治療可用藥物、雷射或手術，依嚴重度與患者條件。SLT可作選定非進展晚期開角型患者的初始選項，不限「兩種藥都失敗才可用」；NICE建議有其適用族群。"], "recall": "何時需要重新考慮「這不是典型青光眼」？SLT一定只能第二線嗎？", "ref": "32–34、44；補充E06", "medicalReview": null}, {"title": "急性瞳孔阻滯型閉鎖", "points": ["急痛、紅眼、虹視、噁心、角膜水腫、淺前房及中度散瞳僵硬需立即評估。先依全身條件降眼壓並處理發炎，再用LPI解除適當的瞳孔阻滯機轉，另一眼也需評估。極高壓時虹膜缺血可能使miotic效果差；非瞳孔阻滯病例不能照套同一流程。"], "recall": "為何先問用藥、前房機轉與全身腎心肺病，而不只背滴藥順序？", "ref": "35–36", "medicalReview": null}, {"title": "次發性青光眼", "points": ["新生血管可由PDR、缺血性CRVO等引起，需同時處理視網膜缺血與眼壓。類固醇反應多為流出阻力增加；葡萄膜炎、外傷與PEX也有不同機轉。Topiramate可造成睫狀脈絡膜滲出、雙眼近視位移與非瞳孔阻滯閉鎖，LPI不能解除其主因。"], "recall": "同樣高眼壓，PDR、類固醇與topiramate病人的治療目標如何不同？", "ref": "37；No.13：46–53", "medicalReview": null}, {"title": "先天性青光眼", "points": ["嬰幼兒流淚、畏光、眼瞼痙攣，合併角膜變大、水腫或Haab striae需警覺。Haab striae為Descemet破裂，不是基質鐵線。眼球可因早期高壓擴大成buphthalmos；角膜與視神經評估、及時專科處置不可延誤。"], "recall": "幼兒一直流淚，哪三個線索讓你不能只診斷鼻淚管阻塞？", "ref": "38–40", "medicalReview": null}, {"title": "藥物依產生／流出分類", "points": ["Prostaglandin類增加葡萄膜鞏膜流出；β-blocker與CAI降低房水生成；α2 agonist兼有作用；ROCK inhibitor偏改善小樑流出。Pilocarpine收縮睫狀肌等作用可增加小樑流出，但不適用所有閉鎖機轉。β-blocker須注意氣喘、心搏過緩與傳導阻滯。"], "recall": "把四類主要藥物依作用位置分類，再說兩個全身禁忌風險。", "ref": "41–43", "medicalReview": null}, {"title": "手術建立哪條路", "points": ["Trabeculectomy建立至結膜下濾過泡的路徑；tube shunt導至引流盤周圍。部分MIGS作用於小樑／Schlemm系統，適應症及能達到的壓力有局限；不是所有晚期病人最佳選項。先天性病變常考慮goniotomy／trabeculotomy，與成人濾過術不同。"], "recall": "Trabeculectomy、tube與小樑型MIGS分別把房水導去哪裡？", "ref": "44–45", "medicalReview": null}], "notes": "眼壓正常不能排除青光眼；SLT可作合適開角型患者初始選項。NICE為外部參考，不等於台灣所有患者皆按同一治療路徑。", "refs": [], "chapter": 7, "source": "眼科學No.07.pdf", "compare": [["OHT vs NTG", "高眼壓無損害 vs 常見壓力範圍有損害", "21 mmHg不是診斷分界線"], ["青光眼視野 vs 神經視野", "常依水平RNFL束 vs 可依垂直中線", "異常型態要重新定位"], ["瞳孔阻滯 vs topiramate閉鎖", "虹膜壓差／LPI可解除 vs 睫狀脈絡膜滲出／前移", "後者不能靠LPI處理主因"], ["PGA vs β-blocker vs CAI", "增加流出 vs 減生成 vs 減生成", "β-blocker須注意心肺共病"], ["Trabeculectomy vs MIGS", "結膜下濾泡 vs 視術式作用於不同路徑", "適應症與降壓幅度不同"]], "cases": [{"prompt": "病人眼壓16，OCT紅色且視野有鼻側階梯，問你是否青光眼。請避免只看顏色回答。", "answer": "檢查OCT信號／分割、視乳頭大小與rim／RNFL；看視野可靠度、重複性與上下位置配對，考量近視及非青光眼病因。若典型損害一致，正常眼壓仍可有青光眼；需要追蹤與依進展訂個別目標。", "ref": "5–20、32–34"}, {"prompt": "急性高眼壓病人，第一位是單眼中度散瞳淺前房，第二位是新用topiramate後雙眼近視位移。請比較治療機轉。", "answer": "兩者都需緊急眼科與全身條件評估。第一位若為瞳孔阻滯，降壓與適當LPI解除壓差；第二位要想到睫狀脈絡膜滲出、前移，處理誘因並由專科選用治療，LPI不能解除主因，pilocarpine可能不合適。", "ref": "35–36；No.13：49–51；E03"}], "images": [{"ref": "9–14", "prompt": "配對RNFL／視乳頭缺損與視野圖，說出上下翻轉關係，再找一個可靠度問題。", "answer": "下方結構缺損對應上方功能；先排低信號、分割、假陽性等。紅色區本身不是確診。"}, {"ref": "29–31", "prompt": "在隅角圖上由前至後指出四個主要地標，說明閉鎖時哪些結構可能看不到。", "answer": "Schwalbe line→小樑網→鞏膜突→睫狀體帶；不能只看角膜中央深度就宣稱隅角開放。"}], "correction": "眼壓正常不能排除青光眼；SLT可作合適開角型患者初始選項。NICE為外部參考，不等於台灣所有患者皆按同一治療路徑。", "ext": ["E03", "E06"], "sourceUrl": "", "sourcePages": 57, "canonicalSource": "眼科學No.07.pdf"}, {"id": "notes-08", "title": "眼眶與淚器", "summary": "用解剖決定影像與危險性；流淚先分分泌過多、眼瞼泵失常與排出阻塞。", "sections": [{"title": "眼眶骨壁與重要通道", "points": ["內側壁lamina papyracea薄、鄰近篩竇；底部與上頷竇及infraorbital nerve相關。Optic canal通過CN II與ophthalmic artery；superior orbital fissure包含III、IV、V1、VI等。Orbital apex syndrome有視神經受累，可與單純SOF syndrome區分。"], "recall": "眼眶尖症候群為何比單純眼外肌麻痺多一項重要紅旗？", "ref": "3–7", "medicalReview": null}, {"title": "Blowout骨折", "points": ["眼眶底／內壁骨折可造成複視、陷眼、V2區麻木與肌肉夾困。薄層CT常用於骨折與異物評估；可能金屬異物時不可隨意MRI。避免擤鼻造成氣體進入眼眶；兒童trapdoor即使外觀輕微仍可需緊急處理。"], "recall": "外傷後複視、頰部麻與向上看受限如何連到解剖？", "ref": "8–10", "medicalReview": null}, {"title": "以6P描述眼眶病", "points": ["Pain、progression、proptosis、palpation、pulsation、periorbital change協助組織病史。軸性突眼常提示肌錐內／球後來源，非軸性位移提示偏一側腫塊；方向只提供定位，不能取代影像。快速進展、疼痛、視力／色覺下降及RAPD是危險線索。"], "recall": "突眼要描述哪些面向？為什麼單說「眼睛凸」不夠？", "ref": "11–20", "medicalReview": null}, {"title": "Preseptal與orbital cellulitis", "points": ["Preseptal在眶隔前，通常無突眼、痛性EOM、視力下降；orbital disease可有這些深部徵象，常與鼻竇相關。發燒加眼眶紅旗需緊急影像、抗感染與跨科處理。無發燒不完全排除深部病變；先排開放性傷再選檢查。"], "recall": "紅腫眼皮時，哪四項檢查能讓你擔心眶內感染？", "ref": "11–20", "medicalReview": null}, {"title": "頸動脈海綿竇瘻", "points": ["CCF可見結膜螺旋狀血管、搏動性突眼、雜音、眼壓上升及眼外肌麻痺，外傷史是線索。血液高壓逆流可使上眼靜脈擴張；不是普通結膜炎。診斷與治療需神經血管團隊，不能只靠點藥退紅。"], "recall": "Corkscrew vessels加bruit，與一般感染性紅眼差在哪？", "ref": "19–20", "medicalReview": null}, {"title": "甲狀腺眼病", "points": ["TED可有眼瞼後縮、突眼、暴露及限制性複視；影像常眼外肌肌腹增大、肌腱相對保留，但非絕對。下直與內直常受影響，眶尖擁擠可壓迫視神經。視力／色覺下降與RAPD需警覺DON，即使突眼不很明顯也不能排除。"], "recall": "TED視神經壓迫與單純外觀突眼，緊急程度如何不同？", "ref": "21–22、35", "medicalReview": null}, {"title": "發炎與TED手術順序", "points": ["Idiopathic orbital inflammation常疼痛、急性，可包含肌腱，診斷前須排感染與腫瘤。穩定期TED復健常先眶減壓、再斜視、再眼瞼手術，因前一步會影響後一步；威脅視力的壓迫或角膜暴露不能等到所有發炎穩定才處理。"], "recall": "為何TED常先decompression而不是先做眼瞼美容？", "ref": "35–37", "medicalReview": null}, {"title": "常見眼眶腫瘤線索", "points": ["Dermoid常兒童慢性上顳側腫塊；rhabdomyosarcoma可兒童快速突眼；neuroblastoma轉移可有雙眼瘀青樣外觀。成人cavernous venous malformation常緩慢無痛軸性突眼；lymphoma可salmon-patch。速度與年齡只是鑑別線索，不是影像／病理替代品。"], "recall": "兒童快速突眼與多年慢性上顳腫塊，鑑別優先序為何不同？", "ref": "38–40", "medicalReview": null}, {"title": "三種移除術式", "points": ["Evisceration移除眼內容而保留鞏膜殼；enucleation移除整個眼球；exenteration移除眼眶內容，範圍依疾病調整。懷疑眼內惡性腫瘤時不能以一般evisceration概念處理，需腫瘤專科策略。"], "recall": "用「保留什麼」而非中文名字區分三種術式。", "ref": "41–42", "medicalReview": null}, {"title": "淚液流向與淚泵", "points": ["淚點→淚小管→淚囊→鼻淚管→下鼻道，遠端Hasner valve是先天阻塞常見位置。流淚可能反射性分泌、瞼緣／淚點外翻或淚泵失常，也可能排出阻塞。主淚腺與副淚腺的神經調控不宜簡化成「副淚腺只有交感」。"], "recall": "眼睛流淚是否就等於鼻淚管阻塞？請提出三條機轉。", "ref": "43–48", "medicalReview": null}, {"title": "先天阻塞與DCR", "points": ["嬰兒鼻淚管阻塞常溢淚與分泌物，需排除角膜病及先天青光眼。處理包含適當衛教／按摩與依持續程度評估探通，不是所有嬰兒立即手術。DCR建立淚囊到鼻腔的旁路；不是增加淚液，也不是所有眼乾的治療。"], "recall": "DCR繞過哪段？嬰兒流淚何時不能當單純Hasner阻塞？", "ref": "49–51", "medicalReview": null}, {"title": "感染、結石與淚囊腫瘤", "points": ["Canaliculitis可pouting punctum與concretions，Actinomyces是經典病原。Dacryocystitis為內眥下方淚囊區痛紅腫，急性期需適當全身抗感染與眼科，避免急性發炎時常規探通。硬塊、血淚、尤其腫塊向內眥韌帶上方延伸需考慮腫瘤。"], "recall": "淚小管炎、淚囊炎與淚囊腫瘤各有哪個辨識線索？", "ref": "52–54", "medicalReview": null}], "notes": "TED肌腱保留、腫瘤生長速度與突眼方向均為典型線索而非絕對診斷。眶內急症與有無發燒不可一對一等同。", "refs": [], "chapter": 8, "source": "眼科學No.08.pdf", "compare": [["Preseptal vs orbital", "眶隔前 vs 眶隔後", "痛性EOM、突眼、RAPD／降視力提示深部"], ["TED vs orbital inflammation", "典型肌腹大、慢性系統背景 vs 常痛急且可含肌腱", "影像型態是線索，不是絕對規則"], ["CCF vs 結膜炎", "螺旋血管、bruit、搏動性突眼 vs 眼表發炎", "不要只因「紅」就開抗生素點眼"], ["Evisceration vs enucleation vs exenteration", "留鞏膜 vs 去眼球 vs 去眶內容", "懷疑腫瘤須專科決策"], ["Canaliculitis vs dacryocystitis", "淚點／小管、結石 vs 淚囊內眥下痛腫", "解剖位置決定診斷與處置"]], "cases": [{"prompt": "發燒患者眼瞼紅腫。請在90秒內區分preseptal與orbital cellulitis並說明危險項。", "answer": "先測視力與瞳孔／RAPD、看突眼及EOM疼痛／限制；詢問鼻竇、外傷、牙源或免疫背景。痛性EOM、突眼、視力／色覺下降、RAPD或其他深部症狀需警覺orbital cellulitis，緊急影像、全身抗感染與眼科／相關科合作，不只開點眼藥。", "ref": "11–20；E04"}, {"prompt": "長期流淚病人想直接做DCR。請建立診斷前的機轉清單。", "answer": "檢查眼表刺激／乾眼的反射性流淚、眼瞼及淚點位置、眨眼淚泵，再評估淚小管／淚囊／鼻淚管阻塞。DCR只解決適當的排出路徑問題；有急性淚囊炎先控制感染，不把急性期常規探通當第一步；血淚／硬塊須排腫瘤。", "ref": "43–54"}], "images": [{"ref": "8–10", "prompt": "看眼眶骨折影像，指出骨壁、鼻竇相鄰性與可能被夾困的組織；不要只認「黑洞」。", "answer": "依眶底／內側壁定位，再用複視、V2麻與眼外肌受限對照；影像形態與臨床夾困都重要。"}, {"ref": "21–22", "prompt": "看TED眼外肌圖，描述肌腹、肌腱與眶尖；再說一項即使外觀不明顯也需緊急檢查的視功能。", "answer": "典型肌腹大、肌腱相對保留；色覺、VA、RAPD可提示DON，不能只量突眼程度。"}], "correction": "TED肌腱保留、腫瘤生長速度與突眼方向均為典型線索而非絕對診斷。眶內急症與有無發燒不可一對一等同。", "ext": ["E04"], "sourceUrl": "", "sourcePages": 64, "canonicalSource": "眼科學No.08.pdf"}, {"id": "notes-09", "title": "葡萄膜與葡萄膜炎", "summary": "先按主要發炎位置分類，再用時間、側別、感染與全身線索縮小病因。", "sections": [{"title": "葡萄膜解剖", "points": ["Uvea由iris、ciliary body、choroid構成；睫狀體兼具調節、房水生成與屏障功能，脈絡膜主要支持外層視網膜。虹膜括約肌與擴瞳肌具特殊胚胎來源，不能把所有眼內肌肉都背成中胚層。Coloboma、異色虹膜與腫瘤需依位置描述。"], "recall": "葡萄膜三部分各有哪個功能？脈絡膜主要供養內層還是外層視網膜？", "ref": "4–12", "medicalReview": null}, {"title": "按「主要部位」分類", "points": ["Anterior主要在前房，intermediate主要在玻璃體，posterior主要在視網膜／脈絡膜；panuveitis為多區受累且無單一主要部位。不能把中間型只定義為睫狀體炎，或後型只限脈絡膜。分類描述解剖，不直接等於病因。"], "recall": "Vitreous為最主要發炎位置應歸哪類？", "ref": "13–15", "medicalReview": null}, {"title": "Cells、flare、KP與hypopyon", "points": ["前房cells為細胞，flare為蛋白散射；KP是角膜內皮表面的發炎沈積。Mutton-fat KP等可提供肉芽腫型線索，但不能單獨診斷TB或sarcoid。Hypopyon為前房下方細胞沈積，可見感染或非感染性強烈發炎。"], "recall": "看到hypopyon能否直接判斷為細菌感染？還需哪些證據？", "ref": "16–17", "medicalReview": null}, {"title": "黏連、虹膜膨隆與眼壓", "points": ["Posterior synechiae是虹膜與晶狀體黏連；PAS為虹膜與隅角結構的前黏連。瞳孔緣廣泛後黏連可阻滯房水、iris bombe並關閉隅角。發炎亦可使小樑阻力增加或睫狀體功能低下，故IOP可高也可低。"], "recall": "為何葡萄膜炎可能眼壓高，也可能低？", "ref": "16–17、21–23", "medicalReview": null}, {"title": "中間與後段表徵", "points": ["Vitritis、snowballs與下方pars plana的snowbank是中間型線索；snowbank不是單純把漂浮細胞團加總的名字。後段需看retinitis、choroiditis、vasculitis與漿液性剝離，配合OCT／攝影。只看前房安靜不能排除後段重病。"], "recall": "Snowballs與snowbank在位置與形態上如何不同？", "ref": "18–20", "medicalReview": null}, {"title": "併發症與視力低下", "points": ["CME、白內障、眼壓異常、黃斑／視神經損害及視網膜剝離均可降視力。慢性炎症控制與併發症處理需並行；不能把所有模糊都歸於前房cells，也不能只看眼睛退紅便宣佈治癒。"], "recall": "前房已安靜但視力仍差，你至少會找哪三項後續問題？", "ref": "21–23", "medicalReview": null}, {"title": "病因分類與有目的的檢驗", "points": ["記錄急／慢、反覆、單／雙側、肉芽腫線索及解剖型態；再問感染暴露、免疫抑制、皮膚黏膜、關節／背痛與用藥。檢驗應由表型與盛行背景引導，不是每位病人整套HLA與感染檢驗全開。HLA陽性是背景線索，不等於診斷。"], "recall": "你如何說明「有方向的檢驗」而不是shotgun work-up？", "ref": "30–31", "medicalReview": null}, {"title": "感染性後段發炎", "points": ["Toxoplasma常局灶視網膜炎鄰近舊疤、玻璃體混濁；HSV／VZV可造成ARN與閉塞性血管炎，免疫正常也可發生。CMV retinitis常免疫抑制，出血性壞死且玻璃體發炎可較少。TB與syphilis是需依情境考慮的模仿者；不能感染未評估就給免疫抑制單方。"], "recall": "Toxo、ARN、CMV的宿主與眼底線索如何比較？", "ref": "32–34", "medicalReview": null}, {"title": "HLA-B27與Behçet", "points": ["HLA-B27相關常急性、復發、單眼或交替前葡萄膜炎，背痛／脊椎關節病是線索。Behçet可口腔／生殖器潰瘍、皮膚病與閉塞性視網膜血管炎，hypopyon可出現但非必備；HLA-B51不能單獨確診。"], "recall": "單眼反覆前炎與雙眼閉塞性血管炎，系統性問診重點如何不同？", "ref": "35、38", "medicalReview": null}, {"title": "VKH與交感性眼炎", "points": ["VKH可雙眼脈絡膜炎與漿液性視網膜剝離，伴耳鳴、腦膜症狀及後期白髮／白斑等。Sympathetic ophthalmia為眼部穿通傷／手術後的雙眼肉芽腫型發炎。兩者可相似，外傷史與時序重要；不宜只靠皮膚顏色或一張OCT命名。"], "recall": "雙眼漿液性剝離時，哪些病史能幫助區分VKH與交感性眼炎？", "ref": "36–37", "medicalReview": null}, {"title": "內生性眼內炎", "points": ["糖尿病、菌血症、肝膿瘍等背景合併急性眼痛或視力下降需警覺內生性眼內炎；Klebsiella是台灣臨床重要線索之一。需同時處理全身感染源與眼內感染，眼內採檢／給藥及手術由專科決定；不是全身抗生素用了就可等眼症狀自行改善。"], "recall": "肝膿瘍病人說單眼突然模糊，你應做什麼而不是只追CRP？", "ref": "39", "medicalReview": null}, {"title": "治療依感染與位置分層", "points": ["感染性需要病原導向治療；非感染性依位置與嚴重度選局部或全身抗發炎，必要時免疫調節。前葡萄膜炎可用cycloplegia減少睫狀肌痛與後黏連風險；類固醇需監測眼壓、白內障及感染。不要把某個生物製劑背成所有uveitis最佳第一線。"], "recall": "Cycloplegic除了散瞳，為何對前葡萄膜炎有幫助？", "ref": "40–42", "medicalReview": null}], "notes": "中間型以玻璃體為主要位置，後型可涉及視網膜／脈絡膜；HLA與KP形態不是單獨病因診斷。感染未排除時，不把免疫抑制當通用答案。", "refs": [], "chapter": 9, "source": "眼科學No.09.pdf", "compare": [["Anterior vs intermediate vs posterior", "前房 vs 玻璃體 vs 視網膜／脈絡膜為主", "按主要位置，不按唯一器官"], ["KP vs hypopyon", "角膜內皮沈積 vs 前房底部沈積", "都不等於已知道病原"], ["Posterior synechiae vs PAS", "虹膜－晶狀體 vs 虹膜－隅角", "前者可造成瞳孔阻滯，後者封閉流出區"], ["VKH vs sympathetic ophthalmia", "系統性uveomeningeal線索 vs 穿通傷／手術時序", "都可能雙眼脈絡膜炎與剝離"], ["Toxo vs ARN vs CMV", "舊疤旁炎症 vs 壞死／閉塞血管炎 vs 免疫抑制出血性視網膜炎", "須整合宿主而非單一圖片"]], "cases": [{"prompt": "一位反覆單眼紅痛的年輕人，前房cells、舊後黏連，且晨僵背痛。如何進行有方向的問診與檢查？", "answer": "先定位前葡萄膜炎，記急慢、復發、交替側別與肉芽腫特徵；問炎症性背痛、關節／皮膚／腸道及感染風險，考慮HLA-B27相關疾病並做表型導向檢查。評估IOP、synechiae、黃斑CME；不要以HLA陽性直接取代診斷。", "ref": "16–23、30–35"}, {"prompt": "肝膿瘍病人單眼痛與視力下降，你正在值班，如何回報？", "answer": "報告全身感染背景、新發側別與起始時間、視力、瞳孔與前節／玻璃體可見發炎；明確提出疑內生性眼內炎，立即聯絡眼科。同步處理全身感染源與血培養資訊；全身抗生素不能取代眼內採檢／治療需求的專科評估。", "ref": "39–42"}], "images": [{"ref": "16–19", "prompt": "在圖中分辨KP、hypopyon、後黏連、snowballs或snowbank，逐項說出解剖位置。", "answer": "KP角膜內皮、hypopyon前房底、後黏連虹膜－晶狀體、snowballs玻璃體、snowbank下方pars plana；形態不直接指定病原。"}, {"ref": "36–38", "prompt": "比較VKH與Behçet相關後段影像，先描述液體／剝離與血管變化，再提出必要全身病史。", "answer": "VKH可漿液性剝離與脈絡膜炎；Behçet重點閉塞性血管炎。需問耳／腦膜、皮膚或黏膜潰瘍，單張圖不能確診。"}], "correction": "中間型以玻璃體為主要位置，後型可涉及視網膜／脈絡膜；HLA與KP形態不是單獨病因診斷。感染未排除時，不把免疫抑制當通用答案。", "ext": [], "sourceUrl": "", "sourcePages": 48, "canonicalSource": "眼科學No.09.pdf"}, {"id": "notes-10", "title": "視網膜與玻璃體", "summary": "先按視網膜層次、血管分布、是否有裂孔與液體位置分類，再連到急症與治療目的。", "sections": [{"title": "層次與雙重血流", "points": ["由玻璃體側到脈絡膜側依序可記內界膜、神經纖維、神經節、內叢狀、內核、外叢狀、外核、外界膜、感光細胞、RPE。內層主要由視網膜循環，外層／感光細胞主要依脈絡膜。光往外到受器，神經訊號再往內，方向不同。"], "recall": "說出內、外視網膜血供，並解釋CRAO為何不等於整個脈絡膜停流。", "ref": "3–5", "medicalReview": null}, {"title": "檢查選擇與限制", "points": ["OCT看結構與液體；FA看視網膜循環／滲漏，ICGA看脈絡膜；OCTA看流動訊號而非直接染劑滲漏，會有分割與投射偽影。ERG偏全視網膜功能，VEP評估視路反應；正常結果不自動證明所有視覺功能正常。介質混濁可B-scan，但疑開放性傷避免眼球加壓。"], "recall": "OCT、OCTA、FA、ERG、VEP各回答哪個問題？", "ref": "6–16", "medicalReview": null}, {"title": "PVD、裂孔與飛蚊", "points": ["PVD可見急性飛蚊、閃光，牽引時可能造成裂孔、出血或剝離。新發症狀需適當散瞳周邊檢查；視野幕簾、明顯降視力或出血更危險。初次未見裂孔不等於之後不會發生，應給依風險的追蹤與返診警訊。"], "recall": "飛蚊何時不能只解釋成自然退化？", "ref": "17–18", "medicalReview": null}, {"title": "糖尿病視網膜病變", "points": ["NPDR可微血管瘤、點狀出血、硬滲出、棉絮斑、靜脈串珠與IRMA；PDR由NVD／NVE等新生血管定義，可玻璃體出血與牽引性剝離。DME可在不同DR階段出現，不等同PDR。Anti-VEGF、PRP、局部雷射或手術各有目標，非所有NPDR一律PRP。"], "recall": "IRMA與NVE、DME與PDR各如何區分？", "ref": "19–25", "medicalReview": null}, {"title": "高血壓與視網膜血管阻塞", "points": ["高血壓可動脈變細、AV nicking、銅／銀線，重症可出血、棉絮斑與乳頭水腫。CRVO常四象限出血、靜脈擴張曲折；BRVO呈區域性。CRAO典型突然無痛嚴重單眼下降、視網膜蒼白／cherry-red spot及RAPD，須急性中風式評估，不能靠按摩延誤。"], "recall": "CRVO、BRVO與CRAO各用分布、外觀與第一步比較。", "ref": "25–27、38–40", "medicalReview": null}, {"title": "三類視網膜剝離", "points": ["Rhegmatogenous有全層裂孔讓液體進入視網膜下；tractional為纖維牽拉；exudative／serous為滲漏無必要裂孔。Macula-on裂孔性剝離須及時視網膜手術評估以保護中央視力。Buckle、vitrectomy、pneumatic適用條件不同，不能所有剝離都只打雷射。"], "recall": "有裂孔、纖維膜、炎症滲出分別指向哪種剝離？", "ref": "34–37", "medicalReview": null}, {"title": "視網膜手術與氣體安全", "points": ["玻璃體切除可解除牽引、處理出血與裂孔；氣體／矽油是不同填塞方式。眼內氣體未完全消退並獲團隊允許前，須避免搭飛機／高海拔變化與N2O麻醉，因氣泡可膨脹而危險；姿勢與活動依手術指示。"], "recall": "為何眼內氣體病人連去別科麻醉也必須主動告知？", "ref": "34–37；補充E09", "medicalReview": null}, {"title": "AMD、PCV與GA", "points": ["Drusen與色素變化有助AMD分期；neovascular AMD以新生血管／液體為核心，可用anti-VEGF。AREDS2是特定風險分期補充，不是所有正常人或所有眼病通用。PCV可需ICGA辨識，治療依病型。舊稿「GA完全無藥」不能作現行絕對結論：美國已有藥物減慢病灶擴大，不等於恢復視力或台灣可得／給付。"], "recall": "乾性／新生血管AMD與GA治療目標有何不同？", "ref": "41–46；補充E10", "medicalReview": null}, {"title": "CSC、病理性近視與黃斑介面", "points": ["CSC常視網膜下液體與RPE滲漏，類固醇是重要風險，不能當一般發炎盲目加藥。Pathologic myopia重視結構性退化，不只近視度數。Macular hole是黃斑全層中斷；ERM為表面膜及皺褶；VMT是殘留黏附造成牽引。"], "recall": "Macular hole、ERM、VMT的OCT結構差別是什麼？", "ref": "47–50", "medicalReview": null}, {"title": "ROP與白瞳", "points": ["ROP階段1線、2脊、3視網膜外增殖、4部分剝離、5全剝離；治療看zone、stage與plus，而非只背「到第三期就治」。Type 1包含zone I任何stage伴plus、zone I stage 3無plus、zone II stage 2／3伴plus。兒童白瞳須及時排retinoblastoma，不能只當白內障。"], "recall": "ROP分期與治療門檻為何不是同一件事？白瞳要先排什麼？", "ref": "51–52；補充E11", "medicalReview": null}, {"title": "遺傳性退化與腫瘤", "points": ["Retinitis pigmentosa常夜盲、周邊視野縮小、血管變細與骨針狀色素；Usher另有聽力受損。Retinoblastoma為兒童惡性眼內腫瘤重要鑑別；成人脈絡膜腫塊需區分melanoma、轉移等。電生理、影像、家族史與專科檢查各有角色。"], "recall": "夜盲、周邊縮小與聽損如何連到遺傳病評估？", "ref": "52–56", "medicalReview": null}, {"title": "其他後段病變的最小框架", "points": ["眼內炎、藥物毒性、白點症候群與血液疾病可模擬常見眼底病。描述側別、病灶位在何層、是否發炎／出血／滲出、全身與用藥時序；不要把照片最像某病當確診。原稿新技術名單屬歷史教材，不當現行器械規格或適應症。"], "recall": "遇到不熟的眼底照片，先說哪些客觀資訊仍能得到分數？", "ref": "54–58", "medicalReview": null}], "notes": "CRAO按急性中風急症評估，不把按摩列為已證實有效標準；ROP治療依zone／stage／plus；GA「完全無藥」為過時絕對說法。", "refs": [], "chapter": 10, "source": "Retina.pdf", "compare": [["NPDR vs PDR", "無新生血管 vs 有NVD／NVE等", "DME可出現在不同階段"], ["CRAO vs CRVO vs BRVO", "蒼白急性動脈缺血 vs 四象限出血 vs 區域出血", "CRAO須急性中風評估"], ["裂孔性 vs 牽引性 vs 滲出性剝離", "裂孔入液 vs 纖維牽拉 vs 滲漏", "是否存在裂孔改變治療"], ["OCT vs OCTA vs FA", "結構 vs 流動訊號 vs 染劑循環／滲漏", "OCTA不是直接看滲漏"], ["Macular hole vs ERM vs VMT", "全層洞 vs 表面膜皺褶 vs 玻璃體牽拉", "都可變形視，不可只憑主訴"]], "cases": [{"prompt": "突發單眼無痛視力大幅下降，RAPD，眼底蒼白與cherry-red spot。請用一句結論及下一步回報。", "answer": "疑急性CRAO，屬視網膜缺血／中風急症，立刻啟動急診中風與眼科評估，確認最後正常時間、血管危險與GCA線索。不要讓眼球按摩或門診重複檢查拖延；是否符合急性再灌流治療由當地中風專家依條件決定。", "ref": "38–40；E07"}, {"prompt": "病人明天要搭機，但上週視網膜手術填入氣體。如何說明？", "answer": "眼內氣體尚存時可能因氣壓變化膨脹，不能未經手術團隊確認就搭機；需即聯絡確認氣體種類、殘留與限制。也要主動告知任何麻醉團隊避免N2O，遵守術後姿勢與返診警訊。不以術後固定幾天一概保證安全。", "ref": "34–37；E09"}], "images": [{"ref": "38–40", "prompt": "比較動脈與靜脈阻塞眼底圖，先說蒼白／出血、分布、血管與黃斑，再配急迫性。", "answer": "CRAO蒼白、cherry-red及突發重度下降；CRVO四象限出血，BRVO區域性。不要把所有出血都叫DR。"}, {"ref": "49–50", "prompt": "看黃斑OCT區分全層洞、表面膜與玻璃體牽引，指出缺損或牽引起點。", "answer": "Hole為全層中斷；ERM在內表面牽皺；VMT為玻璃體仍附著拉扯，可共存，不能只憑變形視分型。"}], "correction": "CRAO按急性中風急症評估，不把按摩列為已證實有效標準；ROP治療依zone／stage／plus；GA「完全無藥」為過時絕對說法。", "ext": ["E07", "E09", "E10", "E11"], "sourceUrl": "", "sourcePages": 70, "canonicalSource": "Retina.pdf"}, {"id": "notes-11", "title": "眼瞼疾病與眼整形", "summary": "用眼瞼層次、開閉眼神經與動態測量區分功能問題；美容內容只掌握原理與風險。", "sections": [{"title": "前後層與腺體", "points": ["Anterior lamella為皮膚與眼輪匝肌，posterior lamella為瞼板與結膜；重建需兼顧兩層與血供。Meibomian glands位於瞼板，Zeis／Moll與睫毛相關。Gray line是瞼緣外科地標，不應與睫毛根、淚點任意互換。"], "recall": "眼瞼前後層各有哪些組織？瞼板腺位在哪層？", "ref": "3–6", "medicalReview": null}, {"title": "睜眼、閉眼與感覺", "points": ["Levator由III支配，是主要提瞼肌；Müller由交感支配；orbicularis由VII支配以閉眼；感覺主要來自V。神經異常可影響不同功能：III麻痺下垂、Horner輕度下垂、VII麻痺閉合不全。"], "recall": "III、VII、交感與V分別控制什麼？", "ref": "3–6", "medicalReview": null}, {"title": "先天型態與假性問題", "points": ["Epiblepharon為皮膚肌肉摺痕把睫毛推向角膜，瞼緣本身可正常；entropion則瞼緣真的內轉。BPES等需看眼裂長、下垂與內眥變化，不能將所有內眥寬都叫斜視。兒童最重要是視軸、屈光與角膜接觸影響。"], "recall": "Epiblepharon與真正entropion怎麼分？", "ref": "7–8", "medicalReview": null}, {"title": "霰粒腫與麥粒腫", "points": ["Chalazion為瞼板腺阻塞後的慢性脂質肉芽腫性反應，常較不痛；hordeolum為急性感染，外型與Zeis／Moll、內型與Meibomian相關。反覆同位、睫毛脫落、邊緣破壞或老年異常「霰粒腫」需警覺sebaceous carcinoma。"], "recall": "Chalazion為何不能直接等同細菌性毛囊炎？", "ref": "9–10", "medicalReview": null}, {"title": "眼瞼外傷與重建", "points": ["先確認眼球完整與視力，看到脂肪可能眶隔受破壞；靠內眥傷口要查淚小管，瞼緣傷需精確對位。重建同時維持前後層與支撐，至少一層需有血供，不應簡化成兩片無血供自由移植物堆上。"], "recall": "內眥裂傷與瞼緣裂傷，各最怕漏修什麼？", "ref": "11–16", "medicalReview": null}, {"title": "內翻、外翻與睫毛異常", "points": ["Entropion瞼緣內轉磨角膜；ectropion向外、可淚點不貼眼球與暴露。Trichiasis為原本睫毛列方向錯，distichiasis是額外一列睫毛。需問瘢痕、發炎、手術與神經麻痺，不是所有倒睫只拔掉就長期解決。"], "recall": "Trichiasis、distichiasis、entropion的異常位置在哪？", "ref": "17–22", "medicalReview": null}, {"title": "量測下垂", "points": ["MRD1為角膜光反射到上瞼緣距離；levator function為固定額肌後測由下看至上看的瞼緣移動幅度。需同時看眉位、額肌代償、眼瞼皺摺、Bell現象與角膜保護。只看自拍照片無法充分規劃功能手術。"], "recall": "為何測levator function時一定要控制額肌代償？", "ref": "29–30", "medicalReview": null}, {"title": "下垂的危險鑑別", "points": ["III麻痺可重度下垂與眼球外下偏，Horner輕度下垂加縮瞳；myasthenia常疲勞變動、複視但瞳孔一般不受影響。Aponeurotic ptosis常提肌功能尚好、皺摺較高；先天肌源性可能提肌功能差。急性神經型先排危險病因，不先安排美容。"], "recall": "下垂合併散瞳、縮瞳或疲勞性變動，各走哪條鑑別？", "ref": "31–36；補充E01、E02", "medicalReview": null}, {"title": "手術依功能選擇", "points": ["提肌功能、phenylephrine反應、下垂程度與眼表保護決定術式。部分病例可levator advancement／resection，合適者MMCR，提肌很差者可frontalis suspension。術式不是單按MRD1選擇，過度矯正會有暴露風險。"], "recall": "同樣MRD1低，提肌功能好與差的規劃為何不同？", "ref": "37–42", "medicalReview": null}, {"title": "後縮、痙攣與半面痙攣", "points": ["TED常後縮而非單純下垂，眼表暴露與眶內壓迫需分開評估；復健順序通常先眶、再斜視、再瞼。Essential blepharospasm常雙側眼輪匝肌不自主收縮；hemifacial spasm偏單側並可累及下半臉。Botulinum toxin可作選定症狀治療，需病因評估。"], "recall": "雙側閉眼痙攣與單側連嘴角抽動如何區分？", "ref": "43–47", "medicalReview": null}, {"title": "惡性腫瘤線索", "points": ["BCC常珍珠邊、潰瘍與毛細血管擴張，局部侵襲重要；SCC轉移風險較值得警覺；sebaceous carcinoma可偽裝霰粒腫／慢性單側結膜炎。睫毛脫落、瞼緣破壞、反覆出血與進展性病灶需病理評估，不能只憑皮膚顏色排除惡性。"], "recall": "反覆「霰粒腫」什麼時候要想到sebaceous carcinoma？", "ref": "48–50", "medicalReview": null}, {"title": "美容原理與安全界線", "points": ["老化牽涉皮膚、脂肪、骨與支持結構；動態紋與靜態凹陷機轉不同。Botulinum toxin抑制神經肌肉接點乙醯膽鹼釋放，filler改變容積。眼周注射可能有下垂、複視或罕見嚴重血管阻塞失明風險；本冊不提供注射操作指南。"], "recall": "肉毒與填充劑改變的是什麼？為何不能說眼周微整一定安全？", "ref": "51–55", "medicalReview": null}], "notes": "Chalazion不是單純細菌性毛囊炎；手術成功不能只看美容外觀，需保護角膜並先排除急性神經與腫瘤病因。", "refs": [], "chapter": 11, "source": "眼科學No.11.pdf", "compare": [["Chalazion vs hordeolum", "慢性阻塞性脂質肉芽腫 vs 急性感染", "同處反覆且掉睫毛要排腫瘤"], ["Entropion vs epiblepharon", "瞼緣內轉 vs 皮膚摺痕推睫毛", "兩者都可能磨角膜但構造不同"], ["Trichiasis vs distichiasis", "正常列睫毛方向錯 vs 多出額外列", "倒睫不等於全部由內翻造成"], ["Aponeurotic vs myasthenic ptosis", "提肌功能好、皺摺高常見 vs 疲勞變動、瞳孔通常正常", "動態病史比一張照片重要"], ["BCC vs sebaceous carcinoma", "珍珠邊潰瘍 vs 偽裝反覆霰粒腫／單側炎症", "需病理，外觀並非最終診斷"]], "cases": [{"prompt": "65歲病人上瞼下垂要直接排美容手術。請描述術前必問必量，與哪種情況需要先處理其他病因。", "answer": "問起病、日內變動、複視、頭頸痛、手術外傷；量MRD1、固定額肌後的levator function、瞳孔及EOM，評估角膜保護。急發神經徵象先排III麻痺／Horner，疲勞性考慮MG；不可只按照片或MRD1排相同手術。", "ref": "29–42；E01、E02"}, {"prompt": "上眼瞼同處反覆腫塊，多次當霰粒腫處理仍復發，伴掉睫毛。你如何避免診斷錨定？", "answer": "慢性阻塞性霰粒腫與惡性腫瘤可能外觀相似；反覆同位、老年、脫睫／瞼緣破壞需考慮sebaceous carcinoma。完整檢查瞼緣與翻瞼、視情況眼整形／腫瘤專科與病理，不再只重複以一般霰粒腫處理。", "ref": "9–10、48–50"}], "images": [{"ref": "29–30", "prompt": "看MRD1與levator function示意，分別指出起訖點，演示如何控制額肌。", "answer": "MRD1從角膜光反射到上瞼緣；LF為固定眉後由下看到上看的瞼緣行程，兩者不是同一數字。"}, {"ref": "48–50", "prompt": "比較眼瞼腫瘤圖，描述邊緣、潰瘍、血管、睫毛與腫塊位置，提出需要病理的理由。", "answer": "珍珠邊／潰瘍提示BCC，反覆霰粒腫樣與脫睫需考慮sebaceous carcinoma；照片不能取代病理診斷。"}], "correction": "Chalazion不是單純細菌性毛囊炎；手術成功不能只看美容外觀，需保護角膜並先排除急性神經與腫瘤病因。", "ext": ["E01", "E02"], "sourceUrl": "", "sourcePages": 64, "canonicalSource": "眼科學No.11.pdf"}, {"id": "notes-12", "title": "結膜疾病與乾眼", "summary": "用乳頭／濾泡、分泌物、癢與危險徵象分類紅眼；乾眼不是只測一張Schirmer紙。", "sections": [{"title": "結膜與淚液結構", "points": ["結膜分球、瞼與穹窿部，goblet cells分泌黏蛋白；Krause／Wolfring為副淚腺，Meibomian提供脂質。傳統三層淚膜便於考試，實際為表面脂質與漸變mucoaqueous系統，並非三張彼此分離的塑膠片。"], "recall": "Goblet、Meibomian、主／副淚腺各貢獻什麼？", "ref": "5–7", "medicalReview": null}, {"title": "Papillae、follicles與膜", "points": ["Papillae有中央血管核心，可見過敏或機械刺激；follicles為淋巴性隆起，典型中央無血管，見病毒或chlamydia等。偽膜較易分離，真膜較緊密、移除可能出血；不能單靠膜就確診病原。Ciliary flush、畏光與降視力應想眼表以外病因。"], "recall": "乳頭與濾泡的血管分布如何不同？", "ref": "8–13", "medicalReview": null}, {"title": "腺病毒結膜炎", "points": ["常水樣分泌、濾泡、耳前淋巴結與上呼吸道症狀，可由單眼變雙眼；傳染防治與手部／器具衛生重要。可合併角膜上皮下浸潤影響視力；抗生素不是病毒的特效藥，類固醇需專科選案以免掩蓋其他病因。"], "recall": "「感冒後紅眼」還有哪些眼科紅旗不能省略檢查？", "ref": "14–17", "medicalReview": null}, {"title": "細菌、淋菌與披衣菌", "points": ["一般細菌常黏膿性分泌；hyperacute大量膿液需警覺gonococcus，可快速傷角膜，需緊急眼科及全身治療。慢性濾泡性單眼結膜炎可考慮chlamydia，需系統性／性傳染病與伴侶處理，不能只點局部藥。新生兒紅眼須依專科排重症，不能只憑發病日數診斷。"], "recall": "為何淋菌與披衣菌結膜炎不能照一般點眼藥療程處理？", "ref": "14–21", "medicalReview": null}, {"title": "Trachoma與瘢痕", "points": ["Trachoma經典為C. trachomatis A–C型，可濾泡、上瞼瘢痕Arlt line、Herbert pits、角膜pannus與倒睫。Adult inclusion常與D–K型相關，臨床情境不同。長期瘢痕會改變眼瞼／眼表，需按病因與公共衛生背景處理。"], "recall": "Trachoma與成人inclusion結膜炎的型別和長期後果如何不同？", "ref": "18–21", "medicalReview": null}, {"title": "過敏、VKC與AKC", "points": ["雙眼癢是過敏重要線索；VKC可兒童／少年、季節性巨大乳頭、Trantas dots及shield ulcer；AKC常與異位性皮膚炎相關、較慢性並可瘢痕。瘙癢不等於永遠安全，若畏光或視力下降仍需看角膜。不要以類固醇作無監測的長期通用點眼藥。"], "recall": "VKC、AKC與單純季節性過敏，角膜風險何者需特別注意？", "ref": "18–21", "medicalReview": null}, {"title": "翼狀贅片、瞼裂斑與腫瘤", "points": ["Pterygium為纖維血管組織跨角膜緣長上角膜，可牽引散光；pinguecula通常留在結膜。Nevus可囊腫等良性線索，但進展性腫塊、白斑、供血血管、色素變化需評估OSSN／melanoma等；salmon patch提示淋巴增生性疾病。"], "recall": "跨不跨角膜緣、是否進展、是否白斑各有何意義？", "ref": "22–24", "medicalReview": null}, {"title": "乾眼定義與表型", "points": ["DED為眼表恆定性失衡的多因素疾病，涉及不穩定、滲透、發炎／損傷及神經感覺因素。分aqueous-deficient、evaporative及混合型；主訴與體徵可能不成比例。現行TFOS有診斷框架，不能沿用「沒有定義／沒有標準」的絕對說法。"], "recall": "為何乾眼可Schirmer正常？症狀很痛而染色少時如何保持開放鑑別？", "ref": "31–39；補充E08", "medicalReview": null}, {"title": "三種測試各測什麼", "points": ["Schirmer評估淚液分泌相關表現，結果受有無麻醉與反射影響；TBUT／NIBUT看穩定性；染色看眼表損傷。症狀量表與客觀恆定性指標要整合，單一正常檢查不能排除所有乾眼或其他眼表疾病。本冊不把不同方法的數值門檻混成一個標準。"], "recall": "Schirmer、TBUT與staining可以互相替代嗎？", "ref": "37–39", "medicalReview": null}, {"title": "Lacrimal functional unit與MGD", "points": ["眼表V1感覺、神經調控、淚腺、眨眼與瞼板腺共同維持淚膜。MGD導致脂質與蒸發問題；評估腺口、分泌品質、可擠出性與眼瞼炎，meibography只是一部分。熱敷／眼瞼清潔可針對部分機轉，但不等於所有乾眼靠熱敷都會好。"], "recall": "Meibography正常能否證明瞼板腺功能完全正常？", "ref": "40–44、52–53", "medicalReview": null}, {"title": "系統疾病、暴露與神經", "points": ["Sjögren可眼口乾與自體免疫背景；GVHD可嚴重眼表發炎／瘢痕。眨眼不完全、VII麻痺、眼瞼後縮與長時間螢幕可造成暴露或不穩定；角膜感覺缺失可神經滋養性病變。依機轉處理，不把所有低染色疼痛都叫普通乾眼。"], "recall": "眼乾合併口乾、移植史或感覺降低，各改變哪個鑑別？", "ref": "54–58", "medicalReview": null}, {"title": "治療與危險紅旗", "points": ["人工淚液、環境／眨眼調整、眼瞼治療與選定抗發炎需依表型；頻繁用藥可考慮防腐劑負荷。Cyclosporine或短期類固醇等由專科選擇並監測；淚點栓塞亦須考量眼表炎症與感染。單眼痛紅、明顯畏光／降視力、角膜浸潤或hypopyon不可只當乾眼。"], "recall": "初步治療無效時，如何重新分類而非一直增加人工淚液品牌？", "ref": "59–60；補充E08", "medicalReview": null}], "notes": "傳統三層淚膜保留作基礎框架，實際不是三個完全分離層。現行乾眼已有TFOS診斷／處理框架；Schirmer正常不能排除蒸發性疾病。", "refs": [], "chapter": 12, "source": "眼科學No.12.pdf", "compare": [["Papillae vs follicles", "中央血管核心 vs 中央相對無血管淋巴隆起", "不是一個外型直接對一個病原"], ["Viral vs allergic vs hyperacute purulent", "水樣／濾泡 vs 癢／乳頭 vs 大量膿需警覺淋菌", "降視力與角膜病灶改變急迫性"], ["Pterygium vs pinguecula", "跨角膜緣 vs 通常不跨", "別把進展性白斑腫塊一律當翼狀贅片"], ["Aqueous-deficient vs evaporative", "水液不足 vs 蒸發／脂質異常", "常混合，Schirmer正常仍可乾眼"], ["Schirmer vs TBUT vs staining", "分泌相關 vs 穩定性 vs 損傷", "測的是不同維度"]], "cases": [{"prompt": "病人說Schirmer正常，因此不可能乾眼，卻有短TBUT及MGD。你會如何解釋並規劃？", "answer": "說明Schirmer看分泌、TBUT看穩定性，正常分泌仍可蒸發性乾眼；檢查腺口、脂質分泌、眨眼及眼表損傷，評估混合型與其他痛覺問題。按表型給眼表／眼瞼與環境管理，必要時專科抗炎；不是一直換品牌或用單一數值否定症狀。", "ref": "31–44、59–60；E08"}, {"prompt": "一位成人慢性單眼濾泡性結膜炎，另一位大量膿性分泌且角膜受累。比較兩者不應漏掉的處理。", "answer": "前者考慮chlamydia並進行合適系統性／性病及伴侶評估；後者須警覺gonococcus等hyperacute感染，緊急眼科及全身治療。兩者不能只當一般結膜炎局部點藥；同時評估視力、角膜與全身風險。", "ref": "14–21；E12"}], "images": [{"ref": "8–13", "prompt": "比較乳頭與濾泡照片，描述中央與周邊血管，不要直接從圖推出唯一病原。", "answer": "Papilla中央血管，follicle中央相對無血管；過敏、病毒、披衣菌等仍需用病史與其他體徵整合。"}, {"ref": "37–44", "prompt": "看乾眼測試與瞼板腺圖，逐一說明是量分泌、穩定性、損傷還是腺體結構。", "answer": "Schirmer分泌、TBUT穩定、染色損傷、meibography結構；沒有一張圖可同時代表全部維度。"}], "correction": "傳統三層淚膜保留作基礎框架，實際不是三個完全分離層。現行乾眼已有TFOS診斷／處理框架；Schirmer正常不能排除蒸發性疾病。", "ext": ["E08", "E12"], "sourceUrl": "", "sourcePages": 68, "canonicalSource": "眼科學No.12.pdf"}, {"id": "notes-13", "title": "藥物眼部副作用", "summary": "每個藥先配對受損組織、症狀與時序，再區分可觀察沈積、需監測毒性與緊急停藥評估。", "sections": [{"title": "血眼屏障與定位", "points": ["血房水屏障包含虹膜血管內皮及非色素睫狀上皮等緊密連接；內層血視網膜屏障主要為視網膜血管內皮tight junction，外層為RPE。Pericytes有支持作用，但不是內層屏障本身的緊密接合細胞。藥物毒性應按角膜、晶狀體、葡萄膜、視神經、視網膜及眼壓定位。"], "recall": "內外血視網膜屏障各由哪種細胞形成？", "ref": "4–6", "medicalReview": null}, {"title": "渦狀角膜沈積與水腫", "points": ["Amiodarone等可造成cornea verticillata，沈積本身常視功能影響不大，不應看到就自行停救命藥。Amiodarone亦有較嚴重視神經不良反應鑑別；amantadine可與角膜內皮失能／水腫相關。角膜沈積與視神經毒性是不同部位與風險。"], "recall": "Amiodarone病人有角膜渦紋，何種附加症狀會讓你不能只安心觀察？", "ref": "7–9", "medicalReview": null}, {"title": "EGFR抑制劑與眼表", "points": ["EGFR相關治療可睫毛變長、上皮修復不良與角膜病變。評估倒睫摩擦、乾眼、上皮缺損與感染，而不是只拍睫毛變長。腫瘤治療調整需眼科與原處方團隊協調，不能未分嚴重度一律停所有治療。"], "recall": "睫毛變長與角膜上皮缺損，如何分機械性與藥物修復問題？", "ref": "10–12", "medicalReview": null}, {"title": "SJS／TEN與藥物性發炎", "points": ["新藥後皮膚／黏膜病變合併眼表發炎須警覺SJS／TEN，立即處理疑致病藥與全身急症並及早眼科介入。Rifabutin、cidofovir可與uveitis相關，bisphosphonates可有uveitis／scleritis。藥物因果需時序、排他病因與臨床證據，不能任何紅眼都怪藥。"], "recall": "新藥後黏膜糜爛與眼痛，為何是跨科急症？", "ref": "13–17", "medicalReview": null}, {"title": "Ethambutol等視神經毒性", "points": ["Ethambutol可雙眼較對稱色覺下降、中央／盲點相連暗點，眼底早期可正常；劑量、療程與腎功能影響風險。Linezolid長期使用亦可視神經病變。新視覺症狀需立即聯絡眼科及處方團隊討論停／換藥與檢查，不等乳頭蒼白才處理。"], "recall": "「視乳頭正常」為何不能排除ethambutol毒性？", "ref": "18–21", "medicalReview": null}, {"title": "Vigabatrin與色覺現象", "points": ["Vigabatrin可造成周邊視野縮小，與一般可逆視霧不同；監測需依藥物規範與合作能力。Digoxin可黃視，PDE5抑制劑可短暫藍視，但持續視力下降不能只當已知良性副作用。視野型態與時間尺度比「吃藥會模糊」更有用。"], "recall": "黃視、藍視與周邊視野縮小，各想到哪些藥？", "ref": "22、33", "medicalReview": null}, {"title": "HCQ：風險不是只有累積克數", "points": ["Hydroxychloroquine風險取決於每日劑量、年限、腎功能與tamoxifen等因素；AAO 2025修訂仍以實際體重≤5 mg/kg/day為重要建議。Bull’s-eye為較晚表現，不能等看見才篩檢。低於建議量不是零風險，超過也不是當天即確診毒性。"], "recall": "60 kg、每日400 mg的劑量是多少mg/kg？它代表風險還是已確診？", "ref": "34–38；補充E13", "medicalReview": null}, {"title": "HCQ：篩檢更新", "points": ["AAO 2025修訂以OCT與廣範圍FAF為主要篩檢，視野／mfERG可作確認。開始HCQ後應及早完成眼底、OCT與FAF基線檢查；使用期間建議年度篩檢，僅無顯著風險因子者可在最初5年暫緩年度篩檢。須同時涵蓋parafoveal與pericentral型態，不能只靠10-2中央視野。"], "recall": "為何亞洲患者的HCQ篩檢不能只把10-2當唯一檢查？", "ref": "34–38；補充E13", "medicalReview": {"date": "2026-10-10", "reason": "「前5年後開始」易誤讀為一律等5年；需強調先做基線與風險分層。", "sources": [{"url": "https://pubmed.ncbi.nlm.nih.gov/41232611/", "doi": "10.1016/j.ophtha.2025.11.001", "title": "AAO HCQ Screening 2025 Revision; journal publication 2026", "conclusion": "主要篩檢為OCT與廣範圍FAF；視野／mfERG為確認檢查。早期基線含眼底、OCT、FAF；年度篩檢僅在無顯著風險因子時可於最初5年暫緩。實際體重每日建議≤5 mg/kg；須兼顧parafoveal與pericentral。"}]}}, {"title": "視網膜沈積、水腫與血管效應", "points": ["Thioridazine可色素性視網膜病變；tamoxifen可結晶及黃斑結構改變；interferon可棉絮斑與出血；部分taxanes等可與黃斑水腫相關。這些關聯的機轉、風險與證據強度不完全相同，需結合劑量、症狀、OCT及共病，不可只以用藥名直接確診。"], "recall": "同樣中央模糊，如何區分結晶、視神經毒性與囊樣水腫？", "ref": "39–44", "medicalReview": null}, {"title": "類固醇的四條風險", "points": ["長期／易感者可PSC、眼壓上升、感染風險與CSC；局部、口服、吸入或其他途徑均須依暴露評估。類固醇升眼壓常因流出阻力增加，未必痛。不能因用藥是非眼科開立就忽略眼部監測，也不能把所有視網膜下液體再加類固醇。"], "recall": "用類固醇的病人視力差，至少列出四種不同機制。", "ref": "15、45、52–53", "medicalReview": null}, {"title": "散瞳誘發瞳孔阻滯", "points": ["抗膽鹼等藥物可在易感狹窄隅角造成散瞳與瞳孔阻滯。病人可單眼急痛、虹視、噁心與高眼壓；需即時檢查機轉。不是所有接受散瞳者都會急性青光眼，也不是所有藥物閉鎖都由瞳孔阻滯造成。"], "recall": "藥物造成瞳孔變大，為何有些人高眼壓、有些人沒有？", "ref": "46–48", "medicalReview": null}, {"title": "Topiramate與雙眼近視位移", "points": ["Topiramate可使睫狀脈絡膜滲出、晶狀體虹膜隔前移，造成急性雙眼近視與隅角閉鎖，未必原本狹窄。須立即眼科評估，由治療團隊依臨床判斷儘速停疑致病藥並安排替代。治療按機轉選房水抑制、cycloplegia及必要抗炎；LPI不能解除滲出主因，避免機械套用pilocarpine。"], "recall": "為何此類閉鎖常用cycloplegia而非直覺使用縮瞳劑？", "ref": "49–51；補充E03", "medicalReview": {"date": "2026-10-10", "reason": "把協調停藥寫成急症當下儘速處理，而非等待一般回診。", "sources": [{"url": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/020505s067%2C020844s058lbl.pdf", "title": "TOPAMAX prescribing information section 5.1", "conclusion": "睫狀體上滲出使晶狀體及虹膜前移；視力症狀屬急症。主要治療為依治療醫師判斷儘速停用topiramate。"}, {"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2687928/", "title": "Topiramate Induced Acute Angle Closure Glaucoma", "conclusion": "原始病例系列中LPI未改善病因；停topiramate與pilocarpine，使用房水抑制、cycloplegia及按個案抗炎治療後改善。"}, {"url": "https://pubmed.ncbi.nlm.nih.gov/14711721/", "doi": "10.1016/j.ophtha.2003.04.004", "title": "Topiramate-associated acute, bilateral, secondary angle-closure glaucoma", "conclusion": "自發通報病例系列支持雙眼次發閉鎖、近視與脈絡膜滲出；周邊虹膜切開不能治療此型病因。"}]}}], "notes": "內層血視網膜屏障為血管內皮tight junction而非pericytes。HCQ加入AAO 2025修訂重點；舊稿篩檢表不可原封不動當現行規範。", "refs": [], "chapter": 13, "source": "眼科學No.13.pdf", "compare": [["Amiodarone角膜 vs 視神經", "渦狀沈積常較低危 vs 視力／色覺與神經病變需評估", "不能一律停藥，也不能一律安心"], ["Ethambutol vs vigabatrin", "中央／色覺與視神經 vs 周邊視野收縮", "損傷型態與監測方式不同"], ["HCQ vs tamoxifen", "外層視網膜／RPE毒性 vs 結晶／黃斑結構改變", "同時用tamoxifen會影響HCQ風險評估"], ["類固醇 vs topiramate高壓", "常小樑流出阻力增加 vs 滲出使隔膜前移閉鎖", "開角型與非瞳孔阻滯閉鎖不同"], ["瞳孔阻滯 vs topiramate", "LPI可解除壓差 vs LPI不能解決滲出前移", "不要把所有閉角治療當同一套"]], "cases": [{"prompt": "服HCQ七年，60 kg、每日400 mg且腎功能變差，目前視力仍1.0。如何回應「我看得清楚，不需篩檢」？", "answer": "計算約6.7 mg/kg/day，高於實際體重5 mg/kg/day建議；年限與腎功能使風險評估更重要。正常中央視力不排除早期毒性，需眼科結構／FAF及必要功能檢查並與處方團隊重評劑量。不能僅據高劑量就宣告已毒性或自行停藥。", "ref": "34–38；E13"}, {"prompt": "Topiramate新開十天，雙眼急性−5 D近視位移與淺前房高眼壓。考官問要不要先打LPI。", "answer": "先確認藥物時序與睫狀脈絡膜滲出／前移機轉，緊急眼科並聯絡原處方醫師處理疑致病藥與替代。這不是典型瞳孔阻滯，LPI不解決主因；專科可按機轉選房水抑制、cycloplegia等，避免機械套用pilocarpine。", "ref": "49–51；E03"}], "images": [{"ref": "34–38", "prompt": "看HCQ相關眼底／OCT圖，找受損外層區域，說明為何正常中央視力不等於沒有早期損害。", "answer": "旁中心或較外側損傷可在視力表下降前出現；bull’s-eye不應當最早篩檢標準，需影像與功能對照。"}, {"ref": "49–51", "prompt": "查看藥物性隅角閉鎖段落，自行畫出睫狀體／脈絡膜與晶狀體虹膜隔的改變，再與iris bombe比較。", "answer": "Topiramate相關滲出使整體隔膜前移，不是單靠前後房壓差鼓起虹膜；這解釋LPI不處理主因。"}], "correction": "內層血視網膜屏障為血管內皮tight junction而非pericytes。HCQ加入AAO 2025修訂重點；舊稿篩檢表不可原封不動當現行規範。", "ext": ["E03", "E13"], "sourceUrl": "", "sourcePages": 60, "canonicalSource": "眼科學No.13.pdf"}, {"id": "notes-14", "title": "症狀鑑別與整合口試", "summary": "以急迫性→單雙眼→定位→前三鑑別→下一步作答；本冊是跨章整合，不再只背病名。", "sections": [{"title": "一分鐘眼科初評", "points": ["起病時間、單雙眼、疼痛、外傷／化學品、接觸鏡、近期手術與用藥是首批問題。單眼視力／矯正、瞳孔與RAPD、眼位EOM、前節及合適眼壓／眼底逐步定位。眼球可能破裂先避壓；化學傷先沖洗，常規檢查順序需讓位於安全。"], "recall": "請不用看筆記在一分鐘內完成症狀問診與安全例外。", "ref": "4–6", "medicalReview": null}, {"title": "紅眼先分有無威脅視力", "points": ["一般結膜炎較多分泌物與眼表刺激；角膜炎、前葡萄膜炎、急性閉鎖可畏光、痛與降視力。結膜下出血常無痛且視力不變，但外傷等背景仍須評估。不能以「紅不紅」決定嚴重性，CRAO／剝離可不紅。"], "recall": "紅眼的哪三項資訊最能改變你的急迫性判斷？", "ref": "7–14", "medicalReview": null}, {"title": "痛紅三角：角膜、前房、眼壓", "points": ["角膜浸潤＋上皮缺損偏角膜炎；cells／flare、後黏連偏前葡萄膜炎；高壓、淺前房、中度散瞳與虹視偏急性閉鎖。可能重疊或互為併發症，需要實際檢查，不是三個病各只對一個症狀。"], "recall": "接觸鏡痛紅、cells與高眼壓，哪個是病因、哪個可能是結果？", "ref": "7–14", "medicalReview": null}, {"title": "乾眼與結膜炎的重評點", "points": ["長期雙眼乾澀、眨眼後波動可支持淚膜問題；病毒有濾泡與接觸／URI背景，過敏以癢突出。單一Schirmer正常不能排乾眼，單側長期濾泡要想chlamydia。若出現降視力、角膜病灶或不尋常疼痛，重新分類而非一直換點眼藥。"], "recall": "人工淚液無效時，你如何避免只在「乾眼」裡打轉？", "ref": "7–14；No.12", "medicalReview": null}, {"title": "眼皮腫：局部腺體還是眼眶", "points": ["小範圍急痛腫塊可hordeolum；慢性無痛可chalazion但異常反覆要排腫瘤。痛性EOM、突眼、視功能異常提示眶內，而非只是眼瞼。內眥下方痛紅腫支持淚囊炎，位置能縮短鑑別。"], "recall": "眼瞼腫怎麼用位置與EOM決定是否需緊急眶內評估？", "ref": "15–18", "medicalReview": null}, {"title": "下垂與突眼的高風險組合", "points": ["III麻痺下垂加外下偏、Horner縮瞳輕度下垂、MG疲勞變動；CCF有螺旋血管／雜音／突眼；TED需評估壓迫性視神經病變。急性頭頸痛或視功能下降時，危險病因優先於美容或慢性分類。"], "recall": "看到下垂先檢查瞳孔和EOM，能避免漏掉哪些急症？", "ref": "23–24；No.03、08、11", "medicalReview": null}, {"title": "模糊的解剖路徑", "points": ["由淚膜／角膜、晶狀體、玻璃體、視網膜、視神經至腦逐段定位。針孔／驗光改善支持光學因素，但不排共病；變形視偏黃斑、色覺／RAPD偏不對稱視神經或嚴重視網膜。症狀是方向而非病理證據，需適當影像確認。"], "recall": "同樣「看不清楚」，哪些追問能把光學與黃斑／視神經分開？", "ref": "25–27", "medicalReview": null}, {"title": "慢性屈光變化與白內障", "points": ["遠距清楚近距變差可老花；不規則散光與最佳矯正不佳可圓錐角膜；近視位移和核混濁可核性白內障。單眼視力逐漸降低不可一律以度數解釋，且突變要問藥物、血糖與前房狀態。"], "recall": "近視突然加深時，哪些原因不是單純眼軸又變長？", "ref": "28–30", "medicalReview": null}, {"title": "視野：水平與垂直", "points": ["青光眼常弓形、鼻階梯並對應RNFL；雙顳偏盲提示視交叉，同向缺損提示交叉後對側路徑。視野先核對側別、可靠度、重複性及結構對應，不靠圖片「像」就確診。患者說單眼看不清，仍可能其實是同向視野缺損。"], "recall": "病人把偏盲說成單眼模糊時，你如何用檢查澄清？", "ref": "31–33", "medicalReview": null}, {"title": "急性無痛下降", "points": ["優先考慮視網膜動脈／靜脈阻塞、剝離、玻璃體出血與AION等；幕簾／閃光、眼底蒼白、四象限出血、視乳頭水腫各縮小範圍。CRAO需中風評估，GCA疑慮需緊急處置，不以無痛當作不急。"], "recall": "無痛失明為何仍可能比很紅很癢更緊急？", "ref": "34–35；No.10、No.03", "medicalReview": null}, {"title": "複視與單眼測試", "points": ["遮任一眼消失支持雙眼對位異常；遮好眼後症狀仍留在患眼可為單眼光學性複視等。雙眼複視再依水平、垂直、旋轉、看哪邊較重與頭位找肌肉／神經／機械／MG。急性複視伴神經症狀需提高警覺。"], "recall": "你如何用兩次遮眼建立單眼與雙眼複視的第一分流？", "ref": "25–27；No.03、04", "medicalReview": null}, {"title": "口試回報與安全收尾", "points": ["用「這是急／慢性、單／雙眼、痛／無痛、主要定位在…」起頭；給最可能診斷與一個不能漏的鑑別，列支持及反證，再提出能改變處置的下一步。資料不足時明確說還需什麼；最後交代不能做什麼、何時立即求援與返診。"], "recall": "請用60秒回報一個你不完全確定病名但知道需緊急處理的病例。", "ref": "36–40", "medicalReview": null}], "notes": "本冊以跨章推理驗收，不是把圖片或單一徵象當確診。任何病例資料不足時，須明確說明待補資訊；不虛構檢查正常來完成診斷。", "refs": [], "chapter": 14, "source": "眼科學No.14.pdf", "compare": [["痛紅＋浸潤 vs 痛紅＋cells vs 痛紅＋高壓淺房", "角膜炎 vs 前葡萄膜炎 vs 急性閉鎖", "三者可能重疊，必須查實"], ["單眼複視 vs 雙眼複視", "患眼單獨看仍有 vs 遮任一眼解除", "先遮眼再定位神經"], ["波動模糊 vs 變形視 vs 色覺差／RAPD", "淚膜／光學 vs 黃斑 vs 傳入視路", "線索不是單項確診"], ["雙顳 vs 同向 vs 弓形", "交叉 vs 交叉後 vs RNFL／青光眼", "先命名再定位"], ["局部眼皮腫 vs 眶內病變", "腺體／眶隔前 vs 痛性EOM、突眼、視功能受損", "外觀瘀青少不能保證輕症"]], "cases": [{"prompt": "同時有三人：A戴接觸鏡後痛紅且角膜浸潤；B無痛突然失明伴cherry-red spot；C長期雙眼癢且VA正常。如何排急迫性並說第一步？", "answer": "A與B皆是需立即處理的視力急症，不以「A較痛」忽略B；B啟動CRAO／中風評估，A緊急角膜感染評估與專科治療。C較偏眼表過敏，但仍看角膜及紅旗。描述資源分流與可同時求援，而非承諾單靠主訴排所有先後。", "ref": "7–14、34–35；E07"}, {"prompt": "病人只有「看不清楚」四字。請用60秒問診，再用60秒給檢查與回報架構。", "answer": "問時間、單雙眼、痛紅、閃光飛蚊／幕簾、變形／色覺／視野、外傷接觸鏡、手術用藥與全身風險。查單眼VA矯正／針孔、pupils／RAPD、EOM、前節、適當IOP與眼底。回報定位、最可能與不能漏的鑑別、關鍵待補證據與緊急性；疑破裂／化學傷例外優先安全處置。", "ref": "4–40"}], "images": [{"ref": "31–33", "prompt": "遮住診斷標籤，從各視野圖依序說側別、水平／垂直中線與可能定位。", "answer": "弓形／鼻階梯連RNFL；雙顳連交叉；同向連對側交叉後。需加可靠度與臨床吻合，不能只背圖形名稱。"}, {"ref": "34–35", "prompt": "從眼底出血病例先描述分布、血管、乳頭及黃斑，再說一個應排的全身病因或併發症。", "answer": "先區分微動脈瘤、點狀／火焰狀出血、硬性滲出、棉絮斑與Roth spots。第34頁病例包含糖尿病及血液疾病相關鑑別；Roth spots並非感染性心內膜炎專屬。另依出血分布、靜脈改變與臨床背景區分CRVO／BRVO，評估缺血、新生血管與黃斑水腫。"}], "correction": "本冊以跨章推理驗收，不是把圖片或單一徵象當確診。任何病例資料不足時，須明確說明待補資訊；不虛構檢查正常來完成診斷。", "ext": ["E01", "E03", "E04", "E07"], "sourceUrl": "", "sourcePages": 42, "canonicalSource": "眼科學No.14.pdf"}], "questions": [{"id": "q1", "topicId": "optics", "stem": "某眼處方為 −2.00 / −1.00 × 180，其球面等值為何？", "options": ["−1.00 D", "−1.50 D", "−2.50 D", "−3.00 D"], "correctIndex": 2, "explanation": "SE = sphere + cylinder / 2，因此 −2.00 + (−1.00)/2 = −2.50 D。軸度不進入SE計算。\n\n常見陷阱：−3.00 D是直接加總球面與柱面度數，忽略柱面需取一半。", "refs": ["https://www.aaojournal.org/article/S0161-6420%2822%2900867-3/fulltext/", "https://aao.org/eye-health/diseases/what-is-presbyopia", "https://eyewiki.aao.org/Retinoscopy"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q2", "topicId": "examination", "stem": "視力模糊在針孔測試後明顯改善，最支持哪一因素？", "options": ["屈光因素", "視交叉病變", "完全視網膜剝離", "視神經完全萎縮"], "correctIndex": 0, "explanation": "針孔可減少周邊光線形成的模糊圈，改善支持光學／屈光因素。\n\n常見陷阱：「有改善」不是保證眼底正常。需依病史與完整檢查評估共存病變。", "refs": ["https://eyewiki.aao.org/Visual_Acuity_Testing_in_Adults", "https://eyewiki.aao.org/Pre-Ophthalmologist_Management_of_Eye_Trauma", "https://eyewiki.aao.org/Ruptured_Globe", "https://eyewiki.aao.org/Orbital_Compartment_Syndrome"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q3", "topicId": "red-eye", "stem": "隱形眼鏡配戴者單眼疼痛、畏光，角膜有浸潤與上皮缺損。最應優先考慮？", "options": ["單純過敏性結膜炎", "感染性角膜炎", "老花", "慢性開放隅角青光眼"], "correctIndex": 1, "explanation": "疼痛、畏光與角膜浸潤／上皮缺損，尤其合併隱形眼鏡使用，支持感染性角膜炎。\n\n常見陷阱：搔癢是過敏性結膜炎的重要線索，但不能解釋本題角膜病灶。", "refs": ["https://aao.org/eye-health/diseases/pink-eye-conjunctivitis", "https://aao.org/eye-health/diseases/what-is-glaucoma"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q4", "topicId": "glaucoma", "stem": "劇烈眼痛、虹視與噁心，見角膜水腫、中度散大瞳孔及明顯高眼壓。最可能診斷？", "options": ["急性隅角閉鎖", "單純結膜下出血", "後囊混濁", "單純乾眼"], "correctIndex": 0, "explanation": "症狀與前節所見共同指向急性隅角閉鎖。這是需要緊急處置的組合。\n\n常見陷阱：作答後還要能補充：立即眼科處置與降眼壓，後續解除閉鎖機轉。", "refs": ["https://aao.org/eye-health/diseases/what-is-glaucoma", "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/glaucoma/glaucoma-and-eye-pressure"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q5", "topicId": "trauma", "stem": "清潔劑濺入眼內，沒有穿通傷線索，病人剛到急診。下列何者應最優先？", "options": ["等待完整藥物史", "先安排眼底攝影", "立即大量沖洗", "待眼科抵達再處理"], "correctIndex": 2, "explanation": "化學傷的第一步是立即沖洗，以減少持續暴露，不應因完整檢查而延遲。\n\n常見陷阱：沖洗後仍需去除殘留顆粒、重測pH並完整評估，開始沖洗不等於處理完成。", "refs": ["https://eyewiki.aao.org/Pre-Ophthalmologist_Management_of_Eye_Trauma", "https://eyewiki.aao.org/Ruptured_Globe", "https://eyewiki.aao.org/Orbital_Compartment_Syndrome"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q6", "topicId": "trauma", "stem": "高速金屬碎片擊中眼睛，疑開放性眼球傷。何者最適當？", "options": ["加壓包紮", "以壓平式眼壓計測量眼壓", "強行翻眼瞼找異物", "硬式眼罩保護並緊急眼科處置"], "correctIndex": 3, "explanation": "疑眼球開放傷應避免施壓，硬式眼罩可保護受傷眼並安排緊急專科處置。\n\n常見陷阱：加壓、眼壓測量或強行操作可能造成進一步傷害。", "refs": ["https://eyewiki.aao.org/Pre-Ophthalmologist_Management_of_Eye_Trauma", "https://eyewiki.aao.org/Ruptured_Globe", "https://eyewiki.aao.org/Orbital_Compartment_Syndrome"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q7", "topicId": "glaucoma", "stem": "關於青光眼，下列何者正確？", "options": ["正常眼壓足以排除", "僅以眼壓診斷", "需整合視神經結構、視野與隅角等資訊", "沒有症狀就不會有進展"], "correctIndex": 2, "explanation": "青光眼評估需整合結構與功能損害、隅角與危險因子。正常眼壓型青光眼確實存在。\n\n常見陷阱：高眼壓是危險因子，與青光眼診斷不能直接畫上等號。", "refs": ["https://aao.org/eye-health/diseases/what-is-glaucoma", "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/glaucoma/glaucoma-and-eye-pressure"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q8", "topicId": "vision-loss", "stem": "單眼突然無痛性嚴重視力下降，疑CRAO。最適當的處理方向？", "options": ["一個月後複診", "立即急診／中風與眼科評估", "只重配眼鏡", "只給人工淚液"], "correctIndex": 1, "explanation": "CRAO是急性缺血性中風範疇的眼科急症，需即刻進行急診與相關評估。\n\n常見陷阱：典型櫻桃紅點並非轉診前必備條件，也不能因無痛而降低急迫性。", "refs": ["https://professional.heart.org/en/science-news/management-of-central-retinal-artery-occlusion/top-things-to-know", "https://eyewiki.aao.org/Demyelinating_Optic_Neuritis", "https://eyewiki.aao.org/Acquired_Oculomotor_Nerve_Palsy", "https://aao.org/eye-health/diseases/detached-torn-retina"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q9", "topicId": "retina-macula", "stem": "新發飛蚊、閃光合併幕簾樣視野缺損，最需要優先排除？", "options": ["視網膜裂孔／剝離", "老花", "單純屈光不正", "過敏性結膜炎"], "correctIndex": 0, "explanation": "新發閃光與飛蚊提示玻璃體牽拉，幕簾樣缺損更需警覺視網膜剝離。\n\n常見陷阱：單次中央視力仍正常不能排除周邊裂孔或周邊視網膜剝離。", "refs": ["https://aao.org/eye-health/diseases/detached-torn-retina", "https://aao.org/eye-health/diseases/amd-macular-degeneration"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q10", "topicId": "vascular-retina", "stem": "廣泛視網膜出血伴靜脈擴張迂曲，最符合哪一診斷？", "options": ["視網膜中央動脈阻塞", "視網膜中央靜脈阻塞", "單純白內障", "球後視神經炎"], "correctIndex": 1, "explanation": "廣泛出血與靜脈擴張迂曲是CRVO的典型組合，需進一步評估缺血與黃斑水腫。\n\n常見陷阱：CRAO的典型方向為視網膜缺血蒼白，與本題廣泛靜脈鬱血表現不同。", "refs": ["https://professional.heart.org/en/science-news/management-of-central-retinal-artery-occlusion/top-things-to-know", "https://doi.org/10.1016/j.ophtha.2024.12.020"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q11", "topicId": "neuro", "stem": "雙顳側偏盲最典型的解剖定位為何？", "options": ["右角膜", "左晶狀體", "視交叉", "單側外展神經"], "correctIndex": 2, "explanation": "視交叉處鼻側視網膜纖維交叉，受損可造成雙眼顳側視野缺損。\n\n常見陷阱：同向偏盲才支持視交叉後病灶；先定位，再考慮腫瘤等病因。", "refs": ["https://eyewiki.aao.org/Demyelinating_Optic_Neuritis", "https://eyewiki.aao.org/Acquired_Oculomotor_Nerve_Palsy"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q12", "topicId": "diplopia", "stem": "複視在遮住任一眼時都消失，最符合哪一分類？", "options": ["雙眼複視", "單眼複視", "必定為白內障", "必定為視網膜剝離"], "correctIndex": 0, "explanation": "任一眼遮蓋後複視消失，表示雙眼影像對位問題，支持雙眼複視。\n\n常見陷阱：分類不等於病因，仍需檢查眼位、眼球運動與相關神經學徵象。", "refs": ["https://eyewiki.aao.org/Basic_Approach_to_Diplopia"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q13", "topicId": "pediatric", "stem": "幼兒照片反覆出現單側白瞳，下一步何者最適當？", "options": ["等上小學再驗光", "先自行遮住另一眼", "當作正常閃光反射", "迅速安排眼科完整評估"], "correctIndex": 3, "explanation": "白瞳需快速評估，鑑別含視網膜母細胞瘤、先天性白內障及其他眼內病變。\n\n常見陷阱：不能只以照片或無主訴排除疾病，也不宜未確診就自行開始遮眼。", "refs": ["https://www.aapos.org/glossary/amblyopia", "https://www.aapos.org/glossary/strabismus", "https://www.aapos.org/glossary/strabismus-measurements", "https://www.aapos.org/glossary/leukocoria"], "sourceType": "本次自編，非歷屆試題"}, {"id": "q14", "topicId": "cataract", "stem": "白內障手術後出現紅眼、疼痛及視力下降，最需要優先警覺？", "options": ["單純老花", "眼內炎", "單純散光", "正常恢復必經過程"], "correctIndex": 1, "explanation": "術後紅痛與視力下降必須考慮眼內炎，需緊急眼科評估。\n\n常見陷阱：後囊混濁可造成視力模糊，但無法合理解釋本題的急性紅痛組合。", "refs": ["https://aao.org/eye-health/diseases/what-are-cataracts"], "sourceType": "本次自編，非歷屆試題"}, {"id": "notes-01-01", "topicId": "notes-01", "stem": "6/12換成小數視力為何？", "options": ["6.0", "0.5", "0.12", "2.0"], "correctIndex": 1, "explanation": "6除以12為0.5，不能由此直接推算屈光度。", "refs": [], "sourceType": "共筆配套自編題，非歷屆試題", "sourceId": "01-01", "source": "眼科學No.01.pdf", "sourceRef": "3", "safety": false, "reserve": false, "medicalReview": null}, {"id": "notes-01-02", "topicId": "notes-01", "stem": "S −2.00 D、C −1.50 D的SE為何？", "options": ["−2.75 D", "−0.50 D", "−3.50 D", "−1.25 D"], "correctIndex": 0, "explanation": "SE＝S＋C/2＝−2.00−0.75。不能忽略柱鏡一半的貢獻。", "refs": [], "sourceType": "共筆配套自編題，非歷屆試題", "sourceId": "01-02", "source": "眼科學No.01.pdf", "sourceRef": "4", "safety": false, "reserve": false, "medicalReview": null}, {"id": "notes-01-03", "topicId": "notes-01", "stem": "驗光單中的axis 90，正確單位是？", "options": ["毫米", "屈光度D", "角度", "毫米汞柱"], "correctIndex": 2, "explanation": "Axis描述柱鏡方向；S與C才以D表示。原共筆的單位需修正。", "refs": [], "sourceType": "共筆配套自編題，非歷屆試題", "sourceId": "01-03", "source": "眼科學No.01.pdf", "sourceRef": "4，勘誤", "safety": false, "reserve": false, "medicalReview": null}, {"id": "notes-01-04", "topicId": "notes-01", "stem": "針孔後視力明顯改善，最合理解讀是？", "options": ["已排除角膜病變", "已證實眼底完全正常", "支持光學／屈光因素參與", "已確診白內障"], "correctIndex": 2, "explanation": "針孔可縮小模糊圈，但不是對所有眼病的排除試驗。", "refs": [], "sourceType": "共筆配套自編題，非歷屆試題", "sourceId": "01-04", "source": "眼科學No.01.pdf", "sourceRef": "3–6", "safety": false, "reserve": false, "medicalReview": null}, {"id": "notes-01-05", "topicId": "notes-01", "stem": "Goldmann眼壓計的主要原理為何？", "options": ["偵測虹膜血流", "量淚液滲透壓", "量眼球重量", "壓平角膜"], "correctIndex": 3, "explanation": "Goldmann以壓平一定面積估計眼壓，角膜性質會影響讀值。", "refs": [], "sourceType": "共筆配套自編題，非歷屆試題", "sourceId": "01-05", "source": "眼科學No.01.pdf", "sourceRef": "7", "safety": false, "reserve": false, "medicalReview": null}, {"id": "notes-01-06", "topicId": "notes-01", "stem": "內斜視眼的Hirschberg光反射常相對偏向？", "options": ["固定上方", "固定下方", "鼻側", "顳側"], "correctIndex": 3, "explanation": "眼球內轉，角膜光點相對瞳孔中心偏外側；勿把眼位方向當反射方向。", "refs": [], "sourceType": "共筆配套自編題，非歷屆試題", "sourceId": "01-06", "source": "眼科學No.01.pdf", "sourceRef": "8", "safety": false, "reserve": false, "medicalReview": null}, {"id": "notes-01-07", "topicId": "notes-01", "stem": "觀察前房flare主要反映何者？", "options": ["角膜色素沈著", "蛋白造成的光散射", "完整紅血球沈積", "晶狀體鈣化"], "correctIndex": 1, "explanation": "血房水屏障破壞使蛋白增加；cells才是逐顆可見的發炎細胞。", "refs": [], "sourceType": "共筆配套自編題，非歷屆試題", "sourceId": "01-07", "source": "眼科學No.01.pdf", "sourceRef": "21", "safety": false, "reserve": false, "medicalReview": null}, {"id": "notes-01-08"
