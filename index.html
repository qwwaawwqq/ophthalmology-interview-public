s": [13], "unitId": "u2", "sectionIndexes": [7], "terms": ["Diffuse unilateral subacute neuroretinitis", "DUSN", "Serpiginous choroiditis", "Birdshot chorioretinopathy"], "keyPoints": ["DUSN是與視網膜下蠕蟲相關的單側亞急性神經視網膜病，可有移動／反覆白色病灶，後期視神經與視網膜萎縮。若發現活動蠕蟲，會直接改變專科處理策略。", "蛇行性脈絡膜炎常由視盤旁向外擴展，要排除TB相關蛇行樣病；birdshot則是常雙眼的淡色卵圓脈絡膜病灶與血管炎表型。名稱相近或都呈白點，病因與治療仍不同。"], "clinicalLink": "將側別、病灶演變、血管炎及感染風險放在同一張鑑別表。", "pitfall": "不要把所有白點都當病毒後自限病。", "recall": {"question": "單眼進展、移動白色病灶需想到何類病因？", "answer": "包括DUSN等寄生蟲相關病變。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-classification", "uve-white-dots"]}, {"id": "c31", "title": "多灶脈絡膜炎、PIC與MEWDS", "pages": [13], "unitId": "u2", "sectionIndexes": [7], "terms": ["Multifocal choroiditis", "Punctate inner choroiditis", "PIC", "MEWDS"], "keyPoints": ["多灶脈絡膜炎可有多個炎性病灶、玻璃體炎及後續疤痕／CNV；PIC多見小型內脈絡膜病灶，玻璃體炎症通常較少。兩者都需特別注意新生血管造成的新中央症狀。", "MEWDS常單側閃光、盲點擴大與中心凹顆粒樣改變，許多病例會改善。仍須先排除感染或其他白點病；預後及處理不能從一張「有白點」的照片直接套用。"], "clinicalLink": "用OCT／FAF／血管攝影確認病灶層次和活動，遇變形視另查CNV。", "pitfall": "PIC的少量炎症不代表不會出現嚴重黃斑併發症。", "recall": {"question": "為何白點病人新變形視要重新檢查？", "answer": "可能出現炎症性CNV或黄斑液體，不能只當原病症狀。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-white-dots", "uve-classification"]}, {"id": "c32", "title": "HLA-B27前炎與脊椎關節病", "pages": [3, 13, 35, 43, 44, 45, 48], "unitId": "u2", "sectionIndexes": [8], "terms": ["HLA-B27", "Acute anterior uveitis", "Ankylosing spondylitis", "Spondyloarthritis"], "keyPoints": ["典型表型是急性、疼痛、單眼或交替側別的復發前炎，可有纖維蛋白、hypopyon與後黏連。追問活動後改善的背痛、晨僵、乾癬或腸道症狀，才能將眼睛連到脊椎關節病。", "HLA-B27陽性是支持線索，不能替代眼部表型與全身疾病評估；也不能因常以前炎為主，就說永不有後段併發症。治療需追蹤眼壓、CME及復發頻率。"], "clinicalLink": "眼科發作可能先於全身疾病診斷，復發時應更新問診與轉介。", "pitfall": "類固醇可緩解不代表可省略感染及病毒鑑別。", "recall": {"question": "HLA-B27陽性加眼紅即可診斷AS嗎？", "answer": "不行，需符合眼部與全身臨床證據。"}, "relatedTopics": [], "sourceIds": ["uve-hlab27"]}, {"id": "c33", "title": "JIA與Fuchs：不紅不痛的慢性前炎", "pages": [13], "unitId": "u2", "sectionIndexes": [8], "terms": ["Juvenile idiopathic arthritis", "JIA-associated uveitis", "Fuchs uveitis syndrome", "Heterochromia", "Stellate KP"], "keyPoints": ["JIA相關前炎可能慢性而無明顯紅痛；兒童即使沒有抱怨也需依風險接受規律裂隙燈篩查，否則可能直到黏連、帶狀角膜病或白內障才發現。", "Fuchs症候群常單眼低度炎症、星狀KP、虹膜萎縮或異色，後黏連並不典型；視損常來自白內障或青光眼。不能把這兩種慢性前炎都照急性HLA-B27表型處理。"], "clinicalLink": "症狀強度與慢性損傷不一定一致；檢查可比主訴更早發現疾病。", "pitfall": "「小孩沒痛」不能當成JIA眼炎篩查陰性。", "recall": {"question": "Fuchs最需長期追蹤的兩項併發症？", "answer": "白內障與青光眼。"}, "relatedTopics": ["notes-04", "notes-06", "notes-07"], "sourceIds": ["uve-classification", "uve-fuchs"]}, {"id": "c34", "title": "中間型的全身連結：MS、sarcoid與感染", "pages": [13, 18, 19, 37], "unitId": "u2", "sectionIndexes": [4, 6], "terms": ["Multiple sclerosis", "Pars planitis", "Intermediate uveitis differential"], "keyPoints": ["以玻璃體炎為主時要想sarcoidosis、多發性硬化症及感染性原因；問感覺、力量、平衡或既往神經症狀，並依表型決定神經評估，而非每位病人一律MRI。", "確無已識別病因且有典型雪堤／雪球，才可使用pars planitis這個特定名稱。病因判斷也影響免疫藥物選擇，已知或疑似脫髓鞘病時需特別審視anti-TNF風險。"], "clinicalLink": "先診斷解剖型態，再尋找會改變治療的全身因素。", "pitfall": "不能只因snowballs便直接診斷MS。", "recall": {"question": "中間型最常影響中央視力的可治療併發症之一？", "answer": "黃斑水腫。"}, "relatedTopics": ["notes-03", "notes-10"], "sourceIds": ["uve-intermediate", "uve-adalimumab"]}, {"id": "c35", "title": "VKH的病程與全身線索", "pages": [13, 35, 36, 44, 46, 48], "unitId": "u2", "sectionIndexes": [9], "terms": ["Vogt-Koyanagi-Harada disease", "Serous retinal detachment", "Sunset glow fundus", "Poliosis", "Vitiligo"], "keyPoints": ["VKH涉及對含黑色素細胞組織的免疫反應；急性可見雙眼脈絡膜增厚、視網膜下液體與漿液性剝離，伴頭痛、耳鳴或聽覺症狀。眼部及全身表徵不一定同時出現。", "後期可出現sunset glow眼底、白髮與白斑，反映色素／組織改變，不是只凭膚色診斷。及時足量控制炎症並安排長期免疫策略，目的是減少復發與慢性結構損傷。"], "clinicalLink": "雙眼漿液性剝離要問耳、腦膜與皮膚症狀，也問創傷手術史以鑑別SO。", "pitfall": "沒有白髮白斑不能排除早期VKH。", "recall": {"question": "Sunset glow是急性診斷必備嗎？", "answer": "不是，常屬後期色素改變。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-classification", "uve-video"]}, {"id": "c36", "title": "交感性眼炎：保眼與免疫治療的現代觀念", "pages": [13, 36, 37, 44, 46, 48], "unitId": "u2", "sectionIndexes": [9], "terms": ["Sympathetic ophthalmia", "Exciting eye", "Sympathizing eye", "Enucleation", "Evisceration"], "keyPoints": ["SO是穿通傷或眼內手術後出現的雙眼肉芽腫型炎症；受傷眼為exciting eye、對眼為sympathizing eye。可有脈絡膜炎、漿液性剝離，與VKH相似，時序和外傷史十分重要。", "現代處理重視可修復眼的保留與及時免疫治療。Enucleation移除整眼，evisceration保留鞏膜殼；預防性移除創傷眼有爭議，不能將舊稿「創傷即摘除」當通則，也不能保證移除後絕不發病。"], "clinicalLink": "向病人解釋罕見雙眼風險時，同時評估受傷眼修復可能與長期監測。", "pitfall": "已發SO時不能把摘除原眼當作必然能終止對眼炎症的方法。", "recall": {"question": "VKH與SO最有用的病史差異？", "answer": "SO具有相關眼部穿通傷或手術時序。"}, "relatedTopics": ["notes-08", "notes-10"], "sourceIds": ["uve-so"]}, {"id": "c37", "title": "眼類肉瘤：肉芽腫、靜脈周圍炎與全身證據", "pages": [13, 31, 37, 44, 47, 48], "unitId": "u2", "sectionIndexes": [8], "terms": ["Ocular sarcoidosis", "Noncaseating granuloma", "Candle-wax periphlebitis", "Bilateral hilar lymphadenopathy"], "keyPoints": ["Sarcoid可呈前、中間、後或全葡萄膜炎，常有雙眼線索、snowballs、脈絡膜視網膜病灶或蠟滴狀靜脈周圍炎。不能只背成中年女性中間型，也不能因性別／年齡不典型就排除。", "胸部淋巴結、ACE等可支持方向；能取得適當組織時，非乾酪性肉芽腫提供重要證據，仍須排除TB及其他原因。不是所有人都能或都需眼內切片，也不能以ACE單項確診。"], "clinicalLink": "將眼部表型與可安全取得的全身證據合併，避免誤用免疫抑制。", "pitfall": "病理「非乾酪」不能簡寫成非乾酪性壞死。", "recall": {"question": "Candle-wax描述哪個結構？", "answer": "視網膜靜脈周圍的炎性滲出。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-classification", "uve-intermediate"]}, {"id": "c38", "title": "Behçet：黏膜病史、閉塞性血管炎與ICBD", "pages": [13, 30, 31, 38, 44, 47, 48], "unitId": "u2", "sectionIndexes": [8], "terms": ["Behçet disease", "Occlusive retinal vasculitis", "ICBD", "Pathergy", "HLA-B51"], "keyPoints": ["反覆口腔／生殖器潰瘍、皮膚與血管或神經表徵，配合眼內炎症形成Behçet方向；視網膜閉塞性血管炎可能在外觀不很紅時持續威脅視力。HLA-B51僅是背景線索。", "ICBD加權框架中眼病灶、口腔與生殖器潰瘍各2分，皮膚、神經、血管與pathergy各1分，達4分支持分類；仍須排除模仿者。嚴重後段疾病通常需要系統性免疫治療，不能只給局部眼藥水。"], "clinicalLink": "追蹤視力、黃斑、滲漏與缺血，不能單以hypopyon消退判定控制良好。", "pitfall": "分類得分不是取代病因排除的自動診斷器。", "recall": {"question": "Behçet最值得警惕的後段機轉？", "answer": "閉塞性視網膜血管炎及其缺血性損害。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-classification", "uve-treatment", "uve-icbd"]}, {"id": "c39", "title": "內生性眼內炎：眼睛與全身感染同時處理", "pages": [3, 30, 38, 39, 44], "unitId": "u2", "sectionIndexes": [10], "terms": ["Endogenous endophthalmitis", "Klebsiella pneumoniae", "Liver abscess", "Candida", "Fungemia"], "keyPoints": ["菌血症或真菌血症可經血流播散到眼內；糖尿病合併肝膿瘍使Klebsiella成為重要警訊。Candida等真菌風險則與免疫抑制、導管、靜脈藥物及全身感染背景有關。", "眼痛、視力下降、前房或玻璃體炎症需緊急眼科處理，同時追查全身感染源；眼內採檢、注藥及是否玻璃體切除由專科決定。全身抗菌藥不能自動替代眼內處理。"], "clinicalLink": "交班用一句話連結全身感染與新眼症狀，而非只回報CRP。", "pitfall": "不能等肝膿瘍控制好才轉眼科。", "recall": {"question": "肝膿瘍病人新單眼模糊要立即懷疑？", "answer": "內生性眼內炎。"}, "relatedTopics": ["notes-10", "notes-14"], "sourceIds": ["uve-video", "uve-treatment"]}, {"id": "c40", "title": "腫瘤性假面：細胞不是一定代表免疫炎症", "pages": [39, 44, 45, 48], "unitId": "u2", "sectionIndexes": [6], "terms": ["Vitreoretinal lymphoma", "Leukemia", "Uveal lymphoid proliferation", "Retinoblastoma", "Uveal melanoma", "Metastatic tumor"], "keyPoints": ["玻璃體視網膜淋巴瘤、白血病細胞及葡萄膜淋巴增生可形成看似炎症的眼內細胞或浸潤；視網膜母細胞瘤、黑色素瘤及轉移瘤也可伴假性炎症表現。", "年齡、單雙眼、病灶層次、反覆不典型經過與短暫類固醇反應都需整合。懷疑時由專科規画眼內採樣、細胞／分子檢測及全身或中樞神經評估，不能只不斷增加類固醇。"], "clinicalLink": "預期治療反應與實際不符，是重新檢查診斷的訊號。", "pitfall": "類固醇暫時改善不能排除淋巴瘤，還可能影響採樣判讀。", "recall": {"question": "持續不典型vitritis應重新考慮哪組疾病？", "answer": "感染與腫瘤性假面，尤其玻璃體視網膜淋巴瘤。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-masquerade"]}, {"id": "c41", "title": "假面延伸：色素、出血、沉積與副腫瘤", "pages": [39, 45, 48], "unitId": "u2", "sectionIndexes": [6], "terms": ["Retinitis pigmentosa", "Ocular ischemic syndrome", "Vitreous hemorrhage", "Ocular amyloidosis", "Pigment dispersion", "Juvenile xanthogranuloma", "Bilateral diffuse uveal melanocytic proliferation"], "keyPoints": ["RP可有玻璃體色素細胞，眼缺血症候群可伴低度前炎，玻璃體出血的紅血球、澱粉樣變性的蛋白沉積與色素分散都可能像細胞懸浮，病因並不等於感染／自體免疫。", "幼年黃色肉芽腫是組織球性增生，可累及虹膜並出血；雙眼瀰漫性葡萄膜黑色素細胞增生是需追查全身腫瘤的副腫瘤方向。依年齡、沉積物、眼壓與眼底辨認，不把稀有名詞當首選診斷。"], "clinicalLink": "先確認看見的是什麼物質，再決定是否需要免疫抑制。", "pitfall": "假面不只包括惡性腫瘤，也不等於每個懸浮物都是淋巴瘤。", "recall": {"question": "前房或玻璃體懸浮物還可能是什麼？", "answer": "色素、紅血球、沉積蛋白或非典型增生細胞。"}, "relatedTopics": ["notes-07", "notes-10"], "sourceIds": ["uve-masquerade"]}, {"id": "c42", "title": "治療路徑：位置、感染與全身需求", "pages": [30, 40, 43], "unitId": "u3", "sectionIndexes": [11], "terms": ["Topical therapy", "Periocular injection", "Intravitreal therapy", "Systemic therapy", "Cycloplegia"], "keyPoints": ["前段炎症常以局部治療取得有效濃度；中後段則可能需要眼周、眼內或系統性治療。單雙眼、威脅視力程度、全身病與感染來源共同决定路徑，不能把某一視力數字當唯一啟動門檻。", "Cycloplegia可降低睫狀肌痙攣疼痛及後黏連風險；病原治療與抗炎需依感染機轉並行。雷射、冷凍或玻璃體切除處理特定結構／診斷問題，不是所有藥物無效後按金字塔順序必做。"], "clinicalLink": "用「藥物需到哪裡、要控制什麼、如何監測」解釋治療選擇。", "pitfall": "不把舊稿NSAID至玻切的排列當通用升級處方。", "recall": {"question": "為何雙眼後段免疫病會考慮全身治療？", "answer": "需同時控制兩眼及可能的全身病程。"}, "relatedTopics": ["notes-13"], "sourceIds": ["uve-treatment"]}, {"id": "c43", "title": "類固醇效益與局部、全身監測", "pages": [40, 41, 42, 43], "unitId": "u3", "sectionIndexes": [11], "terms": ["Corticosteroid", "Steroid response", "Posterior subcapsular cataract", "Steroid-sparing"], "keyPoints": ["類固醇快速抑制炎症，但眼部需監測眼壓、後囊下白內障與感染；全身長期用藥還涉及血糖、血壓、骨骼、情緒睡眠及感染風險。風險受劑量、療程及個體背景影響，不能套用單一百分比。", "反覆或需持續高量才能控制時，應討論類固醇節省的免疫調節策略。目標同時是低疾病活動與可接受毒性，減藥需依活動度與團隊規畫，不是症狀消失便自行停藥。"], "clinicalLink": "用療效、累積毒性與復發風險三條線追蹤，解釋為何需要較慢起效的長期藥。", "pitfall": "免疫抑制並非天然比類固醇安全，每種藥仍有專屬監測。", "recall": {"question": "Steroid-sparing的目的？", "answer": "持續控制疾病，同時降低長期類固醇暴露。"}, "relatedTopics": ["notes-06", "notes-07", "notes-13"], "sourceIds": ["uve-treatment"]}, {"id": "c44", "title": "傳統免疫調節：抗代謝藥的機轉與監測", "pages": [41, 42], "unitId": "u3", "sectionIndexes": [11], "terms": ["Methotrexate", "Azathioprine", "Mycophenolate mofetil", "Leflunomide", "Antimetabolites"], "keyPoints": ["Methotrexate影響葉酸相關代謝；azathioprine干擾嘌呤代謝；mycophenolate抑制IMPDH與淋巴球嘌呤合成；leflunomide抑制嘧啶合成。它們同屬抗代謝方向，但證據、疾病適應與監測並不相同。", "來源圖表列出的起效常以週計，不能當作急症即時控制藥。血球、肝腎狀況、感染、妊娠與交互作用需在選藥前後評估；學習目標是辨認類群與毒性，非背表格自行開立劑量。"], "clinicalLink": "把急性控制與長期減少復發分工，讓病人理解為何初期可能有重疊治療。", "pitfall": "不得把methotrexate等不同藥物的服藥頻率或劑量互換。", "recall": {"question": "為何起效較慢的藥仍有角色？", "answer": "長期控制炎症並减少類固醇依賴。"}, "relatedTopics": ["notes-13"], "sourceIds": ["uve-treatment", "uve-adalimumab"]}, {"id": "c45", "title": "T細胞抑制與烷化劑：療效必須連到毒性", "pages": [41], "unitId": "u3", "sectionIndexes": [11], "terms": ["Cyclosporine", "Tacrolimus", "Calcineurin inhibitors", "Chlorambucil", "Cyclophosphamide", "Alkylating agents"], "keyPoints": ["Cyclosporine與tacrolimus屬calcineurin抑制方向，抑制T細胞活化；需注意腎功能、血壓、代謝與電解質等。不同藥的個別風險與交互作用必須分別查核。", "Chlorambucil與cyclophosphamide為烷化劑，對核酸作用較廣，會有骨髓抑制、感染、生育及惡性腫瘤等重要風險；cyclophosphamide另需留意膀胱毒性。通常只在選定嚴重病況由有經驗團隊考慮。"], "clinicalLink": "治療強度不是只看抑制炎症能力，還要考量不可接受的長期毒性。", "pitfall": "來源表列藥名不等於所有葡萄膜炎的現行推薦。", "recall": {"question": "Cyclosporine追蹤不能漏哪兩類？", "answer": "腎功能與血壓。"}, "relatedTopics": ["notes-13"], "sourceIds": ["uve-treatment"]}, {"id": "c46", "title": "Anti-TNF不是每一種都等效", "pages": [42, 43], "unitId": "u3", "sectionIndexes": [11], "terms": ["TNF-alpha", "Adalimumab", "Infliximab", "Golimumab", "Etanercept", "Certolizumab"], "keyPoints": ["TNF-alpha參與炎症訊號；adalimumab與infliximab在選定非感染性葡萄膜炎有重要角色，但適應症與給藥方式不同。Golimumab、certolizumab也出現在來源研究表，不能據此視為與前兩者完全可互換。", "Etanercept雖屬TNF相關藥物，眼內炎症的效益與反常發炎風險不等同其他anti-TNF。使用前需評估TB等感染與脫髓鞘病等禁忌／風險，不能只用「最強生物製劑」作選藥理由。"], "clinicalLink": "以疾病表型、證據與安全檢查串起選藥，而非照藥物類名猜療效。", "pitfall": "不能將研究表中的研究數量視為個別病人的治療排序。", "recall": {"question": "同為anti-TNF能直接互換嗎？", "answer": "不能，葡萄膜炎證據、風險與適應症不同。"}, "relatedTopics": ["notes-13"], "sourceIds": ["uve-adalimumab", "uve-treatment"]}, {"id": "c47", "title": "其他細胞激素標靶：讀懂歷史研究表", "pages": [42], "unitId": "u3", "sectionIndexes": [11], "terms": ["Anakinra", "Canakinumab", "Gevokizumab", "Tocilizumab", "Sarilumab", "Secukinumab", "Daclizumab"], "keyPoints": ["來源表中的anakinra、canakinumab、gevokizumab涉及IL-1路徑；tocilizumab、sarilumab涉及IL-6受體；secukinumab涉及IL-17A；daclizumab則為IL-2受體相關的歷史治療研究。這些名稱用來辨識標靶，不代表皆是現行常規眼炎用藥。", "不同炎症路徑可能適用特定難治疾病或研究情境，但研究存在不等於療效一致、核准或可取得。選用時仍須查當下證據與法規，並監測感染及各藥專屬毒性。"], "clinicalLink": "口試可解釋精準標靶的邏輯，同時清楚區分研究選項與已確立適應症。", "pitfall": "不把2021來源表原封不動當成2026處方清單。", "recall": {"question": "看見某生物製劑列在表內，還缺什麼資訊？", "answer": "具體疾病證據、現行適應症、可取得性與安全條件。"}, "relatedTopics": ["notes-13"], "sourceIds": ["uve-treatment", "uve-adalimumab"]}, {"id": "c48", "title": "免疫細胞標靶、mTOR與免疫調節的其他方向", "pages": [42], "unitId": "u3", "sectionIndexes": [11], "terms": ["Rituximab", "Alemtuzumab", "Sirolimus", "Interferon alpha-2a", "Interferon alpha-2b", "Pegylated interferon", "Interferon beta", "Intravenous immunoglobulin"], "keyPoints": ["Rituximab針對CD20 B細胞，alemtuzumab針對CD52，sirolimus抑制mTOR；它們作用位置不同，也带来不同免疫風險。來源列名旨在展示研究範圍，並非互相替代的一條升階路徑。", "Interferon alpha-2a／2b、其pegylated長效形式、interferon beta及靜脈免疫球蛋白屬其他免疫調節方向，證據隨特定疾病而異。部分為歷史或特殊情境策略，需重新查核當下可用性。"], "clinicalLink": "把「抑制哪個細胞／訊號」接到感染篩查與監測，而不是只背藥尾名稱。", "pitfall": "不得因標靶較精細就宣稱沒有全身副作用。", "recall": {"question": "mTOR抑制與anti-CD20是否同一機轉？", "answer": "不是，前者作用訊號路徑，後者針對B細胞標誌。"}, "relatedTopics": ["notes-13"], "sourceIds": ["uve-treatment", "uve-adalimumab"]}, {"id": "c49", "title": "術後／注射感染預防與新視損警訊", "pages": [46, 48], "unitId": "u3", "sectionIndexes": [10, 11], "terms": ["Povidone-iodine", "Aseptic technique", "Postoperative endophthalmitis"], "keyPoints": ["眼內操作的感染預防依賴完整無菌流程，包括合適眼表消毒、避免睫毛／瞼緣接觸針口或切口、器械與傷口管理。Povidone-iodine是重要消毒環節，不能由口服或點眼抗生素隨意取代。", "減少不必要的口沫暴露與依程序使用防護，是團隊流程的一部分。術後或眼內注射後新視力下降、疼痛或明显發炎需及時排除眼內炎，而非假定正常反應。"], "clinicalLink": "把預防流程與出院後回報警訊接起，兼顧發生前後的安全。", "pitfall": "不應為避免說話而省略必要手術核對；核對應以合適無菌防護完成。", "recall": {"question": "點了抗生素能取代眼表消毒嗎？", "answer": "不能。"}, "relatedTopics": ["notes-06", "notes-10", "notes-14"], "sourceIds": ["uve-injection"]}], "unresolved": [], "sourceSha256": "426cd69d8a7d3dde3b621414472630d2bdd1767fe6a8d5ee08633bdba238edef"}, "notes-10": {"sourceFile": "Retina.pdf", "pageCount": 70, "reviewedPages": [{"from": 1, "to": 1, "kind": "administrative", "note": "目錄"}, {"from": 2, "to": 30, "kind": "teaching", "note": "主題概覽、視網膜解剖、檢查、玻璃體疾病與糖尿病／高血壓；課程回饋不列入"}, {"from": 31, "to": 33, "kind": "exam", "note": "增殖期病變、電生理、药毒性與閃光飛蚊考點；修正舊解答"}, {"from": 34, "to": 63, "kind": "teaching", "note": "剝離、血管、黃斑、遺傳、腫瘤、感染、藥物與新技術及複習表"}, {"from": 64, "to": 70, "kind": "exam", "note": "眼底與OCT定位、治療適應、無痛視損、遗傳與药毒性；含原稿缺圖限制"}], "entries": [{"id": "c01", "title": "眼底方向與周邊界線", "pages": [2, 3], "unitId": "u1", "sectionIndexes": [0], "terms": ["Optic disc", "Macula", "Fovea", "Ora serrata", "Vortex veins"], "keyPoints": ["視神經盤位在黃斑鼻側；讀左右眼時先找視盤、黃斑及血管走向。Fovea是黃斑中心的精細視覺區，ora serrata是神經視網膜前方終點，中央照片並不涵蓋所有周邊。", "視網膜動靜脈在視盤附近進出，脈絡膜循環則另有動脈與渦靜脈回流。描述眼底時把位置、層次與血管系統拆開，避免把每條可見血管都叫視網膜動脈。"], "clinicalLink": "新周邊陰影即使中心凹仍好，也要檢查到相應周邊。", "pitfall": "黃斑不是泛指整個後極，也不能只靠照片左右推斷患者左右眼。", "recall": {"question": "視盤通常在黃斑哪側？", "answer": "鼻側。"}, "relatedTopics": ["notes-01"], "sourceIds": ["ret-rd-atlas"]}, {"id": "c02", "title": "十層解剖：細胞體、突觸與支持細胞", "pages": [4, 5, 12, 28], "unitId": "u1", "sectionIndexes": [0], "terms": ["ILM", "NFL", "GCL", "IPL", "INL", "OPL", "ONL", "ELM", "Photoreceptor", "RPE", "Müller cell"], "keyPoints": ["由玻璃體側往外依次辨認ILM、NFL、GCL、IPL、INL、OPL、ONL、ELM、感光細胞及RPE。NFL為神經節細胞軸突；GCL為其細胞體；INL含雙極、水平、無長突及Müller細胞核；ONL為感光細胞核。", "IPL与OPL是主要突觸層；Müller細胞橫跨神經視網膜提供結構與代謝支持，ILM與其基底膜相關，ELM涉及感光細胞與Müller細胞的接合。理解細胞所在，才能解釋不同OCT層次損伤。"], "clinicalLink": "將核層較暗、突觸／纖維層較亮的影像關係連到组织，而非死背白黑條紋。", "pitfall": "ELM不是獨立的一張真正膜，不能拿名稱直接推組織學。", "recall": {"question": "ONL主要是哪些細胞的核？", "answer": "感光細胞，即視桿與視錐細胞。"}, "relatedTopics": ["notes-03"], "sourceIds": ["ret-oct", "ret-rd-atlas"]}, {"id": "c03", "title": "感光細胞、RPE與Bruch膜的功能鏈", "pages": [4, 5, 41], "unitId": "u1", "sectionIndexes": [0], "terms": ["Rod", "Cone", "Inner segment", "Outer segment", "Visual cycle", "Bruch membrane", "Middle limiting membrane"], "keyPoints": ["視桿負責低照度敏感度，三類視錐提供不同波長敏感度；內節含能量與合成機構，外節盤膜參與光轉導。RPE吞噬外節、支持視覺循環、吸收散射光並維持外屏障。", "Bruch膜含兩側基底膜、中間彈性層與內外膠原層，是RPE和脈絡膜间的界面。來源圖的middle limiting membrane是OPL附近的組織學描述，不宜誤加成第十一層或與真正分離界面混同。"], "clinicalLink": "外層病變可先影响暗適應、色覺或中央功能，RPE與感光細胞損害需一起評估。", "pitfall": "三類視錐不是三種只辨識單一純色的感受器。", "recall": {"question": "為何RPE損傷會連帶影響感光細胞？", "answer": "它參與營養支持、外節更新與視覺循環。"}, "relatedTopics": ["notes-09"], "sourceIds": ["ret-rd-atlas", "ret-oct"]}, {"id": "c04", "title": "雙重循環與內外血視網膜屏障", "pages": [3, 5, 14, 19], "unitId": "u1", "sectionIndexes": [0], "terms": ["Central retinal artery", "Choriocapillaris", "Inner blood-retinal barrier", "Outer blood-retinal barrier"], "keyPoints": ["中央視網膜循環主要供應內層，脈絡膜毛細血管支援外層感光細胞與RPE。中心凹内層移開、血管配置特殊，能解釋部分缺血病變的眼底對比。", "內血視網膜屏障關鍵是視網膜血管內皮的緊密連接，外屏障主要在RPE細胞間；Bruch膜與脈絡膜是支持界面，不能把三者合稱一個等效密封層。屏障破壞造成漏液，灌流不足則造成缺血。"], "clinicalLink": "看到水腫與棉絮斑時，分別追問屏障失效與神經纖維層缺血。", "pitfall": "RPE本身沒有血管，不能說它內部血流供養神經視網膜。", "recall": {"question": "漏液和缺血是否同一機轉？", "answer": "不是，前者重點為通透性，後者為灌流不足。"}, "relatedTopics": ["notes-09"], "sourceIds": ["ret-dr", "ret-rd-atlas"]}, {"id": "c05", "title": "直接、間接眼底鏡與檢查範圍", "pages": [6, 29, 32, 33], "unitId": "u1", "sectionIndexes": [1], "terms": ["Direct ophthalmoscopy", "Indirect ophthalmoscopy", "Corneal topography"], "keyPoints": ["直接眼底鏡提供正立虛像、視野較小；雙眼間接眼底鏡配合聚光鏡形成倒立實像，能得到较廣範圍與立體線索。周邊裂孔的排查不能由一張中央眼底照片代替。", "角膜地形圖描述前節屈光形態，不能直接評估玻璃體與視網膜；當眼底不清，需按介質混濁程度選超音波等替代檢查。"], "clinicalLink": "選檢查先說想找中央病灶、周邊裂孔或混濁後方的結構。", "pitfall": "「沒看見」可能只是視野不足，不能當沒有裂孔。", "recall": {"question": "間接眼底鏡的影像與主要優勢？", "answer": "倒立實像，周邊視野較廣並可有立體感。"}, "relatedTopics": ["notes-01", "notes-02"], "sourceIds": ["ret-rd-atlas"]}, {"id": "c06", "title": "ERG波形：測的是功能，不是照片", "pages": [6, 7, 28, 31, 33, 56], "unitId": "u1", "sectionIndexes": [1], "terms": ["Full-field ERG", "a-wave", "b-wave", "c-wave", "Oscillatory potentials", "Multifocal ERG", "Pattern ERG"], "keyPoints": ["全視野ERG整合大範圍視網膜對光的反應；a波主要反映感光細胞，b波主要與ON雙極細胞等內層活動相關，Müller細胞亦參與電流環境。慢c波與RPE／感光細胞系統相關，並非一般閃光ERG每次都常規量測。", "Oscillatory potentials反映內層網絡，不宜簡寫成只來自單一Müller細胞。多焦ERG提供區域黃斑功能地圖，pattern ERG較著重內層／神經節功能；檢查種類決定可以回答的問題。"], "clinicalLink": "全視野正常仍可能有局限黃斑病，藥毒性時需選相符的區域檢查。", "pitfall": "ERG正常不能單独證明詐盲；時間常數也不能一律說成數秒。", "recall": {"question": "全視野與多焦ERG主要資訊差異？", "answer": "整體視網膜功能與局部區域功能分布。"}, "relatedTopics": ["notes-03", "notes-13"], "sourceIds": ["ret-erg"]}, {"id": "c07", "title": "EOG與VEP：把RPE和視路分開", "pages": [7, 8, 28], "unitId": "u1", "sectionIndexes": [1], "terms": ["EOG", "Arden ratio", "Light peak", "Dark trough", "VEP", "P100"], "keyPoints": ["EOG记录眼球转动時角膜与眼後方的靜電位變化，比較明暗適應的light peak與dark trough；Arden ratio反映RPE–感光細胞系統功能，需配合實驗室正常範圍與疾病背景。", "VEP在枕葉记录視覺刺激的誘發反應，pattern VEP的P100潛時是常用指標；屈光、介質、黄斑、注意力及視路都會影響結果。ERG與VEP互補，但單項正常不能直接貼非器質性視損標籤。"], "clinicalLink": "主訴與結構不一致時，先排檢查技術與範圍限制，再整合功能定位。", "pitfall": "VEP不是只量視神經，也不能以P100正常排除所有視覺疾病。", "recall": {"question": "EOG最關聯哪個組織系統？", "answer": "RPE與感光細胞系統的明暗適應反應。"}, "relatedTopics": ["notes-03"], "sourceIds": ["ret-eog", "ret-erg"]}, {"id": "c08", "title": "彩照、濾光與自體螢光", "pages": [8, 28, 29, 55], "unitId": "u1", "sectionIndexes": [1], "terms": ["Color fundus photography", "Infrared", "Red-free", "Cobalt blue", "Fundus autofluorescence", "SLO"], "keyPoints": ["彩色眼底照片提供分布與顏色；red-free綠光增强血管／神經纖維對比，紅外線較有助深層與RPE變化。Cobalt blue常用於螢光觀察等特定用途，不是所有機器同樣的神經纖維檢查設定。", "自體螢光利用組織自身螢光物質，能顯示RPE相關代謝或組織喪失的分布；高訊號與低訊號都需考慮組織含量及遮蔽。SLO是掃描雷射成像平台，不等於單一病因檢驗。"], "clinicalLink": "看FAF需回到同位置的OCT與照片，避免把所有亮區都當活動炎症。", "pitfall": "FAF不需靜脈染劑，不能與FA混為一談。", "recall": {"question": "自體螢光與FA最大差別？", "answer": "前者使用自身螢光，後者觀察注射染劑循環。"}, "relatedTopics": ["notes-01", "notes-13"], "sourceIds": ["ret-oct"]}, {"id": "c09", "title": "FA與ICGA：漏液、阻擋與灌流", "pages": [8, 9, 20, 29, 42, 44], "unitId": "u1", "sectionIndexes": [1], "terms": ["Fluorescein angiography", "Indocyanine green angiography", "Leakage", "Staining", "Window defect", "Blocked fluorescence", "Nonperfusion"], "keyPoints": ["FA较适合視網膜循環與滲漏，ICGA利用近紅外與高蛋白結合染劑補充脈絡膜資訊。判讀須看早晚時相：漏液邊界擴散、染色保留組織輪廓，window defect則是遮光組織減少而透出背景螢光。", "暗區可能來自出血／色素阻擋或真正無灌流，不能僅看一張黑白圖判斷。微動脈瘤可充填高螢光，而出血可遮蔽成暗區；配合彩照才知道兩個紅點是否同一病理。"], "clinicalLink": "說明影像時先描述時相與訊號機轉，再命名疾病。", "pitfall": "ICGA有助PCV，不等於FA與ICGA必須每次同時安排。", "recall": {"question": "低螢光一定表示缺血嗎？", "answer": "不，出血或色素遮蔽也能造成低螢光。"}, "relatedTopics": ["notes-01", "notes-09"], "sourceIds": ["ret-pcv", "ret-oct"]}, {"id": "c10", "title": "OCT原理與技術世代", "pages": [10, 11, 14, 15, 28], "unitId": "u1", "sectionIndexes": [1], "terms": ["Interferometry", "Time-domain OCT", "Spectral-domain OCT", "Swept-source OCT", "Fourier-domain OCT"], "keyPoints": ["OCT以低同調干涉比較組織與參考光，重建深度反射訊號。Time-domain靠參考路徑掃描；spectral-domain與swept-source屬Fourier-domain方法，分別分析光譜或掃頻訊號，能加快體積掃描。", "長波長與高速可有利較深脈絡膜和更廣掃描，但實際速度、解析度及波長隨機型而異。後段SS-OCT常見約1050nm，不能把來源1300nm當所有後段機器的固定規格。"], "clinicalLink": "選技術要回到是否需看深部、廣範圍或細小結構，而非把最新世代視為萬能。", "pitfall": "OCT不是組織切片，也無法以漂亮影像取代臨床檢查。", "recall": {"question": "SD與SS的共同大類？", "answer": "Fourier-domain OCT。"}, "relatedTopics": ["notes-01", "notes-02"], "sourceIds": ["ret-oct"]}, {"id": "c11", "title": "外層四條亮帶與OCT解剖命名", "pages": [11, 12, 13, 28, 43], "unitId": "u1", "sectionIndexes": [0, 1], "terms": ["External limiting membrane", "Ellipsoid zone", "Interdigitation zone", "RPE-Bruch complex", "IS/OS junction"], "keyPoints": ["外層OCT常辨認ELM、ellipsoid zone（EZ）、interdigitation zone（IZ）及RPE–Bruch複合帶。舊稱IS/OS junction的第二條亮帶，現多稱EZ；第三帶不能簡單說成RPE tight junction。", "EZ連續性可提供感光細胞完整性的線索，但訊號受掃描品質及其他組織影響。先看原始切面、定位中央凹，再談某亮帶是否中斷，不把組織學每個薄層都當儀器可獨立解析。"], "clinicalLink": "以外層完整性配合視功能，解釋液體消退後視力可能仍受限。", "pitfall": "RPE與Bruch膜在常規影像常呈複合帶，勿過度指定細微邊界。", "recall": {"question": "IS/OS舊名稱常對應現在哪一帶？", "answer": "Ellipsoid zone。"}, "relatedTopics": ["notes-13"], "sourceIds": ["ret-oct"]}, {"id": "c12", "title": "OCTA：分層血流訊號與偽影", "pages": [11, 13, 14, 28], "unitId": "u1", "sectionIndexes": [1], "terms": ["OCTA", "Superficial plexus", "Deep plexus", "Outer retinal slab", "Choriocapillaris slab", "Segmentation artifact", "Projection artifact"], "keyPoints": ["OCTA由重複掃描中的運動對比推測血流，分成浅层、深层、外層與脈絡膜毛細血管等slab。正常外層視網膜本來缺少血管；在此看到血流網絡需考慮新生血管，也需排除投影。", "分層錯誤、低訊號、眼動或過慢血流可造成假缺血／假血管。OCTA不直接展示染劑滲漏；血管密度圖與厚度圖也不是同一量測，須回到B-scan確認。"], "clinicalLink": "先核對分層線與訊號品質，才把血流網絡接到CNV或缺血。", "pitfall": "不能因OCTA無訊號就直接說血管完全沒有灌流。", "recall": {"question": "OCTA能否直接量到FA式滲漏？", "answer": "不能，它主要顯示血流相關運動訊號。"}, "relatedTopics": ["notes-01", "notes-07"], "sourceIds": ["ret-oct"]}, {"id": "c13", "title": "掃描策略、3D重建與漏診風險", "pages": [13, 14, 15], "unitId": "u1", "sectionIndexes": [1], "terms": ["Radial scan", "Raster scan", "Volume scan", "Three-dimensional reconstruction"], "keyPoints": ["以中心凹為中心的radial scan提供多方向切面，raster／volume scan以密集相鄰切面重建區域。稀疏切線之間仍可能有漏掉病灶，尤其小病灶或偏心病灶。", "3D重建讓表面、玻璃體腔隙與黃斑形態更易理解，卻仍取決於原始訊號與分割。來源的玻璃體cavity展示的是結構空間，不應僅因有腔隙便判定病理性囊腫。"], "clinicalLink": "症狀位置與既有掃描不一致時，要補相應位置而非只重讀同一條線。", "pitfall": "「所有重要病變都在fovea」是不正確的範圍假設。", "recall": {"question": "為何黃斑OCT正常不能排除周邊裂孔？", "answer": "掃描範圍與要排除的周邊病灶不相同。"}, "relatedTopics": ["notes-01"], "sourceIds": ["ret-oct", "ret-rd-atlas"]}, {"id": "c14", "title": "A-scan、B-scan與Doppler各回答什麼", "pages": [16, 29], "unitId": "u1", "sectionIndexes": [1], "terms": ["A-scan", "B-scan", "Doppler ultrasound", "Ultrasound biomicroscopy", "Choroidal detachment"], "keyPoints": ["A-scan提供距離反射資訊，可用於眼軸等量測；B-scan呈現二维断面，介質混濁時有助發現剝離、腫塊與玻璃體異常。高頻前節超音波UBM則較著重前節與睫狀體。", "Doppler估計血流速度，不能不加血管截面與其他假設就當成體積流量。電腦化、3D或高解析是取得及重建方式，仍須依機器與組織特性判讀；懷疑開放性眼傷時避免施壓。"], "clinicalLink": "出血遮住眼底仍要想裂孔／剝離，超音波補足可見性，但不能保證排除所有小裂孔。", "pitfall": "來源A-scan「臨床不常用」不是所有場景均成立。", "recall": {"question": "玻璃體出血看不見後方時常用哪一項？", "answer": "B-scan超音波。"}, "relatedTopics": ["notes-01", "notes-06", "notes-08"], "sourceIds": ["ret-rd-atlas"]}, {"id": "c15", "title": "玻璃體老化與PVD的牽引機轉", "pages": [17, 18, 29, 30, 62, 66], "unitId": "u2", "sectionIndexes": [2], "terms": ["Vitreous collagen", "Hyaluronan", "Syneresis", "Posterior vitreous detachment", "Floaters", "Photopsia"], "keyPoints": ["玻璃體以水、膠原和玻尿酸等維持凝膠；液化與後皮質分離造成PVD，残存牢固黏附點可能被牽拉。飛蚊可來自玻璃體不均，閃光則可反映牽引刺激視網膜。", "PVD本身不等於視網膜剝離，但新飛蚊、閃光、出血或幕簾需要及時散瞳周邊檢查。中央視力良好與沒有疼痛均不能排除裂孔。"], "clinicalLink": "將症狀、黏附位置及後续追蹤接成一條機械路徑。", "pitfall": "頻繁用電腦或熬夜不能直接證明PVD或裂孔病因。", "recall": {"question": "PVD為何會造成裂孔？", "answer": "分離時在牢固黏附处施加牽引。"}, "relatedTopics": ["notes-14"], "sourceIds": ["ret-rd-nei", "ret-rd-video"]}, {"id": "c16", "title": "玻璃體出血、炎症與眼內異物", "pages": [17, 18, 29, 31, 33, 66, 67, 70], "unitId": "u2", "sectionIndexes": [2, 11], "terms": ["Vitreous hemorrhage", "Vitritis", "Retinal tear", "Intraocular foreign body", "IOFB"], "keyPoints": ["玻璃體本身無血管，出血多來自視網膜或相關病灶：需分PDR新生血管、裂孔、靜脈阻塞、外傷及其他原因。閃光可以與出血並存，不能用舊考古「有閃光就不是VH」排除。", "Vitritis可感染或非感染，混濁也可能由血球或腫瘤造成；眼內異物需有外傷史與適當影像，金屬異物未排除前不能任意安排MRI。辨認內容物比只說「玻璃體混濁」更具處置意義。"], "clinicalLink": "急性出血若遮住周邊，安排專科影像與追蹤並交代新幕簾警訊。", "pitfall": "眼底看不見時不能先假定是糖尿病出血。", "recall": {"question": "新VH為何要特別排裂孔？", "answer": "出血可由裂孔牽斷血管造成，也會遮蔽裂孔本身。"}, "relatedTopics": ["notes-05", "notes-09"], "sourceIds": ["ret-rd-atlas", "ret-masquerade"]}, {"id": "c17", "title": "星狀玻璃體與膽固醇結晶", "pages": [17, 29, 30], "unitId": "u1", "sectionIndexes": [2], "terms": ["Asteroid hyalosis", "Synchysis scintillans", "Cholesterolosis bulbi"], "keyPoints": ["Asteroid hyalosis是玻璃體內鈣脂質小體，常随凝膠活動而保持懸浮，很多患者中央功能仍好，但眼底觀察與影像可能受到干擾。", "Synchysis scintillans則為膽固醇結晶，常在液化、曾出血或慢性受損眼中隨重力沉降。兩者成分、活動與背景不同，不能只因亮晶晶便視為同病，也不是診斷糖尿病的特異徵象。"], "clinicalLink": "先辨認沉積的活動方式，再區分是否真正需要治療或僅妨碍必要檢查。", "pitfall": "星狀玻璃體不等於感染性白色病灶。", "recall": {"question": "哪種沉積物與膽固醇結晶相關？", "answer": "Synchysis scintillans。"}, "relatedTopics": ["notes-09"], "sourceIds": ["ret-rd-video"]}, {"id": "c18", "title": "PFV與白瞳的兒童急迫性", "pages": [17, 51, 62], "unitId": "u1", "sectionIndexes": [9], "terms": ["Persistent fetal vasculature", "PFV", "PHPV", "Leukocoria", "Microphthalmia"], "keyPoints": ["Persistent fetal vasculature是胎兒血管系統未充分退化，舊稱PHPV，可有晶狀體後纖維血管膜、牽引及小眼球。前段或後段受累的范围决定預後及保眼、視覺發育策略。", "白瞳也可能來自視網膜母細胞瘤、Coats、先天白內障、ROP或剝離。不能看見小眼球或纖維膜就省略完整檢查，兒童需及時專科排除腫瘤與處理弱視。"], "clinicalLink": "把白瞳當成需要找原因的警訊，而非照片上直接命名。", "pitfall": "白瞳不是視網膜母細胞瘤專屬，但腫瘤必須優先排除。", "recall": {"question": "PHPV現在常用什麼名稱？", "answer": "Persistent fetal vasculature，PFV。"}, "relatedTopics": ["notes-04", "notes-06"], "sourceIds": ["ret-rb"]}, {"id": "c19", "title": "DR病理：滲漏、閉塞與VEGF", "pages": [19, 23, 30], "unitId": "u3", "sectionIndexes": [3], "terms": ["Pericyte loss", "Basement membrane thickening", "Capillary closure", "VEGF", "Blood viscosity"], "keyPoints": ["周細胞流失、基底膜改變及內皮損傷使微血管屏障失效，也促成閉塞；血小板、紅血球聚集與血液流變改變共同影響微循環。缺血上調VEGF，增加通透性並促進新生血管。", "糖尿病病程、血糖、血壓、血脂與腎臟等背景影响風險，但不能把舊年代的固定年數百分比當個人預後。定期眼底檢查的目的，是在症狀之前發現可處理的病變。"], "clinicalLink": "同時控制全身代謝與眼部病灶，兩者不能互相替代。", "pitfall": "VEGF不是唯一機轉，黃斑水腫亦不等同增殖期。", "recall": {"question": "滲漏與閉塞各較容易造成什麼？", "answer": "漏液致水腫；缺血可驅動新生血管。"}, "relatedTopics": [], "sourceIds": ["ret-dr"]}, {"id": "c20", "title": "NPDR眼底病灶的層次與意義", "pages": [19, 20, 21, 28, 30], "unitId": "u3", "sectionIndexes": [3], "terms": ["Microaneurysm", "Dot-blot hemorrhage", "Hard exudate", "Cotton-wool spot", "Venous beading", "IRMA"], "keyPoints": ["微動脈瘤與點斑狀出血常位於微血管病變區，硬性滲出物是脂質等漏出後沉積；棉絮斑則為神經纖維層局部缺血造成的軸漿流阻塞，不是另一種脂質。", "靜脈成珠與IRMA提示较嚴重缺血；IRMA是視網膜內微血管異常，不能仅因稱「異常血管」便算越過ILM的新生血管。必要時用影像確認位置、灌流與滲漏。"], "clinicalLink": "描述照片時先分紅點、黃沉積、表層白斑和血管變化，再作分期。", "pitfall": "不能把所有白點都叫soft exudate，也不能將IRMA直接歸為PDR。", "recall": {"question": "硬性滲出與棉絮斑的機轉差別？", "answer": "前者漏出沉積；後者神經纖維層缺血。"}, "relatedTopics": [], "sourceIds": ["ret-dr", "ret-pdr-trial"]}, {"id": "c21", "title": "NPDR分期與PDR的分界", "pages": [19, 21, 22, 30, 31, 33], "unitId": "u3", "sectionIndexes": [3], "terms": ["Mild NPDR", "Moderate NPDR", "Severe NPDR", "4-2-1 rule", "NVD", "NVE"], "keyPoints": ["輕度NPDR以微動脈瘤為代表；中度為介於輕度與嚴重標準間的變化。嚴重NPDR常以4-2-1規則整合四象限較多出血、至少二象限靜脈成珠或至少一象限明顯IRMA，且尚無PDR。", "視盘新生血管NVD或其他位置新生血管NVE代表增殖病變。它們跨出正常視網膜血管界面，會出血及形成纖維血管膜；DME是另一條分層，不限定發生在某一期。"], "clinicalLink": "先完成散瞳全眼底分期，再獨立記黃斑是否受累。", "pitfall": "不能拿單張中央照片的病灶數，保證整眼不符合嚴重NPDR。", "recall": {"question": "DME會自動把NPDR改成PDR嗎？", "answer": "不會；PDR由新生血管等增殖特徵界定。"}, "relatedTopics": [], "sourceIds": ["ret-dr", "ret-pdr-trial"]}, {"id": "c22", "title": "PDR的出血、牽引與新生血管青光眼", "pages": [22, 23, 30, 31], "unitId": "u3", "sectionIndexes": [3, 5], "terms": ["Fibrovascular proliferation", "Preretinal hemorrhage", "Boat-shaped hemorrhage", "Tractional retinal detachment", "NVI", "Neovascular glaucoma"], "keyPoints": ["新生血管脆弱且常伴纖維組織，可形成視網膜前或玻璃體出血；局部血液受界面限制時可呈舟狀。膜收縮把視網膜拉起，形成牽引性剝離，若再出現裂孔則可合併裂孔性成分。", "缺血訊號也可造成虹膜新生血管NVI及隅角纖維血管膜，引起新生血管性青光眼。治療眼壓與處理視網膜缺血需協同，單純降壓不能消除源頭。"], "clinicalLink": "PDR視力下降要分黄斑水腫、出血、牽引與眼壓問題。", "pitfall": "不是每次打完抗VEGF有出血都等同治療失敗，要看結構及時間。", "recall": {"question": "為何PDR病人可能同時找視網膜與青光眼團隊？", "answer": "缺血驅動後段增殖與前段新生血管性青光眼。"}, "relatedTopics": ["notes-07"], "sourceIds": ["ret-dr", "ret-pdr-trial"]}, {"id": "c23", "title": "DME：中心受累與功能决定策略", "pages": [20, 21, 24, 25, 30], "unitId": "u3", "sectionIndexes": [3], "terms": ["Diabetic macular edema", "Center-involving DME", "Anti-VEGF", "Intravitreal corticosteroid", "Focal-grid laser"], "keyPoints": ["OCT顯示視網膜內囊腔、增厚及可能的視網膜下液體；需記是否累及中心及視力，而非只有「有水」。對影響視力的中心受累DME，抗VEGF常是重要選項，良好視力者策略可能不同。", "類固醇適用於部分選定情境，需衡量眼壓与白內障；局部／格狀雷射亦有特定角色，並非每個NPDR都該打雷射。治療目標是改善或穩定功能，同時管理缺血和全身風險。"], "clinicalLink": "用視力、中心OCT與治療反應說明追蹤，不能只追厚度數字。", "pitfall": "沒有必要把來源「pico-second雷射」當DME通用標準。", "recall": {"question": "DME是否一定需同一種注射？", "answer": "否，依中心受累、視力、反應及個人風險選擇。"}, "relatedTopics": ["notes-06", "notes-07"], "sourceIds": ["ret-dr"]}, {"id": "c24", "title": "PDR治療：修正舊考古anti-VEGF禁用說", "pages": [23, 24, 25, 30, 31, 33], "unitId": "u3", "sectionIndexes": [3], "terms": ["Panretinal photocoagulation", "PRP", "Protocol S", "Ranibizumab", "Vitrectomy", "Anti-VEGF crunch"], "keyPoints": ["PRP減少缺血驅動的新生血管活動；Protocol S等原始試驗支持抗VEGF也是PDR治療選項，因此舊共筆把「anti-VEGF可治PDR」判錯，不能照背。需要考量回診持續性、注射負擔及合併DME。", "不吸收出血或威脅中心的牽引可能需要玻璃體手術。已有大量纖維增殖者使用抗VEGF，須由專科衡量膜收縮加劇（crunch）風險與手術時序；不是所有PDR都禁用，也非注射能解除既有牽引。"], "clinicalLink": "將新生血管控制與機械牽引分開，解釋為何同一人可需雷射、注射及手術。", "pitfall": "注射有效不代表可以失去追蹤；PRP後也仍需監測。", "recall": {"question": "Anti-VEGF能否作為PDR治療選項？", "answer": "可以，需依個案及可靠追蹤選擇。"}, "relatedTopics": ["notes-07"], "sourceIds": ["ret-pdr-trial", "ret-dr"]}, {"id": "c25", "title": "動脈硬化與高血壓眼底：形態和急症分開", "pages": [25, 26, 27, 30], "unitId": "u3", "sectionIndexes": [4], "terms": ["AV nicking", "Bonnet sign", "Copper wiring", "Silver wiring", "Hypertensive retinopathy", "Macular star", "Disc edema"], "keyPoints": ["慢性動脈硬化可使反光增強、銅線／銀線樣外觀及動靜脈交叉處壓迫；AV nicking與Bonnet等描述反映交叉處静脈變化。這些慢性徵象不能單独推算當下血壓值。", "急性嚴重高血壓可有出血、棉絮斑、黃斑星芒與視神經盤水腫；出現這些表徵需立即評估全身靶器官損傷。不同分級系統定義不完全相同，不把舊稿硬化分級混成高血壓分級。"], "clinicalLink": "讀圖後量血壓並問神經、胸痛與腎臟症狀，使眼底發現連到全身處理。", "pitfall": "有視盤水腫不等於一定顱內壓上升，也可能嚴重高血壓。", "recall": {"question": "銀線樣動脈表示哪類改變？", "answer": "慢性血管壁硬化相關的反光與不透明改變。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["ret-ois", "ret-rvo"]}, {"id": "c26", "title": "三種視網膜剝離與中心凹狀態", "pages": [18, 34, 35, 59, 64, 67, 69, 70], "unitId": "u2", "sectionIndexes": [5], "terms": ["Rhegmatogenous RD", "Tractional RD", "Exudative RD", "Macula-on", "Macula-off"], "keyPoints": ["裂孔性剝離由液體經裂孔進入神經視網膜與RPE之間；牽引性由纖維組織拉起；滲出性由炎症、血管或腫瘤相關漏液形成。多種機轉可以並存，不是只看有沒有液體。", "確認中心凹是否仍贴附及進展速度，需及時視網膜專科決策。中心凹已剝離也不能說不緊急或永遠不可能改善，預後取決於時程、病灶與修復情況。"], "clinicalLink": "交班包含裂孔、牽引、剝離範圍與中心凹狀態，讓術式評估有依據。", "pitfall": "不能把所有SRF都稱需手術的裂孔性RD。", "recall": {"question": "三型各自要處理的主因？", "answer": "液體通道、牽引力或造成滲漏的疾病。"}, "relatedTopics": ["notes-09", "notes-14"], "sourceIds": ["ret-rd-atlas", "ret-rd-nei"]}, {"id": "c27", "title": "裂孔形態：馬蹄、蓋孔、萎縮孔與dialysis", "pages": [34, 59], "unitId": "u2", "sectionIndexes": [2, 5], "terms": ["Horseshoe tear", "Operculated hole", "Atrophic hole", "Retinal dialysis", "Giant retinal tear", "Lattice degeneration"], "keyPoints": ["馬蹄形裂孔常仍受玻璃體牽引；蓋孔型有被拉起的組織蓋，牽引状态可能不同；萎縮孔與局部薄化相關。Retinal dialysis位於鋸齒緣附近分離，巨型裂孔則涉及大范围全层断裂。", "Lattice degeneration是周邊格子狀薄化與黏附異常的背景，可合併孔或裂孔。是否預防治療需看症狀、牽引、液體及風險，不能所有無症狀周邊病灶一律雷射。"], "clinicalLink": "描述形態比只說「有洞」更能估計持續牽引與剝離風險。", "pitfall": "不同裂孔的處理不能只按洞的外觀大小決定。", "recall": {"question": "馬蹄形裂孔最應想到哪個力？", "answer": "仍存在的玻璃體牽引。"}, "relatedTopics": [], "sourceIds": ["ret-rd-video", "ret-rd-atlas"]}, {"id": "c28", "title": "PVR與剝離形態：不是水越少越簡單", "pages": [35, 59], "unitId": "u2", "sectionIndexes": [5], "terms": ["Proliferative vitreoretinopathy", "PVR", "Retinal folds", "Bullous detachment", "Shallow detachment"], "keyPoints": ["PVR是細胞增殖與膜收縮造成固定皺摺和牽拉，可使視網膜不易復位或再次剝離。它與PDR的新生血管增殖不同，即使沒有糖尿病也可出現。", "淺層或高隆起bullous形態反映液體與視網膜構型，並不能單獨决定病因、時程或難度；仍需寻找裂孔、PVR、中心凹及其他合併问题。"], "clinicalLink": "術前描述固定皺摺與牽引，有助解釋為何手術方案可能較複雜。", "pitfall": "PVR不是單純「視網膜折一下」的外觀名稱。", "recall": {"question": "PVR與PDR的P都代表同一病嗎？", "answer": "不是，前者是剝離相關膜增殖收縮，後者是糖尿病增殖病變。"}, "relatedTopics": [], "sourceIds": ["ret-rd-atlas", "ret-rd-video"]}, {"id": "c29", "title": "玻璃體切除：通道、光源、切割與填充", "pages": [36, 59, 69, 70], "unitId": "u2", "sectionIndexes": [6], "terms": ["Pars plana vitrectomy", "Infusion", "Illumination", "Cutter", "Gauge", "Pharmacologic vitreolysis"], "keyPoints": ["常見三通道玻璃體切除分別提供灌注維持眼球、照明及切割／抽吸；infusion不是單純抽液管。經平坦部進入可避開部分重要組織，但位置與規格仍需依年齡、晶狀體及術式決定。", "手術可解除牽引、清除混濁、處理裂孔並合併填充；gauge數字大通常表示口徑較細。Pharmacologic vitreolysis則嘗試以酶類解除特定黏附，並非所有玻璃體病可取代手術。"], "clinicalLink": "把手術每個步驟連到視野、眼壓維持或牽引解除，形成可理解的口試答案。", "pitfall": "不能將任何填充物都稱永久留置且可吸收。", "recall": {"question": "三通道中的infusion主要目的？", "answer": "維持適當眼內液量與眼球形態。"}, "relatedTopics": ["notes-06"], "sourceIds": ["ret-rd-atlas"]}, {"id": "c30", "title": "鞏膜扣壓、氣體固定、雷射與冷凍", "pages": [36, 37, 59, 64, 67, 69, 70], "unitId": "u2", "sectionIndexes": [6], "terms": ["Scleral buckle", "Pneumatic retinopexy", "Laser retinopexy", "Cryopexy"], "keyPoints": ["鞏膜扣壓從眼外支持裂孔區并減少牽引，矽膠帶通常留置，不是舊稿所說貼好12–24小時便常規取出。Pneumatic retinopexy在合適裂孔與病人配合條件下以氣體支持，配合黏著處理。", "雷射或冷凍形成周圍黏著，可用於裂孔及選定局限情境；已廣泛剝離或有明顯牽引時，不能靠「把水封住」概括治療。各術式依裂孔、晶狀體、PVR與個案條件選用。"], "clinicalLink": "口試先說機轉與選擇條件，再談術式名稱。", "pitfall": "不是「choroidal buckling」，也不能宣稱所有RD都只需雷射。", "recall": {"question": "Scleral buckle支持的是哪裡？", "answer": "從鞏膜外面向內支持對應裂孔與視網膜區域。"}, "relatedTopics": [], "sourceIds": ["ret-rd-atlas", "ret-rd-video"]}, {"id": "c31", "title": "氣體、矽油與重液：填充物決定術後限制", "pages": [36, 37, 59, 69, 70], "unitId": "u2", "sectionIndexes": [6], "terms": ["SF6", "C2F6", "C3F8", "Silicone oil", "Perfluorocarbon liquid", "Nitrous oxide", "N2O"], "keyPoints": ["SF6、C2F6與C3F8等眼內氣體可能膨脹并隨時間吸收，持續时间取決於種類及濃度。氣體存在時搭機／高海拔與N2O麻醉可造成危險眼壓上升，需要明確告知相關團隊。", "Silicone oil為不易自行吸收的填充物，是否移除需另評估；perfluorocarbon重液常作術中壓平與液體操作工具，不能把它與矽油或可吸收氣體混成同一种術後狀態。"], "clinicalLink": "術後教育以實際填充物、殘留及團隊指定姿勢為準。", "pitfall": "不能以固定術後天數保證可以搭機。", "recall": {"question": "有眼內氣體時需特別提醒麻醉避免什麼？", "answer": "N2O，並告知氣體仍存在。"}, "relatedTopics": ["notes-14"], "sourceIds": ["ret-rd-atlas", "ret-rd-nei"]}, {"id": "c32", "title": "CRVO：四象限出血與缺血風險", "pages": [38, 59, 65, 67, 69], "unitId": "u3", "sectionIndexes": [4], "terms": ["Central retinal vein occlusion", "Ischemic CRVO", "Nonischemic CRVO", "Neovascularization of iris"], "keyPoints": ["CRVO可見廣泛視網膜出血、靜脈擴張迂曲、視盤及黃斑水腫；應評估缺血程度與視功能，而不是分成AMD式dry／wet。缺血型發生NVI及新生血管青光眼的風險较高。", "黃斑水腫常需抗VEGF等選定治療，并監測虹膜、隅角与後段新生血管；一次注射后改善不代表缺血風險消失。源頭是視網膜靜脈回流問題，不是必然有脈絡膜新生血管。"], "clinicalLink": "眼部追蹤與血壓、糖脂及其他全身风险評估並行。", "pitfall": "不把來源固定60%新生血管數值套用所有CRVO。", "recall": {"question": "CRVO最需分開追蹤的兩條線？", "answer": "黃斑水腫與缺血／新生血管。"}, "relatedTopics": ["notes-07"], "sourceIds": ["ret-rvo"]}, {"id": "c33", "title": "BRVO：血管交叉處與區域分布", "pages": [39, 59, 60], "unitId": "u3", "sectionIndexes": [4], "terms": ["Branch retinal vein occlusion", "Arteriovenous crossing", "Sectoral hemorrhage", "Macular edema"], "keyPoints": ["BRVO常在動靜脈交叉處發生静脈回流阻塞，眼底出血及水腫沿受累支流分布。範圍較局部不表示中央視力一定好，若黃斑受累仍可显著视損。", "治療重點包括黄斑水腫與缺血相關新生血管，同时處理全身危险因子。不要把动脈栓子機轉直接套用至一般静脈阻塞；是否需要特殊凝血檢查由年齡与表型引導。"], "clinicalLink": "由出血分布先辨別中央或分支阻塞，再評估黄斑與灌流。", "pitfall": "不能把BRVO都說成表淺一小塊、可以忽略。", "recall": {"question": "BRVO與CRVO照片分布最基本差別？", "answer": "區域性支流分布與較廣泛四象限分布。"}, "relatedTopics": [], "sourceIds": ["ret-rvo"]}, {"id": "c34", "title": "CRAO：視網膜中風，分流不能等", "pages": [39, 59, 65, 66, 69], "unitId": "u3", "sectionIndexes": [4], "terms": ["Central retinal artery occlusion", "Cherry-red spot", "Retinal stroke", "RAPD", "Last known well"], "keyPoints": ["突發、無痛、重度單眼視損與RAPD提示急性视网膜／視神經損傷；CRAO可有內層視網膜白化與cherry-red spot，但早期未必所有典型徵象齐全。中心凹相對薄且依靠脈絡膜供血形成對比，不是紅點代表視力無虞。", "記錄最後正常時間，立即急診／中風與眼科評估，並查詢GCA線索。是否再灌流由當地專家依條件決定；眼球按摩、前房穿刺、carbogen等舊做法無可靠證據可取代急症分流。"], "clinicalLink": "同時保護眼部與辨認腦中風／心血管風險。", "pitfall": "不能以來源「90分鐘後必不可逆」作不轉送的理由。", "recall": {"question": "懷疑CRAO的首要行動？", "answer": "立即啟動急診中風及眼科評估。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["ret-crao"]}, {"id": "c35", "title": "BRAO與栓子：局部視野仍有全身意義", "pages": [40, 60], "unitId": "u3", "sectionIndexes": [4], "terms": ["Branch retinal artery occlusion", "Hollenhorst plaque", "Cholesterol embolus", "Calcific embolus"], "keyPoints": ["BRAO造成對應區域視網膜缺血與視野缺損，若未累及中心凹，视力表可能仍好。膽固醇Hollenhorst斑可與頸動脈等粥樣硬化來源相關，鈣化栓子則提示心瓣膜等不同来源。", "急性視網膜動脈缺血同樣需要緊急全身血管／中風評估，不能因範圍較小便當一般門診追蹤。栓子外观提供線索，仍須影像與心血管評估确认原因。"], "clinicalLink": "把良好中央視力與危險病因分開，避免以視力1.0降低急迫性。", "pitfall": "栓子顏色不能單獨指定全身病灶位置。", "recall": {"question": "BRAO中央视力好，為何仍需急評？", "answer": "急性視網膜缺血可能提示全身栓塞與中風風險。"}, "relatedTopics": ["notes-14"], "sourceIds": ["ret-crao", "ret-ois"]}, {"id": "c36", "title": "OIS：眼底線索指向更上游低灌流", "pages": [40, 60], "unitId": "u3", "sectionIndexes": [4], "terms": ["Ocular ischemic syndrome", "Carotid stenosis", "Delayed choroidal filling", "Rubeosis iridis"], "keyPoints": ["OIS常涉及嚴重頸動脈／眼動脈循環不足，可有周邊點斑出血、細動脈、眼部疼痛、前段炎症與虹膜新生血管。FA的脈絡膜充填延遲可協助與DR或CRVO區分。", "處置需同時評估全身血管風險與眼部新生血管／眼壓；頸動脈介入並非人人同一方式。中央視力、眼壓或單一出血形態都不能獨立排除低灌流。"], "clinicalLink": "看眼底後問全身短暫缺血症狀與血管背景，及時跨科轉介。", "pitfall": "不能把white-centered hemorrhage或CNV當作OIS必備且專一徵象。", "recall": {"question": "OIS為何不能只在眼內打針處理？", "answer": "上游低灌流牽涉全身血管疾病與缺血風險。"}, "relatedTopics": ["notes-03", "notes-07", "notes-14"], "sourceIds": ["ret-ois"]}, {"id": "c37", "title": "AMD與drusen：沉積位置、風險與視功能", "pages": [2, 41, 60, 66], "unitId": "u3", "sectionIndexes": [7], "terms": ["Age-related macular degeneration", "Hard drusen", "Soft drusen", "Confluent drusen", "Metamorphopsia"], "keyPoints": ["Drusen是RPE與Bruch膜間的細胞外沉積，不是RPE內lipofuscin的同義詞；硬、小而界清與較大、軟、融合性病灶的風險意義不同，還需一起看色素與萎縮。", "AMD主要影響中央精細視覺，早期可能無症狀。新變形視或中央暗點需及時排新生血管；風險照護包括戒菸、全身管理與依分期評估AREDS2配方，並非任何小drusen都需注射或雷射。"], "clinicalLink": "把病理沉積、分期和病人的閱讀／辨臉功能串起。", "pitfall": "不能說乾性AMD一定不會變濕性，也不能因仍有周邊視野便忽略中央失能。", "recall": {"question": "Drusen典型位在哪裡？", "answer": "RPE下方、Bruch膜相關界面。"}, "relatedTopics": [], "sourceIds": ["ret-ga", "ret-oct", "ret-amd"]}, {"id": "c38", "title": "地圖狀萎縮：慢進展治療不等於視網膜再生", "pages": [42, 60], "unitId": "u3", "sectionIndexes": [7], "terms": ["Geographic atrophy", "Pegcetacoplan", "Avacincaptad pegol", "Complement inhibition", "Low vision rehabilitation"], "keyPoints": ["GA涉及RPE、感光細胞及相關外層組織萎縮，可造成逐步擴大的中央或旁中心功能缺損。影像追蹤面積與位置有意義，視力表也可能低估閱讀受損。", "美國已核准pegcetacoplan及avacincaptad pegol等補體路徑治療，可減慢部分GA病灶擴大，但不能恢復已失去的組織；需衡量注射、轉為新生血管AMD及其他眼部風險。所在地適應症與可取得性須另核對。"], "clinicalLink": "治療與低視能復健並行，以保留功能和生活需求共同決策。", "pitfall": "舊稿「萎縮型完全不可治療」過時，反過來也不能宣稱注射可治癒。", "recall": {"question": "GA補體治療最合理的目標？", "answer": "減慢病灶擴大，而非恢復已萎縮視網膜。"}, "relatedTopics": [], "sourceIds": ["ret-ga"]}, {"id": "c39", "title": "黃斑新生血管type 1、2、3", "pages": [41, 42, 43, 44, 45, 60], "unitId": "u3", "sectionIndexes": [7], "terms": ["Macular neovascularization", "Type 1 MNV", "Type 2 MNV", "Type 3 MNV", "Retinal angiomatous proliferation", "RAP"], "keyPoints": ["Type 1新生血管位於RPE下，type 2位於RPE上方的視網膜下空間；type 3源於視網膜循環并向深部延展，常以RAP稱呼。這套分類以來源和位置為主，不是按患者年齡或族群直接指定。", "CNV／MNV可由AMD、近視或炎症相關機轉造成；PCV屬具有瘤樣結構特徵的類型1新生血管表型之一，不能反過來說所有type 1都是PCV。液體、出血与活動性影像共同影響處理。"], "clinicalLink": "用OCT與血管影像先定位，再把病灶接回病因。", "pitfall": "不能把RAP簡化成一條由脈絡膜先長上來的血管。", "recall": {"question": "Type 2位於RPE哪一側？", "answer": "RPE上方、神經視網膜下方。"}, "relatedTopics": [], "sourceIds": ["ret-oct", "ret-pcv"]}, {"id": "c40", "title": "IRF、SRF與PED：三個不同的空間", "pages": [43, 44, 60, 64, 65, 68, 69, 70], "unitId": "u1", "sectionIndexes": [1, 7], "terms": ["Intraretinal fluid", "Subretinal fluid", "Pigment epithelial detachment", "Serous PED", "Fibrovascular PED", "Drusenoid PED"], "keyPoints": ["IRF在神經視網膜內，SRF在神經視網膜與RPE之間，PED則是RPE與下方Bruch膜分離。讀OCT先連續追蹤RPE，再找液體在哪一側；三者可同時存在。", "PED內容可為漿液、纖維血管、drusen或血液，必須結合反射特性及血管影像。單憑PED或SRF不能確診PCV，也不能把任何SRF直接命名為同一類需要手術的RD。"], "clinicalLink": "將「空間描述」與「病因診斷」分兩步，可避免只凭黑腔選治療。", "pitfall": "低反射空腔不全是水腫；劈裂、退化性囊腔或偽影也需考慮。", "recall": {"question": "PED與SRF最直接區別？", "answer": "液體／物質在RPE下方或上方。"}, "relatedTopics": [], "sourceIds": ["ret-oct", "ret-pcv"]}, {"id": "c41", "title": "PCV：polyp、branching network與多種治療", "pages": [44, 46, 60, 61], "unitId": "u3", "sectionIndexes": [7], "terms": ["Polypoidal choroidal vasculopathy", "Aneurysmal type 1 neovascularization", "Branching vascular network", "ICGA", "Photodynamic therapy"], "keyPoints": ["PCV可見反覆漿液血性PED、視網膜下出血，ICGA有助辨認瘤樣擴張与分支血管網絡；OCT的尖峰／切跡PED等仅是提示，需整合表型。", "抗VEGF及選定情境的verteporfin PDT或合併治療都有證據。原稿「PCV只有aflibercept有效」及「PED一定加眼內類固醇」不是通則；依反應、出血與病灶條件選擇。"], "clinicalLink": "反覆出血、PED或抗VEGF反應不理想時，重新評估PCV及影像，而非盲目加藥。", "pitfall": "Type 1新生血管不等於所有病例都是PCV。", "recall": {"question": "為何PCV常加做ICGA？", "answer": "較能顯示polyp樣病灶與分支血管網。"}, "relatedTopics": [], "sourceIds": ["ret-pcv"]}, {"id": "c42", "title": "濕性AMD治療：抗VEGF為核心，歷史方案要辨證據", "pages": [46, 61, 65, 69], "unitId": "u3", "sectionIndexes": [7], "terms": ["Bevacizumab", "Ranibizumab", "Aflibercept", "Pegaptanib", "Verteporfin PDT", "TTT", "Submacular surgery"], "keyPoints": ["抗VEGF治療包含bevacizumab、ranibizumab、aflibercept等，各有作用構型與所在地核准／使用情境；bevacizumab眼內用途常屬off-label。舊藥pegaptanib與其他歷史方案應放在治療發展脈絡，不能推為當前唯一選項。", "Verteporfin PDT在選定病變仍有角色；TTT、IFN-alpha、放療與黃斑下取膜／移位等舊策略並非現在一般濕性AMD的常規主軸。眼內類固醇不是濕性AMD通用加法，更不能用舊考古搭配式替病人選藥。"], "clinicalLink": "追蹤液體、出血及功能，再調整策略；短期OCT改善不等於永久治癒。", "pitfall": "分子較小不能直接推論對所有患者更安全。", "recall": {"question": "濕性AMD是否常規使用類固醇加anti-VEGF？", "answer": "不是通則，抗VEGF為核心，合併方案依特定情境與證據。"}, "relatedTopics": [], "sourceIds": ["ret-pcv", "ret-ga"]}, {"id": "c43", "title": "黃斑下出血與tPA：時間、位置和病因", "pages": [42, 46, 61], "unitId": "u3", "sectionIndexes": [7], "terms": ["Submacular hemorrhage", "Tissue plasminogen activator", "tPA", "Pneumatic displacement"], "keyPoints": ["黃斑下出血可來自新生血管等病灶，影响感光細胞与物质交換；中央出血範圍、厚度、時程及RPE下／視網膜下位置都會影響策略。", "選定病例可能考慮tPA、氣體移位或手術，目的在移開血液與處理源頭，但注射途徑、時機與風險需由視網膜團隊決定。抗VEGF可處理相關新生血管，不能保證單靠它立即清除大血塊。"], "clinicalLink": "新中央暗點與大片出血應及時專科評估，交班包含症狀起始時間。", "pitfall": "不能把原稿tPA操作敘述當通用床邊步驟，也不能保證移位後視力完全恢復。", "recall": {"question": "tPA／氣體移位處理什麼問題？", "answer": "選定情境下處理黃斑附近血塊，仍需控制出血病因。"}, "relatedTopics": [], "sourceIds": ["ret-pcv", "ret-oct", "ret-submacular-hemorrhage", "ret-tpa"]}, {"id": "c44", "title": "FCE：脈絡膜凹陷與伴隨新生血管", "pages": [45, 61], "unitId": "u1", "sectionIndexes": [1, 7], "terms": ["Focal choroidal excavation", "Conforming FCE", "Non-conforming FCE"], "keyPoints": ["FCE是OCT上局部脈絡膜凹陷；conforming表示感光細胞／外層輪廓仍贴合，non-conforming可有外層與RPE間分離空間。它與眼球整體後葡萄腫不是同一尺度的病變。", "部分患者穩定且症狀輕，但若新液體、出血或CNV出现需要重新評估。其病因並非完全確定，不能照來源把所有FCE說成某條動脈硬化拖拉Bruch膜的直接結果。"], "clinicalLink": "比對同位置連續OCT，分辨穩定凹陷與新活動病灶。", "pitfall": "凹陷本身不自動要求治療，中心位置也不是唯一條件。", "recall": {"question": "Conforming與non-conforming主要差別？", "answer": "外層組織是否仍贴合或出现分離空間。"}, "relatedTopics": [], "sourceIds": ["ret-oct", "ret-fce"]}, {"id": "c45", "title": "CSC：脈絡膜—RPE失衡，不是單純用眼過度", "pages": [47, 61, 31, 33, 67, 70], "unitId": "u3", "sectionIndexes": [8], "terms": ["Central serous chorioretinopathy", "Pachychoroid", "Corticosteroid exposure", "Mineralocorticoid antagonist"], "keyPoints": ["CSC常呈黃斑下漿液、中央暗點与變形視，機轉涉及脈絡膜高通透性与RPE失衡。應查口服、吸入、外用或注射類固醇等暴露，不能只凭熬夜或職業命名。", "部分急性病例可觀察，但需排新生血管并追蹤液體及功能；慢性／反覆病例可能考慮PDT等。礦物皮質激素受體拮抗劑如eplerenone或spironolactone，不宜按舊共筆視為已證實常規療法；類固醇調整須與原處方團隊協調。"], "clinicalLink": "將病程、類固醇時序與多模態影像連起，避免給錯抗發炎。", "pitfall": "不能為治CSC自行突然停掉全身必要類固醇。", "recall": {"question": "CSC病人問藥史最不能漏哪類？", "answer": "各種途徑的類固醇暴露。"}, "relatedTopics": ["notes-09", "notes-13"], "sourceIds": ["ret-csc"]}, {"id": "c46", "title": "病理性近視：定義靠結構，不只靠度數", "pages": [48, 61], "unitId": "u1", "sectionIndexes": [8], "terms": ["Pathologic myopia", "Tilted disc", "Peripapillary atrophy", "Posterior staphyloma", "Lacquer cracks", "Fuchs spot", "Lattice degeneration"], "keyPoints": ["病理性近視重點在眼軸延長相關後段結構病變，如後葡萄腫或近視性黃斑病，不是只設定−5或−6D门檻。傾斜視盤、視盤旁萎縮与鞏膜／視網膜薄化是需整合的解剖線索。", "Lacquer cracks為RPE–Bruch相關裂痕，Fuchs spot是近視性新生血管瘢痕，lattice為周邊薄化。斑塊狀／旋繞样萎縮描述分布，不自动等同代謝性gyrate atrophy；中央與周邊併發症可同时存在。"], "clinicalLink": "高度近視新變形視查黃斑CNV／牽引，新閃光幕簾查周邊裂孔。", "pitfall": "病理性近視與RD不是一個只在中央、一個只在周邊的互斥診斷。", "recall": {"question": "近視度數高是否就等於病理性近視？", "answer": "不，需評估相應後段結構病變。"}, "relatedTopics": ["notes-02"], "sourceIds": ["ret-myopia"]}, {"id": "c47", "title": "近視性劈裂與黃斑剝離", "pages": [48, 61, 65, 69, 70], "unitId": "u2", "sectionIndexes": [8], "terms": ["Myopic foveoschisis", "Myopic traction maculopathy", "Macular hole retinal detachment"], "keyPoints": ["近視性黃斑牽引病可由眼球後形狀、玻璃體／表面膜與較僵硬的內層組織張力共同形成層間劈裂；OCT可見分離的神經視網膜層與橋状組織。它不只是細胞「自己裂開」。", "劈裂可合併中心凹剝離或黃斑孔，再形成黃斑孔相關RD；与神經視網膜—RPE間的分離需分辨。治療依進展与功能决定，不能只按一條黑色空間判定手術。"], "clinicalLink": "同一張OCT逐層追踪，分清層內劈裂、SRF與PED三個空間。", "pitfall": "不能宣稱未達某近視度數就不會有牽引性黃斑病。", "recall": {"question": "Foveoschisis與RD分離界面差別？", "answer": "前者主要在神經視網膜层间，後者在神經視網膜與RPE間。"}, "relatedTopics": [], "sourceIds": ["ret-myopia", "ret-oct"]}, {"id": "c48", "title": "黃斑孔：全層缺損、牽引與手術目標", "pages": [49, 61, 64, 68, 69], "unitId": "u2", "sectionIndexes": [8], "terms": ["Full-thickness macular hole", "Gass stages", "Posterior vitreous detachment", "ILM peeling"], "keyPoints": ["全層黃斑孔是中心凹神經視網膜全層中斷，常与玻璃體前後向／切向牽引相关；OCT需確認真正组织缺失，而非囊腔、假孔或單純劈裂。", "傳統Gass分期以形成過程与玻璃體狀態描述，第四期伴完全PVD；現代評估也重视孔徑及牽引。玻切、ILM處理与填充的目的在解除牽引、促進閉合，結果受大小與病程等影響。"], "clinicalLink": "把手術機轉說成解除牽引與促閉合，而非單純塞東西補洞。", "pitfall": "不能用固定兩個月界線保證或否定視力恢復。", "recall": {"question": "OCT上何者使它成為full-thickness hole？", "answer": "中心凹神經視網膜全層連續性中斷。"}, "relatedTopics": [], "sourceIds": ["ret-oct", "ret-rd-atlas", "ret-macular-hole"]}, {"id": "c49", "title": "VMT：黏著不等於牽引", "pages": [49, 50, 61], "unitId": "u2", "sectionIndexes": [8], "terms": ["Vitreomacular adhesion", "Vitreomacular traction", "VMT"], "keyPoints": ["玻璃體仍黏著黃斑但不引起形態失真可稱vitreomacular adhesion；出現牽拉造成中心凹變形、囊腔或症狀，才進入VMT的機械問題。", "VMT可能自行釋放，也可能持續並促成黃斑孔；依症狀、範圍与OCT變化决定觀察或介入，不是所有附着都必須玻切。还要找ERM等共同牽引来源。"], "clinicalLink": "把「有黏著」與「已造成組織損害」分開，改善治療取捨。", "pitfall": "不能只按一張玻璃體線仍連著就診斷需要手術的VMT。", "recall": {"question": "VMA與VMT最主要差異？", "answer": "後者已造成牽引性形態改變與相關影響。"}, "relatedTopics": [], "sourceIds": ["ret-oct", "ret-vmt"]}, {"id": "c50", "title": "ERM／cellophane maculopathy：表面膜的切向牽引", "pages": [50, 61, 64, 65, 66, 68, 69], "unitId": "u2", "sectionIndexes": [8], "terms": ["Epiretinal membrane", "Macular pucker", "Cellophane maculopathy", "Pseudohole", "Metamorphopsia"], "keyPoints": ["ERM是視網膜內表面的纖維細胞膜，收縮可使血管扭曲、中心凹形態變化與變形視；cellophane maculopathy、macular pucker描述其不同外观／程度。可原發，也可继發炎症、裂孔或手術。", "是否玻切與膜剝除依症狀、功能及進展，不是看见膜就開刀。假孔可外觀像黃斑孔但沒有真正全層組織缺失；ERM不是必然伴CNV，來源此類概括應修正。"], "clinicalLink": "問閱讀、雙眼視覺与變形程度，配合OCT评估日常影响。", "pitfall": "ERM膜與ILM是不同结构；手術可處理两者但不能把名字當同義詞。", "recall": {"question": "ERM與黃斑孔如何用OCT區別？", "answer": "前者為表面膜牽皺，後者為全層缺損；也可能共存。"}, "relatedTopics": [], "sourceIds": ["ret-oct", "ret-erm"]}, {"id": "c51", "title": "ROP：zone、stage、plus與出院後追蹤", "pages": [51, 62], "unitId": "u1", "sectionIndexes": [9], "terms": ["Retinopathy of prematurity", "Zone", "Stage 1", "Stage 2", "Stage 3", "Stage 4", "Stage 5", "Plus disease", "Type 1 ROP"], "keyPoints": ["ROP發生於未成熟視網膜血管發育背景。Stage 1為分界線、2為隆起脊、3為視網膜外纖維血管增殖、4為部分剝離、5為全剝離；zone表示位置，plus表示後極血管扩張迂曲等活動性。", "治療依zone、stage與plus形成的風險組合，如type 1 ROP，不依舊稿3a／3b单一門檻。雷射與抗VEGF各有角色，後者尤其需注意延遲再活化及追蹤；篩檢資格按當地早產照護規範，出院不代表追蹤结束。"], "clinicalLink": "将出生背景、当前分區分期及下一次眼底檢查日期清楚交班。", "pitfall": "不能以原稿36週／2000g作適用所有地區的唯一篩檢線。", "recall": {"question": "ROP為何不能只說stage 3？", "answer": "治療风险还需要zone與plus等資訊。"}, "relatedTopics": ["notes-04"], "sourceIds": ["ret-rop"]}, {"id": "c52", "title": "RB1、白瞳與視網膜母細胞瘤", "pages": [51, 52, 62], "unitId": "u1", "sectionIndexes": [9, 10], "terms": ["Retinoblastoma", "RB1", "13q14", "Germline variant", "Two-hit mechanism", "Osteosarcoma", "Trilateral retinoblastoma"], "keyPoints": ["RB1為位於13q14的抑癌基因；腫瘤形成涉及功能喪失。雙眼、多灶與年幼發病提高胚系變異可能，但單眼或無家族史仍不能排除可遺傳型，遺傳諮詢與檢測有重要角色。", "白瞳、斜視甚至假性炎症需及時檢查；評估眼內範圍、視神經與全身風險后，可有局部、化療或眼球摘除等不同策略。胚系患者另有三側型及骨肉瘤等第二原發癌風險，不是摘眼使癌跑到另一眼／骨頭。"], "clinicalLink": "生命安全、眼球保留與視功能是不同層次的目標，需專科共同決策。", "pitfall": "不是每例都僅能摘除，也不應為一般診斷隨意眼內切片。", "recall": {"question": "雙側RB為何要遺傳與全身評估？", "answer": "胚系RB1變異及第二原發癌風險較高。"}, "relatedTopics": ["notes-04", "notes-09"], "sourceIds": ["ret-rb"]}, {"id": "c53", "title": "成人脈絡膜腫塊與局部放射治療", "pages": [18, 51, 52, 62], "unitId": "u1", "sectionIndexes": [10], "terms": ["Choroidal metastasis", "Choroidal melanoma", "Choroidal hemangioma", "Intraocular lymphoma", "Brachytherapy", "Proton beam", "Gamma knife", "Heavy-ion therapy"], "keyPoints": ["成人脈絡膜腫塊需區別轉移、黑色素瘤、血管瘤與淋巴瘤等；乳房／肺部等原發癌病史有帮助，但眼部表徵可先于全身診断。液體与颜色只是线索，需影像、演變與專科評估。", "Brachytherapy将放射源局部靠近病灶，proton／重離子與gamma knife属不同外部精準照射方式；是否保眼或摘眼依腫瘤、範圍、視功能與風險决定，不能以一个技术名称取代分期。"], "clinicalLink": "先辨認是否實體腫塊及有無全身來源，避免只用類固醇試驗治療。", "pitfall": "脈絡膜血管瘤不是惡性轉移；淋巴瘤也可能主要呈現細胞浸潤。", "recall": {"question": "腫瘤治療為何不只看視力？", "answer": "還需評估局部侵犯、轉移／全身風險與生命安全。"}, "relatedTopics": ["notes-09"], "sourceIds": ["ret-masquerade", "ret-rb", "ret-uveal-melanoma"]}, {"id": "c54", "title": "RP：夜盲、周邊視野與遺傳異質性", "pages": [52, 53, 62, 66, 70], "unitId": "u1", "sectionIndexes": [10], "terms": ["Retinitis pigmentosa", "Rod-cone dystrophy", "Bone-spicule pigmentation", "Tunnel vision", "Autosomal dominant", "Autosomal recessive", "X-linked"], "keyPoints": ["RP是一組遺傳性退化，常先有視桿功能下降造成夜盲，再逐步周邊視野縮小；骨針狀色素、血管變細與視盤蠟白是典型但不一定早期齐全。", "可為顯性、隱性、X連鎖或無已知家族史，進展年齡與速度差異很大。ERG、視野、OCT与基因檢測互補，不能照來源预言所有人四五十歲都完全失明。"], "clinicalLink": "記錄功能分布與可介入的白內障、CME等併發症，同時作遺傳與復健照護。", "pitfall": "Retinitis pigmentosa雖名字含炎，不代表常規以免疫抑制治療。", "recall": {"question": "RP一定只有顯性遺傳嗎？", "answer": "否，遺傳方式与致病基因很多。"}, "relatedTopics": [], "sourceIds": ["ret-rp", "ret-erg"]}, {"id": "c55", "title": "RPA、Usher與choroideremia", "pages": [53, 54, 62], "unitId": "u1", "sectionIndexes": [10], "terms": ["Retinitis punctata albescens", "Usher syndrome", "Choroideremia", "CHM"], "keyPoints": ["Retinitis punctata albescens可呈白點伴夜盲與進行性視網膜失養，需要功能與基因評估，不能僅依白點與炎症性白點群相混。Usher把RP樣視覺退化與聽力、部分患者平衡功能異常連起。", "Choroideremia多為CHM相关X連鎖疾病，會有進展性脈絡膜、RPE與視網膜萎縮；夜盲與視野縮小可像RP，但萎縮分布及遺傳線索不同。聽力評估、家族檢查與遺傳諮詢都影響照護。"], "clinicalLink": "夜盲問診加入聽力、平衡與家族性別分布，可形成更精準的遺傳方向。", "pitfall": "不是所有夜盲加白點都屬同一種RP。", "recall": {"question": "RP樣症狀加聽損應想到哪個症候群？", "answer": "Usher syndrome。"}, "relatedTopics": [], "sourceIds": ["ret-rp", "ret-choroideremia"]}, {"id": "c56", "title": "LCA與Stargardt：早發視損不是同一機轉", "pages": [53, 62], "unitId": "u1", "sectionIndexes": [10], "terms": ["Leber congenital amaurosis", "LCA", "RPE65", "Stargardt disease", "ABCA4", "Fundus flavimaculatus", "Beaten-bronze appearance"], "keyPoints": ["LCA為很早發、常嚴重的遺傳視網膜功能障碍，可伴眼震；涉及多個基因，RPE65只是其中之一。不能看見嬰幼兒低視力便直接稱RPE65病。", "Stargardt常與雙等位ABCA4變異相關，以中央視功能下降、黃白色flecks及黃斑RPE萎縮為線索；fundus flavimaculatus是相關表型名稱，beaten-bronze描述黃斑外观。可兒童或成人發病，不必固定在十歲前。"], "clinicalLink": "根據起病年齡、中央／周邊功能與基因作分類，並處理教育及低視能需求。", "pitfall": "RPE65基因治療不是所有LCA或所有RP的共同治療。", "recall": {"question": "Stargardt最常與哪個基因連結？", "answer": "ABCA4。"}, "relatedTopics": ["notes-04"], "sourceIds": ["ret-rpe65", "ret-rp", "ret-stargardt"]}, {"id": "c57", "title": "遺傳性退化治療：基因條件、併發症與證據", "pages": [52, 53, 58, 62], "unitId": "u1", "sectionIndexes": [10], "terms": ["Voretigene neparvovec", "AAV-RPE65", "Vitamin A supplementation", "Carbonic anhydrase inhibitor", "Retinal prosthesis", "Optogenetics"], "keyPoints": ["RPE65基因治療需確認合適雙等位變異並有足夠存活細胞，不是仅在症狀前才有可能，也不是修復所有已流失細胞。RP的CME、屈光與白內障仍可評估治療，低視能復健亦有實際价值。", "AAO證據評估未找到支持RP營養補充療效的高品質證據，不应照抄高劑量維生素A處方。碳酸酐酶抑制劑在部分RP-CME有角色；電子視網膜與optogenetics屬特定開發／研究路徑，不能保證恢復正常視力。"], "clinicalLink": "把已可處理的功能限制與研究性恢復策略清楚分開。", "pitfall": "不能宣稱發病後只剩電子視網膜有效，或無須照護。", "recall": {"question": "考慮RPE65治療至少確認哪兩項？", "answer": "合適雙等位RPE65變異與足夠存活視網膜細胞。"}, "relatedTopics": [], "sourceIds": ["ret-rpe65", "ret-rp-supplement", "ret-rp"]}, {"id": "c58", "title": "術後、內生性與低度慢性眼內炎", "pages": [54, 62], "unitId": "u3", "sectionIndexes": [11], "terms": ["Postoperative endophthalmitis", "Endogenous endophthalmitis", "Cutibacterium acnes", "Candida", "Klebsiella pneumoniae"], "keyPoints": ["術後新視力下降与眼內炎症需紧急排感染；內生性感染則要串到肝膿瘍、菌血症或真菌血症。Klebsiella與糖尿病肝膿瘍的組合，Candida與免疫／導管背景各提供不同線索。", "Cutibacterium acnes（舊名Propionibacterium acnes）可造成低度慢性術後炎症，診斷與處置需考慮囊袋等藏匿處。眼內抗菌、採檢与玻切由專科决定，摘除／剜除是嚴重特定情境選項，非一般第一步。"], "clinicalLink": "慢性反覆炎症不能只加類固醇，需回顧手術與感染证据。", "pitfall": "肝膿瘍是重要風險，卻不能說所有內生性眼內炎最常都同一病原。", "recall": {"question": "術後數月反覆低度炎症，哪個病原需想到？", "answer": "Cutibacterium acnes等慢性術後感染。"}, "relatedTopics": ["notes-06", "notes-09"], "sourceIds": ["ret-inflammation", "ret-masquerade", "ret-endophthalmitis"]}, {"id": "c59", "title": "ARN、CMV與假面：白病灶先看宿主和層次", "pages": [18, 54, 62], "unitId": "u3", "sectionIndexes": [11], "terms": ["ARN", "CMV retinitis", "AIDS", "Candida retinitis", "Vitreoretinal lymphoma", "POHS"], "keyPoints": ["ARN可見壞死與閉塞性血管炎、常較明顯炎症；CMV retinitis常在免疫抑制宿主出血壞死但炎症較少，Candida可呈白色脈絡膜視網膜或玻璃體灶。外观相似仍需宿主、病程与檢測支持。", "玻璃體視網膜淋巴瘤可模仿眼內炎症；POHS則是與眼底瘢痕、盤旁改變及CNV相關的症候群，通常缺乏明顯vitritis，不等同急性真菌眼內炎。這些名稱不能由一張白點照片互換。"], "clinicalLink": "按「感染、非感染、假面」各保留可驗證假說，及時處理威脅視力感染。", "pitfall": "ARN治疗後仍有剝離等風險，不能保證吃藥一定痊癒。", "recall": {"question": "眼底坏死很重但vitritis少，需注意何背景？", "answer": "免疫抑制及CMV等機會性感染。"}, "relatedTopics": ["notes-09"], "sourceIds": ["ret-arn", "ret-inflammation", "ret-masquerade"]}, {"id": "c60", "title": "HCQ毒性：OCT、FAF與功能範圍", "pages": [31, 33, 55, 56, 63, 67, 70], "unitId": "u3", "sectionIndexes": [11], "terms": ["Hydroxychloroquine", "Chloroquine", "Bull’s-eye maculopathy", "Flying saucer sign", "Parafoveal toxicity", "Pericentral toxicity", "Multifocal ERG"], "keyPoints": ["HCQ／chloroquine可損傷外層視網膜与RPE；bull’s-eye與flying saucer形態多提示已有结构損伤，筛檢不能等晚期外观。风险受劑量、療程、腎功能等影響，不能說每人吃滿五至七年就發病。", "依AAO2025修訂，OCT與較廣範圍FAF為主要工具，視野／多焦ERG可協助确认。早期建立基線，按風險安排年度追蹤，低風險者才可能延後初期年度檢查；須涵蓋parafoveal及pericentral表型，疑似結果先核實再協調用藥。"], "clinicalLink": "用結構与功能在相同位置互相驗證，避免只靠視力或角膜沉積判毒性。", "pitfall": "不能自行停止重要全身治療，也不能把單一可疑影像當確診。", "recall": {"question": "為何視力好不能免除HCQ篩檢？", "answer": "早期旁中心／較周邊損傷未必影響中央視力表。"}, "relatedTopics": ["notes-13"], "sourceIds": ["ret-hcq"]}, {"id": "c61", "title": "其他藥物：先定位再談毒性", "pages": [55, 63], "unitId": "u3", "sectionIndexes": [11], "terms": ["Ethambutol", "Thioridazine", "Phenothiazine", "Paclitaxel", "Taxol", "Letrozole", "Femara"], "keyPoints": ["Ethambutol首先要想到視神經毒性，而非籠統归為retinotoxic；phenothiazine中的thioridazine可有色素性視網膜损伤。用藥時序、視野、色覺與OCT有助定位。", "Paclitaxel（Taxol）可與囊狀黃斑改變等眼部不良反應相關；letrozole（Femara）等藥物也有眼部事件報告，但不能把時間相近直接證明血管血栓由藥造成。需檢查替代病因並與原處方团队協調。"], "clinicalLink": "先判斷角膜、晶狀體、視網膜或視神經，再形成藥毒性假說。", "pitfall": "不可直接照來源把ethambutol列成典型視網膜毒性。", "recall": {"question": "EMB視損最先定位在哪？", "answer": "視神經。"}, "relatedTopics": ["notes-03", "notes-13"], "sourceIds": ["ret-drug-video", "ret-ethambutol"]}, {"id": "c62", "title": "Coats病：大量脂質滲出與兒童白瞳", "pages": [18, 56, 63], "unitId": "u3", "sectionIndexes": [9, 11], "terms": ["Coats disease", "Retinal telangiectasia", "Lipid exudation", "Exudative retinal detachment"], "keyPoints": ["Coats病的異常擴張血管漏液可造成大量脂質沉積與滲出性剝離，常为單眼兒童病況。白瞳或斜視需與RB、PFV等鉴別，不能仅凭黄色滲出作结论。", "處理依病變范围与分期，可能用雷射／冷凍处理異常血管，進展病例需其他介入；抗VEGF可在選定情況作輔助，但不能把注射当作所有Coats的單一根治。"], "clinicalLink": "用周邊血管形態與視網膜下液體連接白瞳原因。", "pitfall": "Coats為血管異常，不應直接當感染或自體免疫白點病。", "recall": {"question": "Coats大量黃色物質主要來自什麼？", "answer": "異常血管通透性造成脂質滲出沉積。"}, "relatedTopics": ["notes-04"], "sourceIds": ["ret-coats"]}, {"id": "c63", "title": "Terson與顱內出血相關眼內出血", "pages": [17, 56, 63], "unitId": "u3", "sectionIndexes": [11], "terms": ["Terson syndrome", "Subarachnoid hemorrhage", "Intracranial hemorrhage", "Vitreous hemorrhage", "Sub-ILM hemorrhage"], "keyPoints": ["Terson症候群是顱內出血相關的眼內出血，可有玻璃體、視網膜前／ILM下或其他層次的血。蜘蛛膜下腔出血是典型背景，不能把名稱等同shaken baby syndrome。", "先處理全身神經急症，再以分眼視功能與影像評估眼內出血及是否需玻切。兒童虐待性頭部外傷的評估有更廣臨床與保護流程，不能由單一眼底表徵直接定論。"], "clinicalLink": "顱內出血康復者視覺不良仍應查眼部，不全歸因腦損伤。", "pitfall": "單凭玻璃體出血不能確診Terson或兒童虐待。", "recall": {"question": "Terson必須連結哪類全身背景？", "answer": "顱內出血。"}, "relatedTopics": ["notes-03"], "sourceIds": ["ret-terson"]}, {"id": "c64", "title": "CME與Irvine–Gass：形態不是病因", "pages": [56, 57, 63, 64, 68], "unitId": "u3", "sectionIndexes": [11], "terms": ["Cystoid macular edema", "Irvine-Gass syndrome", "Pseudophakic CME", "Petaloid leakage"], "keyPoints": ["CME指黃斑囊狀水腫形態，可見於術後、葡萄膜炎、血管病与其他疾病。Irvine–Gass特指白內障術後相关CME；不能把兩個詞在所有情境直接互換。", "OCT可見視網膜內囊腔，FA可见花瓣樣滲漏；若術後視力變差仍需先排眼內炎、剝離等。處理依程度與病因，局部抗炎、選定注射等各有角色，不是所有病例先放著或一律打anti-VEGF。"], "clinicalLink": "問手術時點並分清眼痛紅眼警訊，才進入術後CME推理。", "pitfall": "CME不是白內障術後才會發生。", "recall": {"question": "CME和Irvine–Gass的關係？", "answer": "前者為形態，後者是術後病因的一種。"}, "relatedTopics": ["notes-06", "notes-09"], "sourceIds": ["ret-cme"]}, {"id": "c65", "title": "MacTel與macroaneurysm：同是異常血管，位置不同", "pages": [18, 57], "unitId": "u3", "sectionIndexes": [11], "terms": ["Macular telangiectasia", "MacTel type 1", "MacTel type 2", "Retinal arterial macroaneurysm"], "keyPoints": ["MacTel 1較偏單眼滲出型毛細血管異常；MacTel 2常雙眼旁中心變化，兼有神經退化與微血管重塑，OCT囊腔不一定是會對抗VEGF反應的漏液性水腫。需另外辨認新生血管。", "視網膜動脈大瘤樣擴張macroaneurysm可造成多層出血或黄斑滲出，常需評估血壓與動脈背景。治療依出血、滲漏和位置，由专科选择，不能看到血管變粗便全部歸為静脈阻塞。"], "clinicalLink": "判讀先問是毛細血管網、動脈瘤或靜脈回流問題，再連到治療。", "pitfall": "MacTel2並非所有阶段均以anti-VEGF为通用治療。", "recall": {"question": "何者可造成同時視網膜前、內與下出血？", "answer": "Retinal arterial macroaneurysm等局部血管破裂。"}, "relatedTopics": [], "sourceIds": ["ret-mactel", "ret-rvo"]}, {"id": "c66", "title": "AVM、血管腫瘤與phakomatoses", "pages": [18, 51, 57], "unitId": "u1", "sectionIndexes": [10, 11], "terms": ["Retinal arteriovenous malformation", "Retinal hemangioblastoma", "Phakomatoses", "Von Hippel-Lindau", "Tuberous sclerosis"], "keyPoints": ["視網膜AVM為動靜脈間異常通連，血管走向可非常粗大迂曲；血管母細胞瘤則為可形成滲出或牽引的局部血管腫瘤。两者不能只因都有大血管就混称hemangioma。", "Phakomatoses指帶有眼與其他器官表現的一组發育／遺傳症候群；例如VHL的視網膜血管母細胞瘤、結節性硬化症的視網膜星狀細胞錯構瘤。眼底發現可提示全身筛查與遺傳照護。"], "clinicalLink": "問家族、神經與腎臟等全身線索，使稀有眼底病名有實際用途。", "pitfall": "單一血管異常不自動等於已有某個全身症候群。", "recall": {"question": "視網膜血管母細胞瘤应想到哪個全身連結？", "answer": "Von Hippel-Lindau症候群。"}, "relatedTopics": ["notes-03"], "sourceIds": ["ret-vhl"]}, {"id": "c67", "title": "炎症性血管與白點：SLE、sarcoid與TB", "pages": [54, 57, 63], "unitId": "u3", "sectionIndexes": [11], "terms": ["Retinal vasculitis", "SLE", "Sarcoidosis", "Candle-wax periphlebitis", "Tuberculous choroidal granuloma", "White dot syndromes"], "keyPoints": ["SLE相關血管病可能有缺血／閉塞，sarcoid可見蠟滴狀靜脈周圍炎与多區眼内炎症，TB可有脈絡膜肉芽腫和周圍漿液性剝離。先描述受累血管、灌流及组织层次，再尋找病因。", "白點症候群包含多種不同表型，部分與前驅感染時序相關但不能一律宣稱病毒直接感染。血清標記与單张照片都不能取代宿主、系統症狀及感染排除。"], "clinicalLink": "將後段病灶帶回葡萄膜炎課程，以感染與非感染策略分流。", "pitfall": "Candle-wax是炎性血管周圍滲出，不是每一節都是血管瘤。", "recall": {"question": "肉芽腫旁SRF是否必為裂孔性RD？", "answer": "不是，可為炎症相關滲出，需找是否另有裂孔。"}, "relatedTopics": ["notes-09"], "sourceIds": ["ret-inflammation"]}, {"id": "c68", "title": "CAR與Fabry：眼底之外的診斷線索", "pages": [57, 63], "unitId": "u1", "sectionIndexes": [11], "terms": ["Cancer-associated retinopathy", "Antiretinal antibodies", "Fabry disease", "Cornea verticillata", "Retinal vessel tortuosity"], "keyPoints": ["CAR為副腫瘤性視網膜功能障碍，可有快速進展的雙眼視覺症状而早期眼底不显著；ERG、視野、影像与全身腫瘤評估互補，抗視網膜抗體陽性本身不能独立确診。", "Fabry是遺傳性溶小體疾病，可有角膜渦狀混濁与視網膜血管迂曲，需連到腎、心及神經等全身線索。角膜渦狀沉積也可由药物造成，因此看到圖案还要問藥史。"], "clinicalLink": "将功能與外观不一致視為擴大病因評估的線索，而非認為病人說法不可靠。", "pitfall": "血管迂曲或抗體陽性都不是單項確診器。", "recall": {"question": "Fabry角膜外觀最常與哪一類原因比較？", "answer": "药物性角膜渦狀沉積。"}, "relatedTopics": ["notes-05", "notes-13"], "sourceIds": ["ret-car", "ret-fabry"]}, {"id": "c69", "title": "脈絡膜滲出、梗塞、剝離與驅逐性出血", "pages": [16, 18], "unitId": "u2", "sectionIndexes": [5, 11], "terms": ["Choroidal effusion", "Choroidal infarction", "Choroidal detachment", "Suprachoroidal hemorrhage", "Expulsive hemorrhage"], "keyPoints": ["脈絡膜滲出是脈絡膜上腔液體增加，脈絡膜剝離描述組織離開鞏膜的構型；脈絡膜梗塞則為灌流缺血。這些英文名稱不能像來源部分中文對照般互相交換。", "脈絡膜上腔出血可在術中或術後發生，严重時突然高壓使眼內容物有外脫危險，稱驅逐性出血。需立即眼科手術团队處理；B-scan有助辨認後段隆起，但要考慮傷口完整性與安全。"], "clinicalLink": "術後急痛、眼壓或前房异常時把後段脈絡膜事件列入，不只想角膜和水晶體。", "pitfall": "Choroidal infarction不是「脈絡膜剝離」的翻譯。", "recall": {"question": "液體型與出血型脈絡膜剝離處理是否相同？", "answer": "不同，需辨認內容物、病因與眼球狀態。"}, "relatedTopics": ["notes-06", "notes-08"], "sourceIds": ["ret-rd-atlas", "ret-suprachoroidal"]}, {"id": "c70", "title": "雷射家族：先問作用與目標組織", "pages": [57], "unitId": "u3", "sectionIndexes": [6, 11], "terms": ["Argon laser", "Diode laser", "Nd:YAG", "Excimer", "CO2 laser", "Pattern scan laser", "PASCAL", "TTT", "PDT", "TSCP"], "keyPoints": ["Argon及不同波長diode等可用於光凝固；Nd:YAG常以光破裂处理特定前節問題，excimer以光消融處理角膜，CO2常用于含水組織切割等情境。不能把所有眼科雷射都當視網膜光凝固。", "Pattern scan／PASCAL指多點图形輸出，TTT为透瞳熱療，PDT需光敏劑與光共同作用，TSCP則以睫狀體为目標控制眼壓。波長、脈衝及能量取決於裝置與適應症，不從旧表数字推臨床設定。"], "clinicalLink": "答口試時說明「目標組織—能量作用—目的」，勝於背一列設備名。", "pitfall": "PDT不是單純把组织烧熱，TSCP也不是治視網膜裂孔的雷射。", "recall": {"question": "YAG後囊切開与retinal photocoagulation机轉相同嗎？", "answer": "不同，常分别利用光破裂與光熱凝固。"}, "relatedTopics": ["notes-02", "notes-06", "notes-07"], "sourceIds": ["ret-rd-atlas", "ret-pcv"]}, {"id": "c71", "title": "新技術：分清已核准適應與研究願景", "pages": [53, 58], "unitId": "u1", "sectionIndexes": [10, 11], "terms": ["Retinal prosthesis", "Argus II", "AMS", "A-Neuron", "Pixium", "iPSC", "Retinal transplantation", "Optogenetics", "AI", "VR", "Intraoperative OCT", "3D surgery"], "keyPoints": ["來源列Argus II、AMS、A-Neuron、Pixium及無線視網膜裝置，代表不同電子視覺系統的歷史開發名稱；品牌名並不證明當下仍供應或適用。胎兒／幹細胞移植、iPSC衍生RPE與感光細胞、optogenetics各處於不同研究與轉譯階段。", "基因治療須針對基因與存活组织；AI用于指定影像任務需验证族群與失誤風險，不能以單一99%門檻概括。VR、3D顯微手術與術中OCT可輔助訓練、視覺呈現或实时結構判斷，仍不替代外科決策。"], "clinicalLink": "閱讀新科技時問適用对象、證據終點、监管状態及實際可取得性。", "pitfall": "不可把研究装置或停產歷史產品當現行可保證恢復視力的選項。", "recall": {"question": "評估視網膜新科技首先確認哪四項？", "answer": "適用患者、臨床證據、當地核准及實際可取得性。"}, "relatedTopics": [], "sourceIds": ["ret-rpe65", "ret-rp"]}, {"id": "c72", "title": "考古整合：無痛、變形視與分眼定位", "pages": [31, 33, 66, 67, 70], "unitId": "u3", "sectionIndexes": [4, 8, 11], "terms": ["Sudden painless visual loss", "Metamorphopsia", "Giant cell arteritis", "Anterior ischemic optic neuropathy", "Neurotrophic keratopathy"], "keyPoints": ["動脈／静脈阻塞、剝離、玻璃體出血与AION均可無痛；GCA相关視力下降亦可能無眼痛，雖有頭痛或下顎跛行等全身疼痛。神經營養性角膜病反而可能因感觉差而少痛，舊解答「劇痛」不能照背。", "變形視提示黄斑空间配置改变，见于CNV、DME、ERM、CSC与中心受累剝離等；周边病灶則可能主要表現視野缺損。左右眼症狀不同要各自定位，不按共同用眼史硬套一个病名。"], "clinicalLink": "將症狀先接到解剖，再按急性血管、剝離与GCA警訊分流。", "pitfall": "無痛不能排急症；有全身頭痛也不代表眼內視損必然疼痛。", "recall": {"question": "GCA視損會不會無眼痛？", "answer": "會，不能以不痛排除。"}, "relatedTopics": ["notes-03", "notes-05", "notes-14"], "sourceIds": ["ret-crao", "ret-rd-nei", "ret-oct"]}, {"id": "c73", "title": "原稿缺圖考題：保留限制，練習可驗證的判讀", "pages": [64, 65, 68, 69, 70], "unitId": "u1", "sectionIndexes": [1, 4, 7, 8], "terms": ["Image quality", "OCT localization", "Source limitation", "Diagnostic uncertainty"], "keyPoints": ["PDF第65頁第4題的眼底圖原稿本身過暗，第5題明載缺圖片；第69頁解答也承認看不清／缺圖。因此本教材不替這兩題指定原圖診断或治療答案，而以可辨认的疾病與處置機轉练习替代。", "對可見OCT先追RPE、定位IRF／SRF／PED，再辨膜、牽引與全層缺損；照片需有足夠曝光与範圍才評出血／白化分布。不因選項含某治疗便反推缺失圖片一定是某病。"], "clinicalLink": "口試遇低品質資料可清楚說明能判定什麼、缺什麼與如何補证據。", "pitfall": "不可把來源Q5「steroid+antiVEGF就是wetAMD」當可靠配對。", "recall": {"question": "原圖不清時最有根據的回答方式？", "answer": "描述可辨識部分，說明不確定與需要補足的資料，不編造原題答案。"}, "relatedTopics": [], "sourceIds": ["ret-oct", "ret-rd-atlas", "ret-crao"]}], "unresolved": [], "sourceLimitations": [{"pages": [65, 69], "reason": "原始共筆第65頁第4題眼底圖曝光不足，無法可靠指定診斷；第5題明載未附原圖，第69頁解答亦承認此缺陷。", "handling": "已視讀原頁；涵蓋其疾病鑑別与處置概念，但不補造圖片或指定缺圖題的答案。"}], "sourceSha256": "b95e020fa05103c4b49557996721457c6bbfe80cb4a717187dc27f6cc007f2f3"}, "notes-11": {"sourceFile": "眼科學No.11.pdf", "pageCount": 64, "reviewedPages": [{"from": 1, "to": 2, "kind": "administrative", "note": "目錄與授課回饋，不納入個人或行政資訊。"}, {"from": 3, "to": 25, "kind": "teaching", "note": "解剖、先天與後天疾病、外傷、重建及瞼緣問題；含複習。"}, {"from": 26, "to": 28, "kind": "exam", "note": "眼瞼解剖、外傷與內外翻考題概念。"}, {"from": 29, "to": 59, "kind": "teaching", "note": "下垂、後縮、痙攣、腫瘤及美容；包含影像病例與複習。"}, {"from": 60, "to": 64, "kind": "exam", "note": "下垂鑑別、術式、腫瘤與肉毒毒素考題概念。"}], "entries": [{"id": "c01", "title": "眼瞼五項任務：保護、張閉、淚膜與表情", "pages": [3, 6, 23], "unitId": "u2", "sectionIndexes": [0, 1], "terms": ["protection", "opening", "closure", "tear distribution", "lagophthalmos"], "keyPoints": ["眼瞼保護眼球、開啟視軸、完成閉合並以眨眼鋪展淚膜，也參與表情與外觀。不同功能出問題，會分別出現視軸遮蔽、閉合不全 lagophthalmos、暴露或淚膜不穩，不能只用眼裂大小評估好壞。", "檢查從視力、自然眨眼、輕閉與用力閉眼，到眼表染色；神經感覺不足或無法主訴的病人可能沒有疼痛。功能修復須兼顧能打開也能保護角膜，美容目標應建立在這些條件上。"], "clinicalLink": "乾澀流淚可能是眼瞼動作問題的結果，需連到淚膜與角膜檢查。", "pitfall": "沒有眼睛痛並不保證角膜安全。", "recall": {"question": "眼瞼提得更高是否一定改善功能？", "answer": "未必，若閉合或角膜保護不足，可能造成暴露傷害。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["n11-exposure", "n11-ptosis"]}, {"id": "c02", "title": "七層解剖與神經：用外傷深度推測受損功能", "pages": [3, 4, 6, 23, 26, 27, 28], "unitId": "u2", "sectionIndexes": [0, 1, 4], "terms": ["skin", "orbicularis", "orbital septum", "orbital fat", "levator aponeurosis", "Müller", "tarsus", "conjunctiva"], "keyPoints": ["由前往後可辨皮膚、眼輪匝肌、眶隔、眶脂肪、提肌腱膜／Müller 結構、瞼板與結膜；實際上下瞼解剖有別。皮膚感覺主要 V，orbicularis 閉眼由 VII，levator 開眼由 III，Müller 由交感神經。", "眶隔是眶前後的屏障，脂肪是深部地標；瞼板提供支持並含 Meibomian 腺，結膜提供平滑眼球接觸面。反射閉眼涉及 V 傳入、VII 傳出，任何一端異常都需關注角膜保護。"], "clinicalLink": "傷口見脂肪需考慮穿過眶隔及提肌等深部損傷。", "pitfall": "Müller 不是副交感；眶隔也不是雙眼皮皺摺的主要固定結構。", "recall": {"question": "閉眼反射的主要傳入、傳出神經？", "answer": "三叉神經傳入、顏面神經傳出。"}, "relatedTopics": ["notes-03", "notes-08"], "sourceIds": ["n11-ptosis", "n11-reconstruction-coverage"]}, {"id": "c03", "title": "瞼緣、腺體與淚泵：一條邊緣有三種功能", "pages": [4, 6, 23], "unitId": "u2", "sectionIndexes": [0, 1], "terms": ["gray line", "Meibomian gland", "Zeis", "Moll", "lacrimal pump", "symblepharon"], "keyPoints": ["瞼緣包含睫毛、gray line 與後方 Meibomian 腺口；Zeis 為睫毛相關皮脂腺，Moll 為相關汗腺。眼輪匝肌與內眥淚道動作支持淚泵，淚水經淚小管、淚囊、鼻淚管到下鼻道。", "眼瞼內表面需光滑，否則眨眼會刮傷角膜。Symblepharon 指瞼結膜與球結膜沾黏，常見於化學傷、嚴重瘢痕性發炎等，不能單純解釋為脫水，也不同於角膜和虹膜沾黏。"], "clinicalLink": "淚點貼合不好可能流淚，即使主淚道並未堵塞。", "pitfall": "不要把內眥淚小管誤叫淚腺；主要淚腺在上外側眼眶。", "recall": {"question": "結構正常但淚點外翻，為何仍會流淚？", "answer": "淚點與眼球接觸及淚泵效率受影響，淚水不易進入引流路徑。"}, "relatedTopics": ["notes-08", "notes-12"], "sourceIds": ["n11-ectropion-coverage", "n11-reconstruction-coverage"]}, {"id": "c04", "title": "正常外觀與皺摺：MRD 比照片印象可靠", "pages": [5, 23, 27, 28], "unitId": "u2", "sectionIndexes": [0, 6], "terms": ["lid crease", "canthal tilt", "superior limbus", "MRD1"], "keyPoints": ["正常上瞼常遮住上方角膜緣少許，下瞼接近下方角膜緣；內外眥高度、眼裂形狀與種族及個體解剖有關。眼瞼皺摺 lid crease 與提肌腱膜向皮膚的連接有關，不能只用「肌腱長短」概括。", "看起來小眼可能是真下垂、眉垂、皮膚鬆弛或眼球位置差。MRD1 以角膜光反射到上瞼緣量化，但仍要看眼球正位、額肌代償、雙側差異與自然表情。"], "clinicalLink": "將外觀描述轉成可重測指標，有助功能與美容溝通。", "pitfall": "原稿早段寫「蓋住瞳孔」應修為覆蓋上方角膜緣，而非正常遮住中央視軸。", "recall": {"question": "雙眼皮皺摺主要連到哪個結構？", "answer": "提上眼瞼肌腱膜與皮膚的連接。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n11-ptosis", "n11-exam-video"]}, {"id": "c05", "title": "BPES：狹小眼裂、內眥距與兒童視軸", "pages": [7], "unitId": "u2", "sectionIndexes": [2], "terms": ["blepharophimosis", "BPES", "telecanthus", "epicanthus inversus", "frontalis suspension", "autosomal dominant"], "keyPoints": ["Blepharophimosis 為水平眼裂狹小，BPES 組合常包括下垂、telecanthus 與反向內眥贅皮 epicanthus inversus；telecanthus 是內眥距增加，不等於眼球瞳孔間距必然變大。", "BPES 常呈體染色體顯性遺傳模式，需問家族史。嚴重下垂可能遮蔽視軸或導致散光、弱視，需兒童眼科與眼整形共同評估。重建可能分階段處理內眥及下垂；提肌功能差者可考慮額肌懸吊，但時機取決於視覺威脅與完整條件。"], "clinicalLink": "先保護視覺發育，再安排形態重建次序。", "pitfall": "不要因外觀看起來眼距寬就直接診斷斜視，也不按一張照片指定手術。", "recall": {"question": "BPES 最不能忽略的功能後果？", "answer": "兒童視軸遮蔽、屈光與弱視風險。"}, "relatedTopics": ["notes-04"], "sourceIds": ["n11-ptosis"]}, {"id": "c06", "title": "Epicanthus、epiblepharon 與 entropion 的邊界", "pages": [7, 8], "unitId": "u2", "sectionIndexes": [2, 5], "terms": ["epicanthus", "epiblepharon", "entropion", "pseudostrabismus"], "keyPoints": ["Epicanthus 是內眥皮膚皺摺，可遮鼻側眼白而產生假性內斜；epiblepharon 是皮膚／眼輪匝肌摺痕把睫毛推向角膜，瞼緣本身位置可正常；entropion 則瞼緣真正向內翻。", "不少兒童贅皮隨顏面發育改善，但應檢查下看時睫毛接觸、螢光染色、散光與視力。若持續角膜傷害或視覺發育受影響，需個別評估處理，而非只按外觀判斷。"], "clinicalLink": "把眼位測試與角膜染色分開，分別回答是否真斜視及是否磨眼。", "pitfall": "看見倒睫不代表一定是內翻；只拔睫毛可能沒有處理結構原因。", "recall": {"question": "贅皮和內翻檢查上最重要差異？", "answer": "是否瞼緣本身也向內旋轉。"}, "relatedTopics": ["notes-04", "notes-05"], "sourceIds": ["n11-entropion-coverage"]}, {"id": "c07", "title": "嬰兒眼周血管瘤：自然消退不能取代弱視監測", "pages": [8], "unitId": "u3", "sectionIndexes": [2, 10], "terms": ["infantile hemangioma", "capillary hemangioma", "propranolol", "induced astigmatism"], "keyPoints": ["嬰兒型／毛細血管瘤常在出生後早期明顯增生，之後逐漸退化。眼周病灶即使未完全遮瞳孔，也可能壓迫角膜造成散光，或伴眼球偏位，讓視覺發育受到影響。", "低風險可觀察，但威脅視力時需治療；propranolol 等 β 阻斷劑是重要選項，需專業評估心率、血壓、餵食與全身狀況。類固醇是部分情境選項，不能把局部注射說成沒有眼部風險。"], "clinicalLink": "治療決策依視軸、屈光、眼球位置與病灶生長，而不只看紅色面積。", "pitfall": "不可等「幾歲自然消失」才處理正在形成的弱視。", "recall": {"question": "未蓋住瞳孔的血管瘤為何仍可能需治療？", "answer": "可誘發散光或眼球偏位，造成弱視風險。"}, "relatedTopics": ["notes-04"], "sourceIds": ["n11-hemangioma-coverage"]}, {"id": "c08", "title": "霰粒腫：脂質肉芽腫與需要重新取樣的病程", "pages": [9, 24, 60, 61, 63], "unitId": "u3", "sectionIndexes": [3, 10], "terms": ["chalazion", "lipogranulomatous inflammation", "rosacea", "blepharitis"], "keyPoints": ["霰粒腫是 Meibomian 阻塞後脂質引起的肉芽腫性發炎，常較不痛，可與 rosacea、慢性瞼緣炎和 MGD 相關。早期可有疼痛或和感染交錯，因此「不痛」不是唯一診斷條件。", "一般先熱敷與瞼緣照護，持續或影響視覺者由醫師評估刮除等處理。反覆同位置、脫睫、瞼緣破壞或不尋常病程要考慮皮脂腺癌等偽裝病因，送適當病理而非不斷當針眼。"], "clinicalLink": "病程是更新診斷的工具：同位復發比單次紅腫更改變風險判斷。", "pitfall": "無併發感染時抗生素不能消除脂質肉芽腫本身。", "recall": {"question": "反覆同位霰粒腫加脫睫下一步？", "answer": "完整瞼結膜檢查，評估病理取樣排除偽裝腫瘤。"}, "relatedTopics": ["notes-12"], "sourceIds": ["n11-sebaceous"]}, {"id": "c09", "title": "麥粒腫：腺體定位與感染擴散", "pages": [10, 24], "unitId": "u3", "sectionIndexes": [3], "terms": ["hordeolum", "external hordeolum", "internal hordeolum", "Staphylococcus", "preseptal cellulitis"], "keyPoints": ["外麥粒腫常與睫毛附近 Zeis／Moll 腺感染相關，內麥粒腫在 Meibomian 腺；常有局部紅腫壓痛，常見葡萄球菌。和霰粒腫不同，這裡的核心是急性感染，雖然兩者可在同次病程交錯。", "局限病灶可先評估熱敷等保守措施，抗生素和引流依擴散、嚴重度與反應決定。若整片眼瞼感染、發燒，或出現轉眼痛、突眼、視力下降，需分辨眶前與眶內感染。"], "clinicalLink": "由局部腺體問題轉成眼眶急症的分界，是面試常見追問。", "pitfall": "不可自行擠壓，也不能把「見膿一律切開」當不需評估的固定規則。", "recall": {"question": "針眼合併轉眼痛與視力下降代表什麼？", "answer": "需及時排除眶內感染或其他深部病變。"}, "relatedTopics": ["notes-08", "notes-14"], "sourceIds": ["n11-stye-coverage", "n11-cellulitis-coverage"]}, {"id": "c10", "title": "HZO：鼻尖、角膜與抗病毒藥名的校正", "pages": [10, 24], "unitId": "u3", "sectionIndexes": [3], "terms": ["herpes zoster ophthalmicus", "V1", "Hutchinson sign", "pseudodendrite", "valacyclovir"], "keyPoints": ["HZO 是 VZV 在三叉神經眼支 V1 的再活化，常有單側疼痛與皮節水皰；鼻尖 Hutchinson sign 提示鼻睫支受累並提高眼部風險，但沒有鼻疹仍可有角膜、葡萄膜或其他眼內病變。", "應及時評估並以適當全身抗病毒治療，常見選項含 acyclovir、valacyclovir 或 famciclovir。原稿的 valganciclovir 是錯藥名；也不能因已過七天就一概停止治療考量，新疹、眼部受累與免疫狀況都重要。"], "clinicalLink": "皮疹少或消退仍需關注角膜感覺、假樹枝狀病灶與眼壓等延後問題。", "pitfall": "V2 區也可出現帶狀皰疹；「下眼瞼疹子就不是帶狀皰疹」不成立。", "recall": {"question": "沒有 Hutchinson sign 能否排除眼部受累？", "answer": "不能，仍需依症狀和眼科檢查判斷。"}, "relatedTopics": ["notes-05", "notes-09", "notes-13"], "sourceIds": ["n11-hzo-coverage"]}, {"id": "c11", "title": "眼瞼外傷：視力、眼球完整與脂肪紅旗", "pages": [11, 12, 24, 26, 27, 28], "unitId": "u2", "sectionIndexes": [4], "terms": ["eyelid laceration", "orbital fat prolapse", "levator injury", "foreign body", "open globe"], "keyPoints": ["先記錄可取得的雙眼視功能，評估眼球完整、瞳孔與眼眶；深部傷口可能有異物或眼球穿透。若懷疑開放眼球，先採避免加壓的保護與急診專科路徑，不為完成量測強行操作。", "上瞼傷口看見眶脂肪表示穿過眶隔，需注意提肌腱膜及深部結構損傷。瞼緣、內眥或大片缺損需精細修復；影像和探查依受傷機轉安排，並不是外皮縫好就完成處理。"], "clinicalLink": "把傷口層次連到張眼、閉眼與淚道功能，說明為何要專科修補。", "pitfall": "不能因眼瞼傷口很大只忙著縫皮膚，也不能因很小就排除深部傷。", "recall": {"question": "上瞼傷口見脂肪最重要提示？", "answer": "眶隔已受損，需評估提肌及其他深部／眼球傷害。"}, "relatedTopics": ["notes-05", "notes-08", "notes-14"], "sourceIds": ["n11-reconstruction-coverage"]}, {"id": "c12", "title": "內眥外傷與淚小管：解剖決定探查方向", "pages": [11, 12, 24, 26, 28], "unitId": "u2", "sectionIndexes": [4], "terms": ["canalicular laceration", "medial canthus", "silicone stent"], "keyPoints": ["淚小管位於靠內眥處，內側眼瞼撕裂尤其要考慮受傷；不是把上外側淚腺的位置套進引流道。必須同時檢查瞼緣、內眥支持與眼球，避免只看到表皮裂口。", "專科在適當條件下辨認淚小管斷端並修復，選定情況放置 silicone stent 維持癒合通道；支架型式和移除時間依個案，不應把固定月數當所有人的規則。"], "clinicalLink": "修復目標是眼瞼位置和淚液引流共同恢復，而非只消除疤痕。", "pitfall": "不要盲目用器械探深部傷口；先排眼球損傷並由受訓人員操作。", "recall": {"question": "靠內眥眼瞼割傷要特別檢查什麼？", "answer": "淚小管及內眥結構，並同時確認眼球安全。"}, "relatedTopics": ["notes-08"], "sourceIds": ["n11-reconstruction-coverage"]}, {"id": "c13", "title": "瞼緣與瞼板對位：修得平滑才不磨角膜", "pages": [11, 13, 24], "unitId": "u2", "sectionIndexes": [4], "terms": ["tarsal approximation", "lid margin alignment", "gray line", "notching"], "keyPoints": ["瞼緣裂傷需讓瞼板支持與邊緣地標精準對位，避免缺口 notching、睫毛異位及眼瞼輪廓中斷。瞼板提供骨架，結膜側必須保持光滑，不能讓不適當縫線長期摩擦角膜。", "修補方式取決於是否缺損、張力與解剖層次；不應把原稿的固定三針或一律切直再縫當每例操作。術後關注閉合、角膜染色與感染，外觀整齊不是唯一終點。"], "clinicalLink": "解釋為何瞼緣傷比單純皮膚傷需要更精細的重建。", "pitfall": "不要在疑似眼球開放傷尚未處理前強行牽拉縫合。", "recall": {"question": "瞼緣對位不良可能產生什麼功能後果？", "answer": "缺口、倒睫與角膜摩擦，造成流淚、暴露或上皮傷害。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n11-reconstruction-coverage"]}, {"id": "c14", "title": "重建原理：兩層、支撐與血供", "pages": [14, 15, 16, 24], "unitId": "u2", "sectionIndexes": [0, 4], "terms": ["anterior lamella", "posterior lamella", "flap", "graft", "canthal support"], "keyPoints": ["眼瞼前層為皮膚與眼輪匝肌，後層以瞼板和結膜構成支持及平滑內面。重建需維持邊緣穩定、垂直高度、閉合及眥部固定；腫瘤切除還需先確保切緣與病理計畫。", "Flap 皮瓣帶有血供，free graft 需從受床獲得養分；雙層缺損不能簡化成兩片無血供移植物疊合。選擇取決於缺損大小、位置、殘餘組織與鬆弛度，原稿百分比分界只能作概念方向。"], "clinicalLink": "先回答哪層缺、哪裡供血、如何支撐，再背術式名稱。", "pitfall": "外觀對稱不能取代閉合和角膜接觸面的安全。", "recall": {"question": "為何至少要有可靠血供的重建層？", "answer": "自由移植物需要受床養分支持存活，血供不足會提高失敗風險。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n11-reconstruction-coverage"]}, {"id": "c15", "title": "上瞼缺損與 Cutler–Beard：借組織也有代價", "pages": [14, 15, 16, 24], "unitId": "u2", "sectionIndexes": [4], "terms": ["direct closure", "semicircular flap", "tarsal sharing", "Cutler-Beard"], "keyPoints": ["小範圍且張力允許的上瞼缺損可評估直接閉合；較大者可能需半圓皮瓣、瞼板分享或其他移植物／皮瓣組合。缺損比例不是唯一依據，年齡、鬆弛度與是否牽涉眥部也重要。", "Cutler–Beard 是以帶血供下瞼組織橋接重建較大上瞼缺損的分期概念，需處理後層剛性支持與日後分離。暫時遮蔽視軸對單眼功能患者及兒童有特殊代價，不能只因缺損大就機械套用。"], "clinicalLink": "把重建術式和視覺發育、單眼依賴連在一起評估。", "pitfall": "不把皮瓣圖當可自行照做的手術步驟，也不固定承諾分離時間。", "recall": {"question": "Cutler–Beard 主要借哪個眼瞼？", "answer": "借下瞼組織重建上瞼的大範圍缺損。"}, "relatedTopics": ["notes-04"], "sourceIds": ["n11-reconstruction-coverage"]}, {"id": "c16", "title": "下瞼缺損：Tenzel、Hughes 與 Mustardé", "pages": [15, 16, 24], "unitId": "u2", "sectionIndexes": [4], "terms": ["Tenzel flap", "tarsoconjunctival graft", "Hughes flap", "Mustardé cheek flap"], "keyPoints": ["下瞼小缺損可能直接閉合，中等缺損可用 Tenzel 半圓推進皮瓣等方式減少張力；後層不足可考慮瞼板結膜移植物，但要搭配有血供的組織。術式名稱要連到補的是哪一層。", "Hughes 以同側上瞼帶血供的瞼板結膜重建下瞼後層，常需前層覆蓋並分期；Mustardé 面頰旋轉皮瓣提供較大前層覆蓋，仍需後層與支持。重建後要防外翻、後縮及暴露。"], "clinicalLink": "相同下瞼缺損，前後層需求不同，不能只選一片看似夠大的皮膚。", "pitfall": "Hughes 不等於把整片上瞼所有層次直接搬下來。", "recall": {"question": "Hughes 與 Mustardé 各主要補哪一層？", "answer": "前者重建後層，後者提供面頰前層覆蓋，兩者都需完整支持規劃。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n11-reconstruction-coverage"]}, {"id": "c17", "title": "外翻四型：鬆弛、瘢痕、無力與重量", "pages": [17, 18, 25, 27], "unitId": "u2", "sectionIndexes": [5], "terms": ["involutional ectropion", "cicatricial ectropion", "paralytic ectropion", "mechanical ectropion"], "keyPoints": ["Involutional 外翻來自年齡相關水平支持鬆弛；cicatricial 由皮膚／前層疤痕短縮牽拉；paralytic 與 VII 無力、眨眼及張力不足相關；mechanical 由腫物等重量或外力牽扯。", "共同結果可能是淚點不貼眼球、流淚、結膜乾燥及角膜暴露。需查 horizontal laxity、疤痕、腫塊、顏面功能及眼表，因為同一外翻外觀可能同時有多種機轉。"], "clinicalLink": "先找主要牽拉／支撐問題，再決定是否需要收緊、補皮或處理病灶。", "pitfall": "把全部外翻都理解成皮膚太多，會誤解瘢痕型其實是組織不足。", "recall": {"question": "美容術後皮膚很緊又下瞼外翻，考慮哪型？", "answer": "瘢痕性或前層短縮型，需完整結構評估。"}, "relatedTopics": ["notes-12"], "sourceIds": ["n11-ectropion-coverage"]}, {"id": "c18", "title": "外翻修復：medial spindle 與 lateral tarsal strip", "pages": [19, 25], "unitId": "u2", "sectionIndexes": [5], "terms": ["medial spindle", "lateral tarsal strip", "punctal eversion"], "keyPoints": ["Medial spindle 的概念是改善內側後層及淚點外翻，使淚點更貼合眼球；lateral tarsal strip 主要重建外側水平張力與固定。它們處理的力學問題不同，可依多重機轉搭配。", "若有瘢痕短縮、腫物或麻痺，單純水平收緊可能不夠；先保護角膜，再規劃補足組織與動態問題。術前後都看淚點、閉合和下瞼高度，不以拉得越緊越好。"], "clinicalLink": "用淚泵及眼表功能解釋為何眼皮修復可以改善流淚。", "pitfall": "不能只憑「外翻」兩字決定同一種術式。", "recall": {"question": "Lateral tarsal strip 最直接改善什麼？", "answer": "下瞼水平支持與外側固定，並非所有垂直短縮問題。"}, "relatedTopics": ["notes-08"], "sourceIds": ["n11-ectropion-coverage"]}, {"id": "c19", "title": "內翻分型與退化三要素", "pages": [19, 20, 25, 27], "unitId": "u2", "sectionIndexes": [5], "terms": ["congenital entropion", "involutional entropion", "cicatricial entropion", "lower lid retractors", "orbicularis overriding"], "keyPoints": ["內翻是瞼緣向眼球轉，睫毛和角化表面可反覆磨角膜。可分先天、退化、痙攣與瘢痕型；瘢痕型常涉及後層縮短，需查嚴重結膜病或既往外傷手術。", "退化下瞼內翻常結合水平鬆弛、下瞼牽引肌 lower lid retractors 變弱／脫離，以及眶隔前眼輪匝肌越過瞼板前部（overriding）。多因素機轉解釋為何單處理一個面向可能復發。"], "clinicalLink": "每次都做角膜染色，將結構偏位和上皮傷害程度配對。", "pitfall": "Overriding 不是單純「肌肉太用力」或一律肌肉肥大。", "recall": {"question": "退化內翻為何不一定只切一點皮膚就好？", "answer": "還涉及水平支持、牽引肌與眼輪匝肌相對位置。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["n11-entropion-coverage"]}, {"id": "c20", "title": "痙攣性內翻：打破刺激與收縮循環", "pages": [20, 21, 25, 26, 28], "unitId": "u2", "sectionIndexes": [5], "terms": ["spastic entropion", "irritation-contraction cycle", "Quickert sutures", "botulinum toxin"], "keyPoints": ["眼表刺激或發炎引起反射性眼輪匝肌持續收縮，可使原已有輕微支持鬆弛的眼瞼內翻；內翻再磨角膜，形成刺激—收縮循環。需處理角膜刺激來源，不能只止住眨眼。", "暫時貼附、外翻縫線（如 Quickert 概念）或選定局部肉毒毒素可減少症狀；持續退化結構問題可能需更完整修復。各方案有復發和暴露風險，選擇依機轉與功能。"], "clinicalLink": "把原始眼表病和伴隨眼瞼支撐缺陷同時納入治療。", "pitfall": "不能宣稱所有痙攣型都自然好，也不能把「臨床最常見」當普遍流行病學定論。", "recall": {"question": "痙攣內翻為何常在眼表不舒服後發生？", "answer": "反射收縮加上既有鬆弛促進內翻，並形成互相加重循環。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n11-entropion-coverage"]}, {"id": "c21", "title": "Trichiasis 與 distichiasis：毛方向和毛列位置", "pages": [22, 25], "unitId": "u2", "sectionIndexes": [5], "terms": ["trichiasis", "distichiasis", "epilation", "electrolysis", "argon laser", "cryotherapy"], "keyPoints": ["Trichiasis 是正常睫毛列中毛方向朝角膜；distichiasis 為額外睫毛列，常在 Meibomian 腺口附近。兩者需與瞼緣內翻及贅皮區分，因為病灶可在毛囊，也可在整個眼瞼位置。", "拔毛 epilation 可暫時解除接觸，但毛囊仍在而會再生；電解 electrolysis、氬雷射、冷凍 cryotherapy 或切除處理毛囊，各有復發、瘢痕、色素與眼表副作用，依數量和原因選擇。"], "clinicalLink": "先判斷為何睫毛磨眼，再決定只處理毛囊或重建瞼緣。", "pitfall": "不要把定期拔睫毛當作所有倒睫永久解法。", "recall": {"question": "睫毛多一排與原本睫毛方向錯分別叫什麼？", "answer": "Distichiasis 與 trichiasis。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n11-entropion-coverage"]}, {"id": "c22", "title": "下垂量測：MRD1、提肌行程與代償", "pages": [29, 30, 56, 60, 61, 63], "unitId": "u1", "sectionIndexes": [6], "terms": ["blepharoptosis", "MRD1", "levator function", "brow recruitment", "chin-up posture"], "keyPoints": ["Blepharoptosis 是上瞼位置過低；MRD1 從角膜光反射量到上瞼緣，描述位置，levator function 在固定額肌後由下看到上看，描述可動行程。兩者測不同變項，不能互相取代。", "同時看皺摺、眉位、抬下巴、眼球位置、瞳孔和眼動；兒童可能用額肌與頭位代償，掩蓋視軸問題。照片可紀錄，但需標準化姿勢與檢查，不只憑自拍判斷手術。"], "clinicalLink": "相同 MRD1 可能來自肌肉無力或腱膜傳力失敗，術式不同。", "pitfall": "測提肌行程未固定眉毛，會把額肌力量算進去。", "recall": {"question": "為何提肌檢查需固定額肌？", "answer": "去除眉毛上提代償，測到真正提上眼瞼肌的行程。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n11-ptosis", "n11-exam-video"]}, {"id": "c23", "title": "先天肌源性下垂：視軸、皺摺與下看 lid lag", "pages": [31, 32, 34, 56, 58, 60, 63], "unitId": "u1", "sectionIndexes": [2, 7], "terms": ["congenital myogenic ptosis", "levator dysgenesis", "lid lag", "Bell phenomenon", "monocular elevation deficiency"], "keyPoints": ["先天提肌發育異常可使提肌行程低、皺摺淡或缺，向下看時上瞼不易隨降（lid lag）。下垂程度可輕可重，兒童弱視還可能來自散光或斜視，不只完全遮住瞳孔。", "需看 Bell 現象與上轉功能，後者異常可伴單眼上轉不足（舊稱 double elevator palsy）。Bell 是閉眼時眼球上轉保護角膜的反應，但不是保證術後不會暴露的保險。"], "clinicalLink": "提肌差又角膜保護差者，提升高度的目標要更謹慎。", "pitfall": "不是所有先天下垂都只能額肌懸吊，也不是兒童自然沒有暴露風險。", "recall": {"question": "先天肌源與後天腱膜型，下看常有何差別？", "answer": "前者可有 lid lag，後者上瞼常更隨眼球下降；仍需整體判讀。"}, "relatedTopics": ["notes-04", "notes-05"], "sourceIds": ["n11-ptosis"]}, {"id": "c24", "title": "眼肌型 MG：波動、抗體陰性與全身警訊", "pages": [32, 33, 56, 61, 63], "unitId": "u1", "sectionIndexes": [7], "terms": ["ocular myasthenia gravis", "AChR antibody", "ice pack test", "seronegative", "neuromuscular junction"], "keyPoints": ["MG 是神經肌肉接點疾病，常見可變疲勞性下垂或複視，瞳孔通常正常；原稿將它放肌源分類，臨床需理解病變不是提肌本身發育不良。休息或冰敷可改善，是支持而非單項確診。", "眼肌型 AChR 抗體可能陰性，需整合臨床、其他抗體或電生理；同時追問吞嚥、說話及呼吸無力，出現這些症狀需立即評估。先控制疾病，再於穩定且有功能需要時個別討論手術。"], "clinicalLink": "下垂外觀每日變動，應先問病因而不是直接訂固定高度。", "pitfall": "不能以陰性抗體排除 MG，也不設所有人必須等待五或十年的手術硬期限。", "recall": {"question": "疲勞性下垂加吞嚥變差，優先處理什麼？", "answer": "立即評估全身 MG 惡化及呼吸／吞嚥安全。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["n11-mg-integrated"]}, {"id": "c25", "title": "腱膜性下垂：肌肉有力，連接傳力出問題", "pages": [33, 34, 38, 56, 58, 60, 63], "unitId": "u1", "sectionIndexes": [7], "terms": ["aponeurotic ptosis", "dehiscence", "disinsertion", "high lid crease", "contact lens"], "keyPoints": ["提肌腱膜可因老化伸長、裂開 dehiscence 或附著脫離 disinsertion，力量無法有效傳到瞼板。常有較高皺摺而提肌行程相對保留，與先天肌源型的低行程、淡皺摺形成對照。", "既往眼內手術、長期隱形眼鏡操作或反覆牽拉可能相關，但病史不能取代神經檢查。原稿「用眼內手術治療」是錯誤概念：腱膜性下垂的修復針對眼瞼提肌連接，並非白內障式眼內操作。"], "clinicalLink": "下垂程度相同但行程不同，解釋為何重接腱膜可能比換用額肌合理。", "pitfall": "不能僅憑年紀高就排除新發 III 麻痺或 MG。", "recall": {"question": "高皺摺加保留提肌行程支持哪種機轉？", "answer": "腱膜傳力異常，但仍需病程及完整檢查確認。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n11-ptosis"]}, {"id": "c26", "title": "神經性下垂：急症判斷先於高度修復", "pages": [34, 35, 57, 61, 63], "unitId": "u1", "sectionIndexes": [7], "terms": ["CN III palsy", "Horner syndrome", "anisocoria", "carotid dissection"], "keyPoints": ["III 麻痺可見較重下垂、內轉和垂直運動受損、外下偏，瞳孔可大也可正常。新發病例需評估神經血管原因；有糖尿病和瞳孔保留都不能單獨排除動脈瘤。", "Horner 的輕度下垂與縮瞳來自交感路徑，暗處瞳孔差通常更明顯。急性頸頭痛相伴需緊急排內頸動脈剝離；無汗分布不同，未見無汗不能排除。"], "clinicalLink": "先問起病與疼痛、看明暗瞳孔和九方向眼動，才決定是否進入慢性修復討論。", "pitfall": "原稿「無散瞳就可觀察」不應作為通用規則。", "recall": {"question": "新發下垂但瞳孔等大，是否可直接安排美容？", "answer": "不可，需先判定眼動、神經及神經肌肉病因。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["n11-third-coverage", "n11-horner-coverage"]}, {"id": "c27", "title": "Marcus Gunn jaw-winking：不是 RAPD 的另一種名稱", "pages": [35], "unitId": "u1", "sectionIndexes": [2, 7], "terms": ["Marcus Gunn jaw-winking", "trigemino-oculomotor synkinesis"], "keyPoints": ["Jaw-winking 是下頜運動時上瞼異常上提的聯帶運動，常與先天單眼下垂共同出現，涉及三叉運動與動眼提肌路徑異常耦合。看嘴張開、咀嚼或側向移動時眼瞼變化，比靜態照片更有辨識力。", "評估仍需包含視軸、弱視、屈光與斜視；處理依下垂和聯帶運動影響而定。Marcus Gunn 也用於命名 RAPD，但後者是傳入瞳孔功能不對稱，兩者完全不同。"], "clinicalLink": "用動態觀察分出先天支配異常，避免只修垂下來的高度。", "pitfall": "不能把 jaw-winking 視為孩子故意擠眼，也不要與 Marcus Gunn pupil 混用。", "recall": {"question": "咀嚼時一側下垂眼瞼突然上提提示什麼？", "answer": "Jaw-winking 聯帶運動，需評估相關先天支配異常。"}, "relatedTopics": ["notes-03", "notes-04"], "sourceIds": ["n11-ptosis"]}, {"id": "c28", "title": "機械、創傷與假性下垂：抬起皮膚看真正瞼緣", "pages": [36, 57, 61, 63], "unitId": "u1", "sectionIndexes": [7], "terms": ["mechanical ptosis", "traumatic ptosis", "pseudoptosis", "dermatochalasis", "brow ptosis"], "keyPoints": ["機械性下垂可因腫物重量或瘢痕牽拉；創傷性可能傷提肌、腱膜或神經。假性下垂包括 dermatoc
