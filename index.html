halasis 皮膚鬆垂、眉下垂、眼球內陷或較低眼位，真正上瞼緣不一定本身異常。", "輕抬多餘皮膚、檢查眉位及眼球位置，再量 MRD1；術後下垂可有暫時性原因，但何時觀察與修復依機轉。不能把所有創傷都等半年，尤其有明確結構斷裂或急性神經徵象。"], "clinicalLink": "同樣覺得睜不開，可能需要不同專科和處理目標。", "pitfall": "假性下垂不只 dermatochalasis 一種，不能一律剪皮。", "recall": {"question": "抬起多餘皮膚後瞼緣位置正常支持什麼？", "answer": "皮膚鬆垂造成的假性下垂，仍應評估其他共存問題。"}, "relatedTopics": ["notes-08"], "sourceIds": ["n11-ptosis"]}, {"id": "c29", "title": "MMCR：後路修復需要合適功能與眼表", "pages": [36, 37, 38, 57, 62, 63, 64], "unitId": "u1", "sectionIndexes": [8], "terms": ["Müller muscle conjunctival resection", "MMCR", "phenylephrine test"], "keyPoints": ["MMCR 從眼瞼結膜側處理 Müller／結膜複合體，常用於提肌功能良好且程度合適的下垂。Phenylephrine 測試觀察交感刺激後抬高反應，能協助評估，但不是唯一決定術式的數據。", "選擇仍需看閉合、眼表、淚液狀況、過去手術與期望高度；手術能提高多少不是所有人固定 2–3 mm。外面少切口不等於沒有風險，仍可能矯正不足、過度或暴露。"], "clinicalLink": "將「後路」與為何病人提肌要能用連起來理解。", "pitfall": "不能只由 MRD1 低就選 MMCR，也不把藥物測試當必然療效保證。", "recall": {"question": "MMCR 的基本候選條件之一？", "answer": "提肌功能保留，並有合適的下垂表型與眼表保護條件。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n11-ptosis"]}, {"id": "c30", "title": "External levator advancement：恢復腱膜傳力", "pages": [39, 40, 57, 62, 64], "unitId": "u1", "sectionIndexes": [8], "terms": ["external levator advancement", "levator resection", "aponeurosis repair"], "keyPoints": ["外路提肌腱膜前移 advancement 重點是重新定位與固定傳力結構；resection 是縮短肌肉／腱膜組織，兩詞不應完全等同。常在有可利用提肌功能的病例考慮，具體方案依病因及下垂程度。", "術後需追蹤兩眼高度、輪廓、閉合、乾澀及角膜，早期腫脹瘀青的照片不能用來預測長期結果。No.11 第 40 頁為術前後示例，教材僅取其「追蹤功能與時間軸」概念，不轉載人像。"], "clinicalLink": "解剖層次與力的傳遞解釋手術作用，而非保證每人可提高固定毫米數。", "pitfall": "術式名稱有 advancement 不表示每次都必須切掉一段提肌。", "recall": {"question": "腱膜前移和額肌懸吊利用的力量相同嗎？", "answer": "不同；前者利用提肌，後者借額肌。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n11-ptosis"]}, {"id": "c31", "title": "Frontalis suspension：借額肌必須先算角膜代價", "pages": [41, 42, 57, 62, 63, 64], "unitId": "u1", "sectionIndexes": [8], "terms": ["frontalis sling", "brow suspension", "Fox", "Crawford", "silicone sling"], "keyPoints": ["額肌懸吊把眼瞼與額肌力量連結，常在提肌功能很差時考慮。Fox 五角形與 Crawford 雙三角是不同懸吊配置名稱，silicone sling 是可用材料之一；這些名稱不取代對病因和功能的判斷。", "可能增加閉合不全與暴露，所以術前評估 Bell、角膜感覺、淚膜與眨眼，術後持續保護。兒童也會暴露，MG 或其他眼肌病更需謹慎；術式選擇不是單看年齡。"], "clinicalLink": "術後高度增加若伴上皮破損，不能稱為成功而忽略視力風險。", "pitfall": "No.11 第 42 頁是示例照片，不應推論所有材料或配置都同樣適用。", "recall": {"question": "為何提肌差時考慮額肌懸吊？", "answer": "利用額肌替代部分提瞼力量，但須能接受並管理閉合與暴露風險。"}, "relatedTopics": ["notes-04", "notes-05"], "sourceIds": ["n11-ptosis", "n11-exposure"]}, {"id": "c32", "title": "眼瞼後縮與 TED：暴露和視神經壓迫分開查", "pages": [43, 58], "unitId": "u1", "sectionIndexes": [9], "terms": ["lid retraction", "scleral show", "lateral flare", "TED", "tendon sparing"], "keyPoints": ["眼瞼後縮使上或下方鞏膜暴露增加，TED 是重要病因；上瞼外側更高的 lateral flare 可提供線索。還需看突眼、結膜水腫、眼動限制與複視，不能只按「露眼白」診斷。", "TED 的肌肉增大常以肌腹為主且肌腱相對保留，但影像模式並非絕對。甲狀腺功能與眼眶活動度不是一對一；需獨立評估暴露性角膜病變與壓迫性視神經病變。"], "clinicalLink": "視力、色覺或 RAPD 變化應提高緊迫性，即使外觀只是眼瞼後縮。", "pitfall": "甲狀腺抽血正常不能排除 TED；也不把每個 scleral show 視為同一疾病。", "recall": {"question": "TED 的眼表暴露和視神經病變如何分辨？", "answer": "分別看閉合染色，以及視力、色覺、RAPD、視野和眶尖證據。"}, "relatedTopics": ["notes-08", "notes-03"], "sourceIds": ["n11-exposure", "n11-tepezza-coverage"]}, {"id": "c33", "title": "Rundle 曲線與 TED 治療：活動度、嚴重度分開", "pages": [44, 45, 58], "unitId": "u1", "sectionIndexes": [9], "terms": ["Rundle curve", "active TED", "inactive TED", "teprotumumab", "glucocorticoids", "blepharotomy"], "keyPoints": ["Rundle 曲線用來描述活動性發炎逐漸轉穩定的概念，但個別病程不同；活動度不等於嚴重度，靜止期仍可能有嚴重複視或暴露。保護眼表、戒菸和處理甲狀腺等全身因素貫穿各階段。", "活動性且達適應條件可評估全身抗炎或靶向治療；穩定殘餘後縮常考慮 blepharotomy 等復健手術。原稿「inactive 只能手術」過度絕對：美國 teprotumumab 仿單適應症不限活動度或病程，仍需個別風險與可及性判斷。"], "clinicalLink": "既往眶減壓或斜視手術會影響眼瞼，復健通常按眶、斜視、眼瞼的順序規劃。", "pitfall": "不要把局部類固醇或 Botox 當無風險普遍療法，也不提供固定注射配方。", "recall": {"question": "為何 TED 活動度和嚴重度要分開？", "answer": "不發炎不代表沒有功能障礙，而活動發炎也可能尚輕，治療目標不同。"}, "relatedTopics": ["notes-08", "notes-13"], "sourceIds": ["n11-tepezza-coverage", "n11-exposure"]}, {"id": "c34", "title": "原發眼瞼痙攣：功能性失明不是視網膜失明", "pages": [46, 58, 62, 64], "unitId": "u1", "sectionIndexes": [9], "terms": ["benign essential blepharospasm", "functional blindness", "botulinum toxin", "myectomy"], "keyPoints": ["原發眼瞼痙攣通常為雙側不自主眼輪匝肌收縮，可能涉及皺眉或鼻眉肌，清醒活動時影響張眼；即使眼內視力正常，也可能因無法持續打開眼瞼而出現功能性失明。", "需排眼表刺激與其他運動障礙。選定局部 botulinum toxin 可減少收縮；反應不足時由專科考慮 myectomy 等方案。原稿的顏面神經消融屬較少採用且副作用重要的策略，不當作一般升級流程。"], "clinicalLink": "問閱讀、行走與駕駛時是否會突然閉眼，功能影響決定照護目標。", "pitfall": "單純偶發眼皮跳不等於原發性痙攣；Botox 也可能造成閉合不全或複視。", "recall": {"question": "視力正常為何仍可能「功能性失明」？", "answer": "因不自主持續閉眼，無法可靠使用視覺。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n11-beb-coverage", "n11-exposure"]}, {"id": "c35", "title": "半面痙攣：單側下半臉與睡眠線索", "pages": [47, 58, 62, 64], "unitId": "u1", "sectionIndexes": [9], "terms": ["hemifacial spasm", "CN VII", "neurovascular compression", "microvascular decompression"], "keyPoints": ["Hemifacial spasm 多為單側，可從眼周累及同側下半臉，睡眠中也可能持續；與通常雙側的原發眼瞼痙攣不同。常見機轉是神經出口區域血管對 VII 的壓迫，不是「供應神經的血管被壓」這一描述。", "需評估神經徵象與適當影像，排除結構病變或顏面麻痺後聯帶運動。Botulinum toxin 可控制症狀，明確適合的神經血管壓迫病例可能討論微血管減壓，風險效益需個別化。"], "clinicalLink": "觀察收縮分布比只問眼皮跳多久更能分辨病因。", "pitfall": "不是每個半面痙攣都因腫瘤，也不只靠睡眠是否跳作唯一診斷。", "recall": {"question": "單側眼周連嘴角一起抽動較支持哪個分類？", "answer": "半面痙攣或相關 VII 運動異常，需完整評估。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n11-hfs-coverage"]}, {"id": "c36", "title": "VII 麻痺與閉合不全：等待恢復期間也要保護", "pages": [3, 6, 47], "unitId": "u2", "sectionIndexes": [1, 9], "terms": ["facial nerve palsy", "paralytic lagophthalmos", "tarsorrhaphy", "exposure keratopathy"], "keyPoints": ["顏面神經無力造成 orbicularis 閉合不足，伴眨眼減少、淚泵失常或外翻，角膜持續暴露可發生上皮缺損與瘢痕。神經之後可能恢復，不表示等待期間可以放任眼表受傷。", "保護依風險選擇潤滑、可靠閉合保護與必要的暫時瞼縫合 tarsorrhaphy 等方案；需看 Bell、感覺及染色。持續重度損害應及時眼整形／角膜協作，並評估神經病因。"], "clinicalLink": "先保住透明角膜，才有機會在神經恢復後使用視力。", "pitfall": "不要只開人工淚液卻不檢查睡覺時到底閉不閉得上。", "recall": {"question": "VII 麻痺最直接影響開眼還是閉眼？", "answer": "主要影響閉眼，因其支配眼輪匝肌。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["n11-exposure"]}, {"id": "c37", "title": "BCC：結節與硬化型的邊界差異", "pages": [48, 49, 59], "unitId": "u3", "sectionIndexes": [10], "terms": ["basal cell carcinoma", "nodular BCC", "morpheaform BCC", "madarosis", "margin control"], "keyPoints": ["BCC 常見於日曬眼瞼區尤其下瞼與內眥，可呈珍珠樣結節、表面微血管、潰瘍、反覆出血或脫睫 madarosis。結節型與 morpheaform 硬化型都屬惡性，後者邊界常較不清楚、深部侵犯更難掌握。", "確診依病理，處理重點是完整切除與切緣控制，必要時評估眶內延伸。雖遠端轉移罕見，局部破壞可重大；不能把結節型稱為良性或把一個地區的比例套到所有人群。"], "clinicalLink": "不癒合內眥病灶要同時檢查眼眶功能及感覺，避免只看表面。", "pitfall": "色素淡、長得慢並不等於不需取樣。", "recall": {"question": "硬化型 BCC 為何切緣更難判斷？", "answer": "浸潤界線不清，臨床可見邊界可能低估深部範圍。"}, "relatedTopics": ["notes-08"], "sourceIds": ["n11-bcc-coverage"]}, {"id": "c38", "title": "SCC：表皮癌前變化與沿神經擴散", "pages": [49, 59], "unitId": "u3", "sectionIndexes": [10], "terms": ["squamous cell carcinoma", "actinic keratosis", "perineural invasion"], "keyPoints": ["眼瞼 SCC 可由日光性角化 actinic keratosis 等病灶演變，也可直接發生。相較 BCC，區域淋巴與周邊神經擴散更值得留意；持續潰瘍、角化、快速增長或感覺異常會改變風險。", "需組織診斷、評估侵入深度與切緣，必要時查淋巴結與影像。眶剜除並非所有轉移或 SCC 的固定下一步，應依局部範圍、分期與多專科方案決定。"], "clinicalLink": "麻木、疼痛或運動變化不只是皮膚症狀，可能提示深部／神經擴散。", "pitfall": "不要照原稿把所有轉移都簡化成挖除眼眶。", "recall": {"question": "眼瞼 SCC 病灶附近新麻木有何意義？", "answer": "需考慮周邊神經侵犯或其他深部受累。"}, "relatedTopics": ["notes-08"], "sourceIds": ["n11-scc-coverage"]}, {"id": "c39", "title": "皮脂腺癌：反覆腫塊與單側慢性發炎的偽裝", "pages": [49, 50, 59, 60, 61, 63], "unitId": "u3", "sectionIndexes": [3, 10], "terms": ["sebaceous carcinoma", "Meibomian", "Zeis", "pagetoid spread", "masquerade syndrome"], "keyPoints": ["皮脂腺癌可起於 Meibomian、Zeis 或眼周皮脂腺；上瞼腺體豐富，病灶可像霰粒腫，也可像單側久治不癒的瞼結膜炎。脫睫、腺口消失、結構破壞和反覆同位置是重要線索。", "可有上皮內 pagetoid 擴散而超出一個結節，需要翻瞼、檢視結膜和適當病理。取樣與切除範圍依專科判斷，隨後規劃切緣、全身／淋巴評估及重建，不能只再做一次簡單刮除。"], "clinicalLink": "把第 12 章慢性單側結膜炎與此章腫瘤聯繫，形成重新診斷的觸發點。", "pitfall": "年齡或性別不是排除條件；外觀像良性不等於病理良性。", "recall": {"question": "反覆霰粒腫之外，皮脂腺癌還可偽裝成什麼？", "answer": "慢性單側瞼結膜炎等廣泛表面發炎。"}, "relatedTopics": ["notes-12"], "sourceIds": ["n11-sebaceous"]}, {"id": "c40", "title": "黑色素瘤：顏色只是線索，病理與厚度決定風險", "pages": [50, 59], "unitId": "u3", "sectionIndexes": [10], "terms": ["eyelid melanoma", "amelanotic melanoma", "ABCDE", "Breslow thickness"], "keyPoints": ["眼瞼黑色素瘤可為新生或原有痣改變；不對稱、邊界不規則、顏色不均及持續變化是取樣線索。無色素型 amelanotic melanoma 可能不黑，所以顏色淺不能排除。", "病理確認後需依厚度（Breslow 等）、潰瘍和擴散情況分期；治療與是否需淋巴評估由專科決定。原稿只有「死亡率高」不足以教決策，應轉成及時辨認、取樣與分期。"], "clinicalLink": "比較舊照片的變化有價值，但不能以照片代替病理。", "pitfall": "不要把所有黑痣都說成惡性，也不要用直徑小就絕對放心。", "recall": {"question": "沒有黑色素顏色的眼瞼病灶能否是 melanoma？", "answer": "可以，無色素型存在，需由整體可疑徵象和病理判斷。"}, "relatedTopics": ["notes-12"], "sourceIds": ["n11-melanoma-coverage"]}, {"id": "c41", "title": "眼周美容評估：比例是溝通工具，功能是共同底線", "pages": [51, 59], "unitId": "u2", "sectionIndexes": [11], "terms": ["facial symmetry", "facial thirds", "facial fifths", "patient goals"], "keyPoints": ["臉部分三等分、五等分與左右對稱可用來描述比例，但審美受文化、個人期待和自然變異影響，不能宣稱所有人有唯一標準。先問困擾與期待，再分清皮膚、眉位、眼瞼和眶內問題。", "眼周操作前檢查視力、閉合、眼表、提肌、既往手術與藥物；看似美容的下垂可能是神經急症。瞭解具體希望改變什麼，有助選擇適當療法並避免以過度抬高換取角膜傷害。"], "clinicalLink": "面試回答可從患者目標、解剖原因、功能代價與可行選項展開。", "pitfall": "「看起來年輕」不能作為跳過神經與眼表評估的理由。", "recall": {"question": "為何比例測量不能直接決定手術？", "answer": "它只是描述工具，仍需個別目標、解剖和功能風險評估。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n11-ptosis", "n11-exam-video"]}, {"id": "c42", "title": "老化三層：皮膚、脂肪與骨架共同改變輪廓", "pages": [51, 52, 53, 59], "unitId": "u2", "sectionIndexes": [11], "terms": ["skin aging", "fat redistribution", "bone remodeling", "tear trough", "crow’s feet", "jowls"], "keyPoints": ["皮膚老化影響彈性、紋理與細紋；脂肪可萎縮、位移或局部突出；骨性支持亦會重塑。眉垂、眼袋、淚溝 tear trough、魚尾紋 crow’s feet 和下頜鬆垂 jowls，未必來自同一層。", "No.11 圖像還標出額紋、眉間紋、鼻淚溝、瞼頰溝與中頰凹陷，都是描述位置與輪廓的詞。體積缺失和動態收縮混在一起時，單一療法不可能處理所有原因；生活方式及防曬仍是基本背景。"], "clinicalLink": "先定位缺少支撐、組織下垂或肌肉牽動，解釋為何眼袋和凹陷可以同時出現。", "pitfall": "不能把老化簡化為所有脂肪均減少或骨頭整體向下塌。", "recall": {"question": "眼袋突出又有淚溝凹陷是否矛盾？", "answer": "不矛盾，不同區域的脂肪分布與支持可以同時改變。"}, "relatedTopics": ["notes-08"], "sourceIds": ["n11-exam-video", "n11-filler-coverage"]}, {"id": "c43", "title": "動態紋與肉毒毒素：作用在神經末梢，不是填體積", "pages": [53, 54, 59, 62, 63], "unitId": "u2", "sectionIndexes": [11], "terms": ["dynamic wrinkle", "static wrinkle", "BoNT-A", "SNAP-25", "BoNT-B", "VAMP"], "keyPoints": ["動態紋隨肌肉收縮變化，靜態紋在放鬆時仍可見，涉及皮膚與支撐結構。Botulinum toxin 通過抑制神經末梢乙醯膽鹼釋放減少收縮；A 型切割 SNAP-25，B 型切割 VAMP，兩者都干擾囊泡釋放機制。", "臨床可用於選定痙攣、斜視或動態紋，效果暫時且重複治療需個別安排。不同產品效力單位不可自行等換；神經肌肉疾病、妊娠哺乳及合併用藥需專業風險評估，不沿用原稿的一律禁忌或固定時效。"], "clinicalLink": "它減少肌肉牽動，不能補回凹陷或治好造成下垂的所有病因。", "pitfall": "出現吞嚥、呼吸困難等全身無力應立即求醫；眼周局部擴散也可能下垂或複視。", "recall": {"question": "Botox 與填充物的主要作用差異？", "answer": "前者減少神經肌肉傳遞，後者改變組織體積或支撐。"}, "relatedTopics": ["notes-04", "notes-13"], "sourceIds": ["n11-botox-coverage", "n11-myobloc-coverage"]}, {"id": "c44", "title": "填充物與其他美容方式：作用層次與視覺急症", "pages": [55, 59, 62, 63], "unitId": "u2", "sectionIndexes": [11], "terms": ["hyaluronic acid filler", "collagen filler", "vascular occlusion", "laser resurfacing", "chemical peel", "facelift", "liposuction"], "keyPoints": ["玻尿酸、膠原等 filler 以增加體積或支撐改善部分凹陷與皺紋；產品吸水性、硬度和可用位置不同。雷射／化學換膚主要處理表面質地，拉皮或抽脂改變鬆弛或脂肪配置，各自針對不同層次。", "填充物誤入血管可造成皮膚壞死、視力損害甚至中風；注射中或後突發視力變化、異常疼痛或皮膚缺血需立即醫療處理。聯合療程是否適合需完整評估，並非絕對不可組合，也不是組合越多越有效。"], "clinicalLink": "將皮膚、肌肉和體積三條治療路徑與病人的具體問題相配。", "pitfall": "不將美容程序描述為保證安全；也不提供自行注射位置、劑量或補救配方。", "recall": {"question": "眼周填充後突發視力變差應如何處理？", "answer": "立即停止相關操作並啟動緊急醫療／眼科評估，不能等待自行退腫。"}, "relatedTopics": ["notes-10", "notes-14"], "sourceIds": ["n11-filler-coverage"]}], "unresolved": [], "sourceSha256": "83318983785d08bb733c2609011ae913fd4e40e8d068db8f86c0f2eb7e2c3ded"}, "notes-12": {"sourceFile": "眼科學No.12.pdf", "pageCount": 68, "reviewedPages": [{"from": 1, "to": 4, "kind": "administrative", "note": "封面、目錄及課務回饋；不納入私人姓名與評語。"}, {"from": 5, "to": 24, "kind": "teaching", "note": "結膜結構、形態、感染、過敏、退化、腫瘤與移植相關眼表病。"}, {"from": 25, "to": 27, "kind": "exam", "note": "紅眼與角膜染色考點及解析，改寫為原創概念。"}, {"from": 28, "to": 28, "kind": "teaching", "note": "結膜重點回顧。"}, {"from": 29, "to": 30, "kind": "exam", "note": "結膜疾病與腫瘤考點。"}, {"from": 31, "to": 45, "kind": "teaching", "note": "淚膜、乾眼定義、分型、檢查與瞼板腺。"}, {"from": 46, "to": 51, "kind": "exam", "note": "結膜、化學傷、維生素與乾眼考點及解析。"}, {"from": 52, "to": 61, "kind": "teaching", "note": "淚液成分、系統疾病、神經與藥物、眨眼及治療。"}, {"from": 62, "to": 68, "kind": "exam", "note": "前述概念的重複考題及補充；不逐字重刊題目。"}], "entries": [{"id": "c01", "title": "結膜三區與檢查盲點", "pages": [5, 8], "unitId": "u1", "sectionIndexes": [0], "terms": ["瞼結膜", "球結膜", "穹窿結膜", "Tenon囊", "淚點", "gray line"], "keyPoints": ["瞼結膜貼在眼瞼內面，球結膜覆蓋眼前方鞏膜，穹窿結膜形成可活動的反折，讓眼球轉動時仍維持連續表面。Tenon囊在球結膜更深處，不能把不同層次都叫眼白。", "檢查紅眼需翻瞼與觀察穹窿，否則容易漏掉異物、濾泡與瘢痕。淚點是引流開口；gray line是眼瞼緣的手術定位標誌，不宜等同黏膜皮膚交界或結膜邊界。"], "clinicalLink": "把症狀位置與翻瞼所見配對，能找到隱藏的機械刺激源。", "pitfall": "只看球結膜正常就結束眼表檢查。", "recall": {"question": "為何紅眼仍需翻上眼瞼？", "answer": "上瞼內面可藏異物、乳頭、瘢痕，這些不一定從正面看得到。"}, "relatedTopics": ["notes-11"], "sourceIds": ["cov12-conj", "an12-ocular"]}, {"id": "c02", "title": "角膜緣幹細胞與結膜化", "pages": [6, 47, 51, 63, 66], "unitId": "u1", "sectionIndexes": [0], "terms": ["limbus", "Palisades of Vogt", "角膜緣幹細胞", "結膜化"], "keyPoints": ["角膜緣位於透明角膜與鞏膜交界，Palisades of Vogt是其柵欄樣結構，與角膜上皮幹細胞的微環境相關。角膜上皮修復需要保有此細胞來源和合適的表面環境。", "化學傷或嚴重瘢痕破壞角膜緣後，可出現反覆上皮缺損、表面血管與結膜化。這不是把正常結膜分泌功能增強，而是角膜表型和屏障喪失；後續重建須同時處理眼瞼及發炎。"], "clinicalLink": "檢查化學傷時，角膜緣缺血與上皮缺損範圍會改變預後判斷。", "pitfall": "把共筆早期的「幹細胞仍是假說」當現行結論。", "recall": {"question": "角膜緣重傷為何可能長出表面血管？", "answer": "上皮幹細胞功能與屏障受損，角膜表面可能被結膜樣上皮取代。"}, "relatedTopics": ["notes-05"], "sourceIds": ["an12-ocular", "cov12-management"]}, {"id": "c03", "title": "分泌腺體與黏蛋白界面", "pages": [6, 7, 31, 32, 52, 53], "unitId": "u1", "sectionIndexes": [0], "terms": ["Goblet cell", "MUC5AC", "Henle隱窩", "Manz腺", "Krause腺", "Wolfring腺", "Meibomian腺", "Zeis腺", "Moll腺"], "keyPoints": ["杯狀細胞分泌MUC5AC等分泌型黏蛋白；角膜與結膜上皮另有膜結合黏蛋白，建立可濕潤的糖萼界面。Henle隱窩與Manz腺是傳統結膜分泌構造名稱，不能取代對杯狀細胞及上皮界面的理解。", "主淚腺和Krause、Wolfring副淚腺提供水液；瞼板Meibomian腺是淚膜脂質的重要來源。Zeis是睫毛相關皮脂腺，Moll為改良汗腺，不能把三者功能完全等同；主、副淚腺也不是互不重疊的反射與基礎開關。"], "clinicalLink": "先知道哪個結構負責哪項功能，才可解釋水液足夠但仍不穩定的乾眼。", "pitfall": "把黏蛋白當成與水層完全分離的一張薄膜。", "recall": {"question": "眼淚很多但分布不勻，可想到哪個界面？", "answer": "黏蛋白、上皮糖萼、脂質與眨眼均影響均勻分布。"}, "relatedTopics": [], "sourceIds": ["an12-ocular", "an12-dews2"]}, {"id": "c04", "title": "充血、出血與水腫是不同現象", "pages": [8, 9, 13], "unitId": "u2", "sectionIndexes": [1], "terms": ["Hyperemia", "Subconjunctival hemorrhage", "Chemosis", "Valsalva", "抗凝血藥"], "keyPoints": ["充血是血管內血流或血管擴張增加，結膜下出血則是血液跑到血管外，呈邊界較清楚的紅片。無痛且視力不變常支持單純出血，但外傷、反覆發作或其他出血徵象需要另評估。", "Chemosis是結膜水腫，可見過敏、發炎或靜脈回流障礙；合併突眼與眼球運動異常時要向眼眶或CCF思考。結膜下出血可和Valsalva、血壓或抗凝血藥相關，不能因看到紅片就自行停抗凝療程。"], "clinicalLink": "描述血管、紅片與透明膠狀隆起，比只說「很紅」更能改變鑑別。", "pitfall": "沿用原共筆「出血就暫停抗凝劑」的通則。", "recall": {"question": "結膜水腫加突眼，為何不能只當過敏？", "answer": "靜脈回流受阻或眶內疾病也會水腫，需要檢查視功能和眼球運動。"}, "relatedTopics": ["notes-08", "notes-14"], "sourceIds": ["cov12-sch", "cov12-conj"]}, {"id": "c05", "title": "乳頭與濾泡：形態不是病原檢驗", "pages": [9, 10, 14, 15, 28, 29, 30, 46, 47, 50, 62, 63, 66], "unitId": "u2", "sectionIndexes": [1], "terms": ["Papilla", "Follicle", "Giant papilla", "淋巴結"], "keyPoints": ["乳頭由中央血管與周圍發炎組織形成，常見過敏、細菌性刺激、眼瞼炎或異物反應；巨大乳頭是乳頭的明顯增生，不是巨大濾泡。濾泡是淋巴組織隆起，血管多在周邊，常提示病毒、披衣菌或藥物反應。", "大小與顏色會重疊，須合併急慢性、分泌物、角膜所見與耳前淋巴結。耳前淋巴結腫大可見病毒、披衣菌及Parinaud等情境，不能用單一體徵斷定病原或排除細菌。"], "clinicalLink": "先描述形態再提出兩項合理病因，最後指定用哪些資料區分。", "pitfall": "把所有細菌性結膜炎說成濾泡，或把過敏完全限定一種免疫反應。", "recall": {"question": "乳頭與濾泡最實用的結構差別？", "answer": "乳頭有中央血管核心；濾泡中央為淋巴性組織，血管多被推到周邊。"}, "relatedTopics": [], "sourceIds": ["cov12-conj"]}, {"id": "c06", "title": "皰性結膜炎是抗原反應，不是普通水泡", "pages": [11, 20, 21, 25, 27, 28, 29], "unitId": "u2", "sectionIndexes": [1, 5], "terms": ["Phlyctenulosis", "Phlyctenular keratoconjunctivitis", "第四型過敏", "葡萄球菌", "結核"], "keyPoints": ["皰性角結膜炎常在角膜緣形成小結節和周邊血管反應，本質偏向對微生物抗原的延遲型細胞免疫反應。葡萄球菌相關眼瞼炎是常見線索，結核風險則依地區、接觸與全身症狀評估。", "病灶若進入角膜可造成畏光、潰瘍、血管與瘢痕。處理需同時降低發炎和抗原來源；有上皮缺損時仍須排除感染，不能只見小結節就無監測地使用類固醇。"], "clinicalLink": "把眼瞼炎、反覆角膜緣結節與瘢痕連成同一機轉。", "pitfall": "將phlyctenule當作內含細菌的單純水泡。", "recall": {"question": "為何治療角膜結節還要處理眼瞼炎？", "answer": "眼瞼微生物抗原可持續驅動過敏性炎症，僅壓下局部發炎容易復發。"}, "relatedTopics": ["notes-05", "notes-11"], "sourceIds": ["cov12-phlyct"]}, {"id": "c07", "title": "結膜結石：有症狀才處理的上皮下沈積", "pages": [11], "unitId": "u2", "sectionIndexes": [1], "terms": ["Conjunctival concretions", "Lithiasis", "上皮碎屑"], "keyPoints": ["翻瞼看到細小黃白色結膜結石時，先確認是否穿出上皮並接觸角膜。主要成分是退化上皮與蛋白性分泌物，可伴鈣化，並非都由瞼板腺堵塞變成真正礦石。", "埋在上皮下且沒有刺激的結石通常不需處理；突出後造成固定異物感或染色，才由眼科評估移除。病灶形態仍要與小囊腫和淋巴濾泡區分。"], "clinicalLink": "用症狀位置與染色證據決定處理，而非看到白點就挑除。", "pitfall": "認為所有結膜結石都必須移除。", "recall": {"question": "哪種結膜結石較可能需要處理？", "answer": "已穿出表面並造成異物感、持續刺激或角膜摩擦者。"}, "relatedTopics": [], "sourceIds": ["cov12-concret"]}, {"id": "c08", "title": "分泌物、真膜與偽膜", "pages": [11, 14, 18, 19], "unitId": "u2", "sectionIndexes": [1], "terms": ["Discharge", "Mucopurulent", "Pseudomembrane", "Membrane", "Symblepharon"], "keyPoints": ["水樣、黏絲樣與黏膿性分泌物分別提供病毒／刺激、過敏、細菌等方向，但重疊不少；大量快速累積膿液比普通早晨眼屎更需警覺淋菌。角膜與視力的異常不能由分泌物顏色解釋掉。", "偽膜較表淺，真膜和上皮結合較緊、移除較可能出血，臨床可難分。重症感染、SJS與化學傷都可能形成膜；眼科處理膜的目的包含控制發炎及降低黏連，不宜教病人在家用棉棒剝除。"], "clinicalLink": "膜不是病毒的專屬診斷，需問新藥、黏膜病與化學暴露。", "pitfall": "把可以剝掉的膜視為完全良性。", "recall": {"question": "有結膜膜狀物時，還要補問哪兩類病史？", "answer": "新藥及皮膚／口腔黏膜症狀，和化學或熱傷等暴露。"}, "relatedTopics": [], "sourceIds": ["cov12-conj", "cov12-sjs"]}, {"id": "c09", "title": "肉芽腫、霰粒腫與瘢痕性黏連", "pages": [12, 14], "unitId": "u2", "sectionIndexes": [1], "terms": ["Granuloma", "Pyogenic granuloma", "Chalazion", "Symblepharon", "OCP"], "keyPoints": ["術後或異物刺激可出現易出血的化膿性肉芽腫，其名稱不代表一定是化膿感染；其他肉芽腫性結膜病灶可與貓抓病、sarcoidosis或異物有關。診斷需看病史、外觀與必要病理，不能一律點類固醇。", "霰粒腫是瞼板腺脂質引起的慢性肉芽腫反應，需與急性麥粒腫區分。Symblepharon是瞼結膜與球結膜異常黏連；若持續進展應考慮眼黏膜類天皰瘡（OCP）、SJS、化學傷等，而非只將黏連剪開。"], "clinicalLink": "把表面突起分成血管性、腺體性與瘢痕性，下一步不同。", "pitfall": "沿用原文把霰粒腫稱為副淚腺或睫毛囊細菌感染。", "recall": {"question": "反覆同一處「霰粒腫」需重新想什麼？", "answer": "需重查病灶並排除眼瞼腫瘤等偽裝疾病。"}, "relatedTopics": ["notes-11"], "sourceIds": ["cov12-conj", "cov12-sjs"]}, {"id": "c10", "title": "紅眼的眼瞼、鞏膜及眼眶模仿者", "pages": [12, 13, 25, 27], "unitId": "u2", "sectionIndexes": [1], "terms": ["Blepharitis", "Floppy eyelid syndrome", "Episcleritis", "Scleritis", "CCF"], "keyPoints": ["眼瞼炎可有瞼緣不整、毛細血管與睫毛碎屑；floppy eyelid syndrome是眼瞼容易外翻與夜間機械刺激的線索，不是結膜本身感染。上鞏膜炎較表淺，鞏膜炎常深層痛、可能與自體免疫或感染相關。", "CCF可表現螺旋樣擴張血管、結膜水腫、突眼及眼球運動受限，反映靜脈壓升高。紅眼伴深痛、視功能下降或眶內徵象時，要離開「普通結膜炎」路徑做及時評估。"], "clinicalLink": "檢查瞼緣、血管深度及眼球運動，能避免只依紅色區域開藥。", "pitfall": "因為紅在眼白，就把病因限定結膜。", "recall": {"question": "深部劇痛與突眼分別提示哪些層次？", "answer": "深痛考慮鞏膜或眼內，突眼及運動異常則需評估眼眶或血管回流。"}, "relatedTopics": ["notes-05", "notes-08", "notes-11"], "sourceIds": ["cov12-conj", "cov12-slk"]}, {"id": "c11", "title": "一般細菌性結膜炎與需要採樣的情境", "pages": [14, 15], "unitId": "u2", "sectionIndexes": [3], "terms": ["Staphylococcus", "Streptococcus", "Haemophilus", "Moraxella", "細菌培養"], "keyPoints": ["葡萄球菌、鏈球菌與流感嗜血桿菌等可引起細菌性結膜炎；成人、小兒及特定暴露的病原分布不同，Moraxella等亦可列入情境鑑別。黏膿性分泌物、早晨眼瞼黏住支持感染，但不代表所有紅眼皆需抗生素。", "一般個案可依臨床判斷；新生兒、大量膿液、慢性無反應、免疫低下或角膜侵犯更需要採樣與專科處理。接觸鏡戴用者痛紅要先排角膜炎，不直接套用普通結膜炎療程。"], "clinicalLink": "決定「是否需要培養」時，先評估重症與非典型條件。", "pitfall": "用單一分泌物顏色認定病原並照抄舊療程。", "recall": {"question": "哪幾種結膜炎更應考慮採樣？", "answer": "新生兒、超急性大量膿液、持續不癒或角膜受侵者。"}, "relatedTopics": [], "sourceIds": ["cov12-conj"]}, {"id": "c12", "title": "超急性淋菌結膜炎與全身處理", "pages": [16, 17, 18], "unitId": "u2", "sectionIndexes": [3], "terms": ["Neisseria gonorrhoeae", "Neisseria meningitidis", "Gram-negative diplococci", "角膜融解"], "keyPoints": ["淋菌可造成超急性大量膿液與快速角膜破壞，應急診／眼科處理，採集病原資料並安排全身抗菌治療。形態上的細胞內革蘭陰性雙球菌是強線索，但其他Neisseria包括腦膜炎雙球菌需靠檢驗與全身情境分辨。", "成人需合併性傳染感染評估及伴侶處理；眼部表現改善不等於生殖泌尿感染已清除。角膜融解、穿孔與全身感染風險，使此病不能只使用局部點眼藥或先試類固醇。"], "clinicalLink": "大量快速復積的膿液是轉換急迫度的證據。", "pitfall": "誤當腺病毒而單獨使用類固醇。", "recall": {"question": "淋菌結膜炎為何不能只點抗生素？", "answer": "它可快速侵犯角膜且可能有全身／其他黏膜感染，需全身治療與專科處理。"}, "relatedTopics": [], "sourceIds": ["cov12-conj", "cov12-cdc-gono"]}, {"id": "c13", "title": "披衣菌：成人包涵體、砂眼與LGV不可混為一談", "pages": [16, 17, 28, 46, 50, 62, 66], "unitId": "u2", "sectionIndexes": [3, 4], "terms": ["Chlamydia trachomatis", "Adult inclusion conjunctivitis", "Trachoma", "A–C", "D–K", "LGV"], "keyPoints": ["成人包涵體結膜炎常與C. trachomatis D–K型相關，可為持續性單眼濾泡反應、耳前淋巴結與局部治療無效；即使泌尿生殖症狀不明顯，仍需合適感染檢驗及全身／伴侶處理。", "砂眼經典與A–C型反覆感染相關，不能把它當成成人性傳染包涵體感染的別名；L型相關LGV是另一種性傳染病情境。型別是理解臨床模式的框架，不是靠眼睛外觀就能定型。"], "clinicalLink": "慢性濾泡反應需回到暴露史與全身感染，不能只續開局部藥。", "pitfall": "原考題解析把砂眼普遍說成單側且伴生殖器病變。", "recall": {"question": "D–K型與A–C型各連到哪種眼病？", "answer": "D–K常連成人／新生兒包涵體結膜炎；A–C為經典砂眼。"}, "relatedTopics": [], "sourceIds": ["cov12-cdc-chlam", "cov12-conj"]}, {"id": "c14", "title": "砂眼的病程：濾泡到瘢痕與倒睫", "pages": [16, 17, 28, 46, 50, 62, 66], "unitId": "u2", "sectionIndexes": [4], "terms": ["Arlt line", "Herbert pits", "Pannus", "倒睫", "SAFE"], "keyPoints": ["反覆砂眼發炎可出現上瞼結膜濾泡，角膜緣濾泡消退後留Herbert pits，瞼結膜瘢痕形成Arlt line。Pannus指表淺纖維血管長入角膜，需與其他角膜新生血管原因一併判斷。", "晚期視力損傷往往由瘢痕使眼瞼內翻、睫毛反覆磨擦角膜造成；因此感染控制與眼瞼後果都要處理。公共衛生SAFE概念結合倒睫手術、抗生素、面部清潔與環境改善，不能只記一種滴眼藥。"], "clinicalLink": "將病原、瘢痕、眼瞼位置與角膜損傷連成時間軸。", "pitfall": "把Horner–Trantas dots錯當砂眼特徵。", "recall": {"question": "Arlt line與Herbert pits分別位在哪？", "answer": "前者是瞼結膜瘢痕線，後者是角膜緣濾泡消退後的小凹陷。"}, "relatedTopics": ["notes-11"], "sourceIds": ["cov12-conj"]}, {"id": "c15", "title": "腺病毒、皰疹與傳染性紅眼", "pages": [18, 25, 27, 28, 46, 50, 62, 66], "unitId": "u2", "sectionIndexes": [2], "terms": ["EKC", "Pharyngoconjunctival fever", "Adenovirus", "HSV", "VZV", "Enterovirus", "EBV", "上皮下浸潤"], "keyPoints": ["腺病毒可形成以發熱咽痛為背景的咽結膜熱，或角膜侵犯較突出的流行性角結膜炎（EKC）。共筆列舉EKC與咽結膜熱的舊血清型組合，臨床不靠型別背誦分流；濾泡、耳前淋巴結、膜及後續角膜上皮下浸潤更有用。", "HSV、VZV需留意眼瞼皰疹與角膜病灶；腸病毒可有出血性結膜炎，EBV也屬可能病毒背景。感染控制須注意手部和器具衛生；抗生素不是腺病毒特效藥，類固醇僅在眼科選案下使用。"], "clinicalLink": "視力下降與畏光要回頭檢查角膜，不能用「病毒會自己好」帶過。", "pitfall": "將病毒排出期和潛伏期當同一件事，或把類固醇當所有EKC標準自用藥。", "recall": {"question": "腺病毒結膜炎後仍模糊，應檢查哪一層？", "answer": "評估角膜上皮與上皮下浸潤，並排除其他視力下降原因。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov12-conj"]}, {"id": "c16", "title": "慢性濾泡反應：軟疣、Parinaud與局部毒性", "pages": [10, 14, 15, 18], "unitId": "u2", "sectionIndexes": [1, 2], "terms": ["Molluscum contagiosum", "Parinaud oculoglandular syndrome", "Cat-scratch disease", "Dipivefrin"], "keyPoints": ["眼瞼傳染性軟疣可持續釋放刺激，造成單眼慢性濾泡性結膜炎；細看眼瞼緣的小型中央凹陷丘疹，有時比再換點眼藥更能找到原因。", "Parinaud眼腺症候群指單眼肉芽腫性結膜炎合併同側區域淋巴結，貓抓病是重要病因之一，需問動物接觸。局部藥物如共筆的dipivefrin亦可出現濾泡反應；時間線與停換藥後變化需由醫師判讀。"], "clinicalLink": "慢性單眼問題要同時看眼瞼、淋巴結及藥單。", "pitfall": "把所有慢性濾泡都當作同一種腺病毒反覆感染。", "recall": {"question": "反覆單眼結膜炎，為何要仔細看睫毛附近？", "answer": "眼瞼軟疣等小病灶可持續造成眼表刺激與濾泡反應。"}, "relatedTopics": [], "sourceIds": ["cov12-conj"]}, {"id": "c17", "title": "新生兒結膜炎：時程提示但不能取代採樣", "pages": [19, 46, 50, 62, 66], "unitId": "u2", "sectionIndexes": [3], "terms": ["Ophthalmia neonatorum", "化學性結膜炎", "新生兒淋菌", "新生兒披衣菌", "新生兒HSV"], "keyPoints": ["出生後紅眼的鑑別含化學刺激、淋菌、披衣菌、HSV及其他細菌。發病天數與母體風險有助排序，但病程重疊，缺乏典型成人濾泡反應也不能排除披衣菌；應及時評估角膜與全身狀態。", "CDC建議淋菌和披衣菌眼病採全身治療，局部藥單用不足；淋菌還需評估敗血症等播散感染。新生兒用藥需考量膽紅素、靜脈鈣與全身條件，不能照抄舊共筆固定成人／新生兒劑量或把預防藥當治療。"], "clinicalLink": "把新生兒眼病與產前篩檢、母體及伴侶照護連起來。", "pitfall": "依出生第幾天便確診，或以局部penicillin作通用第一線。", "recall": {"question": "新生兒披衣菌結膜炎為何要關注呼吸症狀？", "answer": "眼部感染可伴其他黏膜感染及後續肺炎，需全身評估與治療。"}, "relatedTopics": [], "sourceIds": ["cov12-cdc-gono", "cov12-cdc-chlam"]}, {"id": "c18", "title": "季節性、常年性過敏與免疫機轉", "pages": [19, 20, 21], "unitId": "u2", "sectionIndexes": [5], "terms": ["Allergic rhinoconjunctivitis", "Seasonal allergy", "Perennial allergy", "IgE", "第一型過敏"], "keyPoints": ["雙眼搔癢合併鼻過敏、黏絲分泌物與乳頭反應支持過敏性鼻結膜炎；季節性與常年性分類反映暴露模式。IgE／肥大細胞反應很重要，但慢性重症可含多種細胞機轉，不能用單一類型包辦所有疾病。", "治療思考包含減少致敏暴露、避免揉眼及適當抗過敏藥；痛、畏光或視力下降不應被「過敏」標籤掩蓋。過敏與乾眼亦可共存，抗組織胺的眼表影響需一併評估。"], "clinicalLink": "分清癢與痛，能辨認普通過敏之外的角膜風險。", "pitfall": "看到癢就不量視力、不看角膜。", "recall": {"question": "典型過敏主訴之外，哪些症狀會改變分流？", "answer": "明顯疼痛、畏光、視力下降或角膜缺損須另評估。"}, "relatedTopics": [], "sourceIds": ["cov12-conj", "cov12-drugs"]}, {"id": "c19", "title": "VKC、AKC與巨大乳頭的角膜風險", "pages": [19, 20, 21, 25, 27, 28, 29, 30], "unitId": "u2", "sectionIndexes": [5], "terms": ["Vernal keratoconjunctivitis", "Atopic keratoconjunctivitis", "Horner–Trantas dots", "Shield ulcer", "GPC"], "keyPoints": ["VKC常見年輕患者、巨大乳頭與角膜緣Horner–Trantas dots，後者與嗜酸性球及細胞碎屑有關；角膜可出現shield ulcer。AKC較常與異位性皮膚炎相關，病程慢性且可造成瘢痕，不能只用年齡或季節排除。", "GPC是巨大乳頭性反應，接觸鏡、假眼或暴露縫線的機械刺激與表面沈積可驅動它，並非VKC的同義詞。處理須找刺激源並保護角膜；長期類固醇需要眼壓與晶狀體監測。"], "clinicalLink": "從巨大乳頭出發，問是過敏疾病還是外來物刺激，再看角膜後果。", "pitfall": "把巨大乳頭誤稱巨大濾泡，或把VKC單純定義為第四型過敏。", "recall": {"question": "Trantas dots與shield ulcer各提醒什麼？", "answer": "前者提示VKC角膜緣炎症，後者代表角膜受損需要專科處理。"}, "relatedTopics": ["notes-05", "notes-13"], "sourceIds": ["cov12-conj"]}, {"id": "c20", "title": "SLK：不翻上眼瞼就容易漏診", "pages": [10, 21], "unitId": "u2", "sectionIndexes": [1, 5], "terms": ["Superior limbic keratoconjunctivitis", "上方球結膜", "角膜絲狀物", "甲狀腺功能"], "keyPoints": ["SLK主要影響上方球結膜、上角膜緣與上部角膜，可見上瞼細乳頭、上方結膜鬆弛或增厚、染色與角膜絲狀物。摩擦是重要機轉假說，但不是所有病例都能用同一原因完整解釋。", "乾眼、甲狀腺功能異常及部分自體免疫疾病可與SLK相關，應依病史與檢查安排評估。患者說上方異物感或持續乾眼治療無效時，主動翻瞼並檢查上方表面比一味增加人工淚液更有價值。"], "clinicalLink": "用固定位置的不適和染色分布，挑戰「所有部位一樣乾」的假設。", "pitfall": "將患者焦慮當病因，忽略可見的上方眼表病變。", "recall": {"question": "SLK最不能省略哪個檢查位置？", "answer": "上方球結膜、角膜緣、上部角膜及翻瞼後的上瞼結膜。"}, "relatedTopics": ["notes-08"], "sourceIds": ["cov12-slk"]}, {"id": "c21", "title": "毒性眼表病：藥物與人為刺激的時間線", "pages": [21, 56, 57], "unitId": "u2", "sectionIndexes": [11], "terms": ["Keratitis medicamentosa", "Toxic conjunctivitis", "Factitious conjunctivitis", "局部麻醉藥濫用", "Oxybuprocaine"], "keyPoints": ["點藥過密、多重防腐劑、非眼用物質或局部麻醉藥反覆使用，都可使上皮修復受損。症狀與染色分布需對照實際藥瓶、使用頻率與接觸物，不能單靠「病人很不舒服」就持續疊加藥物。", "Factitious指人為造成的病灶可能性，應先排除感染、藥物毒性與其他疾病，避免未有證據就責怪病人。嚴重上皮缺損、浸潤或前房反應仍屬急性評估情境；一般人工淚液並非都含麻醉藥。", "原共筆提及oxybuprocaine等局部麻醉成分；不能將含麻醉藥的產品當作一般人工淚液反覆自行使用。持續局部麻醉會掩蓋疼痛並可傷害角膜上皮，紅痛持續需先重新診斷。"], "clinicalLink": "「越點越痛」應觸發藥品核對與重新定位。", "pitfall": "把低濃度局部麻醉眼藥當可長期舒緩乾眼的人工淚液。", "recall": {"question": "懷疑點藥毒性時，最有用的病史材料？", "answer": "實際藥瓶、成分、頻率、起用時間及症狀變化。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov12-drugs", "an12-dews2"]}, {"id": "c22", "title": "瞼裂斑、翼狀贅片與假性翼狀贅片", "pages": [22, 28, 29, 30], "unitId": "u2", "sectionIndexes": [6], "terms": ["Pinguecula", "Pterygium", "Pseudopterygium", "Probe test", "散光"], "keyPoints": ["瞼裂斑通常是角膜緣旁黃白隆起，留在結膜；翼狀贅片是纖維血管組織跨過角膜緣，可牽引散光並逐漸侵入視軸。紫外線與環境暴露是重要背景，是否手術需看進展、視功能與刺激，不只看有沒有碰到瞳孔。", "假性翼狀贅片常在外傷、化學傷、周邊潰瘍或瘢痕後形成結膜與角膜黏連，位置不一定在水平。其頸部可能可由探針通過，是專科鑑別概念，不能教病人自行插探。"], "clinicalLink": "把位置、進展和傷害史放在一起，比只記「跨角膜緣」完整。", "pitfall": "把所有跨角膜緣病灶都叫退化性翼狀贅片。", "recall": {"question": "假性翼狀贅片的病史線索？", "answer": "角膜緣或角膜曾受化學、外傷、潰瘍或手術等傷害。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov12-conj", "an12-ocular"]}, {"id": "c23", "title": "上皮性腫瘤：乳頭瘤到OSSN", "pages": [23, 29, 30], "unitId": "u2", "sectionIndexes": [6], "terms": ["Papilloma", "HPV", "CIN", "OSSN", "Squamous cell carcinoma", "Mucoepidermoid carcinoma", "Pseudoepitheliomatous hyperplasia", "Benign hereditary intraepithelial dyskeratosis"], "keyPoints": ["結膜乳頭瘤常呈有血管核心的指狀增生，可有柄或無柄，與HPV尤其6、11型相關；不能只由有無柄便推定病毒型別或惡性。結膜／角膜上皮內瘤變（CIN）與侵襲性鱗狀細胞癌都屬眼表鱗狀上皮腫瘤（OSSN）範圍，是否穿越基底膜需病理判定。", "白斑、膠狀隆起、進展或供血血管促使腫瘤評估；黏液表皮樣癌是罕見惡性鑑別。假上皮瘤樣增生可模仿癌，良性遺傳性上皮內角化異常則屬另一良性病 與當下分泌品質、可擠出性回答不同問題。"}, "relatedTopics": [], "sourceIds": ["an12-dews2", "cov12-management"]}, {"id": "c33", "title": "瞼緣炎、酒糟與脂質異常的共同路徑", "pages": [12, 20, 43, 44], "unitId": "u1", "sectionIndexes": [9], "terms": ["Seborrheic blepharitis", "Staphylococcal blepharitis", "Rosacea", "Demodex", "Retinoid"], "keyPoints": ["脂漏性眼瞼炎可見油性碎屑，葡萄球菌相關眼瞼炎可有結痂與炎症，酒糟可伴瞼緣毛細血管擴張和MGD。睫毛根部袖套狀碎屑可提示Demodex相關問題，不宜直接把所有碎屑都稱蟎卵。", "口服retinoid可能影響瞼板腺與眼表，需納入藥史。處理依機轉採眼瞼衛生、合適熱敷及選定藥物；有角膜浸潤或潰瘍時要另外評估，不能將嚴重角膜病當普通眼瞼炎。"], "clinicalLink": "皮膚、睫毛、腺口和角膜所見連起來後，才有持續照護目標。", "pitfall": "把所有眼瞼炎直接等同細菌感染而無限續用抗生素。", "recall": {"question": "酒糟病史如何改變眼表檢查？", "answer": "需特別觀察瞼緣血管、瞼板腺分泌與角膜周邊發炎。"}, "relatedTopics": ["notes-11"], "sourceIds": ["an12-dews2", "cov12-drugs"]}, {"id": "c34", "title": "水液不足的局部、神經與全身病因", "pages": [40, 52], "unitId": "u3", "sectionIndexes": [10], "terms": ["Aqueous tear deficiency", "淚腺阻塞", "Sarcoidosis", "Mumps", "Neuroparalytic hyposecretion"], "keyPoints": ["水液不足可來自先天腺體問題、發炎或浸潤、創傷、放射線、引流到眼表的導管異常，或神經反射減弱。Sarcoidosis與mumps等提示不同的腺體病因，不能只看到低Schirmer就稱Sjögren。", "抗膽鹼藥與荷爾蒙相關因素也可能改變分泌。接觸鏡可影響眼表和感覺，但不能一概斷言一定直接破壞主淚腺；應核對側別、病史及是否合併蒸發問題。"], "clinicalLink": "從「低量」走到「為什麼低量」，才決定是否需系統評估。", "pitfall": "把所有水液不足都視為同一種自體免疫病。", "recall": {"question": "低淚量但抗體陰性，還能考慮什麼？", "answer": "局部淚腺病變、導管問題、用藥、神經反射及其他系統病因。"}, "relatedTopics": [], "sourceIds": ["an12-dews2", "an12-dews3"]}, {"id": "c35", "title": "維生素A缺乏與瘢痕造成的黏蛋白不足", "pages": [47, 51, 53, 63, 67], "unitId": "u3", "sectionIndexes": [10], "terms": ["Vitamin A deficiency", "Xerophthalmia", "Night blindness", "Bitot spots", "Keratomalacia", "OCP", "SJS"], "keyPoints": ["維生素A缺乏會影響暗適應與上皮分化，可從夜盲、眼表乾燥和Bitot斑進展到角膜軟化／潰瘍。脂溶性維生素的吸收與膽汁、腸道功能有關，肝膽病、腸切除或嚴重營養問題需列入背景。", "SJS、眼黏膜類天皰瘡（OCP）、砂眼與化學傷可破壞杯狀細胞及眼表結構，這類乾眼不只是人工淚液不足。維生素A是視覺循環與上皮功能所需，不能照抄原解析說成製造黑色素的原料。"], "clinicalLink": "夜盲加眼表角化需同時想視網膜視覺循環與表面上皮。", "pitfall": "以一般保健品宣傳取代營養缺乏的診斷與治療。", "recall": {"question": "維生素A缺乏為何同時影響夜視與眼表？", "answer": "它參與視覺循環，也維持正常上皮分化與分泌表型。"}, "relatedTopics": ["notes-10"], "sourceIds": ["an12-dews2", "cov12-management", "cov12-vitA"]}, {"id": "c36", "title": "Sjögren及共存自體免疫疾病", "pages": [40, 54], "unitId": "u3", "sectionIndexes": [10], "terms": ["Sjögren syndrome", "SSA/Ro", "SSB/La", "RA", "SLE", "Polyarteritis nodosa", "Systemic sclerosis", "Polymyositis", "Dermatomyositis", "Primary biliary cholangitis", "Hashimoto thyroiditis"], "keyPoints": ["Sjögren的眼口乾來自外分泌腺及全身免疫病程；病史、眼表檢查、相關抗體如SSA/Ro與必要系統評估一起判斷。單有眼乾或SSB/La不能自動確診，陰性血清檢驗也不等同完全排除。", "共筆列的類風濕關節炎、SLE、結節多動脈炎、全身硬化症、多發性肌炎／皮肌炎、原發性膽汁性膽管炎及Hashimoto甲狀腺炎，是需核對的共存免疫背景，各病並非都以同一機轉造成乾眼。若合併鞏膜炎、周邊角膜潰瘍或明顯系統症狀，需要跨科定位。"], "clinicalLink": "問口乾與系統病史，可把眼表照護連到全身診斷。", "pitfall": "把原共筆「病毒感染」直接當Sjögren已證實單一病因。", "recall": {"question": "眼乾合併關節痛與鞏膜深痛，為何不能只補人工淚液？", "answer": "可能有系統性免疫發炎與威脅角膜／鞏膜的病變，需要專科共同評估。"}, "relatedTopics": ["notes-05", "notes-09"], "sourceIds": ["an12-dews2", "an12-dews3"]}, {"id": "c37", "title": "神經滋養性角膜與術後感覺下降", "pages": [40, 41, 56, 57], "unitId": "u3", "sectionIndexes": [10], "terms": ["Neurotrophic keratopathy", "角膜感覺", "Herpes", "LASIK", "局部麻醉藥"], "keyPoints": ["角膜感覺降低可削弱反射與營養支持，形成持續上皮缺損；外傷、皰疹、三叉神經損傷與部分角膜手術都是背景。組織傷害很重卻疼痛不明顯，正是應檢查感覺的線索。", "LASIK等術後眼表症狀需要結合手術時程、感覺、眨眼與淚膜評估，不能把所有遠期眼乾都直接歸因手術。長期濫用局部麻醉藥可同時產生直接上皮毒性與反射抑制，需及時眼科處理。"], "clinicalLink": "痛不痛是感覺輸出，不是角膜是否受傷的可靠刻度。", "pitfall": "沒痛就不重視持續上皮缺損。", "recall": {"question": "明顯染色但幾乎不痛，應補哪項檢查？", "answer": "角膜感覺與三叉神經相關病史，並評估神經滋養性病變。"}, "relatedTopics": ["notes-03", "notes-05"], "sourceIds": ["an12-dews2", "cov12-drugs"]}, {"id": "c38", "title": "防腐劑與全身藥物：累積負荷的檢查", "pages": [41, 57], "unitId": "u3", "sectionIndexes": [10, 11], "terms": ["Benzalkonium chloride", "Anticholinergic", "Antihistamine", "Tricyclic antidepressant", "MAOI", "Beta blocker", "Hydrochlorothiazide", "Decongestant", "Antiparkinsonian", "Retinoid", "口服避孕藥", "化療", "止瀉藥", "Thiabendazole"], "keyPoints": ["Benzalkonium chloride等防腐劑的長期負荷可能加重眼表病，需核對所有點眼藥而非只問人工淚液；無防腐劑也仍需正確使用，不能由瓶裝或單支外觀推定成分。", "共筆表列抗膽鹼藥、抗組織胺、三環抗鬱劑、MAOI、beta blocker、hydrochlorothiazide與鼻充血藥，應按分泌抑制或全身效應核對。抗巴金森藥、retinoid、口服避孕藥、化療、部分止瀉藥與歷史thiabendazole亦列為暴露線索，並非每種藥或每位患者必然發病；變更療程需與處方團隊討論。"], "clinicalLink": "把症狀惡化的起點和新增藥、劑量及點藥頻率對照。", "pitfall": "未看成分便指控所有人工淚液含麻醉劑或所有精神科用藥都應停。", "recall": {"question": "如何證實藥物可能參與眼乾？", "answer": "建立暴露時間線、客觀表型與替代病因，和處方者共同評估。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov12-drugs", "an12-dews2"]}, {"id": "c39", "title": "荷爾蒙、環境與行為的合理解讀", "pages": [34, 35, 37, 42, 48, 49, 51, 57, 64, 65, 67, 68], "unitId": "u3", "sectionIndexes": [10, 11], "terms": ["Androgen", "更年期", "濕度", "螢幕", "吸菸", "眨眼"], "keyPoints": ["Androgen等荷爾蒙訊號可影響淚腺及瞼板腺；高齡與更年期是病史背景，不能由眼乾直接診斷荷爾蒙缺乏，更不能自行補充荷爾蒙。環境低濕、氣流、煙霧和持續視覺作業可加重蒸發或不完整眨眼。", "環境調整、避煙、適當遮風及規律完整眨眼可作為基礎措施；喝水只是在缺水時有合理作用，無法取代病因處理。生活品質與睡眠情緒需被尊重，不將焦慮視為「症狀不真實」的證據。"], "clinicalLink": "選擇可改變的暴露做小型追蹤，觀察症狀和客觀變化。", "pitfall": "把所有乾眼患者都套成荷爾蒙失調或水喝不夠。", "recall": {"question": "長時間注視為何可造成視覺波動？", "answer": "眨眼減少或不完整，使淚膜較早破裂且不能均勻刷新。"}, "relatedTopics": [], "sourceIds": ["an12-dews3", "cov12-management"]}, {"id": "c40", "title": "閉合不全、淚泵與暴露性眼表病", "pages": [58], "unitId": "u3", "sectionIndexes": [10], "terms": ["Lagophthalmos", "Ectropion", "Entropion", "Ptosis surgery", "TED", "Parkinsonism", "Blepharospasm", "CN VII"], "keyPoints": ["眼瞼與眼球要有良好貼合，眨眼才能鋪展淚膜並協助引流。外翻、內翻、瞼緣缺損、下垂手術後閉合不全及甲狀腺眼病突眼，都可改變接觸與暴露，應檢查睡眠及輕閉眼狀態。", "VII麻痺、巴金森症、昏迷或其他神經病可降低完整眨眼；blepharospasm是眼輪匝肌不自主收縮的運動問題，不能簡化成焦慮或「用力眨把眼淚擠光」。治療需同時處理表面與運動／結構原因。"], "clinicalLink": "染色分布和閉合縫隙對應時，結構處理往往比換藥更重要。", "pitfall": "把tarsorrhaphy與切除結膜混為一談。", "recall": {"question": "VII麻痺患者即使一直流淚仍可能乾眼嗎？", "answer": "會，閉合不全與淚泵失效可讓流淚和暴露損傷並存。"}, "relatedTopics": ["notes-03", "notes-08", "notes-11"], "sourceIds": ["an12-dews2", "cov12-management"]}, {"id": "c41", "title": "人工淚液與抗發炎：先設定治療目標", "pages": [39, 59, 61], "unitId": "u3", "sectionIndexes": [11], "terms": ["人工淚液", "Hyaluronic acid", "Ointment", "Cyclosporine", "Loteprednol", "Fluorometholone"], "keyPoints": ["人工淚液、玻尿酸或眼膏重點是改善潤滑與停留時間，選擇需配合表型、使用頻率及短暫模糊的代價。高頻使用時應考量防腐劑負荷，沒有單一品牌或劑型可修復所有驅動因素。", "Cyclosporine等抗發炎治療通常需時間觀察效果；共筆的高濃度範圍不能直接當普遍處方。Loteprednol、fluorometholone等類固醇即使稱「soft」或較低風險，也需監測眼壓、感染與晶狀體，不宜自行長期續用。"], "clinicalLink": "用「症狀＋染色＋穩定性」作為追蹤目標，避免只憑立即舒服判斷。", "pitfall": "把較低升壓風險類固醇說成完全安全。", "recall": {"question": "抗發炎滴眼藥為何不能只憑一天有無改善判成功？", "answer": "炎症調控可能需較長時間，且需兼顧客觀變化與副作用監測。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov12-management", "an12-dews3"]}, {"id": "c42", "title": "分泌促進與四環黴素的作用對象", "pages": [59, 60], "unitId": "u3", "sectionIndexes": [11], "terms": ["P2Y2", "Diquafosol", "Mucin secretagogue", "Tetracycline", "Doxycycline", "MMP"], "keyPoints": ["P2Y2受體致效作用可促進水液和黏蛋白分泌，diquafosol是相關機轉的藥物例子；適用性、可取得製劑與副作用需依所在地及個案評估，分泌物增加不等於感染。", "四環黴素類如doxycycline在選定MGD／酒糟患者可利用抗發炎與基質金屬蛋白酶（MMP）調節作用，不是因乾眼本身等同細菌感染。是否使用需考慮年齡、妊娠、全身禁忌與眼表證據，不照抄「全部長期口服」。"], "clinicalLink": "區分補充、促進分泌與抑制炎症三種治療邏輯。", "pitfall": "把乾眼不常需要抗生素誤解成MGD永遠不能用四環黴素。", "recall": {"question": "Doxycycline在酒糟相關MGD的目的只有殺菌嗎？", "answer": "不是，亦利用抗發炎和MMP調節作用，但需選案。"}, "relatedTopics": [], "sourceIds": ["cov12-management"]}, {"id": "c43", "title": "淚點栓塞、血清與PRP的選案", "pages": [39, 60, 61], "unitId": "u3", "sectionIndexes": [11], "terms": ["Punctal occlusion", "Punctal plug", "Autologous serum", "PRP", "生物性淚液替代"], "keyPoints": ["淚點栓塞減少淚液排出，可幫助部分水液不足患者；需先評估眼表炎症、感染與淚道情況，並說明溢淚、脫落或刺激等可能問題。它改善留存，不能修復所有分泌與眼瞼異常。", "自體血清與血小板濃縮製劑（PRP）是不同製備，不能寫成同義詞；其生物成分可用於部分難治眼表病。製備、儲存與污染控制重要，療效和配方不能由「生長因子濃度高」直接推定。"], "clinicalLink": "先判斷欠缺的是產量、留存還是上皮修復環境，再選處置。", "pitfall": "把PRP當普通人工淚液或把所有血液製劑當同一種產品。", "recall": {"question": "淚點栓塞主要改變哪個環節？", "answer": "降低排出並增加留存，不直接恢復淚腺或瞼板腺功能。"}, "relatedTopics": [], "sourceIds": ["cov12-management"]}, {"id": "c44", "title": "保護性鏡片、羊膜與眼瞼手術", "pages": [39, 60], "unitId": "u3", "sectionIndexes": [11], "terms": ["Bandage contact lens", "Scleral lens", "Moisture chamber", "Sustained-release insert", "Tarsorrhaphy", "Amniotic membrane"], "keyPoints": ["難治眼表病可考慮保濕護罩、緩釋保濕製劑、保護性或鞏膜鏡片；這些都是選定情境的支持方式，鏡片仍有感染與配戴風險，不能叫患者自行換成一般接觸鏡。", "Tarsorrhaphy是部分或完全暫時／持久閉合眼瞼以減少暴露；羊膜則可支持上皮修復。若病因是眼瞼位置或貼合異常，重建其結構也很重要，不能把所有手術一律拖到嚴重角膜融解後才考慮。"], "clinicalLink": "手術目標應直接連到暴露、缺損與癒合問題。", "pitfall": "沿用原文把tarsorrhaphy定義為切除多餘結膜。", "recall": {"question": "Tarsorrhaphy如何保護角膜？", "answer": "減少眼表暴露與蒸發，建立較適合持續上皮缺損癒合的環境。"}, "relatedTopics": ["notes-05", "notes-11"], "sourceIds": ["cov12-management"]}, {"id": "c45", "title": "IPL、腺體治療與保健品證據", "pages": [48, 49, 51, 64, 65, 67, 68], "unitId": "u3", "sectionIndexes": [11], "terms": ["Intense pulsed light", "Meibomian expression", "Omega-3", "DREAM", "Lutein", "Zeaxanthin", "Vitamin C/E", "Zinc"], "keyPoints": ["IPL、熱能與腺體擠出治療是部分瞼板腺相關疾病的選項，需合適診斷、眼部保護與療效追蹤；不能把它們視為所有乾眼都有效的固定療程。沒有感染證據時，也不應常規將抗生素點眼當乾眼核心治療。", "共筆考題將omega-3、葉黃素／玉米黃質、維生素C/E與鋅並列為可能有益，需區分營養理論與臨床療效。DREAM試驗未見omega-3對典型中重度乾眼優於安慰劑；其他「護眼」補充品也不能由名稱推定有效治療乾眼。"], "clinicalLink": "解釋介入時說明適用表型與證據，不用營養機轉取代實際試驗。", "pitfall": "把考古全選答案轉成保證療效或保健品購買建議。", "recall": {"question": "Omega-3有抗發炎理論，是否代表必然改善乾眼？", "answer": "不代表；臨床試驗結果和個體情境需一起考量，不能保證效果。"}, "relatedTopics": [], "sourceIds": ["cov12-omega", "cov12-management"]}, {"id": "c46", "title": "化學傷考點與不能延誤的處置", "pages": [47, 50, 51, 63, 66], "unitId": "u2", "sectionIndexes": [11], "terms": ["Chemical injury", "鹼傷", "沖洗", "角膜緣缺血", "Citrate", "Tetracycline"], "keyPoints": ["化學眼傷先立刻大量沖洗，不能等完整問診或配好理想液體才開始；並需檢查pH、穹窿殘留物及角膜緣／上皮損傷。鹼常可深入組織，酸雖有蛋白凝固效應也可能重傷，不能因酸就放心。", "共筆考點提citrate及四環黴素，重點是專科可在選定嚴重傷害中調節發炎與膠原分解，不是讓病人用酸鹼中和或自行配藥。後續須追蹤上皮、感染、眼壓與角膜緣功能。"], "clinicalLink": "把急救順序和後續角膜緣重建連到同一病程。", "pitfall": "為了先測視力或找中和劑而延誤沖洗。", "recall": {"question": "化學傷進門後第一個行動？", "answer": "立刻大量沖洗並同步安排緊急眼科評估；後續確認pH與殘留物。"}, "relatedTopics": ["notes-05", "notes-14"], "sourceIds": ["cov12-management", "an12-ocular", "cov12-chemical"]}], "unresolved": [], "sourceSha256": "1cd467fb5136bc50a89641135572313a1792d7335e40ae372de8a62e080660a8"}, "notes-13": {"sourceFile": "眼科學No.13.pdf", "pageCount": 60, "reviewedPages": [{"from": 1, "to": 3, "kind": "administrative", "note": "封面、目錄與課務回饋；不輸出私人姓名。"}, {"from": 4, "to": 26, "kind": "teaching", "note": "藥物進眼、角膜／晶狀體／發炎／視神經及藥物表格。"}, {"from": 27, "to": 32, "kind": "exam", "note": "前節與視神經藥物考點，保留概念並更正舊答案。"}, {"from": 33, "to": 56, "kind": "teaching", "note": "色覺、五類視網膜毒性、抗膽鹼作 atedTopics": ["notes-06"], "sourceIds": ["drug-steroid-effects", "cov13-cornea", "cov13-ifis"]}, {"id": "c04", "title": "角膜渦紋與內皮失能不可混稱", "pages": [7, 8, 23, 27, 31, 35, 57, 59, 60], "unitId": "u1", "sectionIndexes": [1], "terms": ["Cornea verticillata", "Vortex keratopathy", "Amiodarone", "Chloroquine", "Hydroxychloroquine", "Fabry disease"], "keyPoints": ["Cornea verticillata是角膜上皮渦紋樣沈積，amiodarone及chloroquine／HCQ等可見；Fabry等非藥物病因亦需依病史思考。單純上皮沈積常不明顯降低視力，不等於一定有視神經或視網膜毒性。", "內皮失能造成的基質水腫則可能明顯影響透明度，需要檢查角膜厚度、Descemet皺摺與內皮。是否調整重要全身治療，應依功能與病灶由兩科合作，不能一見渦紋便自行停抗心律不整藥。"], "clinicalLink": "先確認沈積位置與視力原因，才判斷藥物風險。", "pitfall": "用角膜渦紋當HCQ視網膜毒性的篩檢替代。", "recall": {"question": "有HCQ角膜渦紋可直接確診黃斑毒性嗎？", "answer": "不能，黃斑需以相應OCT／FAF等另行評估。"}, "relatedTopics": ["notes-05"], "sourceIds": ["drug-amiodarone-atlas", "cov13-cornea", "drug-hcq-aao"]}, {"id": "c05", "title": "Chlorpromazine：角膜、晶狀體與視網膜三定位", "pages": [8, 23, 24, 25, 28, 32, 38, 39], "unitId": "u1", "sectionIndexes": [1, 8], "terms": ["Chlorpromazine", "Phenothiazine", "Descemet membrane", "Stellate lens opacity", "Thioridazine"], "keyPoints": ["Chlorpromazine可在角膜後基質、Descemet膜或內皮形成黃褐色沈積，也可伴晶狀體前部星狀混濁；是否有內皮功能損害需實際檢查，不能由顏色直接推定所有病灶不可逆。", "它與thioridazine同屬phenothiazine，後者的色素性視網膜毒性尤其值得注意。角膜或晶狀體的可見沈積不應讓人忽略色覺、夜視與視野異常，也不能把同一藥所有部位都用單一劑量門檻保證安全。"], "clinicalLink": "以裂隙燈定位前節，再用症狀決定是否需要後節功能檢查。", "pitfall": "把精神科藥使用史當作視覺主訴不可信的理由。", "recall": {"question": "前囊星狀混濁與色素性視網膜病變是同一部位嗎？", "answer": "不是，分別是晶狀體與後節，需要不同檢查。"}, "relatedTopics": ["notes-06", "notes-10"], "sourceIds": ["cov13-cornea", "cov13-macula"]}, {"id": "c06", "title": "Amantadine角膜水腫：可逆可能性與限制", "pages": [9, 10, 11, 24, 27, 30, 58, 60], "unitId": "u1", "sectionIndexes": [1], "terms": ["Amantadine", "Endothelial dysfunction", "Descemet folds", "Fuchs dystrophy", "Specular microscopy"], "keyPoints": ["Amantadine常用於巴金森相關情境，少數患者可出現雙眼角膜內皮失能與水腫，未必可見沈積。基質增厚、Descemet皺摺與視覺光暈提示透明度問題，需與Fuchs等內皮病、手術或炎症鑑別。", "部分病例與處方團隊停換藥後會改善，但不能保證所有人完全恢復。內皮鏡和角膜厚度可提供資訊，單次內皮評估不能獨自證明先天或藥物病因；在考慮角膜移植前完整藥史尤其重要。"], "clinicalLink": " swer": "緊急全身中毒評估與眼科協作，不能只排一般視野檢查。"}, "relatedTopics": ["notes-14"], "sourceIds": ["cov13-toxic-optic"]}, {"id": "c23", "title": "Digoxin的黃色視覺與全身毒性評估", "pages": [33, 55], "unitId": "u1", "sectionIndexes": [5], "terms": ["Digitalis", "Digoxin", "Xanthopsia", "Photopsia", "Colored halo"], "keyPoints": ["Digitalis／digoxin相關視覺主訴可含黃色色調、閃光、光暈、模糊或畏光，應核對腎功能、合併藥物及全身症狀。血中濃度須依採血時機與臨床解讀，單次在參考範圍不完全排除不良反應。", "黃幻視是線索，不是單獨確診工具；白內障、視網膜及神經病變仍需檢查。若同時有心律、腸胃或神經症狀，應及時與處方／急症團隊評估，不從藝術作品或顏色偏好反推真實個人用藥。"], "clinicalLink": "把色覺變化連回眼部定位與全身用藥安全。", "pitfall": "只問有沒有視力下降而漏掉顏色改變。", "recall": {"question": "Digoxin患者說世界發黃，需要核對什麼？", "answer": "用藥時間、腎功能、血中濃度的採樣情境及心臟／神經等全身症狀。"}, "relatedTopics": [], "sourceIds": ["cov13-macula", "cov13-toxic-optic"]}, {"id": "c24", "title": "PDE-5抑制劑：可逆色調與突發視損分流", "pages": [6, 33, 45, 55], "unitId": "u1", "sectionIndexes": [5], "terms": ["Sildenafil", "Tadalafil", "PDE-5", "PDE-6", "Cyanopsia", "NAION"], "keyPoints": ["Sildenafil等PDE-5抑制劑可不同程度影響視網膜PDE-6，造成藍色調或亮度感改變；藥物選擇性、劑量與個體使效應不同，不能把tadalafil與sildenafil的眼部作用完全等同。", "短暫色調變化與突然單眼視力喪失是不同情境；後者須立即評估缺血性視神經或視網膜急症。NAION等報告關聯不能直接等同每次事件由藥物造成，也不能以「常會偏藍」忽視新發嚴重症狀。"], "clinicalLink": "用症狀的時間、側別和嚴重度區分預期藥理效應與急症。", "pitfall": "將所有服藥後視覺變化保證為可逆。", "recall": {"question": "服用PDE-5藥後突然一眼看不見，可等待藥效退嗎？", "answer": "不可，應立即評估缺血性或其他眼科急症。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["cov13-macula", "cov13-toxic-optic"]}, {"id": "c25", "title": "五類視網膜藥害：由OCT位置找機轉", "pages": [34, 44, 54, 55], "unitId": "u1", "sectionIndexes": [8], "terms": ["RPE/photoreceptor toxicity", "Microvasculopathy", "Crystalline retinopathy", "CME", "Serous retinal detachment"], "keyPoints": ["共筆把視網膜毒性分成RPE／感光細胞異常、微血管／阻塞病變、結晶沈積、黃斑囊樣水腫及漿液性積液。這是模式分類，同一藥可能跨模式，不能每種藥硬放唯一格。", "影像閱讀先問液體在神經視網膜內還是下方，是否有外層帶中斷、亮點或血管缺血；再配對症狀與藥物時間線。OCT結構、FAF代謝相關訊號及血管攝影資訊不同，選擇要回答具體問題。"], "clinicalLink": "從影像位置建立藥害假說，比只背藥名更能遷移到新治療。", "pitfall": "所有OCT黑色空間都叫同一種CME。", "recall": {"question": "視網膜內囊腔與視網膜下液各提示什麼？", "answer": "前者偏CME等模式，後者偏漿液性脫離等模式，仍需結合原因。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov13-macula"]}, {"id": "c26", "title": "HCQ風險：每日暴露與個人條件", "pages": [34, 35, 54, 58, 59], "unitId": "u2", "sectionIndexes": [6], "terms": ["Hydroxychloroquine", "Chloroquine", "實際體重", "腎功能", "Tamoxifen", "起用年齡", "累積暴露", "重度肥胖"], "keyPoints": ["HCQ風險評估包括每日按實際體重的暴露、用藥年數、腎病、tamoxifen合用與較高起用年齡。AAO 2025修訂維持每日不超過5 mg/kg實際體重的建議，並指出重度肥胖者每日劑量應維持低於400 mg，不能只隨體重向上推算。實際處方由治療醫師依病況決定；這是降低風險原則，不是自行處方或零風險界線。", "共筆使用固定累積克數與「一定五至七年才發病」屬舊式簡化，不能取代個人風險。Chloroquine與HCQ不是可以毫克對毫克互換的同一藥；既有黃斑病也可能幹擾篩檢解讀。"], "clinicalLink": "先把處方、體重與腎功能核對清楚，再安排相符監測。", "pitfall": "把前五年視為所有人的安全期。", "recall": {"question": "同樣HCQ用三年，誰可能需要較積極監測？", "answer": "較高每日暴露、腎病、tamoxifen合用或其他較高風險者，需個別安排。"}, "relatedTopics": ["notes-10"], "sourceIds": ["drug-hcq-aao"]}, {"id": "c27", "title": "HCQ基線與年度監測的新版順序", "pages": [27, 28, 31, 34, 35, 54, 57, 59], "unitId": "u2", "sectionIndexes": [7], "terms": ["AAO 2025 revision", "Baseline", "OCT", "Wide-field FAF", "Annual screening"], "keyPoints": ["新版AAO建議起用後儘早取得眼底、OCT與FAF基線，以辨識既有病變並提供比較；不是到第五年才做第一次眼科檢查。治療中以年度OCT與廣範圍FAF監測，只有沒有重要風險的患者才可考慮延後前五年的年度篩檢。", "「基線」和「規律毒性篩檢」回答不同問題：前者知道原本如何，後者找新的早期改變。監測計畫須明確記錄誰安排、用哪種影像及何時回診，不能只交代視力變差再看。"], "clinicalLink": "用兩條時間線避免把舊考題答案當現行流程。", "pitfall": "沿用原共筆「開始五年後才做baseline」。", "recall": {"question": "低風險可延後年度篩檢，是否代表不需早期基線？", "answer": "不是，早期基線與其後年度篩檢是不同步驟。"}, "relatedTopics": [], "sourceIds": ["drug-hcq-aao"]}, {"id": "c28", "title": "HCQ影像範圍：旁中心凹與中心凹周邊", "pages": [35, 36, 37, 54, 58, 59, 60], "unitId": "u2", "sectionIndexes": [7], "terms": ["Parafoveal", "Pericentral", "Ellipsoid zone", "FAF", "Visual field", "mfERG", "Flying-saucer sign"], "keyPoints": ["OCT觀察外網膜與ellipsoid zone改變，FAF顯示RPE相關訊號；損傷可在旁中心凹，也可較偏中心凹周邊，後者在東亞患者尤其需要留意，但不能以族群限制檢查範圍。僅中央10度視野可能漏掉較外側病變。", "視野或mfERG可作確認／補充，異常須核對可靠度、空間一致性與重複性。Flying-saucer sign是較典型的形態，不應等這個標誌、色覺下降或牛眼外觀才判毒性；FA並非早期篩檢的主要方法。"], "clinicalLink": "讓結構與功能異常位在相同區域，才提高因果判斷可信度。", "pitfall": "一張模糊異常影像就立即永久停藥，或只做視力表。", "recall": {"question": "為何HCQ監測不能永遠只看中央10度？", "answer": "可能存在較外側pericentral毒性，需要足夠範圍的OCT／FAF與合適功能檢查。"}, "relatedTopics": [], "sourceIds": ["drug-hcq-aao", "drug-hcq-image"]}, {"id": "c29", "title": "HCQ從早期異常到晚期牛眼：不同預後", "pages": [35, 36, 37, 38, 54, 59, 60], "unitId": "u2", "sectionIndexes": [6, 7], "terms": ["Bull’s-eye maculopathy", "Paracentral scotoma", "RPE atrophy", "Panretinal degeneration", "停藥後進展"], "keyPoints": ["早期可有旁中心視野異常或外網膜結構變化而中央視力仍好，之後才出現色素改變與萎縮性牛眼外觀；嚴重者可能擴大至更廣視網膜。牛眼不是HCQ專屬圖案，也不是理想篩檢起點。", "疑似結果需及時確認並與處方團隊討論；確診毒性後的處理兼顧全身疾病控制。停藥後進展風險與發現時嚴重度相關，不能一律說所有早期病例必繼續惡化或一定恢復。"], "clinicalLink": "篩檢價值在於尚未有不可逆廣泛萎縮時發現問題。", "pitfall": "只見角膜沈積便停藥，真正外網膜病變卻等視力掉才處理。", "recall": {"question": "HCQ患者視力正常，是否能省略影像監測？", "answer": "不能，早期毒性可先影響旁中心／周邊結構與功能。"}, "relatedTopics": [], "sourceIds": ["drug-hcq-aao", "drug-hcq-image"]}, {"id": "c30", "title": "Phenothiazine色素性視網膜病變", "pages": [34, 38, 39, 54], "unitId": "u1", "sectionIndexes": [8], "terms": ["Thioridazine", "Chlorpromazine", "Pigmentary retinopathy", "Nummular RPE atrophy", "Night blindness"], "keyPoints": ["Thioridazine與chlorpromazine可與色素性視網膜病變相關，表現可含模糊、夜盲、視野缺損、RPE斑駁及較廣萎縮；兩者毒性重點不同，不能因同類藥就預測相同器官與風險。", "高暴露是重要線索，但原文列舉的劑量不能當絕對安全門檻。若症狀新發，要檢查外網膜結構與視覺功能，並與精神科共同評估藥物方案；停藥後仍需追蹤既有損害。"], "clinicalLink": "夜盲與外網膜／RPE病變配對，可區分單純屈光模糊。", "pitfall": "認為未達某一高劑量就不可能有不良反應。", "recall": {"question": "夜盲加RPE斑駁，檢查焦點在哪？", "answer": "外網膜／感光細胞及RPE，並核對藥物與遺傳等其他病因。"}, "relatedTopics": [], "sourceIds": ["cov13-macula"]}, {"id": "c31", "title": "Deferoxamine、Clofazimine與Cisplatin的延伸辨識", "pages": [18, 34, 39, 54], "unitId": "u1", "sectionIndexes": [8], "terms": ["Deferoxamine", "Desferrioxamine", "Clofazimine", "Cisplatin", "RPE/photoreceptor complex"], "keyPoints": ["共筆把deferoxamine（desferrioxamine）、clofazimine與cisplatin列為RPE／感光細胞相關的延伸藥物；它們分別涉及鐵螯合、抗感染與抗腫瘤治療背景，不能由藥名推論相同眼底表現或風險頻率。", "Deferoxamine患者視覺變化需考量暴露與全身疾病，cisplatin亦可能涉及血管或視神經模式；clofazimine有藥物沈積／色素相關辨識價值。閱讀舊簡短清單時要標明是需要核對的報告關聯，而非給病人統一停藥建議。"], "clinicalLink": "對少見藥害，以定位與確切處方核對補足教材有限資訊。", "pitfall": "把「共筆列出但未詳講」誤當風險已被完整量化。", "recall": {"question": "同一cisplatin可只用RPE毒性解釋所有模糊嗎？", "answer": "不可，仍需排視網膜血管、視神經及其他部位問題。"}, "relatedTopics": [], "sourceIds": ["cov13-macula", "cov13-toxic-optic"]}, {"id": "c32", "title": "Interferon微血管病變與缺血證據", "pages": [40, 55], "unitId": "u1", "sectionIndexes": [8], "terms": ["Interferon α-2a", "Interferon α-2b", "Cotton-wool spots", "Retinal hemorrhage", "Capillary nonperfusion"], "keyPoints": ["Interferon α相關眼底變化可有棉絮斑與視網膜出血；棉絮斑提示神經纖維層軸漿運輸受阻／微血管缺血，不是脂質硬滲出。高血壓、糖尿病等原有血管問題會增加鑑別複雜度。", "視網膜血管攝影可協助判斷灌流與滲漏，但暗區也須區分遮蔽與真正無灌流。部分病灶改善不等於所有缺血損傷可逆，是否調整治療需依視功能、缺血範圍與原治療效益共同決策。"], "clinicalLink": "將出血、棉絮斑和全身血管背景連起來，不一見藥物便忽略糖尿病。", "pitfall": "把原文發生率套用現今所有族群與療程。", "recall": {"question": "棉絮斑與硬滲出的機轉相同嗎？", "answer": "不同，前者偏神經纖維層缺血／軸漿阻滯，後者為滲漏脂質等沈積。"}, "relatedTopics": ["notes-10", "notes-14"], "sourceIds": ["cov13-macula"]}, {"id": "c33", "title": "阻塞性視網膜藥害：血栓、收縮與局部毒性", "pages": [41, 55], "unitId": "u1", "sectionIndexes": [8], "terms": ["Ergot alkaloids", "Oral contraceptive", "Cisplatin", "Procainamide", "Aminoglycoside", "RAO", "RVO"], "keyPoints": ["Ergot類的血管收縮、含雌激素避孕藥相關血栓風險，以及cisplatin等抗腫瘤治療的血管效應，是共筆列的不同路徑；應合併患者血管危險因子，不能只用「血變黏」解釋全部動靜脈阻塞。", "Procainamide相關免疫背景與aminoglycoside局部／高暴露視網膜毒性亦需依途徑與劑量辨識。突然無痛視損可能是動脈阻塞，需要急症分流；知道可能藥因不會降低中風評估的急迫性。"], "clinicalLink": "把藥物因果調查與急性血管處置平行進行。", "pitfall": "為了先等待停藥反應而延誤急性視網膜缺血評估。", "recall": {"question": "疑藥物相關RAO可以先停藥觀察嗎？", "answer": "不能，應立即急診／中風和眼科評估，藥史同時提供給團隊。"}, "relatedTopics": ["notes-10", "notes-14"], "sourceIds": ["cov13-macula", "cov13-crao"]}, {"id": "c34", "title": "Tamoxifen：結晶、囊腔與功能", "pages": [42, 43, 55, 58, 60], "unitId": "u1", "sectionIndexes": [8], "terms": ["Tamoxifen", "Crystalline retinopathy", "Foveal cavitation", "CME", "Macular telangiectasia type 2"], "keyPoints": ["Tamoxifen相關黃斑病變可見內視網膜高反射結晶、中心凹囊腔或水腫，部分表現與第二型黃斑毛細血管擴張相似。應讀OCT層次與感光細胞完整性，不把所有亮點或黑色空洞都當同一種病理。", "累積暴露是風險線索，但常用低劑量亦可能發生，不能把共筆高劑量數字當安全界線。可同時有角膜或晶狀體影響；新視力變化需與腫瘤團隊協作判斷是否調整，既有結晶與視覺恢復並不一定同步。"], "clinicalLink": "把結晶的層次、黃斑結構與症狀對應，避免只有照片診斷。", "pitfall": "認為20mg等常用劑量絕對不會眼毒性。", "recall": {"question": "Tamoxifen患者有中心凹囊腔，為什麼仍需鑒別？", "answer": "可與其他黃斑病外觀重疊，需配對暴露、結構與功能。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov13-macula", "drug-macula-video"]}, {"id": "c35", "title": "CME：化療、降脂與降糖藥的模式", "pages": [44, 55], "unitId": "u1", "sectionIndexes": [8], "terms": ["Taxane", "Docetaxel", "Paclitaxel", "Nicotinic acid", "Glitazone", "Tamoxifen", "Diabetic macular edema"], "keyPoints": ["Taxane類docetaxel／paclitaxel、nicotinic acid、glitazone與tamoxifen均是共筆列的囊樣黃斑改變相關藥物。OCT可顯示囊腔，但部分藥物性囊樣改變在螢光血管攝影並不明顯漏出，不能一律歸為血管通透增加。", "糖尿病患者合併glitazone暴露時，要比較糖尿病視網膜病程度、全身體液狀態與用藥時間線；藥物和原病也可同時貢獻。是否調整應跨科討論並追蹤黃斑結構及視力，不憑一張OCT即指定唯一病因。"], "clinicalLink": "同一個CME影像模式，需要依據暴露與背景區分驅動因素。", "pitfall": "OCT有囊腔就斷言FA必有明顯滲漏。", "recall": {"question": "糖尿病用glitazone者黃斑水腫必是藥害嗎？", "answer": "不是，需區分原有糖尿病水腫、藥物／體液因素及共存情況。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov13-macula"]}, {"id": "c36", "title": "視網膜下液：類固醇CSCR與MEK表型", "pages": [45, 55], "unitId": "u1", "sectionIndexes": [8, 9], "terms": ["CSCR", "Corticosteroid", "MEK inhibitor", "RPE detachment", "Sildenafil", "Sympathomimetic"], "keyPoints": ["類固醇暴露與中心漿液性脈絡膜視網膜病變（CSCR）相關，患者可先訴變形、物體顯小或顏色／亮度變化，OCT顯示視網膜下液。需核對口服、吸入、鼻噴、外用等多種途徑，不能只問有沒有吃藥。", "MEK抑制劑相關視網膜病可呈漿液性積液，模式和典型CSCR並非完全相同；共筆另列sildenafil與擬交感藥的報告關聯，證據不能與類固醇直接等量齊觀。眼科與原團隊評估藥物時，避免用類固醇盲治不明黃斑積液。"], "clinicalLink": "用液體所在層次與處方背景區分眼內炎症和藥物性積液。", "pitfall": "把所有MEK相關漿液性改變等同經典CSCR。", "recall": {"question": "疑CSCR時為何要問鼻噴和皮膚藥？", "answer": "這些也可能含類固醇，完整暴露不限於口服。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov13-macula", "drug-steroid-effects"]}, {"id": "c37", "title": "抗膽鹼作用：瞳孔、調節、淚腺三效應", "pages": [6, 46, 47, 56, 57, 59], "unitId": "u3", "sectionIndexes": [10], "terms": ["Antimuscarinic", "Cycloplegia", "Mydriasis", "Photophobia", "Ganglionic blocker", "Neuromuscular blocker"], "keyPoints": ["眼部常見抗muscarinic作用會使睫狀肌調節減弱、看近模糊，瞳孔括約肌作用下降而散瞳、畏光，並可減少淚液分泌。共筆將anticholinergic廣分神經節阻斷和神經肌肉阻斷等類，臨床不能假設每一類都產生相同眼部效應。", "這組效應不同於晶狀體虹膜隔前移造成的新近視；也不能把交感興奮與抗膽鹼視為完全相同。若有發熱、心跳快、皮膚乾、尿滯留或意識改變，需考慮全身藥理負荷與急性毒性。"], "clinicalLink": "通過遠近差異、瞳孔與前房分清調節麻痹和藥物性閉角。", "pitfall": "把抗膽鹼寫成縮瞳與調節增強。", "recall": {"question": "抗膽鹼造成近物模糊等同近視加深嗎？", "answer": "不等同，常是調節麻痹；近視位移需另想晶狀體位置／屈光變化。"}, "relatedTopics": ["notes-02", "notes-07"], "sourceIds": ["drug-topiramate", "cov13-surface"]}, {"id": "c38", "title": "影像藥表：抗鬱、抗過敏與巴金森用藥", "pages": [46], "unitId": "u3", "sectionIndexes": [10], "terms": ["Amitriptyline", "Imipramine", "Paroxetine", "Fluoxetine", "Fluvoxamine", "Citalopram", "Escitalopram", "Phenelzine", "Tranylcypromine", "Perphenazine", "Trifluoperazine", "Fluphenazine", "Diphenhydramine", "Dimenhydrinate", "Chlorpheniramine", "Promethazine", "Cimetidine", "Ranitidine", "Trihexyphenidyl", "Orphenadrine", "Benztropine"], "keyPoints": ["共筆「可能影響調節」表列amitriptyline／imipramine等三環藥、paroxetine／fluoxetine／fluvoxamine／citalopram／escitalopram等抗鬱藥，phenelzine／tranylcypromine等MAOI，以及perphenazine／trifluoperazine／fluphenazine等抗精神病藥。它們的抗muscarinic強度與其他受體作用不同，不可全部視為同劑量的散瞳藥。", "抗過敏／止吐例子有diphenhydramine、dimenhydrinate、chlorpheniramine、promethazine；舊表亦列H2阻斷cimetidine／ranitidine，不能據此推廣所有H2藥都有同等風險。Trihexyphenidyl、orphenadrine、benztropine有抗膽鹼相關用途，需留意近物模糊、眼乾與易感隅角。"], "clinicalLink": "把藥物類別拆到實際藥名，再由藥師或處方者確認抗膽鹼負荷。", "pitfall": "將表中所有抗鬱藥都稱為強抗膽鹼藥或建議一律停用。", "recall": {"question": "同屬抗鬱藥，眼部風險可完全互換嗎？", "answer": "不可，藥理選擇性、劑量和患者眼部結構需個別核對。"}, "relatedTopics": [], "sourceIds": ["cov13-surface"]}, {"id": "c39", "title": "影像藥表：滴眼、吸入、泌尿與麻醉暴露", "pages": [46, 48], "unitId": "u3", "sectionIndexes": [10], "terms": ["Atropine", "Scopolamine", "Homatropine", "Tropicamide", "Cyclopentolate", "Oxybutynin", "Ipratropium", "Tiotropium", "Oxitropium", "Salbutamol", "Disopyramide", "Diltiazem", "Nifedipine", "Succinylcholine", "Ketamine"], "keyPoints": ["Atropine、scopolamine、homatropine、tropicamide與cyclopentolate可影響瞳孔／調節；oxybutynin為全身抗muscarinic暴露例子。Ipratropium、tiotropium、oxitropium等吸入藥若意外接觸眼部，應在急性瞳孔改變的藥史中核對，仍不能先排除神經急症。", "共筆同表另列salbutamol、disopyramide、diltiazem、nifedipine、succinylcholine和ketamine，但它們不是統一的抗muscarinic類別；該表是寬泛的視力／調節相關暴露提示。實際判斷需區分吸入擬交感、抗心律不整、鈣通道與麻醉等不同作用，不把表頭當機制證明。"], "clinicalLink": "急診藥史要問藥貼、霧化面罩、麻醉和眼藥接觸，而不僅是口服。", "pitfall": "看到單側散瞳便認定藥物原因，不檢查眼球運動與神經症狀。", "recall": {"question": "藥物表裡出現salbutamol是否說明它是抗muscarinic？", "answer": "不是，表列相關現象不代表藥理類別相同。"}, "relatedTopics": ["notes-03"], "sourceIds": ["cov13-surface", "drug-topiramate"]}, {"id": "c40", "title": "散瞳藥表與神經急症的分界", "pages": [48], "unitId": "u3", "sectionIndexes": [10], "terms": ["SSRI", "SNRI", "MAOI", "Amphetamine", "Cocaine", "LSD", "Psilocybin", "Mescaline", "MDMA", "Anisocoria"], "keyPoints": ["共筆散瞳表包括抗膽鹼藥、SSRI／SNRI／MAOI等血清素相關藥，amphetamines／cocaine等擬交感暴露，以及LSD、psilocybin、mescaline、MDMA等精神活性物質。列名用來完整詢問可能暴露，不代表它們通過相同受體造成眼部改變。", "散瞳伴意識、體溫、肌陣攣或心血管異常需考慮全身毒性；新發瞳孔不等大若伴頭痛、下垂或眼動異常，也必須排神經急症。不能只因有藥史就省略視功能和眼壓／前房檢查。"], "clinicalLink": "將瞳孔所見放回眼部與全身檢查，避免過早歸因。", "pitfall": "把有藥物暴露當成排除動脈瘤或急性閉角的證據。", "recall": {"question": "散瞳＋眼瞼下垂＋眼動受限，應如何分流？", "answer": "需立即評估神經急症與相關影像，藥史並行核對。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["cov13-surface", "drug-topiramate"]}, {"id": "c41", "title": "抗膽鹼相關閉角：解剖風險勝過病名標籤", "pages": [47, 48, 56], "unitId": "u3", "sectionIndexes": [10], "terms": ["Pupillary block", "Narrow angle", "Gonioscopy", "Open-angle glaucoma", "Pseudophakia", "LPI"], "keyPoints": ["具有易閉隅角的眼睛在散瞳時可能出現瞳孔阻滯／周邊虹膜擁擠，引發急性閉角；是否有「青光眼」這個病名不足以判斷風險。開角型、窄角、已做LPI或人工晶狀體眼需依實際解剖與病程分別評估。", "白內障手術通常改變前房空間，但不能保證任何藥物閉角機制都消失；單次眼壓良好也不等於隅角永遠安全。急性痛紅、光暈、模糊與惡心需即刻量壓並評估前房，不能只安排日後復查。"], "clinicalLink": "把藥袋「青光眼慎用」轉為可回答的隅角與機制問題。", "pitfall": "眼壓控制好就一律宣稱抗膽鹼藥絕對安全。", "recall": {"question": "開角型與窄角患者對散瞳相關風險有何不同？", "answer": "窄角更需注意結構性閉角風險，仍須個別檢查而非只看診斷名稱。"}, "relatedTopics": ["notes-07"], "sourceIds": ["drug-topiramate"]}, {"id": "c42", "title": "Topiramate：非瞳孔阻滯的雙眼閉角", "pages": [49, 50, 51, 56], "unitId": "u3", "sectionIndexes": [11], "terms": ["Topiramate", "Ciliochoroidal effusion", "Acute myopic shift", "Non-pupillary block", "Iridolenticular diaphragm"], "keyPoints": ["Topiramate可引起特異體質的睫狀脈絡膜滲出，使晶狀體虹膜隔整體前移，造成雙眼急性近視位移、淺前房與高眼壓。原本隅角開放或較年輕者也會發生，不能以「高度近視通常前房深」排除。", "出現相符症狀需立即眼科評估並聯絡處方團隊盡速處理致病藥。治療針對滲出與眼壓，LPI不能解決主要非阻滯機制，縮瞳藥亦不能照套；具體降壓、睫狀肌麻痹與抗炎選案由眼科決定。"], "clinicalLink": "突然新近視是一條解剖變化線索，而非立即配鏡的理由。", "pitfall": "將primary pupillary-block閉角流程機械套用到topiramate。", "recall": {"question": "為什麼LPI不能解決主要topiramate閉角機制？", "answer": "阻塞源是睫狀脈絡膜滲出使整體隔膜前移，並非主要瞳孔阻滯。"}, "relatedTopics": ["notes-02", "notes-07"], "sourceIds": ["drug-topiramate", "drug-topiramate-fda"]}, {"id": "c43", "title": "Acetazolamide與「含硫藥」用語的限制", "pages": [49, 50, 51, 56, 57, 59], "unitId": "u3", "sectionIndexes": [11], "terms": ["Acetazolamide", "Sulfonamide", "Sulfamate", "Sulfur-derived medication", "Idiosyncratic"], "keyPoints": ["原共筆以「sulfur-derived」概括acetazolamide與topiramate，精確學習應區分磺胺相關結構、topiramate的sulfamate結構及各自報告的特異反應。不是所有含硫藥物或所有所謂磺胺過敏都必然產生同一眼部機制。", "Acetazolamide雖然常用作降眼壓藥，少見情境本身也可能與睫狀脈絡膜滲出和近視／閉角相關，因此治療必須核對疑致病藥與機制。不能把「有時用類固醇」簡化成它是所有這類高壓的唯一降壓藥。"], "clinicalLink": "同一藥在常規治療與少見不良反應中可能扮演不同角色。", "pitfall": "把任何含硫藥都列為統一絕對禁忌，或因acetazolamide降壓便保證它不可能致閉角。", "recall": {"question": "有磺胺過敏史能直接預測所有藥物性閉角嗎？", "answer": "不能，需要辨認具體藥物、反應類型與當前眼部機制。"}, "relatedTopics": ["notes-07"], "sourceIds": ["drug-topiramate", "drug-topiramate-fda"]}, {"id": "c44", "title": "類固醇升壓：沒有痛也不能放過", "pages": [52, 53, 56, 57, 59, 60], "unitId": "u3", "sectionIndexes": [9], "terms": ["Steroid response", "Trabecular meshwork", "Ocular hypertension", "Steroid-induced glaucoma", "Children"], "keyPoints": ["類固醇可增加小梁網流出阻力，造成眼壓升高；眼壓升高與已形成視神經損傷的青光眼要分開敘述。兒童及部分高風險者可能反應明顯，症狀不可靠，局部、注射或全身暴露都要納入監測。", "追蹤眼壓同時評估視神經、RNFL與視野，並根據處方需求討論減量、替代或眼壓治療。兒童盤杯外觀可隨降壓改變，但這不能推論所有神經損傷都可逆，也不能等中央視力下降才檢查。"], "clinicalLink": "把無症狀監測解釋為保護不可逆的視神經功能。", "pitfall": "只有口服高劑量才會升眼壓，或不痛就是安全。", "recall": {"question": "長期類固醇患者最不能只靠哪項自覺來追蹤？", "answer": "不能只靠眼痛或模糊，需客觀眼壓和相應視神經評估。"}, "relatedTopics": ["notes-07"], "sourceIds": ["drug-steroid-effects"]}, {"id": "c45", "title": "類固醇四類眼風險與顱壓相關盤腫", "pages": [15, 45, 52, 53, 56, 59, 60], "unitId": "u3", "sectionIndexes": [9], "terms": ["PSC", "CSCR", "Infection", "Intracranial hypertension", "Papilledema", "Steroid withdrawal"], "keyPoints": ["類固醇使用中需分別關注後囊下白內障、眼壓／青光眼、感染或傷口修復問題，以及CSCR等黃斑積液。各問題的檢查與處置不同，不能用「白內障能開刀」概括全部視力風險。", "共筆另提papilledema，嚴格定義是顱壓升高造成視神經盤水腫；藥物時程尤其類固醇撤減與其他顱壓危險因素需由臨床團隊評估。頭痛、短暫視黑或雙側盤腫不能簡單歸為普通升眼壓，系統性類固醇亦不宜自行驟停。"], "clinicalLink": "同一藥史對應多個定位，需讓症狀和檢查決定分岔。", "pitfall": "把眼壓升高與顱內壓升高當作同一件事。", "recall": {"question": "Papilledema為何不能只量眼壓就結案？", "answer": "它指顱壓升高相關盤腫，需要神經／顱內病因評估，眼壓測量不能替代。"}, "relatedTopics": ["notes-03", "notes-10"], "sourceIds": ["drug-steroid-effects", "cov13-toxic-optic"]}], "unresolved": [], "sourceSha256": "14e08401e6d7211a8083c9343a15d0b37cb2cf47b86f22dcfe7a14e03f7bcefe"}, "notes-14": {"sourceFile": "眼科學No.14.pdf", "pageCount": 42, "reviewedPages": [{"from": 1, "to": 3, "kind": "administrative", "note": "封面、目錄與課務回饋；不輸出私人姓名或評語。"}, {"from": 4, "to": 21, "kind": "teaching", "note": "問診檢查、紅眼、乾眼、前房／眼壓、眼瞼與淚道病例。"}, {"from": 22, "to": 22, "kind": "exam", "note": "術後頭痛與閉角的原創鑑別練習。"}, {"from": 23, "to": 40, "kind": "teaching", "note": "CCF、模糊與視野、屈光／晶狀體／視神經及眼底標記。"}, {"from": 41, "to": 42, "kind": "exam", "note": "CCF、視交叉與Roth spot考點，改寫概念而非複製題目。"}], "entries": [{"id": "c01", "title": "病史是帶有時間的定位工具", "pages": [4, 19, 25, 26, 36, 37], "unitId": "u1", "sectionIndexes": [0], "terms": ["Onset", "Progression", "職業暴露", "Recurrent corneal erosion", "外傷", "用藥史"], "keyPoints": ["先問最後正常時間、單雙眼、急慢性、持續或波動及正在失去的功能，再問疼痛、外傷、接觸鏡、新藥與近期手術。工作時金屬高速飛入和焊接紫外線暴露是不同傷害，不能只記成「工作後眼痛」。", "清晨睜眼突然痛可提示復發性角膜上皮糜爛，病灶在角膜而非原文誤寫的視網膜。從小穩定差與最近進行性差也不同；舊有弱視不能合理化新下降，過去病史應用來更新而不是鎖死鑑別。"], "clinicalLink": "讓每個問題帶出下一個可驗證的機轉與處置。", "pitfall": "只問「多久」卻不記急性事件的最後正常時間。", "recall": {"question": "清晨第一次睜眼痛，哪個結構與機轉值得先查？", "answer": "角膜上皮附著與復發性糜爛，同時排除其他角膜急症。"}, "relatedTopics": ["notes-01", "notes-05", "notes-13"], "sourceIds": ["cov14-exam", "cov14-keratitis"]}, {"id": "c02", "title": "外觀、眼瞼功能與觸診的安全順序", "pages": [4, 5, 15, 19], "unitId": "u1", "sectionIndexes": [0, 4], "terms": ["Incomplete blinking", "Lagophthalmos", "Lid laxity", "Entropion", "Ectropion", "Preauricular nodes"], "keyPoints": ["外觀檢查包括眼瞼位置、內外翻、下垂、鬆弛及閉合，還要看自然眨眼而非只要求用力閉眼。Lagophthalmos是閉合不全，與不完整眨眼可造成暴露染色，即使同時溢淚也不能排除眼表受傷。", "眼附屬器腫塊需記位置、熱痛與質地，耳前淋巴結可提供感染方向；但懷疑眼球破裂時應避免壓迫。淚腺、淚囊、淚小管是不同部位，不能把內眥腫統稱淚腺炎。"], "clinicalLink": "用位置與功能連結乾眼、淚道及眼眶章節。", "pitfall": "在疑開放性眼球傷時仍照一般流程用力觸診。", "recall": {"question": "眼睛一直流淚能排除暴露性角膜病嗎？", "answer": "不能，閉合及淚泵異常可同時造成溢淚和表面損傷。"}, "relatedTopics": ["notes-08", "notes-11", "notes-12"], "sourceIds": ["cov14-exam", "cov14-exposure"]}, {"id": "c03", "title": "讀懂視力、度數與眼壓：三種數字三個問題", "pages": [5, 6, 19, 28], "unitId": "u1", "sectionIndexes": [0], "terms": ["UCVA", "BCVA", "Pinhole", "Refraction", "NCTIOP", "OD/OS/OU", "Ortho"], "keyPoints": ["UCVA是未矯正視力，BCVA是在合適矯正下測得的功能；驗光的球鏡、柱鏡與軸度是光學資訊，不能和視力分數混用。針孔改善支持光學因素，但既不能保證沒有共病，也不一定完全矯正不規則散光。", "OD、OS、OU分別標示右、左、雙眼；ortho是測試條件下眼位正，不代表所有距離與情境都無隱斜。NCTIOP是非接觸眼壓結果，需考慮方法與角膜；正常範圍的單次眼壓亦不能排除青光眼。"], "clinicalLink": "先解讀測量在回答什麼，再把異常串起來。", "pitfall": "「有戴眼鏡」便當作已取得真正最佳矯正。", "recall": {"question": "視力改善到正常後，所有眼病都可排除嗎？", "answer": "不能，視野、周邊視網膜或早期疾病仍可能存在。"}, "relatedTopics": ["notes-01", "notes-02"], "sourceIds": ["cov14-exam", "cov14-glaucoma"]}, {"id": "c04", "title": "選檢查前先說要回答哪個問題", "pages": [5, 6, 19], "unitId": "u1", "sectionIndexes": [0], "terms": ["Slit lamp", "Fundoscopy", "Topography", "OCT", "Fluorescein angiography", "Visual field", "Color vision"], "keyPoints": ["裂隙燈檢查角膜、前房與晶狀體等前節；眼底檢查視網膜與視神經，散瞳需依情境安排。角膜地形／斷層圖評估角膜形態，OCT提供選定部位結構，血管攝影觀察灌流與滲漏。", "色覺與視野是功能測試，不能直接代替結構或病原診斷；視野可檢驗青光眼或視路定位假說。先寫「懷疑哪裡、哪個結果會改變決策」，比把所有儀器名稱列一輪更有效。"], "clinicalLink": "正常中央OCT不能回答周邊裂孔問題，檢查範圍須與症狀匹配。", "pitfall": "把OCT正常當整顆眼球與視路都正常。", "recall": {"question": "固定半邊視野缺失最需要補哪類資料？", "answer": "分眼視野與視路定位，並按急迫性安排對應神經影像。"}, "relatedTopics": ["notes-01", "notes-03"], "sourceIds": ["cov14-exam", "cov14-field"]}, {"id": "c05", "title": "紅眼先描述血管分布與受傷層次", "pages": [7, 8, 19], "unitId": "u1", "sectionIndexes": [1, 2], "terms": ["Conjunctival injection", "Pericorneal injection", "Ciliary flush", "Mixed injection", "Vascular abnormality"], "keyPoints": ["紅眼可來自血管擴張、結膜下出血或纖維血管病灶如翼狀贅片。表淺結膜充血與角膜周圍／睫狀充血提示不同方向，但不是每種分布都能單獨確診，混合表現亦常見。", "同時量視力並找疼痛、畏光、角膜浸潤、前房反應與眼壓／前房深度。外觀平靜不排後節急症，而眼白很紅也不一定代表重度視覺損傷；分流必須以功能與危險背景為核心。"], "clinicalLink": "把「紅在哪一層」與「功能受影響多少」分開評估再整合。", "pitfall": "只用紅色深淺決定是否緊急。", "recall": {"question": "紅眼評估哪些資訊比顏色更能改變急迫性？", "answer": "實測視力、疼痛／畏光、角膜或前房病灶及危險病史。"}, "relatedTopics": ["notes-05", "notes-07", "notes-09"], "sourceIds": ["cov14-conj", "cov14-keratitis", "cov14-angle"]}, {"id": "c06", "title": "結膜下出血：典型外觀與例外", "pages": [8, 19], "unitId": "u1", "sectionIndexes": [1], "terms": ["Subconjunctival hemorrhage", "外傷", "抗凝血藥", "血壓"], "keyPoints": ["大片邊界清楚紅色、無明顯痛且視力不變，支持結膜下出血；這與血管條紋擴張不同。仍須問揉眼、外傷、咳嗽用力、抗凝血藥與反覆出血，並依情境檢查血壓或凝血背景。", "合併外傷、疼痛、視力下降或出血使眼球輪廓難判時，不能直接套「不緊急」。單純出血常自行吸收，抗凝藥若需調整應與處方者討論，而非患者因眼睛紅自行停藥。"], "clinicalLink": "先排危險例外，再給可理解的病程與回診警訊。", "pitfall": "把照片典型當作不必詢問外傷的理由。", "recall": {"question": "哪種「結膜下出血」不能簡單安心觀察？", "answer": "有外傷、疼痛、視力變差或無法排除眼球內傷者。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov14-sch"]}, {"id": "c07", "title": "濾泡、URI與耳前淋巴結：驗證病毒假說", "pages": [8, 9, 20], "unitId": "u1", "sectionIndexes": [1, 3], "terms": ["Viral conjunctivitis", "URI", "Follicles", "Preauricular lymphadenopathy", "Subepithelial infiltrates"], "keyPoints": ["上呼吸道症狀後水樣或黏液分泌、濾泡與耳前淋巴結支持病毒性結膜炎，但需要確認角膜與前房，不能只看白色分泌物。視力降低或明顯畏光可提示角膜上皮／上皮下浸潤等併發。", "傳染防治、手部和器具衛生是處理的一部分；症狀惡化、異常疼痛或角膜病灶要重新分類。對接觸鏡戴用、淋菌風險或新生兒，也不能將URI背景當排除重症的依據。"], "clinicalLink": "給最可能病名之後，再找一項能推翻它的危險證據。", "pitfall": "病人正在感冒就不量視力、不看角膜。", "recall": {"question": "病毒結膜炎患者後續明顯畏光，該重查什麼？", "answer": "角膜上皮及上皮下浸潤，並排除其他角膜／眼內病變。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov14-conj"]}, {"id": "c08", "title": "接觸鏡痛紅：浸潤＋上皮缺損的意義", "pages": [9, 20], "unitId": "u1", "sectionIndexes": [2], "terms": ["Contact lens", "Corneal ulcer", "Stromal infiltrate", "Fluorescein", "Pseudomonas", "Acanthamoeba"], "keyPoints": ["接觸鏡患者急性痛紅、視力下降，裂隙燈見基質浸潤和對應上皮缺損時要高度考慮感染性角膜炎。可有反應性前房cells，這不自動表示原發葡萄膜炎；需問過夜配戴、水接觸與清潔方式。", "綠膿桿菌與棘阿米巴是不同風險模式的例子，不能只由症狀一項定病原。移除鏡片並及時眼科評估，按病灶決定採樣與抗感染；鏡片／鏡盒不要接觸自來水，亦不能保證任意清潔液都可消除所有病原。"], "clinicalLink": "用病灶層次區分起因與下游炎症，再選能改變治療的採樣。", "pitfall": "以為生理食鹽水沖洗就等於消毒，或先點類固醇試反應。", "recall": {"question": "角膜浸潤伴前房cells一定是葡萄膜炎嗎？", "answer": "不一定，角膜感染可引起繼發前房反應，應辨認主要病灶。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["cov14-keratitis"]}, {"id": "c09", "title": "同樣忽清忽糊：水液不足型的證據鏈", "pages": [10, 20], "unitId": "u1", "sectionIndexes": [3], "terms": ["Aqueous-deficient dry eye", "Sjögren", "Tear meniscus", "Schirmer", "TBUT", "SPK"], "keyPoints": ["視覺波動、低淚河、分泌測試偏低與表面點狀染色，可支持水液不足參與；Sjögren與口乾病史使系統性評估更重要。仍需核對測試方法，原案例的數值不代表所有測試可用同一門檻。", "正常瞼板腺外觀只降低某些脂質異常的可能，不證明沒有混合因素。完整回報應包含視功能、症狀、客觀恆定性與可能驅動因子，而非只說Schirmer低所以全部結束。"], "clinicalLink": "把機轉假說轉為可追蹤的淚河、染色與症狀目標。", "pitfall": "單靠一張濾紙確診全部乾眼病因。", "recall": {"question": "低Schirmer合併口乾，計畫應多哪一步？", "answer": "核對用藥與系統症狀，按情境安排Sjögren等全身評估。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov14-dews"]}, {"id": "c10", "title": "正常淚量仍不穩定：蒸發與MGD", "pages": [11, 12, 20], "unitId": "u1", "sectionIndexes": [3], "terms": ["Evaporative dry eye", "MGD", "Telangiectasia", "Toothpaste-like meibum", "Mixed dry eye"], "keyPoints": ["瞼緣血管擴張、腺口異常、混濁或牙膏樣分泌物，加上短淚膜破裂時間，可支持MGD與蒸發失衡。分泌測試正常不排除此機轉，眨眼後暫時清楚也與表面刷新吻合。", "檢查腺體可擠出性與眨眼完整度，並辨識酒糟、藥物與暴露等背景。水液不足與蒸發異常可同時存在，因此治療後仍不改善時應重排驅動因素，不把結果歸咎配合差。"], "clinicalLink": "以不同測試的互補性建立診斷，而非互相否定。", "pitfall": "Schirmer正常便斷言患者沒有乾眼。", "recall": {"question": "同樣TBUT很短，還要看哪些資料來分型？", "answer": "淚量／淚河、瞼板腺分泌、眨眼、染色和全身病史。"}, "relatedTopics": ["notes-12", "notes-11"], "sourceIds": ["cov14-dews"]}, {"id": "c11", "title": "頭痛、嘔吐與單眼痛紅：急性閉角", "pages": [12, 13, 20, 22], "unitId": "u1", "sectionIndexes": [2], "terms": ["Acute angle closure", "Microcystic corneal edema", "Shallow anterior chamber", "Mid-dilated pupil", "麻醉後閉角"], "keyPoints": ["急性眼痛、虹視、視力下降與噁心嘔吐，合併高眼壓、淺前房及角膜微囊樣水腫時，要立即考慮閉角。中度散瞳是重要線索，但應核對是否藥物散瞳及其他眼內機轉。", "手術／全身麻醉後頭痛嘔吐不能只歸麻醉反應，需注意單眼視覺症狀。先眼科急處理並辨識瞳孔阻滯、晶狀體或藥物性等機制；雙眼新近視與新用topiramate的路徑不同。"], "clinicalLink": "眼科檢查可把看似腸胃或頭痛主訴改為可救視力的急症。", "pitfall": "看到頭痛先排完整腦影像而延誤明顯眼壓急症。", "recall": {"question": "麻醉後嘔吐合併一眼模糊應立刻補什麼？", "answer": "量該眼視力、眼壓與檢查前房／角膜，及時眼科評估。"}, "relatedTopics": ["notes-07", "notes-13"], "sourceIds": ["cov14-angle"]}, {"id": "c12", "title": "前房積膿與脊椎炎：支持證據仍須排感染", "pages": [13, 14, 20], "unitId": "u1", "sectionIndexes": [2], "terms": ["Acute anterior uveitis", "HLA-B27", "Ankylosing spondylitis", "Cells/flare", "Hypopyon", "Retinitis"], "keyPoints": ["脊椎關節炎背景、急性單眼痛紅畏光、前房cells／flare與hypopyon可支持HLA-B27相關前葡萄膜炎。Hypopyon表示嚴重前房反應，並不是HLA-B27專屬，也可能見感染性角膜炎或眼內炎。", "檢查角膜、玻璃體與眼底，確認是否有後節炎症／retinitis及手術、外傷、感染病史。後節清楚使解剖分類較偏前部，但治療前仍需病因評估；系統疾病名稱不能直接取代完整眼科檢查。"], "clinicalLink": "把「在哪發炎」和「為何發炎」分成兩個問題。", "pitfall": "有僵直性脊椎炎就把任何hypopyon當非感染。", "recall": {"question": "前葡萄膜炎為何還要看眼底？", "answer": "確認後節是否受累，以及是否存在會改變病因與處置的感染或其他病灶。"}, "relatedTopics": ["notes-09", "notes-05"], "sourceIds": ["triage-video", "cov14-keratitis", "cov14-hlab27"]}, {"id": "c13", "title": "眼瞼小腫塊：麥粒腫、霰粒腫與偽裝者", "pages": [15, 16, 21], "unitId": "u1", "sectionIndexes": [4], "terms": ["Hordeolum", "Chalazion", "Meibomian gland", "Localized nodule", "Sebaceous carcinoma"], "keyPoints": ["急性局部紅熱痛、腺體位置的膿點或壓痛結節可支持麥粒腫；慢性較無痛的霰粒腫偏脂質引發的肉芽腫反應。需看瞼緣、翻瞼及角膜，判斷是局部病變還是已向周圍擴散。", "同一處反覆、睫毛脫落、表面潰瘍或異常硬結需排皮脂腺癌等偽裝者。即使外觀像針眼，視力下降、眼球運動痛或突眼仍要求改向眼眶評估。"], "clinicalLink": "依時程、位置與異常外觀更新鑑別，避免所有腫塊都當感染。", "pitfall": "一直擠壓或反覆給藥而不重看復發病灶。", "recall": {"question": "慢性反覆同點「針眼」最重要的重評是什麼？", "answer": "確認是否為非感染性或腫瘤病灶，必要時專科病理評估。"}, "relatedTopics": ["notes-11"], "sourceIds": ["cov14-exam", "cov14-orbital", "cov14-sebaceous"]}, {"id": "c14", "title": "隔膜前蜂窩組織炎與眶內病變的分界", "pages": [15, 17, 21], "unitId": "u1", "sectionIndexes": [4], "terms": ["Orbital septum", "Preseptal cellulitis", "Orbital cellulitis", "Painful EOM", "Proptosis", "RAPD"], "keyPoints": ["隔膜前感染可有廣泛眼瞼紅熱腫，但典型上眼球運動、視功能與眼球位置應相對保留。運動痛／受限、突眼、RAPD或視力下降提示隔膜後侵犯，需緊急影像、眼科與全身抗感染評估。", "眼皮腫到無法可靠檢查、兒童或全身病況重時，不能用「沒報告眼動痛」當排除證據。是否門診與追蹤時機取決於可檢查性、嚴重度及回診條件，不能沿用原案例固定三天再看。"], "clinicalLink": "先確認關鍵功能真的被檢查，而非把未查到寫成正常。", "pitfall": "只有發燒才算眶內感染。", "recall": {"question": "眼皮很腫遮住瞳孔，能只憑眼瞼外觀診斷preseptal嗎？", "answer": "不能，需確保可評估視功能與眶內徵象，必要時升級評估。"}, "relatedTopics": ["notes-08"], "sourceIds": ["cov14-orbital"]}, {"id": "c15", "title": "內眥疼痛溢淚：急性淚囊炎", "pages": [17, 18, 21], "unitId": "u1", "sectionIndexes": [4], "terms": ["Acute dacryocystitis", "Nasolacrimal duct obstruction", "Punctal reflux", "Tear meniscus"], "keyPoints": ["內眥下方痛紅腫、溢淚和鼻淚管阻塞史支持急性淚囊炎，可有淚點回流分泌物與高淚河。位置幫助與淚腺炎、淚小管炎及一般眼瞼感染區分，仍需評估感染是否擴展。", "急性期先控制感染並安排眼科處理，不能為了證明阻塞而直接強力沖洗或探通。病況穩定後才依原因規劃引流重建；一次抗生素改善不代表原有阻塞已解決。"], "clinicalLink": "將當下感染與長期引流障礙分成相連的兩階段計畫。", "pitfall": "把急性期強行沖淚道當常規下一步。", "recall": {"question": "急性淚囊炎為何不急著沖通？", "answer": "急性發炎感染時可能增加傷害與擴散風險，應先控制感染再安排後續。"}, "relatedTopics": ["notes-08"], "sourceIds": ["cov14-dacryo", "cov14-dacryo-care"]}, {"id": "c16", "title": "淚腺、淚囊與眼眶：腫的位置能縮短清單", "pages": [5, 15, 18, 21], "unitId": "u1", "sectionIndexes": [4], "terms": ["Dacryoadenitis", "Canaliculitis", "Lacrimal gland mass", "Lacrimal sac", "Orbital compartment"], "keyPoints": ["外上方眼眶／眼瞼腫脹較提示淚腺，內眥下方較偏淚囊，淚點與淚小管局部異常則向淚小管炎思考。共筆前段混用淚腺和淚囊名稱，臨床應以解剖位置校正。", "淚腺區無痛進展腫塊、眼球移位或感覺異常需排腫瘤；眶內壓迫若造成視力或RAPD變化需緊急處理。用「眼瞼紅」作總稱無法決定是否局部處置、感染治療或影像檢查。"], "clinicalLink": "口試先用一個解剖名詞定位，再提出相符的兩項病因。", "pitfall": "只因看得到眼皮腫就排除深部眼眶病變。", "recall": {"question": "內眥下方與外上方腫塊分別首先定位在哪？", "answer": "前者偏淚囊，後者偏淚腺／外上眼眶，仍需完整檢查。"}, "relatedTopics": ["notes-08"], "sourceIds": ["cov14-dacryo", "cov14-orbital"]}, {"id": "c17", "title": "CCF：靜脈高壓串起紅、突、複視與下降", "pages": [23, 24, 36, 41, 42], "unitId": "u2", "sectionIndexes": [5], "terms": ["Carotid cavernous fistula", "Chemosis", "External ophthalmoplegia", "Proptosis", "Bruit", "眼壓升高"], "keyPoints": ["頸動脈系統與海綿竇異常交通可使眼眶靜脈壓上升，出現螺旋樣血管、結膜水腫、突眼、外眼肌麻痺及眼壓升高。搏動性雜音是支持線索，但沒有聽到不代表排除低流量病變。", "視功能明顯下降或急速惡化時應及時影像與眼科／神經血管團隊評估。輕度白內障或稍高眼壓不足以解釋嚴重視損與多神經表現；需要檢查回流障礙、視神經與視網膜受影響情況。"], "clinicalLink": "以一個血管機轉解釋眼表、眼位與視功能，並指出需驗證的影像。", "pitfall": "只見下垂就當孤立III麻痺，忽略突眼與靜脈充血。", "recall": {"question": "CCF為何同時造成紅眼和複視？", "answer": "靜脈壓及海綿竇／眶內影響可同時造成血管擴張、水腫與眼動障礙。"}, "relatedTopics": ["notes-08", "notes-03"], "sourceIds": ["cov14-ccf"]}, {"id": "c18", "title": "模糊的時間、距離與光線：解剖逐段驗證", "pages": [25, 26, 36, 37], "unitId": "u2", "sectionIndexes": [6, 7], "terms": ["Tear film", "Cornea", "Lens", "Vitreous", "Retina", "Optic nerve", "Brain", "夜盲", "高階像差"], "keyPoints": ["從淚膜／角膜、晶狀體、玻璃體到視網膜、視神經與腦逐段找證據。看近或看遠、眨眼能否改善、白天或夜間、持續或間歇，以及固定哪塊視野暗，都比「模糊」兩字更能定位。", "夜間模糊可能與大瞳孔的像差或光學問題相關，也可能是真正暗適應／視網膜疾病；慢性病亦可急性合併新病。疼痛、頭痛嘔吐、眼動痛、耳部搏動聲和複視會讓鑑別改道，不能只驗光結案。"], "clinicalLink": "用同一問診框架把不同章的知識連到病人主訴。", "pitfall": "將急慢性當不可重疊的兩種病人。", "recall": {"question": "「晚上不清楚」還需要再問什麼？", "answer": "是眩光／重影還是暗處看不見，並查瞳孔、屈光與視網膜功能。"}, "relatedTopics": ["notes-02", "notes-10"], "sourceIds": ["triage-video", "cov14-exam"]}, {"id": "c19", "title": "老花與遠視：好視力不等於沒近用困難", "pages": [28, 37], "unitId": "u2", "sectionIndexes": [7], "terms": ["Presbyopia", "Hyperopia", "Accommodation", "Near addition", "Nuclear sclerosis"], "keyPoints": ["遠視是屈光狀態，老花是調節能力隨年齡下降；兩者可同時出現。成人看近吃力但最佳遠距視力良好，需測近用需求、調節與工作距離，不能只因驗光正度數便直接把所有問題叫老花。", "輕度核硬化可共存而非一定是主因；處方改善後仍有異常症狀，要重查眼表、雙眼功能或其他結構。近用加光的目的是配合剩餘調節與距離，不是「治好」眼軸或晶狀體老化。"], "clinicalLink": "將症狀距離與可矯正的光學原因配對，再驗收實際閱讀功能。", "pitfall": "正球鏡度數就是老花度數。", "recall": {"question": "遠視與老花最大的概念差別？", "answer": "前者是屈光需求，後者是調節能力減少，可同時存在。"}, "relatedTopics": ["notes-02", "notes-06"], "sourceIds": ["cov14-exam"]}, {"id": "c20", "title": "兒童視力不良：睫狀肌麻痺驗光與弱視", "pages": [25, 28, 37], "unitId": "u2", "sectionIndexes": [7], "terms": ["Cycloplegic refraction", "Latent hyperopia", "Astigmatism", "Amblyopia", "Red reflex"], "keyPoints": ["兒童調節強，未睫狀肌麻痺的驗光可低估遠視或誤判近視；應依兒童眼科流程取得可靠屈光資料。高度遠視合併散光可能造成雙眼弱視，即使眼位看似正，也不能排除視覺發育問題。", "紅光反射正常有幫助，但不代表所有眼底或視神經疾病已排除；最佳矯正後仍差需結合年齡、測試可靠度及器質性檢查。及時光學矯正與適當弱視管理比只等待長大更重要。"], "clinicalLink": "把驗光誤差、視覺發育和器質性排除連在同一流程。", "pitfall": "只因孩子會瞇眼便直接診斷近視。", "recall": {"question": "為何未散瞳驗到輕度遠視仍可能是真正高度遠視？", "answer": "強調節可掩蓋部分遠視，需要睫狀肌麻痺驗光確認。"}, "relatedTopics": ["notes-04", "notes-02"], "sourceIds": ["cov14-amblyopia", "cov14-exam"]}, {"id": "c21", "title": "進展散光與圓錐角膜：眼鏡之外的證據", "pages": [29, 38], "unitId": "u2", "sectionIndexes": [7], "terms": ["Keratoconus", "Irregular astigmatism", "Corneal topography", "Tomography", "Posterior elevation"], "keyPoints": ["年輕成人逐漸不對稱模糊、散光增加與眼鏡最佳矯正不佳，需查角膜形態。圓錐角膜可有局部變薄與突出，地形／斷層圖須一起看前後表面及厚度分布，不能單由一個高柱鏡數字確診。", "原案例下方較凸是模式線索，不代表所有圓錐都固定在同一位置。還需區分接觸鏡塑形、其他角膜瘢痕或退化；若確認進展，及早專科討論穩定病程與視覺矯正的不同目標。"], "clinicalLink": "把「為何配不到清楚」變成結構假說，而不無限增加眼鏡度數。", "pitfall": "散光很高就直接等同圓錐角膜。", "recall": {"question": "判斷圓錐角膜除了屈光還需要什麼？", "answer": "角膜形態、厚度、裂隙燈與時間變化等相符證據。"}, "relatedTopics": ["notes-05", "notes-02"], "sourceIds": ["cov14-keratoconus"]}, {"id": "c22", "title": "近視位移、核硬化與後囊下白內障", "pages": [29, 30, 38], "unitId": "u2", "sectionIndexes": [7], "terms": ["Nuclear sclerosis", "Myopic shift", "Second sight", "PSC", "PCO", "Glare"], "keyPoints": ["核硬化可改變晶狀體屈光而出現近視位移，原本看近困難短暫改善並不等於眼睛返老還童。核的黃褐混濁與眩光／最佳矯正視力需配對，並確認是否合併視網膜或視神經病。", "後囊下白內障（PSC）位於晶狀體後部，與術後後囊混濁（PCO）不同。小而中央的混濁也可能影響明亮環境或閱讀；單看混濁面積不能完整預測功能，手術判斷需結合生活需求與眼部潛力。"], "clinicalLink": "以屈光變化與混濁位置解釋主訴，避免只背白內障分類。", "pitfall": "把PSC寫成白內障手術後的PCO。", "recall": {"question": "突然看近變清楚可以證明老花痊癒嗎？", "answer": "不能，核硬化等屈光改變可造成暫時的近用改善。"}, "relatedTopics": ["notes-06", "notes-13"], "sourceIds": ["cov14-cataract"]}, {"id": "c23", "title": "青光眼：盤杯、視野與結構相互印證", "pages": [26, 30, 31, 37, 38, 39], "unitId": "u2", "sectionIndexes": [8], "terms": ["Cup-to-disc ratio", "Neuroretinal rim", "RNFL", "Nasal step", "Peripapillary atrophy", "Normal-tension glaucoma"], "keyPoints": ["垂直盤杯增大、局部rim變薄與對應RNFL／視野缺損共同提高青光眼疑慮。大視神經盤可以有較大生理盤杯，周邊萎縮亦不專屬青光眼；原文「C/D大於0.8基本就是」不能當確診規則。", "鼻階梯與弓形缺損常沿水平結構模式，但可能在上方或下方，不是一定先從上半開始。眼壓正常不排正常眼壓型青光眼，輕度高壓亦不等於已有損害；要查隅角、結構、可靠視野及進展。"], "clinicalLink": "用結構—功能—時間三者一致性，取代單一數字診斷。", "pitfall": "將C/D或21mmHg作為唯一診斷界線。", "recall": {"question": "大盤杯與正常中央視力並存，下一步怎麼說？", "answer": "評估盤大小與rim／RNFL，做可靠視野、隅角及追蹤比較。"}, "relatedTopics": ["notes-07"], "sourceIds": ["cov14-glaucoma", "cov14-field"]}, {"id": "c24", "title": "眼部視野缺損：RD、BRVO、NAION與青光眼", "pages": [26, 37], "unitId": "u2", "sectionIndexes": [8], "terms": ["Retinal detachment", "BRVO", "NAION", "Altitudinal defect", "Arcuate defect", "RAPD"], "keyPoints": ["視網膜剝離可產生幕簾式缺損，分支視網膜靜脈阻塞（BRVO）可能與扇區出血／水腫對應，NAION常有盤腫與高度性缺損，青光眼常有弓形或鼻階梯。這些是模式，不是每病固定缺上半或下半。", "先核對兩眼、檢查可靠度、缺損範圍與結構對應。正常瞳孔對光反射不能排所有神經疾病，尤其雙側對稱或交叉後病變；RAPD也不能單獨分清視網膜與視神經。"], "clinicalLink": "把缺損畫在正確視野側，再去找能解釋它的眼底。", "pitfall": "把原文「先測light reflex排除神經病」當有效排除法。", "recall": {"question": "正常light reflex能否排除枕葉或視放射病灶？", "answer": "不能，交叉後病變可保留瞳孔反射，仍需視野與神經定位。"}, "relatedTopics": ["notes-03", "notes-10"], "sourceIds": ["cov14-field", "triage-rd", "triage-video"]}, {"id": "c25", "title": "視路地圖：垂直中線與上下象限", "pages": [27, 37], "unitId": "u2", "sectionIndexes": [8], "terms": ["Optic nerve", "Optic chiasm", "Optic tract", "LGN", "Meyer loop", "Parietal radiation", "Occipital cortex", "Macular sparing"], "keyPoints": ["單眼視野缺損先向交叉前定位，雙顳缺損提示視交叉，同向缺損提示對側交叉後視路，可能在視束、外側膝狀體、視放射或枕葉。中心暗點與整眼喪失也要配對視神經／視網膜證據，不能只套圖形。", "顳葉Meyer loop受損常涉及對側上象限，頂葉視放射較偏下象限；枕葉病灶可有較一致同向缺損與黃斑保留，但這些並非絕對。定位需要病史、可靠視野與影像，對光反射可保留。"], "clinicalLink": "以垂直界線與同向性建立解剖假說，再挑能確認的檢查。", "pitfall": "把患者說「左眼」直接當左眼病，不分眼測視野。", "recall": {"question": "左同向偏盲最基本定位在哪側？", "answer": "右側交叉後視路，再結合型態與影像細分。"}, "relatedTopics": ["notes-03"], "sourceIds": ["cov14-field"]}, {"id": "c26", "title": "保留中央視力仍可能有腦病灶", "pages": [32, 39], "unitId": "u2", "sectionIndexes": [8], "terms": ["Homonymous hemianopia", "Optic disc pallor", "Epidermoid cyst", "Cerebellopontine angle", "影像一致性"], "keyPoints": ["兩眼中央視力接近正常但有同向半邊缺損，不能以「視力表很好」排除嚴重視路病。視神經盤蒼白、色覺與視野資訊提示需神經定位，腦影像應實際確認病灶是否接觸相應路徑。", "共筆以右側橋小腦角表皮樣囊腫病例示範影像與視野，但橋小腦角不是固定的同向偏盲定位點；需瞭解病灶擴展、壓迫和其他解釋。教材只保留「影像診斷要能解釋功能」的概念，不由單張截圖重新確診原個案。"], "clinicalLink": "發現與解剖不完全吻合時，應明確指出需要更多影像而非硬套。", "pitfall": "把某張病例圖變成「CP angle病灶必致對側偏盲」的定律。", "recall": {"question": "腦MRI看到腫塊後，口試還要問哪件事？", "answer": "它的位置、範圍與壓迫是否足以解釋實際視野缺損。"}, "relatedTopics": ["notes-03"], "sourceIds": ["cov14-field", "triage-video"]}, {"id": "c27", "title": "雙顳偏盲：視交叉腫瘤與動脈瘤", "pages": [33, 39, 41, 42], "unitId": "u2", "sectionIndexes": [8], "terms": ["Bitemporal hemianopia", "Chiasmal compression", "Pituitary tumor", "Aneurysm", "Pupillary light reflex"], "keyPoints": ["雙眼顳側視野缺損符合視交叉受影響的方向，腦垂體區腫瘤是重要病因，但原共筆另以動脈瘤示範，提醒視交叉壓迫不能只想到單一腫瘤。中央視力與瞳孔反射尚可並不排除。", "需記錄起病速度、頭痛、內分泌或其他神經症狀，按急迫性安排腦與血管影像。急性加重與劇烈頭痛要警惕血管或鞍區急症，不能僅安排常規配鏡回診。"], "clinicalLink": "先定位再展開病因清單，讓動脈瘤與腫瘤共用同一視路邏輯。", "pitfall": "雙顳偏盲就直接宣佈一定是腦垂體腺瘤。", "recall": {"question": "雙顳偏盲且對光反射正常，是否矛盾？", "answer": "不矛盾，視交叉病變可保留部分中央功能與瞳孔反射。"}, "relatedTopics": ["notes-03"], "sourceIds": ["cov14-field"]}, {"id": "c28", "title": "糖尿病眼底第一層：微血管與視網膜內標記", "pages": [34, 40], "unitId": "u2", "sectionIndexes": [6], "terms": ["Microaneurysm", "Hard exudate", "Cotton-wool spot", "Dot/blot hemorrhage", "Flame hemorrhage", "RNFL"], "keyPoints": ["微血管瘤是小紅點樣早期線索；硬滲出為血管滲漏後的脂質／蛋白沈積，棉絮斑則與神經纖維層缺血及軸漿流受阻相關。點狀／斑塊出血多在較深視網膜，火焰或條狀出血則受淺層纖維走向影響。", "描述時先說位置、形狀與分布，再結合糖尿病與高血壓等背景，避免把每個白點都叫脂肪或每個紅點都叫微血管瘤。視力下降還需看黃斑水腫、缺血與其他共病，不能只報「有DR」便結案。"], "clinicalLink": "用層次解讀影像標記，才能連到OCT與血管攝影的下一步。", "pitfall": "把棉絮斑說成與硬滲出相同成分。", "recall": {"question": "硬滲出與棉絮斑如何在機轉上區分？", "answer": "前者偏血管滲漏沈積，後者偏神經纖維層微血管缺血／軸漿阻滯。"}, "relatedTopics": ["notes-10", "notes-13"], "sourceIds": ["cov14-dr"]}, {"id": "c29", "title": "Roth spots：一種徵象，多條全身路徑", "pages": [34, 35, 40, 41, 42], "unitId": "u2", "sectionIndexes": [6], "terms": ["Roth spot", "White-centered hemorrhage", "Fibrin platelet plug", "Endocarditis", "Anemia", "Thrombocytopenia", "Leukemia", "Multiple myeloma", "Collagen vascular disease", "Pre-eclampsia", "HIV", "Hypoxia", "Radiation", "Abusive head trauma"], "keyPoints": ["Roth spot是白色中心的視網膜出血，中心可含纖維蛋白／血小板等成分，不能直接叫細菌膿瘍。感染性心內膜炎是經典聯想，但貧血、血小板低下、白血病／多發性骨髓瘤、糖尿病或高血壓等亦可出現。", "共筆延伸鑑別還含膠原血管疾病、子癲前症、HIV、缺氧、放射線及兒童頭部虐待相關情境；這些需依年齡、病史、全身徵象和其他眼底發現選擇檢查。單一Roth spot既不能確診心內膜炎，也不能單獨推定虐待。"], "clinicalLink": "眼底徵象應觸發有方向的全身評估，而非把所有人送同一套檢驗。", "pitfall": "看見白心出血就斷言一定是感染性心內膜炎。", "recall": {"question": "Roth spot患者沒有發燒，還需想什麼？", "answer": "血液、血管、代謝等其他病因，依病史與體檢安排評估。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov14-roth", "cov14-dr"]}, {"id": "c30", "title": "增殖性病變：視網膜前出血、纖維化與牽引", "pages": [35, 40], "unitId": "u2", "sectionIndexes": [6, 9], "terms": ["Subhyaloid hemorrhage", "Preretinal hemorrhage", "Neovascularization", "Preretinal fibrosis", "Tractional retinal detachment", "Disc hemo ">你的答案</span>':''}</label>`).join('')}</fieldset>${!answered?`<fieldset class="confidence"><legend>這一題有多確定？</legend>${[[1,'還不確定'],[2,'有些把握'],[3,'很有把握']].map(([n,label])=>`<button class="chip" data-action="confidence" data-value="${n}" aria-pressed="${S.confidence===n}">${label}</button>`).join('')}</fieldset><div class="question-actions"><button class="btn primary" data-action="submit" ${S.selected===null?'disabled':''}>確認答案</button><span class="small">自編單選練習<br>非歷屆試題</span></div>`:feedback(q,response)}</div><div class="question-footer"><button class="btn subtle" data-action="prev" ${S.qi===0?'disabled':''}>上一題</button><span>${S.ids.filter(id=>S.round[id]).length} / ${S.ids.length} 本輪已答</span><button class="btn" data-action="${S.qi===S.ids.length-1?'finish':'next'}">${S.qi===S.ids.length-1?'本輪總結':'下一題'}</button></div></article>`:`<div class="card empty"><h2>目前沒有符合的題目</h2><p>${S.mode==='wrong'?'先完成一輪練習，錯題會出現在這裡。':S.mode==='uncertain'?'選擇「還不確定」後提交答案，就能在這裡再練一次。':'這個主題可先從主動複習開始。'}</p>${btn('練習全部題目','all','','primary')}</div>`}</section><aside class="quiz-side"><div class="card side-card"><h3>本輪題目</h3><div class="q-grid">${S.ids.map((id,i)=>{const r=S.round[id];return `<button class="q-num ${i===S.qi?'current ':''}${r?(r.correct?'good':'bad'):''} ${r?.confidence===1?'uncertain':''}" data-action="jump" data-value="${i}" aria-label="第 ${i+1} 題${r?(r.correct?'，答對':'，待補強'):''}" ${i===S.qi?'aria-current="step"':''}>${i+1}</button>`;}).join('')}</div><div class="legend"><span>答對</span><span>待補強</span></div><p class="small" style="margin-top:14px">外框為目前題目；下方小點表示作答時不確定。</p></div><div class="card side-card"><h3>把一題練完整</h3><ol class="method-list"><li><div><strong>找出關鍵線索</strong><span>題目在問診斷、定位，還是優先處置？</span></div></li><li><div><strong>解釋你的選擇</strong><span>先想理由，再查看答案。</span></div></li><li><div><strong>留下一句修正</strong><span>把易錯點變成下次會記得的提醒。</span></div></li></ol></div><div class="card side-card today-card"><p class="eyebrow">TODAY’S FOCUS</p><h3>今天，完成一小步</h3><p>${esc(D.plan.find(p=>p.date===day)?.goals[0]||'重練一個錯題主題，再完成一輪面試口述。')}</p>${btn('查看每日計畫','tab','plan')}</div></aside></div>`;
}
function feedback(q,r){const m=meta['q:'+q.id]||{},pieces=q.explanation.split(/\n\n常見陷阱：/),highWrong=r.confidence===3&&!r.correct;return `<section class="feedback ${r.correct?'':'is-wrong'}" aria-label="作答解析"><div class="feedback-head" role="status">${r.correct?'✓ 答對了':'這一題值得再練一次'} · 正確答案 ${'ABCD'[q.correctIndex]}</div><div class="feedback-content">${highWrong?'<p class="confidence-note">你剛才很有把握。先找出原本判斷與解析的差異，再重練一次。</p>':r.confidence===1?'<p class="confidence-note">你標記為不確定；可以從「不確定的題目」再練習。</p>':''}<div class="reason-step"><span class="step-number">1</span><div><h3>為什麼是這個答案</h3><p>${esc(pieces[0])}</p></div></div>${pieces[1]?`<div class="trap"><strong>容易混淆的地方</strong><br>${esc(pieces.slice(1).join('\n'))}</div>`:''}<div class="reason-step"><span class="step-number">2</span><div><h3>換你說一次</h3><p>不用看選項，說出支持「${esc(q.options[q.correctIndex])}」的關鍵。再選一個干擾選項，解釋它為什麼不符合題幹。</p></div></div><label class="field-label" for="error-reason">我的判斷卡在哪裡？</label><select class="select" id="error-reason"><option value="">選擇一個原因（選填）</option>${['概念不熟','漏看關鍵線索','優先順序混淆','計算或單位錯誤','答對但不夠確定','已掌握，能解釋'].map(x=>`<option ${m.reason===x?'selected':''}>${x}</option>`).join('')}</select><label class="field-label" for="reflection">留給下次的一句提醒</label><textarea class="input" id="reflection" maxlength="2000" placeholder="例如：先確認題目問的是什麼；再寫下這題要記住的差別。">${esc(m.note||'')}</textarea><div class="actions" style="margin-top:15px">${btn('複習這個概念','learn-topic',q.topicId,'small')}${btn('重新作答','retry','','small subtle')}</div>${questionSource(q)}${medicalReviewNote(q.medicalReview)}${refs(q.refs)}</div></section>`;}
function learn(){const t=D.topics.find(x=>x.id===S.learn),st=stats();return heading('02 / ACTIVE RECALL','主動複習','讀過之後，遮住答案。能用自己的話說出來，才算完成一次回想。',`<div class="heading-stat"><strong>${st.topics}<i> / ${D.topics.length}</i></strong><span>主題已複習</span></div>`)+`<div class="two-col"><aside class="card topic-menu" aria-label="複習主題">${orderedTopics().map((x,i)=>`<button class="topic-button ${x.id===t.id?'active':''}" data-action="learn-topic" data-value="${x.id}" ${x.id===t.id?'aria-current="true"':''}><span class="index">${String(i+1).padStart(2,'0')}</span><span>${x.chapter?'共筆 '+String(x.chapter).padStart(2,'0')+' · ':''}${esc(shortTitle(x.id))}</span>${entries['topic:'+x.id]?.done?'<span class="done">✓</span>':''}</button>`).join('')}</aside><article class="card reading-card"><p class="eyebrow">CONCEPT ${String(D.topics.indexOf(t)+1).padStart(2,'0')} / ${D.topics.length}</p><h2>${esc(t.title)}</h2><p class="lead">${esc(t.summary)}</p>${enrichmentNav(t)}<div class="study-switch" role="group" aria-label="複習方式"><button class="btn ${!S.recall?'active':''}" data-action="recall" data-value="off" aria-pressed="${!S.recall}">閱讀重點</button><button class="btn ${S.recall?'active':''}" data-action="recall" data-value="on" aria-pressed="${S.recall}">遮住答案，主動回想</button></div>${renderLessonContent(t)}${chapterExtras(t)}<p class="learning-note"><strong>${t.chapter?'勘誤與判讀提醒：':''}</strong>${esc(t.notes)}</p>${refs(t.refs)}<div class="reading-actions">${btn(entries['topic:'+t.id]?.done?'✓ 已複習（可取消）':'標記已複習','topic-done',t.id)}${btn('練習此主題','practice-topic',t.id,'primary')}</div></article></div>`;}
function currentInterview(){return D.interview.find(i=>i.id===S.interview);}
