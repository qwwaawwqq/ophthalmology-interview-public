function interview(){const i=currentInterview(),v=ivEntry(),rating=v.ratings.filter(Boolean).length;return heading('03 / INTERVIEW STUDIO','面試演練','先用自己的話回答，再看參考口稿。這裡不錄音，也不自動評分。',`<div class="heading-stat"><strong>${stats().interviews}<i> / ${D.interview.length}</i></strong><span>組已演練</span></div>`)+`<div class="two-col"><aside class="card topic-menu" aria-label="面試題目">${D.interview.map((x,n)=>`<button class="topic-button ${x.id===i.id?'active':''}" data-action="interview" data-value="${x.id}" ${x.id===i.id?'aria-current="true"':''}><span class="index">${String(n+1).padStart(2,'0')}</span><span>${esc(x.title)}</span>${entries['interview:'+x.id]?.practiced?'<span class="done">✓</span>':''}</button>`).join('')}</aside><article class="card reading-card"><div class="interview-stage"><div class="interview-top"><div><p class="eyebrow">考官提問</p><h2>${esc(i.question)}</h2><p class="subtitle">${esc(i.title)}</p></div><div class="timer-ring ${S.seconds===0?'finished':''}" id="timer-ring" style="--ratio:${S.seconds/i.durationSeconds*100}%"><div class="timer-core"><span id="timer" class="timer-value" role="timer" aria-label="剩餘 ${S.seconds} 秒">${formatTime(S.seconds)}</span><span class="small">練習倒數</span></div></div></div><div class="timer-controls"><button id="timer-toggle" class="btn primary" data-action="timer">${S.deadline?'暫停計時':S.seconds===0?'再練一次':S.seconds===i.durationSeconds?'開始計時':'繼續計時'}</button>${btn('重設','timer-reset','','subtle')}<span class="small">目標 ${i.durationSeconds} 秒 · 非官方時間限制</span></div><p id="timer-notice" class="small" role="status">${S.seconds===0?'時間到。先收好最後一句，再檢查是否直接回答問題。':''}</p></div><section class="framework"><h3>用三段，搭出你的回答</h3><div class="framework-grid"><div><strong><b>01</b> 先回答</strong>第一句直接說你的主張。</div><div><strong><b>02</b> 給證據</strong>${i.clinical?'用病史、檢查和定位支持判斷。':'用真實例子說明你的角色與行動。'}</div><div><strong><b>03</b> 收回主題</strong>${i.clinical?'交代紅旗、求援與下一步。':'說明學到什麼、限制或下一步。'}</div></div></section>${i.clinical?clinicalSource(i):personalInterviewTools(i)}<label class="field-label" for="iv-draft">我的回答草稿</label><textarea class="input draft" id="iv-draft" maxlength="12000" placeholder="我想回答的是…&#10;&#10;一個真實的例子：當時的情境、我的角色、我做了什麼…&#10;&#10;這讓我學到…；下一步我會…">${esc(v.draft)}</textarea><div class="draft-meta"><span class="small">文字會更新到本次進度；離開前請匯出。</span><span class="small" id="draft-count">${v.draft.length} 字</span></div><details class="model"><summary>${i.clinical?'查看臨床參考回答':'查看通用回答架構'}</summary><div><p class="preline">${esc(i.answer)}</p><p class="small">${esc(i.personalizationRequired)}</p></div></details><section class="followup"><p class="eyebrow">FOLLOW-UP ${S.followup+1} / ${i.followups.length}</p><p>${esc(i.followups[S.followup%i.followups.length])}</p>${btn('換一個追問','followup','','small')}<label class="field-label" for="iv-followup">追問回答筆記</label><textarea class="input" id="iv-followup" maxlength="3000" placeholder="先直接回答這個追問，再補一個具體例子。">${esc(meta['followup:'+i.id+':'+S.followup]?.note||'')}</textarea>${i.followupAnswers?.[S.followup]?`<details class="followup-model"><summary>回答後，查看追問回應參考</summary><p class="preline">${esc(i.followupAnswers[S.followup])}</p></details>`:''}</section><h3>回看這一輪：哪裡已經做到？</h3><div class="rubric">${i.rubric.map((r,n)=>`<label class="check-label"><input type="checkbox" class="rating" data-index="${n}" ${v.ratings[n]?'checked':''}><span>${esc(r)}</span></label>`).join('')}</div><div class="rating-feedback" id="rating-feedback">${ratingText(i,v.ratings)}</div><label class="field-label" for="iv-improve">下一輪只改進一件事</label><textarea id="iv-improve" class="input" maxlength="2000" placeholder="例如：第一句縮短；補清楚自己的角色；把結尾拉回臨床學習。">${esc(meta['interview:'+i.id]?.note||'')}</textarea><div class="reading-actions">${btn(v.practiced?'✓ 更新這輪演練':'完成這輪演練','iv-done','','primary')}${btn('下一個題目','iv-next')}</div></article></div>`;}
function personalInterviewTools(i){return `<section class="personal-answer"><div class="preview-heading"><span class="tag">${esc(i.basis||'演練草稿')}</span><span class="small">公開版空白架構 · 請自行填寫</span></div><h3>從通用架構開始練</h3><p class="preline">${esc(i.shortAnswer||'')}</p><div class="actions">${btn('帶入完整架構','use-model','','small primary')}${btn('帶入短版架構','use-short','','small')}</div><p class="small">架構會附加到下方草稿，請以自己的真實資料填寫。</p><details class="fact-sheet"><summary>填寫與核對提醒</summary><h3>待自行填寫</h3>${list(i.keyFacts||[])}<h3>表達時留意</h3>${list(i.pitfalls||[])}<p class="small">${esc(i.personalizationRequired||'')}</p></details></section>`;}
function personalSourceList(){return `<section class="card reading-card"><h2>自行填寫與核對</h2><p class="lead">公開版不提供個人履歷或私人附件；請依自己的真實資料完成模板。</p></section>`;}

function ratingText(i,ratings){const n=ratings.filter(Boolean).length;return n===5?'5 / 5 項已自評完成。下一輪試著不看草稿，自然說完。':`${n} / 5 項已自評完成。下一輪優先檢查：${esc(i.rubric[ratings.findIndex(x=>!x)])}。`;}
const storyFields=[['title','故事名稱','用一句話辨識這件事，例如一次交班協調。',120],['context','情境與任務','什麼時間、什麼工作情境？保留必要背景，省略病人可識別資訊。',1800],['role','我的角色與督導','我實際負責什麼？誰負責指導或最後決策？',1800],['challenge','困難與重要性','為什麼這件事不容易？若未處理，會影響什麼？',1800],['action','我採取的行動','依順序寫出你實際做的 2–3 件事，區分自己的工作與團隊成果。',1800],['result','結果與證據','發生了什麼可觀察的改變？不知道或沒有數據時，清楚寫出限制。',1800],['reflection','反思與眼科訓練的連結','下次如何做得更好？這段經歷如何幫助你成為可靠的住院醫師？',1800]];
const qualityLabels=['挑戰是否具體','對他人的影響是否清楚','自己的行動是否清楚','事件的重要性是否清楚'];
const evidenceFields=[['title','研究或經歷名稱','寫正式題名或可核對的經歷名稱。',200],['role','本人負責的工作','寫自己的責任，不把團隊整體工作都歸給自己。',1800],['method','方法或具體行動','用了什麼方法？為什麼選它？保留面試者能理解的關鍵。',1800],['result','主要產出或結果','只填一項能由正式稿或紀錄支持的結果，保留分析單位。',1800],['limits','限制與意義','結果能支持什麼？不能推論什麼？如何連回臨床工作？',1800],['status','目前狀態與核對日期','例如投稿中／修回中／已接受；或任職起訖。請附核對日期。',600],['proof','可核對的依據','記下正式稿版本、表格編號或通知日期，不必貼入私人連結或病人資料。',1000]];
function formFields(fields,value,kind){return fields.map(([key,label,hint,max])=>`<label class="field-label" for="${kind}-${key}">${esc(label)}</label><textarea class="input ${key==='title'?'compact-input':''}" id="${kind}-${key}" data-work-kind="${kind}" data-work-field="${key}" maxlength="${max}" placeholder="${esc(hint)}">${esc(value[key]||'')}</textarea>`).join('');}
function seedMeta(key){const [kind,id]=key.split(':');const source=kind==='story'?D.storySeeds:kind==='evidence'?D.evidenceSeeds:[];return {...(source.find(x=>x.id===id)?.defaults||{}),at:'1970-01-01T00:00:00.000Z'};}
function exportMeta(){const all={};for(const [kind,seeds] of [['story',D.storySeeds],['evidence',D.evidenceSeeds]])for(const seed of seeds)if(seed.defaults)all[kind+':'+seed.id]=seedMeta(kind+':'+seed.id);return {...all,...meta};}
function storyValue(){return {...seedMeta('story:'+S.story),...(meta['story:'+S.story]||{})};}
function evidenceValue(){return {...seedMeta('evidence:'+S.evidence),...(meta['evidence:'+S.evidence]||{})};}
function filled(value,fields){return fields.filter(([k])=>String(value[k]||'').trim()).length;}
function storyOutline(v){return storyFields.filter(([k])=>k!=='title'&&v[k]?.trim()).map(([k,label])=>`${label}：${v[k].trim()}`).join('\n\n');}
function evidenceOutline(v){return evidenceFields.filter(([k])=>v[k]?.trim()).map(([k,label])=>`${label}：${v[k].trim()}`).join('\n\n');}
function workshop(){const started=D.storySeeds.filter(s=>filled({...seedMeta('story:'+s.id),...(meta['story:'+s.id]||{})},storyFields)>0).length;return heading('04 / PERSONAL WORKSHOP','故事與證據','把真實經歷整理成可核對、能說出口的回答。',`<div class="heading-stat"><strong>${started}<i> / 5</i></strong><span>故事已開始</span></div>`)+`<div class="personal-strip"><span class="personal-monogram">筆</span><div><strong>公開練習版 · 自行填寫</strong><p>練習主軸：可靠的臨床工作、清楚的研究判斷、能接受回饋。</p></div></div><div class="study-switch workshop-tabs" role="group" aria-label="工作坊內容">${[['stories','故事工作坊'],['evidence','履歷證據卡'],['sources','資料來源']].map(([id,label])=>`<button class="btn ${S.workshop===id?'active':''}" data-action="workshop-mode" data-value="${id}" aria-pressed="${S.workshop===id}">${label}</button>`).join('')}</div>${S.workshop==='stories'?storyWorkshop():S.workshop==='evidence'?evidenceWorkshop():courseSources()}`;}
function storyWorkshop(){const seed=D.storySeeds.find(x=>x.id===S.story),v=storyValue();return `<div class="two-col"><aside class="card topic-menu" aria-label="故事類型">${D.storySeeds.map((s,i)=>`<button class="topic-button ${s.id===S.story?'active':''}" data-action="story-select" data-value="${s.id}" ${s.id===S.story?'aria-current="true"':''}><span class="index">0${i+1}</span><span>${esc(s.title)}<small class="menu-note">${filled({...seedMeta('story:'+s.id),...(meta['story:'+s.id]||{})},storyFields.slice(1))} / 6 段已填</small></span></button>`).join('')}</aside><article class="card reading-card"><p class="eyebrow">STORY ${D.storySeeds.indexOf(seed)+1} / 5</p><h2>${esc(seed.title)}</h2><p class="lead">${esc(seed.cue)}</p><p class="learning-note">模板保持空白。請填入自己的真實情境、角色、行動與結果；不要將提示文字當作已發生的經歷。</p>${formFields(storyFields,v,'story')}<section class="quality-panel"><h3>挑選值得多練的故事</h3><p class="small">1 分表示還不清楚，5 分表示具體且能核對。這是自評提示，並非錄取分數。</p><div class="quality-grid">${qualityLabels.map((label,i)=>`<label>${esc(label)}<select class="select story-quality" data-index="${i}" aria-label="${esc(label)}自評">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${(v.quality?.[i]||0)===n?'selected':''}>${n?n+' 分':'尚未自評'}</option>`).join('')}</select></label>`).join('')}</div><p class="small">優先選擇細節明確、較近期、和職務有關、時間內說得完，且能清楚交代倫理與角色的故事。你可以重用同一經歷，調整回答重點。</p></section><div class="work-preview"><div class="preview-heading"><h3>我的口述提綱</h3><span class="small" id="story-count">${filled(v,storyFields.slice(1))} / 6 段已填</span></div><p class="small">依你填寫的內容組合，不會自動補寫經歷。</p><p class="preline" id="story-preview">${esc(storyOutline(v)||'填入上方欄位，這裡會整理成口述提綱。')}</p></div><label class="field-label" for="story-target">帶到哪一題練習？</label><select class="select" id="story-target">${D.interview.map(i=>`<option value="${i.id}" ${i.id===(S.storyTarget||seed.interviewIds[0])?'selected':''}>${esc(i.title)}</option>`).join('')}</select><div class="reading-actions">${btn('加入該題草稿並演練','send-story','','primary')}</div><p class="small" style="margin-top:12px">會附加到該題原有草稿後方。練習前，刪去與問題無關的細節。</p><div class="suggested-topics"><span class="small">這類經歷也適合練：</span>${seed.interviewIds.map(id=>btn(esc(D.interview.find(i=>i.id===id).title),'interview',id,'small subtle')).join('')}</div><details class="refs"><summary>練習依據</summary><p>使用自己的真實經歷，說清楚本人角色、督導與團隊貢獻。</p></details></article></div>`;}
function evidenceWorkshop(){const seed=D.evidenceSeeds.find(x=>x.id===S.evidence),v=evidenceValue();return `<div class="two-col"><aside class="card topic-menu" aria-label="證據卡類型">${D.evidenceSeeds.map((s,i)=>`<button class="topic-button ${s.id===S.evidence?'active':''}" data-action="evidence-select" data-value="${s.id}" ${s.id===S.evidence?'aria-current="true"':''}><span class="index">0${i+1}</span><span>${esc(s.title)}<small class="menu-note">${meta['evidence:'+s.id]?.confirmed?'已自行核對':'待填寫與核對'}</small></span></button>`).join('')}</aside><article class="card reading-card"><p class="eyebrow">EVIDENCE ${D.evidenceSeeds.indexOf(seed)+1} / ${D.evidenceSeeds.length}</p><h2>${esc(seed.title)}</h2><p class="lead">${esc(seed.cue)}</p><div class="notice"><strong>數字、狀態與角色先核對</strong>用正式稿或通知支持每項主張。草稿不預填論文接受狀態，也不將附件中的範例數字套到你的研究。</div>${formFields(evidenceFields,v,'evidence')}<label class="check-label verify-evidence"><input type="checkbox" id="evidence-confirmed" ${v.confirmed?'checked':''}><span>我已依所填的版本與日期，核對角色、結果與狀態。</span></label><p class="small" id="evidence-status">${v.confirmed?'這張卡已由你自行核對；修改文字後會回到待核對。':'尚未核對，送入演練時會標示「待核對」。'}</p><div class="work-preview"><h3>我的證據提綱</h3><p class="preline" id="evidence-preview">${esc(evidenceOutline(v)||'填入上方欄位後，這裡會整理你的研究或經歷證據。')}</p></div><div class="reading-actions">${btn('加入面試草稿並演練','send-evidence',seed.interviewId,'primary')}</div><p class="small" style="margin-top:12px">附加到「${esc(D.interview.find(i=>i.id===seed.interviewId).title)}」原有草稿；狀態以你的證據為準。</p></article></div>`;}
function courseSources(){return `<section class="card reading-card"><h2>公開版練習說明</h2><p class="lead">本版提供通用面試架構與空白故事、證據卡，未預填任何人的個人資料。</p><p>個人內容只留在目前頁面，離開前請匯出進度。公開網站不會自動接收你的草稿。</p><div class="reading-actions">${btn('練習反問老師','interview','ask-back','primary')}${btn('查看練習安排','tab','plan')}</div></section>`;}

function updateWorkshopInput(el){const kind=el.dataset?.workKind,key=el.dataset?.workField,fields=kind==='story'?storyFields:kind==='evidence'?evidenceFields:null;if(!fields||!fields.some(([k])=>k===key))return false;const id=kind==='story'?S.story:S.evidence;putMeta(kind+':'+id,{[key]:el.value,...(kind==='evidence'?{confirmed:false}:{})});if(kind==='story'){$('#story-preview').textContent=storyOutline(storyValue())||'填入上方欄位，這裡會整理成口述提綱。';$('#story-count').textContent=filled(storyValue(),storyFields.slice(1))+' / 6 段已填';}else{$('#evidence-preview').textContent=evidenceOutline(evidenceValue())||'填入上方欄位後，這裡會整理你的研究或經歷證據。';$('#evidence-confirmed').checked=false;$('#evidence-status').textContent='內容已更新，請重新核對角色、結果與狀態。';}return true;}
function appendToInterview(id,text,label){if(!text.trim()){toast('請先填入一段真實內容，再加入演練。');return;}const prior=entries['interview:'+id]||{draft:'',ratings:[false,false,false,false,false],practiced:false};const draft=[prior.draft,`【${label}】\n${text}`].filter(Boolean).join('\n\n');if(draft.length>12000){toast('合併後超過 12,000 字，請先縮短提綱或原有草稿。');return;}put('interview:'+id,{...prior,draft,ratings:[false,false,false,false,false],practiced:false});chooseInterview(id);toast('已附加到草稿。回答前先挑選與這題有關的內容。');}
function validateWorkshop(key,v,at){const isStory=key.startsWith('story:')&&D.storySeeds.some(s=>key==='story:'+s.id),isEvidence=key.startsWith('evidence:')&&D.evidenceSeeds.some(s=>key==='evidence:'+s.id);if(!isStory&&!isEvidence)return null;const fields=isStory?storyFields:evidenceFields;const out={at};for(const [k,,hint,max] of fields){if(v[k]!==undefined&&(typeof v[k]!=='string'||v[k].length>max))return null;out[k]=v[k]||'';}if(isStory){if(v.quality!==undefined&&(!Array.isArray(v.quality)||v.quality.length!==4||!v.quality.every(n=>Number.isInteger(n)&&n>=0&&n<=5)))return null;out.quality=v.quality||[0,0,0,0];}else out.confirmed=v.confirmed===true;return out;}

function plan(){return heading('05 / STUDY PLAN','每日計畫','八日練習安排 · 可依自己的班表與目標調整。',`<label class="check-label"><input type="checkbox" id="on-call" ${S.onCall?'checked':''}>今天值班</label>`)+`<div class="notice"><strong>${S.onCall?'值班日 · 20–30 分鐘':'一般日 · 90–120 分鐘'}</strong>${S.onCall?'先重練錯題，再做一題短版口述。剩餘項目留到有精神時補齊。':'依當天主題讀重點、閉卷練題，再安排一輪面試口述。'} 這是練習建議，並非官方要求。</div><div class="day-list">${D.plan.map((p,n)=>`<article class="card day-card ${p.date===day?'today':''} ${entries['day:'+p.date]?.done?'is-done':''}"><div class="day-date"><strong>第 ${n+1} 天</strong><span>建議練習</span>${p.date===day?'<span class="tag">今天</span>':''}</div><div class="day-content"><div class="day-topics">${p.topicIds.map(id=>`<button class="chip" data-action="learn-topic" data-value="${id}">${esc(shortTitle(id))}</button>`).join('')}</div>${list(S.onCall?p.goals.slice(0,1):p.goals)}${p.courseTask?`<div class="course-task"><strong>面試練習</strong><p>${esc(p.courseTask.text)}</p>${btn('開始這項練習','course-task',p.courseTask.target,'small subtle')}</div>`:''}${S.onCall?'<p class="small">最低量：先做上列重點，再挑一題面試口述。</p>':''}</div><label class="check-label day-done"><input type="checkbox" class="day-check" data-date="${p.date}" ${entries['day:'+p.date]?.done?'checked':''}>已完成</label></article>`).join('')}</div><div class="check-grid">${[['before','考前一天',D.dayBeforeChecklist],['exam','考試當天',D.examDayChecklist]].map(([key,title,items])=>`<section class="card card-pad"><h3>${title}</h3>${items.map((x,n)=>`<label class="check-label"><input type="checkbox" class="checklist" data-key="${key}:${n}" ${meta['checklist:'+key+':'+n]?.done?'checked':''}><span>${esc(x)}</span></label>`).join('')}</section>`).join('')}</div><div class="sources-card card"><h3>自行核對甄選通知</h3><p>報名期限、報到資訊與評分方式請以目標單位的正式公告為準。</p></div>`;}
function progress(){const st=stats(),review=D.questions.filter(q=>entries['q:'+q.id]&&(!entries['q:'+q.id].correct||meta['q:'+q.id]?.confidence===1));return heading('06 / LEARNING REVIEW','學習進度','用最近一次作答找出盲點。這些指標不代表考試成績或錄取機率。',btn('錯題再練','wrong','','primary'))+`<div class="metric-grid"><div class="card metric"><span>題庫完成</span><strong>${st.answered}<small> / ${D.questions.length}</small></strong><p>已作答題數</p><div class="bar"><span style="width:${st.answered/D.questions.length*100}%"></span></div></div><div class="card metric"><span>最近作答正確率</span><strong>${st.answered?Math.round(st.correct/st.answered*100)+'%':'—'}</strong><p>${st.answered?`${st.correct} 題答對 / ${st.answered} 題已答`:'完成第一題後開始計算'}</p></div><div class="card metric"><span>主題複習</span><strong>${st.topics}<small> / ${D.topics.length}</small></strong><p>由你標記完成</p><div class="bar"><span style="width:${st.topics/D.topics.length*100}%"></span></div></div><div class="card metric"><span>面試演練</span><strong>${st.interviews}<small> / ${D.interview.length}</small></strong><p>已完成的題組</p><div class="bar"><span style="width:${st.interviews/D.interview.length*100}%"></span></div></div></div><h2>下一輪，先練這些</h2><div class="review-list">${review.length?review.map(q=>{const m=meta['q:'+q.id]||{},r=entries['q:'+q.id];return `<article class="card review-item"><div><span class="tag">${esc(shortTitle(q.topicId))} · ${!r.correct?'待補強':'答對但不確定'}</span><p>${esc(q.stem)}</p><p class="note">${m.reason?'錯因：'+esc(m.reason)+'。 ':''}${m.note?esc(m.note):'先寫下一句提醒，再重新作答。'}</p></div>${btn('重練這題','practice-one',q.id,'small')}</article>`;}).join(''):`<div class="card empty"><h3>${st.answered?'目前沒有錯題或不確定題':'從第一輪練習開始'}</h3><p>${st.answered?'可以閉卷再做一輪，確認自己能說明理由。':'答錯或標記不確定的題目，會整理在這裡。'}</p>${btn('開始筆試練習','all','','primary')}</div>`}</div><h2 class="space-top">主題練習分布</h2><div class="card" style="overflow:hidden;margin-top:18px"><table class="progress-table"><thead><tr><th>主題</th><th>最近答對 / 題數</th><th>複習狀態</th></tr></thead><tbody>${D.topics.map(t=>{const qs=D.questions.filter(q=>q.topicId===t.id);return `<tr><td><button class="text-button" data-action="learn-topic" data-value="${t.id}">${esc(shortTitle(t.id))}</button></td><td>${qs.length?qs.filter(q=>entries['q:'+q.id]?.correct).length+' / '+qs.length:'口述複習'}</td><td>${entries['topic:'+t.id]?.done?'✓ 已複習':'尚未標記'}</td></tr>`;}).join('')}</tbody></table></div><section class="sources-card card"><h3>教材與使用範圍</h3>${btn('查看共筆整合範圍與來源','tab','notebook','small')}<p>${esc(D.notes.scope)}</p><p>${esc(D.notes.questionDisclaimer)} ${esc(D.notes.interviewDisclaimer)}</p><p>公開版面試與故事卡不預填個人經歷。</p>${refs(D.notes.sources)}</section>`;}

function orderedTopics(){return [...D.topics.filter(t=>t.chapter),...D.topics.filter(t=>!t.chapter)];}
function medicalReviewNote(r){return r?`<details class="refs"><summary>2026-10-10 查核補充與依據</summary><p>${esc(r.reason)}</p><ul>${r.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></li>`).join('')}</ul></details>`:'';}
function questionSource(q){return q.sourceId?`<div class="refs"><strong>共筆配套題 ${esc(q.sourceId)}</strong><p>${esc(q.source)} · 頁 ${esc(q.sourceRef)}</p><p>${q.safety?'急症與安全題 · ':''}${q.reserve?'進階保留題 · ':''}${esc(q.sourceType)}</p></div>`:'';}
function clinicalSource(i){return `<div class="learning-note"><strong>臨床口試 · 共筆情境</strong><p>${esc(i.source)} · 頁 ${esc(i.sourceRef)}</p><p>先口述你的判斷、急迫性與下一步，再展開參考回答。</p>${btn('回到這章重點','learn-topic',i.topicId,'small')}</div>`;}
function extensionList(ids){const ext=D.notebook.extensions||[];return ids?.length?`<section class="lesson-block"><h3>延伸來源</h3>${ids.map(id=>{const e=ext.find(x=>x.id===id);return e?`<p class="small"><strong>${esc(id)} · ${esc(e.title||e.name||'延伸參考')}</strong> ${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">開啟來源</a>`:''}${e.note?`<br>${esc(e.note)}`:''}</p>`:`<p class="small">${esc(id)} · 對照教材的延伸資料編號；請見答案與解析冊。</p>`;}).join('')}</section>`:'';}
function chapterExtras(t){if(!t.chapter)return '';return `<section class="lesson-block"><h3>容易混淆的比較</h3><div class="table-scroll"><table class="progress-table"><thead><tr><th>比較</th><th>核心差異</th><th>判讀提醒</th></tr></thead><tbody>${t.compare.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><section class="lesson-block"><h3>臨床口试 · 先回答再展開</h3>${t.cases.map((c,n)=>`<div class="case-block"><h3>${n+1}. ${esc(c.prompt)}</h3><p class="small">${esc(t.source)} · 頁 ${esc(c.ref)}</p><details class="model"><summary>查看參考回答</summary><div class="preline">${esc(c.answer)}</div></details>${btn('進入 90 秒口試','interview',t.id+'-case-'+(n+1),'small')}</div>`).join('')}</section>${chapterEnrichment(t)?'':`<section class="lesson-block"><h3>看圖判讀練習</h3><p class="small">${esc(D.notebook.imageScope)} <span>公開版未提供原 PDF 下載。</span></p>${t.images.map((c,n)=>`<details class="model"><summary>${n+1}. ${esc(c.prompt)}<br><span class="small">${esc(t.source)} · 頁 ${esc(c.ref)}</span></summary><div class="preline">${esc(c.answer)}</div></details>`).join('')}</section>`}${extensionList(t.ext)}${renderEnrichment(t)}`;}
function notebookIndex(){const out=[];for(const t of D.topics){const common={topicId:t.id,chapter:t.chapter||0};out.push({...common,type:'章節',title:t.title,body:t.summary,action:'learn-topic',target:t.id});t.sections.forEach((s,n)=>out.push({...common,type:'知識重點',title:s.title,body:s.points.join(' ')+' '+(s.recall||''),ref:s.ref,action:'learn-topic',target:t.id}));(t.compare||[]).forEach(x=>out.push({...common,type:'鑑別比較',title:x[0],body:x.slice(1).join(' '),action:'learn-topic',target:t.id}));(t.cases||[]).forEach((x,n)=>out.push({...common,type:'臨床口試',title:x.prompt,body:x.answer,ref:x.ref,action:'interview',target:t.id+'-case-'+(n+1)}));(t.images||[]).forEach(x=>out.push({...common,type:'看圖提示',title:x.prompt,body:x.answer,ref:x.ref,action:'learn-topic',target:t.id}));if(t.correction)out.push({...common,type:'勘誤',title:t.title+' · 勘誤',body:t.correction,action:'learn-topic',target:t.id});}for(const q of D.questions)out.push({type:'選擇題',title:q.stem,body:[...q.options,q.explanation].join(' '),topicId:q.topicId,chapter:D.topics.find(t=>t.id===q.topicId)?.chapter||0,ref:q.sourceRef,action:'practice-one',target:q.id});return [...out,...enrichmentIndex()];}

function notebookHero(){const st=stats(),started=Object.keys(entries).length>0,t=D.topics.find(x=>x.id===S.learn&&x.chapter)||D.topics.find(x=>x.chapter)||D.topics[0],qs=D.questions.filter(q=>q.topicId===t.id),done=qs.filter(q=>entries['q:'+q.id]).length;return `<h1 class="vh">章節教材</h1><section class="home-hero" aria-label="學習概況"><div class="hero-card"><p class="hero-kicker">${started?'繼續上次的位置':'從這裡開始'}</p><h2>${t.chapter?String(t.chapter).padStart(2,'0')+' ':''}${esc(t.title)}</h2><p class="hero-summary">${esc(t.summary)}</p><div class="hero-bar" role="img" aria-label="本章已答 ${done} / ${qs.length} 題"><span style="width:${qs.length?done/qs.length*100:0}%"></span></div><div class="hero-actions">${btn(started?'繼續閱讀':'開始閱讀','learn-topic',t.id,'hero-primary')}${qs.length?btn('做本章 '+qs.length+' 題','practice-topic',t.id,'hero-ghost'):''}</div></div><div class="hero-stats"><div class="stat-tile"><span>選擇題已練習</span><strong>${st.answered}<i> / ${D.questions.length}</i></strong></div><div class="stat-tile is-warn"><span>待補強</span><strong>${st.wrong}</strong></div><div class="stat-tile"><span>口試已演練</span><strong>${st.interviews}<i> / ${D.interview.length}</i></strong></div></div></section>`;}
function notebook(){const chapters=D.topics.filter(t=>t.chapter),text=S.search.trim(),tokens=text.toLocaleLowerCase().split(/\s+/).filter(Boolean),searching=tokens.length||S.searchChapter!=='all';const hits=searching?notebookIndex().filter(x=>(S.searchChapter==='all'||x.topicId===S.searchChapter)&&tokens.every(k=>(x.title+' '+x.body+' '+shortTitle(x.topicId)).toLocaleLowerCase().includes(k))):[];const nSections=chapters.reduce((a,t)=>a+t.sections.length,0),nQuestions=D.questions.filter(q=>q.sourceId).length,nCases=chapters.reduce((a,t)=>a+t.cases.length,0),answered=D.questions.filter(q=>q.sourceId&&entries['q:'+q.id]).length;return notebookHero()+`<section class="notebook-search" aria-label="搜尋教材"><label class="field-label" for="notebook-search">今天想找哪個概念？</label><div class="search-primary"><span class="search-symbol" aria-hidden="true">⌕</span><input class="select search-input" id="notebook-search" type="search" value="${esc(S.search)}" placeholder="搜尋知識、題目與解析，例如 RAPD 或白瞳" autocomplete="off">${btn('搜尋','notebook-search','','primary')}</div><div class="search-secondary"><label class="small" for="notebook-chapter">範圍</label><select class="select" id="notebook-chapter"><option value="all">全部章節與原有重點</option>${chapters.map(t=>`<option value="${t.id}" ${S.searchChapter===t.id?'selected':''}>${String(t.chapter).padStart(2,'0')} · ${esc(t.title)}</option>`).join('')}</select>${searching?btn('清除搜尋','notebook-reset','','small subtle'):''}<span class="small search-hint">多個詞以空格分隔</span></div></section>${searching?'':enrichmentOverview()}${searching?`<section class="search-section"><div class="section-heading"><h2>搜尋結果</h2><span class="small">${hits.length} 筆符合</span></div><div class="search-results">${hits.length?hits.map(x=>`<article class="search-result"><div class="result-meta"><span class="tag">${esc(x.type)}</span><span class="small">${esc(shortTitle(x.topicId))}${x.ref?' · 原教材頁 '+esc(x.ref):''}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.body.slice(0,190))}${x.body.length>190?'…':''}</p>${btn(x.type==='選擇題'?'開始這題':x.type==='臨床口試'?'進入口試':x.type==='共筆主題詳解'?'閱讀這個主題':'閱讀本章',x.action,x.target,'small')}</article>`).join(''):'<div class="empty"><h3>沒有符合的內容</h3><p>試試疾病中文名、英文縮寫，或減少一個關鍵詞。</p></div>'}</div></section>`:`<section class="chapter-index" aria-label="共筆章節索引"><div class="section-heading"><h2>${chapters.length} 章教材</h2><span class="small">${nSections} 個基礎重點 · ${nQuestions} 題 · ${nCases} 個臨床口試 · 已練習 ${answered} / ${nQuestions} 題</span></div><div class="chapter-list">${chapters.map(t=>{const qs=D.questions.filter(q=>q.topicId===t.id),done=qs.filter(q=>entries['q:'+q.id]).length;return `<article class="chapter-row"><div class="chapter-number">${String(t.chapter).padStart(2,'0')}</div><div class="chapter-copy"><h3><button class="chapter-title" data-action="learn-topic" data-value="${t.id}">${esc(t.title)}</button>${entries['topic:'+t.id]?.done?'<span class="chapter-done" aria-label="已複習">✓</span>':''}</h3><p>${esc(t.summary)}</p><div class="chapter-meta">${t.sections.length} 個基礎重點${chapterCoverage(t)?`<span>${chapterCoverage(t)?.entries.length} 個共筆詳解</span>`:''}<span>${qs.length} 題</span><span>${t.cases.length} 個口試</span></div></div><div class="chapter-progress"><span class="small">已答 ${done} / ${qs.length}</span><div class="bar"><span style="width:${done/qs.length*100}%"></span></div></div><div class="chapter-actions">${btn('練題','practice-topic',t.id,'small')}</div></article>`;}).join('')}</div></section>`}<section class="sources-card card notebook-sources"><details><summary>教材範圍、勘誤與來源</summary><div class="source-details"><p>${esc(D.notebook.scope)}</p><p>${esc(D.notebook.imageScope)}</p><p>${esc(D.notebook.originalCoverage)}</p><div class="actions"><span class="small">${esc(D.notebook.sourceTitle)}</span></div><p>原有 ${D.topics.filter(t=>!t.chapter).length} 個快速重點、${D.questions.filter(q=>!q.sourceId).length} 題與個人面試資料持續保留。題目皆為自編練習，非歷屆題。</p><details><summary>逐章內容與出處</summary><div class="table-scroll"><table class="progress-table"><thead><tr><th>章節／原共筆</th><th>重點</th><th>比較</th><th>題目</th><th>口試／看圖</th></tr></thead><tbody>${chapters.map(t=>`<tr><td>${esc(t.title)}<br><span class="small">${t.sourceUrl?`<a href="${esc(t.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(t.source)}</a>`:esc(t.source)}</span></td><td>${t.sections.length}</td><td>${t.compare.length}</td><td>${D.questions.filter(q=>q.topicId===t.id).length}</td><td>${t.cases.length} / ${t.images.length}</td></tr>`).join('')}</tbody></table></div></details>${D.notebook.reviewNote?`<p class="small">${esc(D.notebook.reviewNote)}</p>`:''}</div></details></section>`;}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='notebook-search'){e.preventDefault();S.search=e.target.value;S.searchChapter=$('#notebook-chapter').value;render();}});


const originalLineCache=new Map();
function originalLines(s){if(!originalLineCache.has(s.n))originalLineCache.set(s.n,s.text.split('\n'));return originalLineCache.get(s.n);}
function originalMatches(){const tokens=S.originalQuery.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);if(!tokens.length)return [];const result=[];for(const source of D.originals){if(S.originalScope!=='all'&&source.n!==Number(S.originalScope))continue;originalLines(source).forEach((line,n)=>{if(tokens.every(t=>line.toLocaleLowerCase().includes(t)))result.push({source,line:n+1,text:line});});}return result;}
function originals(){return heading('','原始共筆未公開','公開版提供整理後教材與自編練習，未收錄原始共筆全文、圖片或私人附件。')+`<section class="card empty"><h2>請使用公開版章節教材</h2><p>個人面試模板為空白架構，請依自己的真實經驗填寫。</p>${btn('回到章節教材','tab','notebook','primary')}</section>`;}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='original-search'){e.preventDefault();S.originalQuery=e.target.value;S.originalScope=$('#original-scope').value;S.originalResultPage=0;render();}});


function navMarkup(){const groups=[['閱讀',['notebook','learn']],['演練',['quiz','interview','workshop']],['安排與回顧',['plan','progress']]];return groups.map(([label,ids])=>`<section class="nav-group" aria-label="${label}"><p class="nav-group-label">${label}</p>${ids.map(key=>{const [id,icon,name]=navs.find(n=>n[0]===key);return `<button class="nav-button" data-action="tab" data-value="${id}" ${id===S.tab?'aria-current="page"':''}><span class="nav-symbol" aria-hidden="true">${icon}</span><span>${name}</span>${id==='quiz'?`<span class="nav-count" aria-hidden="true">${D.questions.length}</span>`:id==='interview'?`<span class="nav-count" aria-hidden="true">${D.interview.length}</span>`:''}</button>`;}).join('')}</section>`).join('');}

/* enrichment-ui:start */
function chapterEnrichment(t){return D.enrichment?.chapters?.[t.id]||null;}
function chapterCoverage(t){return D.coverage?.chapters?.[t.id]||null;}
function coveragePageLabel(pages){const sorted=[...new Set(pages)].sort((a,b)=>a-b),ranges=[];for(let i=0;i<sorted.length;i++){const first=sorted[i];let last=first;while(sorted[i+1]===last+1)last=sorted[++i];ranges.push(first===last?String(first):first+'–'+last);}return ranges.join('、');}
function coverageLink(t,label,target,css=''){return `<a class="${esc(css)}" href="#${t.id}-${esc(target)}" data-action="coverage-focus" data-value="${t.id}|${esc(target)}">${esc(label)}</a>`;}
function coverageTarget(t,target){const c=chapterCoverage(t);if(!c)return false;if(target==='coverage')return true;if(target.startsWith('coverage-'))return c.entries.some(entry=>target==='coverage-'+entry.id);if(/^section-\d+$/.test(target))return Number(target.slice(8))<t.sections.length;return chapterEnrichment(t)?.integrated?.units.some(unit=>unit.id===target)||false;}
function coverageFocus(value,updateHash=true){
  const [tid,target]=value.split('|'),t=D.topics.find(topic=>topic.id===tid);
  if(!t||!coverageTarget(t,target))return false;
  if(S.tab!=='learn'||S.learn!==tid){S.learn=tid;switchTab('learn');}
  const anchor=tid+'-'+target,node=document.getElementById(anchor);
  if(!node)return false;
  for(let parent=node;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;
  const focus=node.tagName==='DETAILS'?node.querySelector('summary'):node;
  if(focus){focus.setAttribute('tabindex','-1');focus.focus({preventScroll:true});}
  node.scrollIntoView({block:'start'});
  if(updateHash&&window.history?.replaceState)window.history.replaceState(null,'','#'+anchor);
  return true;
}
function coverageRestoreHash(){const match=(window.location?.hash||'').match(/^#(notes-\d{2})-(coverage(?:-[a-z][a-z0-9-]*)?|section-\d+|u[1-3])$/);if(match)coverageFocus(match[1]+'|'+match[2],false);}
function coverageEntry(t,entry,c){
  const unit=c.integrated.units.find(unit=>unit.id===entry.unitId);
  const teaching=`${entry.keyPoints.map(paragraph=>`<p>${esc(paragraph)}</p>`).join('')}<div class="coverage-clinical"><p><strong>放進臨床判斷</strong>${esc(entry.clinicalLink)}</p><p><strong>容易漏掉的差別</strong>${esc(entry.pitfall)}</p></div>`;
  const answer=`<details class="coverage-answer"><summary>${S.recall?'回想後，查看解析與參考回答':'回答後，查看參考回答'}</summary><div>${S.recall?teaching:''}<p class="coverage-recall-answer">${esc(entry.recall.answer)}</p>${enrichmentSourceLinks(entry,c)}</div></details>`;
  return `<details class="coverage-entry" id="${t.id}-coverage-${entry.id}"><summary><span>${esc(entry.title)}</span><span class="coverage-pages">PDF 頁 ${coveragePageLabel(entry.pages)}</span></summary><div class="coverage-entry-body"><p class="coverage-source">${esc(chapterCoverage(t).sourceFile)} · PDF 頁 ${coveragePageLabel(entry.pages)}</p><p class="coverage-terms">${entry.terms.map(esc).join(' · ')}</p>${S.recall?'':teaching}<p class="coverage-question"><strong>換你整合</strong>${esc(entry.recall.question)}</p>${answer}<nav class="coverage-backlinks" aria-label="${esc(entry.title)}的相關內容">${coverageLink(t,'回到單元：'+unit.title,entry.unitId)}${entry.sectionIndexes.map(i=>coverageLink(t,'基礎重點：'+t.sections[i].title,'section-'+i)).join('')}${coverageLink(t,'查看全章共筆對照','coverage')}</nav>${entry.relatedTopics.length?`<div class="coverage-related"><span>一起複習</span>${entry.relatedTopics.map(id=>btn(shortTitle(id),'learn-topic',id,'small')).join('')}</div>`:''}</div></details>`;
}
function coverageUnit(t,c,unit){const entries=(chapterCoverage(t)?.entries||[]).filter(entry=>entry.unitId===unit.id);return entries.length?`<section class="coverage-unit" aria-label="本單元共筆主題詳解"><div class="coverage-unit-heading"><h4>把共筆細節放回這個單元</h4><span>${entries.length} 個主題</span></div><p class="small">從原共筆頁面逐項整理，串連機轉、臨床意義與容易混淆的地方。</p>${entries.map(entry=>coverageEntry(t,entry,c)).join('')}</section>`:'';}
function coverageAudit(chapter){const names={teaching:'教學內容',exam:'題目概念',administrative:'編務或重複頁'},limitations=chapter.sourceLimitations||[];return `${limitations.length?`<section class="coverage-limitations" aria-label="原共筆的內容限制"><h4>原檔限制與本版處理</h4>${limitations.map(item=>`<div><p><strong>PDF 頁 ${coveragePageLabel(item.pages)}</strong>${esc(item.reason)}</p><p>${esc(item.handling)}</p></div>`).join('')}</section>`:''}<details class="coverage-audit"><summary>頁面核對紀錄</summary><p class="small">頁碼採 PDF 檔案的頁面順序；每頁只歸入一類。題目以概念重述。</p><ul>${chapter.reviewedPages.map(span=>`<li><span>頁 ${span.from===span.to?span.from:span.from+'–'+span.to} · ${names[span.kind]}</span><p>${esc(span.note)}</p></li>`).join('')}</ul></details>`;}
function coverageEntryOutline(t,chapter){const course=chapterEnrichment(t).integrated;return course.units.map(unit=>{const entries=chapter.entries.filter(entry=>entry.unitId===unit.id);return entries.length?`<div class="coverage-outline-unit"><h4>${coverageLink(t,'單元：'+unit.title,unit.id)}</h4><ul>${entries.map(entry=>`<li>${coverageLink(t,entry.title,'coverage-'+entry.id)}<span>頁 ${coveragePageLabel(entry.pages)}</span></li>`).join('')}</ul></div>`:'';}).join('');}
function coverageOutline(t){const chapter=chapterCoverage(t);if(!chapter)return '';return `<details class="coverage-outline" id="${t.id}-coverage"><summary><span>本章共筆對照</span><span>${chapter.entries.length} 個主題 · 核對 ${chapter.pageCount} 頁</span></summary><div><p class="coverage-scope">逐頁核對主題；教學重述，非原文全文或官方考綱。</p><p class="small">${esc(chapter.sourceFile)} · 查核 ${esc(D.coverage.reviewedDate)}。點選主題可直接打開對應詳解。</p>${coverageEntryOutline(t,chapter)}${coverageAudit(chapter)}</div></details>`;}
function coverageOverview(){
  const chapters=D.topics.filter(t=>chapterCoverage(t));if(!chapters.length)return '';
  const count=chapters.reduce((n,t)=>n+chapterCoverage(t).entries.length,0),pages=chapters.reduce((n,t)=>n+chapterCoverage(t).pageCount,0);
  return `<section class="coverage-overview" aria-label="原共筆主題對照"><div class="coverage-overview-heading"><h2>從共筆找到每個主題的位置</h2><p>${chapters.length} 章 · 核對 ${pages} 頁 · ${count} 個主題詳解</p></div><p class="coverage-scope">${esc(D.coverage.scopeNote)}</p><details class="coverage-all"><summary>展開全冊共筆對照</summary><p class="small">依章節與學習單元排列。選擇主題，直接前往詳解；各章保留頁面核對紀錄。</p>${chapters.map(t=>{const chapter=chapterCoverage(t);return `<details class="coverage-all-chapter"><summary><span>${esc(t.title)}</span><span>${chapter.entries.length} 個主題 · ${chapter.pageCount} 頁</span></summary><div>${coverageEntryOutline(t,chapter)}<p>${coverageLink(t,'查看本章頁面核對紀錄','coverage')}</p></div></details>`;}).join('')}</details></section>`;
}
function enrichmentSourceLinks(item,chapter){const ids=new Set(item.sourceIds||[]),sources=(chapter.resources||[]).filter(r=>ids.has(r.id));return sources.length?`<div class="enrichment-citations"><span>依據</span>${sources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`).join('')}</div>`:'';}
function enrichmentResourceItems(resources){return `<ul>${resources.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a><span class="enrichment-provider">${esc(r.kind)} · ${esc(r.provider)}</span><p>${esc(r.note)}</p></li>`).join('')}</ul>`;}
function enrichmentContextSources(item,c){const ids=new Set(item.sourceIds||[]),resources=c.resources.filter(r=>ids.has(r.id));return resources.length?`<details class="enrichment-context-sources"><summary>搭配圖譜、影片與文獻理解本單元</summary><div class="enrichment-resource-group">${enrichmentResourceItems(resources)}</div></details>`:'';}
function enrichmentNav(t){const c=chapterEnrichment(t);if(!c)return '';if(c.integrated)return `<nav class="enrichment-nav" aria-label="本章學習路徑"><span>本章路徑</span>${chapterCoverage(t)?coverageLink(t,'共筆對照（'+chapterCoverage(t).entries.length+' 主題）','coverage'):''}${c.integrated.units.map((u,n)=>`<a href="#${t.id}-${u.id}">${n+1}. ${esc(u.title)}</a>`).join('')}<a href="#${t.id}-case">整合病例</a><a href="#${t.id}-connections">跨章串連</a><a href="#${t.id}-resources">延伸資源</a></nav>`;return `<nav class="enrichment-nav" aria-label="本章延伸學習"><span>延伸學習</span><a href="#${t.id}-figure">圖解</a><a href="#${t.id}-deep">深入理解</a><a href="#${t.id}-challenge">口述挑戰</a><a href="#${t.id}-resources">延伸資源</a></nav>`;}
function enrichmentFigure(t,c){const f=c.figure,src='assets/figures/'+t.id+'.svg';return `<figure class="enrichment-figure" id="${t.id}-figure"><img class="enrichment-image" src="${esc(src)}" alt="${esc(f.alt)}" width="960" height="560" loading="lazy" decoding="async"><p class="enrichment-image-fallback" hidden>圖解暫時無法顯示，請先閱讀下方圖說與延伸資料。</p><figcaption><div class="enrichment-figure-heading"><strong>${esc(f.title)}</strong><a href="${esc(src)}" target="_blank" rel="noopener noreferrer">放大圖解</a></div><p>${esc(f.caption)}</p><p class="small">概念示意圖，非實際臨床影像。</p>${enrichmentSourceLinks(f,c)}</figcaption></figure>`;}
function enrichmentDeepDive(b,c){return `<details class="enrichment-detail"><summary>${esc(b.heading)}</summary><div>${b.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${enrichmentSourceLinks(b,c)}</div></details>`;}
function enrichmentChallenge(t,c){return `<section class="enrichment-challenge" id="${t.id}-challenge"><h3>口述挑戰</h3><p>${esc(c.oralChallenge.question)}</p><details class="enrichment-detail"><summary>回答後，查看重點</summary><div><p class="preline">${esc(c.oralChallenge.answer)}</p>${enrichmentSourceLinks(c.oralChallenge,c)}</div></details></section>`;}

function enrichmentIndex(){
  const out=[];
  for(const t of D.topics){
    const c=chapterEnrichment(t);
    if(!c)continue;
    const common={topicId:t.id,chapter:t.chapter,action:'learn-topic',target:t.id};
    for(const entry of chapterCoverage(t)?.entries||[])out.push({...common,type:'共筆主題詳解',title:entry.title,body:[...entry.terms,...entry.keyPoints,entry.clinicalLink,entry.pitfall,entry.recall.question,entry.recall.answer].join(' '),ref:coveragePageLabel(entry.pages),action:'coverage-focus',target:t.id+'|coverage-'+entry.id});
    out.push({...common,type:'圖解',title:c.figure.title,body:c.figure.caption+' '+c.figure.alt});
    for(const b of c.deepDive)out.push({...common,type:'深入理解',title:b.heading,body:b.paragraphs.join(' ')});
    out.push({...common,type:'口述挑戰',title:c.oralChallenge.question,body:c.oralChallenge.answer});
    for(const r of c.resources)out.push({...common,type:'延伸資源',title:r.title,body:r.provider+' '+r.kind+' '+r.note});
    if(c.integrated){
      const integrated=c.integrated;
      out.push({...common,type:'學習目標',title:t.title,body:integrated.framing+' '+integrated.objectives.join(' ')});
      for(const u of integrated.units)out.push({...common,type:'整合單元',title:u.title,body:[...u.synthesis,...u.decisions.flatMap(d=>[d.finding,d.interpretation,d.nextStep])].join(' ')});
      for(const step of integrated.case.steps)out.push({...common,type:'整合病例',title:integrated.case.title+' · '+step.prompt,body:[integrated.case.stem,step.newInfo,step.answer,step.rationale].join(' ')});
      for(const link of integrated.connections)out.push({...common,type:'跨章串連',title:t.title+' / '+shortTitle(link.topicId),body:link.reason});
    }
  }
  for(const path of D.enrichment?.learningPaths||[]){
    const target=path.topicIds[0],topic=D.topics.find(t=>t.id===target);
    out.push({topicId:target,chapter:topic?.chapter||0,action:'learn-topic',target,type:'學習路徑',title:path.title,body:path.question+' '+path.topicIds.map(shortTitle).join(' ')});
  }
  return out;
}

function validDate(v){return typeof v==='string'&&Number.isFinite(Date.parse(v))?v:'1970-01-01T00:00:00.000Z';}
function validateEntry(key,v){if(!v||typeof v!=='object'||Array.isArray(v))return null;const at=validDate(v.at);if(key.startsWith('q:')){const q=D.questions.find(q=>q.id===key.slice(2));return q&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice<q.options.length?{choice:v.choice,correct:v.choice===q.correctIndex,at}:null;}if((key.startsWith('topic:')&&D.topics.some(t=>t.id===key.slice(6)))||(key.startsWith('day:')&&D.plan.some(p=>p.date===key.slice(4))))return typeof v.done==='boolean'?{done:v.done,at}:null;if(key.startsWith('interview:')&&D.interview.some(i=>i.id===key.slice(10))&&typeof v.draft==='string'&&v.draft.length<=12000&&Array.isArray(v.ratings)&&v.ratings.length===5&&v.ratings.every(x=>typeof x==='boolean')&&typeof v.practiced==='boolean')return {draft:v.draft,ratings:v.ratings,practiced:v.practiced,at};return null;}
function validateMeta(key,v){if(!v||typeof v!=='object'||Array.isArray(v))return null;const work=validateWorkshop(key,v,validDate(v.at));if(work)return work;const at=validDate(v.at),text=(s,max)=>typeof s==='string'?s.slice(0,max):'';if(key.startsWith('q:')&&D.questions.some(q=>q.id===key.slice(2)))return {at,confidence:[0,1,2,3].includes(v.confidence)?v.confidence:0,note:text(v.note,2000),reason:text(v.reason,60)};if(key.startsWith('interview:')&&D.interview.some(i=>i.id===key.slice(10)))return {at,note:text(v.note,2000)};if(key.startsWith('followup:')&&D.interview.some(i=>i.followups.some((_,n)=>key==='followup:'+i.id+':'+n)))return {at,note:text(v.note,3000)};if(key.startsWith('recall:')&&D.topics.some(t=>t.sections.some((_,n)=>key==='recall:'+t.id+':'+n))&&typeof v.mastered==='boolean')return {at,mastered:v.mastered};if(key.startsWith('checklist:')&&[['before',D.dayBeforeChecklist],['exam',D.examDayChecklist]].some(([name,items])=>items.some((_,n)=>key==='checklist:'+name+':'+n))&&typeof v.done==='boolean')return {at,done:v.done};return null;}
function mergeProgress(payload){if(!payload||!['ophthalmology-prep-progress-v1','ophthalmology-prep-progress-v2','ophthalmology-prep-progress-v3'].includes(payload.format)||!payload.entries||typeof payload.entries!=='object'||Array.isArray(payload.entries))throw Error('請選擇本 App 匯出的進度 JSON 檔。');let count=0,skipped=0;for(const [key,v] of Object.entries(payload.entries)){const value=validateEntry(key,v);if(value){if(!entries[key]||Date.parse(value.at)>=Date.parse(entries[key].at)){entries[key]=value;count++;}}else skipped++;}if(payload.meta&&typeof payload.meta==='object'&&!Array.isArray(payload.meta))for(const [key,v] of Object.entries(payload.meta)){const value=validateMeta(key,v);if(value){if(!meta[key]||Date.parse(value.at)>=Date.parse(meta[key].at)){meta[key]=value;count++;}}else skipped++;}S.round=Object.create(null);S.selected=null;S.confidence=0;changed();render();return {count,skipped};}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('檔案過大，請使用本 App 匯出的進度檔。');const payload=JSON.parse(await file.text());if((Object.keys(entries).length||Object.keys(meta).length)&&!window.confirm('將合併進度；同一項目保留時間較新的版本。繼續？'))return;const result=mergeProgress(payload);toast(`已合併 ${result.count} 筆記錄${result.skipped?'，略過 '+result.skipped+' 筆無效資料':''}。`);}catch(e){toast(e instanceof SyntaxError?'無法讀取 JSON，請確認選擇的是進度檔。':e.message);}finally{e.target.value='';}});
render();
})();
</script>
</body></html>
