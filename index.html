: "老花矯正：近用加光、漸進與單眼視", "pages": [35, 36, 47], "unitId": "u1", "sectionIndexes": [6, 9], "terms": ["Presbyopia", "Near addition", "Progressive lens", "Monovision"], "keyPoints": ["老花是可用調節下降，近用加光需依工作距離、原處方與可持續調節決定，不按年齡固定加 +1、+2 或 +3 D。雙焦與漸進鏡將不同位置提供不同近用屈光力。", "漸進鏡有中近距離走廊與周邊像差區，需正確定位與適應。Monovision 讓兩眼分擔遠近，可能犧牲立體視或對比；多焦接觸鏡及 IOL 則有其他光學取捨。"], "clinicalLink": "手術式遠近分工前，可用可逆驗配了解耐受度。", "pitfall": "多焦點不是恢復年輕晶狀體的天然調節，也不保證完全免眼鏡。", "recall": {"question": "近用加光的主要依據只有年齡嗎？", "answer": "不是，還有工作距離、原屈光狀態、調節與雙眼需求。"}, "relatedTopics": ["notes-06", "notes-04"], "sourceIds": ["an02-clinical", "an02-nei"]}, {"id": "c30", "title": "眼鏡材料：折射率、重量與抗衝擊", "pages": [37, 47], "unitId": "u2", "sectionIndexes": [9], "terms": ["Crown glass", "Plastic lens", "Polycarbonate", "Trivex", "Abbe value"], "keyPoints": ["玻璃、樹脂、polycarbonate 與 Trivex 在折射率、色散、密度與抗衝擊上各有取捨。高折射率常可減少高度數鏡片厚度，但色差、重量與設計仍需一併考慮。", "Abbe 值描述色散程度，數值較高通常色差較小。Polycarbonate 與 Trivex 常用於重視抗衝擊的情境；防 UV 能力應看產品規格，不能由鏡片看起來深或厚推斷。"], "clinicalLink": "兒童與活動性高者須同時考慮安全、光學品質及鏡框配合。", "pitfall": "「塑膠都很厚、某一種永遠最清楚」過度概括材料差異。", "recall": {"question": "鏡片越薄是否一定越清楚？", "answer": "不一定；色散、表面設計、製造與配戴位置都會影響。"}, "relatedTopics": ["notes-11"], "sourceIds": ["cov02-optics"]}, {"id": "c31", "title": "鍍膜、染色、變色與偏光的不同目的", "pages": [37, 38, 39], "unitId": "u2", "sectionIndexes": [9], "terms": ["Anti-reflection coating", "Hydrophobic coating", "Photochromic", "Polarized lens"], "keyPoints": ["抗刮膜提高表面耐磨但不代表不會刮；疏水膜利於排水與清潔。抗反射膜利用薄膜干涉減少特定反射，四分之一波長概念指光學厚度，實際多層設計涵蓋較廣光譜。", "染色改變透光率與色彩，變色鏡隨照射條件改變吸收，材料可用不同化學機制，不全是銀鹽。偏光鏡可減少水平表面反射眩光，但本身不等於 UV 保護。"], "clinicalLink": "選鏡片功能要對應戶外眩光、清潔或反射問題，而非把所有鍍膜視為同一效果。", "pitfall": "黃色鏡片並不保證夜間駕駛更安全；任何染色都可能減少入眼光。", "recall": {"question": "偏光與抗反射膜是否同一功能？", "answer": "不是；前者選擇偏振方向，後者減少鏡片表面反射。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov02-optics"]}, {"id": "c32", "title": "藍光鏡片：修正來源中的保護宣稱", "pages": [38, 39], "unitId": "u2", "sectionIndexes": [9], "terms": ["Blue-light filtering", "Digital eye strain", "UV protection"], "keyPoints": ["藍光濾鏡可透過反射或吸收減少部分短波可見光，但不能由此推論可防止螢幕造成視網膜傷害。AAO 指出一般數位裝置光線傷眼的證據不足，也不建議以特殊藍光鏡片作必要電腦保護。", "長時間看螢幕的不適應評估眨眼減少、乾眼、工作距離與屈光問題。戶外 UV 保護則是另一個問題，需選具適當 UV 規格的鏡片，不能以鏡片黃不黃判断。"], "clinicalLink": "把實際症狀與使用習慣連起來，避免以商品宣稱代替診斷。", "pitfall": "原共筆「藍光膜避免視網膜傷害」不作現行臨床結論。", "recall": {"question": "藍光濾鏡能證明預防數位眼疲勞嗎？", "answer": "目前不足以作此保證；先處理眼表、屈光與用眼條件。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov02-blue"]}, {"id": "c33", "title": "接觸鏡材料與 Dk／t：透氧不等於舒適", "pages": [32, 40, 41, 47], "unitId": "u3", "sectionIndexes": [10], "terms": ["PMMA", "RGP", "Hydrogel", "Silicone hydrogel", "Hybrid", "Dk／t"], "keyPoints": ["PMMA 硬鏡本身透氧差；RGP 是透氣硬鏡。水膠軟鏡透氧與含水量相關，矽水膠加入矽成分提高透氧；混合鏡 hybrid 結合硬中心與軟周邊，但仍需合適驗配。", "Dk 是材料氧滲透性，Dk/t 或 Dk/L 納入厚度後描述氧傳導性。鏡片厚薄分布取決於度數及設計，不能說高度近視鏡片處處最厚；舒適度還受潤濕、表面、配戴及眼表影響。"], "clinicalLink": "不要用「硬式一定比軟式透氧且好保養」取代具體產品與個人評估。", "pitfall": "高透氧不會消除過夜感染風險。", "recall": {"question": "Dk 與 Dk/t 差在哪？", "answer": "前者是材料性質，後者還考慮鏡片厚度。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["cov02-contacts"]}, {"id": "c34", "title": "Tear lens：硬式鏡片如何補角膜不規則", "pages": [34, 40], "unitId": "u3", "sectionIndexes": [10], "terms": ["Tear lens", "Rigid contact lens", "Corneal irregularity", "Over-refraction"], "keyPoints": ["硬式鏡片後表面與角膜之間的淚液可形成 tear lens，提供額外屈光作用。平滑的鏡片前表面與淚液填補可減輕部分角膜不規則造成的成像問題。", "改變鏡片後曲率不只影響配適，也改變淚液透鏡的度數。驗配需觀察螢光分布、活動度、對中與戴鏡後 over-refraction，而非只照眼鏡度數購買。"], "clinicalLink": "對圓錐角膜或其他不規則角膜，以可得視力與角膜健康共同評估。", "pitfall": "軟鏡較貼合角膜，通常不能提供相同程度的不規則表面遮蔽。", "recall": {"question": "更改 RGP 基弧後為何可能要改鏡片度數？", "answer": "因鏡片—角膜間淚液透鏡的屈光作用也改變。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov02-contacts"]}, {"id": "c35", "title": "Ortho-K：暫時角膜重塑與近視控制", "pages": [32, 40, 41], "unitId": "u3", "sectionIndexes": [10], "terms": ["Orthokeratology", "Reverse geometry", "Base curve", "Peripheral curve"], "keyPoints": ["角膜塑型以反幾何硬式鏡片改變角膜上皮分布與前表面形態；基弧、反轉區與周邊配適區共同影響中心定位及淚液分布，不是單純把角膜永久壓薄。", "停戴後屈光效果會逐漸回復；部分兒童可減緩眼軸增長，但需專業驗配與持續追蹤。夜戴仍有角膜破皮、感染、缺氧與偏心風險，不能用固定時數保證安全或效果。"], "clinicalLink": "白天裸視改善與眼軸控制是兩個不同追蹤目標。", "pitfall": "近視度數暫時變少不代表原有長眼軸風險消失。", "recall": {"question": "Ortho-K 停戴後效果通常永久保留嗎？", "answer": "通常會逐漸回復，需與永久組織切削手術區分。"}, "relatedTopics": ["notes-04", "notes-05", "notes-10"], "sourceIds": ["cov02-contacts"]}, {"id": "c36", "title": "接觸鏡配戴方式、感染與缺氧警訊", "pages": [40, 41, 47], "unitId": "u3", "sectionIndexes": [10], "terms": ["Daily wear", "Extended wear", "Acanthamoeba", "Corneal neovascularization"], "keyPoints": ["日戴表示清醒時配戴，長戴表示某些產品核准的過夜方式；拋棄頻率是另一維度，不能把日拋與日戴混為同義。即使核准過夜也不是無感染風險。", "接觸水可增加包括棘阿米巴在內的感染風險；缺氧可有角膜水腫、周邊新生血管或上皮問題。紅眼伴疼痛、畏光、視力下降應停止配戴並及時眼科評估。"], "clinicalLink": "清潔、消毒、替換與避免水接觸須依產品和專業指導落實。", "pitfall": "不能靠鏡片高含水或高 Dk 來保證長時間安全。", "recall": {"question": "戴接觸鏡後痛紅又模糊，應先繼續適應嗎？", "answer": "不要繼續配戴，及時評估角膜感染或其他傷害。"}, "relatedTopics": ["notes-05", "notes-12", "notes-14"], "sourceIds": ["cov02-contacts"]}, {"id": "c37", "title": "RK 與 ALK：歷史術式仍影響今天的檢查", "pages": [42, 48, 50], "unitId": "u3", "sectionIndexes": [10], "terms": ["Radial keratotomy", "RK", "Automated lamellar keratomileusis", "ALK"], "keyPoints": ["RK 以放射狀角膜切口改變力學，使中央變平；它不是雷射切削。舊術後眼可有屈光波動、遠視漂移、不規則散光及結構弱點，仍會出現在今天的門診。", "ALK 以機械層狀角膜切削改變形態，是早期屈光術式的一部分；共筆名稱常見為 automated lamellar keratomileusis。了解組織改變比背現在是否仍常用更有價值。"], "clinicalLink": "白內障術前辨識舊角膜手術史，影響 K 值與 IOL 計算。", "pitfall": "不要把 RK 稱為早期近視雷射，也不要假定任何地方已完全不做。", "recall": {"question": "曾做 RK 為何仍需告知白內障醫師？", "answer": "其角膜形態與屈光波動會影響量測及術後屈光預測。"}, "relatedTopics": ["notes-06"], "sourceIds": ["an02-lasik-risk", "cov02-optics"]}, {"id": "c38", "title": "PRK、LASEK、Epi-LASIK：表面處理的差別", "pages": [43, 44, 48, 50], "unitId": "u3", "sectionIndexes": [10], "terms": ["PRK", "LASEK", "Epi-LASIK", "Haze"], "keyPoints": ["PRK 移除角膜上皮後以 excimer 切削；LASEK 利用酒精協助上皮分離，Epi-LASIK 以機械方式處理上皮。它們的表面組織步驟不同，不等同 LASIK 的基質角膜瓣。", "表面癒合期間可有疼痛、視力恢復較慢、感染或 haze。是否使用抗纖維化輔助處理依風險與專業判斷，不能讓學習者自行套藥或認為無瓣就沒有擴張風險。"], "clinicalLink": "用「上皮如何處理、切削在哪裡、如何癒合」比較術式。", "pitfall": "Epi-LASIK 不是簡單以「比 LASEK 更淺」定義。", "recall": {"question": "PRK 會製作 LASIK 式基質瓣嗎？", "answer": "不會；它屬表面切削。"}, "relatedTopics": ["notes-05"], "sourceIds": ["an02-lasik-risk", "cov02-laser"]}, {"id": "c39", "title": "LASIK：角膜瓣、界面與乾眼的機轉", "pages": [43, 48, 50], "unitId": "u3", "sectionIndexes": [10], "terms": ["LASIK", "Corneal flap", "Buttonhole", "Striae", "Epithelial ingrowth"], "keyPoints": ["LASIK 先以微型角膜刀或飛秒雷射製瓣，再在下方基質 excimer 切削。瓣可有不完整切割或 buttonhole，復位後也可能有皺摺 striae 或偏移。", "界面可出現上皮長入、感染或非感染炎症；角膜神經受影響亦可造成乾眼。較快視力恢復不是保證無後續問題，長期需注意角膜擴張與視覺品質。"], "clinicalLink": "術後突發不適先定位眼表、瓣、界面或其他眼內原因。", "pitfall": "不能把術後所有乾澀或模糊都當正常適應期。", "recall": {"question": "LASIK 與 SMILE 在角膜瓣上有何差別？", "answer": "LASIK 有基質瓣，SMILE 經小切口取出透鏡而無相同大瓣。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["an02-lasik-risk"]}, {"id": "c40", "title": "SMILE：無大角膜瓣不等於零風險", "pages": [44, 48, 50], "unitId": "u3", "sectionIndexes": [10], "terms": ["SMILE", "Lenticule extraction", "Femtosecond laser", "Postoperative dry eye"], "keyPoints": ["SMILE 以飛秒雷射在基質內製作透鏡 lenticule，再經小切口分離取出，通常不需 excimer 切削。它避免 LASIK 式大角膜瓣，因此不存在完全相同的瓣相關問題。", "角膜仍受切割與神經影響，仍可能乾眼、發炎、感染、透鏡分離問題或視覺症狀。比較研究可顯示某些指標較快恢復，但不能轉成每位患者「不痛、不乾眼」的保證。"], "clinicalLink": "術式選擇仍先評估眼表、角膜厚度與形態、穩定度及預期。", "pitfall": "原共筆「基質深處不含神經、術後不會乾眼」不正確。", "recall": {"question": "SMILE 使用飛秒與 excimer 兩種雷射嗎？", "answer": "典型 SMILE 以飛秒製作透鏡並取出，不依賴 excimer 切削。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["cov02-smile"]}, {"id": "c41", "title": "Phakic IOL 與晶狀體置換的差異", "pages": [44, 48], "unitId": "u3", "sectionIndexes": [11], "terms": ["Phakic IOL", "Anterior chamber IOL", "Posterior chamber phakic lens"], "keyPoints": ["Phakic IOL 在保留天然晶狀體的眼內加入矯正鏡片；與摘除白內障後的人工晶狀體不同。鏡片可位於前房或虹膜後、天然晶狀體前的位置，依設計有不同評估。", "需考慮前房空間、內皮、眼壓、瞳孔與天然晶狀體；可能有內皮損失、瞳孔阻滯、白內障或其他眼內手術併發症。可取出不代表所有後果都可逆。"], "clinicalLink": "高度數不適合角膜切削時也不能跳過完整眼內安全評估。", "pitfall": "不要將 phakic IOL 與一般白內障 IOL 混為同一植入情境。", "recall": {"question": "Phakic 的關鍵意思是什麼？", "answer": "天然晶狀體仍存在。"}, "relatedTopics": ["notes-06", "notes-07"], "sourceIds": ["an02-lasik-risk", "cov02-optics"]}, {"id": "c42", "title": "從術前眼表到術後量測：整合屈光手術風險", "pages": [45, 48, 50], "unitId": "u3", "sectionIndexes": [10, 11], "terms": ["Refractive stability", "Corneal ectasia", "Postoperative IOP", "Night vision"], "keyPoints": ["手術前確認屈光是否穩定、角膜形態與厚度、眼表、暗處瞳孔及後節共病；若量測不穩，先找原因。期待包含夜間品質、老花與仍可能戴鏡，而非只追求裸視數字。", "角膜切削後，眼壓讀值可受厚度及生物力學改變影響。追蹤應交代手術史，並看視神經與視野；不把共筆考古的固定下降數值套用每個人。"], "clinicalLink": "將視力矯正效果與原有高度近視／青光眼風險分開管理。", "pitfall": "術後視力 1.0 不等於沒有角膜、視網膜或視神經風險。", "recall": {"question": "角膜雷射後眼壓變低，代表青光眼風險消失嗎？", "answer": "不代表；可能是量測偏差，仍須依完整結構與功能評估。"}, "relatedTopics": ["notes-01", "notes-07", "notes-10"], "sourceIds": ["an02-lasik-risk", "cov02-fda"]}], "unresolved": [], "sourceSha256": "b5d155eb967409eeedb601f6ed4c107bbe605cf997887c14121f5b359de181e7"}, "notes-03": {"sourceFile": "眼科學No.03.pdf", "pageCount": 53, "reviewedPages": [{"from": 1, "to": 2, "kind": "administrative", "note": "目錄與課堂行政資訊；醫學範圍依正文逐頁核對。"}, {"from": 3, "to": 22, "kind": "teaching", "note": "傳入視路、視野、視神經與視覺皮質；含重點複習。"}, {"from": 23, "to": 28, "kind": "exam", "note": "考題概念與解析，改寫為原創回想及鑑別。"}, {"from": 29, "to": 48, "kind": "teaching", "note": "眼動系統、腦神經、瞳孔與交感路徑；含重點複習。"}, {"from": 49, "to": 53, "kind": "exam", "note": "眼外肌、眼瞼、Adie 與 Horner 的考題概念。"}], "entries": [{"id": "c01", "title": "視覺訊號與四段視神經：眼底看得到哪一段？", "pages": [3, 4], "unitId": "u1", "sectionIndexes": [0], "terms": ["感光細胞", "雙極細胞", "神經節細胞", "intraocular", "intraorbital", "intracanalicular", "intracranial"], "keyPoints": ["光穿過內層視網膜後由感光細胞轉成電訊號，再經雙極細胞與神經節細胞送出；神經節細胞軸突匯聚為視神經。眼底可見視盤，不代表眼眶、視神經管與顱內段都已檢查。", "四段可依位置記為眼內 intraocular、眶內 intraorbital、管內 intracanalicular、顱內 intracranial。離開眼球後有髓鞘與腦膜包覆；管內空間有限，外傷或壓迫可先有功能下降而無明顯眼底變化。"], "clinicalLink": "用視力、色覺、RAPD 與影像串起前後段，而非只看視盤顏色。", "pitfall": "原稿把感光細胞說成光最先經過的結構；須分清光的行進與神經訊號方向。", "recall": {"question": "正常眼底能否排除視神經病變？", "answer": "不能；眼球後視神經炎或後部損傷初期可看不到視盤異常。"}, "relatedTopics": ["notes-01", "notes-10"], "sourceIds": ["n03-on-coverage", "n03-rapd"]}, {"id": "c02", "title": "視交叉的纖維規則與半側空間", "pages": [3, 4, 7, 8, 9, 17, 25, 26, 28], "unitId": "u1", "sectionIndexes": [0, 1], "terms": ["optic chiasm", "optic tract", "LGN", "optic radiation", "hemianopia"], "keyPoints": ["鼻側視網膜接收顳側視野，纖維於視交叉跨到對側；顳側視網膜纖維不交叉。通過視束 optic tract、外側膝狀體 LGN、視放射 optic radiation 後，每側枕葉處理對側半邊空間。", "Hemianopia 是半盲：同向性為兩眼同一側空間缺損，通常在交叉後；雙顳側為兩眼外側缺損，須考慮視交叉。單眼缺損通常在交叉前，但仍要先確認檢查可靠度。"], "clinicalLink": "請病人分眼描述，看不見右側與右眼看不見是不同定位。", "pitfall": "不要用受損視網膜側命名視野，也不要只問病人哪隻眼覺得不好。", "recall": {"question": "左同向偏盲提示哪側路徑？", "answer": "右側交叉後路徑；再依圖形與病程細分視束、視放射或枕葉。"}, "relatedTopics": ["notes-01", "notes-14"], "sourceIds": ["n03-field"]}, {"id": "c03", "title": "視野檢查：粗篩、等視線與閾值地圖", "pages": [5, 6, 21], "unitId": "u1", "sectionIndexes": [0, 1], "terms": ["confrontation", "tangent screen", "Goldmann", "kinetic perimetry", "static perimetry", "isopter"], "keyPoints": ["對比視野 confrontation 可床邊粗篩，tangent screen 在平面測繪中央視野。Goldmann 動態視野以移動刺激找邊界，連成等視線 isopter；刺激大小與亮度改變，邊界也改變。", "靜態視野 static perimetry 在固定位置改變刺激強度，估計光敏感閾值；適合量化缺損深度與追蹤。動態與靜態各有用途，不能把自動機器視為不受注意力、固視或屈光影響。"], "clinicalLink": "嚴重縮窄或難配合者可依需求選動態檢查；追蹤須盡量一致測試條件。", "pitfall": "灰階圖不是診斷；先看可靠度，再看數值與結構是否相符。", "recall": {"question": "Goldmann 的等視線代表什麼？", "answer": "在指定刺激大小與亮度下可辨認的視野邊界。"}, "relatedTopics": ["notes-01", "notes-07"], "sourceIds": ["n03-field"]}, {"id": "c04", "title": "盲點與視野缺損的命名語言", "pages": [6, 7, 12, 15, 21, 22, 23, 27], "unitId": "u1", "sectionIndexes": [0, 3, 4], "terms": ["blind spot", "central scotoma", "cecocentral", "paracentral", "arcuate", "altitudinal", "quadrantanopia"], "keyPoints": ["生理盲點對應無感光細胞的視盤，位於固視點顳側約 15 度。Central scotoma 為中央暗點；cecocentral 連及中央和盲點；paracentral 在中央旁。中央缺損可來自黃斑或視神經，並非特指動脈阻塞。", "Arcuate 沿神經纖維束呈弓形，青光眼常見；altitudinal 是主要位於水平中線上方或下方、常尊重水平中線的高度性缺損，AION 是重要鑑別；quadrantanopia 為四分之一視野缺損。形狀提示定位，不能單獨決定病因。"], "clinicalLink": "把圖形、疼痛、起病速度、色覺與眼底同時報告，可避免只背圖猜病。", "pitfall": "原稿的「梯形缺損」應理解為高度性半視野缺損，不是必須畫成梯形。", "recall": {"question": "中央與盲點連在一起的暗點叫什麼？", "answer": "Cecocentral scotoma；常提示乳頭黃斑束受影響，但仍需病因評估。"}, "relatedTopics": ["notes-07", "notes-10", "notes-13"], "sourceIds": ["n03-field", "n03-naion-coverage"]}, {"id": "c05", "title": "Meyer loop、頂葉與缺損一致性", "pages": [8, 9, 18, 19, 20, 26, 28], "unitId": "u1", "sectionIndexes": [1], "terms": ["Meyer loop", "parietal radiation", "congruous", "incongruous", "calcarine fissure"], "keyPoints": ["顳葉 Meyer loop 攜帶對側上方視野，頂葉視放射攜帶對側下方視野。到枕葉距狀溝 calcarine fissure，上唇處理下視野、下唇處理上視野；原稿把 Meyer loop 寫成額葉須更正。", "Congruous 指兩眼缺損形狀相近，incongruous 指不完全相同；後方病灶較常高度一致，但不是絕對定位規則。完整半盲也需考慮多個位置，不能只憑一致性指定某一腦葉。"], "clinicalLink": "若有新發同向缺損且時間急，先啟動中風評估再追求精細圖形分類。", "pitfall": "正常中央視力不能排除半盲，也不能以黃斑保留反推唯一血管。", "recall": {"question": "右顳葉 Meyer loop 損傷預期哪種缺損？", "answer": "左側同向上象限缺損。"}, "relatedTopics": ["notes-14"], "sourceIds": ["n03-field"]}, {"id": "c06", "title": "RAPD：以雙眼比較辨認傳入不對稱", "pages": [4, 5, 15, 26, 28], "unitId": "u3", "sectionIndexes": [9, 11], "terms": ["RAPD", "Marcus Gunn pupil", "swinging flashlight test", "CN II", "CN III"], "keyPoints": ["光訊號由視網膜、CN II 傳至前蓋區，再分送兩側 Edinger–Westphal 核；CN III 副交感纖維經睫狀神經節到瞳孔括約肌，因此單眼照光也會引起雙眼縮瞳。此反射不必先到視覺皮質。", "擺動手電筒由較好眼移到較差眼，若兩瞳相對擴大，支持後者有 RAPD（Marcus Gunn pupil）。它是傳入強度的相對差，不等於那眼的括約肌失效；嚴重不對稱視網膜病變也可能出現。"], "clinicalLink": "若一眼傳出障礙不能縮瞳，可觀察另一眼的間接反應完成比較。", "pitfall": "RAPD 不必伴瞳孔大小不等；雙側對稱視神經病變也可能沒有 RAPD。", "recall": {"question": "兩眼同樣大小是否排除 RAPD？", "answer": "不會；大小反映輸出，RAPD 比較兩眼輸入的相對品質。"}, "relatedTopics": ["notes-01", "notes-13"], "sourceIds": ["n03-rapd", "n03-rapd-video"]}, {"id": "c07", "title": "Papilledema 的症狀與安全診斷順序", "pages": [10, 11, 23, 25, 27, 28], "unitId": "u1", "sectionIndexes": [2], "terms": ["papilledema", "transient visual obscuration", "CN VI palsy", "axoplasmic flow"], "keyPoints": ["Papilledema 專指顱內壓升高相關的視盤水腫，與一般 optic disc edema 不同。軸突漿運輸 axoplasmic flow 受阻造成腫脹，可有數秒暫時視黑、頭痛、VI 麻痺與盲點擴大；早期視力和色覺仍可好。", "辨認水腫後，先評估顱內佔位、靜脈竇血栓與其他原因；適當神經影像及安全性判斷在腰椎穿刺之前。也需量血壓並排除假性水腫、發炎或其他雙側視神經疾病。"], "clinicalLink": "眼科發現可能是顱內疾病入口；視力尚佳不應降低評估急迫性。", "pitfall": "不能把所有雙側視盤腫脹直接叫顱內壓高，也不能用固定幾小時時程排除它。", "recall": {"question": "數秒視黑加雙側視盤水腫應先想到什麼？", "answer": "顱內壓相關 papilledema，並安排及時病因與安全影像評估。"}, "relatedTopics": ["notes-01", "notes-14"], "sourceIds": ["n03-papilledema-coverage"]}, {"id": "c08", "title": "從早期水腫到萎縮：外觀變平不一定恢復", "pages": [10, 11, 23, 27], "unitId": "u1", "sectionIndexes": [2, 4], "terms": ["early papilledema", "established", "chronic", "atrophic", "cotton wool spots", "gliosis"], "keyPoints": ["早期可見視盤充血與邊緣模糊；成熟 established 水腫較突出，杯狀凹陷減少，可能伴出血與棉絮斑。Cotton wool spots 是神經纖維層軸突運輸受阻的表現，不是細菌或膿。", "慢性水腫可逐漸少見出血，久而久之產生軸突損失、gliosis 與萎縮。Atrophic 階段視盤可能不再高起，但功能已受損；以視野、視力及 OCT 變化追蹤，不能僅以消腫宣佈痊癒。"], "clinicalLink": "每次隨訪比較功能與結構，可分辨壓力控制後改善或神經耗損後變薄。", "pitfall": "自發靜脈搏動消失並不專一；保留或消失都要連同全套證據解讀。", "recall": {"question": "視盤從腫變平有哪些可能？", "answer": "病因改善，或軸突萎縮；需靠功能和結構追蹤分辨。"}, "relatedTopics": ["notes-07"], "sourceIds": ["n03-papilledema-coverage"]}, {"id": "c09", "title": "AION 與 PION：缺血在視盤前後的差別", "pages": [11, 12, 21, 22, 23, 27], "unitId": "u1", "sectionIndexes": [3], "terms": ["AION", "PION", "short posterior ciliary arteries", "altitudinal defect"], "keyPoints": ["AION 是視神經頭的缺血，急性期有可見視盤水腫；PION 位於視盤之後，早期眼底可正常。短後睫狀動脈供應視神經頭，是理解前部缺血的重要血管背景。", "突發無痛視力下降、RAPD 與高度性缺損支持缺血性視神經病變，但上或下缺損並非每例固定。PION 需排除其他眼球後視神經病因，可出現在嚴重低灌流、手術周邊或血管炎等情境。"], "clinicalLink": "把有無視盤腫脹當位置線索，再用全身情境分辨原因。", "pitfall": "AION 不是一律由可見血栓塞住造成；正常眼底也不代表沒有缺血。", "recall": {"question": "無痛急性視力下降但沒有視盤水腫能否是缺血？", "answer": "可以，PION 早期無水腫；仍須緊急鑑別其他原因。"}, "relatedTopics": ["notes-10", "notes-14"], "sourceIds": ["n03-naion-coverage", "n03-gca-coverage"]}, {"id": "c10", "title": "AAION：GCA 的確診不能成為治療等待點", "pages": [12, 13, 24, 25, 27, 28], "unitId": "u1", "sectionIndexes": [3], "terms": ["AAION", "giant cell arteritis", "ESR", "CRP", "temporal artery biopsy"], "keyPoints": ["高齡者急性視力下降若有新頭痛、頭皮壓痛、咀嚼跛行、體重變化或蒼白腫脹視盤，應考慮 GCA 引起的 AAION。ESR、CRP 與血小板提供支持，數值正常也不能在高度懷疑時單獨排除。", "需立即全身性高劑量 glucocorticoids 與緊急專科協作；有視力威脅時評估靜脈 pulse 治療。顳動脈切片或適當血管影像協助確診，安排檢查不應延誤保護另眼與全身血管。"], "clinicalLink": "先說出緊急處理，再回答確診方法，展現時間敏感的臨床推理。", "pitfall": "不要因台灣相對少見或尚未取得切片就等待。", "recall": {"question": "懷疑 GCA 且已有視覺症狀，切片前做什麼？", "answer": "立即治療及緊急專科評估，同步安排確診。"}, "relatedTopics": ["notes-13", "notes-14"], "sourceIds": ["n03-gca-coverage"]}, {"id": "c11", "title": "NAION：視盤擁擠與全身風險", "pages": [13, 22, 27], "unitId": "u1", "sectionIndexes": [3], "terms": ["NAION", "disc at risk", "crowded disc", "sleep apnea"], "keyPoints": ["NAION 常見小杯且擁擠的視神經盤（disc at risk），不是把視神經管骨性狹窄當作同一概念。高血壓、糖尿病、血脂異常與睡眠呼吸中止等全身因素值得評估，但有這些病史仍須排除 GCA。", "急性期目前沒有一致證實可恢復視力的標準藥物；照護包含正確診斷、風險管理、另眼衛教與視覺復健。血壓或其他藥物調整要與原治療醫師協作，不能自行停藥或一概提高夜間血壓。"], "clinicalLink": "把「沒有證實逆轉療法」與「沒有可做的照護」分開。", "pitfall": "單憑擁擠視盤或糖尿病不應跳過血管炎危險線索。", "recall": {"question": "NAION 的 disc at risk 指什麼？", "answer": "小杯、擁擠的視神經頭結構，與缺血後腫脹的易感性有關。"}, "relatedTopics": ["notes-07", "notes-14"], "sourceIds": ["n03-naion-coverage"]}, {"id": "c12", "title": "視神經炎的典型表型與影像", "pages": [14, 15, 23, 24, 26, 27, 28], "unitId": "u1", "sectionIndexes": [4], "terms": ["optic neuritis", "papillitis", "retrobulbar neuritis", "MRI", "red desaturation"], "keyPoints": ["典型脫髓鞘視神經炎常在數天內單眼視力與色覺下降、轉眼疼痛、RAPD 及中央暗點。Papillitis 有視盤水腫；retrobulbar neuritis 發炎在球後，眼底可正常。紅色飽和度下降是功能線索而非單項確診。", "MRI 腦與眼眶可評估視神經增強及其他中樞病灶。典型 ONTT 情境中高劑量類固醇主要加快恢復，不能把這個結論外推為每種視神經炎都不需治療，或每種亞洲病例都同樣處置。"], "clinicalLink": "先描述表型再決定病因及治療路徑，避免只看到年輕女性便停在 MS。", "pitfall": "正常眼底不能否定球後視神經炎；也不能把所有疼痛視力下降都當它。", "recall": {"question": "Papillitis 與球後型主要差在哪？", "answer": "病變部位和急性眼底外觀；兩者都可能有視神經功能缺損。"}, "relatedTopics": ["notes-09", "notes-14"], "sourceIds": ["n03-on-coverage"]}, {"id": "c13", "title": "非典型視神經炎：MS、NMOSD、MOGAD 與感染", "pages": [14, 15, 25, 28], "unitId": "u1", "sectionIndexes": [4], "terms": ["multiple sclerosis", "NMOSD", "AQP4-IgG", "MOGAD", "MOG-IgG", "syphilis", "tuberculosis", "sarcoidosis", "SLE", "postinfectious inflammation"], "keyPoints": ["雙眼、重度、反覆、恢復不佳或長節段影像異常，會提高 NMOSD（常與 AQP4-IgG 相關）或 MOGAD（MOG-IgG 相關）的考量；與 multiple sclerosis 相關的典型視神經炎在預後和長期治療不同。", "病毒感染或感染後免疫反應、梅毒、結核，以及 SLE、sarcoidosis 等系統性疾病也可影響視神經。檢驗依表型與暴露風險選擇；可能感染時，不應把加強免疫抑制作為未經分辨的通用答案。"], "clinicalLink": "一次視神經炎可能是全身疾病起點，要追問既往脊髓或其他神經症狀。", "pitfall": "AQP4 檢驗不是 GCA 的確診工具，抗體陰陽也需配合臨床判讀。", "recall": {"question": "為何嚴重雙眼視神經炎不能完全套用典型 ONTT？", "answer": "可能是 NMOSD、MOGAD 或其他病因，其治療急迫性與復發預防不同。"}, "relatedTopics": ["notes-09", "notes-13"], "sourceIds": ["n03-on-coverage"]}, {"id": "c14", "title": "Neuroretinitis 與 perineuritis：同樣視盤腫的不同線索", "pages": [14, 26, 28], "unitId": "u1", "sectionIndexes": [4], "terms": ["neuroretinitis", "macular star", "optic perineuritis"], "keyPoints": ["Neuroretinitis 以視盤發炎及黃斑星芒狀硬性滲出為特徵；星芒可在視盤水腫之後才出現，早期沒有星芒不能排除。依病史考量 Bartonella 等感染及非感染原因，並核對血壓與視網膜情況。", "Optic perineuritis 主要涉及視神經鞘而非神經實質，MRI 可見鞘周增強；可能和 sarcoidosis、IgG4 或感染有關。視野可不同，不能硬規定中央一定正常；病因與治療計畫需重新評估。"], "clinicalLink": "把滲出所在位置與影像增強所在位置作為下一步檢查的理由。", "pitfall": "黃斑星芒不等於所有視神經炎，視神經鞘增強也不是單一病因專屬。", "recall": {"question": "視盤腫合併黃斑星芒，首先要補哪類病史？", "answer": "感染暴露及全身症狀，並排除其他可造成星芒的血管或發炎病因。"}, "relatedTopics": ["notes-09", "notes-10"], "sourceIds": ["n03-neuroretinitis-coverage", "n03-perineuritis-coverage"]}, {"id": "c15", "title": "外傷後視神經功能下降：直接、間接與可治壓迫", "pages": [15, 16], "unitId": "u1", "sectionIndexes": [4], "terms": ["traumatic optic neuropathy", "direct injury", "indirect injury", "optic canal decompression"], "keyPoints": ["直接 TON 可由撕裂、穿透或剝離傷害視神經；間接型可由額面部撞擊把力量傳到視神經管。視力下降與 RAPD 可能先出現，視盤晚些才萎縮；影像要尋找骨片、血腫或其他可處理的壓迫。", "需先排眼球破裂與眼眶腔室症候群等時間敏感急症。間接 TON 的高劑量類固醇或視神經管減壓沒有一致優於觀察的證據；尤其合併腦傷時巨量類固醇有重要危害，不列作常規處方。"], "clinicalLink": "區分急需解除明確壓迫與未證實有效的一般 TON 治療。", "pitfall": "不能因眼底正常說沒有傷，也不能把所有外傷視力下降都送類固醇 pulse。", "recall": {"question": "TON 為何可能眼底正常但 RAPD 明顯？", "answer": "早期受損可在眼球後方，傳入功能已下降而視盤尚未改變。"}, "relatedTopics": ["notes-08", "notes-14"], "sourceIds": ["n03-ton-coverage"]}, {"id": "c16", "title": "雙側中央暗點：毒性與營養性視神經病變", "pages": [16], "unitId": "u1", "sectionIndexes": [4], "terms": ["toxic optic neuropathy", "nutritional optic neuropathy", "ethambutol", "linezolid", "chloramphenicol", "amiodarone", "B1", "B12"], "keyPoints": ["雙側逐漸色覺與中央視力下降、cecocentral 暗點，需問 ethambutol、linezolid、chloramphenicol 等藥物；amiodarone 相關視神經病變的判斷亦需排除其他缺血原因。鉛等毒物與營養缺乏也在鑑別。", "營養評估包括 B12、B1 缺乏風險、飲食吸收與酒精使用史；機轉是視神經受損，不能把成人毒性視神經病變叫做兒童發育性弱視。懷疑藥害須與開藥醫師及時協作，調整病因並追蹤功能。"], "clinicalLink": "將用藥時間、腎功能與對稱性連到第 13 章藥害監測。", "pitfall": "沒有 RAPD 不能排除雙側對稱毒性病變。", "recall": {"question": "為何雙側毒性視神經病變可能 RAPD 陰性？", "answer": "兩眼受損相近，這項相對比較可能測不出差異。"}, "relatedTopics": ["notes-13"], "sourceIds": ["n03-on-coverage", "n03-rapd"]}, {"id": "c17", "title": "視神經萎縮：病理終點與遺傳鑑別", "pages": [16, 22], "unitId": "u1", "sectionIndexes": [4], "terms": ["optic atrophy", "Wallerian degeneration", "descending atrophy", "LHON", "dominant optic atrophy"], "keyPoints": ["Optic atrophy 描述軸突損失後的蒼白與功能缺損，不是完整病因診斷。視網膜或神經節細胞損傷可往後造成 Wallerian degeneration；後方壓迫也可逆向變性，常被稱 descending atrophy。", "LHON 與粒線體遺傳相關，dominant optic atrophy 常有體染色體顯性家族模式。須問家族史、年齡、雙眼先後與中央色覺功能；壓迫性腫瘤、既往炎症、缺血或毒性都應依情境評估。"], "clinicalLink": "看到蒼白視盤時追問病程與先前水腫，不停留在「萎縮無法治」的標籤。", "pitfall": "不是每種萎縮都有青光眼式凹陷；杯變大不能自動等同青光眼。", "recall": {"question": "萎縮是病因還是結果？", "answer": "主要是結果；仍需判斷有無可處理的持續病因與另眼風險。"}, "relatedTopics": ["notes-07", "notes-13"], "sourceIds": ["n03-on-coverage", "n03-field"]}, {"id": "c18", "title": "視交叉壓迫：視野、OCT 與鞍區影像對照", "pages": [8, 17, 25, 26, 28], "unitId": "u1", "sectionIndexes": [0, 1], "terms": ["pituitary adenoma", "craniopharyngioma", "meningioma", "dural tail", "RNFL", "ganglion cell complex"], "keyPoints": ["垂體腺瘤、顱咽管瘤與腦膜瘤可壓迫視交叉；另須考慮動脈瘤、膠質瘤、外傷與發炎。雙顳缺損可不對稱，視力下降程度也不必相同；慢性壓迫可見視盤蒼白。", "OCT 的 RNFL 或黃斑神經節細胞層變薄，應與視野及 MRI 病灶方向對照。Dural tail 可支持腦膜瘤，但不是單憑一個影像符號就完成病理診斷；急性頭痛伴視覺或眼動改變須考慮急症。"], "clinicalLink": "慢性模糊不應只換眼鏡；尊重垂直中線的雙眼異常需要視路評估。", "pitfall": "不能要求兩眼完全對稱才診斷視交叉病變。", "recall": {"question": "OCT 很薄可否取代 MRI 找壓迫原因？", "answer": "不能；OCT 反映神經結構受損，MRI 回答壓迫位置與病因。"}, "relatedTopics": ["notes-01", "notes-14"], "sourceIds": ["n03-field"]}, {"id": "c19", "title": "枕葉與黃斑保留：皮質解析力與血供", "pages": [18, 19, 20, 23, 24, 26, 27, 28], "unitId": "u1", "sectionIndexes": [1], "terms": ["visual cortex", "cortical blindness", "PCA", "MCA", "macular sparing", "occipital pole"], "keyPoints": ["黃斑在枕葉皮質佔有較大代表區，枕極 occipital pole 與中央視野關係密切。PCA 是視覺皮質主要血供，部分枕極可能有 MCA 側支；因此某些枕葉梗塞出現同向半盲而中央保留。", "Macular sparing 是線索而非必要條件，血供個體差異及病灶範圍都影響結果。雙側枕葉病變可造成皮質性視覺損害，眼底與瞳孔反射仍可保留；需和眼球前段、視神經及功能性症狀分辨。"], "clinicalLink": "中央可讀字不代表日常行走、閱讀掃視和駕駛視野安全。", "pitfall": "不能用眼底正常或對光反射存在否定皮質視覺損害。", "recall": {"question": "右枕葉急性梗塞可能哪側看不見？", "answer": "雙眼左側空間；是否有黃斑保留要看實際缺損。"}, "relatedTopics": ["notes-14"], "sourceIds": ["n03-field", "n03-rapd"]}, {"id": "c20", "title": "六條眼外肌：神經、單肌作用與診斷眼位", "pages": [29, 30, 46, 49, 50, 51, 52, 53], "unitId": "u2", "sectionIndexes": [5], "terms": ["MR", "LR", "SR", "IR", "SO", "IO", "LR6 SO4"], "keyPoints": ["內直肌 MR 內轉、外直肌 LR 外轉；SR 上轉兼內旋內轉，IR 下轉兼外旋內轉；SO 內旋兼下轉外轉，IO 外旋兼上轉外轉。LR 由 VI、SO 由 IV，其餘由 III 支配。", "單肌的解剖作用不同於最佳檢查眼位：直肌在外轉時較易隔離垂直作用，斜肌在內轉時較易隔離垂直作用。因此 SO 雖有外轉分量，臨床仍在內下看檢查它。"], "clinicalLink": "用受限動作的組合判斷神經分布，再查下垂與瞳孔。", "pitfall": "看到「上斜肌有外展作用」不能推成 IV 麻痺只會外下看受限。", "recall": {"question": "內轉位下轉主要檢查哪條肌？", "answer": "上斜肌，由第四腦神經支配。"}, "relatedTopics": ["notes-04"], "sourceIds": ["n03-third"]}, {"id": "c21", "title": "眼動六種任務：掃視、追視、集合與穩定凝視", "pages": [29, 31, 33, 34, 46, 47], "unitId": "u2", "sectionIndexes": [5], "terms": ["fixation", "saccade", "smooth pursuit", "vergence", "OKN", "VOR", "VOR cancellation"], "keyPoints": ["Fixation 維持目標於中央；saccade 快速換目標，smooth pursuit 追隨移動目標；vergence 使雙眼相向集合或發散。OKN 包含慢相追蹤與快相回復，不應把生理視動眼震一律視為病理。", "VOR 由前庭訊號讓眼球反向補償頭動，維持影像穩定；VOR cancellation 是當頭與目標同向移動時抑制這個補償。測任務不同，異常所指向的系統也不同，追視失常不等於外眼肌力量不足。"], "clinicalLink": "詢問晃視、轉頭症狀與複視，再分別檢查任務。", "pitfall": "頸椎傷未排除時不能為了測 doll-eye 任意轉動外傷病人的頭。", "recall": {"question": "頭向右轉而凝視固定目標，眼球如何補償？", "answer": "主要向左移動，屬前庭眼反射。"}, "relatedTopics": ["notes-04", "notes-14"], "sourceIds": ["n03-third", "n03-ino-coverage"]}, {"id": "c22", "title": "水平凝視迴路：PPRF、VI 核與 MLF", "pages": [32, 33, 34, 35, 46, 47, 50, 53], "unitId": "u2", "sectionIndexes": [5, 6], "terms": ["FEF", "PPRF", "abducens nucleus", "MLF", "MT", "DLPN", "flocculus", "vestibular nucleus"], "keyPoints": ["以向右掃視為例，左額葉 FEF 訊號啟動右 PPRF 與 VI 核；VI 核運動神經元帶動右 LR，核間神經元跨線後沿左 MLF 至左 III 核，帶動左 MR。VI 核與 VI 神經病變因此表現不同。", "追視涉及視覺運動區 MT、橋腦 DLPN、小腦 flocculus 和前庭核的網路；VOR 由前庭核啟動而不依賴先做視覺辨識。不要只背一條箭頭，應理解多種任務共享最末端的凝視輸出。"], "clinicalLink": "VI 核損傷可影響同側雙眼凝視，單純 VI 神經損傷主要影響該眼外轉。", "pitfall": "MLF 的側別以受影響內轉眼來命名，避免把核間投射方向背反。", "recall": {"question": "右 VI 核病變和右 VI 神經病變最大差異？", "answer": "前者可使兩眼都無法向右凝視；後者主要是右眼外轉不足。"}, "relatedTopics": ["notes-04"], "sourceIds": ["n03-third", "n03-ino-coverage"]}, {"id": "c23", "title": "INO、WEBINO 與 one-and-a-half 的剩餘動作", "pages": [35, 36, 47, 50, 53], "unitId": "u2", "sectionIndexes": [6], "terms": ["INO", "WEBINO", "one-and-a-half syndrome", "abducting nystagmus"], "keyPoints": ["INO 由 MLF 病變造成患側內轉不足及對側外轉眼震；集合有時保留，但不能作必要條件。年輕雙側病例考量脫髓鞘，年長急性單側病例要考慮中風；雙側 INO 合併外斜可稱 WEBINO。", "One-and-a-half 合併同側水平凝視機制（PPRF 或 VI 核）及同側 MLF 損傷：向病側兩眼都不動，向另側只剩健側眼外轉。不是必須三個解剖結構同時全被破壞才成立。"], "clinicalLink": "依仍能完成的動作畫出定位，比只背一個疾病名字更可靠。", "pitfall": "不能把內轉不足全部歸給 III 麻痺，也不能說 INO 一定能集合。", "recall": {"question": "右側 one-and-a-half 還剩哪個水平動作？", "answer": "左眼外轉，可能伴外轉眼震。"}, "relatedTopics": ["notes-04", "notes-14"], "sourceIds": ["n03-third", "n03-ino-coverage"]}, {"id": "c24", "title": "Skew deviation 與核上病變：垂直複視不一定 IV 麻痺", "pages": [35, 36], "unitId": "u2", "sectionIndexes": [6, 8], "terms": ["skew deviation", "supranuclear gaze disorder"], "keyPoints": ["Skew deviation 是前庭眼動路徑失衡造成的垂直眼位偏差，常見於腦幹或小腦等中樞病變，可伴眼球旋轉、頭傾或其他腦幹小腦徵象。它可模仿第四神經麻痺，因此頭傾試驗結果必須放回完整神經檢查。", "核上凝視異常位於眼動神經核上游，可能同時影響掃視、追視或 OKN；皮質病灶還可能合併同向視野缺損。分別檢查視野與眼動可發現同一腦病灶的兩種表現。"], "clinicalLink": "突發垂直複視伴不穩、眼震或其他神經症狀，應及時評估中樞病因。", "pitfall": "Three-step test 符合某肌並不保證是孤立周邊 IV 病變。", "recall": {"question": "垂直複視伴步態不穩需要重新考慮哪一層定位？", "answer": "中樞前庭、腦幹或小腦路徑，包括 skew deviation。"}, "relatedTopics": ["notes-04", "notes-14"], "sourceIds": ["n03-skew-coverage"]}, {"id": "c25", "title": "第三神經麻痺：沿路解剖與動脈瘤警訊", "pages": [37, 38, 43, 47, 49, 52], "unitId": "u2", "sectionIndexes": [7], "terms": ["oculomotor palsy", "posterior communicating aneurysm", "cavernous sinus", "superior orbital fissure"], "keyPoints": ["III 神經從中腦經顱內血管鄰近區、海綿竇及上眶裂入眶，支配提肌與多條眼外肌，副交感纖維控制縮瞳。下垂、內轉和上下轉不足、外下偏與散瞳的組合支持第三神經定位。", "後交通動脈瘤可能壓迫 III 神經，新的疼痛性麻痺需立即血管評估。即使年長、有糖尿病或瞳孔保留，也不能單靠「微血管」推論排除動脈瘤；部分性麻痺尤其應謹慎。"], "clinicalLink": "回答須同時說定位與危險病因排除，不能用一個瞳孔結果代替影像判斷。", "pitfall": "散瞳可能由藥物或虹膜病變造成；也不是所有動脈瘤病例初診都有散瞳。", "recall": {"question": "新發部分 III 麻痺但瞳孔正常，是否可直接安心觀察？", "answer": "不可只靠瞳孔保留；須依臨床及時完成神經血管評估。"}, "relatedTopics": ["notes-11", "notes-14"], "sourceIds": ["n03-third"]}, {"id": "c26", "title": "第四神經麻痺：背側交叉與三步驟", "pages": [39, 40, 47, 50, 51, 53], "unitId": "u2", "sectionIndexes": [8], "terms": ["trochlear nerve", "Parks three-step test", "excyclotorsion", "head tilt"], "keyPoints": ["IV 核位於中腦，纖維背側出腦幹前交叉，支配對側 SO；長而細的顱內路徑使其易受外傷影響。單側麻痺常患眼較高並有外旋，閱讀或下樓可更困擾。", "三步驟先判哪眼高，再看左右注視及左右頭傾何者加重。右 IV 麻痺典型為右高、左看加重、右傾加重；代償頭位常向左。雙側病變、限制型斜視和 skew 都可能使規則失準。"], "clinicalLink": "詢問舊照片的頭位可提示先天代償失衡，但新發症狀仍需評估。", "pitfall": "不要把代償頭傾方向與使偏斜加重的測試方向混為一談。", "recall": {"question": "右高、左看更高、右頭傾更高，典型支持什麼？", "answer": "右上斜肌／第四神經功能不足，但仍需排除模仿者。"}, "relatedTopics": ["notes-04"], "sourceIds": ["n03-third"]}, {"id": "c27", "title": "第六神經麻痺與眼瞼的交叉線索", "pages": [41, 47, 49, 50, 52, 53], "unitId": "u2", "sectionIndexes": [8, 11], "terms": ["abducens palsy", "facial colliculus", "levator", "orbicularis", "Müller muscle"], "keyPoints": ["VI 神經麻痺造成同側 LR 無力，遠距水平複視與向患側看更明顯；VI 核附近有 VII 纖維繞行，若伴顏面無力可提示橋腦定位。VI 也可因顱壓升高受影響，不能只診斷「外直肌問題」。", "眼瞼提供旁證：III 支配 levator 開眼、交感支配 Müller 輔助開眼、VII 支配 orbicularis 閉眼。新發下垂伴眼動或瞳孔異常，要先判定神經或神經肌肉病因，再考慮修復高度。"], "clinicalLink": "把複視、臉部對稱與閉眼完整性納入同一次床邊檢查。", "pitfall": "不能把 Müller 說成副交感，或把閉眼肌支配錯寫 CN III。", "recall": {"question": "外轉不足加同側顏面無力，為何比孤立 VI 更值得注意？", "answer": "可能涉及橋腦相鄰核與纖維，需評估中樞病變。"}, "relatedTopics": ["notes-11", "notes-14"], "sourceIds": ["n03-third", "n03-ino-coverage"]}, {"id": "c28", "title": "Adie：光近分離與去神經敏感性的限制", "pages": [42, 43, 48, 51], "unitId": "u3", "sectionIndexes": [9], "terms": ["Adie tonic pupil", "light-near dissociation", "sector palsy", "vermiform movement", "Holmes-Adie"], "keyPoints": ["Adie 是常見的節後副交感去神經型 tonic pupil：對光差、近反應相對較好且再擴大慢。裂隙燈可見括約肌扇形無力 sector palsy 與蚯蚓樣 vermiform movement；合併腱反射減弱可稱 Holmes–Adie。", "稀釋 pilocarpine 的超敏反應支持去神經，但初期可能尚未形成，部分 III 神經病變也可陽性。近距調節可受損，日後改善不表示光反射必恢復；不能承諾數月一定自癒。"], "clinicalLink": "在說「良性 Adie」之前，先核對疼痛、下垂、眼動與外傷／藥物暴露。", "pitfall": "光近分離不代表調節完全正常，低濃度藥物反應也不是專一試驗。", "recall": {"question": "Adie 陽性稀釋試驗能否單獨排除 III 麻痺？", "answer": "不能，仍需完整眼動和危險病因評估。"}, "relatedTopics": ["notes-11"], "sourceIds": ["n03-adie-coverage", "n03-third"]}, {"id": "c29", "title": "Horner 三級路徑：肺尖與內頸動脈", "pages": [44, 45, 48, 49, 52], "unitId": "u3", "sectionIndexes": [10], "terms": ["Horner syndrome", "ciliospinal center", "superior cervical ganglion", "Pancoast tumor", "internal carotid dissection"], "keyPoints": ["第一級由下視丘下行至 C8–T2 附近 ciliospinal center；第二級經肺尖與鎖骨下區到上頸神經節，所以 Pancoast 肺尖腫瘤或胸頸手術可造成節前 Horner。", "第三級眼部纖維沿內頸動脈入顱後通往眼眶，控制擴瞳與 Müller 肌。原稿的外頸動脈應更正為內頸動脈；急性痛性 Horner 要緊急排頸動脈剝離，不等待藥物確認。"], "clinicalLink": "用神經路徑決定問診與影像範圍，並把危險急症置前。", "pitfall": "沒有無汗不能排除節後 Horner；痛性病例不以良性瞳孔差結案。", "recall": {"question": "肺尖腫瘤涉及 Horner 的哪級？", "answer": "第二級交感神經，屬節前路徑。"}, "relatedTopics": ["notes-08", "notes-11", "notes-14"], "sourceIds": ["n03-horner-integrated"]}, {"id": "c30", "title": "Horner 的外觀、明暗比較與先天線索", "pages": [45, 48, 51, 53], "unitId": "u3", "sectionIndexes": [10, 11], "terms": ["miosis", "dilation lag", "apparent enophthalmos", "iris heterochromia"], "keyPoints": ["Horner 的小瞳在暗處擴大較慢，故明暗比較和 dilation lag 比單張照片更有價值；常伴輕度上瞼下垂及下瞼位置上升，形成看似眼球內凹，而非必有真正眶內容物減少。", "早年發生可能患側虹膜較淡，稱 iris heterochromia；需問出生外傷、既往照片及其他神經／全身異常。異色瞳是線索，不是所有先天 Horner 都有，也不能把兒童新發當作生理變異。"], "clinicalLink": "先確認何時開始，再把先天與急性取得性原因分開處理。", "pitfall": "原稿解析把 miosis 誤說成瞳孔放大；正確是縮瞳。", "recall": {"question": "為什麼 Horner 看起來眼球凹但不一定真的後移？", "answer": "上下瞼裂變窄造成相對外觀變化。"}, "relatedTopics": ["notes-11"], "sourceIds": ["n03-horner-integrated"]}], "unresolved": [], "sourceSha256": "d4e74185df7d510c6170679b8e287c73c5acf07e4ab03735f6c303c60de5585d"}, "notes-04": {"sourceFile": "眼科學No.04.pdf", "pageCount": 48, "reviewedPages": [{"from": 1, "to": 4, "kind": "administrative", "note": "封面、目錄及授課行政回饋；醫學範圍依正文核對。"}, {"from": 5, "to": 19, "kind": "teaching", "note": "視覺發育、弱視、眼外肌與感覺生理，含複習圖表。"}, {"from": 20, "to": 21, "kind": "exam", "note": "弱視成因、治療及肌肉作用的考題概念。"}, {"from": 22, "to": 32, "kind": "teaching", "note": "感覺適應、斜視測量、分類及內斜。"}, {"from": 33, "to": 34, "kind": "exam", "note": "斜視檢查與被動牽拉測試的考題概念。"}, {"from": 35, "to": 45, "kind": "teaching", "note": "外斜、垂直偏斜、特殊斜視與手術原理。"}, {"from": 46, "to": 48, "kind": "exam", "note": "眼位分類、處理與手術作用的考題概念。"}], "entries": [{"id": "c01", "title": "視覺發育：把年齡里程碑當篩檢方向", "pages": [5, 6, 7, 18], "unitId": "u1", "sectionIndexes": [0, 1], "terms": ["visual development", "fixation", "smooth pursuit", "orthotropia"], "keyPoints": ["嬰兒出生時解析力尚在發展，早期逐漸建立固視、追視、手眼協調與雙眼對位。清楚且品質相近的兩眼影像、良好眼位與完整傳導路徑，是正常發育的重要條件。", "年齡里程碑要配合所用測量方法；不能把「會看人臉」直接換算成固定小數視力。持續偏斜、單眼固視明顯不足、白瞳或視軸遮蔽需及時評估，不宜以年紀小還不會講話延後。"], "clinicalLink": "評估分眼固視與屈光，才能找出雙眼睜開時被另一眼掩蓋的問題。", "pitfall": "原稿中的發育年齡與視力數字不是每個孩子通用的診斷門檻。", "recall": {"question": "孩子走路正常，為何還要分眼看？", "answer": "較好眼可能代償，單眼視覺發育異常可外觀不明顯。"}, "relatedTopics": ["notes-01", "notes-11"], "sourceIds": ["n04-amblyopia"]}, {"id": "c02", "title": "弱視的四種影像問題與定義邊界", "pages": [7, 8, 18, 19, 20, 21], "unitId": "u1", "sectionIndexes": [0, 2], "terms": ["strabismic amblyopia", "anisometropia", "isoametropia", "deprivation amblyopia"], "keyPoints": ["斜視性弱視來自持續影像衝突；屈光參差 anisometropia 讓兩眼清晰度不同；雙側高度屈光不正 isoametropia 使兩眼都長期模糊；剝奪性弱視則因白內障、角膜混濁或其他介質遮蔽。", "弱視是發育期異常經驗造成的最佳矯正視力不足，必須排除足以解釋程度的器質病。兩眼差兩行只是常用線索，不能排除雙側弱視；原稿的固定遠視、近視或散光度數宜視為風險示例而非充分必要條件。"], "clinicalLink": "屈光參差不一定肉眼看得出斜視，所以要做適齡驗光與單眼測量。", "pitfall": "鼻淚管阻塞或單純贅皮不自動等於弱視；要證明有影像品質或視軸影響。", "recall": {"question": "兩眼視力相同能否仍是弱視？", "answer": "可以，例如雙側高度屈光性弱視；應比較年齡預期與最佳矯正反應。"}, "relatedTopics": ["notes-02", "notes-06"], "sourceIds": ["n04-amblyopia"]}, {"id": "c03", "title": "Crowding：為何單個字標會高估視力？", "pages": [8, 9, 19], "unitId": "u1", "sectionIndexes": [1], "terms": ["crowding phenomenon", "single optotype", "surround bars", "line acuity"], "keyPoints": ["Crowding 指字標周圍有其他輪廓時更難辨認；弱視眼可能單個字看得較好，整排視標卻明顯變差。測試時可用成排字或帶 surround bars 的單個字標，保留擁擠條件。", "追蹤視力需固定測距、遮眼方式、矯正與字標形式；若本次單字、下次整排，差異可能來自測試本身。鼓勵與配合度也需紀錄，不能把量測差異直接叫病情惡化。"], "clinicalLink": "把檢查條件寫進紀錄，讓治療前後比較具有意義。", "pitfall": "不能只用孤立 E 字就斷言弱視已恢復。", "recall": {"question": "單字 1.0、成排較差是否矛盾？", "answer": "不矛盾，可能顯示 crowding；需一致的標準化測法。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n04-amblyopia"]}, {"id": "c04", "title": "中性濾光與偏心固視：補充徵象而非確診", "pages": [8, 19], "unitId": "u1", "sectionIndexes": [1, 4], "terms": ["neutral density filter effect", "eccentric fixation", "foveola"], "keyPoints": ["Neutral density filter 降低亮度但不改顏色；傳統弱視評估曾觀察到弱視眼在降低亮度時視力下降模式與某些器質病不同。此現象受測量條件影響，不能作為排除視神經或視網膜病的捷徑。", "Eccentric fixation 是單眼固視時使用中央凹以外的視網膜位置，與雙眼感覺適應的 ARC 不同。Foveola 仍是解剖上的中央凹中心，並沒有長出新的黃斑；要以適當固視檢查判斷。"], "clinicalLink": "理解固視位置有助解釋視力和視標表現不一致。", "pitfall": "不要把偏心固視和異常視網膜對應混用，也不要用濾片試驗單獨診斷弱視。", "recall": {"question": "偏心固視和 ARC 差在哪？", "answer": "前者是單眼固視使用的位置；後者是兩眼感覺對應的適應。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-amblyopia"]}, {"id": "c05", "title": "兒童視力工具：依能力挑選可重現測量", "pages": [8, 9, 19], "unitId": "u1", "sectionIndexes": [1], "terms": ["Snellen", "HOTV", "Allen cards", "tumbling E", "Wright figures"], "keyPoints": ["能認字者可用 Snellen 或標準化字母視標；HOTV 可用配對而不要求會讀字；Allen 圖卡、Wright 圖形與翻轉 E（tumbling E）利用不同辨識或方向能力。工具名稱不同，不能假定難度完全等同。", "選擇時看語言、年齡與配合，且每次分眼、戴合適矯正並防偷看。影像卡能幫助取得反應，但熟悉圖案或單眼線索可能造成高估；前後追蹤盡量沿用同類方法。"], "clinicalLink": "無法完成成人視力表，不代表無法評估視覺發育。", "pitfall": "把一次不合作當成視力差，或把會命名圖案當成兩眼都正常，都是量測錯誤。", "recall": {"question": "不識字的孩子如何測視力？", "answer": "使用適齡圖形、配對 HOTV 或方向性視標，仍需單眼標準化測量。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n04-amblyopia"]}, {"id": "c06", "title": "單眼固視與固視偏好：觀察轉移而非猜視力", "pages": [9, 10, 19], "unitId": "u1", "sectionIndexes": [1], "terms": ["monocular fixation", "fixation preference", "central steady maintained"], "keyPoints": ["小嬰兒可評估單眼是否能中央、穩定並維持固視；遮較常用眼後看另一眼能否接管，解除遮蓋後是否立刻回到原眼，可提供 fixation preference 線索。", "強烈偏好一眼可能表示另眼較差，但也受斜視角、年齡、注意力與檢查方法影響。固視偏好不是精確視力值，也不能取代屈光、紅光反射和眼底檢查。"], "clinicalLink": "將固視模式與器質檢查一起看，判定是否需弱視治療及如何追蹤。", "pitfall": "不能從「能看人臉」直接宣稱視力至少 0.2。", "recall": {"question": "撤掉遮眼後立刻切回同一眼代表什麼？", "answer": "存在強固視偏好，需評估另眼視力和弱視風險，並非單項確診。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n04-amblyopia"]}, {"id": "c07", "title": "弱視治療先改善輸入，再改變使用機會", "pages": [10, 11, 19, 20, 21], "unitId": "u1", "sectionIndexes": [2], "terms": ["optical correction", "occlusion", "penalization", "atropine", "over-plus"], "keyPoints": ["先提供合適屈光矯正並處理視軸遮蔽；遮蓋 occlusion 是減少較好眼輸入，促使弱視眼使用。Atropine 懲罰以睫狀肌麻痺造成近距模糊，散瞳並非唯一機轉；over-plus 為光學懲罰策略之一。", "治療安排依年齡、嚴重度、矯正反應與配合度，需追蹤兩眼，避免逆向弱視。剝奪性病因可能緊急，但不能把所有介質問題都指定同一「出生一個月內」時間點，應由兒童眼科判斷。"], "clinicalLink": "視軸打通與眼鏡處理後，仍可能需要大腦視覺訓練的時間與追蹤。", "pitfall": "遮的是較好眼而非弱視眼；不能擅自全天遮蓋。", "recall": {"question": "Atropine 懲罰主要如何影響好眼？", "answer": "降低調節，使近距影像模糊，改變兩眼使用機會。"}, "relatedTopics": ["notes-02", "notes-06"], "sourceIds": ["n04-amblyopia", "n04-info-video"]}, {"id": "c08", "title": "治療年齡、依從性與停滯：可塑性不是開關", "pages": [10, 11, 19, 20, 21], "unitId": "u1", "sectionIndexes": [2], "terms": ["visual plasticity", "reverse amblyopia", "recurrence"], "keyPoints": ["早期視覺可塑性高，及時介入很重要；但七或八歲不是完全失去療效的硬界線。較大兒童尤其未完整治療者仍可能改善，幅度和既往經驗、起始視力等因素相關。", "改善停滯時核對戴鏡、遮蓋、偷看和檢查一致性，再重新考慮器質病。減量或停治後仍需觀察復發 recurrence；較好眼視力下降可能是逆向弱視 reverse amblyopia，需調整而非一味加碼。"], "clinicalLink": "與家長訂可執行的時程並追蹤雙眼，比責備孩子不努力更有效。", "pitfall": "不要承諾所有成人都可恢復正常，也不要說超過八歲毫無治療價值。", "recall": {"question": "十歲從未完整治療是否一定無效？", "answer": "不一定，需完整矯正與個別評估，不能只按年齡拒絕治療。"}, "relatedTopics": ["notes-14"], "sourceIds": ["n04-pedig", "n04-amblyopia"]}, {"id": "c09", "title": "單眼動作與六肌完整作用表", "pages": [12, 13, 14, 15, 19, 20, 21], "unitId": "u2", "sectionIndexes": [3], "terms": ["duction", "adduction", "abduction", "supraduction", "infraduction", "intorsion", "extorsion"], "keyPoints": ["Duction 描述單眼運動：adduction 內轉、abduction 外轉、supraduction 上轉、infraduction 下轉；intorsion 是眼球上極向鼻側旋，extorsion 向顳側旋。旋轉方向不可依面對病人的左右直覺判斷。", "MR 主內轉、LR 主外轉；SR 上轉兼內旋內轉，IR 下轉兼外旋內轉；SO 內旋兼下轉外轉，IO 外旋兼上轉外轉。LR6、SO4、其餘 III，將神經和作用配在一起記。"], "clinicalLink": "動作受限可來自神經、肌肉或機械限制，表格是定位起點。", "pitfall": "「上」肌內旋、「下」肌外旋指 SR/SO 與 IR/IO，不是所有上看或下看動作。", "recall": {"question": "上斜肌的三個作用？", "answer": "內旋、下轉、外轉；最佳測其下轉功能是在內轉位。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-cover"]}, {"id": "c10", "title": "肌肉幾何：為什麼內下看是在測上斜肌？", "pages": [12, 13, 14, 15, 19, 21], "unitId": "u2", "sectionIndexes": [3], "terms": ["diagnostic positions", "vertical rectus", "oblique muscles"], "keyPoints": ["肌肉拉力與視軸夾角改變，會改變垂直與旋轉分量。上、下直肌在外轉眼位較適合測上下動作；上、下斜肌在內轉位較能表現下轉與上轉，所以診斷眼位不等於單肌的所有作用方向。", "依同一原理，外上主要看 SR、外下看 IR、內上看 IO、內下看 SO。九方向眼位要比較雙眼、記錄頭位及是否有複視；只看正前方可錯過非共同性偏斜。"], "clinicalLink": "這個幾何連結讓 IV 麻痺與斜肌過動的表現可以推導。", "pitfall": "不能因 SO 有外轉作用，就只請病人向外下看檢查它。", "recall": {"question": "內上看主要觀察哪條垂直作用？", "answer": "下斜肌的上轉作用。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-cover"]}, {"id": "c11", "title": "Sherrington 與 Hering：同眼拮抗、雙眼協作", "pages": [12, 15, 19, 20], "unitId": "u2", "sectionIndexes": [3], "terms": ["Sherrington law", "Hering law", "yoke muscles", "version", "vergence"], "keyPoints": ["Sherrington 交互神經支配描述同眼主動肌收縮時拮抗肌相對放鬆；Hering 等量神經支配描述雙眼配對肌 yoke muscles 的共同驅動。例如向右看使用右 LR 與左 MR。", "Version 是雙眼同向，vergence 是相向的集合或發散；配對關係依注視方向而變。某肌無力時增加的共同神經驅動，可能使另一眼的配對肌表現過強，不能只按眼位外觀判定單一肌肉病理。"], "clinicalLink": "比較以哪隻眼固視下測得的偏斜，能幫助理解麻痺性斜視。", "pitfall": "Hering 是功能模型，實際運動也受融合和機械因素影響，不能當所有眼位的固定等式。", "recall": {"question": "向右看哪兩條肌是 yoke pair？", "answer": "右外直肌與左內直肌。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-cover"]}, {"id": "c12", "title": "感覺融合、horopter 與 Panum：深度從差異而來", "pages": [16, 17, 19], "unitId": "u1", "sectionIndexes": [3, 4], "terms": ["sensory fusion", "motor fusion", "corresponding retinal points", "horopter", "Panum fusion area", "stereopsis", "physiological diplopia"], "keyPoints": ["兩眼對應視網膜點有相近的視方向；空間中對應的軌跡可描述為 horopter。Panum 融合區容許小量視差，讓 sensory fusion 合為一個影像，也讓 stereopsis 利用雙眼差異形成深度知覺。", "Motor fusion 藉集合或發散調整眼位，協助影像落在可融合區。超出融合容許範圍可產生 physiological diplopia；正常觀看常忽略非注視物的雙影，不代表神經病變。"], "clinicalLink": "同時解釋「兩眼需對準」與「有一點差異才有深度」，不把融合當完全相同像。", "pitfall": "立體視不等於所有深度知覺；單眼仍可用透視、大小等線索。", "recall": {"question": "Panum 區內的微小視差有何用途？", "answer": "可在維持單一視覺的同時提供雙眼立體深度資訊。"}, "relatedTopics": ["notes-02"], "sourceIds": ["n04-cover", "n04-amblyopia"]}, {"id": "c13", "title": "抑制與 ARC：感覺適應不會長出新中央凹", "pages": [22, 23], "unitId": "u1", "sectionIndexes": [4], "terms": ["suppression", "anomalous retinal correspondence", "ARC", "diplopia"], "keyPoints": ["兒童斜視時，大腦可能抑制偏斜眼輸入 suppression，降低複視卻犧牲雙眼視功能。異常視網膜對應 ARC 是把一眼中央凹與另一眼非中央凹位置建立感覺對應，不是解剖長出新黃斑。", "抑制可隨視距與測試條件而改變；沒有主訴複視不等於眼位正常。成人新發斜視通常較難以同樣方式適應，病史中的年齡與病程可解釋症狀差異。"], "clinicalLink": "將兒童不抱怨雙影連到弱視篩檢，避免以無症狀作為不治療理由。", "pitfall": "不要把雙眼 ARC 與單眼偏心固視當成同一現象。", "recall": {"question": "孩子明顯斜視卻不說複視，可能為何？", "answer": "抑制或 ARC 等感覺適應，仍需測單眼視力與雙眼功能。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-amblyopia"]}, {"id": "c14", "title": "Worth 四點：先記鏡片，再解讀點數", "pages": [23, 24, 26, 31, 33, 34], "unitId": "u1", "sectionIndexes": [4], "terms": ["Worth four-dot", "fusion", "suppression", "diplopia"], "keyPoints": ["標準右紅左綠配置中，右眼見兩紅、左眼見三綠；合看四點可支持該測試條件下融合，兩點支持左眼抑制，三點支持右眼抑制，五點提示複視。先確認實際鏡片配置再套規則。", "遠近距離改變視標角度及所測抑制區，結果可能不同；四點本身不保證正常立體視，也可能需和 ARC 檢查合併解釋。測試要記距離、矯正與病人描述，不只寫陽性陰性。"], "clinicalLink": "眼位、Worth 和立體視三者測不同面向，彼此不矛盾。", "pitfall": "若紅綠眼鏡左右互換，不能照背「兩點是哪眼抑制」。", "recall": {"question": "右紅左綠看到三綠點表示什麼？", "answer": "右眼訊號在該條件下被抑制。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n04-cover"]}, {"id": "c15", "title": "Hirschberg 與 Krimsky：角膜反射不是精確角度表", "pages": [24, 28, 31, 33, 34, 46, 47, 48], "unitId": "u2", "sectionIndexes": [5], "terms": ["Hirschberg", "Krimsky", "prism diopter", "angle kappa"], "keyPoints": ["Hirschberg 以雙眼角膜光反射的位置比較粗估偏斜；正常反光不一定在瞳孔幾何中心，angle kappa 等個體差異會影響。Krimsky 加稜鏡使反光位置趨於對稱，適合難配合遮蓋測量時。", "稜鏡屈光度 Δ 與角度不是固定兩倍關係，不能把原稿的 15、30、45 度刻度當精密換算。能配合者以標準化遮蓋配稜鏡測量，並記錄遠近、矯正與注視方向。"], "clinicalLink": "兒童假性內斜可先看對稱反光，但仍要做遮蓋與視覺檢查。", "pitfall": "光點對稱支持沒有明顯斜視，不能單獨排除所有小角度或間歇性偏斜。", "recall": {"question": "Krimsky 比 Hirschberg 多了什麼？", "answer": "利用稜鏡中和反光偏移，提供量化估計。"}, "relatedTopics": ["notes-01", "notes-02"], "sourceIds": ["n04-cover"]}, {"id": "c16", "title": "遮蓋測試：顯斜、解離角與中和方向", "pages": [25, 27, 31], "unitId": "u2", "sectionIndexes": [5], "terms": ["cover-uncover", "alternate cover", "prism cover test", "tropia", "phoria"], "keyPoints": ["Cover-uncover 時觀察未遮眼是否重新固視，辨認顯性偏斜；交替遮蓋持續打破融合，測得解離後總偏斜。Tropia 平常可呈現，phoria 需破壞融合才暴露，因此兩種測法不可互換。", "稜鏡遮蓋測試逐步中和重新固視的移動；看到向外移是該眼原來偏內，向內移則原來偏外。需確保目標具調節刺激且病人真的注視，才能比較遠近角度。"], "clinicalLink": "先自然雙眼、再單眼遮蓋、再交替解離，保留融合狀態資訊。", "pitfall": "不以「用正常眼」作固定前提；有交替斜視時兩眼都可能固視。", "recall": {"question": "遮左眼後右眼向內移動，原本右眼偏哪？", "answer": "原本向外偏，移內是重新固視。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n04-cover"]}, {"id": "c17", "title": "Double Maddox、集合近點與 AC/A", "pages": [24, 26, 31, 33, 34], "unitId": "u2", "sectionIndexes": [6], "terms": ["double Maddox rod", "cyclodeviation", "near point of convergence", "AC/A"], "keyPoints": ["Double Maddox rod 把點光轉成線，透過旋轉鏡桿讓兩線平行，量化主觀旋轉偏斜 cyclodeviation。它測的是病人感受到的旋轉，不可直接替代所有客觀眼底旋轉測量。", "集合近點是維持單一近距目標的最近能力；AC/A 為每一屈光度調節帶來的調節性集合量。測量方法、年齡、目標與矯正均影響結果，近內斜較遠大提示高 AC/A，但不能只靠單一距離差確診。"], "clinicalLink": "近距症狀需把調節需求與集合能力分開分析。", "pitfall": "原稿 8–10 公分不是不分年齡與測法的絕對界線。", "recall": {"question": "Double Maddox rod 主要量什麼？", "answer": "主觀內旋或外旋偏斜，而非水平內外斜角。"}, "relatedTopics": ["notes-02", "notes-03"], "sourceIds": ["n04-cover", "n04-accommodative-integrated"]}, {"id": "c18", "title": "輪廓與隨機點立體視：如何避免用單眼猜中", "pages": [26, 31, 33, 34], "unitId": "u2", "sectionIndexes": [3, 4, 6], "terms": ["contour stereopsis", "random-dot stereogram", "stereoacuity"], "keyPoints": ["輪廓式 contour 立體視測試有容易辨認的圖形，部分測項可能提供單眼線索；random-dot 把形狀藏在兩眼視差中，降低單眼依圖案猜測的可能。立體視閾值常以角秒錶示，越小代表可辨識越細的視差。", "需確認眼鏡與測距正確、孩子理解任務，並分辨「找到形狀」與真正雙眼融合。視力、眼位與抑制會影響測試，所以結果可用於追蹤斜視控制，而非只作一次標籤。"], "clinicalLink": "間歇性外斜追蹤時加入立體視，可看到角度以外的感覺功能變化。", "pitfall": "輪廓圖猜對不必然等於正常雙眼立體視。", "recall": {"question": "隨機點設計主要減少哪一種誤判？", "answer": "利用單眼輪廓線索猜中、誤以為具有立體視。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n04-cover"]}, {"id": "c19", "title": "斜視分類：三個互相獨立的維度", "pages": [27, 31, 32], "unitId": "u2", "sectionIndexes": [6], "terms": ["phoria", "intermittent tropia", "tropia", "esodeviation", "exodeviation", "hyperdeviation", "hypodeviation", "cyclodeviation", "comitant", "incomitant"], "keyPoints": ["融合狀態可分隱斜、間歇顯斜與持續顯斜；方向可分內、外、上、下以及旋轉偏斜。描述時再加上哪隻眼、遠近與控制情況，避免只報「斜視」而失去臨床資訊。", "Comitant 指不同注視方向偏斜角大致相近，incomitant 則角度隨方向改變。前者不等於一定先天，後者也不等於一定後天；神經麻痺、限制、先天支配異常均可造成非共同性。"], "clinicalLink": "新發共同性內斜仍須依病程與神經徵象評估，不能以分類降低警覺。", "pitfall": "把共同性當先天、非共同性當後天是來源過度簡化。", "recall": {"question": "「右眼間歇性外斜」描述了哪些維度？", "answer": "眼別、顯現頻率／融合狀態與水平偏斜方向。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-cover"]}, {"id": "c20", "title": "假性內斜：面部外觀與真正固視偏移", "pages": [28, 31, 46, 47, 48], "unitId": "u3", "sectionIndexes": [7], "terms": ["pseudoesotropia", "epicanthal fold", "nasal bridge"], "keyPoints": ["寬平鼻樑和內眥贅皮 epicanthal fold 遮住鼻側眼白，可產生內斜錯覺；眼距外觀也會加強此印象。角膜光反射對稱、遮蓋未見重新固視支持假性內斜。", "仍須看屈光、單眼視力與眼底，並詢問在何種注視或疲勞時出現；一次正常檢查不能完全排除間歇性斜視。以發育與追蹤解釋家長疑慮，避免單靠照片下結論。"], "clinicalLink": "把眼瞼章的內眥贅皮與此處功能測試相連，說明外觀不等於眼位。", "pitfall": "假性不代表以後不會出現真斜視；有新變化應再評估。", "recall": {"question": "如何用功能檢查支持假性內斜？", "answer": "對稱角膜反光及遮蓋時沒有重新固視移動，再核對完整眼科檢查。"}, "relatedTopics": ["notes-11"], "sourceIds": ["n04-cover"]}, {"id": "c21", "title": "嬰兒型內斜與交叉固視", "pages": [28, 31, 46, 47, 48], "unitId": "u3", "sectionIndexes": [7], "terms": ["infantile esotropia", "cross fixation"], "keyPoints": ["嬰兒型內斜通常早在六個月內出現，常為大角度。Cross fixation 是以右眼看左側、左眼看右側，可能讓外轉看似不佳；必須分眼檢查，不能直接診斷雙側 VI 麻痺。", "先評估屈光、弱視與伴隨垂直偏斜；眼位手術時機需兼顧雙眼視發育和個別狀況。早期矯正眼位不等於治好了所有視力問題，戴鏡與弱視治療仍可能需要。"], "clinicalLink": "用交叉固視解釋雙眼時少外轉、單眼時卻能外轉的差異。", "pitfall": "嬰兒內斜不是所有病例都無其他疾病，也不能套所有人同一手術期限。", "recall": {"question": "交叉固視為何可能假裝成外轉麻痺？", "answer": "孩子可換用另眼看側方而不需原眼外轉，須破壞此代償再測。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-amblyopia", "n04-cover"]}, {"id": "c22", "title": "屈光性調節內斜：遠視需求如何帶動集合", "pages": [29, 32, 46, 47, 48], "unitId": "u3", "sectionIndexes": [7], "terms": ["refractive accommodative esotropia", "hyperopia", "normal AC/A"], "keyPoints": ["未矯正遠視需要額外調節以看清，調節伴隨集合，若融合性發散不足以抵消即可出現內斜。屈光性調節內斜通常 AC/A 不特別高，戴足適當遠視矯正後遠近眼位可改善。", "先作睫狀肌麻痺驗光並按處方配鏡，在矯正下判斷剩餘角度；若仍有非調節性成分，才討論其他處理。手術不消除遠視，摘鏡內斜仍可能存在，需向家長說清楚。"], "clinicalLink": "影像清晰度、調節需求與眼位形成同一條機轉鏈。", "pitfall": "原稿把創傷或生病當常見必要起因，不能作診斷條件。", "recall": {"question": "戴鏡正位、脫鏡內斜是否表示治療失敗？", "answer": "不是，可能正是眼鏡減少調節性集合的效果。"}, "relatedTopics": ["notes-02"], "sourceIds": ["n04-accommodative-integrated"]}, {"id": "c23", "title": "高 AC/A 與部分調節性內斜：先量矯正後的差異", "pages": [29, 30, 32], "unitId": "u3", "sectionIndexes": [6, 7], "terms": ["high AC/A", "nonrefractive accommodative esotropia", "bifocal", "partially accommodative esotropia"], "keyPoints": ["高 AC/A 表示同量調節帶來較多集合，因此近距內斜可能大於遠距；非屈光性調節內斜強調這個關係，不是說完全沒有屈光不正。需在適當矯正與一致目標下測遠近角。", "部分調節性內斜是戴鏡後仍有殘餘偏斜；選定患者可評估近用附加度數／雙焦鏡或手術等策略。原稿的長效膽鹼酯酶抑制劑屬歷史治療，不能解釋成單純讓睫狀肌放鬆或當今日一般首選。"], "clinicalLink": "治療理由應明確指出要減少調節需求，還是處理殘餘固定角度。", "pitfall": "不能從遠視度數大小單獨推定 AC/A，也不能只憑近角大便決定雙焦鏡。", "recall": {"question": "戴全矯正還有內斜，接下來要區分什麼？", "answer": "高 AC/A 的近距成分與非調節性的殘餘偏斜。"}, "relatedTopics": ["notes-02"], "sourceIds": ["n04-accommodative-integrated"]}, {"id": "c24", "title": "非調節性與非共同性內斜：追問視力、手術與限制", "pages": [30, 32, 46, 48], "unitId": "u3", "sectionIndexes": [7, 9, 10], "terms": ["basic esotropia", "sensory esotropia", "consecutive esotropia", "CN VI palsy", "heavy eye syndrome"], "keyPoints": ["Basic 非調節性內斜不隨光學矯正完全消失；sensory 內斜伴單眼視力不佳，先尋病因；consecutive 內斜可在外斜手術後發生，需區分可預期變化與滑脫肌等併發症。", "非共同性內斜可來自 VI 麻痺、TED 的內直肌限制、內側眶壁骨折夾困，或高度近視的眼眶肌肉路徑改變（heavy eye syndrome）。Duane 或 Möbius 也可能早年就外轉不足。"], "clinicalLink": "按時間軸加九方向眼位與被動限制線索，避免把所有內斜只配遠視眼鏡。", "pitfall": "術後突然大偏斜和明顯運動缺失不能一概等它自行好。", "recall": {"question": "感覺性內斜的第一個問題是什麼？", "answer": "為何該眼視力差；先檢查器質或屈光病因。"}, "relatedTopics": ["notes-03", "notes-08"], "sourceIds": ["n04-duane-coverage", "n04-moebius-coverage"]}, {"id": "c25", "title": "間歇性外斜：角度、控制力與感覺功能", "pages": [35, 44, 46, 47, 48], "unitId": "u3", "sectionIndexes": [8], "terms": ["intermittent exotropia", "control", "stereoacuity"], "keyPoints": ["間歇外斜常在疲勞、發呆、看遠或注意力下降時顯現，專注時可由融合拉回。評估不只量最大角度，還要問發生頻率、重新對準能力、近遠差異與立體視是否改變。", "可依情況觀察、矯正屈光或考慮手術；弱視相較某些持續斜視較少見，不代表不會發生。追蹤單眼視力與雙眼控制，可避免只因一次門診眼位正就認定沒有問題。"], "clinicalLink": "讓家長描述日常頻率，結合標準化診間測量。", "pitfall": "手術時機不能只由年齡或一個稜鏡角度決定。", "recall": {"question": "為何間歇性外斜要量立體視？", "answer": "它反映雙眼感覺功能，可補足角度與外觀未呈現的變化。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n04-cover", "n04-amblyopia"]}, {"id": "c26", "title": "持續性外斜：先天、感覺、術後和神經肌肉", "pages": [35, 36, 44, 46, 48], "unitId": "u3", "sectionIndexes": [8, 10], "terms": ["infantile exotropia", "sensory exotropia", "consecutive exotropia", "exotropic Duane"], "keyPoints": ["嬰兒期持續外斜需評估視覺發育及伴隨神經或顱顏異常；sensory 外斜來自單眼低視力後失去融合，consecutive 外斜則發生在原內斜處理後。分類需要時間與既往手術資料。", "外斜也可能伴 Duane、III 麻痺、INO 或重症肌無力；有下垂、可變動作限制或神經症狀時，不能只照一般外斜角度規劃手術。先處理病因與視力，再談眼位。"], "clinicalLink": "同樣向外偏，治療取決於為何無法融合或內轉。", "pitfall": "原稿的嬰兒外斜合併發展遲緩病例是示例，不代表外觀能判斷認知功能。", "recall": {"question": "成人外斜加新下垂，為何不能只當感覺性外斜？", "answer": "需排除 III 麻痺或神經肌肉接點等病因。"}, "relatedTopics": ["notes-03", "notes-11"], "sourceIds": ["n04-duane-coverage", "n04-amblyopia"]}, {"id": "c27", "title": "IOOA 與 SOOA：描述過度動作，再找原因", "pages": [37, 44], "unitId": "u3", "sectionIndexes": [8], "terms": ["inferior oblique overaction", "IOOA", "superior oblique overaction", "SOOA", "A pattern", "V pattern"], "keyPoints": ["IOOA 描述內轉時過度上轉，可見於嬰兒型斜視或伴上斜肌功能不足等情境；SOOA 描述內轉時過度下轉。這是臨床動作型態，未必表示該肌本身真的肥大或獨立病變。", "需同時看第一眼位垂直差、頭位、旋轉及上下看時水平偏斜的 A／V pattern。治療依雙眼功能、症狀與完整動作分析，不能用「只要正前方也上飄就剪斷」作通用規則。"], "clinicalLink": "與 IV 麻痺章連讀，分清原發過動和繼發相對過動。", "pitfall": "原發／繼發要由合併徵象判斷，不能單以兒童或成人斷定。", "recall": {"question": "內轉時過度下轉主要描述什麼？", "answer": "SOOA 型態；仍需完整眼位評估病因和臨床影響。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-cover"]}, {"id": "c28", "title": "眶底夾困與 forced duction：被動限制不是神經診斷", "pages": [33, 34, 38, 39, 44, 45, 46, 47], "unitId": "u3", "sectionIndexes": [9], "terms": ["orbital floor fracture", "forced duction", "infraorbital hypoesthesia", "oculocardiac reflex", "enophthalmos"], "keyPoints": ["眶底骨折可伴上轉受限、眶下神經感覺下降和眼球內陷；兒童 trapdoor 夾困外觀可能輕微，卻有噁心、心搏過緩等眼心反射。此時需要及時眼眶專科評估，不能把嘔吐只當頭部撞擊後不適。", "Forced duction 測被動移動是否有阻力，陽性支持機械限制；陰性不自動證明單一神經麻痺，仍須考慮檢查條件與其他病因。操作由專業人員在適當條件下進行，先排眼球開放傷。"], "clinicalLink": "把運動障礙與全身反射連起來，才不會低估兒童骨折。", "pitfall": "被動牽拉不是要求病人自己用力看，也不是每個眼傷都能立即操作。", "recall": {"question": "受傷後上轉卡住、噁心、心跳慢代表什麼？", "answer": "可能眼外肌夾困及眼心反射，需及時專科處理。"}, "relatedTopics": ["notes-08", "notes-14"], "sourceIds": ["n04-floor-coverage"]}, {"id": "c29", "title": "Duane：內轉時共同收縮與三型", "pages": [30, 35, 40, 41, 44], "unitId": "u2", "sectionIndexes": [10], "terms": ["Duane syndrome", "CCDD", "globe retraction", "upshoot", "downshoot"], "keyPoints": ["Duane 屬先天顱神經支配異常，外直肌神經發育及異常支配可使內、外直肌在內轉時共同收縮，出現眼球後縮、眼裂變窄，部分伴 upshoot 或 downshoot。這個特徵比單純外轉差更有辨識價值。", "I 型以外轉受限為主，II 型以內轉受限為主，III 型兩者皆受限；型別依臨床動作，不由表格推定每條神經一定有或沒有發育。處理看第一眼位、異常頭位、後縮與雙眼功能。"], "clinicalLink": "先天外轉不足若伴內轉後縮，要改走 CCDD 鑑別。", "pitfall": "不能把 Duane 一律當新發 VI 麻痺，也不能承諾手術恢復正常神經支配。", "recall": {"question": "內轉眼裂變窄的機轉是什麼？", "answer": "異常共同收縮把眼球拉向後方。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-duane-coverage"]}, {"id": "c30", "title": "Möbius 與 CFEOM：眼位只是全身表現的一部分", "pages": [30, 40], "unitId": "u2", "sectionIndexes": [10], "terms": ["Möbius syndrome", "Moebius", "congenital fibrosis of extraocular muscles", "CFEOM"], "keyPoints": ["Möbius 典型涉及先天非進行性顏面無力及外轉障礙，常與 VI、VII 路徑相關；閉眼不全還增加角膜暴露風險。需看餵食、吞嚥、四肢與其他發展表現，不能只處理斜視角。", "CFEOM 雖名為先天眼外肌纖維化，其重要背景是運動神經發育和支配異常，可有明顯下垂與限制性眼動，常以抬下巴代償。依型態及家族史安排遺傳與系統評估。"], "clinicalLink": "跨到眼瞼章檢查閉合與角膜保護，將視軸、眼動和神經發育整合。", "pitfall": "不要把先天固定性限制直接當後天甲狀腺眼病，也勿由不會微笑推論理解能力。", "recall": {"question": "Möbius 為何也需要注意角膜？", "answer": "VII 相關閉眼及眨眼不足可造成暴露。"}, "relatedTopics": ["notes-03", "notes-11"], "sourceIds": ["n04-moebius-coverage", "n04-cfeom-coverage"]}, {"id": "c31", "title": "Brown、TED 與 MG：三種不同的「眼睛轉不動」", "pages": [30, 35, 40], "unitId": "u3", "sectionIndexes": [9, 10], "terms": ["Brown syndrome", "thyroid eye disease", "myasthenia gravis"], "keyPoints": ["Brown syndrome 涉及上斜肌肌腱／滑車機制限制，內轉位上轉困難較典型；不是下斜肌一定麻痺。TED 可使眼外肌受限，常需找眼瞼後縮、突眼與影像；病人甲狀腺功能正常也不能單獨排除。", "MG 是神經肌肉接點傳遞異常，眼動和下垂常可變且疲勞，瞳孔一般不受影響；它可模仿多種神經麻痺。按限制型、眶內病變與可變無力三條線追證據，比僅描述角度更接近病因。"], "clinicalLink": "同一內上看不足，配合頭位、眼瞼、疲勞與被動限制，鑑別會不同。", "pitfall": "不能把眼動受限全部當一條肌肉需要加強。", "recall": {"question": "Brown 與 IO 麻痺最核心不同？", "answer": "前者是上斜肌肌腱／滑車相關機械限制，後者是主動肌作用不足。"}, "relatedTopics": ["notes-03", "notes-08", "notes-11"], "sourceIds": ["n04-brown-coverage"]}, {"id": "c32", "title": "SOM 與眼動失用：看時間尺度和啟動方式", "pages": [40], "unitId": "u2", "sectionIndexes": [10], "terms": ["superior oblique myokymia", "oscillopsia", "oculomotor apraxia", "head thrust"], "keyPoints": ["Superior oblique myokymia（SOM）是間歇單眼細小垂直／旋轉運動，可使影像閃動或晃視 oscillopsia，與單純眼皮肌纖維顫動不同。發作短暫，檢查間期可能正常，需要記錄觸發與方向。", "Oculomotor apraxia 是啟動眼動、尤其水平掃視的困難；兒童可能用快速轉頭 head thrust 補償。需神經發展評估與適當影像，並追蹤合併屈光、斜視和弱視，而非只教孩子少轉頭。"], "clinicalLink": "從動作是否可啟動、是否短暫振盪，將少見病放入可推理的分類。", "pitfall": "不要用「眼皮跳」概括病人真正的單眼影像晃動。", "recall": {"question": "用快速轉頭才看向側方的孩子可能哪個系統有問題？", "answer": "掃視啟動控制，需評估 oculomotor apraxia 及相關發展病因。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-som-coverage", "n04-oma-coverage"]}, {"id": "c33", "title": "斜視手術的目標與時機：眼位之外還要問功能", "pages": [42, 44, 45, 46, 47, 48], "unitId": "u3", "sectionIndexes": [11], "terms": ["diplopia", "abnormal head position", "asthenopia", "binocular function"], "keyPoints": ["手術可為了減少複視、異常頭位、視覺疲勞 asthenopia，改善雙眼使用和生活外觀；兒童還需考慮視覺發育。症狀、角度穩定性、屈光與病因共同決定時機，不應把所有斜視性弱視都列為立即手術急症。", "弱視的光學和遮蓋／懲罰治療仍重要，眼位改善不會自動恢復已受影響的感覺功能。與患者說明目標、殘餘偏斜和再次處理可能，並評估術後是否仍需眼鏡或稜鏡。"], "clinicalLink": "面試答題可按視力、眼位、複視／頭位、雙眼視與生活五項設定療效。", "pitfall": "不要把手術貶為只有美容，也不要承諾一次解決所有視覺問題。", "recall": {"question": "為何斜視手術後仍可能需要遮蓋？", "answer": "眼位與發育性弱視處理不同環節，視力仍需個別治療。"}, "relatedTopics": ["notes-02"], "sourceIds": ["n04-info-video", "n04-amblyopia"]}, {"id": "c34", "title": "Recession、resection 與 transposition：改的是哪個力？", "pages": [42, 43, 45, 46, 47, 48], "unitId": "u3", "sectionIndexes": [11], "terms": ["recession", "resection", "transposition", "insertion", "length-tension"], "keyPoints": ["Recession 將止點後移，通常減弱作用；resection 縮短肌肉後重新附著，通常增強作用。這些改變肌肉的長度張力與轉動力矩，但劑量效果依肌肉、病因與既往手術而變。", "Transposition 將有功能肌肉的作用方向重新安排，以補部分缺失動作；不是把無神經支配的肌肉重新長好。原稿移位示圖與文字描述不一致，應學原理，不據該圖指定某一肌一定如何移位。"], "clinicalLink": "把術式與想減弱、增強或改向的功能相連，再理解為何仍可能有殘餘限制。", "pitfall": "Recession 不是增強，resection 不是減弱；避免只背中文「縮短」而混淆提肌手術。", "recall": {"question": "移位術能否完全取代麻痺肌？", "answer": "通常只能重新分配作用改善部分眼位或運動，不能保證恢復全部生理功能。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n04-info-video"]}], "unresolved": [], "sourceSha256": "cffed30d8d27954217e545fd0e0955fd6866c4a45a3afdf4e96d0b4b41d2bb4e"}, "notes-05": {"sourceFile": "眼科學No.05.pdf", "pageCount": 54, "reviewedPages": [{"from": 1, "to": 3, "kind": "administrative", "note": "封面、目錄與課堂回饋；不收錄姓名或私人意見"}, {"from": 4, "to": 25, "kind": "teaching", "note": "角膜結構、感染、免疫、暴露、神經滋養與外傷及重點整理"}, {"from": 26, "to": 31, "kind": "exam", "note": "感染風險、神經滋養、移植與外傷考題及解析；依現行知識校正"}, {"from": 32, "to": 50, "kind": "teaching", "note": "藥物、失養、移植、沉積、化學傷與鞏膜；含圖片頁46"}, {"from": 51, "to": 54, "kind": "exam", "note": "化學傷、鞏膜炎及相關全身檢查考題與解析"}], "entries": [{"id": "c01", "title": "五層、裂隙燈與前節OCT看到的不是同一種切片", "pages": [4, 5, 25], "unitId": "u1", "sectionIndexes": [0], "terms": ["上皮", "Bowman層", "基質", "Descemet膜", "內皮", "AS-OCT"], "keyPoints": ["角膜由外向內為上皮、Bowman層、基質、Descemet膜及內皮。上皮形成屏障，基質負責大部分厚度與規則膠原排列，內皮以屏障與幫浦維持適當含水量。", "裂隙燈光學切片與AS-OCT提供位置及厚度資訊，但一般臨床影像不能保證把五個組織學層次逐一解析。Bowman受傷可能留下疤痕；Descemet與內皮失效則可引起水腫。"], "clinicalLink": "看到混濁先定位深度，才能判斷是表面修復、基質疤痕或內皮功能的問題。", "pitfall": "不要將AS-OCT的每一條亮線直接等同單一組織層。", "recall": {"question": "角膜混濁為何不能直接叫感染？", "answer": "水腫、疤痕及沉積也會混濁，須結合層次、上皮缺損及浸潤判讀。"}, "relatedTopics": ["notes-01"], "sourceIds": ["cov05-dmek", "an05-bacterial"]}, {"id": "c02", "title": "支撐、透明、曲率：三個不同的治療終點", "pages": [5, 6, 7, 8, 9], "unitId": "u1", "sectionIndexes": [0, 9], "terms": ["tectonic", "optical", "不規則散光", "羊膜"], "keyPoints": ["角膜的支撐功能維持眼球封閉；光學功能則同時依賴透明度、適當屈光力與平滑規則的表面。上皮閉合或穿孔被補住後，仍可能因疤痕、變平或不規則散光而視力很差。", "羊膜可提供上皮修復支架並調整發炎環境；組織膠、補片、板層或全層移植各有適用情境。先保住結構，再評估光學重建，不能從一張術後照片承諾視力恢復。"], "clinicalLink": "口試報告要分別回答「眼球是否完整」和「為何仍看不清楚」。", "pitfall": "修復封閉不等於恢復正常屈光力；表面不規則也不必然等於單纯近視。", "recall": {"question": "補洞後仍只能數手指，優先重新分析什麼？", "answer": "透明度、曲率、表面規則性與其他眼內病變。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an05-mooren", "cov05-dmek"]}, {"id": "c03", "title": "免疫豁免不等於免疫空白", "pages": [5, 6, 25], "unitId": "u1", "sectionIndexes": [0, 1], "terms": ["immune privilege", "ACAID", "Fas ligand", "抗原呈現細胞", "先天免疫"], "keyPoints": ["角膜缺少血管與淋巴管，以及局部免疫調節訊號，降低異體免疫反應；Fas ligand與前房相關免疫偏離ACAID是理解機轉的線索。這是相對免疫豁免，並非角膜不會發炎。", "眼瞼、眨眼、淚膜、上皮緊密連結與細胞脫落提供先天防禦；角膜也有抗原呈現細胞及適應性免疫。新生血管、感染或既往排斥會增加移植風險，常規不做HLA配對也不代表不需術後免疫管理。"], "clinicalLink": "把感染防禦與移植排斥放在同一條「保透明但仍需免疫監視」的脈絡。", "pitfall": "不可照抄「角膜不產生發炎反應」或「周邊APC絕不影響移植」。", "recall": {"question": "為何角膜移植仍可能排斥？", "answer": "相對免疫豁免可被發炎及血管新生打破，移植物仍含抗原。"}, "relatedTopics": ["notes-09"], "sourceIds": ["cov05-rejection"]}, {"id": "c04", "title": "染色、潰瘍、融解與穿孔要逐項描述", "pages": [6, 7, 8, 9, 15, 16, 25, 27, 30], "unitId": "u3", "sectionIndexes": [2, 4, 7], "terms": ["fluorescein", "上皮缺損", "基質浸潤", "keratolysis", "iris prolapse"], "keyPoints": ["螢光素在適當藍光下呈綠色，標示屏障缺損；浸潤是基質炎症，融解是組織逐步變薄。潰瘍一般包含上皮缺損和下方基質病變，單純染色不能證明感染，也不能量出剩餘厚度。", "前房突然變淺、瞳孔牽拉或虹膜脫出提示全層破裂。小面積上皮缺損下方仍可能深度融解；懷疑穿孔應避免壓迫、眼壓測量與自行觸碰脫出組織，緊急交由眼科處理。"], "clinicalLink": "將位置、面積、深度、變薄、前房和視力串成可追蹤報告。", "pitfall": "綠染面積小不代表穿孔風險低。", "recall": {"question": "前房近乎消失加黑色組織嵌入角膜代表什麼？", "answer": "須懷疑虹膜堵住角膜穿孔，先保護眼球並緊急處置。"}, "relatedTopics": [], "sourceIds": ["an05-bacterial", "an05-trauma"]}, {"id": "c05", "title": "接觸鏡感染：從使用習慣到綠膿桿菌", "pages": [10, 25, 26, 27, 28, 29, 30], "unitId": "u2", "sectionIndexes": [2], "terms": ["隱形眼鏡", "Pseudomonas aeruginosa", "生理食鹽水", "過夜配戴"], "keyPoints": ["接觸鏡破壞眼表防禦且能攜帶病原；過夜、配戴時間過長和清潔不足會提高感染風險。綠膿桿菌是重要致病菌，但接觸鏡史並不能排除真菌或棘阿米巴。", "生理食鹽水不能代替消毒液，鏡片與鏡盒也不應接觸自來水。紅痛、畏光、視力下降或白色浸潤需停戴並立即評估；中央、較大、深或非典型病灶須考慮採樣後及時治療。"], "clinicalLink": "問「如何洗、如何存、戴著做什麼」比只問有沒有戴鏡更有用。", "pitfall": "治療後短期變白不能自動解釋成細菌釋毒；客觀惡化需重評。", "recall": {"question": "接觸鏡病人中央潰瘍要等培養嗎？", "answer": "適當採樣與緊急抗感染處置並行，不能等待結果才處理。"}, "relatedTopics": [], "sourceIds": ["an05-bacterial", "an05-culture"]}, {"id": "c06", "title": "水接觸、疼痛與棘阿米巴的非典型表現", "pages": [11, 25], "unitId": "u2", "sectionIndexes": [2], "terms": ["Acanthamoeba", "角膜塑型片", "環形浸潤", "神經周圍浸潤"], "keyPoints": ["棘阿米巴可由受污染水接觸鏡片或眼表而進入角膜，角膜塑型片亦須問清潔及過夜習慣。疼痛與外觀不成比例、神經周圍浸潤或較晚出現的環形浸潤是線索，早期未必典型。", "診斷可結合刮片、培養、PCR或共軛焦影像。病程可長且需密切追蹤；棘阿米巴會造成上皮缺損、基質潰瘍甚至穿孔，原共筆「不像細菌會造成潰瘍」不能當排除依據。"], "clinicalLink": "抗細菌治療反應差時，重建水接觸史並擴大病原檢測。", "pitfall": "沒有環形浸潤或沒有劇痛都不能排除。", "recall": {"question": "角膜塑型片用自來水清洗，應補想哪個病原？", "answer": "棘阿米巴，但仍須用臨床與檢驗確認並保留其他病原。"}, "relatedTopics": [], "sourceIds": ["cov05-acanth"]}, {"id": "c07", "title": "植物性外傷、絲狀真菌與酵母菌", "pages": [10, 11, 25, 28, 29, 31], "unitId": "u2", "sectionIndexes": [2], "terms": ["Fusarium", "Aspergillus", "Candida", "羽毛狀邊界", "衛星病灶"], "keyPoints": ["植物性外傷讓Fusarium及Aspergillus等絲狀真菌更值得考慮；慢性病眼或受損眼表也可能出現Candida感染。羽毛狀浸潤邊緣、衛星病灶或深層病灶是提示，而非單憑照片即可鑑種。", "採樣應告知真菌疑慮，檢驗與臨床反應互相驗證。藥物無法控制、持續向角膜緣擴大或穿孔時，可能需要治療性角膜移植；這和感染平息後改善視力的光學移植不同。"], "clinicalLink": "把「清除感染」與「恢復透明光學」分成不同手術目標。", "pitfall": "共筆把活動真菌感染一概列為移植禁忌，會漏掉救援性移植。", "recall": {"question": "真菌潰瘍已穿孔，是否一定不能移植？", "answer": "不是；可需補片或治療性移植並持續抗真菌管理。"}, "relatedTopics": [], "sourceIds": ["cov05-fungal"]}, {"id": "c08", "title": "術後與慢性眼表的非典型病原", "pages": [10, 25], "unitId": "u2", "sectionIndexes": [2], "terms": ["非結核分枝桿菌", "NTM", "革蘭陽性球菌", "革蘭陰性桿菌"], "keyPoints": ["手術、角膜縫線或慢性眼表病使上皮屏障異常，除常見革蘭陽性球菌和陰性桿菌外，也要考慮較少見病原。非結核分枝桿菌可在術後呈現慢性或不典型浸潤，不能只照一般急性細菌潰瘍預期追蹤。", "抗感染反應差時應核對既往手術、用藥、採樣深度及培養需求，而非无限追加同種滴藥。慢性眼表病與感染可同時存在，乾眼或暴露病史不能使新白色浸潤失去急迫性。"], "clinicalLink": "將危險因子轉化為給微生物室的具體問題。", "pitfall": "風險因子只改變機率，不直接證明病原。", "recall": {"question": "術後慢性浸潤為何需要重新採檢？", "answer": "先前治療可能遮蔽表現，非典型病原與深層病灶需要合適檢體。"}, "relatedTopics": [], "sourceIds": ["an05-bacterial", "an05-culture"]}, {"id": "c09", "title": "HSV上皮病：樹枝與地圖形缺損", "pages": [12, 13], "unitId": "u2", "sectionIndexes": [3], "terms": ["HSV", "dendritic ulcer", "terminal bulbs", "geographic ulcer", "corneal vesicles"], "keyPoints": ["HSV活動性上皮病可由小泡發展為末端膨大的樹枝狀缺損；缺損擴大可呈地圖狀，也可有周邊上皮潰瘍。病灶的位置和染色形狀需與角膜感覺、既往復發史一併判讀。", "活動性上皮感染以抗病毒處置為核心，不能自行加入類固醇；不當類固醇可能加重上皮病。病毒消退後仍可能留下神經滋養性缺損，因此久不癒合不必然表示病毒複製持續。"], "clinicalLink": "先分辨活動病毒與修復失敗，再決定下一步。", "pitfall": "看到所有樹枝狀線條都直接當HSV，可能漏掉假樹枝或棘阿米巴。", "recall": {"question": "樹枝狀潰瘍與地圖狀潰瘍有何關係？", "answer": "地圖狀可由上皮病灶擴大形成，須避免未受控感染時自行類固醇。"}, "relatedTopics": [], "sourceIds": ["cov05-hsv"]}, {"id": "c10", "title": "HSV基質炎與內皮炎：相似紅眼、不同層次", "pages": [12, 13], "unitId": "u2", "sectionIndexes": [3], "terms": ["immune stromal keratitis", "necrotizing stromal keratitis", "endotheliitis", "disciform", "diffuse", "linear"], "keyPoints": ["免疫性基質炎以基質發炎為主；壞死性基質炎可伴活動感染、組織變薄與穿孔。內皮炎可呈盤狀、瀰漫或線狀表現，內皮失能引起水腫，需觀察角膜後沉著與眼壓。", "基質或內皮炎可能需在抗病毒保護與專科追蹤下使用抗發炎治療，與活動性上皮潰瘍的處理不同。病灶是否有上皮缺損、壞死或前房反應，會改變藥物決策。"], "clinicalLink": "同一病人可同時有多層病變，不能只用「有沒有HSV」選藥。", "pitfall": "不能將所有HSV角膜病都寫成禁類固醇，亦不能無抗病毒保護自行用藥。", "recall": {"question": "HSV內皮炎為何視力模糊？", "answer": "內皮幫浦與屏障功能受損造成水腫，而非一定有巨大上皮缺損。"}, "relatedTopics": ["notes-09"], "sourceIds": ["cov05-hsvlayers", "cov05-hsv"]}, {"id": "c11", "title": "HZO：皮膚分布、Hutchinson徵與遲發併發症", "pages": [13, 14, 25, 27, 30], "unitId": "u2", "sectionIndexes": [3], "terms": ["VZV", "HZO", "V1", "nasociliary nerve", "Hutchinson sign", "pseudodendrite"], "keyPoints": ["眼帶狀皰疹沿三叉神經第一支V1分布，常為單側額頭、眼瞼或鼻部疼痛與疹子。鼻睫神經分布的鼻尖病灶稱Hutchinson徵，提示眼部侵犯風險較高；陰性也不能排除眼病。", "角膜可見無典型末端膨大的假樹枝，並可能出現葡萄膜炎或角膜感覺下降。年輕人也會發病；皮疹改善後仍應注意神經滋養性潰瘍，治療與追蹤不能只看皮膚。"], "clinicalLink": "紅痛眼檢查要延伸到額頭與鼻尖，並連結瞳孔、眼壓、前房。", "pitfall": "不要將V1誤記成V2，也不要把有無鼻尖疹當唯一轉診門檻。", "recall": {"question": "HZO後眼睛不痛卻有缺損，想到什麼？", "answer": "病毒損及角膜感覺後的神經滋養性病變，也需排感染。"}, "relatedTopics": ["notes-03", "notes-09"], "sourceIds": ["cov05-hzo", "an05-neurotrophic"]}, {"id": "c12", "title": "周邊融解：RA、SLE與乾燥眼表的交集", "pages": [6, 7, 15, 25, 26], "unitId": "u3", "sectionIndexes": [4], "terms": ["RA", "SLE", "Sjögren syndrome", "GVHD", "周邊潰瘍性角膜炎"], "keyPoints": ["RA與SLE可伴免疫性角膜融解或鞏膜炎；Sjögren及GVHD則可透過嚴重淚液與眼表異常增加缺損、潰瘍及感染風險。看到周邊變薄，必須把全身病與局部感染一起評估。", "角膜融解可能在很小的染色缺損下進行，病程追蹤需看厚度與前房，而非只看缺損面積。系統性免疫治療與眼表保護需跨科協作，合併感染時更不能盲目加強免疫抑制。"], "clinicalLink": "對關節、口乾、皮膚、移植史和免疫用藥的追問可改變處理路徑。", "pitfall": "不要用共筆的簡化「抗體打到相似抗原」取代真正病因評估。", "recall": {"question": "乾燥症病人缺損很小，能否安心？", "answer": "不能，仍需評估基質融解與穿孔，且感染可能並存。"}, "relatedTopics": ["notes-12"], "sourceIds": ["an05-mooren", "an05-scleritis"]}, {"id": "c13", "title": "Mooren、酒糟與皰性角結膜炎不可混成一個病", "pages": [15, 16, 25], "unitId": "u3", "sectionIndexes": [4], "terms": ["Mooren ulcer", "rosacea", "phlyctenulosis", "皰性角結膜炎", "allergy"], "keyPoints": ["Mooren潰瘍是排除感染與系統性原因後的周邊潰瘍診斷。眼部酒糟可伴瞼緣與瞼板腺病，持續影響角膜；皰性角結膜炎則是對微生物抗原等的過敏性炎症，可出現角膜緣結節及向中央延伸病灶。", "酒糟與皰性病變可以相關但不是老年版與年輕版的同一疾病。過敏性眼表炎也可損傷角膜；治療需同時處理瞼緣、暴露與感染線索，不能只反覆自行類固醇壓紅。"], "clinicalLink": "反覆針眼、瞼緣炎加角膜周邊病灶，提醒重新檢查整個眼表環境。", "pitfall": "Mooren是排除診斷；皰性角結膜炎不是單憑年齡分類。", "recall": {"question": "反覆類固醇停藥就復發，下一步思考？", "answer": "確認病因及共存瞼緣病、感染與免疫因素，避免症狀遮蔽結構惡化。"}, "relatedTopics": ["notes-11", "notes-12"], "sourceIds": ["an05-mooren", "an05-bacterial"]}, {"id": "c14", "title": "暴露性角膜病：閉合、眼球位置與Bell現象", "pages": [17, 18, 19, 25, 27, 28, 30], "unitId": "u1", "sectionIndexes": [5], "terms": ["lagophthalmos", "Bell phenomenon", "facial palsy", "Graves", "tarsorrhaphy"], "keyPoints": ["燒傷疤痕、CN7麻痺、突眼或眼瞼後縮都可造成閉合不全。閉眼時眼球上轉的Bell現象有一定保護作用，但存在與否及程度必須實際檢查，不能預設所有顏面麻痺都有、所有TED都沒有。", "暴露區常先出現染色和上皮缺損；嚴重時可感染及融解。處置依損傷程度包括潤滑、保濕保護及暫時性眼瞼縫合等，既要修復眼表，也要處理造成閉合不全的眼瞼或眼眶因素。"], "clinicalLink": "區分CN7閉眼不足與CN5感覺不足，兩者同時存在更危險。", "pitfall": "看到Bell現象不能保證角膜安全，仍需檢查實際暴露與染色。", "recall": {"question": "同樣閉不攏，為何兩位病人風險不同？", "answer": "暴露時間、眼球上轉保護、淚膜與角膜感覺都影響修復。"}, "relatedTopics": ["notes-08", "notes-11"], "sourceIds": ["an05-neurotrophic", "an05-trauma"]}, {"id": "c15", "title": "神經滋養性角膜病：感覺與修復的斷線", "pages": [20, 21, 22, 25, 26, 27, 28, 29, 30, 31], "unitId": "u1", "sectionIndexes": [1, 6], "terms": ["neurotrophic keratopathy", "CN5", "nasociliary", "persistent epithelial defect", "DM"], "keyPoints": ["角膜感覺經V1鼻睫神經相關分支傳入；神經不只回報疼痛，也參與眨眼、淚液及上皮維持。糖尿病、HSV/VZV、三叉神經病變或手術損傷可讓角膜明顯受損卻不太痛。", "PRK、LASIK與穿透性移植會不同程度影響角膜神經，神經恢復慢於表面閉合。持續上皮缺損需實測角膜感覺、找浸潤與變薄，依階段進行眼表保護及專科促進修復治療。"], "clinicalLink": "疼痛程度不能當作嚴重度替代指標；術後異物也可能不被察覺。", "pitfall": "共筆的CVA不等於僅腦出血；任何相關中樞或周邊神經損傷都須定位。", "recall": {"question": "角膜幾乎不痛仍在融解，哪個檢查不可漏？", "answer": "角膜感覺，同時檢查閉眼功能與感染證據。"}, "relatedTopics": ["notes-03"], "sourceIds": ["an05-neurotrophic"]}, {"id": "c16", "title": "神經、藥物與眼表毒性：不是都由止痛造成", "pages": [20, 22, 25, 27, 29], "unitId": "u1", "sectionIndexes": [6], "terms": ["topical anesthetic", "NSAID", "青光眼滴藥", "眼表毒性"], "keyPoints": ["反覆使用局部麻醉藥可直接毒害上皮並掩蓋警訊；NSAID在易受損眼表可能增加修復不良或融解風險。長期青光眼滴藥及防腐劑也可能傷害眼表，不宜只把機轉寫成病人不覺得痛所以不眨眼。", "評估持續缺損要逐一核對處方、自購藥、點藥頻率與防腐劑負荷。治療必要性需與原開藥團隊協調，尤其青光眼不可因眼表不適自行停掉所有降壓治療。"], "clinicalLink": "把「藥物毒性、感覺下降、暴露與感染」並列，避免單一路徑解釋。", "pitfall": "不要把局部麻醉藥當一般可反覆在家使用的舒緩滴劑。", "recall": {"question": "久不癒合但藥越點越多，還要查什麼？", "answer": "藥物毒性、用量與防腐劑，並重新驗證原診斷。"}, "relatedTopics": ["notes-13", "notes-07"], "sourceIds": ["an05-neurotrophic"]}, {"id": "c17", "title": "CPA腫瘤：同時失去感覺與閉眼的高危眼", "pages": [22, 23, 25], "unitId": "u1", "sectionIndexes": [5, 6], "terms": ["cerebellopontine angle", "vestibular schwannoma", "acoustic neuroma", "CN7", "CN8", "NF2"], "keyPoints": ["前庭神經鞘瘤是傳統所稱聽神經瘤，位於橋小腦角時可先有單側耳鳴、聽力下降或眩暈；較大病灶或手術可影響鄰近CN5與CN7，造成角膜感覺和閉眼功能一起受損。", "雙側前庭神經鞘瘤提示NF2相關神經鞘瘤病需專科評估。對眼部而言，立即重點是角膜保護；合併其他眼運動神經受損時更要實測Bell現象及暴露，不能只處理臉歪。"], "clinicalLink": "從耳部症狀連結眶外神經定位，再回到角膜修復環境。", "pitfall": "不是所有CPA病灶都是前庭神經鞘瘤，也不是有顏面麻痺就一定感覺正常。", "recall": {"question": "CN5加CN7受損對角膜有何加乘？", "answer": "看不出疼痛警訊又無法有效閉眼，暴露與修復不良共同增加潰瘍風險。"}, "relatedTopics": ["notes-03", "notes-11"], "sourceIds": ["an05-neurotrophic"]}, {"id": "c18", "title": "全層外傷與異物：先確保眼球完整性", "pages": [21, 24, 25, 28, 29, 31, 51, 52, 54], "unitId": "u3", "sectionIndexes": [7], "terms": ["open globe", "iris prolapse", "角膜異物", "protective shield"], "keyPoints": ["角膜全層裂傷可能有虹膜脫出、前房不對稱、瞳孔牽拉或房水漏出。疑似開放傷時以不壓迫的硬式眼罩保護、避免揉壓及量眼壓，緊急轉眼科；不要自行把虹膜或嵌入異物推回。", "修補後的視力取決於原始損傷、感染及散光等因素，不保證恢復。表面異物也需先排穿透傷；知覺下降的移植眼即使不痛，也需仔細檢查殘留異物及上皮損傷。"], "clinicalLink": "把「先量眼壓」改成「先排完整性破壞」，再決定安全檢查順序。", "pitfall": "高速度金屬外傷不能因表面傷口小就排除眼內異物。", "recall": {"question": "看到虹膜脫出可以棉棒推回嗎？", "answer": "不可以；保護眼球並緊急專科手術評估。"}, "relatedTopics": ["notes-01", "notes-14"], "sourceIds": ["an05-trauma"]}, {"id": "c19", "title": "EGFR抑制劑與角膜修復失敗", "pages": [24, 25, 32, 48], "unitId": "u1", "sectionIndexes": [6], "terms": ["EGFR antagonist", "erlotinib", "角膜潰瘍"], "keyPoints": ["EGFR訊號參與上皮修復，抑制EGFR的抗癌治療如erlotinib可能與角膜缺損、潰瘍或變薄有關。病灶可雙側但不對稱；新眼痛、畏光或視力變化應及早聯絡眼科。", "用藥後出現、停藥後改善或再暴露後復發能支持因果判斷，但仍須排感染及其他眼表因素。是否暫停或更換抗癌藥須由腫瘤科與眼科權衡，不能只由患者自行停藥。"], "clinicalLink": "此條把藥物時間軸與角膜層次、感染鑑別串在一起。", "pitfall": "單靠雙眼病變不能證明藥害，單眼也不能排除。", "recall": {"question": "抗癌治療後潰瘍，需同步處理哪些事？", "answer": "檢查感染和穿孔風險，核對用藥並跨科協調治療。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov05-erlotinib"]}, {"id": "c20", "title": "失養與退化：用病程、對稱和層次組織鑑別", "pages": [33, 39, 40, 48], "unitId": "u1", "sectionIndexes": [8], "terms": ["corneal dystrophy", "corneal degeneration", "IC3D"], "keyPoints": ["角膜失養常有遺傳、雙側及相對對稱分布，但發病年齡和家族史並非絕對；退化則常與年齡、環境或局部疾病相關。這些特徵是組織鑑別的線索，不是用一項特徵就貼標籤。", "分類需結合裂隙燈形態、病灶層次與遺傳資訊，現行IC3D並未廢除形態名稱。上皮／基底膜、基質或內皮為主的病變，造成疼痛、散光或水腫的方式不同。"], "clinicalLink": "先回答哪一層、是否對稱、進展多久，再安排必要檢查。", "pitfall": "不要把所有老年角膜混濁叫退化，Fuchs也可成年後才明顯。", "recall": {"question": "沒有家族史能排除角膜失養嗎？", "answer": "不能，遺傳方式、表現差異或偶發個案都可能使家族史不明顯。"}, "relatedTopics": [], "sourceIds": ["cov05-dystrophy", "cov05-dmek"]}, {"id": "c21", "title": "Fuchs、guttae與內皮幫浦", "pages": [33, 34, 48], "unitId": "u1", "sectionIndexes": [0, 8], "terms": ["Fuchs endothelial dystrophy", "guttae", "specular microscopy", "ECD", "polymegathism"], "keyPoints": ["Fuchs主要影響Descemet膜和內皮，guttae是後表面的突起性變化；細胞減少時鄰近內皮擴大補位，形態與大小變異增加。失代償後基質與上皮水腫，甚至形成疼痛水泡。", "鏡面顯微鏡評估細胞密度及形態，角膜厚度與臨床水腫提供功能資訊。不能以單一固定ECD門檻預言所有人會不會水腫；合併白內障手術規劃需考量剩餘內皮儲備。"], "clinicalLink": "晨間模糊、中央guttae與水腫可串成內皮功能不足的假說。", "pitfall": "共筆「低於400必水腫」不可當通用決策門檻。", "recall": {"question": "細胞密度下降卻尚未水腫，如何解釋？", "answer": "代償可暫時維持幫浦功能，仍需觀察形態、厚度與病程。"}, "relatedTopics": ["notes-06"], "sourceIds": ["cov05-dmek"]}, {"id": "c22", "title": "DMEK、DSAEK、DALK與PK：替換哪一層", "pages": [8, 9, 21, 26, 28, 29, 31, 35, 36, 37, 38, 39, 48], "unitId": "u1", "sectionIndexes": [9], "terms": ["DMEK", "DSAEK", "DALK", "PK", "氣體填塞"], "keyPoints": ["DMEK替換Descemet膜與內皮；DSAEK另帶一薄層後基質。DALK保留患者內皮、處理較前方基質疾病；PK為全層替換。選術式依病灶深度與內皮功能，不能所有混濁都做同一种。", "內皮移植需正確展開移植物與氣體協助貼附，術後須監測脫離、眼壓與排斥。DMEK與DSAEK的視覺恢復及排斥風險有差別，但舊課堂百分比不適合當每位病人的預測。"], "clinicalLink": "把圖上的厚薄差對應到異體組織量、介面與功能目標。", "pitfall": "DMEK不含供體基質；活動感染的救援移植另有適應症。", "recall": {"question": "單純內皮失代償為何不一定需PK？", "answer": "可用選擇性內皮移植保留正常前部角膜，減少不必要組織替換。"}, "relatedTopics": [], "sourceIds": ["cov05-dmek", "cov05-rejection", "cov05-fungal"]}, {"id": "c23", "title": "圖片裡的三種基質失養：顆粒、格子、斑狀", "pages": [39, 40], "unitId": "u1", "sectionIndexes": [8], "terms": ["Granular dystrophy", "Lattice dystrophy", "Macular dystrophy", "TGFBI", "CHST6"], "keyPoints": ["顆粒狀失養常有界線較清楚的白色顆粒，顆粒間可較透明；格子狀呈細線交織的類澱粉沉積。兩者常與TGFBI變異相關，亦可因前部受累而反覆糜爛疼痛。", "斑狀失養可有界線不清的混濁及較廣泛基質霧化，與CHST6相關、常為隱性遺傳。三者不是看圖背名字而已，應說明沉積對透明、表面穩定與視力的影響；移植後仍可能復發。"], "clinicalLink": "此項補足原共筆只有圖片英文標籤、舊App沒有展开的內容。", "pitfall": "形態名稱並非因找到基因就不再使用。", "recall": {"question": "顆粒間透明與瀰漫背景霧化，分別提示什麼方向？", "answer": "前者較像顆粒型，後者需考慮斑狀型，仍需完整臨床與遺傳評估。"}, "relatedTopics": [], "sourceIds": ["cov05-dystrophy"]}, {"id": "c24", "title": "老年環與沉積環：位置比顏色更可靠", "pages": [40, 43, 48, 49], "unitId": "u1", "sectionIndexes": [8], "terms": ["senile arcus", "Kayser-Fleischer ring", "Wilson disease", "Fleischer ring"], "keyPoints": ["老年環是周邊角膜脂質沉積，通常不侵占中央視軸；較年輕出現可依個案評估脂質風險。Wilson病的Kayser-Fleischer環則是Descemet區域的銅沉積，應與肝臟及神經表現整合。", "圓錐角膜的Fleischer環是上皮層鐵沉積，名稱相近但層次與意義不同。虹膜底色會影響觀察，不能只憑環的顏色或肉眼是否明顯排除疾病。"], "clinicalLink": "口試用「脂質—周邊、銅—Descemet、鐵—上皮」建立位置比較。", "pitfall": "不要把Kayser-Fleischer與圓錐角膜Fleischer環混淆。", "recall": {"question": "同為棕色角膜環，還要問哪兩件事？", "answer": "沉積層次，以及是否有圓錐形態或系統性銅代謝線索。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov05-wilson", "cov05-kc"]}, {"id": "c25", "title": "漩渦與晶體樣沉積：角膜透露系統性問題", "pages": [43, 49], "unitId": "u1", "sectionIndexes": [8], "terms": ["cornea verticillata", "Fabry disease", "amiodarone", "multiple myeloma"], "keyPoints": ["漩渦狀角膜病變多位於上皮，可能與amiodarone等藥物或Fabry病相關。看到漩渦應先核對藥物及全身線索，而非直接叫感染或單憑外觀決定停用心臟藥。", "多發性骨髓瘤等單株免疫球蛋白疾病可有角膜晶體樣或灰白沉積。角膜徵象提供懷疑線索，並不能單獨完成全身診斷；沉積對視力的影響還取決於位置、密度和合併病變。"], "clinicalLink": "將裂隙燈發現變成有目的的病史與內科轉介問題。", "pitfall": "沉積存在不等於視力下降必由它造成。", "recall": {"question": "角膜漩渦除了藥史還要想到什麼？", "answer": "Fabry等代謝疾病，依症狀及家族史進一步評估。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov05-verticillata", "cov05-myeloma"]}, {"id": "c26", "title": "圓錐角膜：形狀惡化與視力矯正分開追蹤", "pages": [41, 42, 49], "unitId": "u1", "sectionIndexes": [9], "terms": ["keratoconus", "ectasia", "Vogt striae", "Fleischer ring", "topography", "tomography"], "keyPoints": ["圓錐角膜是進行性變薄與擴張，可表現為近視或散光快速變動、眼鏡最佳矯正視力不佳。Vogt細紋和Fleischer環是裂隙燈線索，地形圖與斷層影像可評估前後曲面及厚度分布。", "避免揉眼並控制過敏很重要。硬式或鞏膜接觸鏡主要改善光學，交聯用於合適的進展性個案以穩定疾病，嚴重疤痕或矯正受限才考慮移植等選項；不是只有戴鏡與移植兩種路。"], "clinicalLink": "鏡片看清楚不代表擴張停止，仍須客觀追蹤。", "pitfall": "把揉眼當唯一病因或把交聯當保證恢復視力都不正確。", "recall": {"question": "硬鏡與交聯的目標有何不同？", "answer": "硬鏡補償不規則光學，交聯旨在降低結構繼續擴張。"}, "relatedTopics": ["notes-02"], "sourceIds": ["cov05-kc", "cov05-cxl"]}, {"id": "c27", "title": "急性角膜水腫：hydrops與高眼壓、內皮病鑑別", "pages": [28, 31, 34, 41, 49, 52, 54], "unitId": "u1", "sectionIndexes": [8, 9], "terms": ["acute hydrops", "Descemet rupture", "角膜水腫"], "keyPoints": ["圓錐角膜的急性hydrops可因Descemet膜及內皮破裂，使房水進入基質，造成突然混濁、畏光和視力下降。這與感染性浸潤、Fuchs失代償或急性高眼壓所致水腫的機轉不同。", "評估需把原有角膜形態、上皮缺損、浸潤、前房和眼壓一起看；水腫可干擾眼壓測量。病灶恢復後可能留疤，不能保證症狀退就恢復原有最佳視力。"], "clinicalLink": "同樣角膜白，問「水從哪裡來、哪個屏障失效」有助定位。", "pitfall": "角膜水腫不能直接視為細菌感染證據。", "recall": {"question": "圓錐眼突然白濁但無典型浸潤，想到什麼？", "answer": "急性hydrops，同時排感染與其他急症。"}, "relatedTopics": ["notes-07"], "sourceIds": ["cov05-kc", "cov05-dmek"]}, {"id": "c28", "title": "眼表鱗狀腫瘤：上皮內與侵襲性的界線", "pages": [44, 49], "unitId": "u3", "sectionIndexes": [11], "terms": ["OSSN", "CIN", "mitomycin C", "5-fluorouracil", "interferon α2b", "cryotherapy"], "keyPoints": ["眼表鱗狀上皮腫瘤OSSN涵蓋上皮異生、原位病變與侵襲性鱗癌；CIN指上皮內病變，不能把所有眼表腫塊都概括為良性或不會轉移。角膜緣白斑、膠狀或血管性病灶需評估范圍與深度。", "處理可包含切除合併冷凍或由專科選擇mitomycin C、5-FU及interferon等局部治療。是否適合局部療法取決於診斷、範圍與侵犯程度，並需追蹤復發和眼表毒性。"], "clinicalLink": "從角膜病灶延伸檢查結膜、角膜緣與區域淋巴結。", "pitfall": "不要以「少轉移」取代病理及侵襲性評估。", "recall": {"question": "CIN與侵襲性鱗癌最重要區別？", "answer": "是否局限上皮或突破基底膜向深部侵犯，會影響分期與治療。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov05-ossn"]}, {"id": "c29", "title": "光角膜炎：延遲發作的雙眼表面傷", "pages": [28, 31, 44, 49, 51, 52, 54], "unitId": "u3", "sectionIndexes": [7, 10], "terms": ["photokeratitis", "UV keratopathy", "焊接", "雪盲", "紫外線燈"], "keyPoints": ["焊接、雪地反射、日光浴設備與消毒紫外線燈都可造成光角膜炎。症狀常在暴露後延遲出現，雙眼痛、畏光、流淚及點狀上皮染色可協助辨識；旁觀者也可能受傷。", "處理包括停止暴露、眼表保護與適當止痛，由臨床確認是否需其他藥物。多數表淺損傷可修復，但視力下降、持續惡化或非典型表現仍需排異物、感染及其他病因。"], "clinicalLink": "時間軸加職業／實驗室暴露史，比只問是否被東西打到更有用。", "pitfall": "不能承諾休息一天一定好，也不要把類固醇或反覆麻醉滴藥當自療。", "recall": {"question": "紫外線暴露為何不一定立刻痛？", "answer": "上皮損傷與脫落可延遲顯現，暴露到症狀之間存在時間差。"}, "relatedTopics": [], "sourceIds": ["an05-trauma"]}, {"id": "c30", "title": "化學傷：先沖洗，再以角膜緣與清澈度評估", "pages": [45, 46, 49, 51, 52, 53, 54], "unitId": "u3", "sectionIndexes": [10], "terms": ["alkali burn", "acid burn", "hydrofluoric acid", "limbal ischemia", "symblepharon"], "keyPoints": ["立即大量沖洗與移除殘留化學物是化學眼傷的核心，不為問完病史等候。醫療端檢查並追蹤pH，翻眼瞼找殘留顆粒，再評估角膜透明、結膜及角膜緣受損范圍。", "鹼通常穿透較深；酸的凝固性壞死可限制穿透，但氫氟酸等例外及重度酸傷仍危險。角膜緣缺血提示幹細胞受損，後續可有結膜化、疤痕及瞼球黏連；清除殘留與黏連管理應由受訓人員完成。"], "clinicalLink": "圖頁46的混濁、新生血管和瘢痕說明「沖洗後」仍有長期重建問題。", "pitfall": "不能說酸絕不入眼，亦不能承諾角膜一週全長回。", "recall": {"question": "大上皮缺損與廣泛角膜緣缺血，哪個更影響長期修復？", "answer": "角膜緣幹細胞與周圍組織損傷常決定持續修復能力，兩者仍需一併記錄。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov05-chemical"]}, {"id": "c31", "title": "表層鞏膜炎、鞏膜炎與無痛壞死", "pages": [47, 49, 50, 51, 52, 53, 54], "unitId": "u3", "sectionIndexes": [11], "terms": ["episcleritis", "diffuse scleritis", "nodular scleritis", "necrotizing scleritis"], "keyPoints": ["表層鞏膜炎通常較表淺、疼痛較輕；鞏膜炎可有深沉眼痛、夜間或眼球轉動加重，可能威脅視力。原圖分成瀰漫、結節與壞死型，提示外觀與結構受損的差異。", "壞死型亦可在少痛情況發生，不能把不痛當排除條件。評估需看角膜、葡萄膜及後部受累，分辨感染性與免疫性原因，因為治療方向可能相反。"], "clinicalLink": "深部痛加周邊角膜變薄時，將眼表紅眼升級為系統性與結構風險。", "pitfall": "不能單凭充血顏色或類固醇反應確認病因。", "recall": {"question": "結節性紅眼為何不能直接類固醇？", "answer": "感染性鞏膜炎亦可呈結節，需先評估病史及檢驗。"}, "relatedTopics": [], "sourceIds": ["an05-scleritis", "an05-mooren"]}, {"id": "c32", "title": "術後感染性鞏膜炎與系統性篩查", "pages": [47, 50, 51, 52, 53, 54], "unitId": "u3", "sectionIndexes": [11], "terms": ["pterygium surgery", "Pseudomonas", "HZO", "GPA", "polyarteritis nodosa", "relapsing polychondritis", "RF", "ANA", "ANCA"], "keyPoints": ["翼狀胬肉等手術後即使隔多年，局部缺血或受損組織也可能發生感染性鞏膜炎；綠膿桿菌及HZO是需想到的原因。採樣與培養協助選療，但嚴重病變不能等待結果才處理。", "非感染性評估依病史選擇RA、SLE、復發性多軟骨炎、結節性多動脈炎及GPA等方向，並考量RF、ANA、ANCA、血球、發炎指標、腎功能與尿液。結節性多動脈炎不是「多軟骨炎」；病毒IgG陽性通常不能證明眼部活動感染。"], "clinicalLink": "關節、耳鼻軟骨、呼吸道與血尿線索能使抽血檢查有明確目的。", "pitfall": "不要按舊考題以「沒列在表」斷言某全身疾病絕不相關。", "recall": {"question": "鞏膜炎為何需要問舊手術史與尿液症狀？", "answer": "前者提示感染性途徑，後者可提示系統性血管炎及腎臟受累。"}, "relatedTopics": ["notes-09"], "sourceIds": ["an05-scleritis"]}], "unresolved": [], "sourceSha256": "9e2213f532bc217333976205e9840b3830b19bf41ce2c7d34dff6616d395a87c"}, "notes-06": {"sourceFile": "眼科學No.06.pdf", "pageCount": 36, "reviewedPages": [{"from": 1, "to": 3, "kind": "administrative", "note": "封面、目錄與課程回饋；PDF頁碼比印刷頁碼多一頁"}, {"from": 4, "to": 19, "kind": "teaching", "note": "晶狀體結構、胚胎、形態異常、組織學與複習"}, {"from": 20, "to": 21, "kind": "exam", "note": "胚胎發育與形態異常考點"}, {"from": 22, "to": 33, "kind": "teaching", "note": "生理生化、白內障、手術與複習"}, {"from": 34, "to": 36, "kind": "exam", "note": "症狀、成因、蛋白變化與術式考點"}], "entries": [{"id": "c01", "title": "透明雙凸晶狀體：位置、懸吊與屈光", "pages": [4, 5, 17, 22], "unitId": "u1", "sectionIndexes": [0, 5], "terms": ["Biconvex lens", "Zonules", "Refraction", "Refractive index"], "keyPoints": ["天然晶狀體位於虹膜後、玻璃體前，透明而雙凸，通常前表面較平、後表面較凸，懸韌帶連到睫狀體維持位置。角膜與晶狀體共同成像，但前者接觸空氣的折射率差，使其提供較大的整體屈光貢獻。", "折射率 n 描述介質光速，屈光力 D 描述聚散能力；晶狀體 n 較高不表示其屈光力必定大於角膜。曲率、周圍介質與位置同樣重要，教材不同簡化模型的數字不宜硬相加。"], "clinicalLink": "把晶狀體透明度、屈光力與懸吊位置分成三個可受損面向。", "pitfall": "不要把晶狀體位置誤寫在鞏膜後方，也不要混用 n 與 D。", "recall": {"question": "為何晶狀體折射率高，角膜卻仍提供較多屈光力？", "answer": "因屈光取決於界面折射率差、曲率與位置，不只材料 n。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an06-cataract", "cov06-embryo"]}, {"id": "c02", "title": "胚胎順序：表面外胚層不是視杯", "pages": [6, 17, 20, 21], "unitId": "u1", "sectionIndexes": [0], "terms": ["Surface ectoderm", "Lens placode", "Lens pit", "Lens vesicle"], "keyPoints": ["視泡誘導覆蓋的表面外胚層增厚成 lens placode，接著內陷成 lens pit，分離成 lens vesicle。晶狀體源自表面外胚層，與形成視網膜的神經外胚層來源不同。", "約胚胎早期數週逐步形成囊泡及初級纖維，重點是誘導、內陷、分離與分化的先後。共筆題幹從 optic cup 起頭是周圍發育事件，不能因此說晶狀體由視杯轉化。"], "clinicalLink": "先天白內障或形態異常可由這條發育路徑理解，但形態不等於單一基因診斷。", "pitfall": "placode／pit／vesicle 的順序不可顛倒。", "recall": {"question": "晶狀體的直接胚胎來源？", "answer": "表面外胚層，依序形成板、凹與囊泡後分化。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov06-embryo"]}, {"id": "c03", "title": "初級與次級纖維：為何晶狀體終生增厚", "pages": [6, 7, 15, 17, 19, 20, 21], "unitId": "u1", "sectionIndexes": [0], "terms": ["Primary lens fibers", "Secondary lens fibers", "Equatorial zone", "Embryonic nucleus"], "keyPoints": ["囊泡後壁細胞向前延長、填滿腔隙，形成初級晶狀體纖維與胚胎核；前壁保留為上皮。這個前後差異解釋成熟晶狀體後表面沒有對稱的完整上皮層。", "前赤道區上皮持續增殖，向赤道移動後延長成次級纖維，包覆既有纖維。成熟纖維失去細胞核與胞器以減少散射，但年長晶狀體仍持續加入新纖維。"], "clinicalLink": "新纖維在外、舊纖維在內的結構支持不同位置白內障的判讀。", "pitfall": "成年晶狀體並非停止生長，也不是所有細胞從一開始就無核。", "recall": {"question": "初級纖維主要來自囊泡哪側？", "answer": "後壁細胞；次級纖維由赤道附近上皮持續產生。"}, "relatedTopics": ["notes-02"], "sourceIds": ["cov06-embryo", "cov06-histology"]}, {"id": "c04", "title": "晶核與 Y 字縫：發育史留在光學切面", "pages": [7, 8, 17, 20, 21], "unitId": "u1", "sectionIndexes": [0], "terms": ["Fetal nucleus", "Infantile nucleus", "Adult nucleus", "Y suture", "Sutural cataract"], "keyPoints": ["次級纖維的末端交會形成晶狀體縫；胎兒核的前縫典型為正 Y、後縫為倒 Y，之後縫線隨生長更複雜。胚胎核、胎兒核、幼年與成人核描述不同時期累積的纖維。", "縫線型白內障 sutural cataract 沿縫出現混濁，將胚胎結構變成臨床形態。它不是成人核與皮質交界本身，也不能只憑一條 Y 形狀就判斷視功能影響。"], "clinicalLink": "評估中央遮蔽、各眼視力與是否合併其他混濁，尤其兒童弱視風險。", "pitfall": "Y 縫屬結構發育概念，不是只有胎兒眼才可能觀察到其痕跡。", "recall": {"question": "前後 Y 字縫方向相同嗎？", "answer": "典型胎兒核前正 Y、後倒 Y。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov06-embryo", "an06-cataract"]}, {"id": "c05", "title": "血管膜殘跡：瞳孔膜、星點與 Mittendorf dot", "pages": [8, 9, 17], "unitId": "u1", "sectionIndexes": [1], "terms": ["Tunica vasculosa lentis", "Persistent pupillary membrane", "Epicapsular stars", "Mittendorf dot", "Bergmeister papilla"], "keyPoints": ["胎兒晶狀體由血管膜與玻璃體動脈系統供應，成熟後大多退化。Persistent pupillary membrane 是跨越瞳孔的細絲；epicapsular stars 是前囊表面星狀細小色素斑，兩者定位不同。", "Mittendorf dot 是後囊常偏鼻下的小混濁，代表玻璃體動脈前端附著殘跡；視乳頭端殘跡稱 Bergmeister papilla。小而孤立的殘跡常不影響視力，但需看是否遮蔽視軸或伴其他異常。"], "clinicalLink": "看見白點時先報前囊、後囊或視乳頭的位置，再命名。", "pitfall": "不要把所有血管殘跡都當需要手術的白內障。", "recall": {"question": "前囊星狀色素點與後囊鼻下白點各稱什麼？", "answer": "前者 epicapsular stars，後者 Mittendorf dot。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov06-remnants", "cov06-mittendorf"]}, {"id": "c06", "title": "PFV：由胚胎血管殘留到白瞳症", "pages": [9, 17], "unitId": "u1", "sectionIndexes": [1], "terms": ["Persistent fetal vasculature", "PFV", "PHPV", "Leukocoria", "Microphthalmia"], "keyPoints": ["Persistent fetal vasculature 是胎兒玻璃體血管系統退化不全，舊稱 PHPV。可有晶狀體後纖維血管膜或連接視乳頭的柄，常為單眼並伴小眼球。", "這比孤立 Mittendorf dot 範圍更大，可能牽拉晶狀體、睫狀體或視網膜，造成白內障、淺前房、出血或剝離。白瞳症還須排除視網膜母細胞瘤等重要原因。"], "clinicalLink": "兒童白瞳需及時完整眼科評估，不能僅由照片或單一胚胎名詞完成診斷。", "pitfall": "PFV 是範圍與嚴重度多樣的疾病，不是所有案例只有後囊一個點。", "recall": {"question": "PHPV 的較新名稱與主要機轉？", "answer": "PFV；胎兒血管系統未適當退化。"}, "relatedTopics": ["notes-04", "notes-10"], "sourceIds": ["cov06-pfv"]}, {"id": "c07", "title": "前後 lenticonus 與 Alport 的系統連結", "pages": [10, 18, 20, 21], "unitId": "u1", "sectionIndexes": [2], "terms": ["Anterior lenticonus", "Posterior lenticonus", "Alport syndrome", "Type IV collagen"], "keyPoints": ["Lenticonus 是晶狀體表面局部圓錐狀突出，可造成不規則屈光與混濁。前 lenticonus 常為雙側，與 Alport 的第四型膠原基底膜異常相關；應詢問血尿、腎病與感覺神經性聽損。", "後 lenticonus 常為單側後方局部突出，可伴後極混濁與薄弱囊膜。兩者的全身關聯不完全相同，不能看見任何 lens cone 就直接貼 Alport 標籤。"], "clinicalLink": "眼部異常可成為腎臟及聽覺評估的線索，兒童則同時評估弱視。", "pitfall": "正常眼軸不能排除因晶狀體形態造成的近視。", "recall": {"question": "雙側前 lenticonus 加血尿，應考慮哪個系統疾病？", "answer": "Alport syndrome，需適當腎臟與聽覺評估。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov06-alport", "cov06-child"]}, {"id": "c08", "title": "Lentiglobus：局部球形突出不是整顆小球", "pages": [11, 18, 20, 21], "unitId": "u1", "sectionIndexes": [2], "terms": ["Lentiglobus", "Posterior lentiglobus", "Posterior polar opacity"], "keyPoints": ["Lentiglobus 描述晶狀體表面的局部球形膨出，與 lenticonus 的局部圓錐形描述相近但不同；後方型較常見，可伴後極混濁或局部囊膜薄弱。", "Microspherophakia 則是整顆晶狀體直徑較小、前後徑較大，不能與局部 lentiglobus 混用。兩者都可能造成屈光異常，但手術風險與懸韌帶問題需各自評估。"], "clinicalLink": "用裂隙燈及適當影像描述突出位置、範圍與囊膜，再討論處置。", "pitfall": "外觀像球不代表兩種診斷可互換。", "recall": {"question": "局部後表面膨出與整顆小球晶狀體分別想到什麼？", "answer": "前者 posterior lentiglobus；後者 microspherophakia。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov06-child", "cov06-micro"]}, {"id": "c09", "title": "Lens coloboma：形狀缺口來自懸吊不完整", "pages": [11, 18, 20, 21], "unitId": "u2", "sectionIndexes": [2, 3], "terms": ["Lens coloboma", "Zonular defect", "Iris coloboma", "Uveal coloboma"], "keyPoints": ["晶狀體 coloboma 常呈邊緣楔形凹陷，是局部懸韌帶缺乏拉力，使囊袋輪廓改變；並非必然真正少了一塊晶狀體組織。先天性可與虹膜或葡萄膜缺損同見。", "外傷或手術造成懸韌帶斷裂也可產生類似輪廓。檢查須評估散光、混濁、位置穩定性與伴隨眼底缺損，不能以「先天缺角」結束。"], "clinicalLink": "術前提示囊袋支撐可能不完整，影響晶狀體移除與 IOL 規劃。", "pitfall": "原詞 coloboma 的組織意義需依器官與機轉理解。", "recall": {"question": "為何缺少懸韌帶會看起來像晶狀體缺角？", "answer": "該區缺乏正常張力，晶狀體邊緣向內凹。"}, "relatedTopics": ["notes-05", "notes-10"], "sourceIds": ["cov06-ectopia", "cov06-child"]}, {"id": "c10", "title": "Microspherophakia 與 Weill–Marchesani", "pages": [12, 18, 20, 21], "unitId": "u1", "sectionIndexes": [2], "terms": ["Microspherophakia", "Weill–Marchesani syndrome", "Lenticular myopia", "Pupillary block"], "keyPoints": ["小球形晶狀體的赤道直徑小、前後徑增加，充分散瞳可能看見完整邊緣。較球形使屈光力增加，產生晶狀體性近視；鬆長懸韌帶也可造成移位。", "Weill–Marchesani 的典型連結包括身材矮小、短粗指與關節活動受限。晶狀體前移可造成瞳孔阻滯、淺前房及閉角；「近視眼所以隅角必深」在此不成立。"], "clinicalLink": "急性痛紅與淺前房需辨認晶狀體機轉並及時處理。", "pitfall": "不應直接套用原發閉角的單一用藥流程，縮瞳可能加重某些情境。", "recall": {"question": "高度近視但前房淺且見小球晶狀體，風險為何？", "answer": "晶狀體前移／瞳孔阻滯造成繼發閉角。"}, "relatedTopics": ["notes-07", "notes-02"], "sourceIds": ["cov06-micro"]}, {"id": "c11", "title": "小球形晶狀體的其他全身與前節線索", "pages": [12, 18], "unitId": "u1", "sectionIndexes": [2], "terms": ["Peters anomaly", "Lowe syndrome", "Congenital rubella", "Syndromic evaluation"], "keyPoints": ["除 Weill–Marchesani，文獻亦列 Marfan、Alport 等相關表現，應依實際其他徵象評估，不能把關聯清單當作常見率排序。Peters anomaly 是前節發育異常，常有中央角膜混濁及虹膜／晶狀體黏連。", "Lowe syndrome 可有先天白內障、腎小管及神經發育問題；先天德國麻疹可伴白內障、聽損及心臟異常。這些背景會改變需要尋找的全身線索，但小球形晶狀體本身不足以確診任何一項。"], "clinicalLink": "形態異常與系統病史互相引導，必要時跨科或遺傳評估。", "pitfall": "不因一個眼部形態就安排沒有臨床線索的全套疾病檢驗。", "recall": {"question": "先天晶狀體異常伴腎小管問題與發育遲緩，應想到哪類關聯？", "answer": "需考慮如 Lowe 等系統症候群並做整體評估。"}, "relatedTopics": ["notes-04", "notes-05"], "sourceIds": ["cov06-micro", "cov06-child"]}, {"id": "c12", "title": "晶狀體
