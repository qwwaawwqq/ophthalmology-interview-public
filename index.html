 02 · 光學與臨床屈光 · 情境 1", "question": "−8 D近視患者想做屈光手術，說明你會先問／檢查什麼，而不是立即推薦某術式。", "durationSeconds": 90, "answer": "釐清屈光穩定、用眼需求、乾眼與接觸鏡史；量測角膜形態／厚度、眼表、瞳孔、前房與眼底。解釋LASIK、PRK、SMILE與phakic IOL的結構差別與風險；高近視矯正不等於消除視網膜風險，不承諾零乾眼或零併發症。", "clinical": true, "topicId": "notes-02", "source": "眼科學No.02.pdf", "sourceRef": "32–44；No.10：48", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.02.pdf，頁 32–44；No.10：48。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-02-case-2", "title": "共筆 02 · 光學與臨床屈光 · 情境 2", "question": "考官給你−3 D近視、調節幅度2 D；請算未矯正遠近點，再比較全矯正後近點。", "durationSeconds": 90, "answer": "未矯正遠點1/3 m約33 cm、近點1/(3＋2) m＝20 cm；忽略頂點與鏡片誘發效應，完全矯正後近點約1/2 m＝50 cm。必須先說明簡化假設，並解釋為何近視摘鏡可方便看近，但不等於未老花。", "clinical": true, "topicId": "notes-02", "source": "眼科學No.02.pdf", "sourceRef": "30–39", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.02.pdf，頁 30–39。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-03-case-1", "title": "共筆 03 · 神經眼科 · 情境 1", "question": "60歲糖尿病病人突然眼瞼下垂、眼球外下偏，但瞳孔正常。考官問：「是不是微血管性，追蹤就好？」", "durationSeconds": 90, "answer": "不能只據糖尿病與瞳孔保留定論；先確認完整或部分III麻痺、疼痛／頭痛、起病及其他神經徵象。新發III麻痺需及時血管／影像評估並與神經眼科協作。可將微血管性列鑑別，但不能用它直接排除動脈瘤。", "clinical": true, "topicId": "notes-03", "source": "眼科學No.03.pdf", "sourceRef": "37–38；E01", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.03.pdf，頁 37–38；E01。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-03-case-2", "title": "共筆 03 · 神經眼科 · 情境 2", "question": "病人右眼縮瞳、輕度下垂，暗處差異更大，並有新發右側頸痛。請定位及說明第一步。", "durationSeconds": 90, "answer": "這組合支持右Horner，暗處交感擴瞳障礙更明顯；眼部第三級神經沿ICA。急性疼痛使頸動脈剝離成為先排急症，需立即血管／神經評估；藥物試驗不能延誤。無明顯無汗不能排除節後Horner。", "clinical": true, "topicId": "notes-03", "source": "眼科學No.03.pdf", "sourceRef": "44–45；E02", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.03.pdf，頁 44–45；E02。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-04-case-1", "title": "共筆 04 · 弱視與斜視 · 情境 1", "question": "4歲小朋友右眼0.3、左眼1.0，右眼有較高遠視，眼底無可解釋病灶。如何向家長說明治療？", "durationSeconds": 90, "answer": "支持屈光參差性弱視，但先完成適齡視力與睫狀肌麻痺驗光；提供清楚影像的眼鏡，再依反應安排較好眼遮蓋或其他專科治療。說明治療需持續使用較差眼與追蹤，不能自行加長遮蓋而傷害較好眼，也不承諾固定時間恢復正常。", "clinical": true, "topicId": "notes-04", "source": "眼科學No.04.pdf", "sourceRef": "6–11；E05", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.04.pdf，頁 6–11；E05。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-04-case-2", "title": "共筆 04 · 弱視與斜視 · 情境 2", "question": "青少年右眼外轉不足，家長說自幼如此；內轉時右眼後縮且眼裂變窄。請與VI麻痺區分。", "durationSeconds": 90, "answer": "先天病程和內轉時後縮／窄眼裂支持Duane而非單純VI麻痺；評估頭位、眼位、雙眼視與其他運動。不要把新發神經麻痺的處理直接套上；同樣不能因先天就忽略視力、弱視或功能問題。", "clinical": true, "topicId": "notes-04", "source": "眼科學No.04.pdf", "sourceRef": "40–45", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.04.pdf，頁 40–45。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-05-case-1", "title": "共筆 05 · 角膜與鞏膜 · 情境 1", "question": "戴接觸鏡患者紅眼疼痛，中央角膜有2 mm浸潤與上皮缺損。請說明你會先做與不做什麼。", "durationSeconds": 90, "answer": "記錄視力、位置／深度／大小、前房反應，問過夜、水接觸、植物外傷及用藥；停止戴鏡並及時眼科處理，中央病灶需由眼科評估刮片與適當抗感染。不要只叫他換人工淚液、不要用類固醇單方或自行包覆掩蓋惡化。", "clinical": true, "topicId": "notes-05", "source": "眼科學No.05.pdf", "sourceRef": "10–14", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.05.pdf，頁 10–14。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-05-case-2", "title": "共筆 05 · 角膜與鞏膜 · 情境 2", "question": "病人兩年前帶狀皰疹，現在角膜上皮缺損很大但不痛，感覺降低。診斷方向與危險在哪？", "durationSeconds": 90, "answer": "神經滋養性角膜病變是重要方向；應同時排感染、暴露及藥物毒性。感覺低造成保護與修復不足，疼痛輕不代表安全；評估基質變薄、融解及穿孔風險並及時眼科治療。", "clinical": true, "topicId": "notes-05", "source": "眼科學No.05.pdf", "sourceRef": "12–14、17–22", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.05.pdf，頁 12–14、17–22。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-06-case-1", "title": "共筆 06 · 晶狀體與白內障 · 情境 1", "question": "70歲患者說最近摘眼鏡反而看近較清楚，近視逐漸增加。請解釋可能病因與評估。", "durationSeconds": 90, "answer": "核性白內障造成myopic shift是可能原因，不應直接稱老花消失。做矯正視力與裂隙燈分型，檢查黃斑／視神經等共病、血糖或其他屈光變動因素；是否手術按功能需求與預期效益共同決策。", "clinical": true, "topicId": "notes-06", "source": "眼科學No.06.pdf", "sourceRef": "22–31", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.06.pdf，頁 22–31。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-06-case-2", "title": "共筆 06 · 晶狀體與白內障 · 情境 2", "question": "你在白內障術前看到PEX與晶狀體晃動。需要向手術團隊提醒哪些風險？", "durationSeconds": 90, "answer": "PEX提示懸韌帶不穩、小瞳孔及伴隨青光眼風險；補充散瞳、IOP／視神經與zonular instability評估。告知需調整囊袋支撐及手術策略，而非把它當單純外觀沈積；IOL選擇與定位穩定性亦要考慮。", "clinical": true, "topicId": "notes-06", "source": "眼科學No.06.pdf", "sourceRef": "13–16、28–31", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.06.pdf，頁 13–16、28–31。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-07-case-1", "title": "共筆 07 · 青光眼 · 情境 1", "question": "病人眼壓16，OCT紅色且視野有鼻側階梯，問你是否青光眼。請避免只看顏色回答。", "durationSeconds": 90, "answer": "檢查OCT信號／分割、視乳頭大小與rim／RNFL；看視野可靠度、重複性與上下位置配對，考量近視及非青光眼病因。若典型損害一致，正常眼壓仍可有青光眼；需要追蹤與依進展訂個別目標。", "clinical": true, "topicId": "notes-07", "source": "眼科學No.07.pdf", "sourceRef": "5–20、32–34", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.07.pdf，頁 5–20、32–34。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-07-case-2", "title": "共筆 07 · 青光眼 · 情境 2", "question": "急性高眼壓病人，第一位是單眼中度散瞳淺前房，第二位是新用topiramate後雙眼近視位移。請比較治療機轉。", "durationSeconds": 90, "answer": "兩者都需緊急眼科與全身條件評估。第一位若為瞳孔阻滯，降壓與適當LPI解除壓差；第二位要想到睫狀脈絡膜滲出、前移，處理誘因並由專科選用治療，LPI不能解除主因，pilocarpine可能不合適。", "clinical": true, "topicId": "notes-07", "source": "眼科學No.07.pdf", "sourceRef": "35–36；No.13：49–51；E03", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.07.pdf，頁 35–36；No.13：49–51；E03。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-08-case-1", "title": "共筆 08 · 眼眶與淚器 · 情境 1", "question": "發燒患者眼瞼紅腫。請在90秒內區分preseptal與orbital cellulitis並說明危險項。", "durationSeconds": 90, "answer": "先測視力與瞳孔／RAPD、看突眼及EOM疼痛／限制；詢問鼻竇、外傷、牙源或免疫背景。痛性EOM、突眼、視力／色覺下降、RAPD或其他深部症狀需警覺orbital cellulitis，緊急影像、全身抗感染與眼科／相關科合作，不只開點眼藥。", "clinical": true, "topicId": "notes-08", "source": "眼科學No.08.pdf", "sourceRef": "11–20；E04", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.08.pdf，頁 11–20；E04。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-08-case-2", "title": "共筆 08 · 眼眶與淚器 · 情境 2", "question": "長期流淚病人想直接做DCR。請建立診斷前的機轉清單。", "durationSeconds": 90, "answer": "檢查眼表刺激／乾眼的反射性流淚、眼瞼及淚點位置、眨眼淚泵，再評估淚小管／淚囊／鼻淚管阻塞。DCR只解決適當的排出路徑問題；有急性淚囊炎先控制感染，不把急性期常規探通當第一步；血淚／硬塊須排腫瘤。", "clinical": true, "topicId": "notes-08", "source": "眼科學No.08.pdf", "sourceRef": "43–54", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.08.pdf，頁 43–54。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-09-case-1", "title": "共筆 09 · 葡萄膜與葡萄膜炎 · 情境 1", "question": "一位反覆單眼紅痛的年輕人，前房cells、舊後黏連，且晨僵背痛。如何進行有方向的問診與檢查？", "durationSeconds": 90, "answer": "先定位前葡萄膜炎，記急慢、復發、交替側別與肉芽腫特徵；問炎症性背痛、關節／皮膚／腸道及感染風險，考慮HLA-B27相關疾病並做表型導向檢查。評估IOP、synechiae、黃斑CME；不要以HLA陽性直接取代診斷。", "clinical": true, "topicId": "notes-09", "source": "眼科學No.09.pdf", "sourceRef": "16–23、30–35", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.09.pdf，頁 16–23、30–35。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-09-case-2", "title": "共筆 09 · 葡萄膜與葡萄膜炎 · 情境 2", "question": "肝膿瘍病人單眼痛與視力下降，你正在值班，如何回報？", "durationSeconds": 90, "answer": "報告全身感染背景、新發側別與起始時間、視力、瞳孔與前節／玻璃體可見發炎；明確提出疑內生性眼內炎，立即聯絡眼科。同步處理全身感染源與血培養資訊；全身抗生素不能取代眼內採檢／治療需求的專科評估。", "clinical": true, "topicId": "notes-09", "source": "眼科學No.09.pdf", "sourceRef": "39–42", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.09.pdf，頁 39–42。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-10-case-1", "title": "共筆 10 · 視網膜與玻璃體 · 情境 1", "question": "突發單眼無痛視力大幅下降，RAPD，眼底蒼白與cherry-red spot。請用一句結論及下一步回報。", "durationSeconds": 90, "answer": "疑急性CRAO，屬視網膜缺血／中風急症，立刻啟動急診中風與眼科評估，確認最後正常時間、血管危險與GCA線索。不要讓眼球按摩或門診重複檢查拖延；是否符合急性再灌流治療由當地中風專家依條件決定。", "clinical": true, "topicId": "notes-10", "source": "Retina.pdf", "sourceRef": "38–40；E07", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：Retina.pdf，頁 38–40；E07。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-10-case-2", "title": "共筆 10 · 視網膜與玻璃體 · 情境 2", "question": "病人明天要搭機，但上週視網膜手術填入氣體。如何說明？", "durationSeconds": 90, "answer": "眼內氣體尚存時可能因氣壓變化膨脹，不能未經手術團隊確認就搭機；需即聯絡確認氣體種類、殘留與限制。也要主動告知任何麻醉團隊避免N2O，遵守術後姿勢與返診警訊。不以術後固定幾天一概保證安全。", "clinical": true, "topicId": "notes-10", "source": "Retina.pdf", "sourceRef": "34–37；E09", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：Retina.pdf，頁 34–37；E09。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-11-case-1", "title": "共筆 11 · 眼瞼疾病與眼整形 · 情境 1", "question": "65歲病人上瞼下垂要直接排美容手術。請描述術前必問必量，與哪種情況需要先處理其他病因。", "durationSeconds": 90, "answer": "問起病、日內變動、複視、頭頸痛、手術外傷；量MRD1、固定額肌後的levator function、瞳孔及EOM，評估角膜保護。急發神經徵象先排III麻痺／Horner，疲勞性考慮MG；不可只按照片或MRD1排相同手術。", "clinical": true, "topicId": "notes-11", "source": "眼科學No.11.pdf", "sourceRef": "29–42；E01、E02", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.11.pdf，頁 29–42；E01、E02。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-11-case-2", "title": "共筆 11 · 眼瞼疾病與眼整形 · 情境 2", "question": "上眼瞼同處反覆腫塊，多次當霰粒腫處理仍復發，伴掉睫毛。你如何避免診斷錨定？", "durationSeconds": 90, "answer": "慢性阻塞性霰粒腫與惡性腫瘤可能外觀相似；反覆同位、老年、脫睫／瞼緣破壞需考慮sebaceous carcinoma。完整檢查瞼緣與翻瞼、視情況眼整形／腫瘤專科與病理，不再只重複以一般霰粒腫處理。", "clinical": true, "topicId": "notes-11", "source": "眼科學No.11.pdf", "sourceRef": "9–10、48–50", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.11.pdf，頁 9–10、48–50。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-12-case-1", "title": "共筆 12 · 結膜疾病與乾眼 · 情境 1", "question": "病人說Schirmer正常，因此不可能乾眼，卻有短TBUT及MGD。你會如何解釋並規劃？", "durationSeconds": 90, "answer": "說明Schirmer看分泌、TBUT看穩定性，正常分泌仍可蒸發性乾眼；檢查腺口、脂質分泌、眨眼及眼表損傷，評估混合型與其他痛覺問題。按表型給眼表／眼瞼與環境管理，必要時專科抗炎；不是一直換品牌或用單一數值否定症狀。", "clinical": true, "topicId": "notes-12", "source": "眼科學No.12.pdf", "sourceRef": "31–44、59–60；E08", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.12.pdf，頁 31–44、59–60；E08。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-12-case-2", "title": "共筆 12 · 結膜疾病與乾眼 · 情境 2", "question": "一位成人慢性單眼濾泡性結膜炎，另一位大量膿性分泌且角膜受累。比較兩者不應漏掉的處理。", "durationSeconds": 90, "answer": "前者考慮chlamydia並進行合適系統性／性病及伴侶評估；後者須警覺gonococcus等hyperacute感染，緊急眼科及全身治療。兩者不能只當一般結膜炎局部點藥；同時評估視力、角膜與全身風險。", "clinical": true, "topicId": "notes-12", "source": "眼科學No.12.pdf", "sourceRef": "14–21；E12", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.12.pdf，頁 14–21；E12。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-13-case-1", "title": "共筆 13 · 藥物眼部副作用 · 情境 1", "question": "服HCQ七年，60 kg、每日400 mg且腎功能變差，目前視力仍1.0。如何回應「我看得清楚，不需篩檢」？", "durationSeconds": 90, "answer": "計算約6.7 mg/kg/day，高於實際體重5 mg/kg/day建議；年限與腎功能使風險評估更重要。正常中央視力不排除早期毒性，需眼科結構／FAF及必要功能檢查並與處方團隊重評劑量。不能僅據高劑量就宣告已毒性或自行停藥。", "clinical": true, "topicId": "notes-13", "source": "眼科學No.13.pdf", "sourceRef": "34–38；E13", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.13.pdf，頁 34–38；E13。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-13-case-2", "title": "共筆 13 · 藥物眼部副作用 · 情境 2", "question": "Topiramate新開十天，雙眼急性−5 D近視位移與淺前房高眼壓。考官問要不要先打LPI。", "durationSeconds": 90, "answer": "先確認藥物時序與睫狀脈絡膜滲出／前移機轉，緊急眼科並聯絡原處方醫師處理疑致病藥與替代。這不是典型瞳孔阻滯，LPI不解決主因；專科可按機轉選房水抑制、cycloplegia等，避免機械套用pilocarpine。", "clinical": true, "topicId": "notes-13", "source": "眼科學No.13.pdf", "sourceRef": "49–51；E03", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.13.pdf，頁 49–51；E03。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-14-case-1", "title": "共筆 14 · 症狀鑑別與整合口試 · 情境 1", "question": "同時有三人：A戴接觸鏡後痛紅且角膜浸潤；B無痛突然失明伴cherry-red spot；C長期雙眼癢且VA正常。如何排急迫性並說第一步？", "durationSeconds": 90, "answer": "A與B皆是需立即處理的視力急症，不以「A較痛」忽略B；B啟動CRAO／中風評估，A緊急角膜感染評估與專科治療。C較偏眼表過敏，但仍看角膜及紅旗。描述資源分流與可同時求援，而非承諾單靠主訴排所有先後。", "clinical": true, "topicId": "notes-14", "source": "眼科學No.14.pdf", "sourceRef": "7–14、34–35；E07", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.14.pdf，頁 7–14、34–35；E07。參考答法來自共筆配套教材；追問為本次演練提示。", "rubric": ["直接回答情境中的核心問題", "按病史與檢查線索完成定位或鑑別", "說明急迫性、紅旗與優先處置", "交代不確定處、能力界線與求援時機", "回答有順序，並在練習時間內完成"]}, {"id": "notes-14-case-2", "title": "共筆 14 · 症狀鑑別與整合口試 · 情境 2", "question": "病人只有「看不清楚」四字。請用60秒問診，再用60秒給檢查與回報架構。", "durationSeconds": 90, "answer": "問時間、單雙眼、痛紅、閃光飛蚊／幕簾、變形／色覺／視野、外傷接觸鏡、手術用藥與全身風險。查單眼VA矯正／針孔、pupils／RAPD、EOM、前節、適當IOP與眼底。回報定位、最可能與不能漏的鑑別、關鍵待補證據與緊急性；疑破裂／化學傷例外優先安全處置。", "clinical": true, "topicId": "notes-14", "source": "眼科學No.14.pdf", "sourceRef": "4–40", "basis": "共筆臨床口試", "followups": ["這個情境中，哪一項紅旗會改變你的處置順序？", "若資料還不完整，你會補哪一项檢查或向上級確認什麼？"], "personalizationRequired": "來源：眼科學No.14.pdf，頁 4–40
