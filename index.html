case'original-search':S.originalQuery=$('#original-search').value;S.originalScope=$('#original-scope').value;S.originalResultPage=0;render();break;
case'original-clear':S.originalQuery='';S.originalResultPage=0;S.originalFocus=0;render();break;
case'original-page':S.originalPage=Math.max(0,Number(v));S.originalFocus=0;render();$('#original-content')?.scrollIntoView({block:'start'});break;
case'original-results-page':S.originalResultPage=Math.max(0,Number(v));render();break;
case'original-open':{const [n,line]=v.split(':').map(Number);S.original=n;S.originalPage=Math.floor((line-1)/120);S.originalFocus=line;S.originalQuery='';switchTab('originals');break;}
case'notebook-reset':S.search='';S.searchChapter='all';render();break;
case'notebook-search':S.search=$('#notebook-search').value;S.searchChapter=$('#notebook-chapter').value;render();break;
case'use-model':appendToInterview(S.interview,currentInterview().answer,'通用回答架構');break;
case'use-short':appendToInterview(S.interview,currentInterview().shortAnswer||'','短版口稿');break;
case'workshop-mode':if(['stories','evidence','sources'].includes(v)){S.workshop=v;switchTab('workshop');}break;
case'story-select':if(D.storySeeds.some(x=>x.id===v)){S.story=v;S.storyTarget=null;render();}break;
case'evidence-select':if(D.evidenceSeeds.some(x=>x.id===v)){S.evidence=v;render();}break;
case'course-task':if(v==='ask-back')chooseInterview(v);else if(['stories','evidence'].includes(v)){S.workshop=v;switchTab('workshop');}break;
case'send-story':{const seed=D.storySeeds.find(x=>x.id===S.story),value=storyValue();appendToInterview(S.storyTarget||seed.interviewIds[0],storyOutline(value),value.title||seed.title);break;}
case'send-evidence':{const seed=D.evidenceSeeds.find(x=>x.id===S.evidence),value=evidenceValue();appendToInterview(seed.interviewId,evidenceOutline(value),(value.confirmed?'已自行核對':'待核對')+' · '+(value.title||seed.title));break;}

case'confidence':S.confidence=Number(v);render();break;
case'submit':{const q=question();if(!q||S.selected===null||S.round[q.id])return;const value={choice:S.selected,correct:S.selected===q.correctIndex,confidence:S.confidence,at:now()};S.round[q.id]=value;put('q:'+q.id,{choice:value.choice,correct:value.correct});putMeta('q:'+q.id,{confidence:S.confidence});render();break;}
case'prev':moveQuestion(S.qi-1);break;
case'next':moveQuestion(S.qi+1);break;
case'jump':moveQuestion(Number(v));break;
case'finish':{const answered=S.ids.filter(id=>S.round[id]);const n=answered.filter(id=>S.round[id].correct).length;toast(`本輪已答 ${answered.length} / ${S.ids.length} 題，答對 ${n} 題。未作答題目可稍後補練。`);switchTab('progress');break;}
case'retry':delete S.round[question().id];S.selected=null;S.confidence=0;render();break;
case'all':startQuiz();break;
case'wrong':startQuiz('all','wrong');break;
case'practice-one':startQuiz('all','all',v);break;
case'practice-topic':startQuiz(v);break;
case'learn-topic':if(!D.topics.some(t=>t.id===v))return;S.learn=v;switchTab('learn');break;
case'topic-done':put('topic:'+v,{done:!entries['topic:'+v]?.done});render();break;
case'recall':S.recall=v==='on';S.revealed.clear();render();break;
case'reveal':S.revealed.has(v)?S.revealed.delete(v):S.revealed.add(v);render();break;
case'recall-rating':{const [key,rating]=v.split('|');putMeta('recall:'+key,{mastered:rating==='true'});render();break;}
case'interview':chooseInterview(v);break;
case'timer':if(S.deadline)pauseTimer();else{if(!S.seconds)S.seconds=currentInterview().durationSeconds;S.deadline=Date.now()+S.seconds*1000;}render();break;
case'timer-reset':S.deadline=null;S.seconds=currentInterview().durationSeconds;render();break;
case'followup':S.followup=(S.followup+1)%currentInterview().followups.length;render();break;
case'iv-done':updateIv({practiced:true});render();toast('已更新這輪演練。離開前請記得匯出。');break;
case'iv-next':chooseInterview(D.interview[(D.interview.findIndex(i=>i.id===S.interview)+1)%D.interview.length].id);break;
case'export':exportProgress();break;
case'import':$('#import-file').click();break;
}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='original-book'){S.original=Number(el.value);S.originalPage=0;S.originalFocus=0;render();return;}if(el.id==='original-scope'){S.originalScope=el.value;return;}if(el.id==='notebook-chapter'){S.searchChapter=el.value;S.search=$('#notebook-search').value;render();return;}if(el.id==='story-target'){if(D.interview.some(i=>i.id===el.value))S.storyTarget=el.value;}else if(el.classList.contains('story-quality')){const quality=[...(storyValue().quality||[0,0,0,0])];quality[Number(el.dataset.index)]=Number(el.value);putMeta('story:'+S.story,{quality});}else if(el.id==='evidence-confirmed'){putMeta('evidence:'+S.evidence,{confirmed:el.checked});$('#evidence-status').textContent=el.checked?'已依你記錄的版本與日期自行核對。':'尚未核對，送入演練時會標示「待核對」。';}else if(el.name==='answer'){S.selected=Number(el.value);render();}else if(el.id==='topic-filter')startQuiz(el.value,S.mode);else if(el.id==='mode-filter')startQuiz(S.topic,el.value);else if(el.id==='error-reason')putMeta('q:'+question().id,{reason:el.value});else if(el.classList.contains('rating')){const r=[...ivEntry().ratings];r[Number(el.dataset.index)]=el.checked;updateIv({ratings:r});$('#rating-feedback').innerHTML=ratingText(currentInterview(),r);}else if(el.id==='on-call'){S.onCall=el.checked;render();}else if(el.classList.contains('day-check')){put('day:'+el.dataset.date,{done:el.checked});render();}else if(el.classList.contains('checklist'))putMeta('checklist:'+el.dataset.key,{done:el.checked});});

setInterval(()=>{if(!S.deadline)return;S.seconds=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));if(S.tab==='interview'){$('#timer').textContent=formatTime(S.seconds);$('#timer').setAttribute('aria-label','剩餘 '+S.seconds+' 秒');$('#timer-ring').style.setProperty('--ratio',S.seconds/currentInterview().durationSeconds*100+'%');}if(S.seconds===0){S.deadline=null;if(S.tab==='interview'){$('#timer-ring').classList.add('finished');$('#timer-toggle').textContent='再練一次';$('#timer-notice').textContent='時間到。先收好最後一句，再檢查是否直接回答問題。';}toast('口述時間到，現在回看這輪的表達。');}},250);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
function exportProgress(){const payload={format:'ophthalmology-prep-progress-v3',exportedAt:now(),entries,meta:exportMeta()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ophthalmology_Progress_'+day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);dirty=false;$('.save-notice').classList.remove('is-dirty');$('#save-status').textContent='已啟動下載。請確認進度檔已保存；下次開啟 App 時匯入即可。';toast('已匯出進度與文字草稿。');}
function validDate(v){return typeof v==='string'&&Number.isFinite(Date.parse(v))?v:'1970-01-01T00:00:00.000Z';}
function validateEntry(key,v){if(!v||typeof v!=='object'||Array.isArray(v))return null;const at=validDate(v.at);if(key.startsWith('q:')){const q=D.questions.find(q=>q.id===key.slice(2));return q&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice<q.options.length?{choice:v.choice,correct:v.choice===q.correctIndex,at}:null;}if((key.startsWith('topic:')&&D.topics.some(t=>t.id===key.slice(6)))||(key.startsWith('day:')&&D.plan.some(p=>p.date===key.slice(4))))return typeof v.done==='boolean'?{done:v.done,at}:null;if(key.startsWith('interview:')&&D.interview.some(i=>i.id===key.slice(10))&&typeof v.draft==='string'&&v.draft.length<=12000&&Array.isArray(v.ratings)&&v.ratings.length===5&&v.ratings.every(x=>typeof x==='boolean')&&typeof v.practiced==='boolean')return {draft:v.draft,ratings:v.ratings,practiced:v.practiced,at};return null;}
function validateMeta(key,v){if(!v||typeof v!=='object'||Array.isArray(v))return null;const work=validateWorkshop(key,v,validDate(v.at));if(work)return work;const at=validDate(v.at),text=(s,max)=>typeof s==='string'?s.slice(0,max):'';if(key.startsWith('q:')&&D.questions.some(q=>q.id===key.slice(2)))return {at,confidence:[0,1,2,3].includes(v.confidence)?v.confidence:0,note:text(v.note,2000),reason:text(v.reason,60)};if(key.startsWith('interview:')&&D.interview.some(i=>i.id===key.slice(10)))return {at,note:text(v.note,2000)};if(key.startsWith('followup:')&&D.interview.some(i=>i.followups.some((_,n)=>key==='followup:'+i.id+':'+n)))return {at,note:text(v.note,3000)};if(key.startsWith('recall:')&&D.topics.some(t=>t.sections.some((_,n)=>key==='recall:'+t.id+':'+n))&&typeof v.mastered==='boolean')return {at,mastered:v.mastered};if(key.startsWith('checklist:')&&[['before',D.dayBeforeChecklist],['exam',D.examDayChecklist]].some(([name,items])=>items.some((_,n)=>key==='checklist:'+name+':'+n))&&typeof v.done==='boolean')return {at,done:v.done};return null;}
function mergeProgress(payload){if(!payload||!['ophthalmology-prep-progress-v1','ophthalmology-prep-progress-v2','ophthalmology-prep-progress-v3'].includes(payload.format)||!payload.entries||typeof payload.entries!=='object'||Array.isArray(payload.entries))throw Error('請選擇本 App 匯出的進度 JSON 檔。');let count=0,skipped=0;for(const [key,v] of Object.entries(payload.entries)){const value=validateEntry(key,v);if(value){if(!entries[key]||Date.parse(value.at)>=Date.parse(entries[key].at)){entries[key]=value;count++;}}else skipped++;}if(payload.meta&&typeof payload.meta==='object'&&!Array.isArray(payload.meta))for(const [key,v] of Object.entries(payload.meta)){const value=validateMeta(key,v);if(value){if(!meta[key]||Date.parse(value.at)>=Date.parse(meta[key].at)){meta[key]=value;count++;}}else skipped++;}S.round=Object.create(null);S.selected=null;S.confidence=0;changed();render();return {count,skipped};}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('檔案過大，請使用本 App 匯出的進度檔。');const payload=JSON.parse(await file.text());if((Object.keys(entries).length||Object.keys(meta).length)&&!window.confirm('將合併進度；同一項目保留時間較新的版本。繼續？'))return;const result=mergeProgress(payload);toast(`已合併 ${result.count} 筆記錄${result.skipped?'，略過 '+result.skipped+' 筆無效資料':''}。`);}catch(e){toast(e instanceof SyntaxError?'無法讀取 JSON，請確認選擇的是進度檔。':e.message);}finally{e.target.value='';}});
render();
})();
</script>
</body></html>
