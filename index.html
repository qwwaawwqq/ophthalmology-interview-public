囊：基底膜、厚薄與手術屏障", "pages": [13, 18], "unitId": "u2", "sectionIndexes": [3], "terms": ["Lens capsule", "Type IV collagen", "Glycosaminoglycan", "Posterior capsule"], "keyPoints": ["晶狀體囊是包覆晶狀體的透明彈性基底膜，含第四型膠原與相關基質成分。它承受懸韌帶張力，提供調節力學及術後囊袋支撐。", "中央後囊很薄，前後赤道附近的厚度分布不均；不要把「赤道絕對最厚」當精確組織規則。後囊也是前後節間的重要物理界面，破裂會增加玻璃體及晶狀體物質移位風險。"], "clinicalLink": "手術每一步都要知道現在保留的囊膜及懸韌帶是否完整。", "pitfall": "囊膜不是可任意拉扯的厚袋；尤其後囊脆弱。", "recall": {"question": "後囊完整為何對白內障手術重要？", "answer": "保留囊袋支撐並減少玻璃體與晶狀體物質跨界問題。"}, "relatedTopics": ["notes-07"], "sourceIds": ["cov06-capsule"]}, {"id": "c13", "title": "True exfoliation 與 pseudoexfoliation 不同病理", "pages": [14, 18], "unitId": "u2", "sectionIndexes": [3], "terms": ["True exfoliation", "Pseudoexfoliation", "Poor dilation", "Zonular weakness"], "keyPoints": ["真性 exfoliation 是前囊表層分層或剝離，經典與高熱／紅外線暴露相關，也可有其他背景。它與散布於多個前節位置的異常沉積不是同一件事。", "Pseudoexfoliation 是纖維性顆粒物質沉積，可見瞳孔緣與前囊特殊外觀，並伴散瞳不佳、懸韌帶脆弱及青光眼。風險不限於特定人種，沒有高眼壓也不能忽略手術風險。"], "clinicalLink": "術前見假性剝脫時，同時評估隅角／視神經與囊袋穩定性。", "pitfall": "名稱相似不表示一個是另一個的早晚期。", "recall": {"question": "假性剝脫最重要的兩類臨床風險？", "answer": "青光眼及白內障手術時的散瞳／懸韌帶支撐問題。"}, "relatedTopics": ["notes-07"], "sourceIds": ["an06-pxf", "cov06-capsule"]}, {"id": "c14", "title": "前上皮與鈉鉀幫浦：透明也需要代謝", "pages": [14, 18], "unitId": "u1", "sectionIndexes": [0, 6], "terms": ["Lens epithelial cells", "Na⁺/K⁺-ATPase", "Osmotic balance"], "keyPoints": ["前囊下上皮是一層保留細胞核與胞器的活躍細胞，參與合成、運輸及新纖維形成。其功能不同於中央成熟、已去胞器的纖維細胞。", "Na⁺/K⁺-ATPase 等運輸系統維持離子與水分平衡，避免不適當膨脹及散射。房水提供營養，並不表示所有物質都能被動自由進出而不需調控。"], "clinicalLink": "代謝或氧化損傷可透過水分失衡及蛋白改變損害透明。", "pitfall": "不能說整顆晶狀體所有細胞都沒有粒線體。", "recall": {"question": "哪一部分保留較完整細胞代謝能力？", "answer": "前囊下上皮與較年輕外層細胞；中央成熟纖維已失去多數胞器。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov06-histology", "cov06-oxidative"]}, {"id": "c15", "title": "纖維排列、水分與光散射", "pages": [15, 19, 22], "unitId": "u1", "sectionIndexes": [0, 6], "terms": ["Lens fiber cells", "Transparency", "Crystallins", "Short-range order"], "keyPoints": ["晶狀體約以水和高濃度蛋白為主，纖維細胞緊密規則排列，成熟後減少胞器造成的散射。透明不是完全沒有蛋白，而是蛋白與細胞結構保持適當均一。", "Crystallins 的局部秩序、相互作用與濃度分布幫助光線通過；蛋白聚集、膜受損或水分失衡會增加折射率不均及散射。近似成分比例只用來建立概念，並非每年齡精確常數。"], "clinicalLink": "以散射理解眩光與對比下降，補足高對比視力表以外的功能。", "pitfall": "高蛋白濃度本身不是白內障，失去有序透明狀態才是關鍵。", "recall": {"question": "為什麼透明晶狀體可以含大量蛋白？", "answer": "因纖維與蛋白維持有序及相對均一的光學環境。"}, "relatedTopics": ["notes-02"], "sourceIds": ["cov06-aqp", "cov06-histology"]}, {"id": "c16", "title": "α、β、γ-crystallin：結構與分子伴護", "pages": [8, 17, 23, 32, 34, 35, 36], "unitId": "u1", "sectionIndexes": [5, 6], "terms": ["α-crystallin", "αA／αB", "β-crystallin", "γ-crystallin", "Chaperone"], "keyPoints": ["α-crystallin 由 αA、αB 等次單元形成複合體，具有分子伴護作用，可結合部分不穩定蛋白並減少聚集；β 家族可形成多種寡聚結構，γ 家族主要為單體，兩者都是重要結構晶體蛋白。", "比較分子大小時須分清單體與寡聚複合體，不能把共筆不同層級的 kDa 數字直接排行。老化與損傷可增加高分子聚集及不溶性成分，降低透明。"], "clinicalLink": "從蛋白穩定性連到核性硬化與白內障，而非把蛋白全視為越少越好。", "pitfall": "α-crystallin 的保護機轉不代表補充某種蛋白即可治療白內障。", "recall": {"question": "白內障形成時，不溶性聚集蛋白通常如何變化？", "answer": "通常增加；蛋白聚集與結構改變使散射增加。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov06-aqp", "cov06-oxidative"]}, {"id": "c17", "title": "非水溶性蛋白：細胞骨架與 AQP0", "pages": [23, 32], "unitId": "u1", "sectionIndexes": [6], "terms": ["Cytoskeletal proteins", "MIP", "Aquaporin 0", "Membrane protein"], "keyPoints": ["以溶解性分類蛋白是生化分離方法；尿素可溶部分含細胞骨架相關蛋白，維持纖維形狀與秩序。這個分類不是把所有非水溶性蛋白一律視為病態。", "MIP 亦稱 aquaporin 0，是晶狀體纖維的重要膜蛋白，參與水通道與細胞接觸的維持。它與可溶性 crystallins 分工，突變或結構破壞可影響透明。"], "clinicalLink": "先區分正常結構蛋白與老化新增加的異常蛋白聚集。", "pitfall": "「非水溶性增加可見白內障」不等於正常晶狀體不含膜蛋白。", "recall": {"question": "AQP0 是主要負責自由溶於細胞質的晶體蛋白嗎？", "answer": "不是，它是重要膜蛋白／水通道。"}, "relatedTopics": ["notes-02"], "sourceIds": ["cov06-aqp"]}, {"id": "c18", "title": "能量代謝：無氧糖解、TCA 與 HMP 分工", "pages": [23, 32], "unitId": "u1", "sectionIndexes": [6], "terms": ["Anaerobic glycolysis", "Hexokinase", "TCA cycle", "HMP shunt", "NADPH"], "keyPoints": ["葡萄糖經 hexokinase 進入糖解路徑，晶狀體大部分葡萄糖代謝依靠無氧糖解，以支持低氧、無血管環境。保留粒線體的上皮仍可進行 TCA 與氧化代謝，因此不是完全沒有有氧路徑。", "HMP／磷酸戊糖途徑提供 NADPH 等還原力，支援抗氧化系統；ATP 產量比例與葡萄糖流量比例不是同一件事。來源中的百分比可作教學近似，不當作每個細胞固定值。"], "clinicalLink": "把能量生產與抗氧化需求連到幫浦、水分與蛋白穩定。", "pitfall": "NADPH 不是主要拿來直接替代 ATP 驅動所有運輸。", "recall": {"question": "HMP shunt 對晶狀體透明的主要連結？", "answer": "提供還原力，協助維持如 glutathione 的抗氧化能力。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov06-oxidative"]}, {"id": "c19", "title": "Sorbitol 路徑與糖尿病的屈光波動", "pages": [24, 27, 32, 33], "unitId": "u1", "sectionIndexes": [6], "terms": ["Aldose reductase", "Sorbitol", "Fructose", "Osmotic cataract"], "keyPoints": ["葡萄糖可經 aldose reductase 轉成 sorbitol，再進一步代謝；高糖環境使此路徑負荷增加，晶狀體內多元醇累積可提高滲透性壓力，影響水分與透明。", "糖尿病也涉及氧化及其他代謝影響，不宜把所有白內障都歸於單一酵素。血糖快速變動時屈光可變，方向與病程未必固定，因此新度數需與代謝狀態一起解讀。"], "clinicalLink": "若近期血糖不穩，先釐清視力變動再決定長期眼鏡處方。", "pitfall": "用近視變深或遠視化單獨判斷血糖高低並不可靠。", "recall": {"question": "糖尿病患者短期度數波動，應立即配成永久處方嗎？", "answer": "先確認血糖與屈光穩定性，並排除其他眼病。"}, "relatedTopics": ["notes-02", "notes-10"], "sourceIds": ["cov06-oxidative", "an06-cataract"]}, {"id": "c20", "title": "氧化壓力、glutathione 與酵素鏈", "pages": [23, 24, 32], "unitId": "u1", "sectionIndexes": [6], "terms": ["Superoxide dismutase", "Catalase", "Glutathione peroxidase", "Glutathione reductase", "GSH／GSSG"], "keyPoints": ["自由基可來自正常代謝、炎症及光照，促進蛋白與脂質損傷。SOD 將超氧陰離子轉為過氧化氫，catalase 或 glutathione peroxidase 再參與清除過氧化物，避免把中間物累積。", "還原態 GSH 在反應中被氧化成 GSSG，glutathione reductase 利用 NADPH 協助再生 GSH。維生素 C、E 亦參與抗氧化環境，但生化角色不等於口服補充就可消除白內障。"], "clinicalLink": "把 HMP 提供 NADPH、抗氧化循環及晶體蛋白保護串在一起。", "pitfall": "共筆把氧化與還原箭頭混寫時，應以 GSH→GSSG 消耗、NADPH 支援再生理解。", "recall": {"question": "哪個步驟把 GSSG 回收為 GSH？", "answer": "Glutathione reductase 利用 NADPH 提供還原力。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov06-oxidative"]}, {"id": "c21", "title": "調節與老花：力學不是單純肌肉變弱", "pages": [5, 22, 35, 36], "unitId": "u1", "sectionIndexes": [5], "terms": ["Accommodation", "Ciliary muscle", "Zonular tension", "Presbyopia"], "keyPoints": ["看近時睫狀肌收縮，懸韌帶張力下降，晶狀體變凸並增加屈光力；看遠時調節放鬆則較扁。此力學需完整囊膜、懸韌帶及具有適當可變形性的晶狀體。", "老化後晶狀體持續增長但調節能力下降，與材料及結構變化等因素相關，不能簡化成睫狀肌完全不工作。近視者摘鏡近讀利用的是遠點，不等於調節恢復。"], "clinicalLink": "為患者分開解釋老花、近視化與白內障三者。", "pitfall": "晶狀體愈厚不代表調節幅度愈大。", "recall": {"question": "年長晶狀體增厚，調節力一定增加嗎？", "answer": "不會；老化常使可用調節下降。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an06-cataract"]}, {"id": "c22", "title": "白內障症狀：散射、對比與單眼複視", "pages": [25, 33, 34, 36], "unitId": "u1", "sectionIndexes": [7], "terms": ["Glare", "Monocular diplopia", "Contrast sensitivity", "Color change"], "keyPoints": ["晶狀體混濁造成吸收、散射與光路不均，可表現為緩慢模糊、眩光、夜間困難、色彩偏黃或褪色及單眼複視。高對比視力表可能低估實際困擾。", "閱讀需更多光與亮光下反而更差並不互相排除，取決於混濁位置、瞳孔及環境。突然失明、明顯疼痛或紅眼不應先用普通老年白內障解釋。"], "clinicalLink": "問具體生活功能，再將症狀與裂隙燈定位配對。", "pitfall": "白內障常見並不表示所有老年新視力下降都可等候。", "recall": {"question": "術前視力 6/9 就能否定白內障造成嚴重眩光嗎？", "answer": "不能，需看實際功能與其他檢查。"}, "relatedTopics": ["notes-14"], "sourceIds": ["an06-cataract", "an06-nei"]}, {"id": "c23", "title": "核性、皮質性與後囊下：位置先於嚴重度", "pages": [25, 26, 33, 35], "unitId": "u1", "sectionIndexes": [7], "terms": ["Nuclear sclerosis", "Cortical spokes", "Posterior subcapsular cataract", "PSC"], "keyPoints": ["核性白內障位於中央晶核，可伴黃褐化與近視位移；皮質型形成周邊放射狀 spokes，進入視軸或瞳孔變大時可增加眩光；PSC 在後囊前方的中央區域，較小病灶也可能明顯影響近用與亮光視力。", "三型可共存，不能固定說核性一定輕、皮質型一定重。裂隙燈光學切面與反向照明各有用途，需聚焦正確層次，將位置、密度及功能一起判讀。"], "clinicalLink": "同樣視力下降，屈光改變主導與散射主導的換鏡收益可能不同。", "pitfall": "PSC 是天然晶狀體病變，不是術後 PCO。", "recall": {"question": "中央後囊下小病灶為何可比大範圍周邊混濁更困擾？", "answer": "它更接近使用中的視軸，亮光縮瞳時影響尤其可能明顯。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an06-cataract", "an06-psc"]}, {"id": "c24", "title": "分級與影像紀錄：密度不能代替功能決策", "pages": [26, 33], "unitId": "u1", "sectionIndexes": [7, 8], "terms": ["Nuclear color", "Nuclear opalescence", "Cortical grading", "Posterior subcapsular grading"], "keyPoints": ["白內障分級可分別描述核色澤、核混濁、皮質及後囊下混濁程度；標準照片有助一致追蹤。圖片上的數字只有在相同分級系統與檢查條件下才可比較。", "原講義的分級影像用來辨識由少到多的形態，不宜把低解析度翻拍硬判成精確等級。患者眩光與功能需求可能與單一密度數字不完全一致。"], "clinicalLink": "記錄具體混濁位置及如何影響閱讀、行動或工作，比只寫幾級更可用。", "pitfall": "不同分級系統的數字不一定相等。", "recall": {"question": "同一個分級是否代表每位患者都應在同一時間手術？", "answer": "否，還需看視功能、共病、需求與風險。"}, "relatedTopics": ["notes-01"], "sourceIds": ["an06-cataract", "an06-nei"]}, {"id": "c25", "title": "白內障成因：年齡、系統病與曝露史", "pages": [27, 33, 34, 35, 36], "unitId": "u1", "sectionIndexes": [6, 7], "terms": ["Age-related cataract", "Diabetes", "Corticosteroid", "Traumatic cataract", "Radiation"], "keyPoints": ["年齡相關蛋白與結構變化最常見，但家族／先天因素、糖尿病、外傷、眼內手術、炎症、放射線與類固醇等亦可參與。不同年齡及單雙眼分布會改變鑑別。", "UV 曝露是可調整的相關因素之一，可採合適防護；戴合格太陽眼鏡不是白內障病因。必要的系統類固醇不應因擔心白內障自行停藥，需與原治療團隊討論。"], "clinicalLink": "問清藥物、受傷與治療時間軸，判斷是否有可處理的共同風險。", "pitfall": "共筆選擇題若將戴太陽眼鏡列為致病敘述，應辨認是錯誤選項而非背進病因清單。", "recall": {"question": "年輕人單眼白內障，除了老化還要先問什麼？", "answer": "外傷、炎症、手術及藥物史，並評估先天／系統因素。"}, "relatedTopics": ["notes-13", "notes-09"], "sourceIds": ["an06-cataract", "an06-nei"]}, {"id": "c26", "title": "術前評估：先證明能改善哪一段視覺", "pages": [27, 28, 33], "unitId": "u2", "sectionIndexes": [8], "terms": ["Best-corrected vision", "Biometry", "Retinal assessment", "Shared decision"], "keyPoints": ["重新驗光與最佳矯正視力有助估计可由眼鏡改善的成分；裂隙燈確認混濁，眼底與必要影像評估黃斑和視神經，避免把其他視力限制誤算為手術效益。", "眼軸與角膜生物測量決定 IOL 起始計算；乾眼、曾做屈光手術、散瞳不佳或懸韌帶不穩各影響不同步驟。手術適應不能只用固定視力門檻或混濁級數。"], "clinicalLink": "共同決策說明期待改善、仍需眼鏡及共病限制。", "pitfall": "手術技術成功不等於患者所有視覺症狀都會消失。", "recall": {"question": "為何白內障很明顯仍要看眼底？", "answer": "因視網膜與視神經共病影響預期視力及 IOL 選擇。"}, "relatedTopics": ["notes-01", "notes-10"], "sourceIds": ["an06-cataract", "an06-nei"]}, {"id": "c27", "title": "ICCE 與 ECCE：是否保留囊袋", "pages": [28, 29, 33, 34, 35, 36], "unitId": "u2", "sectionIndexes": [9], "terms": ["Intracapsular extraction", "ICCE", "Extracapsular extraction", "ECCE", "Aphakia"], "keyPoints": ["ICCE 把晶狀體連囊膜取出，失去原囊袋支撐；ECCE 移除晶狀體內容並保留後囊及適當囊袋部分。兩者切口、組織保留與後續光學安排不同。", "没有囊袋不代表永遠不能植入 IOL，也不表示視力無法改善；依條件可用其他固定方式或光學矯正。傳統 ECCE 仍有特定適用情境，現代 phaco 本質上亦保留囊袋。"], "clinicalLink": "比較術式要回答「移除什麼、保留什麼、IOL 靠什麼支撐」。", "pitfall": "不沿用共筆把 ICCE 簡化成只能戴厚眼鏡且無法改善視力。", "recall": {"question": "ECCE 與 ICCE 最核心解剖差異？", "answer": "ECCE 保留後囊／囊袋部分，ICCE 連囊膜移除。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an06-cataract", "an06-video"]}, {"id": "c28", "title": "Phaco 前半段：麻醉、OVD 與連續撕囊", "pages": [29, 30, 33], "unitId": "u2", "sectionIndexes": [9], "terms": ["Topical anesthesia", "Peribulbar／retrobulbar block", "OVD", "CCC"], "keyPoints": ["局部表面麻醉與球周／球後阻滯各有選擇與風險，不以新舊簡單排行。切口及 side port 提供操作通道，眼科黏彈劑 OVD 維持空間並保護角膜內皮。", "連續環形撕囊 CCC 建立邊緣連續的前囊開口，利於安全操作及 IOL 定位。大小、完整性與對中很重要，但不同風險眼可能需調整，不能只背「畫越圓越好」。"], "clinicalLink": "把步驟目的連到角膜內皮保護、囊袋完整與視野暴露。", "pitfall": "這是理解手術影片的架構，不能替代實作訓練或特定病例決策。", "recall": {"question": "OVD 與 CCC 各主要保留什麼條件？", "answer": "OVD 保持空間並保護組織；CCC 保留可控且連續的囊膜開口。"}, "relatedTopics": ["notes-05"], "sourceIds": ["an06-video", "cov06-capsule"]}, {"id": "c29", "title": "Hydrodissection 不等於 hydrodelineation", "pages": [29, 30], "unitId": "u2", "sectionIndexes": [9], "terms": ["Hydrodissection", "Hydrodelineation", "BSS", "Capsular block"], "keyPoints": ["現代 cortical-cleaving hydrodissection 用液體分離皮質與囊膜界面，促進晶狀體內容移動及清除；hydrodelineation 則分開較硬內核與外核／epinuclear shell，是不同解剖平面。", "BSS 是平衡鹽液，不是把囊膜溶解的藥。液體壓力、出口及囊膜風險需控制；後極白內障或已疑囊膜缺損等情境不能機械套常規水分離。"], "clinicalLink": "看影片時辨識液波所在層次，再理解後續核處理是否順利。", "pitfall": "共筆把兩個 hydro 名詞並列成同義詞，應更正。", "recall": {"question": "哪個步驟分開內核與外核殼？", "answer": "Hydrodelineation；不是 cortical-cleaving hydrodissection。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov06-hydro", "cov06-capsule"]}, {"id": "c30", "title": "Phaco 後半段：能量、吸除、IOL 與傷口", "pages": [29, 30], "unitId": "u2", "sectionIndexes": [9], "terms": ["Phacoemulsification", "Irrigation／aspiration", "Longitudinal／torsional", "Wound hydration"], "keyPoints": ["Phaco 以超音波處理晶核並吸除碎片，可有縱向或扭轉等探頭運動模式；灌注維持前房並協助散熱。核處理與皮質吸除須避免牽拉囊膜及懸韌帶。", "確認支撐後置入適合的 IOL，清除殘餘 OVD 並檢查傷口密閉。角膜切口水合可協助閉合，但需要時仍可縫合；膽鹼促效劑（cholinergic agonist）可縮瞳，但不是每例必經步驟。"], "clinicalLink": "將角膜水腫、術後眼壓與 IOL 位置連回各步驟的目的。", "pitfall": "不能保證小切口永遠不需縫線，或固定用藥能代替個別判斷。", "recall": {"question": "為何術末要注意殘留 OVD 與傷口？", "answer": "前者可影響術後眼壓，後者影響前房穩定及感染風險。"}, "relatedTopics": ["notes-07"], "sourceIds": ["an06-video", "cov06-capsule"]}, {"id": "c31", "title": "飛秒輔助白內障：精準步驟仍是手術", "pages": [28, 30, 31, 33, 34, 35, 36], "unitId": "u2", "sectionIndexes": [9], "terms": ["Femtosecond laser-assisted cataract surgery", "Capsulotomy", "Lens fragmentation"], "keyPoints": ["飛秒雷射可協助角膜切口、前囊切開及晶核預分割，再由手術完成移除及植入。雷射前囊切開與手工連續撕囊的形成方式不同，即使目的相近也不完全同義。", "它可提高某些步驟的一致性，但並不保證無後囊傷害、無疼痛或更好的每項結果。仍需適當定位、完整性檢查及面對個別解剖風險。"], "clinicalLink": "向患者解釋雷射是輔助工具，結果仍受共病、量測與手術過程影響。", "pitfall": "不要把「有雷射」說成完全不用手術或必然比所有傳統手術優越。", "recall": {"question": "飛秒是否能自行完成所有白內障移除與 IOL 植入？", "answer": "不能，仍需後續手術步驟。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an06-cataract", "an06-video"]}, {"id": "c32", "title": "IOL 材料、單焦、多焦、調節型與 toric", "pages": [31], "unitId": "u2", "sectionIndexes": [10], "terms": ["Acrylic／silicone IOL", "Monofocal", "Multifocal", "Accommodating IOL", "Toric"], "keyPoints": ["Acrylic 與 silicone 等材料可製成不同設計的 IOL，材料與焦點功能是兩個分類。單焦可設定遠或近目標；多焦或延伸焦深透過光學設計擴展使用範圍，可能有眩光或對比取捨。", "調節型 IOL 嘗試藉位置或形態改變提供焦距變化，不等於恢復年輕調節。Toric 用於適當規則角膜散光，軸向與旋轉穩定性重要；不規則角膜與黃斑／視神經病會影響選擇。"], "clinicalLink": "將工作距離、夜間需求、眼部共病與可接受的戴鏡程度一起討論。", "pitfall": "單焦不是只能看遠，多焦也不保證完全免鏡。", "recall": {"question": "Toric IOL 最直接針對哪一類光學問題？", "answer": "適當的規則角膜散光，需正確軸向與穩定位置。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an06-nei", "an06-cataract"]}, {"id": "c33", "title": "囊膜破裂、IOL 位移與術後風險", "pages": [31], "unitId": "u3", "sectionIndexes": [11], "terms": ["Posterior capsule rupture", "IOL dislocation", "Hyphema", "Corneal edema", "Retinal detachment"], "keyPoints": ["術中後囊或懸韌帶受損可能影響玻璃體與 IOL 支撐；術後可有角膜水腫、眼壓上升、前房出血 hyphema、炎症、感染或 IOL 位移。風險依眼部條件及過程不同。", "新發閃光飛蚊、視野幕遮需警覺視網膜裂孔／剝離；疼痛、紅眼、快速降視力則需排除感染等急症。不能用單一「成功率」取代個別風險及回報時機。"], "clinicalLink": "術後衛教包含警訊與聯繫方式，評估時重新量視力並定位。", "pitfall": "沒有疼痛也不能排除嚴重術後視網膜或感染問題。", "recall": {"question": "術後突然幕遮與飛蚊，先當 PCO 嗎？", "answer": "不應；需及時眼底評估裂孔／剝離等原因。"}, "relatedTopics": ["notes-10", "notes-07"], "sourceIds": ["an06-nei", "cov06-capsule"]}, {"id": "c34", "title": "PSC、PCO 與術後重新模糊的時間軸", "pages": [25, 26, 30, 31, 34, 36], "unitId": "u3", "sectionIndexes": [11], "terms": ["Posterior subcapsular cataract", "Posterior capsule opacification", "Nd:YAG capsulotomy", "Endophthalmitis"], "keyPoints": ["PSC 位於天然晶狀體後囊下；PCO 是白內障移除後，殘留晶狀體上皮細胞相關的後囊混濁。兩者名稱相近但發生的眼內狀態不同。", "數月逐漸模糊可考慮 PCO，但需確認其解釋症狀再討論 Nd:YAG；短期痛紅降視力應及時排除眼內炎、高眼壓等。雷射囊切開不是所有術後模糊的快捷答案。"], "clinicalLink": "重建術前、術後改善及再次惡化時間軸，避免沿用原診斷。", "pitfall": "白內障不是原晶狀體在術後重新長回來。", "recall": {"question": "術後第五天明顯紅痛且視力惡化，是否能等原回診？", "answer": "需及時聯絡手術團隊或急診眼科評估。"}, "relatedTopics": ["notes-09", "notes-14"], "sourceIds": ["an06-psc", "an06-nei"]}, {"id": "c35", "title": "Ectopia lentis：Marfan、外傷與懸韌帶", "pages": [15, 19], "unitId": "u2", "sectionIndexes": [4], "terms": ["Ectopia lentis", "Subluxation", "Marfan syndrome", "FBN1", "Phacodonesis"], "keyPoints": ["晶狀體異位是位置離開正常懸吊區，半脫位仍有部分支撐，完全脫位可進入前房或玻璃體。外傷、假性剝脫、遺傳或孤立性懸韌帶異常都需考慮。", "Marfan 常為體染色體顯性遺傳，與第15號染色體的 FBN1／fibrillin 微纖維異常相關，可見晶狀體偏上顳側，但方向不是必要條件。晶狀體晃動 phacodonesis、屈光波動或邊緣可見是線索，亦需留意心血管評估。"], "clinicalLink": "移位診斷要連到屈光、閉角／角膜接觸風險及全身疾病。", "pitfall": "偏上顳側不能單獨確診 Marfan，偏其他方向也不排除。", "recall": {"question": "晶狀體晃動對白內障術前規劃代表什麼？", "answer": "可能懸韌帶支撐不穩，需調整手術與 IOL 固定計畫。"}, "relatedTopics": ["notes-07", "notes-02"], "sourceIds": ["cov06-ectopia", "an06-pxf"]}, {"id": "c36", "title": "Homocystinuria：晶狀體異位不能漏掉血栓風險", "pages": [16, 19], "unitId": "u2", "sectionIndexes": [4], "terms": ["Homocystinuria", "Cystathionine β-synthase", "CBS", "Thromboembolism"], "keyPoints": ["典型 CBS 缺乏型 homocystinuria 是體染色體隱性遺傳的胺基酸代謝疾病，可有高同半胱胺酸、晶狀體異位、骨骼及神經發育表現。它和 Marfan 都可能身材修長，但病理及全身風險不同。", "晶狀體常偏下或鼻側，仍可有其他方向；血栓栓塞是重要而可能危及生命的風險。合適檢驗與代謝專科評估比背偏位方向更重要，手術前亦需跨科風險規劃。"], "clinicalLink": "從眼部線索辨認可能的系統病，避免只處理眼鏡度數。", "pitfall": "共筆提到的高比例不是每個族群固定風險，且方向不能當唯一篩檢。", "recall": {"question": "與 Marfan 相似體型但疑 homocystinuria，最不能忽略哪項風險？", "answer": "血栓栓塞風險，需系統性評估與治療。"}, "relatedTopics": ["notes-07"], "sourceIds": ["cov06-ectopia"]}, {"id": "c37", "title": "治療選擇：改善功能與移除混濁是兩件事", "pages": [28, 33, 34, 35, 36], "unitId": "u2", "sectionIndexes": [8], "terms": ["Cataract surgery", "Optical rehabilitation", "Functional indication"], "keyPoints": ["適當眼鏡、照明與眩光管理可在早期改善功能，但不會把已混濁的晶狀體變回透明。當白內障確實限制生活且預期收益合理時，手術移除混濁是標準的有效治療方式。", "沒有獲證實能普遍逆轉老年性白內障的滴眼藥可取代手術；也不能從抗氧化的生化機轉直接推論保健品療效。是否手術仍依個人功能、共病、風險及偏好，而非有白內障就立即開刀。"], "clinicalLink": "將可暫時改善的光學需求與根本移除混濁分開討論。", "pitfall": "不要說所有白內障都必須立刻手術，也不要保證藥物能溶解白內障。", "recall": {"question": "更亮照明讓閱讀改善，表示白內障已被治好了嗎？", "answer": "沒有，它改善使用條件；晶狀體混濁是否需手術仍依功能及完整評估。"}, "relatedTopics": ["notes-02", "notes-13"], "sourceIds": ["an06-cataract", "an06-nei"]}], "unresolved": [], "sourceSha256": "0faf5da9bc49b97eed6b9d65a95a97a30574713c8cb56ee1b6dd7ff26f1d7ec5"}, "notes-07": {"sourceFile": "眼科學No.07.pdf", "pageCount": 57, "reviewedPages": [{"from": 1, "to": 4, "kind": "administrative", "note": "封面、目錄及課堂回饋；教學主題另由正文逐項映射"}, {"from": 5, "to": 22, "kind": "teaching", "note": "視神經、視野、風險、量壓、高眼壓症及重點整理"}, {"from": 23, "to": 28, "kind": "exam", "note": "結構功能、風險與測壓考題和解析"}, {"from": 29, "to": 49, "kind": "teaching", "note": "分類、房角、原發次發與兒童青光眼、藥物雷射手術"}, {"from": 50, "to": 57, "kind": "exam", "note": "分型與治療選擇、藥物風險考題及解析"}], "entries": [{"id": "c01", "title": "青光眼的損失是神經與功能，病人未必看見黑洞", "pages": [5, 13, 14, 21, 25, 26, 27, 28], "unitId": "u1", "sectionIndexes": [0, 2], "terms": ["glaucomatous optic neuropathy", "RGC", "不可逆視野", "雙眼代償"], "keyPoints": ["青光眼是進展性視神經病變，主要損傷視網膜神經節細胞RGC及其軸突。降壓的目標是保留未來功能，已喪失的視野通常不能恢復；共筆舊流行病學人數混合患病與失明，不沿用為現況。", "早期缺損可能被另一眼、眼球掃視與知覺補償掩蓋，病人不一定描述黑色缺口。周邊常受累，但中央旁缺損也能早發，因此保有良好中央視力不代表病情輕微。"], "clinicalLink": "問路口行走、階梯、閱讀與夜間活動，連結檢查結果與生活風險。", "pitfall": "不要把「未察覺」解釋成沒病，也不要承諾降壓會恢復所有視野。", "recall": {"question": "病人視力1.0，為何仍需治療？", "answer": "視力表主要測中央解析度，不能代表完整視野或未來進展風險。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["n07-nei"]}, {"id": "c02", "title": "篩板、RNFL與神經網膜緣的結構鏈", "pages": [5, 6, 7, 21, 23, 24, 25, 27, 53, 57], "unitId": "u1", "sectionIndexes": [1], "terms": ["lamina cribrosa", "RNFL", "neuroretinal rim", "ISNT rule", "cup-disc ratio"], "keyPoints": ["RGC軸突沿RNFL匯入視乳頭並穿過篩板，篩板周圍的機械與血管環境參與易損性。常見上顳或下顳緣局部變薄，進而出現垂直杯凹延長與相應神經纖維束缺失。", "正常緣寬常以ISNT規則作記憶，但視盤大小、近視傾斜和個體變異都會影響外觀。杯盤比偏大或雙眼差異是懷疑線索，不是獨立診斷門檻，需配對RNFL和視野。"], "clinicalLink": "從下顳緣缺損推測上方弓形視野，再用檢查確認。", "pitfall": "生理大杯凹與小視盤的隱匿損伤都可能被單一C/D比誤判。", "recall": {"question": "杯凹縱向變長對應什麼結構變化？", "answer": "上或下緣優先流失可能造成縱向延長，須與視盤形態及其他证據對照。"}, "relatedTopics": [], "sourceIds": ["n07-oct", "n07-nei"]}, {"id": "c03", "title": "血管位移、刺刀徵與視盤出血", "pages": [7, 8, 21], "unitId": "u1", "sectionIndexes": [1], "terms": ["bayoneting", "overpass", "disc hemorrhage", "RNFL wedge defect"], "keyPoints": ["神經網膜緣失去支撐可使血管位移、跨越杯凹呈懸空或在邊緣急折，形成教材的overpass與bayoneting描述。RNFL束狀缺失則可見楔形暗區，應與受累部位及視野互相核對。", "視盤邊緣片狀出血可能與青光眼活動或進展風險有關，但不是每次都出現，也需排其他出血原因。發現後應重看測量品質、眼壓及過往結構功能趨勢，不能單憑一次照片斷言失控。"], "clinicalLink": "連續眼底照片可補足一次OCT沒有捕捉到的變化。", "pitfall": "視盤出血不是青光眼專屬，也不能因下次消失就不追蹤。", "recall": {"question": "為何要保存視盤出血照片？", "answer": "出血可短暫存在，照片可協助定位和後續進展比對。"}, "relatedTopics": [], "sourceIds": ["n07-oct"]}, {"id": "c04", "title": "OCT原始厚度與正常資料庫色碼是兩張不同的圖", "pages": [9, 10, 21], "unitId": "u1", "sectionIndexes": [1], "terms": ["thickness map", "deviation map", "segmentation artifact", "red disease", "玻璃體牽拉"], "keyPoints": ["厚度圖顏色表達實測厚薄；偏差圖顏色表達與参考資料庫的差異。紅色可能在前者表示較厚、在後者表示異常偏薄，因此必須先讀圖例、掃描位置及原始B-scan。", "高度近視、混濁、分割錯誤和玻璃體牽拉都會干擾量測。玻璃體脫離後牽拉減少造成厚度下降，不一定是新神經損失；共筆把牽拉構造寫成晶狀體應修正為玻璃體。"], "clinicalLink": "報告異常要先確認影像品質，再看是否與眼底和功能相符。", "pitfall": "不能用最紅的格子單獨確診，也不能因全綠排除早期疾病。", "recall": {"question": "厚度突然下降卻與視野不符，先查什麼？", "answer": "掃描及分割品質、牽拉或介質改變，再評估真正進展。"}, "relatedTopics": ["notes-10"], "sourceIds": ["n07-oct"]}, {"id": "c05", "title": "視野的水平分界、上下反轉與垂直紅旗", "pages": [10, 11, 14, 21, 23, 24, 25, 26, 27, 28, 33], "unitId": "u1", "sectionIndexes": [2], "terms": ["horizontal meridian", "nasal step", "arcuate scotoma", "hemianopia"], "keyPoints": ["神經纖維上下束的走向使典型青光眼視野常尊重水平中線，上下程度不對稱。下方視網膜或下緣損傷對應上方視野；鼻側階梯與弓形缺損要能回推到相應結構。", "嚴格沿垂直中線的同向或雙顳半盲應考慮後視路或視交叉定位；早期明顯色覺與中央視力損失、蒼白超過凹陷也提示非典型視神經病。這些是重新評估訊號，不是說青光眼患者不能同時有另一疾病。"], "clinicalLink": "把視野與神經眼科定位一起讀，可避免將腦病變誤叫正常眼壓青光眼。", "pitfall": "不要把所有半側缺損都寫成視神經壓迫，病灶位置不同。", "recall": {"question": "同向半盲為何不應只調青光眼藥？", "answer": "需定位視交叉後病變並評估相應神經原因。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n07-oct", "n07-nei"]}, {"id": "c06", "title": "視野型態不是每個人都照同一順序進展", "pages": [11, 21, 23, 24, 25, 27], "unitId": "u1", "sectionIndexes": [2], "terms": ["generalized depression", "paracentral scotoma", "ring scotoma", "central island", "temporal island"], "keyPoints": ["廣泛敏感度下降並不特異，屈光未矯正或白內障也可造成；中央旁暗點、鼻側階梯與弓形缺損則較符合神經纖維束模式。雙弓形可形成環狀表現，晚期可能只剩中央島或顳側殘餘視野。", "這些是辨識型態，不是固定的五階段順序。中央旁缺損可以很早出現，嚴重程度還需看缺損深度、位置、雙眼合成功能與變化速度，不宜只用周邊或中央二分。"], "clinicalLink": "靠近注視點的細小缺損也可能有高功能風險。", "pitfall": "弓形缺損不必先跨越水平中線才成立。", "recall": {"question": "整張視野普遍變差可以直接歸青光眼嗎？", "answer": "不能，先確認介質、屈光矯正及可靠度，再看局部神經束特徵。"}, "relatedTopics": ["notes-06"], "sourceIds": ["n07-oct", "n07-nei"]}, {"id": "c07", "title": "視野報告：可靠度、TD、PD、GHT與VFI", "pages": [11, 12, 21], "unitId": "u1", "sectionIndexes": [2], "terms": ["automated perimetry", "total deviation", "pattern deviation", "GHT", "VFI", "GPA", "mean deviation", "pattern standard deviation"], "keyPoints": ["自動視野先檢查病人資料、屈光矯正、固視及假陽性等可靠度。Total deviation與同齡正常值比較；pattern deviation調整整體敏感度後凸顯局部變化，但並非能完全消除白內障等影響。", "GHT比較上下半視野模式，VFI為整體功能指標；機器顯示正常不排除早期疾病。進展分析GPA與長期斜率需建立可靠基準，重複確認變化，避免把學習效應或單次疲勞叫進展。", "圖中的MD（mean deviation）摘要平均敏感度相對正常的偏離；PSD（pattern standard deviation）反映局部不規則程度。PSD在末期全面變差時可能不再升高，因此不能把它當全病程線性嚴重度尺，也不能只靠MD區分白內障與青光眼。"], "clinicalLink": "讀完整列印單比只看灰階圖更能解釋與病人表現的落差。", "pitfall": "不能用一次VFI上升說神經再生。", "recall": {"question": "術後視野變好，能證明所有死去RGC復活嗎？", "answer": "不能，測試變異、學習與光學因素也會改變成績。"}, "relatedTopics": [], "sourceIds": ["n07-oct", "cov07-field"]}, {"id": "c08", "title": "多因子風險與灌注：可調眼壓不是唯一病因", "pages": [15, 21, 24, 25, 27, 34, 41, 53, 57], "unitId": "u1", "sectionIndexes": [4], "terms": ["ocular perfusion pressure", "vasospasm", "oxidative stress", "translaminar pressure"], "keyPoints": ["青光眼涉及眼壓、年齡、家族史及組織易損性等多因素；血管痙攣、低灌注、氧化壓力或跨篩板壓差是相關機轉。眼壓是目前有明確治療證據的主要可介入因素，不代表它是唯一病因。", "灌注壓的直覺是供血壓與眼內阻力之差，但臨床估算還受姿勢與血壓測量位置影響，不能把上臂收縮壓直接減眼壓當真實視神經灌注。低血壓、貧血或心律問題應與內科合作。"], "clinicalLink": "正常眼壓仍進展時，檢查病程、量測及全身因素並重新設定目標。", "pitfall": "不要自行停降血壓藥或以未證實神經保護療法取代有效降壓。", "recall": {"question": "正常眼壓為何仍能有青光眼？", "answer": "神經的耐受與其他風險不同，統計正常不代表個人的安全壓力。"}, "relatedTopics": [], "sourceIds": ["n07-nei", "n07-angle"]}, {"id": "c09", "title": "房水不是眼淚：生成、兩條流出路與靜脈出口", "pages": [15, 16, 29], "unitId": "u2", "sectionIndexes": [3], "terms": ["nonpigmented ciliary epithelium", "trabecular outflow", "uveoscleral outflow", "episcleral venous pressure"], "keyPoints": ["睫狀體非色素上皮分泌房水，經後房、瞳孔到前房。傳統路徑經小樑網、Schlemm管及集流通路回到鞏膜表層靜脈；另可由睫狀肌周圍經葡萄膜鞏膜路徑排出。", "眼壓是生成與流出的平衡，常見阻力問題而非單純生產過多。房水有少量蛋白且支持角膜、晶狀體代謝；視網膜主要由視網膜及脈絡膜循環供應，不能沿用原筆記「視網膜無血管靠房水」概括。"], "clinicalLink": "每個藥物或手術都回到「少產生、增加哪條路、出口壓力」三問。", "pitfall": "流量與流出設施不同：前者常用μL/min，後者再除以mmHg。", "recall": {"question": "出口靜脈壓升高為何能升眼壓？", "answer": "傳統流出下游阻力增加，房角即使開放也可能排出受阻。"}, "relatedTopics": ["notes-10"], "sourceIds": ["n07-anatomy", "n07-angle"]}, {"id": "c10", "title": "量眼壓：標準工具與可攜工具各回答什麼", "pages": [17, 22], "unitId": "u1", "sectionIndexes": [4], "terms": ["Goldmann", "air puff", "Tono-Pen", "iCare", "dynamic contour", "ocular response analyzer"], "keyPoints": ["Goldmann壓平眼壓計是常用参考標準；非接觸氣動測壓便於篩查，Tono-Pen或反彈式iCare有利於不易坐裂隙燈的病人。數值仍需理解所用工具、姿勢及校正方式。", "動態輪廓、氣動或眼反應分析等工具使用不同物理訊號，但並未完全消除角膜影響。手指觸診只能粗略判斷，不能替代定量追蹤；家庭監測也須使用合適裝置並接受訓練。"], "clinicalLink": "換工具前後比較時，同時記錄方法，避免把儀器差異當療效。", "pitfall": "疑似開放性眼球傷時不要為完成常規而量眼壓。", "recall": {"question": "臥床病人不能靠裂隙燈，如何取得眼壓？", "answer": "選可攜式工具並記錄姿勢與方法，異常或不相符時確認量測。"}, "relatedTopics": ["notes-01"], "sourceIds": ["n07-nei", "n07-oct"]}, {"id": "c11", "title": "角膜厚度、生物力學與雷射後低估", "pages": [18, 22, 25, 27, 28], "unitId": "u1", "sectionIndexes": [4], "terms": ["central corneal thickness", "LASIK", "PRK", "measurement bias"], "keyPoints": ["壓平測壓受角膜厚度、曲率、疤痕及生物力學影響；屈光雷射後測得眼壓可能偏低。眼壓讀數只是測量結果，不能自動等同真正眼內壓，也不能因正常就取消視神經追蹤。", "憋氣、用力閉眼、壓眼皮、姿勢及儀器校正也會造成變異。角膜厚度可協助風險評估，但不能套用一條通用加減公式把每個病人的眼壓修正成真值。"], "clinicalLink": "近視雷射改善裸視，不代表消除高度近視相關的青光眼風險。", "pitfall": "角膜有疤或水腫時，誤差方向不宜一概而論。", "recall": {"question": "LASIK後眼壓低、視盤可疑，能結案嗎？", "answer": "不能，需考慮低估並整合結構功能和追蹤。"}, "relatedTopics": ["notes-02", "notes-05"], "sourceIds": ["n07-oct", "n07-nei"]}, {"id": "c12", "title": "高眼壓症與OHTS：5.1個百分點代表什麼", "pages": [19, 20, 22, 34], "unitId": "u1", "sectionIndexes": [4], "terms": ["ocular hypertension", "OHTS", "absolute risk reduction", "relative risk", "NNT"], "keyPoints": ["高眼壓症是眼壓偏高但尚無可確認的青光眼結構或功能損傷。OHTS在其研究族群中，5年進展比例由未治療9.5%降至治療4.4%，顯示降壓可延遲或減少發病。", "絕對風險差為5.1個百分點，相對下降約54%，粗估5年需治療約20人避免1人達研究終點。這不代表治療一定浪費；決策還看年齡、眼壓、角膜厚度、杯盤比、視野指標、壽命與個人偏好。"], "clinicalLink": "用絕對效益和長期風險討論觀察或治療，而非一個眼壓門檻決定。", "pitfall": "研究平均NNT不能直接套到低風險或高風險個體。", "recall": {"question": "9.5%到4.4%是降低5.1%還是54%？", "answer": "絕對降低5.1個百分點，相對降低約54%；兩者描述不同。"}, "relatedTopics": [], "sourceIds": ["cov07-ohts"]}, {"id": "c13", "title": "房角鏡的光學、解剖標記與壓陷", "pages": [29, 30, 31, 32, 48, 53, 57], "unitId": "u2", "sectionIndexes": [5], "terms": ["gonioscopy", "total internal reflection", "Schwalbe line", "trabecular meshwork", "scleral spur", "ciliary body band", "pigmented trabecular meshwork", "nonpigmented trabecular meshwork"], "keyPoints": ["一般裂隙燈無法直接看清房角，部分因角膜與空氣界面的全反射；房角鏡改變光路。由前向後辨識Schwalbe線、小樑網、鞏膜突與睫狀體帶，可避免將前方色素線誤當開放小樑網。", "直接式常用於特定仰臥或手術情境，間接式常見於門診。暗處及適当光束、輕壓操作很重要；壓陷能打開貼附性關閉，但周邊前黏連PAS不易打開，同時可找新生血管或腫塊。", "原圖另標前方非色素小樑區與較後方色素小樑區。要用位置和鄰近鞏膜突確認結構，因色素量因人而異，Schwalbe線上色素亦可能造成誤認。"], "clinicalLink": "先看到結構與接觸原因，再分類開角、關角與次發機轉。", "pitfall": "前房中央不很淺也不能排除周邊房角危險。", "recall": {"question": "為何需要壓陷房角鏡？", "answer": "分辨可打開的貼附性接觸與固定黏連，協助找機轉。"}, "relatedTopics": ["notes-02"], "sourceIds": ["n07-gonio", "n07-angle"]}, {"id": "c14", "title": "POAG風險與正常眼壓型的排除步驟", "pages": [32, 33, 34, 48, 50, 51, 55, 57], "unitId": "u1", "sectionIndexes": [6], "terms": ["POAG", "normal-tension glaucoma", "myopia", "family history", "diurnal fluctuation", "African ancestry"], "keyPoints": ["原發開角型的房角可見，但小樑流出功能仍不良；年齡、眼壓、家族史和近視等影響風險。正常眼壓型需確認損傷模式，並排除曾有高眼壓、類固醇暴露、缺血或壓迫性神經病變。", "一次門診眼壓不代表全天峰值；還需房角鏡排除間歇關角及大幅波動。非典型視野、色覺或蒼白應安排相應神經評估，血管或低血壓因素則與其他科別合作。", "部分非洲血統族群的開角型青光眼負擔較高，是族群流行病學線索，不是個人診斷或排除條件。所有族群都可能發病，仍需根據眼部構造、功能和家族史評估。"], "clinicalLink": "把「17mmHg」放回完整病史與時間軸，而非立即貼NTG。", "pitfall": "不能說家族史固定增加相同倍數，也不能只靠正常眼壓排除疾病。", "recall": {"question": "正常眼壓型診斷前，房角鏡的價值？", "answer": "排除未識別的關角，因機轉與治療策略不同。"}, "relatedTopics": ["notes-03"], "sourceIds": ["n07-angle", "n07-nei"]}, {"id": "c15", "title": "瞳孔阻滯、plateau iris與晶狀體因素", "pages": [34, 35, 36, 48, 51, 52, 55, 56], "unitId": "u2", "sectionIndexes": [7], "terms": ["pupillary block", "iris bombe", "plateau iris", "lens vault", "PACG", "East Asian ancestry", "female sex", "short axial length"], "keyPoints": ["瞳孔阻滯使房水由後房到前房的通路阻力增加，壓差推虹膜前凸形成iris bombe。較短眼軸、淺前房及晶狀體擁擠增加關角風險；遠視與年齡是線索，不是人人適用的診斷。", "Plateau iris與前位睫狀突的周邊虹膜擁擠相關；晶狀體增大或前位也可推擠。周邊虹膜切開解除瞳孔阻滯後若仍窄，需重新找剩餘機轉；關角本身也需區別是否已有青光眼神經損傷。", "女性及部分東亞族群有較高原發關角風險，眼軸較短和前節擁擠是實際需要量測的構造。身高或族群名稱只能提供背景，不能取代房角鏡；不沿用共筆中的過時族群稱呼。"], "clinicalLink": "治療前問「阻在瞳孔、周邊結構還是後方向前推」。", "pitfall": "房角關閉不自動等於已經PACG，也不是每種都靠LPI解決。", "recall": {"question": "通暢LPI後仍關角，下一步？", "answer": "確認PAS並找plateau iris、晶狀體或次發因素。"}, "relatedTopics": ["notes-06"], "sourceIds": ["n07-angle", "n07-gonio"]}, {"id": "c16", "title": "急性關角：噁心、角膜水腫與中度散瞳連成一個急症", "pages": [35, 36, 50, 51, 52, 53, 56, 57], "unitId": "u2", "sectionIndexes": [7], "terms": ["acute angle closure", "mid-dilated pupil", "glaukomflecken", "ciliary congestion"], "keyPoints": ["突然紅痛、視物虹暈、頭痛噁心合併高眼壓及淺前房，需緊急考慮急性關角。角膜水腫解釋霧視，虹膜括約肌缺血可使瞳孔中度散大反應差；晶狀體前囊下白點glaukomflecken可留下既往發作線索。", "立即由眼科確認機轉與降壓，同步評估全身禁忌，再規劃解除瞳孔阻滯或其他原因的治療。麻醉後、感冒藥或散瞳後發作時，不要只當腸胃病或偏頭痛；對側眼的結構風險也需評估。"], "clinicalLink": "把症狀群與同一壓力機轉串聯，避免轉診延誤。", "pitfall": "不能以固定眼壓數字才能稱急症，也不能為等視野檢查而延誤。", "recall": {"question": "劇烈頭痛伴單眼紅與霧視，先檢查哪一組？", "answer": "視力、瞳孔、前節及眼壓，並緊急眼科評估房角與機轉。"}, "relatedTopics": ["notes-14"], "sourceIds": ["n07-angle", "n07-nei"]}, {"id": "c17", "title": "新生血管青光眼：從開角阻力到牽拉關閉", "pages": [37], "unitId": "u2", "sectionIndexes": [8], "terms": ["neovascular glaucoma", "rubeosis iridis", "fibrovascular membrane", "PAS"], "keyPoints": ["缺血性視網膜病變可促使虹膜與房角新生血管，早期房角仍可能開放但流出受阻；纖維血管膜收縮後牽拉周邊虹膜，形成PAS與關角。糖尿病視網膜病變只是其中一種缺血來源。", "評估眼壓與前節的同時要找視網膜缺血原因，如缺血性靜脈阻塞。治療需要控制眼壓也處理後節驅動因子；單做虹膜切開無法消除纖維血管膜收縮。"], "clinicalLink": "同一疾病可隨時間從開角走到關角，不能以一次分型固化病程。", "pitfall": "見房角尚開放就排除新生血管青光眼是錯誤。", "recall": {"question": "為何新生血管病人降壓後仍需眼底處理？", "answer": "缺血驅動尚在，單純降低眼壓未去除持續長膜的來源。"}, "relatedTopics": ["notes-10"], "sourceIds": ["n07-angle"]}, {"id": "c18", "title": "類固醇、色素與靜脈壓：次發開角有不同入口", "pages": [37, 50, 52, 55], "unitId": "u2", "sectionIndexes": [8], "terms": ["steroid response", "pigment dispersion syndrome", "episcleral venous pressure", "CCF"], "keyPoints": ["類固醇可增加小樑流出阻力，滴藥、眼周、眼內或全身暴露都值得追問。色素播散使色素進入前節與小樑網，但色素播散症候群不等於已經有青光眼，需證明神經或功能損傷。", "鞏膜表層靜脈壓升高也可讓開放房角排水不良；伴螺旋血管、突眼或雜音時應想到CCF等下游血流問題。依原因處理並監測眼壓，不可只無限加滴藥而不找病因。"], "clinicalLink": "問藥史、看色素、看眼周血管，三條線對應不同流出障礙。", "pitfall": "必要類固醇需與原治療團隊協調調整，不能自行突然停用全身藥。", "recall": {"question": "房角開但眼壓高伴突眼，還要找什麼？", "answer": "靜脈鬱血及CCF等造成下游壓力升高的原因。"}, "relatedTopics": ["notes-08", "notes-13"], "sourceIds": ["n07-angle", "cov07-meds"]}, {"id": "c19", "title": "Topiramate與滲出性前推：別套瞳孔阻滯流程", "pages": [37, 50, 53, 55, 57], "unitId": "u2", "sectionIndexes": [8], "terms": ["topiramate", "sulfonamide", "ciliochoroidal effusion", "acute myopic shift"], "keyPoints": ["Topiramate等藥物可引起睫狀脈絡膜滲出，使晶狀體虹膜隔前移，出現雙眼近視位移、前房變淺與急性關角。年輕、雙眼同時及近期用藥是提示，但任何一項缺席不直接排除。", "這是非瞳孔阻滯機轉，停用疑似誘因需緊急與處方團隊協調，由眼科選擇降壓、睫狀肌麻痺及抗發炎處置。縮瞳或單做LPI可能不合適；病情緊急不等於所有急性關角用同套治療。"], "clinicalLink": "用「後方向前推」與「瞳孔壓差」兩張機轉圖比較。", "pitfall": "不是所有抗癲癇藥都等同topiramate風險。", "recall": {"question": "雙眼突然變近視又眼痛，除了量壓要問什麼？", "answer": "近期topiramate或相關藥物使用與起始時間。"}, "relatedTopics": ["notes-13"], "sourceIds": ["n07-topiramate"]}, {"id": "c20", "title": "ICE與上皮內生：膜如何讓房角關起來", "pages": [37], "unitId": "u2", "sectionIndexes": [8], "terms": ["iridocorneal endothelial syndrome", "ICE", "epithelial downgrowth", "虹膜萎縮"], "keyPoints": ["ICE症候群可有異常角膜內皮向房角與虹膜表面延伸，造成角膜水腫、虹膜形態變化、PAS與青光眼，常見單眼前節異常。不能只把水腫誤作Fuchs而忽略房角。", "手術或外傷後上皮內生亦可形成膜，覆蓋眼內結構並影響房水流出。這類次發病變需結合前節檢查、房角、既往傷口與影像定位，再選處理膜與眼壓的策略。"], "clinicalLink": "角膜、虹膜及眼壓三種異常並存時，尋找同一細胞／膜機轉。", "pitfall": "LPI只能解特定阻滯，不能消除所有拉閉房角的膜。", "recall": {"question": "單眼角膜水腫加虹膜洞及PAS，想到什麼？", "answer": "ICE等內皮相關前節病，需完整專科確認。"}, "relatedTopics": ["notes-05"], "sourceIds": ["n07-angle"]}, {"id": "c21", "title": "兒童青光眼：三聯徵、眼球擴張與Haab紋", "pages": [38, 39, 40, 46, 48, 51, 53, 55, 57], "unitId": "u2", "sectionIndexes": [9], "terms": ["primary congenital glaucoma", "buphthalmos", "Haab striae", "epiphora", "blepharospasm", "photophobia"], "keyPoints": ["嬰幼兒眼壁較有彈性，高眼壓可使角膜與眼球擴張形成牛眼。溢淚、畏光、眼瞼痙攣三聯徵加角膜混濁，需要緊急兒童眼科評估，不能只按鼻淚管阻塞處理。", "Descemet膜伸裂形成水平或弧形Haab紋，即使降壓後水腫退仍可保留。診斷需綜合角膜直徑、眼軸、眼壓、視神經與發育情形，必要時麻醉檢查；不能只靠症狀或一次哭鬧中的讀數。"], "clinicalLink": "兒童損傷涵蓋整個發育中的眼，亦需防治弱視與屈光異常。", "pitfall": "兩眼都大不代表正常遺傳外觀；透明角膜也不能絕對排除。", "recall": {"question": "流淚嬰兒哪個組合須升級？", "answer": "畏光、角膜混濁或變大、眼瞼痙攣，需排先天青光眼。"}, "relatedTopics": ["notes-08", "notes-04"], "sourceIds": ["cov07-pcg"]}, {"id": "c22", "title": "發育異常與兒童次發性青光眼的名字要接到結構", "pages": [38], "unitId": "u2", "sectionIndexes": [9], "terms": ["Axenfeld-Rieger", "aniridia", "Peters anomaly", "ectropion uveae", "Sturge-Weber", "neurofibromatosis"], "keyPoints": ["Axenfeld-Rieger屬前節發育異常，可有虹膜／房角與全身表現；aniridia是虹膜發育不全，Peters異常可有中央角膜混濁及虹膜或晶狀體黏连。先天葡萄膜外翻ectropion uveae也須注意房角發育與青光眼。", "Sturge-Weber可合併顏面血管病及眼壓問題，神經纖維瘤相關結構異常亦可增加風險。兒童另可在白內障手術後、外傷、葡萄膜炎或類固醇治療後出現青光眼；這些不能全叫孤立原發先天型。"], "clinicalLink": "把伴隨病徵列入全身及遺傳評估，同時處理視軸與弱視。", "pitfall": "先天發育相關疾病與原發先天性青光眼在現行分類不應混為一類。", "recall": {"question": "兒童中央角膜白加房角異常，是不是一定PCG？", "answer": "不一定，須考慮Peters等前節發育異常及其他次發原因。"}, "relatedTopics": ["notes-05", "notes-06"], "sourceIds": ["cov07-pcg"]}, {"id": "c23", "title": "先天型手術：goniotomy與trabeculotomy的差別", "pages": [45, 46, 48, 49, 51, 53, 55, 57], "unitId": "u3", "sectionIndexes": [9, 11], "terms": ["goniotomy", "trabeculotomy", "goniodysgenesis"], "keyPoints": ["孤立原發先天性青光眼的核心為房角發育與流出異常，手術通常是主要治療；藥物可作橋接或輔助，並非完全無效。機轉不能僅簡化為一張未凋亡的膜擋住水。", "Goniotomy由前房直接切開異常小樑區，需適當看清房角；trabeculotomy經Schlemm管建立與前房的通道，可用於不同角膜與解剖情境。兩者與建立結膜下滤過的trabeculectomy不同，術後仍需長期量壓、屈光及弱視照護。"], "clinicalLink": "報術式時直接說出入口、切開位置與房水到哪裡。", "pitfall": "Trabeculotomy不是從眼瞼內穿刺，也不是trabeculectomy的同義詞。", "recall": {"question": "角膜很混濁為何影響傳統goniotomy選擇？", "answer": "直接房角視野受阻，需評估其他合適術式。"}, "relatedTopics": [], "sourceIds": ["cov07-pcg"]}, {"id": "c24", "title": "個人化目標、依從與治療後的視野變化", "pages": [41, 46, 47], "unitId": "u3", "sectionIndexes": [4, 10, 11], "terms": ["target IOP", "adherence", "persistence", "progression rate"], "keyPoints": ["目標眼壓是隨病情修正的範圍，需考慮損傷程度、進展速度、年齡與生活功能。達到原目標但仍可靠地惡化，應重評量測、診斷及治療執行，再調整策略；不能用全體一致數字保證安全。", "依從是照計畫使用，持續性是長期不間斷；费用、滴藥操作、眼表不適和理解程度都會影響。術後視野有時改善，但不足以證明已死亡神經再生；成功常表現為下降速度減慢。"], "clinicalLink": "讓病人說明自己怎麼點藥，較能發現可解決的執行障礙。", "pitfall": "不要把未規律用藥一律歸為病人不合作。", "recall": {"question": "病人說手術後沒有看更清楚，是否失敗？", "answer": "不一定；青光眼治療常以保存既有功能及減慢進展為成效。"}, "relatedTopics": [], "sourceIds": ["n07-nei", "n07-oct"]}, {"id": "c25", "title": "局部滴藥仍會全身吸收", "pages": [41, 46, 49, 52, 54, 57], "unitId": "u3", "sectionIndexes": [10], "terms": ["nasolacrimal occlusion", "systemic absorption", "preservative"], "keyPoints": ["滴藥可經鼻淚通路接觸鼻黏膜進入全身，局部用藥並不等於沒有全身風險。正確滴藥、溫和閉眼與鼻淚管壓迫可減少流失和全身吸收，但不能取消藥物本身禁忌。", "長期多種滴劑與防腐劑可造成眼表刺激或過敏，影響持續治療。兒童、孕哺及心肺疾病患者需個別權衡，勿用過時妊娠字母分類或「滴劑很安全」一概帶過。"], "clinicalLink": "將衛教與藥物選擇一併納入降壓計畫。", "pitfall": "按鼻根不是用力壓眼球。", "recall": {"question": "有鼻淚管壓迫就可讓氣喘病人放心用timolol嗎？", "answer": "不行，減少吸收不等於消除β阻斷劑的呼吸風險。"}, "relatedTopics": ["notes-08", "notes-13"], "sourceIds": ["cov07-meds"]}, {"id": "c26", "title": "β阻斷與α2作用：少生產但全身風險不同", "pages": [41, 42, 49, 50, 52, 54, 55, 56, 57], "unitId": "u3", "sectionIndexes": [10], "terms": ["timolol", "beta blocker", "brimonidine", "alpha-2 agonist", "apnea"], "keyPoints": ["Timolol等β阻斷劑減少房水生成，氣喘、顯著心動過緩、傳導阻滯及失代償心肺問題是重要風險。Brimonidine為α2致效劑，抑制生成並增加葡萄膜鞏膜外流，原共筆寫小樑外流需校正。", "Brimonidine可有嗜睡、低血壓、口乾及過敏，也可能造成中樞抑制與呼吸暫停。未滿2歲禁用；2歲以上兒童仍須由專科依年齡、體重及全身風險審慎評估。兩類不可只因同樣降低眼壓就互換而忽略全身病史。"], "clinicalLink": "問氣喘、心率、心臟傳導、年齡及併用藥，才算完整選藥。", "pitfall": "α2藥物不是角膜水腫的通用治療；原考題解析該句不沿用。", "recall": {"question": "Brimonidine的兩個主要降壓機轉？", "answer": "減少房水生成並增加葡萄膜鞏膜外流。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov07-meds", "cov07-brimonidine-label"]}, {"id": "c27", "title": "前列腺素、NO、Rho與膽鹼：增加哪條外流", "pages": [41, 42, 43, 48, 49, 52, 56, 57], "unitId": "u3", "sectionIndexes": [10], "terms": ["prostaglandin analogues", "latanoprostene bunod", "Rho-kinase inhibitor", "pilocarpine"], "keyPoints": ["前列腺素類主要增加葡萄膜鞏膜外流，可有睫毛增長、色素改變與眼眶周邊改變。Latanoprostene bunod另以NO相關作用增加小樑外流；Rho激酶抑制劑主要作用傳統流出，仍有充血等眼部不良效應。", "Pilocarpine等膽鹼致效劑收縮睫狀肌並縮瞳，促進小樑外流，但可有眉弓痛、近視位移及特定視網膜或發炎風險。活動葡萄膜炎、近期複雜手術或皰疹病史須個別評估，不能將全部注意事項寫成絕對禁忌。"], "clinicalLink": "用流出路徑理解藥理，再用眼內病與全身狀況篩選。", "pitfall": "不可因Rho較新就說沒有任何禁忌或副作用。", "recall": {"question": "所有關角都適合pilocarpine嗎？", "answer": "不適合，滲出性前推等非瞳孔阻滯機轉可能惡化。"}, "relatedTopics": ["notes-09"], "sourceIds": ["cov07-meds", "n07-topiramate"]}, {"id": "c28", "title": "碳酸酐酶與高滲透壓藥：全身條件決定可用性", "pages": [41, 42, 43, 49, 52, 56, 57], "unitId": "u3", "sectionIndexes": [10], "terms": ["carbonic anhydrase inhibitor", "dorzolamide", "acetazolamide", "mannitol", "glycerol"], "keyPoints": ["Dorzolamide等局部及acetazolamide等全身碳酸酐酶抑制劑減少房水生成；全身用藥尤其要考慮腎功能、酸鹼及電解質、腎結石和嚴重藥物過敏史。局部與口服不能套同一風險程度。", "Mannitol或glycerol等高滲透壓策略可使水分由眼內移向血循環以降低眼壓，但會改變血容量與代謝負荷。心衰、腎功能異常或肺水腫風險需審慎評估，不是只要減量就一定安全。"], "clinicalLink": "急性降壓時同步查全身病與併用藥，不能只盯眼壓讀數。", "pitfall": "磺胺抗生素過敏與非抗生素磺胺交叉反應需具體評估，不能忽略嚴重既往反應。", "recall": {"question": "眼壓很高但有失代償心衰，為何不能機械式給mannitol？", "answer": "高滲透壓藥可增加循環負荷，需選擇合適替代或監測方案。"}, "relatedTopics": [], "sourceIds": ["cov07-meds", "n07-angle"]}, {"id": "c29", "title": "雷射：LPI、iridoplasty、SLT和睫狀體治療各對哪裡", "pages": [43, 46, 48, 49, 51, 55, 56], "unitId": "u3", "sectionIndexes": [6, 7, 11], "terms": ["laser peripheral iridotomy", "iridoplasty", "ALT", "SLT", "cyclophotocoagulation", "micropulse"], "keyPoints": ["LPI建立虹膜孔平衡前後房壓差，處理瞳孔阻滯；周邊虹膜成形利用收縮牽開周邊虹膜，在合適殘餘關角機轉下使用。它並非把肥大睫狀體直接變薄，術後仍須確認房角及眼壓。", "ALT與SLT作用小樑區，SLT可作合適開角患者的初始選項並可能重複；不需所有人先把藥用滿。睫狀體光凝減少生成，連續波與微脈衝方式的風險不同，選擇已不限於一句「所有其他治療都失敗」。"], "clinicalLink": "說清雷射打虹膜、小樑或睫狀體，才能解釋為何不能互換。", "pitfall": "雷射後眼壓下降不代表造成關角的所有機轉都消失。", "recall": {"question": "LPI和SLT最大機轉差異？", "answer": "前者跨過瞳孔阻滯，後者調整開放小樑的流出功能。"}, "relatedTopics": [], "sourceIds": ["n07-angle", "n07-gonio", "n07-nei"]}, {"id": "c30", "title": "濾過、導管與微型植入物：終點不都是同一條管", "pages": [44, 45, 46, 48, 49], "unitId": "u3", "sectionIndexes": [11], "terms": ["trabeculectomy", "bleb", "glaucoma drainage implant", "PRESERFLO", "XEN45", "iStent inject", "Hydrus"], "keyPoints": ["小樑切除術建立前房到結膜下的濾過路徑，形成濾泡；引流導管將房水帶到植入板周圍。XEN與PRESERFLO也屬結膜下引流概念，仍會受瘢痕、低眼壓或感染等問題影響。", "iStent inject繞過小樑到Schlemm管，Hydrus支架利用管道通路；其降壓受下游流出系統限制。選擇需考慮目標壓力、結膜狀況、房角、既往手術及風險，不是裝置愈小就一定更有效。"], "clinicalLink": "讓學習者畫出手術後房水最後流向，避免只背商品名。", "pitfall": "不要將trabeculotomy、trabeculectomy與小樑支架混作同種手術。", "recall": {"question": "XEN和iStent的主要出口差異？", "answer": "XEN導向結膜下濾泡，iStent導向Schlemm管及既有流出系統。"}, "relatedTopics": [], "sourceIds": ["cov07-xen", "n07-anatomy", "cov07-migs"]}], "unresolved": [], "sourceSha256": "c520f0114740519014cb86446de534f694a73e3e87a3c6406c5d6db166eb3542"}, "notes-08": {"sourceFile": "眼科學No.08.pdf", "pageCount": 64, "reviewedPages": [{"from": 1, "to": 2, "kind": "administrative", "note": "目錄、課堂回饋與名單資訊不公開"}, {"from": 3, "to": 28, "kind": "teaching", "note": "眶壁解剖、外傷、6P、感染與TED及重點整理"}, {"from": 29, "to": 34, "kind": "exam", "note": "眶骨、外傷與外觀徵象考題解析"}, {"from": 35, "to": 58, "kind": "teaching", "note": "TED、炎症、腫瘤、眼球移除術式、淚器及重點整理"}, {"from": 59, "to": 59, "kind": "administrative", "note": "已視覺核對：只有頁眉、頁碼與回目錄，無教學內容"}, {"from": 60, "to": 60, "kind": "teaching", "note": "溢淚與淚器疾病重點比較"}, {"from": 61, "to": 64, "kind": "exam", "note": "兒童腫瘤、溢淚定位與淚囊炎考題解析"}], "entries": [{"id": "c01", "title": "眼眶地圖：七塊骨頭、四壁和眶尖", "pages": [3, 4, 5, 6, 7, 23, 24, 30, 31, 33, 34], "unitId": "u1", "sectionIndexes": [0], "terms": ["frontal", "sphenoid", "ethmoid", "lacrimal", "maxilla", "zygomatic", "palatine"], "keyPoints": ["眼眶由額、蝶、篩、淚、上頜、顴與腭骨構成，沒有鼻骨或顳骨。屋頂主要為額骨及蝶骨小翼；外壁為顴骨與蝶骨大翼；底部由上頜、顴及少量腭骨構成。", "內壁由前往後可辨上頜額突、淚骨、篩骨紙板及蝶骨體。紙狀板薄且鄰篩竇，底部鄰上頜竇；骨壁关系能同時解釋骨折、感染擴散與手術進入方向，而不是孤立骨名清單。"], "clinicalLink": "鼻竇炎加內側眶膿瘍，可沿薄內壁追溯來源。", "pitfall": "最薄、最常骨折、最適合手術入口是不同問題。", "recall": {"question": "眼眶七骨裡有顳骨嗎？", "answer": "沒有；外側主要為顴骨和蝶骨大翼。"}, "relatedTopics": [], "sourceIds": ["cov08-bone"]}, {"id": "c02", "title": "淚腺窩、淚囊窩、滑車與視神經管", "pages": [4, 5, 6, 23, 24, 31, 34], "unitId": "u1", "sectionIndexes": [0], "terms": ["lacrimal gland fossa", "lacrimal sac fossa", "trochlea", "supraorbital notch", "optic canal"], "keyPoints": ["淚腺位於外上方淚腺窩；淚囊則在前內側淚囊窩，前後界分別與上頜骨及淚骨淚嵴相關。兩個「淚」構造功能與位置不同，腫塊造成的眼球位移也不相同。", "內上方滑車供上斜肌肌腱通過，眶上切跡是上方的重要通道；視神經管位於蝶骨深部，視神經和眼動脈經此入眶。不要把眼動脈常規路徑誤記成上眶裂。"], "clinicalLink": "外上方腫塊推眼球內下，內眥腫脹則先定位淚囊及淚道。", "pitfall": "淚腺不在前內側淚囊窩。", "recall": {"question": "淚腺腫塊與淚囊炎外觀位置如何不同？", "answer": "前者多外上方，後者多內眥下方，仍需完整檢查確认。"}, "relatedTopics": ["notes-03"], "sourceIds": ["cov08-bone"]}, {"id": "c03", "title": "Blow-out：眶壁骨折、眼球傷與V2麻木", "pages": [8, 9, 27, 29, 30, 31, 33, 34], "unitId": "u1", "sectionIndexes": [1], "terms": ["blow-out fracture", "orbital floor", "lamina papyracea", "infraorbital nerve"], "keyPoints": ["鈍傷使眼眶內容受壓或眶緣受力傳導，可造成眶底或內壁骨折；典型純blow-out可保留眶緣。先評估眼球完整性與視功能，再看骨折，不能因CT顯示骨折就忽略眼內出血或開放傷。", "眶底傷可伴下方組織疝出、複視及眶下神經V2分布麻木；腫脹退後可能出現眼球內陷。小物體也可能造成嚴重穿透或其他傷害，因此不能沿用「BB彈絕不骨折」來排除。"], "clinicalLink": "外傷評估同時回答眼球、神經、肌肉與骨性空间四個問題。", "pitfall": "影像看見下直肌疝出不等於證實肌肉被夾死。", "recall": {"question": "頰部麻木本身是否等於一定需骨折修復？", "answer": "不是，需結合夾陷、複視、內陷及功能影響。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov08-floor"]}, {"id": "c04", "title": "兒童trapdoor與眼心反射：白眼也能是急症", "pages": [8, 10, 27, 28, 30], "unitId": "u1", "sectionIndexes": [1], "terms": ["trapdoor fracture", "white-eyed fracture", "oculocardiac reflex", "forced duction"], "keyPoints": ["兒童較有彈性的骨壁可在骨折後回彈，夾住眶內軟組織或肌肉；外觀可能僅輕微瘀紅，即所謂white-eyed。運動受限、痛、複視合併噁心、嘔吐或心搏過慢提示眼心反射。", "眼心反射涉及三叉神經傳入與迷走神經傳出，夾陷可能危及肌肉灌流並造成心率不穩，需緊急專科評估。被動牽拉測試由受訓者於合適情境執行，不應在疑開放傷或清醒疼痛者粗暴操作。"], "clinicalLink": "外觀輕微不能抵銷功能警訊；生命徵象和眼球運動是同一病程線索。", "pitfall": "有夾陷／心率變化不可照一般骨折固定等兩週。", "recall": {"question": "受傷小孩眼白卻看上方會吐，想到什麼？", "answer": "Trapdoor夾陷引發眼心反射，需立即處理。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov08-ocr", "cov08-floor"]}, {"id": "c05", "title": "骨折修復時機與導航：功能比單一毫米數重要", "pages": [8, 9, 10, 27, 29, 30, 31, 34, 55], "unitId": "u1", "sectionIndexes": [1], "terms": ["persistent diplopia", "enophthalmos", "3D planning", "computer-assisted navigation"], "keyPoints": ["沒有危險夾陷時，部分早期複視可隨腫脹改善，修復依持續生活功能障礙、內陷與缺損範圍判斷。教材2mm內陷或半個眶底等是常見討論線索，不能視為跨所有情況的硬性規則。", "複雜或陳舊骨折可用健側鏡像、三維模型與術中導航協助重建骨性容積和植入物位置。這些工具提高定位資訊，但不取代對眼球、神經、軟組織與手術風險的判斷。"], "clinicalLink": "決策需區分緊急解夾陷與之後恢復眶容積。", "pitfall": "所有骨折一律兩週內或一律等待兩週都不適當。", "recall": {"question": "3D鏡像規劃主要補哪一項資訊？", "answer": "估計受傷前眶壁形態與容積，幫助重建位置而非保證神經恢復。"}, "relatedTopics": [], "sourceIds": ["cov08-floor", "cov08-imaging"]}, {"id": "c06", "title": "6P：把病程和外觀轉成定位假說", "pages": [11, 13, 14, 15, 16, 18, 20, 24, 25, 26, 55], "unitId": "u1", "sectionIndexes": [2], "terms": ["Pain", "Progression", "Proptosis", "Palpation", "Pulsation", "Periorbital change"], "keyPoints": ["Pain問疼痛性質，Progression問變化速度；Proptosis量位置，Palpation評估可觸病灶，Pulsation找搏動或雜音，Periorbital change看眼周徵象。這六項是蒐集線索的架構，不是取代視力、瞳孔與眼球運動。", "數日到數週的突眼可為感染、出血、炎症或惡性腫瘤；數月到數年也可為淋巴瘤等較慢病變。不能以痛不痛或長得慢就判定良性，急迫性取決於視功能及病灶進展。"], "clinicalLink": "先描述側別、時程、移位方向、視功能，再提出最可能空间與病因。", "pitfall": "「慢就是良性」會漏掉淋巴瘤。", "recall": {"question": "6P之外哪三項最直接決定視功能安全？", "answer": "視力、瞳孔／RAPD與眼球運動，並依情況評估色覺視野。"}, "relatedTopics": ["notes-01"], "sourceIds": ["cov08-masses", "cov08-imaging"]}, {"id": "c07", "title": "突眼量測、假突眼與位移方向", "pages": [13, 14, 15, 25], "unitId": "u1", "sectionIndexes": [2], "terms": ["Hertel exophthalmometry", "pseudoproptosis", "axial displacement", "inferomedial displacement", "inferolateral displacement"], "keyPoints": ["Hertel量測要記錄左右突出度及基底距離，並與病人過往及族群差異比較。高度近視造成大眼球、眼瞼後縮或對側內陷可造成假突眼；單一正常上限不能取代臨床判斷。", "軸向前突提示球後或肌錐內病灶；外上方淚腺／dermoid可推向內下，內上方額篩竇病灶可推向外下，上頜竇病灶可往上推。方向是定位提示，仍需影像確认起源與延伸。"], "clinicalLink": "將Hertel變化與影像中的病灶空间配對，而非只記有無超過21mm。", "pitfall": "眼球方向和病灶位置通常相反，但浸潤性病變不一定符合簡單規則。", "recall": {"question": "眼球向內下移，要優先看哪個區域？", "answer": "外上方淚腺與相關眶內病灶。"}, "relatedTopics": [], "sourceIds": ["cov08-imaging", "cov08-masses"]}, {"id": "c08", "title": "眶隔前與眶內感染：以受損功能分層", "pages": [11, 12, 13, 24, 37, 56], "unitId": "u1", "sectionIndexes": [3], "terms": ["preseptal cellulitis", "orbital cellulitis", "subperiosteal abscess", "sinusitis", "FESS"], "keyPoints": ["眶隔前感染可來自皮膚、毛囊或針眼，典型不造成突眼、痛性眼球運動或視神經異常。眶內感染涉及肌肉與其他深部組織，常需住院靜脈抗菌與緊急眼科／耳鼻喉合作；無發燒不能排除。", "兒童鼻竇炎可沿薄壁擴展成骨膜下膿瘍。CT要問來源、膿瘍位置、眶尖及顱內延伸；是否需引流或鼻竇手術FESS依視功能、範圍與反應判斷，不能只看膿瘍大小或外觀退腫。"], "clinicalLink": "若視力下降或新RAPD，應立即升級处理，不等固定療程結束。", "pitfall": "原筆記把眶內感染常規先口服再惡化轉IV，不適合所有疑似眶內病例。", "recall": {"question": "外觀腫減但色覺變差表示什麼？", "answer": "視神經仍可能惡化，需緊急重評深部病變與介入。"}, "relatedTopics": ["notes-03", "notes-14"], "sourceIds": ["n08-orbital"]}, {"id": "c09", "title": "眶氣腫、出血與急性眶壓力", "pages": [16, 17, 25], "unitId": "u1", "sectionIndexes": [1, 2], "terms": ["orbital emphysema", "crepitus", "orbital hemorrhage", "compartment syndrome"], "keyPoints": ["鼻竇相通的骨折可讓空氣進入眼眶，觸診捻髮感crepitus是線索。少量氣腫可自行吸收；但氣體或出血迅速增加眶內壓時可影響運動、眼壓及視神經灌流。", "急性突眼、視力下降、RAPD或緊繃眼眶需緊急評估眶壓力危象。處理方式依原因與專科判斷，不能讓未受訓者依網頁自行針刺放氣；也不能為取得完美影像延誤明顯功能危機。"], "clinicalLink": "把「摸到氣」連到鼻竇通道，再看是否只有外觀或已影響功能。", "pitfall": "眼壓不是唯一眶壓力指標，正常讀數也不能忽略神經警訊。", "recall": {"question": "外傷後捻髮感加視力掉，能等氣自己消嗎？", "answer": "不能，需立即檢查眶壓力及視神經受威脅程度。"}, "relatedTopics": ["notes-14"], "sourceIds": ["cov08-floor", "n08-orbital"]}, {"id": "c10", "title": "搏動性突眼：有無雜音都不能單獨定病因", "pages": [18, 19, 25, 26, 29, 30, 32], "unitId": "u2", "sectionIndexes": [4], "terms": ["carotid-cavernous fistula", "dural AV fistula", "corkscrew vessels", "superior ophthalmic vein"], "keyPoints": ["CCF使動脈高壓進入海綿竇靜脈系統，可能有螺旋結膜血管、突眼、眼壓高及眼球運動障礙；影像可見上眼靜脈擴張。低流量硬腦膜型未必有明顯搏動或雜音。", "無雜音搏動也可見於眶骨缺損讓顱內搏動傳導，如腦膜腦膨出、神經纖維瘤相關骨異常或眶頂手術後。需要依據病史及血管影像區分，不能把「聽不到」當沒有瘻管。"], "clinicalLink": "紅眼加靜脈鬱血與神經徵象，可用單一血流機轉整合。", "pitfall": "不要教病人自行壓頸動脈作測試或治療。", "recall": {"question": "CCF為何能同時造成紅眼、突眼與高眼壓？", "answer": "靜脈鬱血增加眶內容積及房水下游流出壓力。"}, "relatedTopics": ["notes-07"], "sourceIds": ["n08-ccf-integrated", "cov08-imaging"]}, {"id": "c11", "title": "周邊徵象表：鮭魚色、S形眼瞼與瘀斑", "pages": [18, 19, 20, 26, 29, 30, 31, 32, 33, 34], "unitId": "u2", "sectionIndexes": [7], "terms": ["salmon patch", "S-shaped eyelid", "plexiform neurofibroma", "raccoon eyes", "mycosis fungoides"], "keyPoints": ["結膜穹窿鮭魚色腫塊提示淋巴增生性病變，需要病理區分。S形眼瞼可因淚腺腫塊或叢狀神經纖維瘤造成外側機械性下垂；無相符外傷的兒童眶周瘀斑要考慮神經母細胞瘤轉移。", "濕疹樣眼瞼病灶可與蕈樣肉芽腫等皮膚淋巴瘤有關，但常見皮膚炎仍在鑑別。這些配對應用來提出下一個檢查問題，不能從外觀照片直接確診惡性腫瘤。"], "clinicalLink": "教材配對題改寫成「觀察→懷疑→如何證實」的完整推理。", "pitfall": "S形眼瞼不能直接叫普通先天性下垂。", "recall": {"question": "鮭魚色病灶就等於已知淋巴瘤分期嗎？", "answer": "不是，需病理分型及全身評估。"}, "relatedTopics": ["notes-11", "notes-12"], "sourceIds": ["cov08-lymph", "cov08-masses"]}, {"id": "c12", "title": "被圖片表格藏住的警訊：視盤分流、僵眼與黑痂", "pages": [26, 32, 33], "unitId": "u2", "sectionIndexes": [7], "terms": ["opticociliary shunt vessels", "sphenoid wing meningioma", "frozen globe", "mucormycosis", "fibrous dysplasia"], "keyPoints": ["視盤上視網膜脈絡膜分流血管可提示慢性靜脈回流障礙，視神經鞘腦膜瘤是重要鑑別但非唯一原因。顳部突出可連到蝶骨翼腦膜瘤與骨性改變；顏面不對稱也需考慮纖維性骨發育不良或神經纖維瘤。", "眼球近乎完全固定frozen globe可見深部浸潤、惡性或侵襲性感染。鼻腔黑痂合併眶症狀，尤其糖尿病或免疫低下，需緊急排毛黴菌病；舊名zygomycosis／phycomycosis不應使急症辨識失焦。"], "clinicalLink": "表格裡的少見名詞應連到「何處受壓」和「是否要立即升級」。", "pitfall": "缺少黑痂不能排侵襲性真菌感染；分流血管也不是腦膜瘤專屬。", "recall": {"question": "糖尿病患者眼球固定加鼻黑痂，處理層級？", "answer": "緊急多專科評估侵襲性鼻眶腦真菌感染，不能當一般結膜炎。"}, "relatedTopics": ["notes-03"], "sourceIds": ["cov08-imaging", "n08-orbital", "cov08-mucor"]}, {"id": "c13", "title": "血管與淋巴管性病灶：姿勢、出血與兒童視軸", "pages": [18, 20, 26, 32, 54, 57, 63], "unitId": "u2", "sectionIndexes": [7], "terms": ["orbital varix", "venolymphatic malformation", "lymphangioma", "capillary hemangioma"], "keyPoints": ["眼眶靜脈曲張可在低頭或用力時變大；靜脈淋巴管畸形（舊稱lymphangioma）可因出血突然腫脹。這些動態資訊比單張靜態照片更能揭示病因，影像需評估范圍及視神經影響。", "嬰幼兒毛細血管瘤常在早期增長，深部病灶未必有典型表面紅色；若壓迫或遮擋視軸，會透過散光、屈光差與遮蔽造成弱視，需要及時專科處理。"], "clinicalLink": "對兒童腫塊同時問長多快和是否影響視覺發育。", "pitfall": "血管性腫塊不能盲目穿刺，亦不能因可能良性就忽略視軸。", "recall": {"question": "低頭才鼓出的腫塊提示哪類機轉？", "answer": "靜脈容積及回流改變，如眼眶靜脈曲張。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov08-masses", "cov08-imaging"]}, {"id": "c14", "title": "檢查選擇：CT、MRI、培養與病理各解一個疑問", "pages": [20, 37, 55, 56, 61, 63], "unitId": "u1", "sectionIndexes": [2], "terms": ["CT", "MRI", "PET", "biopsy", "culture", "targeted laboratory tests"], "keyPoints": ["CT適合骨壁、鼻竇、外傷及某些急性感染范圍；MRI對軟組織、神經及顱內延伸有優勢，但疑金屬異物需先排安全問題。PET通常用於特定腫瘤評估，不是所有突眼的第一項檢查。", "抽血依假說選甲狀腺功能與抗體、血球與發炎指標，或針對GPA、sarcoidosis等檢驗；ANA、ACE或ANCA不能單獨完成診斷。影像可提示但不能總能分炎症與腫瘤，必要時培養或活檢。"], "clinicalLink": "先寫下要排的來源、空间和危险，再開最能回答的檢查。", "pitfall": "舊考題MRI不是一般溢淚首選，不表示MRI永遠不適用。", "recall": {"question": "眼眶腫塊對類固醇改善，能省略所有病理嗎？", "answer": "不能，淋巴瘤等也可能暫時改善，需依表現與復發決定活檢。"}, "relatedTopics": [], "sourceIds": ["cov08-imaging", "cov08-ioi"]}, {"id": "c15", "title": "TED機轉：肌肉、脂肪、活動度與甲狀腺狀態", "pages": [19, 20, 21, 22, 28, 31, 33, 35], "unitId": "u2", "sectionIndexes": [5], "terms": ["thyroid eye disease", "orbital fibroblast", "hyaluronic acid", "adipogenesis", "tendon sparing"], "keyPoints": ["TED由免疫活動影響眼眶纖維母細胞，增加親水性基質、組織腫脹及脂肪／肌肉改變，造成突眼、後縮與複視。甲狀腺功能正常或低下仍可能有TED，不能只用一次TSH排除。", "肌腹增大、相對肌腱保留是典型影像線索，下直肌與內直肌常受影響，但不是每例都照同一順序。疾病活動度描述發炎是否活躍，嚴重度描述對視力與功能的影響，兩者須分開評估。"], "clinicalLink": "眼外觀、活動度與甲狀腺生化不是同一指標。", "pitfall": "TED不等於甲亢，也不能只按突眼多少分級。", "recall": {"question": "甲狀腺數值正常且單眼突出，能排TED嗎？", "answer": "不能，需完整臨床、抗體及影像評估並保留其他眶病。"}, "relatedTopics": ["notes-04"], "sourceIds": ["n08-ted-integrated", "cov08-ted2021"]}, {"id": "c16", "title": "TED前端與眶尖：暴露和視神經病變", "pages": [21, 22, 28, 35], "unitId": "u2", "sectionIndexes": [5], "terms": ["lagophthalmos", "exposure keratopathy", "dysthyroid optic neuropathy", "apical crowding"], "keyPoints": ["眼瞼後縮、閉合不全與突眼使角膜暴露，需評估染色、缺損及保護能力。另一端，增厚組織在眶尖擁擠可影響視神經；色覺、視野、視力與瞳孔比外觀更直接反映功能。", "壓迫性視神經病變可能不伴極端突出，雙眼對稱受損時也未必有明顯RAPD。視神經或角膜破壞均屬威脅視力的急症，需要立即專科處理與反覆功能評估。"], "clinicalLink": "在同一次檢查同時看角膜表面與眶尖功能，避免漏掉另一端。", "pitfall": "角膜與神經危機不能等甲狀腺數值完全正常才處理。", "recall": {"question": "TED突出不嚴重但色覺變差，如何解讀？", "answer": "需懷疑視神經受壓，不以突出程度排除。"}, "relatedTopics": ["notes-05", "notes-03"], "sourceIds": ["cov08-ted2021", "n08-ted-integrated"]}, {"id": "c17", "title": "TED治療與重建順序：急症不照固定日數等待", "pages": [28, 35], "unitId": "u2", "sectionIndexes": [6], "terms": ["EUGOGO", "smoking cessation", "immunomodulation", "orbital decompression", "strabismus surgery", "lid surgery"], "keyPoints": ["所有TED患者需處理吸菸、甲狀腺狀態與眼表保護。活動性中重度病由專科依臨床情境選擇免疫調節等治療；原共筆2008流程不應當作現行唯一方案，藥物可用性與全身風險需一起考量。", "威脅視力時立即處理；若視神經功能對治療反應不足或繼續惡化，應緊急評估減壓，不能機械式等滿兩週。穩定期的復健手術通常先眶減壓、再斜視、後眼瞼，以免前一步改變後一步結果。"], "clinicalLink": "分清救視力的急性介入與穩定期改善複視／外觀的重建。", "pitfall": "不是所有眼瞼問題只屬美觀；嚴重暴露可需立即保護。", "recall": {"question": "為何斜視手術通常排在眶減壓之後？", "answer": "減壓可能改變眼球位置和肌肉平衡，先做斜視會增加重做風險。"}, "relatedTopics": [], "sourceIds": ["cov08-ted2021"]}, {"id": "c18", "title": "IOIS的四種局部型與排除診斷", "pages": [36, 37, 56], "unitId": "u2", "sectionIndexes": [5, 7], "terms": ["IOIS", "orbital pseudotumor", "myositis", "dacryoadenitis", "sclerotenonitis", "perineuritis"], "keyPoints": ["非特異性眼眶炎可為瀰漫，或主要累及肌肉myositis、淚腺dacryoadenitis、鞏膜周圍sclerotenonitis及視神經周圍perineuritis。不同位置造成疼痛、運動受限、眼瞼腫或視功能異常。", "IOIS是適當排除感染、TED、系統性炎症與腫瘤後的診斷；類固醇反應好只能支持，不能單獨證明。非典型、反覆、神經惡化或持續影像異常時須評估活檢及其他原因，難治病例治療需專科選擇。"], "clinicalLink": "把症狀依受累結構分群，比把所有不明腫塊叫假腫瘤更精確。", "pitfall": "不能在未排感染時以試用高劑量類固醇作唯一診斷測試。", "recall": {"question": "外觀似腫瘤又對類固醇有反應，為何仍可能需活檢？", "answer": "淋巴瘤與其他疾病也可暫時改善，病理可能改變治療方向。"}, "relatedTopics": [], "sourceIds": ["cov08-ioi", "cov08-lymph"]}, {"id": "c19", "title": "圖表比較：IOIS、眶蜂窩炎與TED", "pages": [37, 56], "unitId": "u2", "sectionIndexes": [3, 5, 7], "terms": ["tendon involvement", "muscle belly", "laterality", "sinus disease"], "keyPoints": ["IOIS常較急、痛性並可累及肌腱及周圍脂肪；眶蜂窩炎多急性單側且需找鼻竇或皮膚來源；TED常較慢或亞急性、雙側但不對稱，典型見眼瞼後縮及相對肌腱保留。", "這些是機率線索，並非一項影像即可排除其他病。發燒、白血球、甲狀腺檢验和類固醇反應都需結合視功能與完整病史；TED可累及脂肪，原圖「不延至脂肪」不能當絕對規則。"], "clinicalLink": "將比較表轉成病因、病程、位置與危险四欄，遇例外仍能推理。", "pitfall": "肌腱保留不是TED的百分百特異指標。", "recall": {"question": "單側痛性腫眼，肌腱也厚，直接IOIS嗎？", "answer": "只能提高懷疑，仍須排感染、腫瘤及其他炎症。"}, "relatedTopics": [], "sourceIds": ["cov08-ioi", "n08-orbital", "n08-ted-integrated"]}, {"id": "c20", "title": "兒童外上方腫塊：dermoid與epidermoid", "pages": [13, 14, 16, 38, 54, 55, 57, 61, 62, 63, 64], "unitId": "u2", "sectionIndexes": [7], "terms": ["dermoid cyst", "epidermoid cyst", "frontozygomatic suture", "dumbbell dermoid"], "keyPoints": ["Dermoid與epidermoid常為先天性包埋組織形成、緩慢增長的囊腫，外上方顴額骨縫是常見位置。Dermoid囊壁含皮膚附屬結構，epidermoid主要為鱗狀上皮與角質，不能只用有沒有真皮一句概括。", "深部或啞鈴型病灶可經骨壁連到顳窩，手術規劃需了解完整范圍。是否切除依大小、症狀、增長與破裂發炎風險決定；囊壁處理與解剖評估影響復發。"], "clinicalLink": "出生後一直存在、位置和慢速成長支持此方向，但不是免檢查證明。", "pitfall": "不是所有外上方腫塊都是dermoid，淚腺及其他病變也可在此。", "recall": {"question": "顳側腫塊和眶內相連，手術前最需確定什麼？", "answer": "是否為啞鈴型延伸及與骨、肌肉、神經的關係。"}, "relatedTopics": [], "sourceIds": ["cov08-masses", "cov08-imaging"]}, {"id": "c21", "title": "兒童快速突眼：原發橫紋肌肉瘤與轉移神經母細胞瘤", "pages": [13, 18, 26, 38, 39, 57, 62, 63, 64], "unitId": "u2", "sectionIndexes": [7], "terms": ["rhabdomyosarcoma", "neuroblastoma", "orbital metastasis", "leukemic infiltration"], "keyPoints": ["橫紋肌肉瘤是兒童重要原發惡性眼眶腫瘤，可在短時間出現突眼或眼位改變，不能因看似發炎就反覆抗生素。確診需取得組織並分期，由兒癌團隊決定化療、放療與手術角色。", "神經母細胞瘤到眼眶通常是轉移，可有眶周瘀斑與骨病變；兒童遠處腫瘤轉移較常表現在眼眶，而成人眼內轉移常見脈絡膜。雙眼突眼亦需考慮白血病浸潤，不能只想到TED。"], "clinicalLink": "把兒童腫塊的「原發vs轉移」連到全身分期。", "pitfall": "小橫紋肌肉瘤切除後仍需癌症分期與系統治療評估，不能以切乾淨結案。", "recall": {"question": "神經母細胞瘤與橫紋肌肉瘤在眼眶的典型角色？", "answer": "前者常為全身原發的轉移，後者可為原發眼眶惡性腫瘤。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov08-rms", "cov08-masses"]}, {"id": "c22", "title": "成人慢性突眼：海綿狀靜脈畸形", "pages": [13, 14, 39, 54, 57, 62, 64], "unitId": "u2", "sectionIndexes": [7], "terms": ["cavernous venous malformation", "cavernous hemangioma", "intraconal", "gaze-evoked amaurosis"], "keyPoints": ["舊稱cavernous hemangioma的眼眶病灶現常稱海綿狀靜脈畸形，典型為成人緩慢單側軸向突眼，常位於肌錐內。CT可見界線清楚腫塊，MRI訊號及增強模式可協助評估。", "症狀、增長、複視、視神經壓迫或轉眼誘發黑矇影響是否需介入；無症狀病灶可能採觀察。良性組織學不代表沒有視力風險，深部手術也需權衡鄰近神經與血管。"], "clinicalLink": "形態與位置先界定機轉，再用功能和病程決定處置。", "pitfall": "不是所有界線清楚的肌錐內腫塊都能單凭CT確診。", "recall": {"question": "為何轉眼時短暫黑矇需要重視？", "answer": "可能顯示病灶在特定眼位造成神經或血流受壓。"}, "relatedTopics": ["notes-03"], "sourceIds": ["cov08-masses", "cov08-imaging"]}, {"id": "c23", "title": "淚腺、骨性及神經性腫塊：用位置和疼痛縮小範圍", "pages": [13, 14, 16, 18, 26, 32], "unitId": "u2", "sectionIndexes": [7], "terms": ["pleomorphic adenoma", "lacrimal gland tumor", "mucocele", "osteoma", "fibrous dysplasia", "glioma", "meningioma"], "keyPoints": ["外上方淚腺病灶可為發炎、良性混合瘤／多形性腺瘤或惡性腫瘤；疼痛或快速變化需提高警覺。內上方則可見黏液囊腫mucocele、骨瘤osteoma或鼻竇來源病變，影像能界定是否跨骨壁。", "纖維性骨發育不良改變骨質與空间，視神經膠質瘤或腦膜瘤則沿神經相關結構。這些病名不是同一類「良性慢腫塊」，有不同活檢與手術策略，應先影像及專科規劃而非隨意切開。"], "clinicalLink": "從外上、內上、肌錐內、骨壁或神經通道分區，減少散背腫瘤。", "pitfall": "慢速生長不能保證良性，腫塊也不能盲目按壓或穿刺。", "recall": {"question": "外上方腫塊伴痛，為何不能只當普通淚腺炎？", "answer": "腫瘤及侵襲性病變也可能疼痛，需結合影像與適當病理。"}, "relatedTopics": [], "sourceIds": ["cov08-masses", "cov08-imaging"]}, {"id": "c24", "title": "眼附屬器淋巴瘤：局部腫塊也要全身分期", "pages": [16, 19, 26, 32, 40, 57], "unitId": "u2", "sectionIndexes": [7], "terms": ["ocular adnexal lymphoma", "MALT", "B-cell", "molding", "systemic staging"], "keyPoints": ["淋巴瘤可出現在眼眶、淚腺、結膜、眼瞼或淚囊；不少眼附屬器病變為B細胞型，其中包括MALT類型，但不能把所有結外淋巴瘤都叫MALToma。緩慢無痛腫脹仍可能惡性。", "影像可見腫塊沿既有結構塑形，骨侵蝕可能不明顯，但这些特徵不取代活檢。病理分型後需全身分期，局部放療、系統治療或其他策略依類型與范圍決定，不能「切掉眼部腫塊」就視為治癒。"], "clinicalLink": "眼瞼下垂可能是機械性壓迫表徵，先找後方腫塊再談提眼瞼手術。", "pitfall": "沒有骨侵蝕或沒有疼痛不能排除惡性。", "recall": {"question": "結膜活檢確診淋巴瘤後還需要什麼？", "answer": "組織分型及全身分期，決定局部與系統治療。"}, "relatedTopics": [], "sourceIds": ["cov08-lymph"]}, {"id": "c25", "title": "Evisceration、enucleation與眼眶重建", "pages": [41, 42, 57], "unitId": "u2", "sectionIndexes": [8], "terms": ["evisceration", "enucleation", "orbital implant", "ocular prosthesis", "sympathetic ophthalmia"], "keyPoints": ["Evisceration移除眼內內容、保留鞏膜殼與肌肉附著；enucleation移除完整眼球及一段視神經，提供完整病理。懷疑眼內惡性腫瘤時不能用剜除方式破壞腫瘤而增加播散風險。", "術中填充眶容積的植入物與後續外觀用義眼片不是同一物。疼痛失明眼、嚴重創傷或腫瘤的選擇需視覺潛力和替代方案；交感性眼炎是罕見風險，不能照原文寫成剜除「容易」導致。"], "clinicalLink": "說明移除哪些組織、保留哪些功能及如何取得病理，比只記中文手術名清楚。", "pitfall": "不是看到retinoblastoma或脈絡膜黑色素瘤就一定摘眼，需腫瘤專科評估保眼可能。", "recall": {"question": "疑眼內惡性腫瘤為何不做evisceration？", "answer": "會破壞完整腫瘤與病理範圍，並可能造成播散。"}, "relatedTopics": ["notes-09", "notes-10"], "sourceIds": ["cov08-evis"]}, {"id": "c26", "title": "淚液分泌：主副淚腺與反射弧", "pages": [43, 44, 58, 62, 64], "unitId": "u3", "sectionIndexes": [9], "terms": ["main lacrimal gland", "orbital lobe", "palpebral lobe", "Krause", "Wolfring", "CN5", "CN7"], "keyPoints": ["主淚腺位於外上方，提上瞼肌腱膜分出眶葉與瞼葉，排泄管通向上方結膜穹窿；手術或活檢需保護導管，避免破壞分泌輸出。Krause副淚腺多在穹窿，Wolfring在瞼板附近。", "角膜感覺傳入涉及CN5，淚液反射的副交感傳出與CN7路徑相關。傳統把主淚腺全叫反射、副淚腺全叫基礎分泌有助記憶，但真實分泌系統是協同的，不是互不相干的開關。"], "clinicalLink": "感覺受損、腺體問題和導管損傷都可造成眼表潤滑不足。", "pitfall": "淚腺不等於鼻淚管；一個負責分泌，一個參與排出。", "recall": {"question": "淚腺瞼葉損傷為何可能造成乾眼？", "answer": "可能影響腺體及排泄管通往眼表的路徑。"}, "relatedTopics": ["notes-12", "notes-03"], "sourceIds": ["cov08-imaging", "n08-punctal"]}, {"id": "c27", "title": "淚膜成分與反射性流淚：乾眼也可以淚汪汪", "pages": [43, 46, 58], "unitId": "u3", "sectionIndexes": [9], "terms": ["lipid", "aqueous", "mucin", "Meibomian gland", "goblet cell", "reflex tearing"], "keyPoints": ["脂質主要來自瞼板腺，水性成分來自淚腺，黏蛋白與杯狀細胞及眼表上皮相關。傳統三層圖方便定位來源，但實際上水與黏蛋白相互混合，淚膜穩定还需眨眼及上皮表面配合。", "異物、倒睫、過敏、角膜暴露與乾眼都可能刺激反射流淚。淚很多不代表淚膜品質或留存正常，因此評估溢淚要先看眼表和眼瞼，再追查是否有排出阻塞。"], "clinicalLink": "同時回答「為何被刺激多分泌」和「為何留不住或排不掉」。", "pitfall": "不能因主訴流淚就排除乾眼，也不能只依Schirmer一項確診。", "recall": {"question": "乾眼病人流淚和鼻淚管堵住如何初步區分？", "answer": "結合刺激症狀、眼表染色、眼瞼與淚點位置，再做適当排淚檢查。"}, "relatedTopics": ["notes-12", "notes-11"], "sourceIds": ["n08-punctal"]}, {"id": "c28", "title": "排淚路線：Rosenmüller與Hasner不在同一段", "pages": [44, 45, 58, 61, 62, 63, 64], "unitId": "u3", "sectionIndexes": [9], "terms": ["punctum", "canaliculus", "common canaliculus", "Rosenmüller", "Hasner", "inferior meatus"], "keyPoints": ["眼表淚液經上下淚點、淚小管與多數人的總淚小管進入淚囊，再經鼻淚管到下鼻道。Rosenmüller瓣與總淚小管入囊處相關，Hasner瓣在鼻淚管遠端鼻腔開口。", "先天鼻淚管阻塞常在Hasner處，與入口淚點閉鎖或淚小管問題不同。自然排淚出口在下鼻道，而DCR建立的是淚囊到鼻腔的新通道，不能把兩條路混作原有解剖。"], "clinicalLink": "依路徑找阻塞層级，才知道探通、支架或繞道各能解決什麼。", "pitfall": "Rosenmüller瓣不在鼻淚管末端。", "recall": {"question": "自然鼻淚管開口位於哪裡？", "answer": "下鼻道，Hasner瓣附近。"}, "relatedTopics": [], "sourceIds": ["cov08-nld", "n08-lacrimal-video"]}, {"id": "c29", "title": "眨眼淚泵與淚點貼合", "pages": [45, 46, 58], "unitId": "u3", "sectionIndexes": [9], "terms": ["lacrimal pump", "Horner muscle", "facial palsy", "punctal apposition"], "keyPoints": ["淚液排出需淚點接觸淚湖、管腔通暢及眨眼形成的動態壓力變化配合。眼輪匝肌深部的Horner肌參與泵送，CN7麻痺或眼瞼鬆弛可使眼淚排出差。", "灌洗是在外加壓力下測管道，因此沖得通仍可能有功能性泵問題。眼瞼外翻或淚點偏位也可讓入口離開淚液，修好下游鼻淚管不一定解決流淚。"], "clinicalLink": "先看淚點是否貼眼球和眨眼是否完整，再決定下游檢查。", "pitfall": "不能把泵簡化成一個正壓或負壓動作即可涵蓋所有機制。", "recall": {"question": "管路灌洗通暢但顏面麻痺一直流淚，如何解释？", "answer": "淚點位置與淚泵動態可能異常。"}, "relatedTopics": ["notes-11"], "sourceIds": ["n08-punctal", "n08-lacrimal-video"]}, {"id": "c30", "title": "溢淚問診與初步檢查的順序", "pages": [47, 48, 58, 61, 63], "unitId": "u3", "sectionIndexes": [9, 10], "terms": ["epiphora assessment", "dye disappearance test", "irrigation", "probing"], "keyPoints": ["問起始年齡、單雙側、持續或間歇、刺激感、分泌物、血性淚、手術外傷及藥物，再看眼表、淚點與內眥腫塊。染色消退試驗觀察自然排出效率，適合兒童等不易配合侵入檢查者。", "灌洗可观察是否入鼻或逆流，探查有助定位淚小管等阻塞，但需要受訓操作及解讀。自然排淚差和灌洗不通不是同一件事；急性感染或可疑腫瘤時流程需調整。"], "clinicalLink": "從低侵入、能回答問題的檢查開始，不將影像當每位病人的第一步。", "pitfall": "灌洗或探通不是「淚腺」檢查，也不應自行在家操作。", "recall": {"question": "染色殘留但灌洗通，可能表示什麼？", "answer": "功能性排出延遲、淚泵或部分狹窄等，需結合眼瞼與症狀。"}, "relatedTopics": [], "sourceIds": ["n08-lacrimal-video", "cov08-imaging"]}, {"id": "c31", "title": "淚道影像：看結構還是看生理流動", "pages": [47, 48, 58, 61, 63], "unitId": "u3", "sectionIndexes": [9, 10], "terms": ["dacryocystography", "dacryoscintigraphy", "Tc99m", "CT", "MRI"], "keyPoints": ["淚囊造影以顯影劑描繪通道，較能回答狹窄、阻塞位置與憩室等解剖問題；淚液核醫動態檢查以Tc99m追蹤自然流动，偏重功能性的排出效率。", "CT可看骨、鼻竇與腫塊范圍，MRI在特定軟組織或腫瘤问题也有價值。一般單纯流淚不需例行MRI，但血性逆流、硬腫塊、創傷或反覆不典型病程可改變影像需求。"], "clinicalLink": "先區分要找堵點、泵功能还是周邊腫塊，再選檢查。", "pitfall": "原考題「MRI不適合初步檢查」不能推成MRI永遠不能用。", "recall": {"question": "造影與核醫淚流檢查最主要差異？", "answer": "前者偏解剖通道，後者偏生理流动。"}, "relatedTopics": [], "sourceIds": ["cov08-imaging"]}, {"id": "c32", "title": "先天性鼻淚管阻塞：Hasner膜與重要鑑別", "pages": [49, 58, 60, 61, 62, 63, 64], "unitId": "u3", "sectionIndexes": [10], "terms": ["congenital nasolacrimal duct obstruction", "Hasner membrane", "epiblepharon", "dacryocystocele"], "keyPoints": ["嬰兒溢淚常與遠端Hasner膜未開通相關，可伴分泌物與淚湖增高；症狀顯現時間不同，不能說所有新生兒前三四週完全不分泌眼淚。還需排結膜炎、眼瞼贅皮倒睫及先天青光眼。", "先天淚囊膨出可呈內眥藍色腫塊，鼻內囊腫可能造成嬰兒呼吸问题；紅腫發燒則要排感染。腦膨出或鼻竇黏液囊腫等較少見病變，須依位置和影像分辨，不能全按單純膜性阻塞處理。"], "clinicalLink": "畏光、角膜變大或混濁、呼吸困難會立即改變分流。", "pitfall": "淚汪汪嬰兒不宜不檢查角膜就只教按摩。", "recall": {"question": "何種嬰兒流淚徵象要先排青光眼？", "answer": "合併畏光、角膜混濁／變大或眼瞼痙攣。"}, "relatedTopics": ["notes-07", "notes-11"], "sourceIds": ["cov08-nld"]}, {"id": "c33", "title": "兒童溢淚治療階梯：觀察、按摩、探通與進階介入", "pages": [49, 50, 60, 62, 64], "unitId": "u3", "sectionIndexes": [10], "terms": ["Crigler massage", "probing", "silicone intubation", "balloon dacryoplasty", "inferior turbinate infracture"], "keyPoints": ["多數單純先天鼻淚管阻塞可在第一年自行改善；由專業人員教導Crigler向下按摩。明顯分泌物或結痂時可短期用局部抗菌藥控制症狀，但抗生素本身不能打開膜，不應所有嬰兒長期常規使用。", "持續或嚴重症狀可考慮探通，年齡時機需個別判斷；失敗或複雜個案可能用矽膠管、氣球擴張或鼻內處理。Inferior turbinate infracture是下鼻甲骨折內移／調整，不等同「鼻甲切除」。DCR通常留给較難治情況。"], "clinicalLink": "把治療按自然史與阻塞複雜度分層，而非固定13個月必做同一手術。", "pitfall": "沒有症狀感染不需常規抗生素；不能將研究成功率保證給所有兒童。", "recall": {"question": "探通失敗就一定要DCR嗎？", "answer": "不一定，可依情境選支架、氣球或鼻內處理等。"}, "relatedTopics": [], "sourceIds": ["cov08-nld"]}, {"id": "c34", "title": "後天性阻塞：淚點、淚小管與鼻淚管各自的重建", "pages": [51, 60], "unitId": "u3", "sectionIndexes": [10], "terms": ["punctal stenosis", "punctoplasty", "canalicular obstruction", "CDCR", "Jones tube", "DCR"], "keyPoints": ["後天狹窄可與發炎、手術、外傷或腫瘤相關；淚點狹窄可考慮擴張或淚點成形，淚小管問題可能需支架等處理。多段阻塞必須先定位，不能一看到流淚就直接排DCR。", "DCR讓淚囊直接通到鼻腔，以绕過鼻淚管；嚴重淚小管阻塞時CDCR可利用Jones管讓結膜區與鼻腔建立通路。外切或鼻內內視鏡DCR需按解剖與團隊经验選擇，並非所有鼻內方法都等於雷射。"], "clinicalLink": "畫出阻塞前後的淚流路線，即能理解術式目的。", "pitfall": "DCR無法自動修復位在淚囊上游的嚴重淚小管阻塞。", "recall": {"question": "DCR和CDCR在起點上差在哪？", "answer": "DCR從淚囊開始，CDCR從結膜側跨過嚴重上游通路問題。"}, "relatedTopics": [], "sourceIds": ["n08-lacrimal-video", "cov08-dacryo"]}, {"id": "c35", "title": "淚小管炎：反覆單眼分泌物與pouting punctum", "pages": [52, 60], "unitId": "u3", "sectionIndexes": [11], "terms": ["canaliculitis", "Actinomyces israelii", "dacryolith", "pouting punctum", "canaliculotomy"], "keyPoints": ["淚小管炎可被誤當長期結膜炎；淚點紅腫外翻、沿小管局部壓痛或可擠出膿液與結石是線索。Actinomyces是經典病原，亦可能有葡萄球菌、鏈球菌或其他微生物。", "深部結石和殘留異物可使單用表面滴藥反覆失敗。治療視情況需要抗感染、移除結石及淚小管切開刮除，取得檢體培養；急性發炎組織不宜粗暴探查以免假道。"], "clinicalLink": "慢性「結膜炎」固定單眼時，要真正看上下淚點。", "pitfall": "淚小管炎與位於淚囊區的急性淚囊炎不是同一位置。", "recall": {"question": "哪個局部發現最讓你重想淚小管炎？", "answer": "腫脹外翻的淚點伴擠出膿液或小結石。"}, "relatedTopics": ["notes-12"], "sourceIds": ["cov08-canal"]}, {"id": "c36", "title": "急性淚囊炎：先控制感染，再處理阻塞", "pages": [45, 52, 58, 60, 61, 64], "unitId": "u3", "sectionIndexes": [11], "terms": ["acute dacryocystitis", "nasolacrimal obstruction", "medial canthal tendon", "abscess", "fistula"], "keyPoints": ["鼻淚管阻塞使淚囊滯留後感染，常為內眥肌腱下方紅腫疼痛，可形成膿瘍或皮膚瘻管。位置是提示，並非「必定只在下方」；仍需檢查視力、瞳孔與眼球運動是否提示眶內延伸。", "急性淚囊炎通常需全身抗菌治療，嚴重或合併眶病需住院靜脈治療及評估引流。急性期不做例行灌洗探通；特殊兒童感染與阻塞处理由專科決定。感染受控後，再規劃成人DCR等病因治療。"], "clinicalLink": "不要把「有出口阻塞」視為當下只要通管即可。", "pitfall": "原共筆「輕症僅外用抗生素」不宜作通用建議。", "recall": {"question": "紅腫淚囊合併複視，下一步是否只加眼藥？", "answer": "不是，須緊急排眶內感染並升級影像與全身治療。"}, "relatedTopics": [], "sourceIds": ["cov08-dacryo", "n08-orbital"]}, {"id": "c37", "title": "淚囊腫瘤：血性逆流與肌腱上方腫塊", "pages": [45, 53, 58, 60], "unitId": "u3", "sectionIndexes": [11], "terms": ["lacrimal sac tumor", "bloody reflux", "hemolacria", "telangiectasia", "lymphadenopathy"], "keyPoints": ["慢性溢淚伴無痛硬腫塊、向內眥肌腱上方延伸、血性淚或灌洗血性逆流，需考慮淚囊腫瘤。皮膚潰瘍、微血管擴張或區域淋巴結也會提高警覺，但任何一項缺席都不能排除。", "影像需評估淚囊、骨壁、鼻竇及眼眶范圍，病理才能區分上皮性腫瘤、淋巴瘤等。通路可能仍通暢，因此灌洗成功並不是沒有腫瘤的證明。"], "clinicalLink": "反覆「淚囊炎」不典型或治療未改善，應重新定位而非一再抗生素。", "pitfall": "只依疼痛或肌腱相對位置不能可靠判定良惡性。", "recall": {"question": "灌洗水能到鼻子但有血性逆流，能結案嗎？", "answer": "不能，可疑腫瘤仍需影像及專科評估。"}, "relatedTopics": [], "sourceIds": ["cov08-dacryo", "cov08-lymph", "cov08-imaging"]}, {"id": "c38", "title": "內側眼瞼裂傷與淚小管：先辨認再縫", "pages": [53, 60], "unitId": "u3", "sectionIndexes": [11], "terms": ["canalicular laceration", "medial eyelid trauma", "silicone stent"], "keyPoints": ["靠近淚點或內眥的眼瞼裂傷可能同時切斷淚小管，即使外觀傷口不大也不可只做表面縫合。先排眼球破裂及更深部損傷，再由合適專科確認淚道、瞼緣及內眥支撐是否受累。", "淚小管修復可需寻找斷端、放矽膠支架及重建周邊組織，時機與方式由伤勢決定。漏掉後疤痕化會增加再次寻找與重建難度，修好皮膚不代表排淚功能已保存。"], "clinicalLink": "把內側裂傷與長期溢淚風險連起來，解釋為何要專科修補。", "pitfall": "不要盲目向傷口探針找管，以免造成新損傷。", "recall": {"question": "內眥傷口縫合前必須先確認什麼？", "answer": "眼球完整性、淚小管與瞼緣／內眥結構損傷。"}, "relatedTopics": ["notes-11", "notes-05"], "sourceIds": ["n08-lacrimal-video", "cov08-imaging"]}], "unresolved": [], "sourceSha256": "6cc99f725b075a854f85ac57eccb6f9174ef78168630849b799318cb87c19129"}, "notes-09": {"sourceFile": "眼科學No.09.pdf", "pageCount": 48, "reviewedPages": [{"from": 1, "to": 2, "kind": "administrative", "note": "封面與目錄；不收錄個人名單"}, {"from": 3, "to": 26, "kind": "teaching", "note": "課程主題、解剖、發炎分類與徵象、併發症及複習表；略去課堂評語"}, {"from": 27, "to": 29, "kind": "exam", "note": "虹膜、睫狀體功能與前炎徵象的考點及解答核對"}, {"from": 30, "to": 44, "kind": "teaching", "note": "病因、感染與非感染疾病、檢驗及治療；含影像內藥物表"}, {"from": 45, "to": 48, "kind": "exam", "note": "宿主免疫、全身疾病、假面、結核、交感性眼炎及無菌預防考點"}], "entries": [{"id": "c01", "title": "虹膜的層次、血管與瞳孔肌", "pages": [4, 5, 24, 27, 28, 29], "unitId": "u1", "sectionIndexes": [0], "terms": ["Iris", "Stroma", "Crypts", "Pupillary zone", "Ciliary zone", "Sphincter pupillae", "Dilator pupillae", "Anterior ciliary artery", "Long posterior ciliary artery"], "keyPoints": ["虹膜由基質、肌肉與後方色素上皮構成；表面凹窩 crypts、瞳孔區與睫狀區是定位標誌，沒有角膜式的內皮層。虹膜根部接睫狀體，前睫狀與長後睫狀動脈參與其血液供應。", "瞳孔括約肌呈環狀、受副交感支配；擴瞳肌呈放射狀、受交感支配。兩者均與神經外胚層發育相關，不能把整個葡萄膜及其肌肉都歸為同一胚層。"], "clinicalLink": "先描述肌肉與傳入／傳出路徑，再解釋散瞳、縮瞳或手術相關缺血。", "pitfall": "虹膜血管與瞳孔神經支配是兩個問題，不能互相代答。", "recall": {"question": "副交感興奮時何者收縮？", "answer": "虹膜括約肌收縮，瞳孔縮小。"}, "relatedTopics": ["notes-03"], "sourceIds": ["uve-video"]}, {"id": "c02", "title": "瞳孔大小如何影響像差與夜間眩光", "pages": [5, 6, 24, 27, 28, 29], "unitId": "u1", "sectionIndexes": [0], "terms": ["Spherical aberration", "Chromatic aberration", "Pinhole", "Glare"], "keyPoints": ["球面像差是不同入射高度的光線聚焦不同；色像差來自不同波長的折射差異。較小瞳孔限制周邊光線，增加景深並減少部分像差，能解釋針孔下部分屈光性模糊改善。", "夜間散瞳增加周邊光線參與成像，屈光不正與高階像差的影響可能更明顯；但瞳孔不是越小越清楚，極小孔徑會增加繞射並減少進光。"], "clinicalLink": "把夜間眩光串到屈光、角膜、晶狀體及瞳孔，而非只問視力表。", "pitfall": "針孔改善不等於排除所有器質性眼病。", "recall": {"question": "夜間散瞳為何可能較模糊？", "answer": "周邊像差與未矯正屈光誤差影響增加。"}, "relatedTopics": ["notes-01", "notes-02", "notes-06"], "sourceIds": ["uve-video"]}, {"id": "c03", "title": "虹膜與脈絡膜缺損：位置決定功能", "pages": [7, 11, 25], "unitId": "u1", "sectionIndexes": [0], "terms": ["Iris coloboma", "Chorioretinal coloboma"], "keyPoints": ["Coloboma 與胚胎眼裂閉合異常相關；虹膜缺損可呈鑰匙孔樣瞳孔並造成畏光、眩光。脈絡膜視網膜缺損則影響對應組織與視野，兩者不能只按外觀合稱「脈絡膜缺損」。", "是否累及黃斑、視神經與是否伴裂孔／剝離，决定視功能與追蹤。即使中央视力保存，也需要評估周邊病灶和兒童弱視風險。"], "clinicalLink": "看到先天虹膜缺口時，將檢查延伸到後段與視功能發育。", "pitfall": "不能照舊稿一概說 coloboma 沒有大問題。", "recall": {"question": "外觀缺口小就代表視力良好嗎？", "answer": "不能，後段缺損的位置與併發症更重要。"}, "relatedTopics": ["notes-04", "notes-10"], "sourceIds": ["uve-video"]}, {"id": "c04", "title": "瞳孔殘膜與先天無虹膜", "pages": [7, 25], "unitId": "u1", "sectionIndexes": [0], "terms": ["Persistent pupillary membrane", "Congenital aniridia", "Deprivation amblyopia"], "keyPoints": ["瞳孔殘膜是胚胎血管膜退化不完全；細絲可不影響視覺，但濃密遮擋視軸時需要評估剝奪性弱視。處置取決於透明視軸、視力與年齡，並非看見任何膜都手術。", "先天無虹膜常是整眼發育疾病的一部分，可同時有中心凹發育不全、角膜病、白內障與青光眼；人工虹膜或遮光只能處理部分眩光，不能保證恢復正常視力。"], "clinicalLink": "兒童的優先問題是視軸、屈光與弱視預防，並由專科評估相關全身／遺傳風險。", "pitfall": "無虹膜不等於只缺一片遮光板。", "recall": {"question": "殘膜最需要介入的功能線索？", "answer": "遮擋視軸或影響視覺發育。"}, "relatedTopics": ["notes-04", "notes-06", "notes-07"], "sourceIds": ["uve-video"]}, {"id": "c05", "title": "虹膜、睫狀體與脈絡膜腫塊", "pages": [8, 9, 12, 25], "unitId": "u1", "sectionIndexes": [0], "terms": ["Iris nevus", "Iris melanoma", "Iris metastasis", "Ciliary body melanoma", "Choroidal melanoma", "Choroidal metastasis"], "keyPoints": ["虹膜痣通常是可追蹤的色素病灶；成長、變形、血管、出血或繼發眼壓異常需提高對虹膜黑色素瘤及轉移的警覺。睫狀體黑色素瘤可能被虹膜遮擋，前節超音波等可補足盲區。", "脈絡膜黑色素瘤與轉移瘤都可能造成視網膜下液體；需整合眼底、超音波、病灶演變與全身病史。黑色素造成的 MRI 訊號可提供線索，但不能只憑 T1/T2 亮暗確診。"], "clinicalLink": "把「腫塊在哪一層」連到選用 UBM、B-scan 及眼腫瘤轉診。", "pitfall": "原發黑色素瘤與癌症轉移是不同病因。", "recall": {"question": "為何睫狀體腫瘤可能漏看？", "answer": "虹膜遮擋其位置，單純正面裂隙燈觀察不足。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-video", "uve-masquerade"]}, {"id": "c06", "title": "多個虹膜開口：真性多瞳與術後虹膜切開", "pages": [8, 25], "unitId": "u1", "sectionIndexes": [0], "terms": ["Polycoria", "Pseudopolycoria", "Pupula duplex", "Peripheral iridotomy"], "keyPoints": ["Polycoria 指多瞳孔的形態，真性多瞳需有相應括約肌功能；虹膜萎縮、外傷或周邊虹膜切開造成額外孔洞，屬不同的機轉。共筆的 pupula duplex 圖示不可當作一般人體解剖。", "周邊虹膜切開的目的在建立房水繞過瞳孔阻滯的通路；位置及瞼緣遮蓋可能影響術後光學症狀。先問手術史，再解釋眩光與房水機轉。"], "clinicalLink": "將額外開口與先前青光眼治療串起，避免把術後改變當新生疾病。", "pitfall": "「多一個洞」不等於多一套虹膜。", "recall": {"question": "周邊虹膜切開改善哪種阻力？", "answer": "瞳孔阻滯造成的前後房壓差。"}, "relatedTopics": ["notes-07"], "sourceIds": ["uve-video"]}, {"id": "c07", "title": "睫狀體：房水、調節與葡萄膜鞏膜流出", "pages": [8, 9, 24, 27, 28, 29], "unitId": "u1", "sectionIndexes": [0], "terms": ["Ciliary processes", "Longitudinal fibers", "Circular fibers", "Zonule", "Accommodation", "Uveoscleral outflow"], "keyPoints": ["睫狀突上皮分泌房水；房水先入後房再經瞳孔到前房。睫狀肌含縱向與環狀等纖維，收縮時懸韌帶張力下降、晶狀體變凸，增加近距離屈光力。", "睫狀體也參與葡萄膜鞏膜流出及玻璃體成分的維持；不能把玻璃體當房水般快速循環的液體。老花主要與晶狀體隨齡變硬等調節系統改變有關，不能只說睫狀肌無力。"], "clinicalLink": "同一構造的功能可解釋 cycloplegic 減痛、前炎低眼壓及青光眼藥物作用。", "pitfall": "單焦人工晶狀體不能藉睫狀肌收縮恢復年輕晶狀體的調節。", "recall": {"question": "看近時懸韌帶張力如何改變？", "answer": "睫狀肌收縮，懸韌帶張力下降，晶狀體較凸。"}, "relatedTopics": ["notes-02", "notes-06", "notes-07"], "sourceIds": ["uve-video"]}, {"id": "c08", "title": "睫狀體剝離與外傷後低眼壓", "pages": [9, 25], "unitId": "u3", "sectionIndexes": [3], "terms": ["Ciliary body detachment", "Cyclodialysis", "Hypotony"], "keyPoints": ["睫狀體剝離或炎症可降低房水生成；cyclodialysis 是睫狀體與鞏膜突分離，另增加向脈絡膜上腔的流出。兩者都可見低眼壓，但並非完全相同的解剖診斷。", "持續低眼壓可造成脈絡膜剝離與黃斑皺褶，並不代表眼睛受到保護。外傷史、前節影像及後段變化共同決定原因與處理。"], "clinicalLink": "眼傷後模糊先評估眼球完整性；排除開放性眼球傷並確認可安全量測後，再辨認高或低眼壓及低眼壓性黃斑病變。", "pitfall": "不能把低眼壓都解釋成房水分泌減少。", "recall": {"question": "房水增加流出與減少生成如何區別？", "answer": "依外傷、隅角／睫狀體解剖及影像判斷。"}, "relatedTopics": ["notes-07", "notes-10"], "sourceIds": ["uve-video"]}, {"id": "c09", "title": "脈絡膜供血、RPE與遮光功能", "pages": [10, 11, 24], "unitId": "u1", "sectionIndexes": [0], "terms": ["Choriocapillaris", "Retinal pigment epithelium", "Photoreceptor", "Melanin"], "keyPoints": ["脈絡膜毛細血管為外層視網膜、感光細胞與 RPE 提供重要代謝支持；內層視網膜主要依靠視網膜循環。這種分工可解釋視網膜動脈阻塞與脈絡膜病變呈現不同層次的損傷。", "RPE 與脈絡膜黑色素吸收散射光，RPE 同時參與外節吞噬、視覺循環與外血視網膜屏障。高度近視視損還牽涉萎縮、新生血管與牽引，不能只歸因於遮光變差。"], "clinicalLink": "從供血層次推論病灶，將解剖記憶接到眼底與 OCT。", "pitfall": "RPE 不是自帶血管的營養層。", "recall": {"question": "感光細胞主要依靠哪一套循環？", "answer": "脈絡膜循環。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-video"]}, {"id": "c10", "title": "CSC與脈絡膜新生血管：相同液體，不同機轉", "pages": [11, 12, 25], "unitId": "u1", "sectionIndexes": [0, 4], "terms": ["Central serous chorioretinopathy", "Choroidal neovascularization", "Subretinal fluid"], "keyPoints": ["中央漿液性脈絡膜視網膜病變涉及脈絡膜與 RPE 功能失調，可在神經視網膜下積液；這不是看見液體便診斷感染性脈絡膜炎。", "脈絡膜新生血管可見於 AMD、病理性近視與炎症後損傷，脆弱血管造成漏液、出血與瘢痕。糖尿病增殖病變的新生血管則出自視網膜系統，解剖位置及治療問題不同。"], "clinicalLink": "先用 OCT 定位液體，再依眼底及血管影像判斷是否有新生血管。", "pitfall": "視網膜下液體不等於一定要抗發炎，也不等於一定有 CNV。", "recall": {"question": "DR與AMD的新生血管來源有何不同？", "answer": "前者主要為視網膜循環，後者常涉及脈絡膜／黃斑新生血管。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-video"]}, {"id": "c11", "title": "用主要發炎位置修正舊分類", "pages": [3, 13, 14, 26, 43, 48], "unitId": "u1", "sectionIndexes": [1], "terms": ["Anterior uveitis", "Intermediate uveitis", "Posterior uveitis", "Panuveitis", "SUN"], "keyPoints": ["前型以偏重前房的炎症、中間型以玻璃體、後型以視網膜或脈絡膜病灶為主。SUN 分類回答主要炎症在哪裡，不把中間型直接等同睫狀體炎，也不將後型只限於脈絡膜。", "全葡萄膜炎需前房、玻璃體及視網膜／脈絡膜共同受累且無主要位置；舊共筆「任兩區發炎就算全型」過度簡化。定位之後還要另填病程、側別、病因及併發症。"], "clinicalLink": "交班先說定位，才說最可能感染或免疫機轉。", "pitfall": "黃斑水腫可能跨類型出現，不能單獨改變炎症分類。", "recall": {"question": "有前房cells加主要玻璃體炎，是否一定全型？", "answer": "否，需按主要炎症位置及後段受累情形分類。"}, "relatedTopics": [], "sourceIds": ["uve-sun"]}, {"id": "c12", "title": "從裂隙燈到眼底與多模態影像", "pages": [14, 15, 20, 25, 31], "unitId": "u1", "sectionIndexes": [1, 4], "terms": ["Slit lamp", "Fundoscopy", "OCT", "Fluorescein angiography", "Indocyanine green angiography"], "keyPoints": ["裂隙光束可分辨細胞位在角膜後、前房或晶狀體後的前玻璃體；散瞳眼底評估玻璃體、視網膜與脈絡膜病灶，必要時結合周邊檢查。", "OCT 回答水腫、液體與層次，FA 回答視網膜血管滲漏／灌流，ICGA 補充脈絡膜。深部暗點或高反射不能獨立指定病原，必須與臨床表型相配。"], "clinicalLink": "影像各回答一個明確問題，可避免只因前房好轉而漏掉後段病。", "pitfall": "不能把眼底所有灰白區都稱為活動性發炎。", "recall": {"question": "前房安靜但仍模糊，下一步？", "answer": "檢查晶狀體、玻璃體及黃斑，依缺口選影像。"}, "relatedTopics": ["notes-01", "notes-10"], "sourceIds": ["uve-video", "uve-sun"]}, {"id": "c13", "title": "前房cells、flare、纖維蛋白與hypopyon", "pages": [16, 17, 18, 26, 28], "unitId": "u1", "sectionIndexes": [2], "terms": ["Anterior chamber cells", "Flare", "Fibrin", "Hypopyon", "SUN grading"], "keyPoints": ["Cells 是細胞，flare 是血房水屏障破壞後蛋白散射；嚴重時可出現纖維蛋白膜，或細胞在前房下方形成水平面 hypopyon。四種描述相關但不能當成同義詞。", "SUN 前房細胞用 1×1 mm 光束分級：0為<1、0.5+為1–5、1+為6–15、2+為16–25、3+為26–50、4+為>50顆。Flare另記，持續蛋白不一定與當下細胞活動同步。"], "clinicalLink": "固定檢查條件後比較變化，比「眼睛看起來比較不紅」更可追蹤。", "pitfall": "Hypopyon 既可感染也可非感染，不能以其單独決定抗生素或類固醇。", "recall": {"question": "Cells和flare的物質差異？", "answer": "前者細胞；後者主要是蛋白造成的光散射。"}, "relatedTopics": [], "sourceIds": ["uve-sun"]}, {"id": "c14", "title": "KP與肉芽腫型線索不等於病因", "pages": [17, 26, 30, 31], "unitId": "u1", "sectionIndexes": [2, 6], "terms": ["Keratic precipitates", "Mutton-fat KP", "Granulomatous", "Non-granulomatous", "Koeppe nodules", "Busacca nodules"], "keyPoints": ["KP 是角膜內皮面的發炎細胞沉積；較大油脂樣 mutton-fat KP 及虹膜結節可提示肉芽腫型。Koeppe 位於瞳孔緣，Busacca 位於虹膜基質表面，應先描述位置。", "肉芽腫型會使 sarcoid、TB 等进入鑑別，但病毒等也可有重疊表型；組織學的乾酪／非乾酪性肉芽腫與臨床 KP 外观不能直接畫等號。"], "clinicalLink": "以形態縮小檢查方向，再以宿主、胸部資訊與病原證據修正。", "pitfall": "細小 KP 並不排除感染，大片 KP 也不自動確診 sarcoid。", "recall": {"question": "Mutton-fat KP能單獨確診TB嗎？", "answer": "不能，僅提供肉芽腫型炎症線索。"}, "relatedTopics": [], "sourceIds": ["uve-tb", "uve-classification"]}, {"id": "c15", "title": "後黏連、PAS與iris bombe", "pages": [17, 23, 26, 35, 44], "unitId": "u3", "sectionIndexes": [3], "terms": ["Posterior synechiae", "Peripheral anterior synechiae", "Iris bombe", "Pupillary block"], "keyPoints": ["後黏連連接虹膜與晶狀體；PAS 是周邊虹膜與隅角結構的黏連。點散瞳後瞳孔形狀不規則可提示局部後黏連，但陳舊黏連不代表目前仍活動發炎。", "廣泛瞳孔緣後黏連可阻滯房水，使虹膜向前膨隆形成 iris bombe，繼而关闭隅角。需同時評估眼壓、隅角與活動度；單靠加抗發炎不能解決所有結構性阻塞。"], "clinicalLink": "高眼壓前炎要分清小樑炎、類固醇反應及瞳孔阻滯。", "pitfall": "PAS不是虹膜與晶狀體黏連。", "recall": {"question": "後黏連如何間接關閉隅角？", "answer": "形成瞳孔阻滯與前後房壓差，使虹膜向前膨隆。"}, "relatedTopics": ["notes-07"], "sourceIds": ["uve-hlab27", "uve-treatment"]}, {"id": "c16", "title": "Vitritis、snowballs與snowbank的三種定位", "pages": [18, 19, 26, 30, 37, 44], "unitId": "u1", "sectionIndexes": [4], "terms": ["Vitritis", "Vitreous haze", "Snowballs", "Snowbank", "Pars planitis"], "keyPoints": ["玻璃體細胞與 haze 反映玻璃體腔的炎症；snowballs 為下方玻璃體內白色凝集物，snowbank 為平坦部／周邊視網膜的白色滲出斑。後者不是單純把幾顆 snowballs 相加。", "玻璃體混濁分級觀察視神經及血管清晰度，但需排除白內障等介質干擾。Pars planitis 是中間型中的特定類別，需有典型雪堤／雪球且無已識別的感染或全身病因。"], "clinicalLink": "對照玻璃體位置與周邊病灶，再檢查黃斑水腫。", "pitfall": "Vitritis不是睫狀體炎的直接同義詞。", "recall": {"question": "Snowballs與snowbank最有用的差別？", "answer": "前者位在玻璃體，後者是平坦部或周邊視網膜上的滲出。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-intermediate"]}, {"id": "c17", "title": "後段發炎、血管炎與活動疤痕判讀", "pages": [20, 22, 26, 31, 38], "unitId": "u1", "sectionIndexes": [4], "terms": ["Retinitis", "Choroiditis", "Chorioretinal scar", "Retinal vasculitis", "ICGA dark dots"], "keyPoints": ["Retinitis 以視網膜受累、choroiditis 以脈絡膜受累，兩者可延伸成脈絡膜視網膜炎。記錄白色病灶的邊界、厚度、血管關係與伴隨出血，才能比較活動病灶與陳舊萎縮疤痕。", "血管炎可同時造成漏液和閉塞，FA 能補足照片不明顯的活動；ICGA 暗點需考慮灌流或遮蔽等機轉。炎症後 CNV、CME 及漿液性剝離會獨立影響視力。"], "clinicalLink": "病灶外觀、滲漏與視功能三者一起追蹤，避免把疤痕當復發。", "pitfall": "一張ICGA有暗點不能直接命名病原。", "recall": {"question": "前房安靜能否排除視網膜血管炎？", "answer": "不能，後段炎症需另行檢查。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-video", "uve-classification"]}, {"id": "c18", "title": "葡萄膜炎為何使視力下降", "pages": [21, 22, 23, 26], "unitId": "u3", "sectionIndexes": [5], "terms": ["Cystoid macular edema", "Inflammatory CNV", "Retinal detachment", "Optic atrophy", "Band keratopathy", "Cataract", "Uveitic glaucoma"], "keyPoints": ["視力下降可由可見光路混濁、黃斑囊狀水腫、炎症性新生血管、視網膜剝離或缺血造成。發炎還可促成白內障、角膜帶狀鈣化，以及高眼壓後視神經損傷。", "先按角膜、晶狀體、玻璃體、黃斑、視神經逐層找原因，再區別可逆活動與已形成的結構損傷。治療炎症、處理併發症及視覺復健需並行，不能預設所有視損皆永久或皆可逆。"], "clinicalLink": "退紅不等於視力結局良好；每次問診仍量視力、眼壓並檢查黃斑。", "pitfall": "青光眼性視神經損失並不能靠降眼壓手術恢復，舊稿此類概括需要修正。", "recall": {"question": "前炎改善後仍視差可找哪三項？", "answer": "白內障、黃斑水腫及眼壓／視神經損害。"}, "relatedTopics": ["notes-05", "notes-06", "notes-07"], "sourceIds": ["uve-treatment"]}, {"id": "c19", "title": "病程、宿主與全身問診形成可修正假說", "pages": [13, 30, 31, 43, 45], "unitId": "u2", "sectionIndexes": [6], "terms": ["Acute", "Chronic", "Recurrent", "Laterality", "Exposure history", "Immune status"], "keyPoints": ["紀錄發作速度、持續時間、是否有停藥後安靜期、單雙眼與是否交替；再問手術創傷、藥物、免疫抑制、旅行與動物／食物暴露。復發或類固醇反應好都不能單独證明自體免疫。", "背痛晨僵指向脊椎關節病、皮膚黏膜潰瘍提示Behçet、咳嗽與胸部線索可涉及TB或sarcoid，發燒／肝膿瘍需想到內生性眼內炎。陰性問診只代表目前未發現，不永久排除。"], "clinicalLink": "口試說出每項問診如何改變檢驗或治療，避免堆列所有疾病。", "pitfall": "基因背景不是地理、旅行和感染暴露的替代答案。", "recall": {"question": "慢性反覆且類固醇有效是否必為免疫病？", "answer": "否；部分感染與假面疾病也可能暫時改善。"}, "relatedTopics": [], "sourceIds": ["uve-video", "uve-classification"]}, {"id": "c20", "title": "有目的的檢驗與採檢限制", "pages": [31, 34, 43, 46, 48], "unitId": "u2", "sectionIndexes": [6], "terms": ["RPR", "VDRL", "Treponemal test", "IGRA", "QuantiFERON", "T-SPOT", "Ocular PCR", "ACE", "Chest imaging", "CBC", "Renal function", "Liver function"], "keyPoints": ["梅毒檢測須將RPR／VDRL等非梅毒螺旋體試驗與特異性試驗配對；IGRA（如QuantiFERON、T-SPOT）支持TB感染背景，不能單獨證明眼內病因。ACE與胸部影像可支持sarcoid方向，亦不能單獨確診。", "眼內液PCR針對合適病原與時點可提供重要證據，量少或陰性不等於沒有感染。CBC、肝腎功能等亦是免疫治療安全基線；若懷疑MS或淋巴瘤，再由臨床線索安排MRI與專科採檢。"], "clinicalLink": "先寫出要解決的假說與陽性／陰性如何改變下一步，再選檢查。", "pitfall": "不能照舊稿概括「眼內免疫特殊，所以化驗不重要」。", "recall": {"question": "IGRA陽性是否等於眼結核？", "answer": "否，仍需相符眼部表型、其他感染證據及排除替代原因。"}, "relatedTopics": ["notes-03", "notes-13"], "sourceIds": ["uve-tb", "uve-classification", "uve-masquerade"]}, {"id": "c21", "title": "CMV retinitis：宿主差，炎症可能反而少", "pages": [3, 32, 43, 45, 48], "unitId": "u2", "sectionIndexes": [7], "terms": ["CMV retinitis", "Immunocompromised host", "Hemorrhagic retinitis"], "keyPoints": ["CMV視網膜炎常見於明顯免疫抑制背景，可有壞死性視網膜病灶與出血，但玻璃體炎症未必強烈。宿主防禦不足時，眼底看得清楚不代表感染輕。", "需迅速評估眼內感染範圍及全身免疫狀態，由專科安排抗CMV治療、必要局部治療及免疫相關照護。追蹤病灶邊緣與併發剝離，不僅比較症狀是否退紅。"], "clinicalLink": "移植或HIV病人新視力下降即使不痛，也需警覺機會性感染。", "pitfall": "CMV前葡萄膜炎與CMV retinitis的典型宿主不同。", "recall": {"question": "少量vitritis能排除重度CMV嗎？", "answer": "不能，免疫抑制可使炎症表現很少。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-hiv"]}, {"id": "c22", "title": "ARN：感染與炎症同時造成損傷", "pages": [3, 32, 33, 43, 45, 48], "unitId": "u2", "sectionIndexes": [7], "terms": ["Acute retinal necrosis", "ARN", "HSV", "VZV", "Occlusive arteritis"], "keyPoints": ["ARN常見周邊界線較明顯的壞死性視網膜炎、閉塞性動脈炎與明顯玻璃體／前房炎症。HSV或VZV均可造成，免疫正常者也會發病，不能僅按宿主免疫狀態排除。", "高度懷疑時需緊急抗病毒與視網膜專科評估；眼內PCR有助確認但不應延誤治療。類固醇若有需要，須在有效抗病毒保障下由專科決定時序，後續仍警惕視網膜剝離與對眼風險。"], "clinicalLink": "把病毒檢測、抗病毒起始與結構性併發症分開規畫。", "pitfall": "不是「吃藥一定痊癒」，也不能先高劑量類固醇單方。", "recall": {"question": "ARN最具方向性的三組線索？", "answer": "周邊壞死、閉塞性血管炎、明顯眼內炎症。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-arn"]}, {"id": "c23", "title": "PORN：外觀安靜的快速壞死", "pages": [3, 32, 33, 43, 45, 48], "unitId": "u2", "sectionIndexes": [7], "terms": ["Progressive outer retinal necrosis", "PORN", "Necrotizing herpetic retinopathy"], "keyPoints": ["PORN常發生於重度免疫抑制者，與VZV等疱疹病毒相關；可出現迅速擴展的多灶視網膜壞死而前房、玻璃體炎症較少。它與ARN有表型重疊，並非完全隔離的疾病世界。", "壞死可進展到全層並形成裂孔與剝離；處理重點為快速病原治療及免疫狀態照護。不要因名稱「outer」便假設OCT只有單一外層異常。"], "clinicalLink": "免疫低下、新白色視網膜病灶與少量細胞，應提高急迫性。", "pitfall": "少痛、少紅、少細胞均不是觀察等待的理由。", "recall": {"question": "PORN相較典型ARN，哪項可能較不明顯？", "answer": "眼內炎症反應。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-porn"]}, {"id": "c24", "title": "免疫恢復性葡萄膜炎：活動感染還是IRU", "pages": [30, 32, 43], "unitId": "u2", "sectionIndexes": [7], "terms": ["Immune recovery uveitis", "IRU", "IRIS", "Antiretroviral therapy"], "keyPoints": ["既往CMV retinitis的HIV病人在抗反轉錄病毒治療後，免疫重建可引起對殘存抗原的炎症，稱IRU，屬IRIS的一種眼部表現。可伴黃斑水腫或ERM而視力下降。", "先辨認是否仍有活動CMV、其他感染或真正免疫恢復性炎症；抗病毒、抗發炎及HIV治療需協同調整，不能看到免疫回升就直接停病原治療或自行停止抗反轉錄病毒藥。"], "clinicalLink": "把治療時序、免疫指標與眼底活動連起，解釋為何全身改善而眼睛可能變差。", "pitfall": "IRU不能只憑新發玻璃體細胞命名。", "recall": {"question": "IRU常用哪個時間線提示？", "answer": "既往CMV病灶加免疫重建後新炎症。"}, "relatedTopics": ["notes-10", "notes-13"], "sourceIds": ["uve-hiv"]}, {"id": "c25", "title": "病毒性前炎：高眼壓與虹膜萎縮", "pages": [3, 33, 43], "unitId": "u2", "sectionIndexes": [7], "terms": ["Viral anterior uveitis", "HSV anterior uveitis", "VZV anterior uveitis", "CMV anterior uveitis", "Trabeculitis"], "keyPoints": ["HSV、VZV及CMV均可呈現單眼反覆前炎，合併小樑炎性高眼壓及虹膜萎縮；角膜感覺、內皮病灶與KP型態可幫助形成病因方向，但仍有重疊。", "宿主可能免疫正常，與CMV retinitis的常見背景不同。由專科評估房水檢測及病原治療，同時控制炎症與眼壓；前後段均須檢查，不能把「多半局限」說成永不合併。"], "clinicalLink": "將藥物時序与病毒線索一起比較，避免把高眼壓一律歸因類固醇。", "pitfall": "樹枝狀角膜潰瘍屬角膜病灶，並非所有前葡萄膜炎的基本徵象。", "recall": {"question": "高眼壓加局部虹膜萎縮提示什麼？", "answer": "病毒性前葡萄膜炎是重要鑑別。"}, "relatedTopics": ["notes-05", "notes-07"], "sourceIds": ["uve-hsv"]}, {"id": "c26", "title": "較少見病毒：旅遊、蚊媒與rubella線索", "pages": [33], "unitId": "u2", "sectionIndexes": [7], "terms": ["West Nile virus", "Chikungunya", "Dengue", "Zika", "Rubella"], "keyPoints": ["西尼羅病毒可有多灶脈絡膜視網膜炎；屈公病可涉及前炎或後段，登革熱可能出現黃斑與血管異常，茲卡可有先天或後天眼部表現。這些名稱的實際用途是提醒旅遊、蚊媒及全身發熱病史。", "德國麻疹與部分Fuchs葡萄膜炎的免疫證據相關；不能將上述病毒全部當同一種可用疱疹抗病毒藥治療的疾病。診斷檢測與處理需依暴露、病程及感染專科判斷。"], "clinicalLink": "遇到發燒後視損，先定位病灶並辨認暴露，再決定病原檢查。", "pitfall": "「發燒在先」只提高感染方向，不是病原名稱。", "recall": {"question": "為何旅遊史會改變葡萄膜炎檢查？", "answer": "它會改變特定蚊媒／地區性感染的檢驗前機率。"}, "relatedTopics": [], "sourceIds": ["uve-video", "uve-classification"]}, {"id": "c27", "title": "眼弓漿蟲：舊疤旁壞死與玻璃體霧", "pages": [13, 33, 43], "unitId": "u2", "sectionIndexes": [7], "terms": ["Ocular toxoplasmosis", "Toxoplasma gondii", "Headlight in the fog"], "keyPoints": ["眼弓漿蟲常呈局部壞死性視網膜炎，鄰近舊色素疤並伴玻璃體混濁，形成「霧中車燈」的描述。先天與後天感染都可能發生，宿主免疫狀態會改變病灶形態與範圍。", "貓科為終宿主，人可因未熟肉類、受污染食水或先天途徑感染；寄生蟲能在人體進行無性增殖，不能照舊稿說人體內完全不繁殖。治療依病灶威脅及宿主决定，類固醇須有適當抗寄生蟲治療保障。"], "clinicalLink": "將病灶是否近黃斑／視神經和免疫狀態，連到治療必要性。", "pitfall": "有養狗或弓漿蟲抗體陽性不能單獨確診活動性眼病。", "recall": {"question": "霧與車燈分別指什麼？", "answer": "玻璃體混濁與局部明亮視網膜炎病灶。"}, "relatedTopics": ["notes-10"], "sourceIds": ["uve-classification", "uve-video", "uve-toxo"]}, {"id": "c28", "title": "眼結核與用藥造成的視神經病變", "pages": [13, 34, 43, 46, 47, 48], "unitId": "u2", "sectionIndexes": [7], "terms": ["Ocular tuberculosis", "Choroidal granuloma", "Serpiginous-like choroiditis", "Ethambutol"], "keyPoints": ["眼結核可涉及多個區域，後段可見脈絡膜肉芽腫、血管炎或蛇行樣脈絡膜炎；沒有活動肺病不能排除。IGRA陽性或胸部影像提供背景，眼內PCR陰性也不能一筆劃掉病因。", "疑似或確認病因後由眼科與感染／胸腔團隊安排多藥抗結核及合適抗炎。Ethambutol可造成視神經毒性，治療中新增色覺、中央視野或視力變化需區別藥毒性與炎症活動。"], "clinicalLink": "療程中視力變差要重做定位，不把所有變差都當結核治療失敗。", "pitfall": "單方類固醇可能惡化未處理感染，但不是有TB便永遠禁用輔助抗炎。", "recall": {"question": "無肺結核影像能排除眼結核嗎？", "answer": "不能，仍需綜合眼部及其他證據。"}, "relatedTopics": ["notes-03", "notes-13"], "sourceIds": ["uve-tb"]}, {"id": "c29", "title": "梅毒、萊姆病與貓抓病的鑑別入口", "pages": [13, 31], "unitId": "u2", "sectionIndexes": [7], "terms": ["Ocular syphilis", "Lyme disease", "Bartonella", "Cat-scratch neuroretinitis", "Macular star"], "keyPoints": ["梅毒可模仿多種葡萄膜炎，任何解剖型態都需依情境考慮並作適當成套血清檢測。萊姆病的眼部炎症需有合理蜱媒與地理暴露，低風險者孤立陽性可能誤導。", "貓抓病的Bartonella神經視網膜炎可見視神經盤水腫與稍後出現的黃斑星芒。星芒是脂質排列的表徵，也見於其他原因，不等於已確定貓抓病。"], "clinicalLink": "問暴露與看盤／黃斑的時間差，比僅列一長串病原更有診斷力。", "pitfall": "抗體陽性、接觸動物或黃斑星芒都不能各自單獨確診。", "recall": {"question": "視神經腫加星芒首先要分哪兩件事？", "answer": "先定位神經視網膜炎，再尋找感染或其他病因。"}, "relatedTopics": ["notes-03", "notes-10"], "sourceIds": ["uve-classification", "uve-video"]}, {"id": "c30", "title": "DUSN與局部白點群：先區分寄生蟲與非感染", "page
