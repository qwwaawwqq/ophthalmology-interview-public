"note": "地圖狀萎縮已有美國核准之減緩病灶擴大的治療；不等於恢復已喪失視力，亦不代表台灣可近性或給付。", "url": "https://www.fda.gov/drugs/drug-trials-snapshots/drug-trials-snapshots-izervay"}, {"id": "E11", "title": "University of Iowa EyeRounds. Retinopathy of Prematurity. 2019; references include the AAP screening policy.", "note": "ROP的zone、stage、plus及type 1判定；本包不以此取代台灣院內篩檢時程。", "url": "https://webeye.ophth.uiowa.edu/eyeforum/cases/286-retinopathy-of-prematurity.htm"}, {"id": "E12", "title": "US CDC. STI Treatment Guidelines: Gonococcal Infections Among Adolescents and Adults; Chlamydial Infections.", "note": "淋菌結膜炎需全身性處理與性傳染病評估；另參考  。", "url": "https://www.cdc.gov/std/treatment-guidelines/chlamydia.htm"}, {"id": "E13", "title": "Marmor et al.; American Academy of Ophthalmology. Special AAO Report: Recommendations on Screening for", "note": "Hydroxychloroquine Retinopathy (2025 Revision). Ophthalmology. 2026;133:439–450. doi:10.1016/j.ophtha.2025.11.001.\n實際體重劑量、風險分層、OCT／廣域FAF、旁中心及周邊中心型偵測、基線與追蹤重點。", "url": "https://pubmed.ncbi.nlm.nih.gov/41232611/"}], "reviewNote": "2026-10-10 針對 CRAO、GCA、HCQ、topiramate 與淋菌結膜炎做定點查核；補強其中 4 處教材敘述。這不是全冊醫學內容的逐條重新驗證。", "originalCoverage": "原始共筆全文、私人附件與個人面試資料不包含在公開版。"}, "originals": [], "enrichment": {"version": 1, "reviewedDate": "2026-10-11", "scope": "公開眼科學習教材：原創概念圖、深入判讀與外部教學資源；不包含私人資料。", "chapters": {"notes-01": {"deepDive": [{"heading": "機轉｜把視覺系統拆成光學、感覺與運動三段", "paragraphs": ["視力表主要測量中央高對比解析能力；瞳孔、色覺、視野與眼球運動回答的是其他問題。病人即使能讀到小字，仍可能有周邊視野缺損或不對稱視神經損傷，因此『視力正常』不能代替完整定位。", "RAPD 比較兩眼傳入訊號的相對強弱。把光由較健眼移到患眼時，雙側瞳孔收縮減弱或相對擴大，提示不對稱視網膜或視神經功能異常；它不是在測量兩側瞳孔的靜態大小差。"], "sourceIds": ["an01-exam", "an01-rapd"]}, {"heading": "推理｜先量化功能，再用眼前節與眼底解釋", "paragraphs": ["模糊視力先分單眼或雙眼、突然或漸進、疼痛或無痛，再記錄每眼原有矯正下的視力及針孔結果。針孔改善支持存在光學因素，但不是排除黃斑或視神經病變的證明；仍須把症狀與瞳孔、視野、裂隙燈及眼底連起來。", "檢查前先記錄瞳孔與 RAPD，以免散瞳後失去基準。裂隙燈依角膜、前房、虹膜、晶狀體循序觀察，眼壓則連同測量方式解讀；報告應包含側別、最佳可得視力、關鍵陽性與關鍵陰性，而不只寫『眼睛正常』。"], "sourceIds": ["an01-exam", "an01-rapd", "an01-record"]}, {"heading": "陷阱｜標準檢查流程有必須立即改道的情境", "paragraphs": ["眼外傷若出現尖峰狀瞳孔、明顯組織脫出、眼球形狀異常等開放性眼球傷疑慮，避免眼壓測量與對眼球加壓；先保護傷眼並緊急眼科評估。Seidel 陰性也不能排除已自行封閉的穿通傷。", "RAPD 是相對檢查，雙眼對稱且嚴重的視神經病變可能沒有 RAPD。相反地，看到白內障也不能立刻用它解釋明顯 RAPD；必須繼續找更後端的病變。"], "sourceIds": ["an01-trauma", "an01-rapd"]}], "oralChallenge": {"question": "病人單眼視力下降，針孔沒有改善，前節只見輕度白內障，卻有明顯 RAPD。你如何整合？", "answer": "輕度白內障不足以合理解釋明顯 RAPD。我會先確認測試與側別，再以色覺、視野及散瞳眼底評估視神經與廣泛視網膜病變；若為突然發作，依血管性或神經眼科急症處理時效安排評估。針孔不改善只能提示單純屈光問題的可能性降低，不能單獨完成定位。", "sourceIds": ["an01-exam", "an01-rapd"]}, "resources": [{"id": "an01-exam", "title": "Basic Eye Exam：完整基本眼科檢查", "url": "https://eyerounds.org/atlas-video/basic-eye-exam.htm", "kind": "影片", "provider": "University of Iowa · EyeRounds", "note": "13 分 52 秒大學教學影片；練習視力、瞳孔及前後節檢查順序。", "verifiedDate": "2026-10-11"}, {"id": "an01-rapd", "title": "Relative Afferent Pupillary Defect：判讀與限制", "url": "https://eyewiki.aao.org/Relative_Afferent_Pupillary_Defect", "kind": "指南", "provider": "AAO · EyeWiki", "note": "專業教學頁，非獨立正式臨床指引；閱讀傳入路徑與雙眼比較的限制。", "verifiedDate": "2026-10-11"}, {"id": "an01-trauma", "title": "眼外傷初步檢查與重要徵象圖譜", "url": "https://www.eyerounds.org/tutorials/trauma.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "含真實臨床照片與影像；重點觀察尖峰瞳孔、Seidel 與開放性眼球傷，年代較早的處方內容不作現行用藥依據。", "verifiedDate": "2026-10-11"}, {"id": "an01-record", "title": "眼科病例記錄：檢查欄位與報告格式", "url": "https://eyerounds.org/tutorials/contributing-to-eyerounds/case_submission_format.htm", "kind": "指南", "provider": "University of Iowa · EyeRounds", "note": "大學病例撰寫指南；對照視力、矯正方式、眼壓、瞳孔與視野的紀錄要素。", "verifiedDate": "2026-10-11"}, {"id": "cov01-oct", "title": "OCT：結構、用途與影像限制", "url": "https://eyewiki.aao.org/Optical_Coherence_Tomography", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照前後節 OCT 的分層、介質混濁與量測限制；不是單張影像診斷工具。", "verifiedDate": "2026-10-11"}, {"id": "cov01-octa", "title": "OCTA：分層血流與常見假象", "url": "https://eyewiki.aao.org/Optical_Coherence_Tomography_Angiography", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對免染劑血流成像、無法顯示直接滲漏及投射／分層假象。", "verifiedDate": "2026-10-11"}, {"id": "cov01-fa", "title": "FA：正常循環與螢光型態", "url": "https://eyewiki.aao.org/Fluorescein_Angiography", "kind": "指南", "provider": "AAO · EyeWiki", "note": "以動態影像區分 leakage、staining、pooling、window defect 及低螢光原因。", "verifiedDate": "2026-10-11"}], "figure": {"type": "exam-pathway", "title": "基本檢查：安全分流與功能定位", "caption": "原創檢查流程示意，非臨床照片。先辨識外傷及急症，再記錄視力與瞳孔，依病情完成前後節評估；疑似眼球破裂時避免眼壓測量及加壓。", "alt": "基本眼科檢查安全流程：先排急症與疑似眼球破裂，再做每眼視力、瞳孔與RAPD、裂隙燈及適當眼底檢查。", "sourceIds": ["an01-exam", "an01-rapd", "an01-trauma"]}, "integrated": {"framing": "把檢查串成三個問題：眼球現在安全嗎、哪一段視覺功能受損、看到的結構足以解釋症狀嗎？每項檢查都應改變定位或下一步，而不只是填完表格。", "objectives": ["依發作時間與外傷線索決定檢查優先順序", "整合視力、RAPD與前後節結果，辨認互相矛盾的證據", "用可重複的客觀資料完成定位與交班"], "units": [{"id": "u1", "title": "先建立功能基準：模糊是光學問題，還是傳入路徑受損？", "sectionIndexes": [0, 1, 4, 9], "deepDiveIndexes": [0], "showFigure": false, "synthesis": ["視力、瞳孔與眼位不是彼此替代的篩檢。視力下降可來自影像沒有聚焦，也可來自視網膜或視神經沒有正常傳訊；因此先保留矯正方式、測試側別與針孔結果，才有辦法解讀後續差異。若針孔後字變清楚，但色覺、視野或RAPD異常，合理結論是可能同時存在兩種問題，而不是選一個結果抹掉另一個。", "口試時可先提出定位假說，再說哪項檢查會改變它。譬如雙眼看有複視、遮住任一眼即消失，會把注意力轉向眼位；單眼仍模糊則繼續評估該眼的光學與感覺路徑。RAPD只告訴你兩眼傳入訊號不對稱，既不直接命名病因，也不保證沒有RAPD的雙眼就都正常。"], "decisions": [{"finding": "針孔改善，但同眼仍有RAPD", "interpretation": "光學因素與傳入功能異常可能並存", "nextStep": "補色覺、視野與眼底定位，不以驗光結束評估"}, {"finding": "瞳孔不等大，擺動手電筒卻無RAPD", "interpretation": "瞳孔大小差與傳入訊號差是不同問題", "nextStep": "分別記錄明暗處瞳孔及反應，評估傳出路徑與藥物因素"}], "sourceIds": ["an01-exam", "an01-rapd", "an01-record"]}, {"id": "u2", "title": "由表面到眼底：用結構解釋功能，而非只列異常", "sectionIndexes": [2, 5, 6, 7, 8, 10], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["裂隙燈看到的『白』要拆成位置與性質：上皮染色、基質浸潤、角膜水腫、前房細胞或晶狀體混濁，對應的機轉與處置不同。先描述可觀察到的層次，再下診斷，能避免把角膜白點直接叫作細菌感染，也避免因為找到常見白內障就過早停止搜尋。", "影像的價值在回答剩下的問題。屈光不規則時看角膜形態，中央變形視時查黃斑，視野缺損時把視乳頭與神經纖維配對。報告一項正常檢查時，也應說它實際檢視的範圍；看得到正常視乳頭，並不表示整段視神經都已被看過，中央影像清楚也不能代替周邊眼底評估。"], "decisions": [{"finding": "前節混濁輕微，視覺功能下降卻明顯", "interpretation": "目前發現不足以解釋全部症狀", "nextStep": "繼續後節及神經眼科定位，記錄不一致之處"}, {"finding": "只有『角膜白點』，未記錄染色與深度", "interpretation": "資訊不足以區分表面缺損、浸潤或疤痕", "nextStep": "補位置、大小、層次、上皮狀態及前房反應"}], "sourceIds": ["an01-exam", "an01-record", "an01-rapd"]}, {"id": "u3", "title": "安全順序與交班：哪些檢查需要暫停？", "sectionIndexes": [3, 11], "deepDiveIndexes": [2], "showFigure": true, "synthesis": ["檢查順序會隨風險改變。高速異物、尖峰瞳孔或組織脫出使開放性眼球傷的可能性升高，此時取得一個眼壓數字的價值，低於接觸或加壓造成的風險。先以硬式眼罩保護並求援，再由專科安排必要評估；傷口很小或暫時不漏水，都不能消除穿通傷的可能。", "交班要把『知道什麼、還不知道什麼、正在避免什麼』分開。例如記錄可安全取得的每眼視力、受傷機轉及疑似破口，同時說明因懷疑眼球開放而未量眼壓。這是有理由的檢查取捨。非外傷情境也一樣：檢查值必須連同方法與時間解讀，不能用單次正常讀值替病程下結論。"], "decisions": [{"finding": "高速金屬傷後Seidel陰性", "interpretation": "仍可能是自行封閉的全層傷口或眼內異物", "nextStep": "保護傷眼、緊急眼科評估；疑金屬異物時避免MRI"}, {"finding": "疑似眼球破裂，眼壓尚未測量", "interpretation": "未測量是安全決策，不是流程遺漏", "nextStep": "停止加壓式檢查，清楚交班原因與已取得資料"}], "sourceIds": ["an01-trauma", "an01-record"]}], "case": {"title": "看得到白內障，是否已找到原因？", "stem": "教學模擬：一位成人因右眼這三天逐漸模糊就診，沒有外傷，自述以前兩眼都看得清楚。", "steps": [{"newInfo": "原眼鏡下右眼6/24、左眼6/6；右眼針孔仍6/24。", "prompt": "你現在能排除屈光問題、直接診斷眼底病嗎？", "answer": "不能。先確認測量可靠度與既往視力，再做瞳孔、色覺、視野及前後節檢查。", "rationale": "針孔未改善降低單純屈光失焦的解釋力，但仍未區分介質、視網膜或視神經。", "sourceIds": ["an01-exam", "an01-record"]}, {"newInfo": "裂隙燈僅見輕度核性混濁；右眼有RAPD，紅色看起來較暗。", "prompt": "哪些證據彼此不相稱？", "answer": "輕度晶狀體混濁不足以解釋這組傳入功能異常；優先評估右側視神經及嚴重視網膜病變。", "rationale": "應讓功能異常引導定位，不能因找到常見混濁就停止評估。", "sourceIds": ["an01-rapd"]}, {"newInfo": "眼底未見廣泛視網膜病灶；視乳頭外觀正常，但中央視野缺損可重複。", "prompt": "請用一句話交班，並說明仍不能確定什麼。", "answer": "右眼亞急性視力與中央視野下降，伴RAPD及色覺異常，前節與可見眼底不足以解釋，需及時神經眼科評估；目前尚未確定視神經病因。", "rationale": "正常視乳頭外觀不能排除更後方的視神經病變；定位與病因確診是不同層次。", "sourceIds": ["an01-rapd", "an01-record"]}]}, "connections": [{"topicId": "notes-03", "reason": "將RAPD、色覺與視野異常接到視路定位。"}, {"topicId": "notes-05", "reason": "把染色、浸潤與外傷安全順序用於紅痛眼。"}, {"topicId": "notes-14", "reason": "依時間與症狀選出最先會改變處置的檢查。"}]}}, "notes-02": {"deepDive": [{"heading": "機轉｜用遠點理解近視、遠視與散光", "paragraphs": ["在調節放鬆時，近視眼把平行光聚焦在視網膜前，遠視眼的焦點則在視網膜後。負鏡片讓入射光先發散，正鏡片增加會聚；處方的正負號因此對應光學需求，不是『看遠或看近』的簡單分類。", "規則散光的兩個主要子午線屈光力不同，因此不能只用單一球面度數完整校正。老花則是調節能力下降，與原本近視、遠視或散光可以同時存在；近視者摘眼鏡後能近讀，不表示調節恢復。"], "sourceIds": ["an02-retinoscopy", "an02-nei"]}, {"heading": "推理｜驗光終點要同時符合視力與調節狀態", "paragraphs": ["客觀驗光提供起點，主觀驗光再確認球面、散光軸度與度數。年輕人可能以調節抵消過多負鏡片，看得一樣清楚卻被過度配成近視；因此驗光不是不斷加負鏡片直到病人說更黑。", "檢影中和後必須扣除工作距離對應的屈光力：例如 67 公分約為 1.50 D，50 公分為 2.00 D。檢影反光不規則、剪刀狀或最佳矯正視力不合理地偏低時，要轉向角膜、晶狀體與其他病變評估。"], "sourceIds": ["an02-retinoscopy", "an02-clinical", "an02-techniques"]}, {"heading": "陷阱｜度數變動不一定只是眼鏡變舊", "paragraphs": ["兒童、疑似假性近視或潛伏性遠視者，散瞳睫狀肌麻痺驗光能協助釐清調節影響。一般自動驗光數字不是最終處方，還須結合年齡、雙眼功能、檢影與主觀反應。", "短期內度數不穩或不規則散光增加時，應檢查眼表、角膜形態與晶狀體，而不是只反覆換鏡。高度近視即使矯正到良好視力，也仍需把屈光矯正與眼底結構評估分開思考。"], "sourceIds": ["an02-retinoscopy", "an02-clinical", "an02-nei"]}], "oralChallenge": {"question": "67 公分檢影在 +2.50 D 球面鏡中和，先忽略散光，工作距離校正後是多少？為什麼？", "answer": "約 +1.00 D。中和時找到的是包含檢查者工作距離的結果，所以要從 +2.50 D 扣掉約 +1.50 D。之後仍須確認調節放鬆與每眼視力，不能把這個計算直接當成所有病人的最終眼鏡處方。", "sourceIds": ["an02-retinoscopy"]}, "resources": [{"id": "an02-retinoscopy", "title": "Objective Refraction Techniques: Retinoscopy", "url": "https://morancore.utah.edu/section-03-clinical-optics/objective-refraction-techniques-retinoscopy/", "kind": "圖譜", "provider": "University of Utah · Moran CORE", "note": "含遠點與順逆動的光路示意圖及檢影影片連結；圖為光學示意，不是患者照片。", "verifiedDate": "2026-10-11"}, {"id": "an02-clinical", "title": "Clinical Refraction：臨床驗光住院醫師課程", "url": "https://morancore.utah.edu/section-03-clinical-optics/clinical-refraction-2017/", "kind": "影片", "provider": "University of Utah · Moran CORE", "note": "David Meyer 主講，涵蓋檢影、主觀驗光、交叉圓柱鏡與調節。", "verifiedDate": "2026-10-11"}, {"id": "an02-techniques", "title": "Optics and Refraction Techniques：分步操作影片", "url": "https://www.eyerounds.org/video/Refraction/index.htm", "kind": "影片", "provider": "University of Iowa · EyeRounds", "note": "可依需求開啟主觀驗光、檢影、視力與對比敏感度的個別教學。", "verifiedDate": "2026-10-11"}, {"id": "an02-nei", "title": "Refractive Errors：屈光異常的基本概念", "url": "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/refractive-errors", "kind": "指南", "provider": "NIH · National Eye Institute", "note": "官方衛教頁；適合練習把光學機轉轉成病人聽得懂的說明。", "verifiedDate": "2026-10-11"}, {"id": "an02-lasik-risk", "title": "LASIK風險：矯正屈光與眼底風險須分開", "url": "https://eyewiki.org/LASIK_Complications", "kind": "指南", "provider": "AAO · EyeWiki", "note": "教學綜述；聚焦術前評估與高度近視原有眼底風險，勿把個別研究數值當成所有術式的固定風險。", "verifiedDate": "2026-10-11"}, {"id": "cov02-optics", "title": "Clinical Optics：光線、透鏡、屈光與接觸鏡課程", "url": "https://morancore.utah.edu/section-03-clinical-optics/", "kind": "指南", "provider": "University of Utah · Moran CORE", "note": "大學光學教學索引，按幾何光學、光性質、屈光狀態與鏡片主題延伸。", "verifiedDate": "2026-10-11"}, {"id": "cov02-prism", "title": "Prism：光偏折、影像方向與臨床使用", "url": "https://morancore.utah.edu/section-03-clinical-optics/prism/", "kind": "指南", "provider": "University of Utah · Moran CORE", "note": "以圖示核對基底／頂端方向及雙眼視覺用途。", "verifiedDate": "2026-10-11"}, {"id": "cov02-wavefront", "title": "Wavefront Testing：低階與高階像差", "url": "https://eyewiki.aao.org/Wavefront_Testing", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照 Zernike 模式、球柱鏡不足以描述的像差與量測限制。", "verifiedDate": "2026-10-11"}, {"id": "cov02-laser", "title": "Lasers：光凝、光切削與光破裂", "url": "https://eyewiki.aao.org/Lasers_%28surgery%29", "kind": "指南", "provider": "AAO · EyeWiki", "note": "雷射組織交互作用與眼科用途；依具體術式及條件判讀。", "verifiedDate": "2026-10-11"}, {"id": "cov02-aniseikonia", "title": "Aniseikonia：光學與視網膜性影像大小差", "url": "https://eyewiki.aao.org/Aniseikonia", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對 Knapp 模型限制及接觸鏡不能完全解決的情境。", "verifiedDate": "2026-10-11"}, {"id": "cov02-contacts", "title": "Contact Lenses：材料、透氧與臨床配適", "url": "https://eyewiki.aao.org/Contact_Lenses", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照 Dk／t、軟硬式材料、驗配與併發症；不以材料名稱保證安全。", "verifiedDate": "2026-10-11"}, {"id": "cov02-blue", "title": "藍光與螢幕：證據與眼疲勞", "url": "https://aao.org/eye-health/tips-prevention/should-you-be-worried-about-blue-light", "kind": "指南", "provider": "American Academy of Ophthalmology", "note": "AAO 官方說明：區分數位眼疲勞、藍光鏡片宣稱與戶外保護。", "verifiedDate": "2026-10-11"}, {"id": "cov02-smile", "title": "SMILE／KLEx：透鏡取出、神經與術後乾眼", "url": "https://eyewiki.aao.org/Small_Incision_Lenticule_Extraction_%28SMILE%29", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對手術機轉與仍可能存在的乾眼；個別核准範圍依所在地規範。", "verifiedDate": "2026-10-11"}, {"id": "cov02-fda", "title": "LASIK 術前：哪些狀況需審慎評估", "url": "https://www.fda.gov/medical-devices/lasik/when-lasik-not-me", "kind": "指南", "provider": "U.S. Food and Drug Administration", "note": "FDA 官方資料，包含角膜、乾眼、瞳孔與既往手術的風險評估。", "verifiedDate": "2026-10-11"}], "figure": {"type": "refraction", "title": "平行光的焦點落在哪裡？", "caption": "原創光學概念示意，非依比例的眼球解剖圖。比較正視、近視與遠視；近視焦點在視網膜前，遠視在後，均假設調節放鬆。", "alt": "三組入射平行光：正視聚焦於視網膜、近視聚焦在視網膜前、遠視聚焦在視網膜後。", "sourceIds": ["an02-retinoscopy", "an02-nei"]}, "integrated": {"framing": "先判斷焦點如何形成，再判斷量測是否受到調節干擾，最後才選眼鏡、接觸鏡或手術。光學計算的答案必須放回真實眼球與病人的使用情境。", "objectives": ["用焦點、遠點與調節解釋處方的正負號", "辨認工作距離與調節造成的驗光偏差", "把矯正視力與眼球健康、術式風險分別評估"], "units": [{"id": "u1", "title": "從焦點到症狀：相同模糊，未必需要相同鏡片", "sectionIndexes": [2, 5, 6, 7], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["看懂屈光圖時，先固定『調節放鬆、看遠方』這兩個條件，否則焦點位置會隨睫狀肌活動改變。遠視者能用調節暫時把影像拉回視網膜，所以看遠清楚不等於沒有遠視；近視者摘鏡看近則是利用原有遠點，不是讓老化的調節能力恢復。症狀、度數與年齡必須一起解讀。", "遠點及近點公式是檢查直覺的工具，不是所有閱讀表現的完整模型。以未矯正−2 D、調節幅度4 D為例，遠點約50 cm、近點約17 cm；戴上足矯遠用鏡後，計算條件已改變，不能仍套原本未矯正近點。每次計算都先說清楚有無戴鏡、調節狀態及忽略哪些距離。"], "decisions": [{"finding": "中年近視者摘下眼鏡反而能看近", "interpretation": "近視遠點減少近用所需調節，不代表沒有老花", "nextStep": "分別評估遠用矯正與實際閱讀距離需求"}, {"finding": "兒童遠視但遠視力尚佳", "interpretation": "可能正以調節補償，視力表不能代表完整屈光狀態", "nextStep": "結合睫狀肌麻痺驗光、眼位與雙眼視覺評估"}], "sourceIds": ["an02-nei", "an02-retinoscopy", "an02-techniques"]}, {"id": "u2", "title": "從量測到處方：先問數字是怎麼來的", "sectionIndexes": [4, 8, 9], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["檢影中和是把受測眼的遠點與檢查者所在位置連起來，因此有限工作距離必須扣除。扣除67 cm約1.50 D是在修正測量幾何，不是在治療遠視；散光兩個主子午線都受同一工作距離影響。若距離漂移、受測者改看近方光源或調節不穩，算式本身正確也無法挽救不可靠的輸入。", "主觀驗光要找可重複、與視力及使用需求一致的終點。更多負鏡可能讓字變小、變黑，也可能驅動年輕人再調節，不能把每次『更清楚』都當成更準確。若最佳球柱鏡仍解釋不了重影或視覺品質，就重新檢查眼表、角膜規則性及晶狀體；把問題全塞進一個球面度數會丟掉關鍵資訊。"], "decisions": [{"finding": "67 cm檢影以+2.50 D中和，尚未扣工作距離", "interpretation": "原始中和度數含約+1.50 D的幾何補償", "nextStep": "球面結果約+1.00 D，再核對調節及主觀反應"}, {"finding": "反覆加負鏡但最佳視力不再改善", "interpretation": "可能已過度矯正，或問題不只是規則屈光異常", "nextStep": "回到客觀驗光與最少負鏡終點，評估未改善的原因"}], "sourceIds": ["an02-retinoscopy", "an02-clinical", "an02-techniques"]}, {"id": "u3", "title": "從矯正到介入：改變光學，不等於改變所有疾病風險", "sectionIndexes": [0, 1, 3, 10, 11], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["選矯正方式要先知道自己正在改變哪個構造。眼鏡與接觸鏡改變入射光，角膜手術改變角膜形態，晶狀體手術改變眼內光學元件；它們可以改善失焦，卻不能據此推論視網膜或視神經也恢復健康。高度近視者即使術後不再需要厚眼鏡，仍要保留原有眼球結構與眼底病史。", "把雷射名稱、波長與用途連回組織作用，再討論適應情境，會比背品牌更可靠。臨床上先確認度數是否穩定、眼表是否讓測量失真、角膜是否規則，以及期待能否達成；若輸入資料不可靠，換一種更昂貴的介入也不會使決策自動變正確。處方與手術都應從症狀來源的確認開始。"], "decisions": [{"finding": "換鏡仍有重影，散光形態不規則", "interpretation": "可能超出一般球柱鏡可完整校正的範圍", "nextStep": "檢查角膜及晶狀體，釐清原因後再談矯正方式"}, {"finding": "高度近視矯正後視力很好", "interpretation": "表示此次中央解析能力良好，未證明眼底無病", "nextStep": "把矯正需求與適當散瞳眼底評估分別安排"}], "sourceIds": ["an02-nei", "an02-clinical", "an02-techniques", "an02-lasik-risk"]}], "case": {"title": "每次量到的度數都不一樣", "stem": "教學模擬：16歲學生長時間近讀後看遠模糊，外院自動驗光曾得到雙眼約−1.50 D，尚未配新眼鏡。", "steps": [{"newInfo": "不同次測量差異大；兩眼視力可改善，沒有固定的單眼視力落差。", "prompt": "會直接照自動驗光配鏡嗎？", "answer": "先確認視力與眼部檢查，控制注視距離及調節，做客觀檢影與主觀驗光；必要時睫狀肌麻痺驗光。", "rationale": "年輕人的調節可能改變測得度數，自動驗光只是起點。", "sourceIds": ["an02-retinoscopy", "an02-clinical"]}, {"newInfo": "看遠方目標時，67 cm檢影約在+2.50 D球面中和；結果仍略有波動。", "prompt": "工作距離校正後是多少？你對這個結果有多大把握？", "answer": "約+1.00 D，但仍要保留調節未完全放鬆的可能，不能把它當作最終處方。", "rationale": "幾何校正只處理工作距離，不會消除生理性的調節變動。", "sourceIds": ["an02-retinoscopy"]}, {"newInfo": "適當睫狀肌麻痺後約+2.00 D，前後節無可解釋症狀的病變。", "prompt": "如何向學生解釋前後數字相反？", "answer": "先前負度數很可能受到調節影響；放鬆後顯示遠視成分。待藥效與症狀評估完整，結合雙眼功能決定處方，而非把所有數字平均。", "rationale": "不同調節狀態測的是不同條件；釐清差異比機械選最大或最小度數更重要。", "sourceIds": ["an02-retinoscopy", "an02-nei", "an02-clinical"]}]}, "connections": [{"topicId": "notes-04", "reason": "調節與屈光參差會影響眼位及兒童視覺發育。"}, {"topicId": "notes-05", "reason": "不規則散光須回到角膜形態與眼表判讀。"}, {"topicId": "notes-06", "reason": "晶狀體變化可造成度數改變，手術選擇也依賴可靠光學測量。"}]}}, "notes-03": {"deepDive": [{"heading": "先畫出視野，再定位病灶", "paragraphs": ["視野與視網膜的位置相反：顳側視野落在鼻側視網膜，鼻側視網膜纖維於視交叉交叉。單眼視野異常通常先找視交叉前病變；雙顳側缺損優先考慮視交叉；同向偏盲則定位至對側視交叉後路徑。", "判讀前先看固視、假陽性、屈光矯正與眼瞼遮擋。缺損沿垂直中線分界支持視交叉或後方病變；沿水平中線分界較符合視網膜神經纖維束分布。圖形只提供定位線索，必須與病程、眼底及影像對照。"], "sourceIds": ["n03-field"]}, {"heading": "RAPD 是兩眼傳入訊號的比較", "paragraphs": ["擺動手電筒從較健側移到患側時，若雙側瞳孔反而相對擴大，表示患側傳入訊號較弱；常見於不對稱視神經病變，也可見於廣泛不對稱視網膜病變。這與單純瞳孔大小不等不同，不能把 RAPD 直接當成第三神經麻痺。", "檢查時讓病人注視遠方、兩眼照光時間相近，避免近反射及不等照光造成誤判。雙側對稱視神經病變可能沒有 RAPD；視力仍達 20/20 也不能排除視神經炎。時間軸很重要：突然視力下降合併 RAPD 須緊急找血管或壓迫等原因。"], "sourceIds": ["n03-rapd", "n03-rapd-video"]}, {"heading": "第三神經麻痺：先排除壓迫，再談微血管病變", "paragraphs": ["第三神經支配多條眼外肌、提上瞼肌與瞳孔副交感功能。完整麻痺可出現眼瞼下垂、眼球偏向外下方；但部分麻痺不一定具有完整典型表現，應逐一記錄各方向眼球運動與瞳孔反應。", "新發麻痺合併瞳孔散大、頭痛或疼痛，是須緊急排除顱內動脈瘤的警訊，應即刻升級評估與血管影像。瞳孔保留或有糖尿病，不能單獨證明是良性微血管麻痺；需依完整檢查安排及時神經影像。"], "sourceIds": ["n03-third"]}], "oralChallenge": {"question": "糖尿病患者突然出現單側眼瞼下垂與複視，瞳孔目前等大；可以直接當作微血管性第三神經麻痺追蹤嗎？", "answer": "不可以只憑糖尿病與瞳孔保留就下結論。先確認是否為第三神經分布的眼球運動障礙、是否部分或完整麻痺，以及頭痛、疼痛與其他神經徵象，及時安排神經與血管影像評估。若合併瞳孔散大或疑似壓迫，立即急診處理以排除動脈瘤。", "sourceIds": ["n03-third"]}, "resources": [{"id": "n03-field", "title": "視野圖譜與判讀步驟", "url": "https://eyerounds.org/tutorials/VF-testing/index.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "對照神經纖維束、常見視野缺損與 Humphrey 報表；先看可靠度再定位。", "verifiedDate": "2026-10-11"}, {"id": "n03-rapd", "title": "RAPD：檢查原理與病因定位", "url": "https://morancore.utah.edu/basic-ophthalmology-review/relative-afferent-pupillary-defect-rapd/", "kind": "指南", "provider": "University of Utah · Moran CORE", "note": "教學文章附影片；釐清不對稱傳入訊號與臨床時間軸。", "verifiedDate": "2026-10-11"}, {"id": "n03-rapd-video", "title": "如何量測 RAPD", "url": "https://morancore.utah.edu/section-05-neuro-ophthalmology/how-to-measure-the-rapd/", "kind": "影片", "provider": "University of Utah · Moran CORE", "note": "Kathleen Digre 示範擺動手電筒與中性密度濾片量測。", "verifiedDate": "2026-10-11"}, {"id": "n03-third", "title": "後天性第三神經麻痺", "url": "https://eyewiki.aao.org/Acquired_Oculomotor_Nerve_Palsy", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "鑑別壓迫與缺血病因，複習何時需要急診及血管影像。", "verifiedDate": "2026-10-11"}, {"id": "n03-horner-integrated", "title": "Horner與頸動脈剝離：從瞳孔到血管定位", "url": "https://www.eyerounds.org/cases/305-Horner_Syndrome.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "2020教學病例；對照明暗瞳孔、交感路徑與頸動脈影像，理解早期藥物試驗的限制。", "verifiedDate": "2026-10-11"}, {"id": "n03-adie-coverage", "title": "Adie 瞳孔：光近分離、藥物試驗與預後", "url": "https://eyewiki.aao.org/Adie_Pupil", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "更正調節完全不受影響、一定短期自癒及稀釋試驗專一性的過度簡化。", "verifiedDate": "2026-10-11"}, {"id": "n03-ton-coverage", "title": "創傷性視神經病變：治療證據與限制", "url": "https://eyewiki.aao.org/Traumatic_Optic_Neuropathy", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "區分需要立即處理的壓迫性急症與間接性 TON；不把高劑量類固醇當常規。", "verifiedDate": "2026-10-11"}, {"id": "n03-on-coverage", "title": "脫髓鞘視神經炎：典型表現與非典型鑑別", "url": "https://eyewiki.aao.org/Demyelinating_Optic_Neuritis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "視神經炎表型、MS、NMOSD 與 MOGAD 的鑑別架構。", "verifiedDate": "2026-10-11"}, {"id": "n03-papilledema-coverage", "title": "Papilledema 與假性視乳頭水腫", "url": "https://eyewiki.aao.org/Papilledema", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "顱內壓相關視乳頭水腫的評估及替代診斷。", "verifiedDate": "2026-10-11"}, {"id": "n03-neuroretinitis-coverage", "title": "Neuroretinitis：視盤水腫與黃斑星芒", "url": "https://eyewiki.org/Neuroretinitis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "黃斑星芒可延後出現，依病史搜尋感染及其他病因。", "verifiedDate": "2026-10-11"}, {"id": "n03-perineuritis-coverage", "title": "Optic perineuritis：視神經鞘發炎", "url": "https://eyewiki.aao.org/Optic_Perineuritis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "影像定位與全身病因搜尋。", "verifiedDate": "2026-10-11"}, {"id": "n03-naion-coverage", "title": "NAION 與 PION：缺血位置和診斷", "url": "https://eyewiki.aao.org/Non-Arteritic_Anterior_Ischemic_Optic_Neuropathy_%28NAION%29", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "視盤擁擠、前後部缺血與臨床處理限制。", "verifiedDate": "2026-10-11"}, {"id": "n03-gca-coverage", "title": "GCA：不能延誤的視力威脅", "url": "https://eyewiki.aao.org/Giant_Cell_Arteritis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "AAION 的全身線索、及時類固醇治療與確診安排。", "verifiedDate": "2026-10-11"}, {"id": "n03-ino-coverage", "title": "INO 與水平凝視迴路", "url": "https://eyewiki.aao.org/Internuclear_Ophthalmoplegia", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "MLF、VI 核、PPRF 及 one-and-a-half 的動作定位。", "verifiedDate": "2026-10-11"}, {"id": "n03-skew-coverage", "title": "Skew deviation 的前庭眼動定位", "url": "https://eyewiki.aao.org/Skew_Deviation", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "以中樞病變為主，亦有周邊前庭原因；與第四神經麻痺鑑別。", "verifiedDate": "2026-10-11"}], "figure": {"type": "visual-field-patterns", "title": "單眼、雙顳側與同向視野缺損", "caption": "原創視野模式圖：單眼缺損先找視交叉前病變，雙顳側缺損考慮視交叉，單側視交叉後病變可造成對側同向缺損；圖形仍須配合病程與完整檢查。", "alt": "三組左右眼視野圓形依序示範單眼缺損、雙顳側缺損、同向半側缺損，並列出相對應的病變定位。", "sourceIds": ["n03-field"]}, "integrated": {"framing": "把看不清、看不到與看成兩個分開，再用視野、傳入反應與眼球運動互相驗證；定位的目的，是選對下一個檢查並辨認不能等待的病因。", "objectives": ["以缺損所在的視覺空間推導病灶，而非由眼別猜腦側。", "區分傳入不對稱、瞳孔傳出障礙與眼球運動障礙。", "遇到急性下垂或複視，能解釋哪些陰性徵象不足以排除急症。"], "units": [{"id": "u1", "title": "從視功能到視路：形狀與病程要一起讀", "sectionIndexes": [0, 1, 2, 3, 4], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["先把病人說的『右邊看不到』拆成右眼受影響，或雙眼共同看不到右側空間。前者與後者的解剖意義不同；分眼測量後，把左右眼視野並排，才能辨認是否跨越兩眼但屬於同一半側空間。視力表只抽樣中央解析力，不能用讀得到小字推翻已確認的半側視野缺損。", "視野圖先回答病灶可能在哪裡，時間軸再改變病因排序。判讀要先排除眼瞼遮擋、屈光及固視問題，再核對色覺、瞳孔與眼底；若證據不一致，應說明需要補哪項資料。正常眼底只代表目前沒有可見的視乳頭或視網膜變化，並不直接證明整段視路正常。"], "decisions": [{"finding": "兩眼同一側空間缺損，中央視力仍佳", "interpretation": "中央解析力與周邊視野測的是不同功能；考慮對側交叉後路徑。", "nextStep": "先確認視野可靠度，再依起病及神經徵象安排相應影像評估。"}, {"finding": "上方缺損同時伴明顯上瞼下垂", "interpretation": "可能存在遮蔽造成的測量偏差，也可能有真正視路病變。", "nextStep": "控制眼瞼遮擋後重測，避免直接用單張灰階圖定病灶。"}], "sourceIds": ["n03-field", "n03-rapd"]}, {"id": "u2", "title": "從複視到運動通路：觀察一組肌肉而非一個眼位", "sectionIndexes": [5, 6, 7, 8], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["眼球運動受限是終點表現，可能來自神經訊號、神經肌肉接點，或機械限制。讀九方向眼位時，應問哪些動作共同受損，是否符合單一神經分布，以及有無下垂或瞳孔異常作為旁證；不能只因內轉差，就把所有病人都命名為第三神經麻痺。", "把『支持哪個定位』與『排除了哪些危險原因』分成兩句回答。糖尿病使微血管病因合理，卻沒有把動脈瘤的可能性變成零；部分性第三神經麻痺尤其不能靠瞳孔保留解除警報。急性頭痛、進展與神經伴隨徵象會決定評估速度，而不是等典型外下偏全部出現才處理。"], "decisions": [{"finding": "急發下垂、內轉及垂直運動受損，但瞳孔等大", "interpretation": "可能為部分第三神經麻痺；瞳孔保留不能完成病因排除。", "nextStep": "及時神經／血管影像與專科評估；有頭痛或進展時立即升級。"}, {"finding": "眼球受限的組合無法由一條周邊神經解釋", "interpretation": "需要重新考慮核間、神經肌肉或眼眶來源。", "nextStep": "補查兩眼協同動作、疲勞變化、突眼及其他神經徵象。"}], "sourceIds": ["n03-third"]}, {"id": "u3", "title": "瞳孔是交叉驗證：傳入、傳出與急迫性", "sectionIndexes": [9, 10, 11], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["RAPD問兩眼送入中樞的光訊號是否對稱，anisocoria問兩個瞳孔的輸出大小是否相同。若某眼瞳孔本身無法動，仍可觀察另一眼在交替照光下的反應，避免把傳出障礙誤讀為傳入損傷；反之，兩眼大小完全相同也可能有明顯RAPD。", "大小不等先比較亮處與暗處：亮處差異增大時，較大瞳孔的縮瞳機制值得追查；暗處增大時，較小瞳孔的擴瞳機制值得追查，但仍有生理性差異等例外。急性疼痛合併縮瞳、輕度下垂時，解剖路徑把問題連到頸動脈；沒有無汗或早期藥物試驗陰性，都不能讓血管評估延後。"], "decisions": [{"finding": "雙眼視功能都下降，但未測得RAPD", "interpretation": "RAPD是相對比較；對稱損傷可能呈陰性。", "nextStep": "依視力、色覺、視野與眼底繼續定位，不把陰性當作視神經正常。"}, {"finding": "新發痛性縮瞳與輕度下垂，沒有無汗", "interpretation": "仍需考慮節後Horner及內頸動脈剝離。", "nextStep": "立即安排神經血管評估，不等藥物確認才啟動。"}], "sourceIds": ["n03-rapd", "n03-horner-integrated"]}], "case": {"title": "等大的瞳孔能讓人放心嗎？", "stem": "58歲病人今天出現右上瞼下垂與頭痛，有糖尿病病史；抬起眼瞼後抱怨看成兩個。以下為虛構教學病例。", "steps": [{"newInfo": "遮住任一眼後複視消失；視力接近原有水準。", "prompt": "先回答哪一類功能出了問題？還要量什麼？", "answer": "支持雙眼對位問題，立即記錄各方向運動、瞳孔、視力及神經徵象，不能只按視力良好降級。", "rationale": "眼位控制與中央解析力不同；下垂加急性頭痛需要迅速定位。", "sourceIds": ["n03-third"]}, {"newInfo": "右眼內轉、上轉及下轉減弱，兩側瞳孔目前等大且有反應。", "prompt": "如何定位？糖尿病能否決定直接追蹤？", "answer": "符合右側第三神經分布受損，立即安排神經與血管影像評估；微血管性是鑑別，不能直接結案。", "rationale": "不完整麻痺與瞳孔保留仍不能排除壓迫病因，且此例已有急性頭痛。", "sourceIds": ["n03-third"]}, {"newInfo": "在急診安排檢查期間，右側瞳孔逐漸比左側大。", "prompt": "新資訊改變什麼？若沒變大，又如何？", "answer": "進展更提高壓迫性病因的疑慮，立即通知團隊並加速處理；即使未散大，前一步的緊急評估仍必要。", "rationale": "不能把危險徵象尚未出現，錯當成危險病因已排除。", "sourceIds": ["n03-third"]}]}, "connections": [{"topicId": "notes-04", "reason": "以遮蓋試驗確認對位問題，再由運動型態定位。"}, {"topicId": "notes-08", "reason": "複視合併突眼或視神經受損時，將定位延伸到眼眶。"}, {"topicId": "notes-11", "reason": "下垂的量測須與瞳孔、眼球運動及時間軸一起解讀。"}]}}, "notes-04": {"deepDive": [{"heading": "弱視的問題在視覺發育，斜視的問題在眼位", "paragraphs": ["弱視源自兒童期不良視覺輸入，使視覺發育受阻；屈光不正、兩眼屈光差異、斜視抑制與視軸遮蔽都可能造成。外觀端正的眼睛也可能弱視；遮蔽型如白內障或嚴重眼瞼下垂，尤其需要及早發現。", "治療先處理造成模糊或遮蔽的原因，提供合適眼鏡，再依視力反應安排遮眼或藥物抑制較佳眼。眼肌手術主要改善眼位，不能保證已形成的弱視消失；評估成效要分開記錄單眼視力與雙眼排列。"], "sourceIds": ["n04-amblyopia", "n04-info-video"]}, {"heading": "Cover test 的關鍵：你正在看哪一眼？", "paragraphs": ["單眼遮蓋時，觀察未被遮住的眼是否重新固視；若它向外移動才對準目標，原本是內斜，向內移動則原本是外斜。雙眼都要測，因為遮到非優勢眼時，優勢固視眼可能完全不動。", "解除遮蓋時再看原本被遮住的眼，可找出融合中斷後的隱斜。交替遮蓋持續打斷融合，量到的是總偏斜，不能直接當作平常可見的顯斜角；因此先做單眼遮蓋，再做交替遮蓋，並註明遠近距離與眼鏡矯正狀態。"], "sourceIds": ["n04-cover"]}, {"heading": "超過七歲仍值得治療，但不能保證正常視力", "paragraphs": ["PEDIG 的 507 人隨機試驗顯示，7–12 歲兒童在最佳光學矯正外加主動治療，24 週改善至少兩行的比例為 53%，單純光學矯正為 25%。這支持不要因入學年齡就放棄弱視治療。", "13–17 歲整體組間差異不顯著，過去未治療者的次群體較可能受益；多數改善者仍有殘餘視力差。因此回答療效時應交代年齡、既往治療及依從性，避免把『可能改善』說成一定恢復，也不要把試驗中的組合處方當成所有人的固定療程。"], "sourceIds": ["n04-pedig"]}], "oralChallenge": {"question": "家長問：孩子七歲、左眼弱視又內斜，只要把眼位開正就會看清楚嗎？", "answer": "眼位與單眼視力是兩個治療目標。先完成視力、屈光及眼部檢查，矯正模糊影像並依需要安排弱視治療；是否手術取決於矯正後眼位等因素。七歲仍有改善空間，但手術本身不能取代視覺發育治療，也不能保證視力完全恢復。", "sourceIds": ["n04-amblyopia", "n04-pedig"]}, "resources": [{"id": "n04-amblyopia", "title": "弱視的成因、圖解與治療", "url": "https://www.aapos.org/glossary/amblyopia", "kind": "圖譜", "provider": "AAPOS", "note": "含視覺發育與遮眼圖示；適合練習向家長說明弱視。", "verifiedDate": "2026-10-11"}, {"id": "n04-cover", "title": "基本 Cover test 示範與逐字稿", "url": "https://eyerounds.org/video/basic-cover-test.htm", "kind": "影片", "provider": "University of Iowa · EyeRounds", "note": "逐步區分 tropia、phoria 及交替遮蓋，搭配稜鏡中和說明。", "verifiedDate": "2026-10-11"}, {"id": "n04-pedig", "title": "PEDIG：7–17 歲弱視治療隨機試驗", "url": "https://jamanetwork.com/journals/jamaophthalmology/fullarticle/416964", "kind": "期刊", "provider": "Archives of Ophthalmology · PEDIG", "note": "2005 原始 RCT；比較最佳光學矯正與加用主動治療。期刊全文可能需機構權限。", "verifiedDate": "2026-10-11"}, {"id": "n04-info-video", "title": "AAPOS 弱視與斜視衛教影片", "url": "https://aapos.org/patient/patient-resources/info-videos", "kind": "影片", "provider": "AAPOS", "note": "包含 Amblyopia、Strabismus 與 Strabismus Surgery，適合練習衛教語言。", "verifiedDate": "2026-10-11"}, {"id": "n04-accommodative-integrated", "title": "調節性內斜：眼鏡與手術各自改變什麼", "url": "https://www.aapos.org/glossary/accommodative-esotropia", "kind": "指南", "provider": "AAPOS", "note": "理解遠視矯正、戴鏡殘餘內斜及為何手術後仍可能需要眼鏡。", "verifiedDate": "2026-10-11"}, {"id": "n04-brown-coverage", "title": "Brown syndrome 的限制型眼球運動", "url": "https://www.aapos.org/glossary/brown-syndrome", "kind": "指南", "provider": "AAPOS", "note": "圖解內轉位上轉受限，依第一眼位、頭位與雙眼視決定處理。", "verifiedDate": "2026-10-11"}, {"id": "n04-duane-coverage", "title": "Duane syndrome：後縮與共同收縮", "url": "https://www.aapos.org/glossary/duane-syndrome", "kind": "指南", "provider": "AAPOS", "note": "先天性外轉異常與眼球後縮的解釋。", "verifiedDate": "2026-10-11"}, {"id": "n04-moebius-coverage", "title": "Möbius syndrome：VI 與 VII 的先天異常", "url": "https://eyewiki.aao.org/M%C3%B6bius_Syndrome", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "外轉障礙與顏面無力、閉合不全的跨系統關係。", "verifiedDate": "2026-10-11"}, {"id": "n04-cfeom-coverage", "title": "CFEOM：先天眼外肌纖維化概述", "url": "https://www.ncbi.nlm.nih.gov/books/NBK1348/", "kind": "指南", "provider": "GeneReviews · University of Washington", "note": "先天顱神經支配異常與遺傳評估的專家綜述。", "verifiedDate": "2026-10-11"}, {"id": "n04-oma-coverage", "title": "Oculomotor apraxia：掃視啟動與頭部代償", "url": "https://www.aapos.org/glossary/oculomotor-apraxia", "kind": "指南", "provider": "AAPOS", "note": "2026 更新；眼動啟動障礙與發展追蹤。", "verifiedDate": "2026-10-11"}, {"id": "n04-som-coverage", "title": "Superior oblique myokymia：單眼影像晃動", "url": "https://eyewiki.aao.org/Superior_Oblique_Myokymia", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "區分上斜肌微顫與一般眼皮跳。", "verifiedDate": "2026-10-11"}, {"id": "n04-floor-coverage", "title": "眶底骨折與夾困急症", "url": "https://eyewiki.aao.org/Orbital_Floor_Fractures", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "運動受限、眼心反射與需緊急處理的夾困。", "verifiedDate": "2026-10-11"}], "figure": {"type": "cover-test", "title": "單眼遮蓋與交替遮蓋，看的是不同問題", "caption": "原創檢查對照：遮蓋時觀察未遮眼重新固視，去遮時再觀察原遮眼；交替遮蓋中斷融合，顯示總偏斜。判讀應區分重固視的方向與原本偏斜方向。", "alt": "兩組流程方塊比較 cover–uncover 與 alternate cover，說明各階段觀察哪一眼，以及顯斜、隱斜和總偏斜的關係。", "sourceIds": ["n04-cover"]}, "integrated": {"framing": "以清楚影像、單眼發育、雙眼對位三條線追蹤同一個孩子：一項改善，不代表其他兩項已完成。", "objectives": ["能用視覺輸入與抑制解釋弱視，而不只背視力差。", "說清楚遮蓋的眼、觀察的眼及重新固視方向。", "區分眼鏡、弱視治療與斜視手術各自改變的機轉。"], "units": [{"id": "u1", "title": "先讓影像清楚，再談大腦如何使用它", "sectionIndexes": [0, 1, 2, 4], "deepDiveIndexes": [0], "showFigure": false, "synthesis": ["兒童視覺系統是在使用影像的過程中發育；屈光模糊、遮蔽與持續影像衝突，會使某眼輸入長期不被有效利用。雙眼睜開時表現正常，可能只是較好眼代償，因此評估必須分眼，並用適齡且前後一致的方法追蹤，不能從是否撞到東西推算單眼視力。", "眼鏡改善輸入品質，遮蓋或藥物懲罰改變兩眼使用的機會，兩者處理的環節不同。治療反應不佳時先核對是否真正配戴、能否偷看及測量一致性，再重新檢查器質病與診斷；將所有停滯都歸因『孩子不努力』既不能解釋機轉，也找不到可調整的原因。"], "decisions": [{"finding": "眼位看似端正，但單眼最佳矯正視力較差", "interpretation": "外觀不能排除屈光性弱視，仍須排除器質病。", "nextStep": "完成睫狀肌麻痺驗光與完整眼部檢查，建立單眼視力基準。"}, {"finding": "戴鏡後仍有視力差距", "interpretation": "清楚的光學輸入未必已恢復全部視覺發育。", "nextStep": "依光學治療反應及依從性評估是否加用弱視治療，持續監測兩眼。"}], "sourceIds": ["n04-amblyopia", "n04-info-video"]}, {"id": "u2", "title": "把眼位測量變成可重現的實驗", "sectionIndexes": [3, 5, 6, 10], "deepDiveIndexes": [1], "showFigure": true, "synthesis": ["遮蓋試驗可視為主動改變融合條件的實驗：先觀察自然雙眼狀態，再遮一眼看另一眼是否需要接管固視，最後以交替遮蓋持續中斷融合。若一開始便交替遮蓋，會失去平常是否存在顯斜的資訊；測量順序因此是推理的一部分。", "眼向外轉才能重新對準目標，表示測量前眼位在內側，不是『看到外轉就診斷外斜』。每次都記錄目標遠近、戴鏡狀態、注視方向與配合度，才能比較兩次角度差異是否真為病情改變。角度回答偏多少，運動型態與先天病史則回答為何偏，不能互相取代。"], "decisions": [{"finding": "遮左眼時，未遮的右眼向外重新固視", "interpretation": "右眼原本處於內斜位置。", "nextStep": "左右都測，記錄遠近及矯正狀態，再用稜鏡量化。"}, {"finding": "單眼遮蓋未見顯斜，交替遮蓋才有偏移", "interpretation": "融合被打斷後才暴露偏斜，不能直接當平常顯斜角。", "nextStep": "結合症狀與融合控制能力解讀，而非只報一個角度。"}], "sourceIds": ["n04-cover"]}, {"id": "u3", "title": "治療決策分三條線：視力、眼位與雙眼視", "sectionIndexes": [7, 8, 9, 11], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["遠視孩子為了看清而增加調節，連帶增加集合；適當眼鏡減少調節需求，因此可同時改變清晰度與內斜角。評估殘餘內斜須在合適矯正下進行；手術處理仍存在的眼位問題，通常不能消除原本的遠視，也不能把已形成的弱視直接變成正常。", "療效應分別報告單眼視力、自然與解離眼位、控制力或立體視，避免只用術後照片評分。年齡影響治療機會，但不是單一開關；較大兒童仍可能改善，幅度則與既往治療等條件有關。若出現急性外傷後運動限制等另一路徑的紅旗，須先處理病因，不能套用慢性斜視的追蹤節奏。"], "decisions": [{"finding": "戴眼鏡時眼位正，取下才內斜", "interpretation": "矯正正在降低調節性集合，不能據脫鏡外觀判定治療失敗。", "nextStep": "持續按處方戴鏡並追蹤視力、眼位及雙眼功能。"}, {"finding": "較大兒童仍有弱視，從未完整治療", "interpretation": "不能只因超過七歲就認定無效，但也不能保證恢復正常。", "nextStep": "先最佳光學矯正，再依年齡、反應與依從性共同規劃。"}], "sourceIds": ["n04-accommodative-integrated", "n04-pedig", "n04-amblyopia"]}], "case": {"title": "眼睛變正，治療就結束了嗎？", "stem": "7歲孩子被發現左眼偶爾向內偏，家長說雙眼看電視都沒問題，想知道是否直接手術。以下為虛構教學病例。", "steps": [{"newInfo": "分眼測量後左眼明顯較差，眼底沒有足以解釋差距的病灶。", "prompt": "先補什麼？為何不能以看電視正常作判斷？", "answer": "完成適齡視力確認與睫狀肌麻痺驗光；較好眼可能掩蓋單眼問題。", "rationale": "雙眼生活表現與單眼視覺發育不是同一結果。", "sourceIds": ["n04-amblyopia"]}, {"newInfo": "檢查發現遠視；戴適當矯正一段時間後，戴鏡內斜角明顯減少。", "prompt": "這個變化支持什麼機轉？手術該量哪種狀態？", "answer": "支持調節集合參與內斜；以合適矯正下的殘餘偏斜、遠近差及功能評估後續。", "rationale": "先移除可矯正的調節因素，才知道剩餘眼位問題有多少。", "sourceIds": ["n04-accommodative-integrated", "n04-cover"]}, {"newInfo": "戴鏡眼位穩定改善，但左眼視力仍落後；家長想停戴眼鏡。", "prompt": "如何說明下一階段？", "answer": "繼續合適矯正，核對依從性並評估弱視治療；分開追蹤兩眼視力與眼位，不因外觀改善就停療。", "rationale": "光學、視覺發育與雙眼排列的改善速度不同；七歲仍有治療空間。", "sourceIds": ["n04-amblyopia", "n04-pedig"]}]}, "connections": [{"topicId": "notes-02", "reason": "以遠視、調節與驗光原理解釋戴鏡後眼位的變化。"}, {"topicId": "notes-03", "reason": "非共同性偏斜與新發複視需要神經定位。"}, {"topicId": "notes-11", "reason": "兒童下垂或眼瞼異常可能遮蔽視軸並影響發育。"}]}}, "notes-05": {"deepDive": [{"heading": "機轉｜先區分上皮缺損、基質浸潤與組織變薄", "paragraphs": ["螢光染色顯示上皮屏障受損，白色基質浸潤則提示更深層的細胞反應；兩者相關但不是同一件事。角膜潰瘍也不等於細菌感染，仍須考慮真菌、棘阿米巴、病毒及非感染性免疫病變。", "角膜中央病灶直接威脅視軸，深層浸潤或漸進變薄則增加結構風險。描述病灶時要分別記錄位置、浸潤大小、上皮缺損、深度、變薄與前房反應，才能判斷追蹤時究竟哪一項變好或惡化。"], "sourceIds": ["an05-bacterial", "an05-culture"]}, {"heading": "推理｜用暴露史決定檢驗優先順序", "paragraphs": ["隱形眼鏡配戴者的疼痛紅眼，尤其合併畏光、視力下降或角膜浸潤，應及早由眼科評估。問診要追到過夜配戴、清潔液、游泳或接觸水、植物性外傷，以及先前點藥；這些資訊會改變病原的先驗機率。", "中央、深層、大範圍、非典型或治療反應不佳的浸潤，更需要角膜採樣。刮片與培養的目的在縮小病原及抗藥性的不確定性，不是取代臨床判斷；若威脅視力，採檢流程也不能造成不合理的治療延誤。"], "sourceIds": ["an05-bacterial", "an05-culture"]}, {"heading": "陷阱｜周邊潰瘍與深部眼痛可能指向全身疾病", "paragraphs": ["周邊角膜變薄、潰瘍若伴深部充血或鞏膜炎，要追問關節、呼吸道、皮膚及腎臟相關症狀，並評估感染與系統性免疫疾病。Mooren 潰瘍是排除性診斷，不能只憑周邊月牙狀外觀下結論。", "鞏膜炎常有深沉疼痛、夜間或眼球轉動時加重，可伴角膜或葡萄膜病變；表層鞏膜炎通常較表淺。少數壞死型鞏膜病變可能不痛，因此『不痛』也不是安全保證。未釐清感染前，不宜把所有紅眼都當成免疫炎症自行加用類固醇。"], "sourceIds": ["an05-mooren", "an05-scleritis", "an05-bacterial"]}], "oralChallenge": {"question": "隱形眼鏡使用者有疼痛紅眼、視力下降及中央白色浸潤。你會如何向上級報告並提出下一步？", "answer": "我會先報側別、起病速度、視力、病灶位置與大小、上皮缺損、浸潤深度、是否變薄及前房反應，再補充過夜配戴和接觸水的病史。中央浸潤屬威脅視力的角膜感染疑慮，需緊急眼科處置並考慮採樣；病原判斷不只限於細菌，也不應在病因未明時自行加類固醇。", "sourceIds": ["an05-bacterial", "an05-culture"]}, "resources": [{"id": "an05-bacterial", "title": "Bacterial Keratitis：臨床判斷與培養適應情境", "url": "https://eyewiki.org/Bacterial_Keratitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "專業教學頁；聚焦感染危險因子、病灶描述與採檢，非本 App 的個別處方。", "verifiedDate": "2026-10-11"}, {"id": "an05-culture", "title": "Culturing the Cornea：角膜採樣教學", "url": "https://www.eyerounds.org/tutorials/Cornea-Culture/index.htm", "kind": "影片", "provider": "University of Iowa · EyeRounds", "note": "含採樣、接種影片與器材照片；實際操作須依院內流程及上級督導。", "verifiedDate": "2026-10-11"}, {"id": "an05-mooren", "title": "Mooren's Ulcer：周邊角膜潰瘍的排除診斷", "url": "https://www.eyerounds.org/cases/316-moorens-ulcer.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "真實裂隙燈照片與手術影片；觀察周邊變薄及懸垂邊緣，練習感染／免疫鑑別。", "verifiedDate": "2026-10-11"}, {"id": "an05-scleritis", "title": "Scleritis：深部紅眼與系統性疾病", "url": "https://eyewiki.org/Scleritis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "專業教學頁；比較鞏膜炎與表層鞏膜炎，注意感染性與非感染性病因。", "verifiedDate": "2026-10-11"}, {"id": "an05-neurotrophic", "title": "Neurotrophic Keratitis：知覺、修復與缺損", "url": "https://eyewiki.aao.org/Neurotrophic_Keratitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "教學綜述；對照疼痛與病灶不成比例時的角膜感覺、閉合及修復評估。", "verifiedDate": "2026-10-11"}, {"id": "an05-trauma", "title": "眼外傷：化學暴露與眼球完整性的優先處理", "url": "https://www.eyerounds.org/tutorials/trauma.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "含真實外傷照片；本單元參考安全順序，歷史藥物處方不作現行用藥依據。", "verifiedDate": "2026-10-11"}, {"id": "cov05-dystrophy", "title": "基質失養：三種外觀與遺傳層次", "url": "https://eyewiki.org/Corneal_Stromal_Dystrophies", "kind": "指南", "provider": "AAO · EyeWiki", "note": "補充共筆圖片中 Granular、Lattice、Macular 三型。", "verifiedDate": "2026-10-11"}, {"id": "cov05-acanth", "title": "棘阿米巴角膜炎：潰瘍與穿孔風險", "url": "https://eyewiki.org/Acanthamoeba_Keratitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "校正原筆記「不會造成潰瘍」的錯誤概括。", "verifiedDate": "2026-10-11"}, {"id": "cov05-fungal", "title": "真菌角膜炎及治療性移植", "url": "https://eyewiki.org/Fungal_Keratitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "失控感染、穿孔時可需治療性移植；不是一概禁忌。", "verifiedDate": "2026-10-11"}, {"id": "cov05-chemical", "title": "酸鹼眼化學傷：沖洗、角膜緣與預後", "url": "https://eyewiki.org/Chemical_%28Alkali_and_Acid%29_Injury_of_the_Conjunctiva_and_Cornea", "kind": "指南", "provider": "AAO · EyeWiki", "note": "包括氫氟酸例外與角膜緣損傷分級。", "verifiedDate": "2026-10-11"}, {"id": "cov05-rejection", "title": "角膜免疫豁免與移植排斥", "url": "https://eyewiki.aao.org/Corneal_Allograft_Rejection_and_Failure", "kind": "指南", "provider": "AAO · EyeWiki", "note": "免疫豁免不等於不會發炎或排斥。", "verifiedDate": "2026-10-11"}, {"id": "cov05-dmek", "title": "DMEK與DSAEK替換的層次", "url": "https://eyewiki.aao.org/Descemet_Membrane_Endothelial_Keratoplasty", "kind": "指南", "provider": "AAO · EyeWiki", "note": "理解內皮移植解剖；不把舊教材成功率當個人預測。", "verifiedDate": "2026-10-11"}, {"id": "cov05-hsv", "title": "HSV上皮性角膜炎", "url": "https://eyewiki.aao.org/Herpes_Simplex_Virus_Keratitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "活動性上皮病灶的類固醇限制。", "verifiedDate": "2026-10-11"}, {"id": "cov05-hsvlayers", "title": "HSV不同層次的治療差異", "url": "https://eyewiki.aao.org/LASIK_in_Patients_With_Herpes_Simplex_Virus", "kind": "指南", "provider": "AAO · EyeWiki", "note": "參考分層治療段落，理解基質／內皮炎的抗病毒保護。", "verifiedDate": "2026-10-11"}, {"id": "cov05-kc", "title": "圓錐角膜：形態、影像與臨床", "url": "https://eyewiki.org/Keratoconus", "kind": "指南", "provider": "AAO · EyeWiki", "note": "包含進展性不規則散光及急性水腫。", "verifiedDate": "2026-10-11"}, {"id": "cov05-cxl", "title": "角膜交聯的穩定作用", "url": "https://eyewiki.org/Corneal_Collagen_Cross-Linking", "kind": "指南", "provider": "AAO · EyeWiki", "note": "交聯目標是減緩擴張進展，與眼鏡矯正目標不同。", "verifiedDate": "2026-10-11"}, {"id": "cov05-ossn", "title": "眼表鱗狀腫瘤：上皮內與侵襲性病變", "url": "https://eyewiki.aao.org/Ocular_Surface_Squamous_Neoplasia", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照上皮內病變、侵襲癌與治療選擇。", "verifiedDate": "2026-10-11"}, {"id": "cov05-hzo", "title": "眼帶狀皰疹：皮膚與遲發眼部影響", "url": "https://eyewiki.org/Herpes_Zoster_Ophthalmicus", "kind": "指南", "provider": "AAO · EyeWiki", "note": "Hutchinson徵、角膜及葡萄膜併發症。", "verifiedDate": "2026-10-11"}, {"id": "cov05-wilson", "title": "Wilson病與Kayser–Fleischer環", "url": "https://eyewiki.aao.org/Wilson%27s_Disease/Kayser_Fleischer_Ring", "kind": "指南", "provider": "AAO · EyeWiki", "note": "銅沉積位於Descemet膜；結合全身評估。", "verifiedDate": "2026-10-11"}, {"id": "cov05-verticillata", "title": "角膜漩渦：藥物與Fabry病", "url": "https://eyewiki.org/Cornea_Verticillata", "kind": "指南", "provider": "AAO · EyeWiki", "note": "上皮沉積的藥物和代謝性鑑別。", "verifiedDate": "2026-10-11"}, {"id": "cov05-myeloma", "title": "角膜混濁作為骨髓瘤初始表現：病例研究", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5912009/", "kind": "期刊", "provider": "American Journal of Case Reports · PMC", "note": "原始病例說明角膜沉積可引出全身單株蛋白疾病；不是篩檢盛行率依據。", "verifiedDate": "2026-10-11"}, {"id": "cov05-erlotinib", "title": "Erlotinib處方標示：眼部損傷警示", "url": "https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=2c4c7353-b81c-4651-8aac-6d15e88145af&type=display", "kind": "指南", "provider": "NLM · DailyMed", "note": "參照5.8眼部警示與治療調整；由腫瘤及眼科團隊共同處理。", "verifiedDate": "2026-10-11"}], "figure": {"type": "cornea", "title": "角膜分層：病灶位於哪個深度？", "caption": "原創角膜分層示意，非病人裂隙燈照片、非按比例。上皮、Bowman層、基質、Descemet膜及內皮各有不同角色；臨床另須分別描述上皮缺損、浸潤與變薄。", "alt": "角膜由外而內為上皮、Bowman層、基質、Descemet膜與內皮，協助定位上皮缺損與基質病灶。", "sourceIds": ["an05-bacterial", "an05-culture"]}, "integrated": {"framing": "把角膜當成透明光學元件、屏障與活的組織一起理解。紅痛眼的核心不是猜一個病名，而是區分哪一層受損、是否感染、是否正在失去眼球結構完整性。", "objectives": ["分別描述上皮缺損、基質浸潤、變薄與水腫", "用暴露史與病灶嚴重度決定採檢及處置優先級", "辨認感染、修復失敗與全身免疫病變可能重疊"], "units": [{"id": "u1", "title": "從層次找機轉：為何傷口不癒合或角膜不透明？", "sectionIndexes": [0, 1, 5, 6, 8, 9], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["同樣視力模糊，可能是表面不規則讓影像失焦、基質疤痕散射光，或水腫破壞透明；所以『角膜混濁』仍不是完整機轉。先用層次圖放置病灶，再問它主要破壞屏障、形狀還是透明度。修復上皮能關閉一個入口，卻未必同時消除基質病灶或恢復原有光學品質。", "持續缺損要同時檢查傷口與傷口的環境：閉合不全使表面反覆暴露，感覺異常讓症狀不可靠，也可能影響修復。感染與這些背景並不互斥，既有眼表疾病反而可能使感染更容易發生。因此不能只用『痛不痛』區分安全與危險，也不能見到舊疾就忽略新出現的浸潤。"], "decisions": [{"finding": "明顯上皮缺損，病人卻不太痛", "interpretation": "疼痛可能低估損傷，需考慮知覺及修復問題", "nextStep": "檢查角膜感覺、眼瞼閉合、浸潤與變薄"}, {"finding": "上皮已閉合，但基質仍混濁", "interpretation": "屏障恢復不等於深層病變與光學功能完全恢復", "nextStep": "持續比較基質變化、視力及其他發炎徵象"}], "sourceIds": ["an05-bacterial", "an05-culture", "an05-neurotrophic"]}, {"id": "u2", "title": "把感染機率變成可檢驗的假說", "sectionIndexes": [2, 3], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["暴露史改變的是病原機率，不是直接發出病原報告。接觸鏡、過夜配戴、接觸水或植物傷都能讓某些病原更值得追查，但臨床外觀重疊，先前用藥也會改變典型表現。先描述中央或周邊、大小、深度及進展速度，再決定是否需要刮片與培養，比只背風險因子配對更接近實際決策。", "採樣與治療是並行的風險管理：有條件時先取得有診斷價值的檢體，但不能為等結果而延誤威脅視力的感染處理。後續判斷也要同時看病灶與檢驗；培養陰性可能來自取樣、先前用藥或病原限制，若浸潤加深或組織變薄，這些客觀惡化比一次陰性報告更需要立即回應。"], "decisions": [{"finding": "中央深層浸潤合併上皮缺損", "interpretation": "感染疑慮與視軸風險均高，需及時專科處理", "nextStep": "眼科評估採樣及立即治療，不等培養才開始處置"}, {"finding": "初次培養陰性，但病灶持續擴大", "interpretation": "未排除感染，也可能病原或原診斷不正確", "nextStep": "重評採樣、病原範圍、用藥執行與非感染因素"}], "sourceIds": ["an05-bacterial", "an05-culture"]}, {"id": "u3", "title": "組織威脅與全身線索：角膜以外還要找什麼？", "sectionIndexes": [4, 7, 10, 11], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["周邊新月形缺損加上基質變薄，應把思考從局部擦傷擴大到感染、免疫性潰瘍及鄰近鞏膜病變。若同時有深部眼痛或鞏膜炎，需追問關節、耳鼻喉、呼吸及腎臟線索；這些資料不是用來迅速替病人貼上自體免疫標籤，而是決定哪些全身評估不能被漏掉。", "治療方向相反的疾病可以長得相似，這是不能只憑照片加類固醇的原因。Mooren潰瘍要在其他原因被適當排除後才成立；感染也可能與免疫疾病同時存在。與此相似，化學傷及全層外傷的第一步由立即危險決定：先中止持續損傷或保護眼球，再把完整診斷補齊。"], "decisions": [{"finding": "周邊變薄伴鞏膜炎與關節症狀", "interpretation": "須同時考慮系統性免疫疾病及感染", "nextStep": "及時眼科評估並協調全身檢查，避免僅以局部紅眼處理"}, {"finding": "角膜迅速變薄，即使疼痛已減少", "interpretation": "結構危險尚未解除，症狀改善不等於疾病受控", "nextStep": "緊急重新評估穿孔風險及治療反應"}], "sourceIds": ["an05-mooren", "an05-scleritis", "an05-bacterial", "an05-trauma"]}], "case": {"title": "接觸鏡配戴者，眼藥水點了仍惡化", "stem": "教學模擬：一位配戴接觸鏡的成人，右眼紅痛、畏光兩天，昨晚仍戴鏡睡覺。", "steps": [{"newInfo": "右眼視力下降，角膜中央可見白色病灶。", "prompt": "還要取得哪些資料，才能分辨普通紅眼與威脅視力的角膜病？", "answer": "記錄視力、浸潤大小與深度、上皮缺損、變薄及前房反應，並問水接觸、清潔方式與先前用藥。", "rationale": "白點本身不足以判斷病原；中央位置與客觀病灶決定急迫程度。", "sourceIds": ["an05-bacterial", "an05-culture"]}, {"newInfo": "浸潤約3 mm、達中層基質，合併染色缺損及前房細胞。", "prompt": "需要先等病原確定才治療嗎？", "answer": "安排及時眼科處置與適當採樣，同步開始專科選定的抗感染治療；停止配戴接觸鏡。", "rationale": "這是中央且較深的病灶，採檢有助縮小不確定性，但等結果會增加視力風險。", "sourceIds": ["an05-bacterial", "an05-culture"]}, {"newInfo": "追蹤時初步培養尚無生長，但浸潤變深並出現局部變薄。", "prompt": "是否可以因培養陰性改稱非感染性發炎？", "answer": "不可以。需立即重評病原、檢體與治療執行，考慮重複或進一步採樣，同時檢查非感染因素及穿孔風險。", "rationale": "陰性檢驗不能推翻持續惡化的臨床證據；此時目標包括保住組織完整性。", "sourceIds": ["an05-bacterial", "an05-culture", "an05-mooren"]}]}, "connections": [{"topicId": "notes-01", "reason": "以裂隙燈層次及染色把主訴轉成可追蹤的客觀資料。"}, {"topicId": "notes-11", "reason": "眼瞼閉合與位置可持續造成角膜暴露。"}, {"topicId": "notes-09", "reason": "前房反應可能伴隨角膜病，須辨認主要病灶與感染可能。"}]}}, "notes-06": {"deepDive": [{"heading": "機轉｜混濁的位置決定症狀，不只看白內障大小", "paragraphs": ["核性、皮質性與後囊下白內障的混濁分布不同，因此對屈光、眩光及日常功能的影響也不同。核性變化可伴近視化；後囊下混濁靠近視軸，病灶看似不大，卻可能對近距離閱讀與眩光造成明顯困擾。", "後囊下白內障位於天然晶狀體後部、靠近後囊的區域，並非白內障術後才發生。用裂隙燈反向照明並對準正確焦平面，可以避免漏看這類病灶。"], "sourceIds": ["an06-cataract", "an06-psc"]}, {"heading": "推理｜手術評估先建立『症狀由白內障造成』的證據", "paragraphs": ["手術決策要連結患者的實際困擾，例如閱讀、夜間駕駛或強光環境下的功能，而不是只用單一視力門檻。先確認最佳矯正視力與晶狀體混濁是否相符，同時評估角膜、黃斑、視神經與其他共病對術後視覺的限制。", "術前測量提供人工水晶體選擇的重要依據，但光學測量正確不保證視網膜或視神經功能正常。討論預期視力時，應把移除混濁能改善的部分、其他病變限制的部分，以及術後仍可能需要眼鏡分開說明。"], "sourceIds": ["an06-cataract", "an06-nei"]}, {"heading": "陷阱｜術後視力下降不能一律歸因於後囊混濁", "paragraphs": ["後囊混濁是保留下來的囊膜在術後變得混濁，與原有天然晶狀體白內障不同。雖然可造成再次模糊，也有雷射治療選項，但應先確認它確實解釋症狀。", "術後若出現新發視力下降、明顯疼痛、嚴重紅眼或閃光飛蚊等症狀，需要及時評估感染、發炎、眼壓及視網膜問題。判斷優先級時，症狀組合與時間軸比『白內障手術很常見』更重要。"], "sourceIds": ["an06-nei"]}], "oralChallenge": {"question": "視力表尚可，但患者白天眩光及閱讀非常困難，裂隙燈看到小範圍後囊下混濁。你會直接說不需要手術嗎？", "answer": "不會只根據視力表下結論。後囊下病灶可造成與面積不成比例的眩光與近視力困擾；我會確認矯正視力、症狀與混濁位置的關聯，並排除角膜、黃斑與視神經等共同原因，再以日常功能、預期效益與手術風險進行共同決策。", "sourceIds": ["an06-psc", "an06-nei", "an06-cataract"]}, "resources": [{"id": "an06-psc", "title": "Posterior Subcapsular Cataract：後囊下白內障圖譜", "url": "https://www.eyerounds.org/atlas/pages/posterior-subcapsular-cataract.html", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "真實裂隙燈照片；觀察後囊附近顆粒狀混濁，對照反向照明的判讀。", "verifiedDate": "2026-10-11"}, {"id": "an06-cataract", "title": "Cataracts：從分類、檢查到手術評估", "url": "https://www.eyerounds.org/tutorials/cataract-for-Med-Students/index.htm", "kind": "指南", "provider": "University of Iowa · EyeRounds", "note": "大學教學頁，含影像與手術概念；著重症狀與評估，歷史統計不視為現況。", "verifiedDate": "2026-10-11"}, {"id": "an06-video", "title": "Basic Cataract Surgery：完整基本手術示範", "url": "https://eyerounds.org/atlas-video/Great-third-year-case.html", "kind": "影片", "provider": "University of Iowa · EyeRounds", "note": "約 13 分鐘真實手術影像；先辨識撕囊、水分離、超音波乳化、皮質清除與人工水晶體植入。", "verifiedDate": "2026-10-11"}, {"id": "an06-nei", "title": "Cataract Surgery：適應情境、預期與警訊", "url": "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/cataracts/cataract-surgery", "kind": "指南", "provider": "NIH · National Eye Institute", "note": "官方衛教頁；適合練習功能導向的手術說明，以及術後需及時回診的症狀。", "verifiedDate": "2026-10-11"}, {"id": "an06-pxf", "title": "Pseudoexfoliation：沉積位置與懸韌帶風險", "url": "https://eyerounds.org/atlas/pages/pseudoexfoliation-syndrome/index.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "用實際瞳孔緣、晶狀體前囊及懸韌帶照片，理解術前檢查對手術規劃的影響。", "verifiedDate": "2026-10-11"}, {"id": "cov06-embryo", "title": "眼胚胎學：晶狀體板、囊泡與纖維", "url": "https://eyewiki.aao.org/Embryology_of_the_Eye_and_Ocular_Adnexa", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對表面外胚層來源與初級／次級纖維；避免將視杯當晶狀體直接來源。", "verifiedDate": "2026-10-11"}, {"id": "cov06-histology", "title": "眼組織學：囊膜、上皮與晶狀體纖維", "url": "https://eyewiki.aao.org/Basic_Histology_of_the_Eye_and_Accessory_Structures", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照晶狀體三大組成與成熟纖維去胞器的形態。", "verifiedDate": "2026-10-11"}, {"id": "cov06-remnants", "title": "Epicapsular stars 與 persistent pupillary membrane", "url": "https://www.eyerounds.org/atlas/pages/epicapsular-stars.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "大學臨床圖譜，區分前囊星點與跨瞳孔細絲的所在位置。", "verifiedDate": "2026-10-11"}, {"id": "cov06-mittendorf", "title": "Mittendorf dot：後囊的玻璃體動脈殘跡", "url": "https://eyerounds.org/atlas/pages/mittendorf-dots.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "圖譜對照後囊位置及與其他胎兒血管殘留的關係。", "verifiedDate": "2026-10-11"}, {"id": "cov06-pfv", "title": "Persistent fetal vasculature：由殘跡到牽引病變", "url": "https://eyerounds.org/atlas/pages/PFV/index.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "真實眼底與病例圖譜；對照 PFV 與舊名 PHPV。", "verifiedDate": "2026-10-11"}, {"id": "cov06-child", "title": "兒童白內障：先天形態、系統病與弱視", "url": "https://eyewiki.aao.org/Cataracts_in_Children%2C_Congenital_and_Acquired", "kind": "指南", "provider": "AAO · EyeWiki", "note": "依單雙眼、發育異常與系統線索理解病因及視覺發育風險。", "verifiedDate": "2026-10-11"}, {"id": "cov06-alport", "title": "Alport：前圓錐晶狀體與腎／聽覺線索", "url": "https://eyewiki.aao.org/ALPORT_SYNDROME", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對第四型膠原、lenticonus 與系統表現的連結。", "verifiedDate": "2026-10-11"}, {"id": "cov06-micro", "title": "Microspherophakia：形態、關聯與閉角機轉", "url": "https://eyewiki.aao.org/Microspherophakia", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照小赤道直徑、厚晶狀體、近視與瞳孔阻滯；處置需個別專科評估。", "verifiedDate": "2026-10-11"}, {"id": "cov06-ectopia", "title": "Ectopia lentis：懸韌帶與遺傳疾病", "url": "https://eyewiki.aao.org/Ectopia_Lentis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對外傷、Marfan、homocystinuria 及系統評估。", "verifiedDate": "2026-10-11"}, {"id": "cov06-aqp", "title": "AQP0：晶狀體纖維的水通道與透明", "url": "https://www.nei.nih.gov/research-and-training/research-news/researchers-get-close-view-water-pores-needed-eyes-lens", "kind": "指南", "provider": "NIH · National Eye Institute", "note": "NEI 研究說明，連結膜蛋白、纖維排列與晶狀體透明；不當作現行藥物療效。", "verifiedDate": "2026-10-11"}, {"id": "cov06-oxidative", "title": "晶狀體氧化壓力與抗氧化路徑", "url": "https://eyewiki.aao.org/Oxidative_Stress_in_Ophthalmology", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照糖解、HMP、sorbitol 與 GSH 系統；生化角色不等於補充劑臨床療效。", "verifiedDate": "2026-10-11"}, {"id": "cov06-capsule", "title": "Posterior capsular rent：囊膜構造與風險", "url": "https://eyewiki.aao.org/Posterior_Capsular_Rent", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對中央後囊薄弱與手術步驟相關風險；內容供理解而非操作指引。", "verifiedDate": "2026-10-11"}, {"id": "cov06-hydro", "title": "Hydro manoeuvres：分離的兩個平面", "url": "https://eyewiki.aao.org/Hydro_Manoeuvres_in_Cataract_Surgery", "kind": "指南", "provider": "AAO · EyeWiki", "note": "對照 hydrodissection 與 hydrodelineation 的解剖差異。", "verifiedDate": "2026-10-11"}], "figure": {"type": "lens", "title": "核性、皮質性、後囊下混濁的位置", "caption": "原創晶狀體剖面概念示意，非病人照片、非按比例。標示三種常見混濁的所在區域；真實外觀請對照圖譜。", "alt": "晶狀體剖面並列三種位置：中央晶核、周邊皮質、後囊前方的後囊下區域。", "sourceIds": ["an06-cataract", "an06-psc"]}, "integrated": {"framing": "用『混濁在哪裡、它解釋了多少症狀、手術後還剩哪些限制』串起晶狀體胚胎、結構、代謝與手術。能指出白內障不難，能合理估計改善空間才是臨床判斷。", "objectives": ["由混濁位置解釋近視化、眩光與閱讀困難", "把視覺效益與懸韌帶、眼表及眼底風險分開評估", "依術後時間軸辨認需及時處理的視力下降"], "units": [{"id": "u1", "title": "從透明結構到功能障礙：混濁大小不是唯一指標", "sectionIndexes": [0, 1, 2, 5, 6, 7], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["晶狀體一方面要透明，一方面要提供適當屈光力，因此疾病可以先表現為度數改變，也可以主要影響眩光與對比。核性變化造成近視化時，病人可能暫時覺得摘鏡看近變好；這不等於老花逆轉。把患者的功能改變與裂隙燈位置配對，比只說『有幾分白內障』更能解釋主訴。", "後囊下混濁提醒我們，面積小不一定影響小：接近視軸的病灶可能在亮光或閱讀時造成明顯困擾。另一方面，晶狀體外觀異常也不必然等於症狀來源，胚胎殘跡與局部形狀改變都要問是否遮擋視軸、改變光學或伴隨其他問題。定位是起點，功能符合才讓因果解釋更可信。"], "decisions": [{"finding": "遠視力表尚可，亮光與閱讀卻很困難", "interpretation": "視力表可能未呈現患者最受影響的情境", "nextStep": "對照後囊下病灶、矯正視力與實際功能需求"}, {"finding": "近來近視加深，同時有核性混濁", "interpretation": "晶狀體變化可參與屈光改變，不只是眼鏡老舊", "nextStep": "核對病程與眼部共病，評估換鏡可改善的程度"}], "sourceIds": ["an06-cataract", "an06-psc"]}, {"id": "u2", "title": "術前把三件事分開：效益、測量與手術風險", "sectionIndexes": [3, 4, 8, 9, 10], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["術前要分別回答：移除混濁能改善什麼、人工晶狀體目標如何設定，以及眼球結構是否增加操作困難。最佳矯正視力與角膜、黃斑、視神經狀態影響預期效益；眼軸與角膜測量影響屈光結果；瞳孔與懸韌帶則影響手術規劃。把三者混成一句『手術成功率高』，會掩蓋病人真正需要理解的限制。", "看手術影片時，逐步問每個動作在保留什麼：囊袋提供人工晶狀體支撐，完整懸韌帶讓囊袋位置較穩定。若有假性剝脫、外傷或晶狀體晃動，常規流程的假設可能不成立。口試不必直接指定特殊器材，但要能辨認風險、通知手術團隊，並避免在未完成評估前保證特定鏡片或視力結果。"], "decisions": [{"finding": "混濁足以影響生活，但另有黃斑病變", "interpretation": "可移除的光學障礙與術後視力上限需分開說明", "nextStep": "確認共病程度，討論合理改善目標與仍需眼鏡的可能"}, {"finding": "散瞳不佳或晶狀體晃動", "interpretation": "可能增加手術暴露及囊袋支撐的不確定性", "nextStep": "完整記錄並交給手術醫師規劃，不當作一般標準個案"}], "sourceIds": ["an06-cataract", "an06-video", "an06-nei", "an06-pxf"]}, {"id": "u3", "title": "術後重新模糊：先依時間與警訊重新定位", "sectionIndexes": [11], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["人工晶狀體已取代天然晶狀體，病人所說的『白內障又長回來』需要重新翻譯成臨床問題。保留囊膜可以日後變混濁，但眼表、角膜、發炎、眼壓或後節問題也能造成模糊；先確認原因，再談雷射，才能避免對一個偶然存在的後囊混濁做了處理，真正病因卻仍未找到。", "病程速度與伴隨症狀決定分流。數月緩慢模糊和短時間痛紅、明顯降視力，不應被排進同一條等待流程。術後說明除了交代點藥，也要讓患者知道哪些變化必須及時回報；後續評估仍須重新量視力、看前後節，而不是因為已有手術診斷就省略定位。"], "decisions": [{"finding": "術後數月漸糊，可見後囊混濁", "interpretation": "可能相關，但仍需確認與症狀、功能下降相符", "nextStep": "排除其他原因後，再討論Nd:YAG治療"}, {"finding": "術後新發疼痛、紅眼與快速降視力", "interpretation": "不能先當作一般恢復或後囊混濁", "nextStep": "及時聯繫手術團隊或急診眼科，評估感染等急症"}], "sourceIds": ["an06-nei", "an06-cataract"]}], "case": {"title": "視力表還不差，但已無法安心夜間開車", "stem": "教學模擬：一位成人近半年夜間眩光與閱讀困難，要求更換更強的眼鏡；原眼鏡下視力約6/9。", "steps": [{"newInfo": "重新驗光後視力改善有限，患者描述迎面車燈附近光暈明顯。", "prompt": "視力6/9是否足以否定需要進一步處理？", "answer": "不足。需釐清症狀與日常功能，再檢查眼表、角膜、晶狀體及後節。", "rationale": "高對比視力表不能完整代表眩光情境，也不能單獨決定手術必要性。", "sourceIds": ["an06-cataract", "an06-nei"]}, {"newInfo": "反向照明見視軸附近後囊下混濁；角膜與眼底評估未見明顯限制，無RAPD。", "prompt": "現在如何說明症狀與發現的關聯？", "answer": "混濁位置可合理解釋眩光與閱讀困難；可進一步討論手術，但仍須生物測量、手術風險與屈光目標評估。", "rationale": "因果證據比第一階段更完整，卻不等於已保證術後視力或不需眼鏡。", "sourceIds": ["an06-psc", "an06-nei"]}, {"newInfo": "患者完成手術後原本改善，第五天卻明顯眼痛、紅眼且視力變差。", "prompt": "是否先安撫為恢復期、下次門診再看？", "answer": "不可延後，需及時眼科檢查並排除眼內炎、高眼壓及其他術後問題。", "rationale": "新的時間軸與警訊改變了問題，先前白內障的診斷不能解釋這次急性惡化。", "sourceIds": ["an06-nei"]}]}, "connections": [{"topicId": "notes-02", "reason": "度數變動、調節與IOL目標都需正確光學觀念。"}, {"topicId": "notes-07", "reason": "晶狀體位置、假性剝脫與手術後狀態可能影響眼壓及隅角。"}, {"topicId": "notes-10", "reason": "黃斑與視網膜共病決定術前預期，也參與術後降視力鑑別。"}]}}, "notes-07": {"deepDive": [{"heading": "眼壓是風險因子，青光眼是視神經損傷", "paragraphs": ["眼壓來自房水生成與排出間的平衡；房水由睫狀體生成，經後房與瞳孔至前房，再經小樑網／Schlemm 管及葡萄膜鞏膜路徑排出。瞳孔阻滯可讓虹膜向前膨隆、遮住小樑網；反覆接觸可形成周邊前黏連。", "高眼壓不等於已經青光眼，正常範圍眼壓也不能排除青光眼。診斷核心是視神經損傷與功能變化；降眼壓的目的是減緩進一步惡化，不能把已失去的視野直接恢復。"], "sourceIds": ["n07-angle", "n07-nei", "n07-anatomy"]}, {"heading": "Gonioscopy 回答的是房角為何關閉", "paragraphs": ["房角鏡是評估房角的關鍵檢查。暗環境、適當窄光束可減少照光造成的虹膜形態改變；壓陷房角鏡若能打開接觸處，較支持貼附性關閉，打不開則要考慮黏連，並結合可見結構判斷。", "雷射周邊虹膜切開可解除瞳孔阻滯，但不代表所有關角機轉都消失。若虹膜切開孔通暢仍有窄角，需再找 plateau iris、晶體因素或其他次發原因；不能把所有關角都套用同一處置。"], "sourceIds": ["n07-angle", "n07-gonio"]}, {"heading": "慢性無症狀與急性紅痛眼，分流不能相同", "paragraphs": ["慢性青光眼早期可能沒有自覺症狀；突然劇烈眼痛、紅眼、視力模糊與噁心，則須當作急性關角等眼科急症評估。不能因症狀包括噁心或頭痛，就先歸為腸胃疾病或偏頭痛。", "確認房角關閉後還要找病因：詢問外傷、眼部手術、發炎、血管性眼病與近期藥物。原發瞳孔阻滯與次發性虹膜前推或牽拉，其治療機轉不同；只把眼壓降下來，並不代表已解決造成關角的原因。"], "sourceIds": ["n07-nei", "n07-angle"]}], "oralChallenge": {"question": "病人眼壓只有 17 mmHg，但有可重複的弓形視野缺損；能排除青光眼嗎？", "answer": "不能。正常範圍眼壓仍可能有青光眼，需要完整視神經與視野評估，確認病變並排除其他原因。重點是視神經是否受損及後續有無惡化，而不是用一次眼壓決定有病或沒病。", "sourceIds": ["n07-nei"]}, "resources": [{"id": "n07-angle", "title": "原發與次發性關角：機轉與房角鏡判讀", "url": "https://eyewiki.aao.org/Primary_vs._Secondary_Angle_Closure_Glaucoma", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "比較瞳孔阻滯、plateau iris 與次發性機轉；教學綜述。", "verifiedDate": "2026-10-11"}, {"id": "n07-nei", "title": "青光眼：正常眼壓與急性症狀", "url": "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/glaucoma", "kind": "指南", "provider": "NIH · National Eye Institute", "note": "複習眼壓與疾病的關係、治療目標及需立即就醫的症狀。", "verifiedDate": "2026-10-11"}, {"id": "n07-gonio", "title": "Atlas of Gonioscopy 房角鏡影片圖譜", "url": "https://gonioscopy.org/", "kind": "影片", "provider": "University of Iowa · Wallace Alward", "note": "觀看正常房角、基本操作與壓陷技巧，再對照疾病範例。", "verifiedDate": "2026-10-11"}, {"id": "n07-anatomy", "title": "房角、房水排出與前房病理圖譜", "url": "https://morancore.utah.edu/section-04-ophthalmic-pathology/glaucoma-anterior-chamber/", "kind": "圖譜", "provider": "University of Utah · Moran CORE", "note": "對照小樑網、Schlemm 管及前房病理；辨認傳統與葡萄膜鞏膜排出路徑。", "verifiedDate": "2026-10-11"}, {"id": "n07-oct", "title": "青光眼OCT：品質、結構功能配對與進展", "url": "https://eyewiki.aao.org/Spectral_Domain_Optical_Coherence_Tomography_in_Glaucoma", "kind": "指南", "provider": "AAO · EyeWiki", "note": "教學綜述；聚焦分割錯誤、正常資料庫限制及追蹤，儀器特定門檻不可直接外推到所有機型。", "verifiedDate": "2026-10-11"}, {"id": "n07-topiramate", "title": "Topiramate相關關角：非瞳孔阻滯的病例與圖解", "url": "https://eyerounds.org/cases/283-topiramate-induced-angle-closure.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "2019年教學病例；對照雙眼近視位移、睫狀脈絡膜滲出及前房變淺，非個別處方模板。", "verifiedDate": "2026-10-11"}, {"id": "cov07-ohts", "title": "OHTS原研究結果與風險差", "url": "https://ohts.wustl.edu/results/", "kind": "指南", "provider": "Washington University · OHTS", "note": "5年4.4%與9.5%應同時呈現相對及絕對風險，不能只說治療浪費。", "verifiedDate": "2026-10-11"}, {"id": "cov07-meds", "title": "降眼壓滴劑：機轉及全身風險", "url": "https://eyewiki.org/Review_of_Topical_Glaucoma_Medications", "kind": "指南", "provider": "AAO · EyeWiki", "note": "校正brimonidine促進的是葡萄膜鞏膜外流，及局部滴藥全身效應。", "verifiedDate": "2026-10-11"}, {"id": "cov07-pcg", "title": "兒童與原發先天性青光眼", "url": "https://eyewiki.org/Primary_Congenital_Glaucoma", "kind": "指南", "provider": "AAO · EyeWiki", "note": "三聯徵、Haab紋、發育異常分類及手術角色。", "verifiedDate": "2026-10-11"}, {"id": "cov07-xen", "title": "XEN的結膜下引流路徑", "url": "https://eyewiki.org/Xen_Glaucoma_Treatment_System", "kind": "指南", "provider": "AAO · EyeWiki", "note": "與導向Schlemm管的植入物區分。", "verifiedDate": "2026-10-11"}, {"id": "cov07-brimonidine-label", "title": "Brimonidine標示：未滿2歲禁用", "url": "https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=87c5a534-4321-46c7-9938-84dca34b6506", "kind": "指南", "provider": "NLM · DailyMed", "note": "4.1列明未滿2歲禁用；8.4說明較大兒童的鎮靜與呼吸風險。", "verifiedDate": "2026-10-11"}, {"id": "cov07-migs", "title": "微創青光眼手術的不同流出路徑", "url": "https://eyewiki.org/Microinvasive_Glaucoma_Surgery_%28MIGS%29", "kind": "指南", "provider": "AAO · EyeWiki", "note": "比較iStent、Hydrus與結膜下流出概念。", "verifiedDate": "2026-10-11"}, {"id": "cov07-field", "title": "Humphrey視野報表：MD、PSD與可靠度判讀", "url": "https://eyerounds.org/tutorials/VF-testing/index.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "Reading the Humphrey Visual Field Printout直接說明MD、PSD、TD／PD及GHT；PSD低值可見於正常或瀰漫性損失。", "verifiedDate": "2026-10-11"}], "figure": {"type": "aqueous-flow", "title": "房水生成與兩條排出路徑", "caption": "原創房水流程示意：睫狀體生成房水，經後房與瞳孔進入前房，再分為小樑網／Schlemm 管及葡萄膜鞏膜排出路徑；箭頭示意方向，不代表精確流量比例。", "alt": "房水從睫狀體經後房、瞳孔到前房，分流至小樑網及 Schlemm 管，另一條經葡萄膜鞏膜路徑排出。", "sourceIds": ["n07-anatomy"]}, "integrated": {"framing": "把青光眼分成三個層次：神經是否受損、房水流出為何異常、現有治療能否減慢進展。眼壓是一個可介入的環節，不能代替結構、功能與病程。", "objectives": ["配對視乳頭、RNFL與可重複的視野缺損", "用房水路徑解釋隅角鏡、藥物與手術目的", "辨認急性關角及非瞳孔阻滯的次發機轉"], "units": [{"id": "u1", "title": "先確認神經病變，再用時間判斷是否正在惡化", "sectionIndexes": [0, 1, 2, 4, 6], "deepDiveIndexes": [0], "showFigure": false, "synthesis": ["診斷需要不同資料互相支持：視乳頭或RNFL異常提出受損位置，視野檢查它是否有相應的功能後果，追蹤再檢查病變是否變化。三者不同步時先看測量品質、可靠度與其他可能原因，而不是挑最紅的那張報告作結論。眼壓正常只能描述當下測量，不能把已存在的神經損傷取消。", "治療的目標是保留未來功能，所以要把一次橫斷面結果與長期趨勢分開。已受損的視野通常不會因眼壓下降直接恢復；若病人說沒感覺改善，不等於治療失效。反過來，眼壓達到原先設定的目標也不等於永遠足夠，若可靠追蹤仍惡化，就應重新評估診斷、治療執行與控制策略。"], "decisions": [{"finding": "眼壓17 mmHg，有可重複且相符的結構與視野異常", "interpretation": "正常範圍眼壓不能排除青光眼", "nextStep": "完整評估並排除其他神經病因，建立追蹤基準"}, {"finding": "單次OCT變紅，視野可靠度差", "interpretation": "目前證據仍不足以直接宣告進展", "nextStep": "先核對影像與測試品質，再與既往資料比較"}], "sourceIds": ["n07-nei", "n07-anatomy", "n07-angle", "n07-oct"]}, {"id": "u2", "title": "畫出流出路徑：檢查與治療各改變哪一段？", "sectionIndexes": [3, 5, 10, 11], "deepDiveIndexes": [1], "showFigure": true, "synthesis": ["先沿房水圖走一遍：產生、經瞳孔進前房，再進入流出路徑。降低生成、改善原有流出與建立替代通路，都能影響眼壓，但處理的環節不同。回答藥物或手術題時先指出作用位置，便能解釋為何同樣降低眼壓的選項，適用條件、限制與全身風險並不相同。", "房角鏡不只提供『開或關』，還把解剖機轉帶入治療選擇。接觸性閉鎖與黏連性閉鎖，代表尚可逆的接觸和已存在的結構改變不同；虹膜切開孔通暢也只證明已有一條繞過瞳孔的路，不能證明其餘流出系統正常。因此處置後還需回到隅角與眼壓重新驗證假說。"], "decisions": [{"finding": "周邊前房淺，尚未完成隅角評估", "interpretation": "這是機轉線索，不能直接代替完整房角判讀", "nextStep": "在適當情境做房角鏡，辨認接觸、黏連及次發變化"}, {"finding": "LPI孔通暢但仍窄角或高眼壓", "interpretation": "瞳孔阻滯以外的因素或既存流出障礙仍可能存在", "nextStep": "重新評估隅角、晶狀體及其他次發機轉"}], "sourceIds": ["n07-anatomy", "n07-gonio", "n07-angle"]}, {"id": "u3", "title": "急性症狀先分流，再辨認關角背後的原因", "sectionIndexes": [7, 8, 9], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["急性紅痛眼、虹視與噁心提示需要立即評估，但這組症狀還沒告訴你是哪一種關角。接著要問單眼或雙眼、是否近期開始新藥、是否有近視位移，再看中央與周邊前房、虹膜及晶狀體。這些資訊能把『數字很高』轉成具體的解剖假說，也避免只治頭痛而錯過眼科急症。", "雙眼同步淺前房伴突然近視化尤其值得回顧藥物；睫狀脈絡膜滲出把虹膜晶狀體向前推，與瞳孔阻滯的機轉不同，不能機械套用同一雷射處置。嬰幼兒則可能用流淚、畏光與角膜改變表現；缺少成人式的疼痛描述，不代表可以降低處理優先級。"], "decisions": [{"finding": "成人突發虹視、痛紅與噁心", "interpretation": "需立即排查急性關角等眼科急症", "nextStep": "及時眼科評估視力、角膜、前房、眼壓與病因"}, {"finding": "新藥後雙眼近視位移、前房均勻變淺", "interpretation": "須考慮非瞳孔阻滯的虹膜晶狀體前移", "nextStep": "緊急評估並協調致病藥物處理，避免把LPI當成通用解方"}], "sourceIds": ["n07-angle", "n07-nei", "n07-anatomy", "n07-topiramate"]}], "case": {"title": "一眼突然痛紅，解除阻滯後是否就治好了？", "stem": "教學模擬：一位成人突然右眼劇痛、視力模糊及噁心；左眼沒有不適。沒有外傷，既往未診斷青光眼。", "steps": [{"newInfo": "患者看燈有彩虹光暈，右眼充血、視力下降，角膜看起來霧霧的。", "prompt": "目前最重要的處置優先級是什麼？", "answer": "立即安排眼科評估視力、瞳孔、前房與眼壓，排查急性關角；不能先以偏頭痛或腸胃不適解釋。", "rationale": "突然紅痛、虹視、視力下降與噁心是眼科急症線索，但仍須檢查確認機轉。", "sourceIds": ["n07-nei", "n07-angle"]}, {"newInfo": "右眼眼壓48 mmHg、中度散瞳、周邊前房淺且虹膜前凸；眼科評估支持瞳孔阻滯造成關角，未找到明確次發原因。", "prompt": "請把解剖機轉與緊急治療目標連起來。", "answer": "房水經瞳孔受阻，使虹膜向前遮住流出通道。需依全身條件緊急降眼壓及控制發炎，並儘速在適當條件下以LPI解除阻滯；另一眼也需評估預防處置。", "rationale": "藥物先降低急性壓力與角膜水腫；LPI提供繞過瞳孔的通路，處理本例的重要致病機轉。", "sourceIds": ["n07-angle", "n07-anatomy"]}, {"newInfo": "接受治療及LPI後急性症狀改善；後續切開孔通暢，但仍有部分隅角接觸、周邊前黏連（PAS）及偏高眼壓。", "prompt": "這代表LPI完全失敗嗎？接下來還要確認什麼？", "answer": "不一定。LPI可解除瞳孔阻滯，卻不會消除既存PAS或其他關角機轉。需重評房角、晶狀體及眼壓控制，穩定後完成視神經、RNFL與視野評估。", "rationale": "孔通暢不等於流出系統全正常；急性發作本身也不能確定青光眼損傷程度。後續治療取決於殘餘機轉與神經功能。", "sourceIds": ["n07-angle", "n07-gonio", "n07-nei", "n07-oct"]}]}, "connections": [{"topicId": "notes-03", "reason": "用視野與神經定位確認典型或非典型青光眼表現。"}, {"topicId": "notes-06", "reason": "晶狀體位置與體積會改變前房及隅角。"}, {"topicId": "notes-13", "reason": "將新藥時間軸接到次發高眼壓與關角機轉。"}]}}, "notes-08": {"deepDive": [{"heading": "眼眶隔膜後感染：用眼球功能辨識危險", "paragraphs": ["眼眶蜂窩性組織炎位於眼眶隔膜後，常由鼻竇感染延伸；眼皮紅腫的外觀本身無法判斷深度。應主動檢查眼球運動與疼痛、突眼、複視、視力及 RAPD，而不是只看是否發燒。", "視力下降、RAPD 或視野缺損提示視神經受威脅，應立即升級眼科、耳鼻喉與影像評估，依情況給予住院靜脈抗菌及引流處置。曾使用抗生素的患者，沒有發燒也不能排除眼眶感染。"], "sourceIds": ["n08-orbital"]}, {"heading": "流淚先定位：入口、通道還是鼻淚管？", "paragraphs": ["排淚依序經淚點、淚小管、淚囊、鼻淚管。流淚不等於鼻淚管阻塞；先看淚點是否存在與開放，再以染色消退、探通及灌洗等檢查定位，避免跳過淚點或淚小管病變。", "教學影片示範探針沿淚小管由垂直轉水平，感受軟性阻力並評估通道。灌洗能否進入鼻咽有助判斷通暢，但要與症狀和眼瞼位置一起解讀；操作須由受訓人員進行，不能用力突破阻力。"], "sourceIds": ["n08-punctal", "n08-lacrimal-video"]}, {"heading": "淚囊炎不是只有局部紅腫", "paragraphs": ["淚道阻塞合併感染可形成淚囊膿瘍，也可能與眼眶蜂窩性組織炎同時存在。遇到內眥附近紅腫流膿時，仍要檢查視力、瞳孔與眼球運動，不能因找到淚囊病灶就停止評估。", "明顯膿瘍、病情惡化或伴隨眼眶徵象時，需眼整形及相關團隊評估抗菌治療與引流；急性期處理感染與後續重建排淚通路，是不同階段的目標。影像中的感染範圍可幫助決定是否需要更積極處理。"], "sourceIds": ["n08-dacryo", "n08-orbital"]}], "oralChallenge": {"question": "小孩眼皮紅腫但沒有發燒，向上看會痛且出現複視，你會先當作眼眶隔膜前感染開口服藥嗎？", "answer": "不會只靠無發燒判斷輕症。運動疼痛與複視提示可能有眼眶內侵犯，應立即評估視力、RAPD、突眼及眼球運動，安排眼科與耳鼻喉評估及適當眼眶／鼻竇影像；若視功能受損更須緊急處理。", "sourceIds": ["n08-orbital"]}, "resources": [{"id": "n08-orbital", "title": "兒童眼眶蜂窩性組織炎：照片與 CT", "url": "https://www.eyerounds.org/cases/103-Pediatric-Orbital-Cellulitis.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "含眼位、突眼與鼻竇／眼眶 CT，練習辨認隔膜後病灶及危險徵象。", "verifiedDate": "2026-10-11"}, {"id": "n08-punctal", "title": "淚點閉鎖與流淚的解剖定位", "url": "https://www.eyerounds.org/cases/373-punctal-atresia.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "病例圖與染色消退檢查；比較淚點、淚小管及鼻淚管阻塞。", "verifiedDate": "2026-10-11"}, {"id": "n08-lacrimal-video", "title": "淚道檢查影片：探通與灌洗", "url": "https://webeye.ophth.uiowa.edu/eyeforum/atlas-video/lacrimal-system-examination.htm", "kind": "影片", "provider": "University of Iowa · Richard Allen", "note": "1 分 29 秒示範淚點擴張、淚小管探通及灌洗；供受訓臨床人員學習。", "verifiedDate": "2026-10-11"}, {"id": "n08-dacryo", "title": "淚囊膿瘍與眼眶感染圖譜", "url": "https://eyerounds.org/atlas/pages/dacryocystitis-2.html", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "病例照片示範淚囊感染可合併更深部眼眶侵犯。", "verifiedDate": "2026-10-11"}, {"id": "n08-ted-integrated", "title": "TED的兩端威脅：角膜暴露與視神經壓迫", "url": "https://eyerounds.org/tutorials/thyroid-eye-disease/2-clinical-presentation.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "2016基礎圖文教學；連結眼瞼、限制性眼肌病與眶尖壓迫，作解剖與臨床辨識閱讀。", "verifiedDate": "2026-10-11"}, {"id": "n08-ccf-integrated", "title": "頸動脈海綿竇瘻：血流機轉、眼位與影像", "url": "https://eyerounds.org/cases/111-Carotid-Cavernous-Fistula.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "2010教學病例；觀察靜脈鬱血、突眼、運動障礙及上眼靜脈擴張，未將所有低流量病變視為無需治療。", "verifiedDate": "2026-10-11"}, {"id": "cov08-bone", "title": "眼眶七骨與四壁圖譜", "url": "https://eyewiki.org/Bony_Anatomy_of_the_Orbit", "kind": "指南", "provider": "AAO · EyeWiki", "note": "依壁重組骨名，理解與鼻竇和淚囊的關係。", "verifiedDate": "2026-10-11"}, {"id": "cov08-imaging", "title": "眼眶與淚器影像定位", "url": "https://eyewiki.org/Imaging_in_Orbit_and_Oculoplasty", "kind": "指南", "provider": "AAO · EyeWiki", "note": "比較CT、MRI、淚道造影與淚液核醫動態檢查。", "verifiedDate": "2026-10-11"}, {"id": "cov08-floor", "title": "眼眶底骨折：臨床夾陷與手術時機", "url": "https://eyewiki.org/Orbital_Floor_Fractures", "kind": "指南", "provider": "AAO · EyeWiki", "note": "影像疝出不等於肌肉夾陷，持續功能障礙需個別判斷。", "verifiedDate": "2026-10-11"}, {"id": "cov08-ocr", "title": "眼心反射與緊急夾陷", "url": "https://eyewiki.org/Oculocardiac_Reflex", "kind": "指南", "provider": "AAO · EyeWiki", "note": "兒童外觀輕微仍可能有危險性心率變化。", "verifiedDate": "2026-10-11"}, {"id": "cov08-ioi", "title": "非特異性眼眶發炎：排除診斷與活檢", "url": "https://eyewiki.org/Nonspecific_Orbital_Inflammation_%28Idiopathic_Orbital_Inflammation%2C_Orbital_Inflammatory_Syndrome%2C_Orbital_Pseudotumor%29", "kind": "指南", "provider": "AAO · EyeWiki", "note": "治療反應不能取代感染與腫瘤鑑別。", "verifiedDate": "2026-10-11"}, {"id": "cov08-ted2021", "title": "EUGOGO：甲狀腺眼病活動度、嚴重度與緊急處理", "url": "https://academic.oup.com/ejendo/article/185/4/G43/6654384", "kind": "期刊", "provider": "EUGOGO · European Journal of Endocrinology", "note": "2021指南取代共筆2008流程；視神經或角膜威脅需立即處理。", "verifiedDate": "2026-10-11"}, {"id": "cov08-rms", "title": "橫紋肌肉瘤：活檢、分期及綜合治療", "url": "https://eyewiki.org/Rhabdomyosarcoma", "kind": "指南", "provider": "AAO · EyeWiki", "note": "校正「小腫瘤切掉就好」的概括，仍需兒癌團隊評估。", "verifiedDate": "2026-10-11"}, {"id": "cov08-lymph", "title": "眼眶淋巴瘤：病理與全身分期", "url": "https://eyewiki.org/Orbital_Lymphoma", "kind": "指南", "provider": "AAO · EyeWiki", "note": "局部表現不等於排除全身病。", "verifiedDate": "2026-10-11"}, {"id": "cov08-masses", "title": "眼眶腫塊的定位鑑別", "url": "https://eyewiki.org/Orbital_Masses", "kind": "指南", "provider": "AAO · EyeWiki", "note": "將形態、位置、年齡及病程一起理解。", "verifiedDate": "2026-10-11"}, {"id": "cov08-evis", "title": "眼內容剜除與交感性眼炎風險", "url": "https://eyewiki.aao.org/Evisceration", "kind": "指南", "provider": "AAO · EyeWiki", "note": "交感性眼炎屬罕見風險，不能寫成容易發生。", "verifiedDate": "2026-10-11"}, {"id": "cov08-nld", "title": "兒童鼻淚管阻塞：觀察、按摩與介入", "url": "https://www.aapos.org/glossary/nasolacrimal-duct-obstruction", "kind": "指南", "provider": "AAPOS", "note": "抗生素只在顯著分泌物等情況短期使用；不能打開阻塞。", "verifiedDate": "2026-10-11"}, {"id": "cov08-dacryo", "title": "急性淚囊炎：全身抗菌與阻塞處理", "url": "https://eyewiki.aao.org/Dacryocystitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "通常需要全身抗菌；急性發炎不宜例行探通。", "verifiedDate": "2026-10-11"}, {"id": "cov08-canal", "title": "淚小管炎與結石", "url": "https://eyewiki.aao.org/Canaliculitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "辨認pouting punctum、膿液及深部結石。", "verifiedDate": "2026-10-11"}, {"id": "cov08-mucor", "title": "鼻眶腦毛黴菌病：黑痂與眼球運動危機", "url": "https://eyewiki.org/Rhino-Orbital-Cerebral_Mucormycosis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "強調高風險宿主、壞死、眼肌麻痺與緊急多科處理。", "verifiedDate": "2026-10-11"}], "figure": {"type": "orbit", "title": "眼眶隔膜前後的感染與視神經警訊", "caption": "原創眼眶位置概念示意：眼眶隔膜區分隔膜前與隔膜後空間。視力下降、RAPD 或視野異常提示視神經受威脅，須立即升級處理。", "alt": "水平位置圖依序標示眼瞼／眶隔前、眶隔、眶內組織與視神經，另用三欄對照隔膜前病變、眶內與視神經受累警訊。", "sourceIds": ["n08-orbital"]}, "integrated": {"framing": "將紅腫、突眼、複視與流淚放回同一張解剖地圖：先判斷位於哪個空間，再決定視功能風險、影像問題及處理順序。", "objectives": ["用視力、瞳孔與眼球運動區分外觀腫脹和深部威脅。", "能從眼眶容積及靜脈壓解釋不同病因的共同表現。", "依分泌、眼瞼泵與排出通路定位流淚，而非直接指定手術。"], "units": [{"id": "u1", "title": "解剖邊界決定急迫性：先查功能，再看外觀", "sectionIndexes": [0, 1, 2, 3], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["眶隔是定位參考，並非看到眼皮腫就知道病變位在其前方。肌肉、脂肪與視神經位於有限的骨性空間，深部發炎可同時改變眼位、運動及視功能；因此紅腫只是一個入口，檢查必須走到視力、瞳孔與眼球運動，才能回答受威脅的是外觀還是視覺。", "鼻竇影像的價值不只是看到『有發炎』，而是找感染來源、眶內延伸、膿瘍位置及是否需要引流。視功能與運動的連續變化則回答病人有沒有惡化；影像與臨床改善速度不必同步。不能以一次視力正常、沒有發燒或外觀稍退腫取代後續功能追蹤。"], "decisions": [{"finding": "眼瞼紅腫伴痛性眼球運動或突眼", "interpretation": "深部眼眶侵犯的可能性提高。", "nextStep": "立即評估視功能、眼眶／鼻竇影像與眼科及耳鼻喉合作。"}, {"finding": "治療中視力下降或新出現RAPD", "interpretation": "提示視神經受威脅，不能只等抗生素滿固定天數。", "nextStep": "立即重新評估感染控制及引流等介入需要。"}], "sourceIds": ["n08-orbital"]}, {"id": "u2", "title": "同樣突眼，不同機轉：組織變多或靜脈排不出去", "sectionIndexes": [4, 5, 6, 7, 8], "deepDiveIndexes": [], "showFigure": false, "synthesis": ["甲狀腺眼病可把問題分成兩端：向前的位移及眼瞼後縮使角膜暴露，後方組織在眶尖擁擠則可傷及視神經。前端要看閉合與染色，後端要看色覺、視野、視力與瞳孔；同一病人可能同時有兩種問題，因此用突眼程度當唯一嚴重度指標會漏掉視功能威脅。", "頸動脈海綿竇瘻使高壓血流進入靜脈系統，眼眶靜脈鬱血可共同造成突眼、結膜血管變粗及眼壓升高。把這些表現串成一個血流機轉，比逐項當成結膜炎、青光眼與斜視更合理；但慢流量病變不一定有完整典型三徵。診斷仍須適當血管影像，不能靠有無明顯雜音單獨確認或排除。"], "decisions": [{"finding": "TED病人色覺變差，外觀突眼並不突出", "interpretation": "外觀與眶尖壓迫不是同一量測，須懷疑視神經病變。", "nextStep": "緊急視功能、眼眶影像與專科評估，同時檢查角膜保護。"}, {"finding": "持續紅眼合併螺旋血管、突眼與複視", "interpretation": "考慮靜脈鬱血及CCF，而非僅眼表感染。", "nextStep": "依視功能與病程安排神經血管評估，確認是否需介入。"}], "sourceIds": ["n08-ted-integrated", "n08-ccf-integrated"]}, {"id": "u3", "title": "流淚的來源與出口：先定位，再選處置", "sectionIndexes": [9, 10, 11], "deepDiveIndexes": [1, 2], "showFigure": false, "synthesis": ["排淚需入口存在、管道通暢與眼瞼動作共同配合；先看淚點是否貼住眼球，再看眼表刺激、淚液滯留及分泌物位置。染色消退反映整體排出效率，灌洗則在外加壓力下測通道，兩者回答的問題並不完全相同，因此『沖得通』仍須和症狀及眼瞼功能對照。", "內眥下方紅腫提示淚囊附近病變，並未自動排除向眼眶延伸的感染；同一次就診仍要檢查眼球功能。急性感染控制與後續處理阻塞是兩階段目標，不能只因找到出口問題便直接排重建。若病灶位置、質地或血性分泌物不典型，應重新檢查而非反覆套用單純阻塞的名稱。"], "decisions": [{"finding": "流淚但淚點位置異常，或眼表有刺激", "interpretation": "可能涉及入口、淚泵或反射性分泌，未必是鼻淚管阻塞。", "nextStep": "先完整檢查眼表與眼瞼，再選擇通道定位檢查。"}, {"finding": "淚囊區腫痛合併複視或運動疼痛", "interpretation": "可能不只局限在淚囊，須排眶內延伸。", "nextStep": "緊急影像及專科處理感染，不以單純局部藥物結案。"}], "sourceIds": ["n08-punctal", "n08-lacrimal-video", "n08-dacryo", "n08-orbital"]}], "case": {"title": "紅腫眼皮背後的深度", "stem": "10歲孩子感冒後右眼皮紅腫，家長說今天沒有發燒，想拿點眼藥回家。以下為虛構教學病例。", "steps": [{"newInfo": "抬眼會痛且出現複視，右眼略向前突出。", "prompt": "哪些資訊比體溫更會改變處置？", "answer": "痛性運動、複視與突眼提示眶內侵犯；立即查視力、瞳孔及運動並安排緊急專科評估。", "rationale": "病變深度由受影響的構造推測，無發燒不足以排除深部感染。", "sourceIds": ["n08-orbital"]}, {"newInfo": "影像顯示鼻竇炎及內側眶骨膜下膿瘍，已住院接受靜脈抗菌治療。", "prompt": "除了膿瘍大小，還要連續追蹤什麼？", "answer": "視力、色覺、RAPD、運動、疼痛及全身狀況，由眼科與耳鼻喉共同評估引流需要。", "rationale": "處置取決於視功能、感染範圍與臨床反應，不能把單一年齡或影像數值當絕對規則。", "sourceIds": ["n08-orbital"]}, {"newInfo": "之後視力下降並出現新RAPD，外觀腫脹卻略減。", "prompt": "要等到預定追蹤時間再看嗎？", "answer": "不可等待；視功能惡化需要立即升級評估並重新決定緊急引流等介入。", "rationale": "表面退腫不等於視神經安全，治療成效必須以功能追蹤確認。", "sourceIds": ["n08-orbital"]}]}, "connections": [{"topicId": "notes-03", "reason": "用色覺、RAPD與眼球運動辨認眼眶病造成的神經功能損害。"}, {"topicId": "notes-11", "reason": "眼瞼閉合與淚點位置同時影響角膜保護和淚液排出。"}, {"topicId": "notes-12", "reason": "乾眼可反射性流淚，不能把流淚直接等同出口阻塞。"}]}}, "notes-09": {"deepDive": [{"heading": "解剖分類要回答「發炎主要在哪裡」", "paragraphs": ["先用前房、玻璃體、視網膜／脈絡膜定位主要發炎位置，再補上單雙眼、急慢性與復發型態。前房有少量 cells 不代表一定是前葡萄膜炎；若玻璃體才是主要病灶，分類仍偏中間型。", "Panuveitis 的重點是前房、玻璃體及視網膜／脈絡膜均有炎症，且沒有單一主要位置。黃斑水腫是可能跨類型出現的併發症，不能只因有 CME 就改分類為後葡萄膜炎。這個區分直接影響檢查範圍與治療到達的位置。"], "sourceIds": ["uve-sun", "uve-video"]}, {"heading": "從表型形成假說，再決定檢驗", "paragraphs": ["反覆、急性、單眼或交替發作的前葡萄膜炎，配合炎症性背痛、乾癬或腸道症狀，會提高 HLA-B27 相關疾病的可能性。問診不是只問「有沒有自體免疫病」，而是問晨僵、活動後是否改善、皮疹與血便等具體表現。", "HLA 或其他自體抗體陽性是線索，不能單獨建立眼部病因。應先記錄 cells、KP、黏連、眼壓與後段是否受累，再依表型選檢驗。即使第一輪全身問診陰性，復發或新系統症狀仍可能改變診斷。"], "sourceIds": ["uve-hlab27"]}, {"heading": "高眼壓的前葡萄膜炎：別只加類固醇", "paragraphs": ["單眼發炎合併明顯高眼壓、局部虹膜萎縮或角膜感覺下降，要把病毒性前葡萄膜炎放進鑑別。眼壓升高可能來自小樑炎、炎症阻塞或既有黏連；不能一律歸因於類固醇反應。", "感染性發炎不等於永遠不能用類固醇。以疱疹性前葡萄膜炎為例，專科可能同時處理病毒與炎症；危險的是未辨識感染、未處理病原就單純加強免疫抑制。角膜上皮病灶與眼壓需一起追蹤。"], "sourceIds": ["uve-hsv"]}], "oralChallenge": {"question": "單眼反覆前葡萄膜炎，這次眼壓明顯升高且有局部虹膜萎縮。如何回答「是不是類固醇點太多」？", "answer": "先釐清用藥前後時序，但不直接認定類固醇反應。高眼壓、虹膜萎縮與單眼復發也提示病毒性前葡萄膜炎；補查角膜感覺、上皮病灶、KP 與後段。由眼科依表型決定是否需房水檢測，並同時處理病原、炎症及眼壓。", "sourceIds": ["uve-hsv"]}, "resources": [{"id": "uve-sun", "title": "SUN：葡萄膜炎分類與發炎分級原始共識", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8935739/", "kind": "期刊", "provider": "SUN Working Group / American Journal of Ophthalmology", "note": "看解剖分類表；分清主要炎症位置與黃斑水腫等併發症。", "verifiedDate": "2026-10-11"}, {"id": "uve-hlab27", "title": "HLA-B27 前葡萄膜炎：後黏連實例", "url": "https://eyerounds.org/cases/334-HLA-B27-associated-Acute-Anterior-Uveitis.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "先描述裂隙燈照片的後黏連，再對照問診與後續全身疾病線索。", "verifiedDate": "2026-10-11"}, {"id": "uve-video", "title": "Introduction to Uveitis（2025）", "url": "https://morancore.utah.edu/section-09-intraocular-inflammation-and-uveitis/introduction-to-uveitis-2025/", "kind": "影片", "provider": "University of Utah · Moran CORE", "note": "住院醫師課程；帶著「定位、病因、併發症」三個問題觀看。", "verifiedDate": "2026-10-11"}, {"id": "uve-hsv", "title": "Herpes Simplex Uveitis：病毒性前炎判讀", "url": "https://eyewiki.org/Herpes_Simplex_Uveitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "重點是高眼壓、虹膜萎縮與角膜線索；專家教學頁，非正式臨床指引。", "verifiedDate": "2026-10-11"}, {"id": "uve-classification", "title": "SUN II：不同葡萄膜炎疾病的分類線索", "url": "https://eyewiki.org/SUN_II_Classification_of_Uveitides", "kind": "指南", "provider": "AAO · EyeWiki", "note": "疾病分類的教學索引；研究分類標準不能直接取代個別臨床診斷。", "verifiedDate": "2026-10-11"}, {"id": "uve-intermediate", "title": "中間型葡萄膜炎與 pars planitis", "url": "https://eyewiki.org/Intermediate_Uveitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "釐清 snowbank、snowballs、病因與黃斑水腫。", "verifiedDate": "2026-10-11"}, {"id": "uve-treatment", "title": "葡萄膜炎治療與類固醇節省策略", "url": "https://eyewiki.org/Treatment_of_Uveitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "按感染、部位、活動度與風險選治療；非通用升階處方。", "verifiedDate": "2026-10-11"}, {"id": "uve-adalimumab", "title": "Adalimumab 與免疫調節治療", "url": "https://eyewiki.org/Adalimumab", "kind": "指南", "provider": "AAO · EyeWiki", "note": "理解 anti-TNF 的作用、適應疾病及感染篩查，不把同類藥視為可互換。", "verifiedDate": "2026-10-11"}, {"id": "uve-so", "title": "交感性眼炎：創傷史與現代處理", "url": "https://eyewiki.org/Sympathetic_Ophthalmia", "kind": "指南", "provider": "AAO · EyeWiki", "note": "預防性摘除有爭議；不能把所有嚴重創傷都等同眼球摘除。", "verifiedDate": "2026-10-11"}, {"id": "uve-masquerade", "title": "Uveitis masquerade：腫瘤與非腫瘤模仿者", "url": "https://eyewiki.aao.org/Uveitis_Masquerade_Syndromes", "kind": "指南", "provider": "AAO · EyeWiki", "note": "持續非典型玻璃體細胞或治療反應不合時，重新檢查病因。", "verifiedDate": "2026-10-11"}, {"id": "uve-arn", "title": "急性視網膜壞死 ARN", "url": "https://eyewiki.org/Acute_retinal_necrosis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "周邊壞死、閉塞性血管炎與明顯炎症；疑似時不等檢測才啟動治療評估。", "verifiedDate": "2026-10-11"}, {"id": "uve-porn", "title": "PORN：免疫抑制與快速壞死", "url": "https://eyewiki.org/Progressive_Outer_Retinal_Necrosis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "少量炎症不代表感染輕微；與 ARN 比較宿主及眼底進展。", "verifiedDate": "2026-10-11"}, {"id": "uve-hiv", "title": "HIV 的眼部疾病與免疫恢復性葡萄膜炎", "url": "https://eyewiki.org/Ocular_Involvement_in_HIV/AIDS", "kind": "指南", "provider": "AAO · EyeWiki", "note": "區分活動 CMV retinitis 與免疫重建後的炎症。", "verifiedDate": "2026-10-11"}, {"id": "uve-tb", "title": "眼結核：檢驗證據與病因推論", "url": "https://eyewiki.org/Tuberculosis_Uveitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "IGRA 陽性與眼內 PCR 陰性都需要配合表型解讀。", "verifiedDate": "2026-10-11"}, {"id": "uve-white-dots", "title": "白點症候群：MEWDS 與鑑別索引", "url": "https://eyewiki.org/Multiple_Evanescent_White_Dot_Syndrome", "kind": "指南", "provider": "AAO · EyeWiki", "note": "依側別、病灶層次、病程與影像區別各類白點病，而非統称病毒感染。", "verifiedDate": "2026-10-11"}, {"id": "uve-fuchs", "title": "Fuchs 葡萄膜炎症候群", "url": "https://eyewiki.org/Fuchs_Heterochromic_Iridocyclitis_and_Secondary_Glaucoma", "kind": "指南", "provider": "AAO · EyeWiki", "note": "慢性低度前炎、星狀 KP 與繼發青光眼的辨識。", "verifiedDate": "2026-10-11"}, {"id": "uve-toxo", "title": "眼弓漿蟲：臨床表型、宿主與治療", "url": "https://eyewiki.org/Toxoplasmosis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "病灶位置與宿主決定治療；抗體陽性不能單獨診斷活動病。", "verifiedDate": "2026-10-11"}, {"id": "uve-injection", "title": "眼內注射：無菌與消毒原則", "url": "https://eyewiki.org/Intravitreal_Injections", "kind": "指南", "provider": "AAO · EyeWiki", "note": "專項核對眼表消毒、接觸與術後警訊；非自行操作指南。", "verifiedDate": "2026-10-11"}, {"id": "uve-icbd", "title": "ICBD原始多國分類研究", "url": "https://pubmed.ncbi.nlm.nih.gov/23441863/", "kind": "期刊", "provider": "International Team for the Revision of the ICBD", "note": "原始計分研究；分類框架仍需配合臨床排除模仿者。", "verifiedDate": "2026-10-11"}], "figure": {"type": "uveitis-anatomy", "title": "依主要發炎位置分類", "caption": "原創概念圖：前房 → anterior；玻璃體 → intermediate；視網膜／脈絡膜 → posterior。Panuveitis 需多區發炎且無主要位置；不以 CME 單獨分類。", "alt": "表格對照前房、玻璃體與視網膜／脈絡膜三個發炎區域，列出前、中間型、後及全葡萄膜炎的主要或共同受累位置。", "sourceIds": ["uve-sun"]}, "integrated": {"framing": "把葡萄膜炎當成一個需要定位、找原因並追蹤損傷的症候群；每次回診都重新判斷發炎、感染與眼壓之間的關係。", "objectives": ["用主要發炎位置建立分類，同時另記視力受損原因。", "從宿主、發作時序與眼部表型選擇病因檢查。", "說明控制病原、發炎與併發症為何必須並行。"], "units": [{"id": "u1", "title": "先定位：炎症在哪裡，視力為何下降？", "sectionIndexes": [0, 1, 2, 4], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["分類是一張檢查地圖，而不是病因答案。先把前房細胞、玻璃體混濁及視網膜／脈絡膜病灶分開描述，找出主要炎症所在；少量「陪同出現」的細胞不應蓋過真正主病灶。再補單雙眼與病程，才能比較不同回診或向另一位醫師清楚交班。", "分類與視功能必須分兩欄思考：前房炎症減少，視力卻沒有改善，應主動尋找黃斑、晶狀體、視神經或壓力問題。讀圖先定位，再問此處病灶能否解釋實測視力；解釋不了的差距，正是補做後段檢查與影像的理由。"], "decisions": [{"finding": "前房僅少量細胞，玻璃體卻明顯發炎", "interpretation": "主要位置可能在中間段，不能只按裂隙燈最先看見的徵象命名。", "nextStep": "完成散瞳後段檢查，記錄是否有視網膜／脈絡膜主病灶。"}, {"finding": "前房逐漸安靜，中央視力仍不佳", "interpretation": "「炎症下降」與「視功能恢復」不是同一個終點。", "nextStep": "重測視力、眼壓並檢查晶狀體及黃斑；按所見安排OCT。"}], "sourceIds": ["uve-sun", "uve-video"]}, {"id": "u2", "title": "再找原因：讓表型決定檢驗順序", "sectionIndexes": [6, 7, 8, 9, 10], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["病因推理應能被新資料修正。反覆前炎與炎症性背痛形成一組假說；單眼高眼壓與局部虹膜萎縮則形成另一組。兩者都需要眼部檢查與全身問診支持，不因一張HLA陽性報告就停止鑑別，也不把沒有已知免疫病當成排除條件。", "每開一項檢查，先說清陽性與陰性將如何改變下一步。檢驗前機率低時，偶然陽性可能使治療走錯方向；因此問清免疫狀態、外傷手術、感染暴露與新全身症狀很重要。首次問診陰性只是當時資訊，復發時仍需更新，不能複製上次答案。"], "decisions": [{"finding": "反覆前炎伴晨僵或血便", "interpretation": "眼部發作可能是全身炎症疾病的一部分，症狀比單一抗體更能形成方向。", "nextStep": "針對脊椎關節與腸道病史檢查，按表型協調相關專科。"}, {"finding": "單眼前炎、明顯高眼壓與虹膜萎縮", "interpretation": "病毒性前葡萄膜炎的可能性提高，但表型尚不能指定唯一病原。", "nextStep": "補角膜感覺與上皮檢查，由專科決定是否需房水檢測。"}], "sourceIds": ["uve-hlab27", "uve-hsv"]}, {"id": "u3", "title": "追蹤三個終點：炎症、壓力與組織損傷", "sectionIndexes": [3, 5, 11], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["同樣高眼壓，可以是小樑炎、發炎物阻塞、黏連閉角或治療後的類固醇反應。推論要依起始眼壓、用藥時間、前房形態及隅角結果拆解；只把降壓藥加上去，未必解決房水流出受阻的根源。前炎也可能低眼壓，因此正常或偏低數值不能排除活動性炎症。", "治療計畫要寫出各自目的：病原治療處理感染，抗發炎控制組織反應，睫狀肌麻痺與其他措施降低疼痛或黏連風險，再監測眼壓和視力。改善後仍需按病程調整與追蹤；短暫退紅既不能證明病因已清除，也不能保證沒有藥物併發症。"], "decisions": [{"finding": "第一次類固醇前眼壓已高", "interpretation": "時序不支持把全部高眼壓歸因於這次類固醇。", "nextStep": "回頭確認小樑炎、病毒表型與隅角狀態，同時處理眼壓。"}, {"finding": "症狀減輕但出現新的眼壓升高", "interpretation": "疾病與治療都可能改變壓力，不能只以主觀舒服判定穩定。", "nextStep": "比較連續眼壓、cells與用藥紀錄，依專科判斷調整。"}], "sourceIds": ["uve-hsv", "uve-hlab27"]}], "case": {"title": "反覆紅眼，這次壓力特別高", "stem": "以下為虛構教學情境。一名成人因左眼畏光與霧視就診；過去曾有同眼類似發作，這次尚未自行點藥。", "steps": [{"newInfo": "左眼視力下降，前房有cells與KP；右眼安靜。", "prompt": "目前能下到哪一層診斷？還缺什麼？", "answer": "可先描述急性單眼前段發炎；需量眼壓、看角膜及後段，確認主要位置和視力下降原因。", "rationale": "把解剖診斷與病因診斷分開，才能避免看見cells便直接稱自體免疫炎症。", "sourceIds": ["uve-sun", "uve-video"]}, {"newInfo": "眼壓明顯升高，局部虹膜萎縮且角膜感覺較差；沒有典型樹枝狀潰瘍。", "prompt": "哪個假說上升？缺少潰瘍能排除嗎？", "answer": "病毒性前炎疑慮增加；沒有典型角膜潰瘍仍不能排除。由眼科決定是否取房水等檢查，同步處理壓力。", "rationale": "不同眼部組織不一定同時顯示典型表徵；應整合證據，而非要求每個教科書徵象都出現。", "sourceIds": ["uve-hsv"]}, {"newInfo": "專科已依感染性前炎方向治療，數日後疼痛減少。", "prompt": "追蹤時你要報告哪些資料，才能判定真正改善？", "answer": "比較視力、前房cells、角膜狀態與眼壓，記錄用藥及遵從性；持續視力不佳則追查黃斑等併發症。", "rationale": "症狀改善是其中一項證據；病原、炎症與壓力的變化不必同步，需分別確認。", "sourceIds": ["uve-hsv", "uve-hlab27"]}]}, "connections": [{"topicId": "notes-07", "reason": "用房水生成、流出與隅角機轉解釋發炎時的高低眼壓。"}, {"topicId": "notes-10", "reason": "把CME、血管炎與漿液性剝離放回後段定位。"}, {"topicId": "notes-13", "reason": "區分類固醇治療效益、感染風險及眼壓副作用。"}]}}, "notes-10": {"deepDive": [{"heading": "從牽引、裂孔到剝離：用機轉解釋閃光與幕簾", "paragraphs": ["玻璃體液化與後玻璃體分離本身不等於視網膜剝離；危險出現在仍黏附的部位產生牽引並形成裂孔，液體再經裂孔進入神經視網膜與 RPE 之間。這也解釋為何急性閃光、飛蚊與出血需要周邊視網膜評估。", "看到剝離時先問三件事：有沒有裂孔、是否有牽拉膜、液體是否來自滲漏。再確認黃斑／中心凹是否仍貼附。中央視力好不能排除周邊剝離；OCT 可補充中心凹狀態，但不能取代完整周邊眼底檢查。"], "sourceIds": ["ret-rd-atlas", "ret-rd-video"]}, {"heading": "糖尿病視網膜：滲漏與缺血是兩條問題軸", "paragraphs": ["微血管受損可造成滲漏與黃斑水腫，也可導致缺血並刺激脆弱的新生血管。前者主要影響黃斑結構與中央視力；後者可引起玻璃體出血、纖維化與牽引性剝離。不能把「黃斑有水」直接當作已進入增殖期。", "說明治療時，把目標說清楚：控制漏液、降低新生血管活動，或處理出血與牽拉。眼底照片提供分布與分期線索，黃斑影像回答中央視力下降是否伴結構改變；全身代謝及血壓控制則與眼部治療並行。"], "sourceIds": ["ret-dr"]}, {"heading": "視網膜動脈阻塞：診斷之外，還要改變分流", "paragraphs": ["CRAO 是內層視網膜的急性缺血性事件。突然、無痛、嚴重單眼視力下降與 RAPD，需立即納入鑑別，不能因眼睛不紅而降低急迫性。", "懷疑 CRAO 應迅速送急診／中風團隊；眼球按摩等未證實有效的措施不能延誤分流。後續要處理血管病因與再發預防，並非眼底病名確認就結束。"], "sourceIds": ["ret-crao"]}], "oralChallenge": {"question": "病人新出現大量飛蚊與閃光，但視力仍為 1.0。你會如何解釋為何不能只觀察？", "answer": "視力表主要反映中央視覺，不能排除周邊裂孔或尚未影響黃斑的剝離。需要及時完整散瞳眼底評估，留意出血與裂孔；若出現幕簾或視野缺損，更屬警訊。檢查後的追蹤由裂孔、出血與個別風險決定。", "sourceIds": ["ret-rd-atlas", "ret-rd-video"]}, "resources": [{"id": "ret-rd-atlas", "title": "視網膜剝離：眼底、OCT 與 B-scan 對照", "url": "https://www.eyerounds.org/tutorials/retinal-detachment-med-students/", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "依序辨認視網膜層次、剝離邊界與中心凹是否受累；舊教學中的手術時程須依現行個案評估。", "verifiedDate": "2026-10-11"}, {"id": "ret-rd-video", "title": "Retinal Detachment & Peripheral Abnormalities", "url": "https://morancore.utah.edu/section-12-retina-and-vitreous/retinal-detachment/", "kind": "影片", "provider": "University of Utah · Moran CORE", "note": "看周邊病灶與剝離的差異；觀看後用機轉解釋三種剝離。", "verifiedDate": "2026-10-11"}, {"id": "ret-dr", "title": "糖尿病視網膜病變：滲漏、新生血管與治療目的", "url": "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/diabetic-retinopathy", "kind": "指南", "provider": "NIH · National Eye Institute", "note": "官方教育頁；練習用病人聽得懂的語言解釋黃斑水腫與增殖病變。",
