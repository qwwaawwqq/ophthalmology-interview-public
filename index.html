ce", "title": "FCE：影像、追蹤與併發症", "url": "https://eyewiki.aao.org/Focal_Choroidal_Excavation_%28FCE%29", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "支持無症狀凹陷的觀察，以及合併新生血管或積液時的分層處理。", "verifiedDate": "2026-10-11"}, {"id": "ret-macular-hole", "title": "黃斑孔：分期與治療", "url": "https://eyewiki.aao.org/Macular_Hole", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "支持依分期、功能與病程選擇觀察或玻璃體切除、填充及內界膜處理。", "verifiedDate": "2026-10-11"}, {"id": "ret-vmt", "title": "VMT：觀察與解除牽引", "url": "https://eyewiki.aao.org/Vitreomacular_Traction_Syndrome", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "支持以黃斑形態與症狀判斷牽引，並依功能影響選擇觀察或解除牽引。", "verifiedDate": "2026-10-11"}, {"id": "ret-erm", "title": "ERM：功能影響與手術選擇", "url": "https://eyewiki.org/Epiretinal_Membrane", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "支持症狀、視功能與病程導向的觀察或玻璃體切除合併膜剝除。", "verifiedDate": "2026-10-11"}, {"id": "ret-uveal-melanoma", "title": "葡萄膜黑色素瘤：局部放療與分期", "url": "https://eyewiki.org/Management_of_Choroidal_Melanoma_and_Ciliary_Body_Melanoma", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "支持依腫瘤位置、大小及眼部條件評估局部放射治療與其他治療。", "verifiedDate": "2026-10-11"}, {"id": "ret-endophthalmitis", "title": "眼內炎：急性、慢性與內生性感染", "url": "https://eyewiki.org/Endophthalmitis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "支持術後及內生性感染鑑別、慢性低度發炎，以及無痛仍不能排除感染。", "verifiedDate": "2026-10-11"}, {"id": "ret-suprachoroidal", "title": "脈絡膜上腔出血：辨識與緊急處理", "url": "https://eyewiki.org/Suprachoroidal_Hemorrhage", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "支持術中或術後早期辨識、B超追蹤與緊急專科處理。", "verifiedDate": "2026-10-11"}, {"id": "ret-submacular-hemorrhage", "title": "黃斑下出血：治療選項與證據", "url": "https://eyewiki.org/Management_of_Submacular_Hemorrhage", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "補充出血範圍、病程、病因與治療選擇的綜合判斷。", "verifiedDate": "2026-10-11"}, {"id": "ret-tpa", "title": "tPA：眼科適應情境與限制", "url": "https://eyewiki.aao.org/Tissue_Plasminogen_Activator", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "直接支持黃斑下出血的tPA應用與出血風險；並非所有黃斑出血皆適用。", "verifiedDate": "2026-10-11"}], "figure": {"type": "retina-layers", "title": "視網膜層次與雙重血流", "caption": "原創概念圖：內層視網膜主要由視網膜循環供血，感光細胞等外層主要依靠脈絡膜。由玻璃體側到 RPE／脈絡膜的層次，幫助區分病灶位置；圖中簡化排列，不是比例解剖圖。", "alt": "由玻璃體到脈絡膜的視網膜層次圖，分別標示內層視網膜循環與外層脈絡膜循環。", "sourceIds": ["ret-rd-atlas"]}, "integrated": {"framing": "先問病灶影響哪一層、由哪個機轉造成，再選影像與處置；中央視力、周邊完整性和全身血管風險必須分開判斷。", "objectives": ["把影像所見轉成位置、機轉與功能後果。", "區分牽引、裂孔、漏液和缺血，說出各自治療目標。", "遇到新飛蚊或突發無痛下降，明確說出緊急分流。"], "units": [{"id": "u1", "title": "讀影像前：建立層次與功能地圖", "sectionIndexes": [0, 1, 9, 10], "deepDiveIndexes": [], "showFigure": true, "synthesis": ["眼底照片、OCT與病人的視覺表現是不同尺度的資訊。照片幫助描述病灶分布，切面影像幫助定位組織界面；兩者都應回到「這個所見能解釋症狀嗎」。若中央視力很好卻有周邊幕簾，不能因黃斑影像漂亮就認為整個視網膜安全。", "檢查不是越多越好，而要解決目前的缺口：周邊是否有裂孔、中央是否貼附，或介質混濁後方是否剝離，是三個不同問題。學習兒童與遺傳性疾病時也保留同一習慣：先描述時間、分布與功能，再用年齡、家族史和專科檢查縮小原因。"], "decisions": [{"finding": "視力表表現良好，但主訴周邊陰影", "interpretation": "中央功能與周邊結構可能不同步。", "nextStep": "分眼測視野並及時完整散瞳檢查，不能只做黃斑OCT。"}, {"finding": "玻璃體出血使眼底看不清", "interpretation": "「未看見裂孔」可能只是可視範圍不足。", "nextStep": "由專科補B-scan等適當檢查並安排後續周邊評估。"}], "sourceIds": ["ret-rd-atlas", "ret-rd-video", "ret-rd-nei"]}, {"id": "u2", "title": "機械問題：從牽引到裂孔與剝離", "sectionIndexes": [2, 5, 6, 8], "deepDiveIndexes": [0], "showFigure": false, "synthesis": ["把三類剝離想成三種需要解決的問題：裂孔提供液體通道、纖維組織施加拉力、滲漏造成液體累積。治療必須對準主因；僅看到「視網膜下有液體」還不足以決定雷射或手術。玻璃體與黃斑介面問題則提醒我們，牽引也可能集中於中央，未必以周邊裂孔呈現。", "急性飛蚊的安全判斷依靠完整檢查和後續警訊，而非症狀名稱本身。第一次沒有找到裂孔，代表此時此範圍尚未發現；若幕簾、閃光或視力改變，必須重新評估。確認剝離後，是否累及中心凹會影響迫切性與預後討論，不能等中央視力掉下來才轉介。"], "decisions": [{"finding": "急性飛蚊、閃光加玻璃體出血", "interpretation": "牽引性裂孔的疑慮提高；出血也可能遮住病灶。", "nextStep": "及時視網膜評估，依可視性選擇檢查與密切追蹤。"}, {"finding": "已見裂孔與剝離，但中心凹仍貼附", "interpretation": "中央功能尚在並非低風險，反而有需要保護的視覺。", "nextStep": "立即聯絡視網膜團隊安排及時處理，交代進展警訊。"}], "sourceIds": ["ret-rd-atlas", "ret-rd-video", "ret-rd-nei"]}, {"id": "u3", "title": "血管問題：漏液、缺血與急性分流", "sectionIndexes": [3, 4, 7, 11], "deepDiveIndexes": [1, 2], "showFigure": false, "synthesis": ["糖尿病眼底的出血、水腫與新生血管不能排成一條必然順序。回答時把兩個問題拆開：黃斑有沒有影響中央功能的液體；有沒有缺血驅動的新生血管及其併發症。這能解釋為何同一病人需要不同檢查，也能避免把每一次視力下降都當成相同治療目標。", "血管病名還要連到分流。視網膜動脈急性阻塞牽涉缺血時程與全身中風風險，不能等所有影像湊齊才求援；靜脈阻塞或慢性漏液也需要眼部與全身風險評估，但不能直接照搬動脈阻塞的處置。先辨認當下最急的問題，再補分期與長期計畫。"], "decisions": [{"finding": "黃斑水腫，但未見新生血管", "interpretation": "漏液與增殖病變是不同判斷，不能因水腫直接定為PDR。", "nextStep": "確認黃斑結構、視力及完整眼底分期，依結果討論治療。"}, {"finding": "突然嚴重無痛單眼下降，伴RAPD與視網膜蒼白", "interpretation": "高度擔心急性視網膜缺血，診斷同時具有全身急症意義。", "nextStep": "記錄最後正常時間，立即急診／中風評估，不以按摩拖延。"}], "sourceIds": ["ret-dr", "ret-crao"]}], "case": {"title": "看得到1.0，為何仍然緊急？", "stem": "以下為虛構教學情境。一名近視成人今天突然出現右眼大量飛蚊與閃光，目前仍能閱讀小字。", "steps": [{"newInfo": "分眼量測右眼視力1.0，沒有明顯疼痛或充血。", "prompt": "哪些結果不能用來排除危險？", "answer": "視力好與不痛均不能排除周邊裂孔或剝離；需要及時散瞳周邊檢查。", "rationale": "這是中央功能與周邊結構的資訊落差，不是病人描述與視力表互相矛盾。", "sourceIds": ["ret-rd-atlas", "ret-rd-nei"]}, {"newInfo": "眼底出現上方馬蹄形裂孔及相鄰隆起視網膜；病人補充下方有陰影。", "prompt": "把形態、症狀與機轉串成一句話。", "answer": "玻璃體牽引形成裂孔，液體經裂孔進入視網膜下造成裂孔性剝離；上方病灶可對應下方視野缺損。", "rationale": "形態支持液體通道的存在，視野方向又提供空間上的一致性；仍需確認剝離範圍與中心凹狀態。", "sourceIds": ["ret-rd-atlas", "ret-rd-video", "ret-rd-nei"]}, {"newInfo": "中心凹仍貼附，病人想等下週休假再處理。", "prompt": "你如何解釋下一步，而不保證某種手術結果？", "answer": "應立即由視網膜團隊安排及時治療評估；目前中央視力尚好正是需要保護的功能，等候可能讓剝離擴大。", "rationale": "交班要包含側別、發病時間、裂孔與剝離範圍、中心凹狀態；術式由個案解剖與團隊決定。", "sourceIds": ["ret-rd-atlas", "ret-rd-video", "ret-rd-nei"]}]}, "connections": [{"topicId": "notes-03", "reason": "利用RAPD與視野區分嚴重視網膜病變和視神經／視路問題。"}, {"topicId": "notes-09", "reason": "將滲出性剝離、CME與葡萄膜炎連結，避免只按液體外觀治療。"}, {"topicId": "notes-14", "reason": "把眼底辨識轉成急性視力下降的口試交班。"}]}}, "notes-11": {"deepDive": [{"heading": "眼瞼下垂的量測，必須先排除代償", "paragraphs": ["額肌抬眉與抬下巴會掩蓋真正下垂程度。先讓病人頭位端正、眉部放鬆，測量上眼瞼緣到角膜光反射的 MRD1；量提上瞼肌功能時固定眉毛，再測下視至上視的眼瞼位移。", "眼瞼摺痕、提肌功能、發作時間與波動性共同提供病因線索。隨疲勞明顯波動要考慮神經肌肉接合問題；伴瞳孔或眼球運動異常時，不能只以老化性下垂規劃手術。"], "sourceIds": ["n11-ptosis", "n11-exam-video"]}, {"heading": "功能性眼整形，先保護角膜", "paragraphs": ["閉眼不全與眨眼減少會使淚膜保護不足，造成暴露性角膜病變。鎮靜、插管或無法表達症狀的患者尤其容易被忽略；即使病人沒有喊痛，也要檢查眼瞼閉合與角膜染色。", "處理重點是恢復眼表保護，例如規律潤滑及依情況協助閉合或保濕，並追蹤角膜上皮。已有上皮缺損、浸潤或視力變化，應由眼科評估感染等併發症；單純把眼皮貼住而未檢查角膜，不等於完成照護。"], "sourceIds": ["n11-exposure"]}, {"heading": "反覆『霰粒腫』要想偽裝成發炎的腫瘤", "paragraphs": ["皮脂腺癌可能表現為反覆眼瞼結節，或久治不癒的單側眼瞼結膜炎。較晚年齡新出現、反覆或治療反應不佳的『霰粒腫』，需要重新評估病史與整個眼瞼、結膜，而非無限重複同一治療。", "診斷需依專科評估取得組織；外觀像良性發炎並不能排除惡性。口試回答應說明『為何懷疑、要檢查哪些範圍、如何取得確診』，不要只列出腫瘤名稱或直接承諾用局部處置就能治癒。"], "sourceIds": ["n11-sebaceous"]}], "oralChallenge": {"question": "高齡患者同一上眼瞼的『霰粒腫』反覆復發，並有長期單側眼瞼結膜炎，下一步是什麼？", "answer": "需提高對皮脂腺癌等偽裝病變的懷疑，重新檢查眼瞼與結膜、回顧以往治療及病理，轉眼整形評估適當組織取樣。重點是取得診斷，而非再把它當作一般發炎結節反覆治療。", "sourceIds": ["n11-sebaceous"]}, "resources": [{"id": "n11-ptosis", "title": "Ptosis 圖解：解剖、量測與鑑別", "url": "https://eyerounds.org/tutorials/Ptosis/", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "觀察 MRD、提肌功能與不同病因的眼瞼外觀；教學綜述。", "verifiedDate": "2026-10-11"}, {"id": "n11-exam-video", "title": "眼瞼外觀與功能量測影片", "url": "https://eyerounds.org/atlas-video/external-examination.htm", "kind": "影片", "provider": "University of Iowa · Richard Allen", "note": "1 分 12 秒示範 MRD、眼裂、提肌功能、眼瞼鬆弛及眉位。", "verifiedDate": "2026-10-11"}, {"id": "n11-exposure", "title": "重症患者暴露性角膜病變", "url": "https://www.eyerounds.org/cases/189-exposure-keratopathy.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "臨床病例與眼表保護策略，連結眼瞼功能與 ICU 照護。", "verifiedDate": "2026-10-11"}, {"id": "n11-sebaceous", "title": "皮脂腺癌：偽裝成眼瞼發炎的病例", "url": "https://www.eyerounds.org/cases/62-Sebaceous-Cell-Carcinoma-Eyelid-Masquerade-Syndrome.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "對照臨床及病理圖片，辨認反覆結節與難治性單側發炎的警訊。", "verifiedDate": "2026-10-11"}, {"id": "n11-mg-integrated", "title": "眼肌型重症肌無力：動態徵象與陰性抗體的限制", "url": "https://eyewiki.aao.org/Myasthenia_Gravis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "整合疲勞性下垂、抗體及電生理；留意眼肌型可血清陰性，以及全身症狀需要升級評估。", "verifiedDate": "2026-10-11"}, {"id": "n11-reconstruction-coverage", "title": "眼瞼重建：前後層、皮瓣與移植物", "url": "https://eyewiki.aao.org/Eyelid_Reconstruction", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "比較 Tenzel、Hughes、Cutler-Beard 等重建概念。", "verifiedDate": "2026-10-11"}, {"id": "n11-hzo-coverage", "title": "眼部帶狀皰疹：皮膚與眼內評估", "url": "https://eyewiki.aao.org/Herpes_Zoster_Ophthalmicus", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "抗病毒藥名為 valacyclovir；皮疹時間不能單獨決定停止眼科評估。", "verifiedDate": "2026-10-11"}, {"id": "n11-hemangioma-coverage", "title": "嬰兒眼周血管瘤與視覺發育", "url": "https://patients.aapos.org/glossary/capillary-hemangioma", "kind": "指南", "provider": "AAPOS", "note": "需監測屈光與弱視；威脅視覺時 β 阻斷劑是重要治療。", "verifiedDate": "2026-10-11"}, {"id": "n11-tepezza-coverage", "title": "TEPEZZA 美國 FDA 仿單", "url": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761143s031lbl.pdf", "kind": "指南", "provider": "U.S. FDA", "note": "適應症不受 TED 活性或病程限制；個別治療仍需評估風險與所在地可用性。", "verifiedDate": "2026-10-11"}, {"id": "n11-scc-coverage", "title": "眼瞼鱗狀細胞癌", "url": "https://eyewiki.aao.org/Squamous_Carcinoma_of_the_Eyelid", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "癌前變化、周邊神經侵犯及組織診斷。", "verifiedDate": "2026-10-11"}, {"id": "n11-filler-coverage", "title": "皮膚填充物的血管與視力風險", "url": "https://www.fda.gov/medical-devices/aesthetic-cosmetic-devices/dermal-fillers-soft-tissue-fillers", "kind": "指南", "provider": "U.S. FDA", "note": "視力變化、皮膚缺血或神經症狀需要立即醫療處理。", "verifiedDate": "2026-10-11"}, {"id": "n11-bcc-coverage", "title": "基底細胞癌：結節與硬化型的邊界", "url": "https://eyewiki.aao.org/Basal_Cell_Carcinoma", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "病理確診與切緣控制，注意內眥深部侵犯。", "verifiedDate": "2026-10-11"}, {"id": "n11-melanoma-coverage", "title": "眼瞼黑色素瘤：外觀與分期", "url": "https://eyewiki.aao.org/Malignant_Melanoma_of_the_Eyelid", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "無色素型亦可能惡性，依病理與分期決定處理。", "verifiedDate": "2026-10-11"}, {"id": "n11-entropion-coverage", "title": "眼瞼內翻與倒睫的機轉", "url": "https://eyewiki.aao.org/Entropion", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "內翻分型、眼表傷害與睫毛異常的區分。", "verifiedDate": "2026-10-11"}, {"id": "n11-ectropion-coverage", "title": "眼瞼外翻的四類原因", "url": "https://eyewiki.aao.org/Ectropion", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "水平鬆弛、瘢痕、機械與麻痺型機轉。", "verifiedDate": "2026-10-11"}, {"id": "n11-beb-coverage", "title": "原發性眼瞼痙攣", "url": "https://eyewiki.aao.org/Blepharospasm", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "雙側閉眼痙攣、局部肉毒毒素與手術的角色。", "verifiedDate": "2026-10-11"}, {"id": "n11-hfs-coverage", "title": "半面痙攣與神經血管壓迫", "url": "https://eyewiki.aao.org/Hemifacial_Spasm", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "單側分布、繼發病因與減壓／症狀治療。", "verifiedDate": "2026-10-11"}, {"id": "n11-botox-coverage", "title": "BOTOX 美國處方標示", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=33d066a9-34ff-4a1a-b38b-d10983df3300", "kind": "指南", "provider": "DailyMed · U.S. National Library of Medicine", "note": "SNAP-25 作用、產品單位不可互換及神經肌肉相關風險。", "verifiedDate": "2026-10-11"}, {"id": "n11-myobloc-coverage", "title": "MYOBLOC 美國處方標示", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=675cb354-9d13-482e-8ac2-22f709c58b4f", "kind": "指南", "provider": "DailyMed · U.S. National Library of Medicine", "note": "B 型肉毒毒素切割 VAMP 的作用機轉。", "verifiedDate": "2026-10-11"}, {"id": "n11-stye-coverage", "title": "麥粒腫與感染擴散", "url": "https://eyewiki.aao.org/Stye", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "外型／內型腺體來源及何時超出局部腺體感染。", "verifiedDate": "2026-10-11"}, {"id": "n11-cellulitis-coverage", "title": "眶蜂窩組織炎的視力警訊", "url": "https://eyewiki.aao.org/Orbital_Cellulitis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "眼瞼紅腫伴眼動痛、突眼或視力下降需評估深部感染。", "verifiedDate": "2026-10-11"}, {"id": "n11-third-coverage", "title": "新發第三神經麻痺的危險鑑別", "url": "https://eyewiki.aao.org/Acquired_Oculomotor_Nerve_Palsy", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "瞳孔保留不應單獨用於排除壓迫性血管病因。", "verifiedDate": "2026-10-11"}, {"id": "n11-horner-coverage", "title": "Horner 與內頸動脈剝離", "url": "https://www.eyerounds.org/cases/305-Horner_Syndrome.htm", "kind": "指南", "provider": "University of Iowa · EyeRounds", "note": "急性痛性縮瞳下垂需及時血管評估。", "verifiedDate": "2026-10-11"}], "figure": {"type": "lid-measurement", "title": "MRD1 與提上瞼肌功能是兩種量測", "caption": "原創量測圖：MRD1 為角膜光反射至上眼瞼緣的距離；提肌功能為固定眉毛後，下視到上視的眼瞼位移。測量前須控制頭位與額肌代償。", "alt": "眼睛正面圖標示角膜光反射與上眼瞼緣之間的 MRD1，旁圖用下視及上視位置差示意提上瞼肌功能。", "sourceIds": ["n11-ptosis", "n11-exam-video"]}, "integrated": {"framing": "眼瞼是保護角膜、維持淚膜並開放視軸的動態器官。先判斷病因與保護能力，再用量測決定功能重建，而非只比較外觀高度。", "objectives": ["區分眼瞼位置、提肌行程與閉合保護三項不同功能。", "能由病程與動態變化辨認需先處理的神經或肌肉病因。", "能解釋反覆眼瞼腫塊為何有時需要病理及更廣的檢查。"], "units": [{"id": "u1", "title": "下垂先問病因：一個高度不足以決定手術", "sectionIndexes": [1, 6, 7, 8, 9], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["MRD1是眼瞼當下的位置，提肌功能是控制額肌後能移動的行程；同樣低的MRD1，可以是力量不足、連接結構改變或神經驅動異常。先把眉毛及頭位的代償拿掉，再連同皺摺、瞳孔、運動與病程判讀，才不會把不同機轉送進同一種手術。", "日內波動本身不是重症肌無力的確診，但明顯疲勞性、可變複視與不同時點的下垂型態，會使神經肌肉接點病因更值得檢查。冰敷或抗體檢查都是證據的一部分；眼肌型可能抗體陰性，不能用單項陰性結束評估。治療病因之前追求固定眼瞼高度，可能遇到病況波動而反覆失準。"], "decisions": [{"finding": "提肌行程保留，但低MRD1與較高皺摺", "interpretation": "可支持腱膜性機轉，仍須結合病程與其他檢查。", "nextStep": "評估眼表、閉合與神經徵象後，才討論合適的功能重建。"}, {"finding": "疲勞性下垂及可變複視，AChR抗體陰性", "interpretation": "不能排除眼肌型重症肌無力。", "nextStep": "轉神經眼科／神經內科整合臨床、其他抗體與必要電生理證據。"}], "sourceIds": ["n11-ptosis", "n11-exam-video", "n11-mg-integrated"]}, {"id": "u2", "title": "重建的目標是能開也能閉，並維持角膜保護", "sectionIndexes": [0, 2, 4, 5, 11], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["淚膜需要眨眼鋪展與眼瞼閉合來減少暴露；單純增加眼裂高度可能改善視軸，卻也可能增加蒸發及上皮損傷。術前不只問『提得起來嗎』，還要問『閉得回去嗎』，並看Bell現象與角膜狀態；功能改善必須連同眼表後果一起衡量。", "眼瞼外翻使淚點貼合與閉合受影響，內翻或睫毛方向異常則可反覆摩擦角膜。它們的共同結果是表面受損，原因卻不同，所以潤滑只是部分保護，仍需處理結構或動作問題。對鎮靜、無法主訴的病人，更應直接觀察閉眼及染色；沒有抱怨疼痛不能證明角膜完整。"], "decisions": [{"finding": "下垂病人同時有閉合不全與角膜染色", "interpretation": "提高眼瞼位置可能加劇暴露，須先衡量保護能力。", "nextStep": "處理眼表並調整功能目標，不只按MRD1追求高度。"}, {"finding": "ICU病人無主訴，但眨眼少且眼瞼未閉合", "interpretation": "缺少症狀回饋不代表低風險。", "nextStep": "檢查角膜、建立潤滑及閉合保護，異常時請眼科評估。"}], "sourceIds": ["n11-ptosis", "n11-exposure"]}, {"id": "u3", "title": "腫塊的時間軸：何時需要推翻原診斷", "sectionIndexes": [3, 10], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["一般霰粒腫的局部結節可以用腺體阻塞及脂質發炎解釋；若同位置反覆、睫毛消失或瞼緣架構逐漸破壞，原本的良性模型就不足以涵蓋全部資訊。診斷更新不是換一種藥，而是重新檢查病灶全貌、翻瞼、回顧過去病理，並評估重新取樣。", "皮脂腺癌可沿上皮內擴展，因而不一定只是一顆清楚的腫塊，也可能呈現久治不癒的單側眼瞼結膜炎。這解釋了為何檢查範圍不能只停在可見結節；是否需要結膜等部位取樣，應由專科依受累範圍決定。外觀提示可疑，組織則用來確認病因及指引處理。"], "decisions": [{"finding": "反覆同位霰粒腫樣結節伴脫睫", "interpretation": "需要考慮偽裝性腫瘤，不能只延用阻塞診斷。", "nextStep": "完整眼瞼及結膜檢查，評估適當病理取樣。"}, {"finding": "長期單側瞼結膜炎，常規治療反應不佳", "interpretation": "可能有超出表面發炎的病因，包含上皮內腫瘤擴展。", "nextStep": "翻瞼、核對分布與治療歷程，轉眼整形評估。"}], "sourceIds": ["n11-sebaceous"]}], "case": {"title": "下垂的量測每天都不一樣", "stem": "52歲病人要求矯正右上瞼下垂，提供的照片有時嚴重、有時幾乎正常。以下為虛構教學病例。", "steps": [{"newInfo": "病人常抬眉與抬下巴，尚未做過功能量測。", "prompt": "如何取得可比較的基準？", "answer": "控制頭位和額肌代償，測MRD1、提肌行程、瞳孔與運動，同時評估閉合與角膜。", "rationale": "照片受代償與拍攝狀態影響；位置、力量及保護功能需分開記錄。", "sourceIds": ["n11-ptosis", "n11-exam-video"]}, {"newInfo": "持續上視後下垂加重；複視方向會變，瞳孔等大。", "prompt": "哪些病因排序上升？是否已經確診？", "answer": "神經肌肉接點病因如重症肌無力更值得評估，但不能靠疲勞試驗單獨確診；暫緩固定術式規劃。", "rationale": "可變的肌肉表現與固定腱膜問題不同，但仍需整合其他證據。", "sourceIds": ["n11-ptosis", "n11-mg-integrated"]}, {"newInfo": "初次AChR抗體陰性，下垂與複視仍反覆。", "prompt": "可以結案並直接手術嗎？", "answer": "不宜；依臨床疑慮由專科評估其他抗體與必要電生理檢查，並詢問吞嚥及呼吸等全身症狀。", "rationale": "眼肌型可能血清陰性；陰性結果降低或調整機率，不能直接歸零。新發吞嚥或呼吸困難需緊急評估。", "sourceIds": ["n11-mg-integrated"]}]}, "connections": [{"topicId": "notes-03", "reason": "急性下垂的瞳孔與眼球運動證據可提示神經血管急症。"}, {"topicId": "notes-04", "reason": "兒童下垂需同時評估視軸遮蔽、屈光與弱視風險。"}, {"topicId": "notes-12", "reason": "眨眼和閉合功能決定淚膜穩定，眼表檢查需納入手術規劃。"}]}}, "notes-12": {"deepDive": [{"heading": "機轉｜乾眼是眼表恆定性失衡，不只是淚水太少", "paragraphs": ["TFOS DEWS III 將乾眼描述為伴有症狀的多因素疾病，核心是淚膜及／或眼表恆定性喪失。淚膜不穩定、高滲透壓、發炎、損傷與神經感覺異常彼此影響，因此同樣說『乾』的病人可能有不同主因。", "脂質、水液與黏蛋白／上皮界面共同維持穩定光學表面；這是連續互動的系統，不能只把它想成完全分離的三層。眨眼後短暫清楚、持續注視又模糊的時間關係，能提示淚膜對視覺品質的影響。"], "sourceIds": ["an12-dews3", "an12-ocular"]}, {"heading": "推理｜以症狀、恆定性指標與病因分型相互確認", "paragraphs": ["問診先釐清異物感、灼熱、視覺波動、環境及用眼型態，再檢查眼瞼閉合、眨眼、瞼板腺、淚河與眼表染色。淚膜破裂時間、染色與分泌測試各反映不同面向，單一數字不能取代整體診斷。", "診斷之後還要找主要驅動因素，例如水液不足、蒸發增加、眼瞼或眼表異常；混合型並不少見。若伴乾口、系統性症狀或明顯水液不足，需考慮全身疾病評估，而非只更換人工淚液品牌。"], "sourceIds": ["an12-dews3", "an12-dews2", "an12-ocular"]}, {"heading": "陷阱｜症狀與染色不一致，是重新鑑別的提示", "paragraphs": ["劇烈不適但染色輕微時，不代表患者沒有問題；需考慮神經感覺異常及其他造成眼痛的疾病。反之，角膜明顯受損卻少有不適時，應評估角膜感覺與神經營養性問題，而非把缺少症狀當成輕症。", "單眼急性疼痛、視力下降、局部角膜浸潤或明顯畏光，不應直接套入日常乾眼照護。結膜炎與乾眼可以共存，但症狀、分泌物或充血的單一特徵，都不足以排除角膜感染及眼內發炎。"], "sourceIds": ["an12-dews3", "an12-dews2"]}], "oralChallenge": {"question": "病人長時間看螢幕後視覺波動，眨眼暫時改善；自覺一直流淚，因此認為不可能乾眼。你怎麼說明與驗證？", "answer": "流淚不能排除淚膜功能失衡，刺激可誘發反射性流淚，卻未必恢復穩定眼表。我會檢查眨眼與閉合、瞼板腺、淚膜穩定性及染色，將症狀與客觀結果一起解讀；也確認沒有急性疼痛、視力下降或角膜浸潤等需要另行處理的徵象。", "sourceIds": ["an12-ocular", "an12-dews2", "an12-dews3"]}, "resources": [{"id": "an12-dews3", "title": "TFOS DEWS III：2025 診斷方法重點摘要", "url": "https://www.tearfilm.org/ckfinder/userfiles/files/15954-Alcon-Diagnostic-Summary-DIGITAL-GLOBAL.pdf", "kind": "指南", "provider": "TFOS · University of Waterloo CORE", "note": "官方提供的 6 頁新版摘要；整理定義、OSDI-6、診斷與分型，內含診斷示意圖，非臨床照片。", "verifiedDate": "2026-10-11"}, {"id": "an12-dews2", "title": "TFOS DEWS II：完整診斷方法報告", "url": "https://www.tfosdewsreport.org/report-diagnostic_methodology/131_36/en/", "kind": "期刊", "provider": "Tear Film & Ocular Surface Society", "note": "2017 基礎報告的開放全文；用於理解檢查原理與鑑別，新版分類及建議請對照 DEWS III。", "verifiedDate": "2026-10-11"}, {"id": "an12-ocular", "title": "The Ocular Surface：眼表與淚膜教學", "url": "https://morancore.utah.edu/section-08-external-disease-and-cornea/the-ocular-surface/", "kind": "影片", "provider": "University of Utah · Moran CORE", "note": "大學眼表課程影片；屬較早期教學，適合看基本機轉，治療與診斷更新請對照 DEWS III。", "verifiedDate": "2026-10-11"}, {"id": "an12-staining", "title": "乾燥性角結膜炎的 Lissamine Green 染色", "url": "https://eyerounds.org/atlas/pages/LG-staining/", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "三張真實眼表染色照片；觀察結膜受損分布，不以單張照片決定病因或嚴重度。", "verifiedDate": "2026-10-11"}, {"id": "an12-dews3-original", "title": "TFOS DEWS III：診斷方法原始共識報告（2025）", "url": "https://pubmed.ncbi.nlm.nih.gov/40451408/", "kind": "期刊", "provider": "TFOS · American Journal of Ophthalmology", "note": "以原始報告核對症狀加恆定性異常的診斷框架，以及淚膜、眼瞼、眼表與全身驅動因素。", "verifiedDate": "2026-10-11"}, {"id": "cov12-conj", "title": "結膜炎：形態、感染與過敏鑑別", "url": "https://eyewiki.org/Conjunctivitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-phlyct", "title": "皰性角結膜炎與抗原過敏反應", "url": "https://eyewiki.aao.org/Phlyctenular_Keratoconjunctivitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-slk", "title": "上輪部角結膜炎", "url": "https://eyewiki.aao.org/Superior_limbic_keratoconjunctivitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-concret", "title": "結膜結石的成分與處理", "url": "https://eyewiki.org/Conjunctival_Concretions", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-sch", "title": "結膜下出血的評估", "url": "https://eyewiki.aao.org/Subconjunctival_Hemorrhage", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-melan", "title": "結膜色素細胞病灶", "url": "https://eyewiki.org/Conjunctival_Melanocytic_Tumors", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-papilloma", "title": "結膜乳頭瘤", "url": "https://eyewiki.org/Conjunctival_Papilloma", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-sjs", "title": "SJS／TEN 的眼表侵犯", "url": "https://eyewiki.aao.org/Stevens-Johnson_Syndrome", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-cdc-gono", "title": "CDC：新生兒淋菌感染", "url": "https://www.cdc.gov/std/treatment-guidelines/gonorrhea-neonates.htm", "kind": "指南", "provider": "CDC", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-cdc-chlam", "title": "CDC：披衣菌感染與新生兒結膜炎", "url": "https://www.cdc.gov/std/treatment-guidelines/chlamydia.htm", "kind": "指南", "provider": "CDC", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-management", "title": "TFOS DEWS II：治療方式與限制", "url": "https://www.tfosdewsreport.org/report-management_and_therapy/147_36/en/", "kind": "期刊", "provider": "TFOS", "note": "治療原理與手術名詞；診斷框架請配合 DEWS III。", "verifiedDate": "2026-10-11"}, {"id": "cov12-omega", "title": "NEI：DREAM 隨機試驗的 omega-3 結果", "url": "https://www.nei.nih.gov/research-and-training/research-news/omega-3s-fish-oil-supplements-no-better-placebo-dry-eye", "kind": "期刊", "provider": "NIH · National Eye Institute", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-drugs", "title": "EAACI：藥物相關眼表疾病共識", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12590328/", "kind": "期刊", "provider": "European Academy of Allergy and Clinical Immunology", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-ossn", "title": "眼表鱗狀上皮腫瘤：CIN與侵襲性病變", "url": "https://eyewiki.aao.org/Ocular_Surface_Squamous_Neoplasia", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-vitA", "title": "維生素A缺乏的眼部表現", "url": "https://eyewiki.org/Xerophthalmia", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov12-chemical", "title": "化學眼傷：即刻沖洗與後續眼表處理", "url": "https://eyewiki.org/Chemical_%28Alkali_and_Acid%29_Injury_of_the_Conjunctiva_and_Cornea", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}], "figure": {"type": "tear-film", "title": "淚膜的脂質與黏液水液介面", "caption": "原創淚膜概念示意，非患者影像、非按比例。表面脂質層與下方黏液水液相、上皮界面共同維持穩定眼表；黏蛋白分布呈梯度，並非三層完全分離的液體。", "alt": "淚膜剖面：空氣下方為表面脂質層，再往下是含水液與分泌型黏蛋白的黏液水液相，接近角膜上皮為膜結合黏蛋白界面。", "sourceIds": ["an12-dews3", "an12-dews2"]}, "integrated": {"framing": "把乾澀、紅眼和視覺波動放進同一條眼表推理路徑：先找需要改道的疾病，再用症狀、客觀恆定性與驅動因素組合診斷。", "objectives": ["解釋眨眼、眼瞼與淚膜如何共同影響視覺。", "區分乾眼證據、病因分型與感染／過敏等替代解釋。", "用治療後的變化重新檢驗假說，而不是無限增加點眼藥。"], "units": [{"id": "u1", "title": "從光學表面理解「忽清忽糊」", "sectionIndexes": [0, 7, 8, 9], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["淚膜是每次眨眼都更新的光學界面。若模糊隨注視時間增加、眨眼後短暫改善，就形成可檢驗的假說：症狀可能與表面穩定性有關。檢查時除了看淚量，也要觀察眨眼是否完整、眼瞼邊緣與分泌物；看得到淚水並不等於表面能維持均勻。", "診斷與分型回答不同問題。症狀加客觀恆定性異常支持乾眼，再用分泌、眼瞼、染色等資料找出主要驅動因素。Schirmer、破裂時間和染色各測一部分，不能用某一項正常蓋過其他陽性；同樣也不能只憑病人說乾，就跳過替代病因的檢查。"], "decisions": [{"finding": "看螢幕時模糊，眨眼可暫時改善", "interpretation": "症狀時序支持淚膜不穩定的假說，尚非單獨確診。", "nextStep": "檢查眨眼、淚膜穩定性與眼表染色，並量測實際視力。"}, {"finding": "淚液分泌測試尚可，但破裂時間短", "interpretation": "分泌量不能代表淚膜所有功能，需找蒸發、眼瞼或表面因素。", "nextStep": "評估腺口、分泌品質、閉合與暴露，不直接排除乾眼。"}], "sourceIds": ["an12-dews3", "an12-dews2", "an12-ocular", "an12-dews3-original"]}, {"id": "u2", "title": "紅眼不是同一種病：先辨認不符合的線索", "sectionIndexes": [1, 2, 3, 4, 5, 6], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["結膜形態應用來形成鑑別，不能取代角膜與視力檢查。癢、分泌物、濾泡或乳頭可能提供方向，但同時存在的角膜問題才能解釋某些疼痛與視力變化。慢性眼表病也可能在某一天另得感染，因此「一直都有乾眼」不能把新的急性症狀合理化。", "當主訴與染色程度不相稱，先確認檢查方法與範圍，再評估其他眼痛或感覺異常來源。很痛卻少染色不能等同沒有疾病；明顯上皮受損但不太痛，也不能當成輕症。這個分岔的價值是讓你重新檢查感覺與結構，而不是立即替病人貼新標籤。"], "decisions": [{"finding": "原本雙眼乾澀，今天一眼突然明顯畏光與視力下降", "interpretation": "新的側別與急性變化不符合穩定日常乾眼。", "nextStep": "當日眼科評估角膜與前房，避免只追加人工淚液。"}, {"finding": "不適程度與眼表所見差距很大", "interpretation": "可能有未辨識的病灶或神經感覺因素，仍需驗證。", "nextStep": "複核染色與角膜感覺，依症狀重查感染、暴露及其他疼痛來源。"}], "sourceIds": ["an12-dews3", "an12-dews2", "an12-staining", "an12-dews3-original"]}, {"id": "u3", "title": "把分型變成可追蹤的治療假說", "sectionIndexes": [10, 11], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["治療前先寫下最可能的驅動因素與驗收項目。例如眼瞼分泌異常，追蹤應包含分泌狀態及淚膜穩定性；閉合不全則需要關注暴露與染色位置。只問「有沒有比較舒服」不足以確認組織改善，單看染色減少也未必代表所有症狀都已解決。", "治療反應不佳時，依序核對使用方式、持續暴露、是否有混合因素，以及起初診斷是否完整。明顯水液不足合併乾口等線索，會把問題帶向全身疾病評估。新版TFOS的價值在於辨認多個驅動因素並排序處理，而非把每位病人硬分成互不重疊的兩類。"], "decisions": [{"finding": "眼乾、低淚河，並有持續乾口", "interpretation": "需要考慮全身性水液不足原因，不能只用螢幕習慣解釋全部。", "nextStep": "補相關用藥與系統病史，依臨床安排Sjögren等評估。"}, {"finding": "規律治療仍有固定部位染色", "interpretation": "持續暴露、眼瞼或眼表異常可能尚未處理。", "nextStep": "重查閉合與染色分布，調整主因導向的計畫並約定追蹤指標。"}], "sourceIds": ["an12-dews3", "an12-dews2", "an12-staining", "an12-dews3-original"]}], "case": {"title": "流淚的病人也可能有淚膜失衡", "stem": "以下為虛構教學情境。一名長時間使用螢幕的成人，雙眼數月灼熱與視覺波動；偶爾流淚，自認淚水應該很夠。", "steps": [{"newInfo": "模糊會在眨眼後短暫改善，沒有急性單眼視力下降。", "prompt": "你提出什麼假說，又怎麼驗證？", "answer": "考慮淚膜不穩定；測視力，觀察眨眼與閉合，再以穩定性及染色等客觀檢查確認。", "rationale": "流淚是可見現象，表面穩定性是功能；兩者不能互相替代。", "sourceIds": ["an12-ocular", "an12-dews2"]}, {"newInfo": "檢查有眨眼不完全、瞼板腺分泌異常和眼表染色；另見淚河偏低。", "prompt": "能否只診斷成蒸發型後結束？", "answer": "不能；眼瞼與脂質問題之外，還可能存在水液不足，需結合分泌測試及病史評估混合驅動因素。", "rationale": "同一患者可同時有多個原因；針對其中一項有效，也不保證其餘問題消失。", "sourceIds": ["an12-dews3", "an12-dews2", "an12-dews3-original"]}, {"newInfo": "進一步問出半年乾口，改善眨眼與眼瞼照護後仍明顯不適。", "prompt": "如何更新計畫，而不是直接認為病人沒配合？", "answer": "確認執行方法與客觀變化，並評估乾口、用藥及全身疾病；依結果安排相關專科與進一步眼表治療。", "rationale": "治療反應是新證據，應用來修正主因排序；原始假說可以部分正確，但仍不完整。", "sourceIds": ["an12-dews3", "an12-dews3-original"]}]}, "connections": [{"topicId": "notes-05", "reason": "以角膜染色、浸潤與感覺檢查區分表面失衡和角膜急症。"}, {"topicId": "notes-11", "reason": "把眨眼與眼瞼閉合異常連到暴露性眼表損伤。"}, {"topicId": "notes-13", "reason": "檢查藥物與防腐劑負荷，避免治療本身加重眼表問題。"}]}}, "notes-13": {"deepDive": [{"heading": "HCQ：正常視力不等於沒有早期毒性", "paragraphs": ["HCQ 毒性可先出現在中心凹周圍或更外側的區域，早期仍可能看清視力表。Bull’s-eye 外觀代表較晚的結構損害，篩檢的目的正是提早找出變化，而不是等眼底出現典型環狀病灶。", "判讀時要把用藥年限、劑量、腎功能、tamoxifen 與開始用藥年齡納入風險；單一風險因子或一次可疑檢查，都不等於已確診。疑似結果需結構與功能對照，並與原處方團隊共同決定後續。"], "sourceIds": ["drug-hcq-aao", "drug-hcq-image"]}, {"heading": "AAO 2025 修訂：先做基線，再依風險安排追蹤", "paragraphs": ["AAO 最新修訂於 2025 年公布、2026 年正式刊出：開始 HCQ 後及早建立眼底、OCT 與 FAF 基線；使用期間建議年度 OCT 與廣範圍 FAF。只有沒有顯著風險因子者，才可考慮在最初五年暫緩年度篩檢。", "視野與 mfERG 是確認工具。檢查範圍需同時涵蓋 parafoveal 與 pericentral，不能只靠中央 10-2 或只按族群固定一種型態。停止用藥後是否仍進展與原有嚴重程度有關，不能保證停藥即完全逆轉。"], "sourceIds": ["drug-hcq-aao"]}, {"heading": "Topiramate：閉角的機轉決定處置方向", "paragraphs": ["新用藥或加量後的雙眼急性模糊，若伴近視位移、淺前房及高眼壓，應想到睫狀脈絡膜滲出使晶狀體虹膜隔整體前移。這與瞳孔阻滯造成的 iris bombe 不同，也不要求病人原本就有狹窄隅角。", "因此 LPI 不能處理這個滲出機轉，不能機械套用所有原發閉角處置。需立即眼科評估，由治療團隊儘速處理疑致病藥與替代方案；降壓、睫狀肌麻痺與抗發炎策略由專科依情境決定。"], "sourceIds": ["drug-topiramate"]}], "oralChallenge": {"question": "服 HCQ 多年者說：「我視力還是 1.0，而且沒有 bull’s-eye，為何還要檢查？」請用病人能理解的話回答。", "answer": "視力表主要測最中央的視覺，藥物影響可能先從旁邊的視網膜開始，所以還看得清楚不代表沒有變化。我們會用影像追蹤，必要時加功能檢查；若結果可疑，會再確認並和原處方醫師討論，不是只憑一張圖就自行停藥。", "sourceIds": ["drug-hcq-aao", "drug-hcq-image"]}, "resources": [{"id": "drug-hcq-aao", "title": "AAO：HCQ 視網膜毒性篩檢 2025 修訂", "url": "https://pubmed.ncbi.nlm.nih.gov/41232611/", "kind": "期刊", "provider": "American Academy of Ophthalmology · Ophthalmology", "note": "2026 正式刊出；以此更新篩檢時程與工具，勿沿用舊影片中的篩檢規則。", "verifiedDate": "2026-10-11"}, {"id": "drug-hcq-image", "title": "Bull’s-eye maculopathy：眼底、FAF、OCT 實例", "url": "https://morancore.utah.edu/section-12-retina-and-vitreous/bilateral-bulls-eye-maculopathy/", "kind": "圖譜", "provider": "University of Utah · Moran CORE", "note": "晚期毒性圖像；練習指出受損區域，並說明為何不能等到此時才篩檢。", "verifiedDate": "2026-10-11"}, {"id": "drug-macula-video", "title": "Acquired Macular Diseases：含藥物性黃斑病變", "url": "https://morancore.utah.edu/section-12-retina-and-vitreous/acquired-macular-diseases/", "kind": "影片", "provider": "University of Utah · Moran CORE", "note": "2018 課程含 Plaquenil toxicity；適合學影像與鑑別，現行篩檢依 AAO 2025 修訂。", "verifiedDate": "2026-10-11"}, {"id": "drug-topiramate", "title": "Topiramate 雙眼閉角：超音波與解剖對照", "url": "https://eyerounds.org/cases/283-topiramate-induced-angle-closure.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "看睫狀體水腫、晶狀體虹膜隔前移與治療後影像變化。", "verifiedDate": "2026-10-11"}, {"id": "drug-amiodarone-atlas", "title": "Corneal verticillata - Amiodarone", "url": "https://eyerounds.org/cases/case29.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "角膜渦狀沉積的原始教學病例，通常不因沉積本身改變心臟用藥。", "verifiedDate": "2026-10-11"}, {"id": "drug-steroid-effects", "title": "Ocular Side-Effects of Corticosteroids", "url": "https://morancore.utah.edu/basic-ophthalmology-review/ocular-side-effects-of-corticosteroids/", "kind": "指南", "provider": "University of Utah · Moran CORE", "note": "類固醇的眼壓與晶狀體風險；原始教學頁。", "verifiedDate": "2026-10-11"}, {"id": "drug-ethambutol", "title": "Ethambutol Optic Neuropathy", "url": "https://eyewiki.org/Ethambutol_Optic_Neuropathy", "kind": "指南", "provider": "AAO · EyeWiki", "note": "視神經毒性、色覺與中央視野；專家教學頁，非正式臨床指引。", "verifiedDate": "2026-10-11"}, {"id": "drug-topiramate-fda", "title": "FDA TOPAMAX藥品標示：急性近視與次發閉角警示", "url": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/020505s067,020844s058lbl.pdf", "kind": "指南", "provider": "US Food and Drug Administration", "note": "2025年標示第5.1節；核對睫狀脈絡膜滲出、結構前移及由治療醫師判斷儘速停致病藥的急症原則。", "verifiedDate": "2026-10-11"}, {"id": "cov13-cornea", "title": "藥物相關角膜病變", "url": "https://eyewiki.org/Drug-Induced_Corneal_Complications", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov13-uveitis", "title": "藥物相關葡萄膜炎", "url": "https://eyewiki.org/Drug_Induced_Uveitis", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov13-macula", "title": "藥物黃斑病變與影像模式", "url": "https://eyewiki.org/Drug_induced_maculopathy", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov13-toxic-optic", "title": "毒性視神經病變的辨識", "url": "https://eyewiki.org/Toxic_Optic_Neuropathy", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov13-sjs", "title": "SJS／TEN 的急性與慢性眼表問題", "url": "https://eyewiki.aao.org/Stevens-Johnson_Syndrome", "kind": "指南", "provider": "AAO · EyeWiki", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov13-vigabatrin", "title": "FDA：Vigabatrin視功能監測警告", "url": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/217684s002s004lbl.pdf", "kind": "指南", "provider": "US FDA", "note": "核對基線、治療期間每三個月及停藥後監測；不是五年固定終點。", "verifiedDate": "2026-10-11"}, {"id": "cov13-linezolid", "title": "FDA：Linezolid視神經風險", "url": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2024/206473s010lbl.pdf", "kind": "指南", "provider": "US FDA", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov13-adc", "title": "Depatuxizumab mafodotin膠質母細胞瘤第三期試驗", "url": "https://pubmed.ncbi.nlm.nih.gov/35849035/", "kind": "期刊", "provider": "Neuro-Oncology · randomized trial", "note": "歷史試驗案例，核對角膜上皮毒性與研究情境，不將共筆藥名當成現行核准適應症。", "verifiedDate": "2026-10-11"}, {"id": "cov13-surface", "title": "EAACI：全身藥物與眼表疾病共識", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC12590328/", "kind": "期刊", "provider": "European Academy of Allergy and Clinical Immunology", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov13-ifis", "title": "Tamsulosin官方藥標：術中虹膜鬆弛症候群", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f8302a6e-b8da-4931-a279-b49e37943816", "kind": "指南", "provider": "US FDA · DailyMed", "note": "第5.5節涵蓋目前與過往用藥的IFIS風險，並說明術前停藥的效益尚未確立。", "verifiedDate": "2026-10-11"}, {"id": "cov13-crao", "title": "急性中央視網膜動脈阻塞：中風急症處理重點", "url": "https://professional.heart.org/en/science-news/management-of-central-retinal-artery-occlusion/top-things-to-know", "kind": "指南", "provider": "American Heart Association", "note": "將急性CRAO視為需要迅速急診分流與血管病因評估的缺血性中風表現。", "verifiedDate": "2026-10-11"}], "figure": {"type": "drug-targets", "title": "藥物副作用的眼部定位圖", "caption": "原創概念圖：amiodarone 可出現角膜渦狀沉積；類固醇需注意白內障與眼壓；HCQ 需監測視網膜毒性；ethambutol 需警覺視神經病變。這是常考定位，不代表每種藥只影響單一部位，也不是自行停藥的依據。", "alt": "五列定位表：角膜與 amiodarone、晶狀體與類固醇、眼壓與類固醇、視網膜與 HCQ、視神經與 ethambutol，並提醒此表不是完整副作用清單。", "sourceIds": ["drug-hcq-aao", "drug-amiodarone-atlas", "drug-steroid-effects", "drug-ethambutol"]}, "integrated": {"framing": "藥名只是起點：用症狀定位、暴露時序、客觀檢查與替代原因建立因果強度，再按急迫性決定處理與跨科溝通。", "objectives": ["區分可見沉積、功能毒性與急性結構改變。", "依AAO 2025修訂安排HCQ基線、範圍與風險分層。", "解釋不同藥物閉角的機轉，避免套用不相容處置。"], "units": [{"id": "u1", "title": "先定位損傷，再判斷是否與藥物有關", "sectionIndexes": [0, 1, 2, 3, 4, 5, 8], "deepDiveIndexes": [], "showFigure": true, "synthesis": ["同一個「看不清楚」可能來自角膜、黃斑或視神經，因此先記錄視力、色覺、瞳孔與結構所見，再對照藥物。用藥後出現症狀具有時間關聯，卻不能自動證明因果；病人原有的眼病或全身疾病也可能同時惡化，需保留可競爭的解釋。", "可見的藥物沉積與會損害功能的毒性，臨床意義未必相同。像角膜渦狀沉積，必須連同視力和其他眼部所見解讀；不能因照片醒目就要求停止重要全身治療。反之，早期功能異常可能外觀不典型，不能等所有病灶都肉眼可見才處理。"], "decisions": [{"finding": "服amiodarone，角膜有渦狀沉積但功能穩定", "interpretation": "沉積本身不等於已發生需要停藥的視覺毒性。", "nextStep": "記錄視力與眼部評估，必要時與處方團隊討論，不自行停藥。"}, {"finding": "懷疑藥物相關視力下降，卻同時有其他眼底病", "interpretation": "存在替代原因，藥名不能替代定位與鑑別。", "nextStep": "比較用藥前基線及現在結構／功能，釐清各項異常能解釋多少症狀。"}], "sourceIds": ["drug-amiodarone-atlas", "drug-hcq-aao", "drug-ethambutol"]}, {"id": "u2", "title": "HCQ：把風險、影像範圍與確認串起來", "sectionIndexes": [6, 7], "deepDiveIndexes": [0, 1], "showFigure": false, "synthesis": ["HCQ篩檢不是每年只問看不看得清楚。原有視網膜狀態決定未來怎麼比較，劑量、療程及風險則決定追蹤不能被簡化成固定年限；因此開始後及早建立基線有獨立價值。AAO 2025修訂以OCT和廣範圍FAF為主要工具，低風險者才可能在最初五年暫緩年度篩檢。", "可疑結果的下一步是確認型態與一致性，而不是把影像警示等同確診。檢查範圍要兼顧中心旁與更周邊的受損型態；若疑似變化落在原本掃描範圍之外，正常中央結果的排除力有限。確認後還需由眼科、患者與原處方團隊共同權衡治療效益和視覺風險。"], "decisions": [{"finding": "有腎病或其他顯著風險，HCQ尚未使用五年", "interpretation": "不能機械採用「五年內不用每年篩檢」。", "nextStep": "及早完成基線並依風險安排追蹤，核對劑量與腎功能。"}, {"finding": "一次OCT可疑，但其他證據尚不一致", "interpretation": "屬需確認的結果，尚不足以直接宣告毒性。", "nextStep": "複核影像品質與範圍，按眼科判斷加視野或mfERG等確認。"}], "sourceIds": ["drug-hcq-aao", "drug-hcq-image", "drug-macula-video"]}, {"id": "u3", "title": "高眼壓要問機轉：流出阻力還是結構前移？", "sectionIndexes": [9, 10, 11], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["類固醇反應和topiramate相關閉角都可能讓眼壓上升，但需要不同解剖解釋。前者常與流出阻力增加有關，症狀可以不明顯；後者可因睫狀脈絡膜滲出，使晶狀體虹膜隔向前並產生近視位移。問清新用藥和劑量變化，能把模糊視力與隅角狀態連起來。", "治療選擇必須和機轉相容。若是非瞳孔阻滯的整體前移，只在虹膜造孔不能消除滲出原因；縮瞳也不能被當成所有閉角的通用答案。急性疑似藥物閉角需立即眼科處理與處方團隊協作；追蹤應確認眼壓、前房及屈光變化，而不只看頭痛是否減輕。"], "decisions": [{"finding": "新用topiramate後，雙眼突發近視與淺前房", "interpretation": "睫狀脈絡膜滲出造成次發閉角的可能性高。", "nextStep": "立即眼科評估並通知處方團隊，依判斷儘速處理致病藥。"}, {"finding": "長期類固醇使用者沒有眼痛", "interpretation": "無痛不表示沒有眼壓或晶狀體併發症。", "nextStep": "按暴露與風險安排眼壓、視神經及晶狀體評估。"}], "sourceIds": ["drug-topiramate", "drug-steroid-effects", "drug-topiramate-fda"]}], "case": {"title": "新近視不一定是眼軸變長", "stem": "以下為虛構教學情境。一名成人因雙眼突然看遠不清與頭脹就診，一週前開始服用topiramate。", "steps": [{"newInfo": "雙眼遠視力比近視力差，驗光出現新近視位移。", "prompt": "為何不能直接配新眼鏡結案？", "answer": "急性雙眼屈光改變合併新藥暴露，要排除眼內結構前移與閉角；立刻量眼壓並評估前房。", "rationale": "屈光結果是機轉線索，不能把驗得到度數當成已找到安全原因。", "sourceIds": ["drug-topiramate", "drug-topiramate-fda"]}, {"newInfo": "雙眼高眼壓、前房均勻變淺；影像支持睫狀脈絡膜滲出。", "prompt": "這與典型瞳孔阻滯閉角差在哪裡？", "answer": "晶狀體虹膜隔整體前移是主要機轉，LPI不能解除滲出；不能直接套用縮瞳處置。", "rationale": "眼壓同樣升高，阻塞形成的位置不同，處置就必須不同。", "sourceIds": ["drug-topiramate", "drug-topiramate-fda"]}, {"newInfo": "團隊已依判斷儘速停疑致病藥、安排替代並進行眼科治療。", "prompt": "症狀減輕後，交班和追蹤還要確認什麼？", "answer": "追蹤眼壓、前房深度、視力與屈光；將疑似不良反應及處方調整交接給原團隊，避免未經評估再次暴露。", "rationale": "主觀緩解不能單獨證明隅角已恢復；完整紀錄把一次急症處理延伸成後續用藥安全。", "sourceIds": ["drug-topiramate", "drug-topiramate-fda"]}]}, "connections": [{"topicId": "notes-07", "reason": "比較瞳孔阻滯、非阻滯閉角與開角流出阻力。"}, {"topicId": "notes-10", "reason": "用OCT、FAF和視網膜層次理解藥物毒性。"}, {"topicId": "notes-03", "reason": "以色覺、視野及對稱性線索辨認視神經毒性。"}]}}, "notes-14": {"deepDive": [{"heading": "口試先完成分流，再展開鑑別", "paragraphs": ["急性視力下降的第一句應交代起始時間、單雙眼、疼痛及嚴重程度。之後用視力、瞳孔／RAPD、視野、前節與眼底，說明目前比較支持視網膜還是視神經病灶。即使尚未確診，也可以清楚說出不能延誤的下一步。", "新飛蚊、閃光與幕簾提示視網膜裂孔／剝離風險；突然嚴重且無痛的單眼下降則須立即考慮動脈阻塞。不能用「沒有痛」或「中央視力還好」作為安心依據。"], "sourceIds": ["triage-video", "triage-rd", "triage-crao"]}, {"heading": "眼底病名不夠：辨認全身急症", "paragraphs": ["CRAO 的口試答案必須包含急診／中風分流，而非只說散瞳確認。記錄最後正常時間與血管危險因子，能讓後續團隊迅速判斷；是否適合急性介入需由團隊依個案決定。", "高齡者急性視覺症狀，若合併新頭痛、咀嚼疼痛或蒼白腫脹的視神經盤，要警覺 GCA。沒有典型全身症狀也不能完全排除；合理懷疑時需要緊急處理，不能只排一般門診等待檢查。"], "sourceIds": ["triage-crao", "triage-gca"]}, {"heading": "把影像描述轉成可檢驗的推論", "paragraphs": ["看圖時先描述位置、顏色、邊界與伴隨血管變化，再提出診斷。例如蒼白水腫的視神經盤應連結缺血性視神經病變的鑑別；隆起皺摺的視網膜則需釐清剝離範圍與中央區是否受累。不要只報一個病名便停止。", "接著說出哪項證據最會改變決策：是血管急症的發病時間、GCA 的臨床線索，還是視網膜是否有裂孔及黃斑受累。把答案組成「目前最擔心什麼、還需確認什麼、現在先做什麼」，比羅列十個疾病更能呈現臨床判斷。"], "sourceIds": ["triage-gca", "triage-rd", "triage-video"]}], "oralChallenge": {"question": "一位高齡病人 45 分鐘前突然單眼無痛視力大幅下降。你尚未看清眼底，第一分鐘如何回報？", "answer": "先報告最後正常時間、側別、實測視力與 RAPD，提出視網膜動脈阻塞等缺血性急症疑慮，立即啟動急診／中風評估並聯絡眼科。同時詢問新頭痛與咀嚼疼痛等 GCA 線索；不因等待完整眼底影像而延誤分流。", "sourceIds": ["triage-crao", "triage-gca"]}, "resources": [{"id": "triage-crao", "title": "AHA：CRAO 是需要急診分流的視網膜中風", "url": "https://professional.heart.org/en/science-news/management-of-central-retinal-artery-occlusion/top-things-to-know", "kind": "指南", "provider": "American Heart Association", "note": "口試務必說出急診、中風評估與再發預防，不停留在眼底辨識。", "verifiedDate": "2026-10-11"}, {"id": "triage-video", "title": "急性持續性視力下降：視網膜或視神經？", "url": "https://morancore.utah.edu/section-05-neuro-ophthalmology/differentiating-retinopathy-from-optic-neuropathy-in-acute-persistent-vision-loss/", "kind": "影片", "provider": "University of Utah · Moran CORE", "note": "以病例練定位；暫停影片後先說自己的前三項鑑別與下一步。", "verifiedDate": "2026-10-11"}, {"id": "triage-gca", "title": "GCA：蒼白視神經盤與缺血影像", "url": "https://eyerounds.org/article/GCA/index.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "臨床圖像與原始研究教學；聚焦辨識急症，不把舊文完整治療方案當現行處方。", "verifiedDate": "2026-10-11"}, {"id": "triage-rd", "title": "NEI：新飛蚊、閃光與幕簾的急症警訊", "url": "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/retinal-detachment", "kind": "指南", "provider": "NIH · National Eye Institute", "note": "用官方教育頁練習回診警訊說明，以及為何症狀出現就需及時就醫。", "verifiedDate": "2026-10-11"}, {"id": "triage-gca-acr", "title": "ACR／VF：GCA診斷與治療建議（2021）", "url": "https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/acr.24632", "kind": "指南", "provider": "American College of Rheumatology / Vasculitis Foundation", "note": "正式指引；重點為視覺受威脅時的緊急全身治療及證據強度，圖譜仍用Iowa照片判讀。", "verifiedDate": "2  "白內障與視覺功能", "url": "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/cataracts", "kind": "指南", "provider": "NIH · National Eye Institute", "note": "核對鑑別與臨床限制；原共筆僅作主題及頁碼來源。", "verifiedDate": "2026-10-11"}, {"id": "cov14-hlab27", "title": "HLA-B27 前葡萄膜炎：後黏連實例", "url": "https://eyerounds.org/cases/334-HLA-B27-associated-Acute-Anterior-Uveitis.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "先描述裂隙燈照片的後黏連，再對照問診與後續全身疾病線索。", "verifiedDate": "2026-10-11"}, {"id": "cov14-sebaceous", "title": "皮脂腺癌：偽裝成眼瞼發炎的病例", "url": "https://www.eyerounds.org/cases/62-Sebaceous-Cell-Carcinoma-Eyelid-Masquerade-Syndrome.htm", "kind": "圖譜", "provider": "University of Iowa · EyeRounds", "note": "對照臨床及病理圖片，辨認反覆結節與難治性單側發炎的警訊。", "verifiedDate": "2026-10-11"}, {"id": "cov14-dacryo-care", "title": "急性淚囊炎：抗感染治療與避免急性期探通", "url": "https://eyewiki.aao.org/Dacryocystitis", "kind": "指南", "provider": "American Academy of Ophthalmology · EyeWiki", "note": "急性期需全身抗感染治療；發炎時避免探通淚道，以減少組織損傷與感染擴散風險。", "verifiedDate": "2026-10-11"}], "figure": {"type": "triage", "title": "急性視力下降：疼痛與側別矩陣", "caption": "原創概念圖：以疼痛／無痛與單眼／雙眼形成四格，作為病史與定位的起點。側別需實際分眼確認；無痛或雙眼都不能自動排除急症，格內病因是鑑別方向而非確診。", "alt": "二乘二矩陣以疼痛與無痛為一軸、單眼與雙眼為另一軸，提示結合發病時間、視力、瞳孔、前節與眼底做進一步分流。", "sourceIds": ["triage-crao", "triage-rd", "triage-gca"]}, "integrated": {"framing": "把散落的病名整合成一分鐘可交班的判斷：先保護視力與生命，再定位、更新鑑別，最後說出會改變處置的證據。", "objectives": ["用時程、側別、疼痛與實測功能決定分流。", "以關鍵陽性、反證與資料缺口逐步修正診斷。", "在未完全確診時仍提出具體、安全且有時效的下一步。"], "units": [{"id": "u1", "title": "第一分鐘：先建立嚴重度，而非先猜病名", "sectionIndexes": [0, 1, 2, 3, 4], "deepDiveIndexes": [0], "showFigure": true, "synthesis": ["初評要同時取得「正在失去什麼功能」與「還有多少時間」。病人說看不清楚時，記錄最後正常時間並分眼量視力，比先列出長串鑑別更能改變處置。疼痛與充血只是一部分線索；沒有痛、眼睛外觀平靜，也不能降低突發視力下降的急迫性。", "看診順序的價值在於找出必須改道的情境，而不是把每一項檢查做完才決策。明顯視功能異常、快速惡化或危險病史應促使及早聯絡專科；交班可明說尚未看清眼底，但已知哪些資訊足以支持立即處理，避免把不確定性轉變成等待。"], "decisions": [{"finding": "突發單眼明顯下降，外觀不紅不痛", "interpretation": "需要警覺視網膜或視神經急症，不能按外觀判低風險。", "nextStep": "即刻分眼量測、查瞳孔並聯絡急診／眼科分流。"}, {"finding": "飛蚊與閃光後出現幕簾", "interpretation": "周邊視網膜裂孔或剝離疑慮增加。", "nextStep": "及時眼底評估，即使中央視力保留也不能只安排一般追蹤。"}], "sourceIds": ["triage-crao", "triage-rd", "triage-video"]}, {"id": "u2", "title": "第二步：用解剖一致性檢驗你的猜測", "sectionIndexes": [5, 6, 7, 8, 10], "deepDiveIndexes": [2], "showFigure": false, "synthesis": ["好的鑑別不只是「某病會造成這個症狀」，還要能解釋全部重要所見。把症狀、分眼功能、瞳孔、視野和結構放在一起，問哪一個病灶位置最能連起來。若解釋不了某個關鍵陽性，應保留共存病變或重新定位，而不是把不合的資料刪掉。", "陰性結果只有在檢查方法足以偵測目標時才有意義。看不清眼底不能算眼底正常，中央影像正常也不能排除周邊問題。口試時說出限制並指定下一項能填補缺口的檢查，會比給出過度肯定的病名更能展示可驗證的推理。"], "decisions": [{"finding": "嚴重單眼下降伴RAPD", "interpretation": "支持明顯不對稱的傳入功能問題，但不能單憑此分清視網膜與視神經。", "nextStep": "結合眼底、色覺與視野定位，按急迫性補影像。"}, {"finding": "症狀提示周邊缺損，但只取得正常中央影像", "interpretation": "目前證據範圍不足，正常結果不能回答整個問題。", "nextStep": "補分眼視野及周邊檢查，將資料缺口列入交班。"}], "sourceIds": ["triage-video", "triage-rd"]}, {"id": "u3", "title": "最後一步：把診斷變成行動與交班", "sectionIndexes": [9, 11], "deepDiveIndexes": [1], "showFigure": false, "synthesis": ["急性缺血情境需要眼科診斷與全身分流平行進行。疑似CRAO要明確說急診／中風評估、最後正常時間和血管風險；如果同時有高齡、新頭痛、咀嚼疼痛或蒼白腫脹視神經盤，還要把GCA帶進同一份緊急評估，而非等排除一項才開始另一項。", "交班可固定成四句：這是什麼時程與側別的功能問題；哪些證據支持最擔心的診斷；哪個不能漏的替代原因仍待排；現在做什麼、何時再評估。保留不確定性不是停在「再觀察」，而是清楚交代尚缺資料及誰負責完成下一步。"], "decisions": [{"finding": "懷疑CRAO，尚未取得完整眼底影像", "interpretation": "急性缺血疑慮已足以啟動分流，影像可隨團隊評估並行。", "nextStep": "立即急診／中風與眼科協作，避免未證實措施延誤。"}, {"finding": "高齡急性視覺損失，咀嚼疼痛伴蒼白盤腫", "interpretation": "GCA相關缺血需要高度警覺，可能威脅另一眼。", "nextStep": "緊急專科評估與處理；抽血及確認檢查不能成為延誤治療的理由。"}], "sourceIds": ["triage-crao", "triage-gca", "triage-gca-acr"]}], "case": {"title": "從「無痛」走到不能等待的決策", "stem": "以下為虛構教學情境。一名78歲病人表示左眼40分鐘前突然幾乎看不見，沒有明顯眼痛。", "steps": [{"newInfo": "確認右眼視力保留，左眼僅能辨大幅手動，存在左RAPD；眼底尚未看清。", "prompt": "第一分鐘如何回報並採取行動？", "answer": "回報突發嚴重單眼傳入功能下降與最後正常時間，疑缺血性急症，立即眼科及急診／中風評估。", "rationale": "不能因未完成病名確認而等待；現在已有足夠證據決定急迫性。", "sourceIds": ["triage-crao", "triage-video"]}, {"newInfo": "眼底見蒼白腫脹的視神經盤；追問有近期新頭痛與咀嚼時下顎疼痛。", "prompt": "新資料如何改變你的鑑別排序？", "answer": "更擔心GCA相關缺血性視神經病變；需緊急告知團隊，安排相關血液與確認檢查並及時處理。", "rationale": "視神經盤形態把定位推向視神經，系統性線索則提高動脈炎病因疑慮。", "sourceIds": ["triage-gca", "triage-gca-acr"]}, {"newInfo": "病人詢問是否等抽血與切片結果都出來再治療。", "prompt": "如何說明風險與團隊下一步？", "answer": "高度懷疑時由專科緊急啟動系統性類固醇治療；視覺受威脅者需評估靜脈脈衝療法。不要為等待確認結果而延誤，並同步安排病因確認與另一眼評估。", "rationale": "「尚待確認」與「可安全等待」是不同判斷；嚴重性和延誤代價共同決定行動。", "sourceIds": ["triage-gca", "triage-gca-acr"]}]}, "connections": [{"topicId": "notes-03", "reason": "將RAPD、視野與視神經盤所見帶回定位。"}, {"topicId": "notes-10", "reason": "將飛蚊、幕簾與視網膜缺血轉成急症處置。"}, {"topicId": "notes-13", "reason": "在急性雙眼模糊或近視位移時主動補問用藥。"}]}}}, "learningPaths": [{"id": "vision", "title": "視力下降：從光學到視神經", "question": "同樣是看不清楚，如何用功能檢查與解剖定位，區分屈光、透明介質、視網膜和視神經的問題？", "topicIds": ["notes-01", "notes-02", "notes-06", "notes-10", "notes-03", "notes-14"]}, {"id": "red-eye", "title": "紅眼與疼痛：先找受損層次", "question": "把角膜、前房、隅角與眼表放在一起比較：哪些線索改變病因判斷，哪些情境需要立即升級處理？", "topicIds": ["notes-01", "notes-05", "notes-09", "notes-07", "notes-12", "notes-14"]}, {"id": "alignment", "title": "眼位與眼瞼：把外觀連回功能", "question": "比較視覺發育、眼球運動、眼眶與眼瞼功能，說明眼位改善為何不一定等於視力恢復。", "topicIds": ["notes-02", "notes-04", "notes-03", "notes-08", "notes-11"]}, {"id": "medications", "title": "藥物影響：按受損組織追蹤", "question": "從用藥時間軸出發，將眼表、眼壓、視網膜與視神經變化連到適合的評估與追蹤。", "topicIds": ["notes-13", "notes-12", "notes-07", "notes-10", "notes-03"]}]}, "coverage": {"reviewedDate": "2026-10-11", "scopeNote": "依14份共筆逐頁核對教學與考題涉及的主題，將相關小項整合為原創教材；頁碼採PDF實際頁序。封面、課堂回饋及空白頁另列。題目以概念重述；原檔缺圖或不清楚之處另行註明。", "chapters": {"notes-01": {"sourceFile": "眼科學No.01.pdf", "pageCount": 44, "reviewedPages": [{"from": 1, "to": 2, "kind": "administrative", "note": "目錄與課程回饋；不納入人名或行政資訊"}, {"from": 3, "to": 15, "kind": "teaching", "note": "基本檢查、外眼、裂隙燈及重點整理"}, {"from": 16, "to": 17, "kind": "exam", "note": "球面等效計算考點與解析"}, {"from": 18, "to": 41, "kind": "teaching", "note": "前後節影像、瞳孔、病例整合及複習"}, {"from": 42, "to": 44, "kind": "exam", "note": "角膜與黃斑影像定位考點；部分原圖模糊或缺圖"}], "entries": [{"id": "c01", "title": "視力表、側別與低視力紀錄", "pages": [3, 14, 35], "unitId": "u1", "sectionIndexes": [0], "terms": ["Snellen", "Landolt C", "OD／OS／OU", "CF／HM／LP／NLP"], "keyPoints": ["Snellen 分數是測試距離與標準辨識距離的比值，例如 6/15＝0.4；它不是屈光度。Landolt C 測缺口方向，適合不熟悉字母者，但仍須依視標設計、距離及合作能力操作。", "OD、OS、OU 是右眼、左眼、雙眼；基本評估須逐眼記錄。無法讀視標時依序記錄數指 CF（含距離）、手動 HM、光感 LP 或無光感 NLP，不把這些任意換算成小數視力。"], "clinicalLink": "把矯正方式與測試可靠度一同交班，才能比較病程。", "pitfall": "兩眼一起看得清楚可能掩蓋嚴重單眼病變。", "recall": {"question": "6/15 與 −1.50 D 是否同一件事？", "answer": "不是；前者是視力，後者是屈光處方的一部分。"}, "relatedTopics": ["notes-02", "notes-14"], "sourceIds": ["an01-exam", "an01-record"]}, {"id": "c02", "title": "電腦驗光是量測起點：調節、VD 與 PD", "pages": [3, 5, 14], "unitId": "u1", "sectionIndexes": [1], "terms": ["Auto refractometer", "Accommodation", "VD", "PD"], "keyPoints": ["自動驗光以光學方式估計屈光狀態；儀器的霧視設計可減少調節，但不保證兒童或年輕人已完全放鬆。結果需對照檢影、主觀驗光及必要的睫狀肌麻痺驗光。", "VD 是鏡片至角膜的頂點距離，影響高度數的有效屈光力；PD 是兩眼瞳孔間距，影響鏡片光學中心定位。PD 在此是長度，不能與稜鏡度的縮寫混讀。"], "clinicalLink": "波動的負度數可能反映調節或眼表不穩，先改善量測條件。", "pitfall": "不可照自動驗光單直接保證最佳處方。", "recall": {"question": "年輕患者不同次驗光相差很大，先確認什麼？", "answer": "確認調節、注視距離、淚膜與重複性，再決定是否做睫狀肌麻痺驗光。"}, "relatedTopics": ["notes-02", "notes-04"], "sourceIds": ["an01-exam", "an01-record"]}, {"id": "c03", "title": "球柱鏡、軸向與球面等效的用途", "pages": [4, 14, 16, 17], "unitId": "u1", "sectionIndexes": [1], "terms": ["Sphere", "Cylinder", "Axis", "Spherical equivalent"], "keyPoints": ["S 是球面屈光力、C 是柱面屈光力，單位都是 D，口語 100 度約指 1 D；Axis 是柱鏡無柱面作用的軸向，單位是角度。完整處方保留三者，單靠近視度數無法描述散光。", "球面等效 SE＝S＋C/2。例如 +1.00/−2.00×90 的 SE 為 0 D，兩主子午線卻仍有 +1.00 與 −1.00 D 的差異；SE 相同不表示散光或視覺品質相同。"], "clinicalLink": "SE 適合簡化比較與某些研究指標，不能自動替代球柱鏡矯正。", "pitfall": "原共筆把軸向與 S、C 都標為 D，應更正為度。", "recall": {"question": "SE 為零是否代表不必驗光？", "answer": "否；混合散光可有零 SE，仍須看柱鏡度數、軸向與視力。"}, "relatedTopics": ["notes-02"], "sourceIds": ["an01-record"]}, {"id": "c04", "title": "K 值與驗光散光不一致時如何推理", "pages": [5, 6, 14], "unitId": "u2", "sectionIndexes": [2], "terms": ["Keratometry", "KRT", "AVE", "Corneal astigmatism"], "keyPoints": ["Keratometry 由角膜曲率估計屈光力，AVE 是平均值，兩主子午線差可呈現角膜散光。測量區域、折射率假設與淚膜品質會影響讀值，並非直接量到整個眼球的度數。", "驗光散光是全眼光學結果，角膜後表面及晶狀體亦可抵消或增加散光。因此 K 散光與處方不同時，先核對量測品質及眼內散光，不應僅憑差值就診斷角膜病。"], "clinicalLink": "若伴視力下降或不規則反射，再以角膜地形圖、斷層與裂隙燈追查。", "pitfall": "兩眼 K 值差異不能單獨作為圓錐角膜確診標準。", "recall": {"question": "K 散光大於驗光散光，可能代表什麼？", "answer": "可能有眼內散光抵消，也可能量測不穩或角膜異常，需整合其他資料。"}, "relatedTopics": ["notes-02", "notes-05", "notes-06"], "sourceIds": ["an01-exam"]}, {"id": "c05", "title": "從 Placido 環到圓錐角膜線索", "pages": [6, 14], "unitId": "u2", "sectionIndexes": [2], "terms": ["Corneal topography", "Placido rings", "Bow-tie", "Keratoconus"], "keyPoints": ["角膜地形圖把前表面曲率分布轉成色階；Placido 環反射變密常表示局部曲率較陡。先看色階範圍、對稱性及品質，再看是否有規則蝴蝶結或偏下方陡峭。", "圓錐角膜可呈不對稱陡峭與不規則散光，但需結合厚度、後表面及進展評估。揉眼與過敏是相關風險，不能沿用共筆將病因硬分成固定百分比。"], "clinicalLink": "最佳球柱鏡視力不足、單眼重影與異常地形圖相互支持時，進一步評估角膜擴張。", "pitfall": "紅色只是該圖的相對陡峭色碼，不等於疾病。", "recall": {"question": "地形圖有紅區就能診斷圓錐角膜嗎？", "answer": "不能；先核對比例、量測品質及多項形態證據。"}, "relatedTopics": ["notes-05", "notes-02"], "sourceIds": ["an01-exam"]}, {"id": "c06", "title": "眼軸、角膜與 IOL：不要用度數相減", "pages": [5, 6, 14, 33], "unitId": "u2", "sectionIndexes": [2], "terms": ["Axial length", "Biometry", "IOL calculation", "Post-LASIK"], "keyPoints": ["眼軸長、角膜屈光力及晶狀體位置共同決定成像。角膜與晶狀體有距離且處於不同介質，整眼屈光力不是兩個數字的簡單相加，IOL 也不能由總度數減 K 值得到。", "曾做 LASIK 的眼睛可同時有較平角膜與較長眼軸。若多年後出現新近視化或降視力，需檢查晶狀體及眼底；術後裸視好不表示眼軸已變短。"], "clinicalLink": "術前採可靠生物測量與適合既往屈光手術眼的計算方法。", "pitfall": "「眼軸每長 1 mm 必定增加固定度數」只可作粗略概念，非個人處方公式。", "recall": {"question": "LASIK 後又近視，一定是角膜退回原狀嗎？", "answer": "不一定；晶狀體、眼表、角膜與眼軸相關因素都需評估。"}, "relatedTopics": ["notes-02", "notes-06", "notes-10"], "sourceIds": ["an01-exam"]}, {"id": "c07", "title": "三種眼壓計各自量到了什麼", "pages": [7, 14], "unitId": "u3", "sectionIndexes": [3], "terms": ["Noncontact tonometry", "Goldmann applanation", "Tono-Pen"], "keyPoints": ["非接觸眼壓計以氣流使角膜變形，偵測壓平或變形時的光學訊號；不是收回反彈氣體直接推算。Goldmann 壓平眼壓計以 3.06 mm 壓平直徑及螢光半環對位估計壓力。", "Tono-Pen 可在床邊使用，仍屬接觸式測量，須注意校準、角膜狀況與操作品質。不同儀器所得數值可能不同，追蹤時應保留方法與量測條件。"], "clinicalLink": "眼壓高但無症狀仍需評估視神經及隅角；單次數字不等於青光眼診斷。", "pitfall": "疑似開放性眼球傷時，手持式並不代表可以安全量眼壓。", "recall": {"question": "非接觸眼壓計的主要訊號是反彈氣流嗎？", "answer": "不是；它偵測氣流作用下的角膜變形／壓平反應。"}, "relatedTopics": ["notes-07"], "sourceIds": ["an01-exam", "an01-trauma"]}, {"id": "c08", "title": "CCT 與術後角膜：正常讀值也可能有風險", "pages": [7, 14, 35, 36], "unitId": "u3", "sectionIndexes": [3], "terms": ["Central corneal thickness", "CCT", "Corneal biomechanics", "Normal-tension glaucoma"], "keyPoints": ["中央角膜厚度 CCT 與生物力學可影響壓平眼壓；較薄或經屈光手術的角膜常使讀值偏低，但誤差不只取決於厚度。不能套用一條通用公式產生真正眼壓。", "判斷青光眼須看視乳頭、RNFL、視野及病程；即使多次眼壓在常見參考區間，仍可有正常眼壓型青光眼或已接受治療的青光眼。"], "clinicalLink": "把既往雷射史與角膜資料寫進交班，避免被看似正常的眼壓安撫。", "pitfall": "不沿用「LASIK 後全部固定少 6 mmHg」的考古概括。", "recall": {"question": "正常眼壓能排除進行中的青光眼嗎？", "answer": "不能；須把結構、功能及時間變化合併判讀。"}, "relatedTopics": ["notes-07", "notes-02"], "sourceIds": ["an01-exam"]}, {"id": "c09", "title": "角膜光反射與假性內斜視", "pages": [8, 14], "unitId": "u1", "sectionIndexes": [4], "terms": ["Hirschberg", "Pseudostrabismus", "Esotropia", "Exotropia"], "keyPoints": ["Hirschberg 以雙眼角膜光反射的位置比較眼位；內斜眼反射相對偏顳側，外斜眼反射偏鼻側。鼻樑及內眥贅皮可造成外觀像內斜，稱假性斜視。", "光反射對稱可提供線索，但小角度偏斜、特殊軸線關係或合作不佳時仍有限制。需接續遮蓋試驗、視力、屈光及雙眼運動評估。"], "clinicalLink": "兒童外觀像內斜時，既不要僅憑照片診斷，也不要忽略合併弱視風險。", "pitfall": "瞳孔中心與視軸未必完全一致，不能把每個微小反射偏心都當斜視。", "recall": {"question": "內斜眼的光反射通常相對偏向哪側？", "answer": "顳側；仍須完整眼位檢查確認。"}, "relatedTopics": ["notes-04"], "sourceIds": ["an01-exam"]}, {"id": "c10", "title": "眼球運動與複視：先分眼位與活動限制", "pages": [9, 14], "unitId": "u1", "sectionIndexes": [4], "terms": ["Extraocular movement", "EOM", "Ductions", "Versions"], "keyPoints": ["EOM 檢查需觀察不同注視方向的活動範圍，並詢問哪個方向複視最明顯。單眼運動稱 ductions，雙眼共同運動稱 versions；限制可能來自神經、肌肉或眼眶機械因素。", "複視遮任一眼即消失支持雙眼對位問題；單眼仍存在則先查該眼光學或黃斑等原因。正面眼位看似正常，也可能只在偏位注視或疲勞時出現異常。"], "clinicalLink": "把方向、側別、痛感、瞳孔及神經症狀一起定位。", "pitfall": "不能看一張正面照片便宣稱所有眼外肌正常。", "recall": {"question": "雙眼複視的床邊第一個區分動作？", "answer": "交替遮住各眼，確認複視是否在任一眼遮蔽時消失。"}, "relatedTopics": ["notes-03", "notes-04", "notes-08"], "sourceIds": ["an01-exam"]}, {"id": "c11", "title": "兒童上瞼下垂：視軸以外還要查屈光", "pages": [9, 15], "unitId": "u2", "sectionIndexes": [5], "terms": ["Ptosis", "Visual axis", "Amblyopia", "Chin-up posture"], "keyPoints": ["上瞼下垂可因遮蔽視軸造成剝奪性弱視，也可能藉壓迫角膜造成散光或屈光參差。檢查須包含各眼視力、瞳孔反射、屈光與代償頭位。", "抬下巴能改善當下視線，不能保證沒有弱視。持續的異常頭位亦有功能影響；治療時機依視軸、視覺發育及角膜保護決定。"], "clinicalLink": "將眼瞼位置與兒童視覺發育一起評估，避免只看外觀對稱。", "pitfall": "共筆圖片中「抬下巴所以不會弱視」不應當成普遍規則。", "recall": {"question": "看得到瞳孔就能免做弱視評估嗎？", "answer": "不能，散光與屈光參差也可能造成弱視。"}, "relatedTopics": ["notes-04", "notes-11"], "sourceIds": ["an01-exam"]}, {"id": "c12", "title": "眼瞼動態：外翻、閉合不全與 lid lag", "pages": [10, 15], "unitId": "u2", "sectionIndexes": [5], "terms": ["Ectropion", "Facial palsy", "Lid retraction", "Lid lag"], "keyPoints": ["顏面神經麻痺可使眼輪匝肌力量下降，造成閉合不全、下瞼外翻與淚泵失效。除了眼睛大小，要看輕閉眼、用力閉眼及角膜暴露。", "甲狀腺眼病可有上瞼退縮與向下看時的 lid lag；這些是線索而非單獨確診。若合併眼突、運動限制或視覺改變，需進一步眶部與視神經評估。"], "clinicalLink": "外觀問題先連到暴露性角膜病與視功能風險。", "pitfall": "下瞼外翻並非全部由顏面神經麻痺造成。", "recall": {"question": "眼瞼閉不緊最先擔心什麼？", "answer": "角膜暴露與上皮損傷，再追查神經或機械原因。"}, "relatedTopics": ["notes-08", "notes-11", "notes-05"], "sourceIds": ["an01-exam"]}, {"id": "c13", "title": "裂隙燈光學切面與結膜囊腫", "pages": [11, 12, 15], "unitId": "u2", "sectionIndexes": [6], "terms": ["Slit-lamp biomicroscope", "Optical section", "Conjunctival cyst"], "keyPoints": ["裂隙燈以可調寬度、長度與角度的光束建立光學切面，將平面外觀轉成立體深度資訊。結膜囊腫可見隆起邊界與透光囊內容，需區別實質病灶。", "角膜前後界面反射較亮，中間基質相對暗；亮線在畫面左或右取決於照明方向，不能背固定左右。混濁位置需相對前後表面描述。"], "clinicalLink": "先說病灶在哪一層、是否隆起與是否影響表面，再提出病因。", "pitfall": "裂隙燈切面不是病理切片，也不是全反射造成所有亮線。", "recall": {"question": "同一病灶換照明方向後，亮線左右會改變嗎？", "answer": "會；定位要依角膜前後界面，不能只記畫面方向。"}, "relatedTopics": ["notes-05", "notes-12"], "sourceIds": ["an01-exam"]}, {"id": "c14", "title": "角膜五層與影像分辨率的界線", "pages": [11, 12, 15, 18, 19, 37, 42, 43, 44], "unitId": "u2", "sectionIndexes": [6], "terms": ["Epithelium", "Bowman layer", "Stroma", "Descemet membrane", "Endothelium", "Specular microscopy"], "keyPoints": ["由外至內為上皮、Bowman 層、基質、Descemet 膜及內皮。上皮是表面屏障，基質占主要厚度，內皮維持脫水透明；層次決定病灶的光學及治療意義。", "AS-OCT 以光學回波建立斷層；能否分開細薄層取決於儀器解析度與影像品質。共筆的清楚教學示意不能推論所有臨床 OCT 都能可靠看見五層。", "鏡面顯微鏡 specular microscopy 主要觀察角膜內皮細胞形態與密度；它與上皮染色、角膜曲率或前節斷層回答的問題不同，不能用一項檢查替代所有層次的評估。"], "clinicalLink": "讀模糊考題圖時先確認表淺／基質／後表面定位，必要時承認無法細分。", "pitfall": "原 PDF 第42頁角膜圖解析度不足，不把帶問號的答案當成確診證據。", "recall": {"question": "AS-OCT 每一條亮線是否都能直接對應一個組織層？", "answer": "不能；須考慮解析度、反射界面與病灶造成的訊號改變。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov01-oct"]}, {"id": "c15", "title": "術後角膜混濁：疤痕、沉積與界面定位", "pages": [12, 13, 18, 19, 37, 42, 43], "unitId": "u2", "sectionIndexes": [6], "terms": ["Anterior stromal scar", "Corneal opacity", "AS-OCT"], "keyPoints": ["前基質疤痕可在裂隙燈形成局部高反光；既往雷射後的白色沉積也可能位於表淺組織或手術界面。病史提供候選原因，並不能替代分層定位。", "AS-OCT 可補足混濁深度、角膜厚度及界面關係；高反射影像只描述光學性質，不能單靠它診斷感染、疤痕或特定角膜失養症。"], "clinicalLink": "把視力、染色、浸潤、感覺與時間軸一起判讀。", "pitfall": "十年前做過雷射不代表如今每個白點都是雷射疤痕。", "recall": {"question": "白點位於前角膜，下一步需要哪類資訊？", "answer": "深度、上皮完整性、發炎反應及病程，必要時補斷層影像。"}, "relatedTopics": ["notes-05", "notes-02"], "sourceIds": ["cov01-oct", "an01-exam"]}, {"id": "c16", "title": "角膜水腫、上皮小泡與內皮發炎", "pages": [12, 34, 37], "unitId": "u2", "sectionIndexes": [6, 7, 8], "terms": ["Corneal edema", "Epithelial bullae", "Keratic precipitates", "Endotheliitis"], "keyPoints": ["角膜水腫可見厚度增加、基質散射及上皮微囊或大泡；裂隙燈與 AS-OCT 可互相確認厚度及所在層。水腫消退後仍可能留下疤痕與視覺品質問題。", "角膜後表面的 keratic precipitates 是炎症細胞沉積；若合併局部水腫可提示內皮發炎，但還需評估前房反應、眼壓、手術史及感染可能。"], "clinicalLink": "同樣模糊，角膜水腫與晶狀體混濁的定位及處理不同。", "pitfall": "厚角膜不一定只是天生厚，也可能是病態水腫。", "recall": {"question": "水腫旁見 KP 能直接決定病原嗎？", "answer": "不能；它支持發炎定位，病因仍須靠其他臨床證據。"}, "relatedTopics": ["notes-05", "notes-09"], "sourceIds": ["an01-exam", "cov01-oct"]}, {"id": "c17", "title": "Fluorescein 染色：上皮缺損與淚膜訊號", "pages": [20, 37, 42, 44], "unitId": "u2", "sectionIndexes": [7], "terms": ["Fluorescein staining", "Epithelial defect", "SPK", "Seidel"], "keyPoints": ["Fluorescein 在鈷藍光下顯示上皮屏障缺損及淚液分布；點狀上皮病變 SPK 是形態，不是單一病因。評估範圍、分布、是否有浸潤及角膜感覺。", "染劑聚積可來自凹陷或淚膜，並非每個亮綠區都是相同深度的潰瘍。Seidel 看房水稀釋染劑的流動，疑穿通傷需安全處理，陰性仍可能已自行封閉。"], "clinicalLink": "選檢查要問問題：上皮缺損靠染色，厚度或層次則可加 OCT。", "pitfall": "染色不能直接辨認細菌、真菌或病毒。", "recall": {"question": "上皮缺損最直接的基本檢查組合？", "answer": "裂隙燈加 fluorescein 染色，並整合浸潤與前房反應。"}, "relatedTopics": ["notes-05"], "sourceIds": ["an01-exam", "an01-trauma"]}, {"id": "c18", "title": "前房炎症：cells、flare、fibrin 分開描述", "pages": [21, 38], "unitId": "u2", "sectionIndexes": [8], "terms": ["Cells", "Flare", "Tyndall effect", "Fibrin"], "keyPoints": ["血房水屏障受損後，蛋白增加造成光散射的 flare，這是 Tyndall 效應的臨床表現；cells 是光束中可見的細胞，兩者回答不同的炎症面向。", "較重反應可有纖維蛋白 fibrin 或積膿樣外觀，但感染與非感染都可能造成強烈前房反應。量化時需使用一致光束及標準，記錄角膜、虹膜與眼壓。"], "clinicalLink": "痛、畏光、前房細胞將紅眼的定位從單純結膜移往眼內。", "pitfall": "不能由 flare 單獨診斷病原或把沉積全部叫細胞。", "recall": {"question": "前房光柱清楚但細胞不多，是否自相矛盾？", "answer": "不矛盾；蛋白散射與細胞數並非同一指標。"}, "relatedTopics": ["notes-09"], "sourceIds": ["an01-exam"]}, {"id": "c19", "title": "晶狀體切面：核性變化與症狀配對", "pages": [22, 33, 38], "unitId": "u2", "sectionIndexes": [8], "terms": ["Nuclear sclerosis", "Retroillumination", "Lens opacity"], "keyPoints": ["裂隙燈切面可辨晶核、皮質與後囊附近的混濁；核性硬化常伴黃褐色改變，反向照明有助發現其他位置的遮光。顏色本身不能取代功能評估。", "既往屈光手術患者出現新近視化時，核性變化可能參與；但若視力降幅、RAPD 或變形視與混濁不符，仍要追查後節。"], "clinicalLink": "用「位置—屈光改變—功能」說明白內障是否足以解釋主訴。", "pitfall": "看見白內障不等於所有視覺症狀都由它造成。", "recall": {"question": "近來摘鏡看近較清楚，能否表示老花改善？", "answer": "不一定；核性白內障造成近視化也可有此表現。"}, "relatedTopics": ["notes-06", "notes-02"], "sourceIds": ["an01-exam"]}, {"id": "c20", "title": "瞳孔反射：傳入與傳出不要混讀", "pages": [23, 38], "unitId": "u1", "sectionIndexes": [9], "terms": ["Direct reflex", "Consensual reflex", "CN II", "CN III", "RAPD"], "keyPoints": ["照一眼的光訊號經視網膜與視神經傳入，經頂蓋前區等中樞連結，雙側副交感傳出使兩眼縮瞳；因此有直接與間接對光反射。", "RAPD 用擺動手電筒比較兩眼傳入強度；移到較差眼時雙眼相對擴大。單側傳出障礙則該瞳孔反應不佳，但另一瞳孔仍可用來比較傳入訊號。"], "clinicalLink": "先記錄瞳孔及 RAPD，再依臨床需要散瞳，保留定位基準。", "pitfall": "瞳孔不等大不等於 RAPD；對稱雙眼病也可能沒有 RAPD。", "recall": {"question": "光移到右眼時兩眼相對擴大，訊號提示哪段？", "answer": "支持右眼相對傳入功能較差，需查視網膜與視神經。"}, "relatedTopics": ["notes-03"], "sourceIds": ["an01-rapd"]}, {"id": "c21", "title": "直接與間接眼底鏡：影像方向與檢查範圍", "pages": [24, 28, 39], "unitId": "u2", "sectionIndexes": [10], "terms": ["Direct ophthalmoscopy", "Indirect ophthalmoscopy", "Stereopsis"], "keyPoints": ["直接眼底鏡提供正立、不左右反轉的高放大局部影像；視野較窄，但在合適條件下可檢視視乳頭，不能沿用「一定看不到完整視乳頭」的說法。", "雙眼間接眼底鏡搭配聚光鏡形成倒立且左右相反的空中像，視野較廣且可有立體感，適合周邊視網膜。影像方向需先確認，避免誤報病灶象限。"], "clinicalLink": "懷疑裂孔或剝離時，中央照片正常不能替代適當周邊眼底檢查。", "pitfall": "不要把直接鏡與間接鏡的成像方向互換。", "recall": {"question": "哪一種較適合廣泛周邊眼底檢查？", "answer": "間接眼底鏡，配合適當散瞳及注視方向。"}, "relatedTopics": ["notes-10"], "sourceIds": ["an01-exam"]}, {"id": "c22", "title": "眼底照片與 RNFL：建立可比較的結構紀錄", "pages": [25, 26, 35, 39], "unitId": "u2", "sectionIndexes": [10], "terms": ["Fundus photography", "Optic disc", "RNFL defect", "Red-free imaging"], "keyPoints": ["眼底照片可記錄視乳頭杯盤、出血、血管與神經纖維層缺損，利於日後同部位比較。不同波長或無赤光影像可使某些結構更清楚，但仍受曝光與介質混濁影響。", "楔形 RNFL 缺損、視乳頭邊緣變薄或出血需與 OCT 及視野配對。照片是結構紀錄，不直接量到視功能，也不能因為非接觸就宣稱不會傳染。"], "clinicalLink": "先辨眼別與解剖方位，再描述缺損及是否進展。", "pitfall": "一張色彩較暗的照片不能直接等同神經纖維萎縮。", "recall": {"question": "為何還要保存照片，已有 OCT 不夠嗎？", "answer": "照片提供獨立外觀及時間比較，可協助辨認 OCT 假象與真實變化。"}, "relatedTopics": ["notes-07"], "sourceIds": ["an01-exam", "an01-record"]}, {"id": "c23", "title": "Glaucoma OCT：厚度圖、分類色碼與假象", "pages": [26, 35, 39], "unitId": "u2", "sectionIndexes": [10], "terms": ["RNFL OCT", "Thickness map", "Segmentation error", "Floor effect"], "keyPoints": ["OCT 可定量 RNFL 及相關神經節細胞結構。厚度圖的暖色常代表較厚，但常模分類圖的紅色可能代表低於常模；同一份報告不同色碼不能混讀。", "先查訊號、掃描位置與分層，再看不對稱及追蹤變化。高度近視可使常模比較失準，晚期青光眼也有殘餘厚度的 floor effect，不能只看數字不再下降便說穩定。"], "clinicalLink": "結構損傷需與視野、視乳頭及病程一致，避免紅色疾病或綠色安慰。", "pitfall": "OCT 單一紅格並不直接確診青光眼。", "recall": {"question": "紅色 RNFL 圖一定代表較薄嗎？", "answer": "先辨圖種；原始厚度色階與常模警示色碼意義不同。"}, "relatedTopics": ["notes-07"], "sourceIds": ["cov01-oct"]}, {"id": "c24", "title": "視野：生理盲點在顳側，缺損需看可靠度", "pages": [27, 28, 36, 39], "unitId": "u2", "sectionIndexes": [10], "terms": ["Perimetry", "Physiologic blind spot", "Fixation", "Structure-function"], "keyPoints": ["視野測試記錄固定注視時不同位置的感光敏感度。視乳頭在鼻側視網膜，對應生理盲點在顳側視野；共筆文字把盲點寫在鼻側，必須更正。", "灰階只是概覽，需看固定注視、偽陽性等可靠度及偏差圖。下方視網膜神經纖維受損可造成上方視野異常；檢測中央 10、24、30 度或更廣範圍依問題選擇。"], "clinicalLink": "與病人主訴、RNFL 位置及可重複性相互核對。", "pitfall": "不能僅凭黑色區塊下診斷，也不能把中央程式正常當全周邊正常。", "recall": {"question": "鼻側視乳頭投射成哪側視野盲點？", "answer": "顳側視野；視網膜位置與外界視野方向相反。"}, "relatedTopics": ["notes-03", "notes-07"], "sourceIds": ["an01-exam", "cov01-oct"]}, {"id": "c25", "title": "黃斑 OCT 正常地圖：先找層次再找病灶", "pages": [29, 40, 43, 44], "unitId": "u2", "sectionIndexes": [10], "terms": ["Outer nuclear layer", "Ellipsoid zone", "Interdigitation zone", "RPE", "Bruch membrane", "RNFL／GCL／IPL／INL／OPL／ONL", "External limiting membrane", "Myoid zone", "Choroid"], "keyPoints": ["由玻璃體側往脈絡膜側，先辨內層視網膜、外核層（感光細胞胞體）、外界膜、感光細胞相關反射帶及 RPE／Bruch 膜複合體。正常中心凹變薄不等於缺損。", "舊圖標示 IS/OS 的亮帶多以 ellipsoid zone 稱呼；interdigitation zone 與 RPE 是相鄰但不同的結構概念。臨床影像亮帶不總是單一組織的精確切片。", "內層可循 RNFL（神經節細胞軸突）、GCL（神經節細胞胞體）、IPL（內突觸）、INL（雙極等細胞胞體）、OPL（外突觸）及 ONL（感光細胞胞體）定位。外界膜是細胞連結形成的界面，myoid zone 與 ellipsoid zone 對應感光細胞內節不同區域；RPE 下方再接 Bruch 膜與脈絡膜 choroid。"], "clinicalLink": "先找 RPE 與視網膜輪廓，才判斷液體位於內、下或 RPE 下。", "pitfall": "不要把外核層的相對低反射誤認為積液。", "recall": {"question": "為何讀 OCT 要先辨 RPE？", "answer": "RPE 是區分視網膜下液與色素上皮剝離的重要定位基準。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov01-oct"]}, {"id": "c26", "title": "SRF 與 PED：兩種不同空間的分離", "pages": [29, 40, 42, 43, 44], "unitId": "u2", "sectionIndexes": [10], "terms": ["Subretinal fluid", "SRF", "Pigment epithelial detachment", "PED"], "keyPoints": ["視網膜下液 SRF 位於感覺性視網膜與 RPE 之間；色素上皮剝離 PED 則是 RPE 與下方 Bruch 膜分離。兩者可同時出現，不應把所有暗腔叫水腫。", "先沿連續 RPE 帶追蹤，再看其上方是否有液體、其本身是否隆起及下方內容。PED 可含漿液、血液或纖維血管組織，影像位置不直接等同病因。"], "clinicalLink": "串連年齡、症狀、OCT 與必要的血管影像，考慮 CSC、AMD 等鑑別。", "pitfall": "共筆用單條舊反射帶名稱定位可過度簡化；以實際解剖空間判讀。", "recall": {"question": "同一張 OCT 可同時有 SRF 與 PED 嗎？", "answer": "可以，兩者分別在 RPE 上方與 RPE 下方。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov01-oct"]}, {"id": "c27", "title": "ERM、黃斑裂孔與囊樣水腫的對照", "pages": [30, 36, 40, 42, 43], "unitId": "u2", "sectionIndexes": [10], "terms": ["Epiretinal membrane", "Macular hole", "Cystoid macular edema"], "keyPoints": ["黃斑前膜 ERM 是視網膜內表面的膜樣組織，可造成皺摺、增厚及牽引；全層黃斑裂孔則有中央感覺性視網膜的全層缺損，需連續切面確認。", "囊樣黃斑水腫是視網膜內的囊樣液體空間，並非整層組織消失。三者都可能變形視，單靠主訴或前節正常無法區分，OCT 提供定位。"], "clinicalLink": "新出現直線扭曲或中央缺口時，將檢查導向黃斑並及時評估。", "pitfall": "一個暗腔不一定是裂孔；先確認它位於組織內或穿透全層。", "recall": {"question": "OCT 上視網膜表面有牽引膜，與全層缺損有何不同？", "answer": "前者支持 ERM，後者考慮全層黃斑裂孔，兩者亦可能伴牽引問題。"}, "relatedTopics": ["notes-10", "notes-14"], "sourceIds": ["cov01-oct"]}, {"id": "c28", "title": "FA：從血房水／血視網膜屏障到螢光型態", "pages": [31, 41], "unitId": "u3", "sectionIndexes": [11], "terms": ["Fluorescein angiography", "Blood-retinal barrier", "Leakage", "Window defect"], "keyPoints": ["靜脈注射 fluorescein 後，FA 觀察循環與螢光隨時間的變化；正常血管內本來就會有螢光。血視網膜屏障受損可出現滲漏，但所有亮區並不都是滲漏。", "Leakage 邊緣逐漸模糊擴大；染色 staining 變亮而邊界較固定；pooling 是液體空間充填；window defect 是 RPE 遮蔽減少。暗區也需區分遮蔽與未灌流。"], "clinicalLink": "以早晚期動態及 OCT 結構解釋，而不是僅選最亮的一張圖片。", "pitfall": "共筆「看到螢光就等於血管病變」的說法過度簡化。", "recall": {"question": "亮區邊界固定、只是越來越亮，必然是 leakage 嗎？", "answer": "不是，可能是 staining；需看完整時間序列。"}, "relatedTopics": ["notes-10", "notes-09"], "sourceIds": ["cov01-fa"]}, {"id": "c29", "title": "OCTA：免染劑血流影像能回答什麼", "pages": [32, 41], "unitId": "u3", "sectionIndexes": [11], "terms": ["OCT angiography", "OCTA", "Motion contrast", "Projection artifact"], "keyPoints": ["OCTA 以反覆掃描中的運動對比推估流動血球訊號，能分層顯示血管網而不需靜脈染劑。它與結構 OCT 可互相定位，但不直接呈現 FA 的染劑滲漏。", "慢流、遮蔽、運動、投射與分層錯誤會改變結果；看到缺血樣暗區先確認影像品質及對應 B-scan。OCTA 可補充 FA，不能在每個問題上完全取代。"], "clinicalLink": "疑新生血管時，將血流網與積液、出血及其他影像合看。", "pitfall": "OCTA 沒有訊號不必然等於沒有血管。", "recall": {"question": "OCTA 能直接觀察滲漏隨時間擴大嗎？", "answer": "不能，這是染劑血管攝影提供的另一類資訊。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov01-octa"]}, {"id": "c30", "title": "四種模糊視力：檢查不一致時繼續定位", "pages": [33, 34, 35, 36], "unitId": "u2", "sectionIndexes": [2, 6, 8, 10], "terms": ["Optical cause", "Corneal edema", "Glaucoma", "Metamorphopsia"], "keyPoints": ["慢性屈光變化可由晶狀體造成，局部水腫可由角膜內皮功能或炎症造成；兩者都在前節，却需要不同證據。既往手術只改變先驗可能性，不能替當下診斷作答。", "正常眼壓伴 RNFL／視野一致損害仍需考慮青光眼；前節正常伴變形視則轉向黃斑 OCT。每找到一項異常，都要問它是否能解釋症狀的速度、側別與嚴重度。"], "clinicalLink": "交班保留症狀時間軸、最佳可得視力、結構／功能相符與不符之處。", "pitfall": "原講義病例用作定位練習，不把其少量資訊當通用確診規則。", "recall": {"question": "有正常前節與新發變形視，下一項高價值定位檢查？", "answer": "黃斑眼底評估與 OCT，同時依急性程度安排及時眼科檢查。"}, "relatedTopics": ["notes-06", "notes-07", "notes-10"], "sourceIds": ["an01-exam", "an01-record", "cov01-oct"]}, {"id": "c31", "title": "影像考點延伸：新生血管、疤痕與影像不確定性", "pages": [42, 43, 44], "unitId": "u2", "sectionIndexes": [10], "terms": ["Choroidal neovascularization", "CNV", "Intraretinal scar", "Image quality"], "keyPoints": ["脈絡膜新生血管 CNV 代表異常血管長入不該出現的層次，可能伴 RPE 下／上異常組織、積液或出血；OCT 外觀需與 OCTA、FA 或其他影像互證。", "高反射疤痕或纖維化組織可伴視網膜層次紊亂，並不等同正在滲漏。原共筆部分題目缺原圖或解析標問號，因此保留解剖與鉴別考點，不虛構唯一圖像答案。"], "clinicalLink": "練习先陳述可見層次，再說支持的鑑別及還需要什麼證據。", "pitfall": "模糊影像不能靠背答案提升診斷確定度。", "recall": {"question": "只看到 RPE 下高反射組織，能直接宣布活動性 CNV 嗎？", "answer": "不能；需合併血流、積液、出血與動態影像等證據。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov01-oct", "cov01-octa", "cov01-fa"]}], "unresolved": [], "sourceLimitations": [{"pages": [42, 43, 44], "reason": "原角膜題圖解析度不足，另有歷屆黃斑題缺原圖，原解析亦標示問號。", "handling": "已覆蓋可辨認的解剖、疾病與鑑別考點；不虛構模糊／缺圖的唯一答案。"}], "sourceSha256": "d44350d187f0cbd296884a8d4fe4be7367cb4da07bebf2b98757dc6a22997fd5"}, "notes-02": {"sourceFile": "眼科學No.02.pdf", "pageCount": 50, "reviewedPages": [{"from": 1, "to": 2, "kind": "administrative", "note": "目錄與課程回饋；不納入行政及個人宣傳"}, {"from": 3, "to": 26, "kind": "teaching", "note": "物理／幾何光學、像差、屈光與複習"}, {"from": 27, "to": 29, "kind": "exam", "note": "雷射作用與軸線考點；剔除個人宣傳"}, {"from": 30, "to": 48, "kind": "teaching", "note": "遠近點、鏡片、接觸鏡、屈光手術及複習"}, {"from": 49, "to": 50, "kind": "exam", "note": "清晰範圍、術式與術後眼壓的考點"}], "entries": [{"id": "c01", "title": "物理光學、波長與雷射光的形成", "pages": [3, 4, 24], "unitId": "u3", "sectionIndexes": [0], "terms": ["Physical optics", "Geometric optics", "Photon", "Stimulated emission"], "keyPoints": ["物理光學以波動及光子描述能量、干涉與繞射；幾何光學以光線追蹤描述成像。光子能量 E＝hc/λ，波長愈短，每個光子能量愈高，可見光常概括約 380–780 nm。", "雷射以外部能量建立增益介質中的高能態，受激放射產生方向、頻率與相位相關的光；光學共振腔與部分透射鏡使輸出集中。不是每一次原子自行放光都稱雷射。"], "clinicalLink": "組織效應還取決於脈衝、能量密度與吸收特性。", "pitfall": "不能用波長單一數值推論手術一定較安全或較強。", "recall": {"question": "短波長一定比長波長造成更多組織損傷嗎？", "answer": "不能如此比較；每光子能量較高，但實際損傷還受劑量、吸收與時間影響。"}, "relatedTopics": ["notes-13"], "sourceIds": ["cov02-laser"]}, {"id": "c02", "title": "Photodisruption：Nd:YAG 與飛秒雷射", "pages": [3, 5, 24, 27, 28, 29], "unitId": "u3", "sectionIndexes": [1], "terms": ["Photodisruption", "Nd:YAG", "Femtosecond laser", "Iridotomy", "Capsulotomy"], "keyPoints": ["光破裂以短時間高能量使組織形成電漿與機械作用而分離。Nd:YAG 常見 1064 nm，可用於後囊切開；周邊虹膜切開是為特定瞳孔阻滯情境建立通道。", "飛秒雷射的飛秒指脈衝時間，不是固定波長名稱。它可製作角膜瓣或晶狀體等組織切割；飛秒輔助 LASIK 還需 excimer 完成另一種光切削作用。"], "clinicalLink": "看到術式名稱時，分解每一個步驟所用的雷射及目的。", "pitfall": "虹膜切開不是所有高眼壓病因的通用治療。", "recall": {"question": "飛秒 LASIK 加術後 YAG 囊切開包含哪些作用？", "answer": "飛秒與 YAG 為光破裂；excimer 角膜切削為光切削。"}, "relatedTopics": ["notes-06", "notes-07"], "sourceIds": ["cov02-laser"]}, {"id": "c03", "title": "Photoablation：193 nm excimer 與角膜重塑", "pages": [3, 5, 24, 27, 28, 29, 43], "unitId": "u3", "sectionIndexes": [1, 10], "terms": ["Photoablation", "ArF excimer", "PRK", "LASIK"], "keyPoints": ["ArF excimer 常用 193 nm 紫外光打斷分子鍵、去除精細角膜組織，稱 photoablation。它改變角膜曲率，並不是切除眼內晶狀體，也不同於熱凝固。", "PRK 在表面處理後切削基質，LASIK 在角膜瓣下切削。相同切削原理可搭配不同組織進入方式，因此恢復過程與併發症亦不同。"], "clinicalLink": "區分雷射物理效應、手術層次及患者適應條件。", "pitfall": "光切削仍可能造成混濁或擴張等風險，不能說不留任何疤。", "recall": {"question": "LASIK 與 PRK 是否使用完全不同的切削物理原理？", "answer": "通常均使用 excimer 光切削；主要差別在角膜瓣與表面處理。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov02-laser", "an02-lasik-risk"]}, {"id": "c04", "title": "Photocoagulation：視網膜光凝的效益與代價", "pages": [3, 6, 24, 27, 28, 29], "unitId": "u3", "sectionIndexes": [1], "terms": ["Photocoagulation", "Argon laser", "Frequency-doubled Nd:YAG", "PRP"], "keyPoints": ["光凝把吸收的光轉為熱，使目標組織產生凝固效應。氬雷射與倍頻 Nd:YAG 的 532 nm 綠光是常見教學例子；倍頻是頻率加倍而波長減半。", "泛視網膜光凝 PRP 用於特定缺血性增殖病變，以周邊視網膜治療降低新生血管刺激。即使避開中心凹，仍可能影響周邊視野、夜視或引起黃斑水腫。"], "clinicalLink": "向病人說明預防嚴重併發症的目的，同時說清視覺代價。", "pitfall": "不要沿用「沒有打黃斑，所以視力完全不受影響」的保證。", "recall": {"question": "PRP 的目的是否只是燒掉已看見的新血管？", "answer": "不只如此；主要也改變缺血視網膜帶來的促血管生成刺激。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov02-laser"]}, {"id": "c05", "title": "折射率與 Snell 定律：角度相對法線", "pages": [7, 8, 24], "unitId": "u1", "sectionIndexes": [2], "terms": ["Refractive index", "Snell law", "Normal line"], "keyPoints": ["折射率 n＝真空光速／介質光速，沒有單位；空氣約 1，水約 1.333，角膜約 1.376，房水與玻璃體約 1.336。折射大小取決於界面兩側的差，不是單看某個介質 n 大小。", "Snell 定律 n1 sinθ1＝n2 sinθ2，角度都從界面法線量起。由空氣射入 n＝1.5 的材料，入射 30° 時 sinθ2＝1/3，θ2 約 19.5°，向法線偏折。"], "clinicalLink": "角膜雖非眼內最高折射率，空氣—角膜界面仍提供重要屈光力。", "pitfall": "把角度從表面量起會得到錯誤方向與數值。", "recall": {"question": "入射 30°、n1＝1、n2＝1.5，折射角約多少？", "answer": "約 19.5°，小於入射角。"}, "relatedTopics": ["notes-01"], "sourceIds": ["cov02-optics"]}, {"id": "c06", "title": "全反射與隅角鏡的必要性", "pages": [8, 24], "unitId": "u1", "sectionIndexes": [2], "terms": ["Critical angle", "Total internal reflection", "Gonioscopy"], "keyPoints": ["由高折射率介質射向低折射率介質才可能全反射；臨界角滿足 sinθc＝n2/n1。模型 n1＝4/3、n2＝1 時 θc 約 48.6°，超過此角光無法按一般折射路徑射出。", "正常隅角也因角膜—空氣界面的光學限制而無法直接看清，並非只有窄角眼才看不到。隅角鏡改變此界面，讓光能經透鏡或鏡面被觀察。"], "clinicalLink": "隅角鏡檢查結構開放與否，連到房水引流及閉角機轉。", "pitfall": "臨界角是光線相對法線的角，不是房角本身的角度。", "recall": {"question": "空氣射入角膜會發生全反射嗎？", "answer": "此方向由低 n 到高 n，不符合全反射條件。"}, "relatedTopics": ["notes-07"], "sourceIds": ["cov02-optics"]}, {"id": "c07", "title": "聚散度與薄透鏡算例：先固定正負號", "pages": [9, 10, 24], "unitId": "u1", "sectionIndexes": [2], "terms": ["Vergence", "U＋F＝V", "Diopter", "Magnification"], "keyPoints": ["採光由左向右、發散負與會聚正的約定，在空氣中 U＝1/u、V＝1/v，距離以 m 表示，U＋F＝V。+4 D 透鏡前 0.50 m 實物給 U＝−2 D，故 V＝+2 D，像在後方 0.50 m。", "在相同介質中放大率 m＝v/u，此例 m＝−1，表示等大倒立實像。D 已是倒數公尺，不要把鏡片度數再取倒數後帶入 F。共筆前後的左右符號有矛盾，以此明確約定為準。"], "clinicalLink": "計算先寫單位與符號，再報位置、大小及正倒立。", "pitfall": "只報絕對值會遺漏實像／虛像及方向。", "recall": {"question": "+4 D 鏡前 50 cm 的物體，像在哪？", "answer": "鏡後 50 cm，等大倒立實像。"}, "relatedTopics": ["notes-01"], "sourceIds": ["cov02-optics"]}, {"id": "c08", "title": "第一焦點、第二焦點與造鏡者公式", "pages": [10, 24], "unitId": "u1", "sectionIndexes": [2], "terms": ["Primary focal point", "Secondary focal point", "Lens maker equation"], "keyPoints": ["第一焦點是物點放在該處後，出射光成平行的位置；第二焦點是平行入射光經鏡後會聚或其反向延長線的交點。正鏡第二焦點在鏡後，負鏡為鏡前虛焦點。", "薄透鏡在均勻介質中可用 1/f＝(n鏡/n介質−1)(1/R1−1/R2)（f 以 m 表示）來 理解曲率與相對折射率影響，半徑正負須用一致約定。同一鏡片放入水中，屈光力不等於在空氣中的值。"], "clinicalLink": "理解接觸鏡與角膜間淚液、人工晶狀體處在房水中的光學。", "pitfall": "焦距是距離，焦點是位置；兩者不要混成同一名詞。", "recall": {"question": "負鏡的第二焦點是真實會聚點嗎？", "answer": "不是，是發散光反向延長線的虛焦點。"}, "relatedTopics": ["notes-06"], "sourceIds": ["cov02-optics"]}, {"id": "c09", "title": "Gullstrand 與簡化眼：模型如何使用", "pages": [11, 12, 13], "unitId": "u1", "sectionIndexes": [2, 6], "terms": ["Gullstrand schematic eye", "Reduced eye", "Accommodation", "Tear film"], "keyPoints": ["Gullstrand 模型以多個折射面及介質描述眼球；簡化眼用較少等效面方便估算。一般整眼屈光力約 60 D 的概念不表示每個人相同，也不是把角膜與晶狀體直接相加。", "角膜表面及淚膜提供穩定入射界面，晶狀體藉曲率變化調節。睫狀肌收縮、懸韌帶張力下降、晶狀體變凸時看近所需屈光力增加。"], "clinicalLink": "眼表不穩可以造成波動模糊與驗光不穩，並非全是度數改變。", "pitfall": "調節放鬆時晶狀體仍有屈光力。", "recall": {"question": "模型眼能直接代替個人 IOL 生物測量嗎？", "answer": "不能；個人眼軸、角膜、晶狀體位置等仍需量測。"}, "relatedTopics": ["notes-06", "notes-12"], "sourceIds": ["cov02-optics", "an02-clinical"]}, {"id": "c10", "title": "視軸、光軸、瞳孔軸與角 alpha／kappa", "pages": [13, 14, 25, 27, 29], "unitId": "u3", "sectionIndexes": [3], "terms": ["Optical axis", "Visual axis", "Pupillary axis", "Angle alpha", "Angle kappa"], "keyPoints": ["光軸是近似通過各光學元件中心或曲率中心的參考軸；視軸連結注視目標與中心凹的光學方向；瞳孔軸通過入口瞳孔中心並垂直角膜。真實眼球未必完美共軸。", "Angle alpha 比較視軸與光軸，angle kappa 比較視軸與瞳孔軸。儀器有時報告毫米的 chord 偏移；這是距離，不能稱為 0.5 mm 的角度或套成普遍 IOL 禁忌。"], "clinicalLink": "對中與多焦點鏡片選擇須整合量測定義、瞳孔、角膜及病人需求。", "pitfall": "原共筆將囊袋中心直接等同光軸並設單一門檻，過度簡化。", "recall": {"question": "報告 0.4 mm 能直接當成 angle kappa 嗎？", "answer": "不能；先確認是 chord 距離、哪個參考點與測量條件。"}, "relatedTopics": ["notes-06", "notes-04"], "sourceIds": ["cov02-optics", "an02-clinical"]}, {"id": "c11", "title": "色差與紅綠平衡：焦點的相對位置", "pages": [15, 23, 26], "unitId": "u2", "sectionIndexes": [4], "terms": ["Chromatic aberration", "Longitudinal chromatic aberration", "Duochrome"], "keyPoints": ["一般眼光學中短波長折射較強，綠光焦點相對位於紅光之前，形成縱向色差。紅綠平衡利用此焦點差，協助球面主觀驗光終點的判斷。", "在適當條件下紅底字較清楚通常提示需向更多負／更少正方向微調，綠底較清楚則相反。需控制調節並比較字的清楚程度，而不是哪個背景較亮或較喜歡。"], "clinicalLink": "將紅綠結果與最佳視力及其他驗光結果核對，不能單獨定處方。", "pitfall": "色覺、介質混濁、照明與合作都可能讓測試不可靠。", "recall": {"question": "綠底字較清楚，通常往哪個方向微調？", "answer": "往較多正或較少負方向，再確認兩側清楚程度及視力。"}, "relatedTopics": ["notes-01"], "sourceIds": ["an02-clinical", "cov02-optics"]}, {"id": "c12", "title": "稜鏡：光向基底，影像向頂端", "pages": [16, 26], "unitId": "u2", "sectionIndexes": [9], "terms": ["Prism", "Base", "Apex", "Prism diopter"], "keyPoints": ["平行平板可讓光線平移而出射方向平行；三角稜鏡則改變光行進方向，光線向基底折，觀察到的影像向頂端移。這兩種方向需分開說明。", "1 稜鏡度在 1 m 距離產生 1 cm 位移；5Δ 在 2 m 約對應 10 cm 位移。Δ 不等於角度的度數，也不是焦度 D。"], "clinicalLink": "稜鏡可協助測量或改善某些雙眼複視，處方仍需實際試戴與病因評估。", "pitfall": "不要把光線偏折方向與病人感覺的影像方向說成同一側。", "recall": {"question": "稜鏡基底朝外，光與所見影像各往哪裡？", "answer": "光向外側基底，所見影像向內側頂端。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov02-prism"]}, {"id": "c13", "title": "球面像差與瞳孔大小", "pages": [16, 17, 25, 45], "unitId": "u2", "sectionIndexes": [4], "terms": ["Spherical aberration", "Pupil size", "Optical zone"], "keyPoints": ["球面像差是同軸入射但不同離軸高度的光線焦點不同；正球面像差時周邊光線較早聚焦。暗處瞳孔變大，周邊光學不規則更可能影響眩光與夜視。", "角膜屈光手術可改變球面像差，影響取決於原有形態、切削區與瞳孔。降低周邊／中央屈光力差是光學設計觀念，並非建議向晶狀體注射物質。"], "clinicalLink": "術前及術後把白天視力與夜間品質分開詢問。", "pitfall": "不能把每個夜間光暈都歸因球面像差，眼表與其他像差亦需查。", "recall": {"question": "瞳孔放大為何可能讓光暈更明顯？", "answer": "更多周邊光線進入，可能增加高階像差與散射的影響。"}, "relatedTopics": ["notes-05", "notes-06"], "sourceIds": ["cov02-wavefront", "an02-lasik-risk"]}, {"id": "c14", "title": "彗差與三葉像差：非對稱的光學品質", "pages": [17, 25, 45], "unitId": "u2", "sectionIndexes": [4], "terms": ["Coma", "Trefoil", "Decentration", "Tilt"], "keyPoints": ["彗差 coma 讓點像帶彗星尾巴般的不對稱拖影，可見於不對稱角膜、偏心或傾斜的光學元件；三葉像差 trefoil 呈三方向的波前形態，亦屬高階像差。", "單純球柱鏡不能完整矯正這些形態。檢查可搭配角膜地形圖與波前，判斷來自角膜或眼內，並先處理不穩的淚膜。"], "clinicalLink": "術後重影不是一律再加近視度數，先確認來源。", "pitfall": "角膜近視雷射重塑角膜，並非把天然晶狀體磨歪。", "recall": {"question": "彗差與一般規則散光的矯正方式可完全等同嗎？", "answer": "不行；彗差屬高階像差，球柱鏡不足以完整描述。"}, "relatedTopics": ["notes-05", "notes-06"], "sourceIds": ["cov02-wavefront"]}, {"id": "c15", "title": "離軸像散與斜軸散光是不同概念", "pages": [17, 18, 25], "unitId": "u2", "sectionIndexes": [4], "terms": ["Oblique astigmatism", "Tangential plane", "Sagittal plane", "Oblique-axis astigmatism"], "keyPoints": ["光斜向通過光學系統時，切向 tangential 與弧矢 sagittal 平面可有不同焦點，稱離軸像散。它可在向側方看眼鏡時影響成像，即使中央處方正確仍有周邊模糊。", "臨床「斜軸散光」指規則散光主要軸向不在水平或垂直附近；與離軸入射造成的像散機轉不同。共筆補註將兩者混為只差軸度，需更正。"], "clinicalLink": "解釋鏡片邊緣不適時，同時評估對中、鏡框傾斜與鏡片設計。", "pitfall": "不要把英文 oblique 在不同脈絡下當成同一個診斷。", "recall": {"question": "從眼鏡周邊斜看產生的像散等於斜軸散光嗎？", "answer": "不是，前者關於離軸光路，後者是處方軸向分類。"}, "relatedTopics": ["notes-01"], "sourceIds": ["cov02-optics"]}, {"id": "c16", "title": "場曲與畸變：模糊與變形要分清", "pages": [18, 26], "unitId": "u2", "sectionIndexes": [4], "terms": ["Curvature of field", "Distortion", "Pincushion", "Barrel"], "keyPoints": ["場曲是平面物體的最佳聚焦像面呈彎曲，中央對焦時邊緣可能離焦；它描述焦面形狀。畸變則是放大率隨位置改變，物體可仍清楚但直線看起來彎曲。", "枕狀畸變 pincushion 的周邊放大率較大，桶狀畸變 barrel 的周邊放大率較小。眼鏡改度數、鏡框大小或設計後，病人可能感到空間比例改變。"], "clinicalLink": "先問是「不清楚」還是「形狀不對」，再評估鏡片與眼部病變。", "pitfall": "新發單眼變形視也可能是黃斑病，不能只歸因眼鏡。", "recall": {"question": "場曲與畸變哪個主要是位置不同導致放大率不同？", "answer": "畸變；場曲主要描述最佳焦面彎曲。"}, "relatedTopics": ["notes-10"], "sourceIds": ["cov02-optics"]}, {"id": "c17", "title": "波前與低階／高階像差的整理", "pages": [45], "unitId": "u2", "sectionIndexes": [4], "terms": ["Wavefront aberration", "Zernike", "Lower-order aberration", "Higher-order aberration"], "keyPoints": ["波前分析描述實際光學相對理想波前的偏差，可用 Zernike 模式分類。一般球面離焦與規則散光主要屬二階；彗差、三葉像差及球面像差屬更高階。", "臨床應先獲得可靠的球柱鏡矯正、穩定眼表與重複量測，再解讀高階像差。波前導引依個別量測，波前優化則用設計降低誘發像差，兩者不同。"], "clinicalLink": "球柱鏡視力很好卻有夜間光暈時，可考慮視覺品質層面的評估。", "pitfall": "不能把所有「像散」一律列高階；常規散光是低階。", "recall": {"question": "為何驗光處方正常仍可能看得不舒服？", "answer": "高階像差、散射、眼表與後節問題未必由一般處方解釋。"}, "relatedTopics": ["notes-05"], "sourceIds": ["cov02-wavefront"]}, {"id": "c18", "title": "軸性與屈光性近視：矯正不等於消除風險", "pages": [19, 20, 46], "unitId": "u1", "sectionIndexes": [5], "terms": ["Axial myopia", "Refractive myopia", "Myopic maculopathy"], "keyPoints": ["調節放鬆時平行光在視網膜前聚焦為近視。軸性近視以眼軸較長為主；屈光性近視可來自角膜較陡或晶狀體屈光改變，例如圓錐角膜與核性變化。", "高度近視眼可有豹紋狀眼底、視乳頭周圍萎縮、黃斑萎縮、漆裂紋或新生血管等變化；不宜把來源圖的 M0–M5 當成未說明的通用分級。矯正視力好也仍需留意裂孔／剝離與其他共病。"], "clinicalLink": "閃光飛蚊、視野幕遮或新變形視應及時評估眼底。", "pitfall": "屈光手術改善焦點，不把長眼軸變短。", "recall": {"question": "近視增加一定是眼軸變長嗎？", "answer": "不是；角膜或晶狀體屈光改變也可能造成近視化。"}, "relatedTopics": ["notes-05", "notes-06", "notes-10"], "sourceIds": ["an02-nei", "an02-lasik-risk"]}, {"id": "c19", "title": "遠視與調節：能看遠不代表沒有負擔", "pages": [20, 30, 31, 46], "unitId": "u1", "sectionIndexes": [5, 6], "terms": ["Hyperopia", "Axial hyperopia", "Refractive hyperopia", "Latent hyperopia"], "keyPoints": ["遠視在調節放鬆時焦點落於視網膜後，可由眼軸較短或屈光力不足造成。年輕人可用調節補償，因此裸視可能正常卻有近用疲勞或眼位問題。", "度數高或調節不足時，看遠與看近都可能模糊；不能定義成「看遠一定清楚」。睫狀肌麻痺驗光可揭示被調節掩蓋的遠視成分，處方需結合年齡與雙眼功能。"], "clinicalLink": "兒童內斜與視疲勞時，把遠視和調節—集合關係納入推理。", "pitfall": "遠視與老花不是同義詞，也可以同時存在。", "recall": {"question": "年輕人裸視 1.0 能排除遠視嗎？", "answer": "不能，他可能以調節補償。"}, "relatedTopics": ["notes-04"], "sourceIds": ["an02-nei", "an02-clinical"]}, {"id": "c20", "title": "五種規則散光：以兩焦線和視網膜定位", "pages": [20, 21, 22], "unitId": "u1", "sectionIndexes": [5], "terms": ["Regular astigmatism", "Irregular astigmatism", "Simple／compound myopic astigmatism", "Mixed astigmatism", "Simple／compound hyperopic astigmatism"], "keyPoints": ["規則散光的兩主子午線互相垂直，形成兩焦線。兩焦線都在視網膜前為複合近視散光，一條在前一條在視網膜為單純近視散光；分在前後為混合散光。", "一條在視網膜、一條在後是單純遠視散光；都在後為複合遠視散光。不規則散光則無法被單一正交球柱模型完整描述，常需角膜形態及接觸鏡評估。"], "clinicalLink": "由兩主子午線的屈光狀態讀處方，不只看球面正負。", "pitfall": "不規則散光不是完全無法改善，只是一般柱鏡不能完整矯正。", "recall": {"question": "+2.00/−4.00 的兩主子午線為何？", "answer": "+2.00 與 −2.00 D，屬混合散光。"}, "relatedTopics": ["notes-05"], "sourceIds": ["an02-clinical"]}, {"id": "c21", "title": "柱面鏡軸向、轉置與點／線聚焦", "pages": [21, 22], "unitId": "u1", "sectionIndexes": [5], "terms": ["Cylinder axis", "Power cross", "Transposition", "Cylindrical lens"], "keyPoints": ["旋轉對稱聚光器可將平行光集中於點，柱面形式沿一方向不變則集中於線；這是理解球面與柱面作用差別的幾何類比，不能把反射鏡與透鏡的公式混用。", "柱鏡軸向本身沒有柱面力，最大柱面作用在相隔 90° 的子午線。轉置公式為新球面 S＋C、柱面 −C、軸向轉 90°；−2.00/−1.00×180 等同 −3.00/+1.00×90。"], "clinicalLink": "讀正柱鏡或負柱鏡處方時，先畫兩主子午線可避免方向混亂。", "pitfall": "Axis 不總是角膜最陡子午線；它取決於柱鏡記法。", "recall": {"question": "轉置後的兩主子午線屈光力會改變嗎？", "answer": "不會，表示方式不同而光學等效。"}, "relatedTopics": ["notes-01"], "sourceIds": ["an02-clinical", "cov02-optics"]}, {"id": "c22", "title": "遠點：矯正鏡的焦點如何接回眼球", "pages": [30, 46, 49, 50], "unitId": "u1", "sectionIndexes": [7], "terms": ["Far point", "Uncorrected myopia", "Virtual far point"], "keyPoints": ["遠點是調節放鬆時與視網膜共軛的物點。未矯正 −2.00 D 近視的遠點在眼前 0.50 m；正視遠點在無窮遠，遠視的遠點則是眼後的虛點。", "矯正近視的負鏡讓遠方平行光變成好像來自遠點的發散光；正鏡則提供遠視需要的會聚。這些模型忽略頂點距離時最簡單，精確配鏡需再考慮距離。"], "clinicalLink": "用遠點解釋近視摘鏡能近讀，而不是說其調節能力變好。", "pitfall": "水晶體調節放鬆不等於水晶體沒有屈光力。", "recall": {"question": "−2.00 D 近視的裸視遠點在哪？", "answer": "眼前 50 cm；這是眼球共軛物點，不是視網膜上的焦點。"}, "relatedTopics": ["notes-06"], "sourceIds": ["an02-retinoscopy", "cov02-optics"]}, {"id": "c23", "title": "近點與清晰範圍：近視的完整算例", "pages": [31, 46, 49, 50], "unitId": "u1", "sectionIndexes": [7], "terms": ["Near point", "Accommodative amplitude", "Interval of clear vision"], "keyPoints": ["薄透鏡近似下，未矯正近視的度數絕對值 M（−3 D 時 M＝3）、調節幅度 A D，遠點為 1/M m，近點為 1/(M＋A) m。若 M＝3、A＝2，遠點 33.3 cm、近點 20 cm，清晰範圍約 20–33.3 cm。", "戴足矯正眼鏡後遠點可移向無窮遠，但可用調節幅度並未因此增加。實際近用還受集合、景深與可持續調節影響，考題近點不是長時間舒適閱讀距離。"], "clinicalLink": "先說是否裸眼、是否已矯正，再算度數與距離。", "pitfall": "原考古部分選項與正確計算不一致，應依算式，不背字母答案。", "recall": {"question": "−3 D、調節 2 D 的裸眼清晰範圍？", "answer": "20–33.3 cm；兩端分別對應最大調節與放鬆調節。"}, "relatedTopics": ["notes-04"], "sourceIds": ["an02-retinoscopy", "cov02-optics"]}, {"id": "c24", "title": "遠視近點：先支付遠方所需的調節", "pages": [31, 46], "unitId": "u1", "sectionIndexes": [7], "terms": ["Hyperopic near point", "Virtual far point", "Accommodation reserve"], "keyPoints": ["未矯正 +1.50 D 遠視若有 4.00 D 調節，遠方已需使用 1.50 D，近用剩 2.50 D，理想近點為 1/2.50＝0.40 m。眼前可清楚看物的範圍約 40 cm 至無窮遠。", "若總調節 A 小於遠視 H，放鬆或最大調節都不足以看清遠方；A＝H 則僅能在理想最大調節下看遠。眼後虛遠點不能誤報成眼前最遠可讀距離。"], "clinicalLink": "將算例與年輕人潛伏遠視、老化後症狀浮現連起來。", "pitfall": "不要把遠視近點算成 1/(A＋H)。", "recall": {"question": "+1.50 D、調節 4 D，近點是多少？", "answer": "約 40 cm，先以 4−1.5＝2.5 D 再取倒數。"}, "relatedTopics": ["notes-04", "notes-06"], "sourceIds": ["an02-clinical", "cov02-optics"]}, {"id": "c25", "title": "頂點距離換算：正負鏡方向不同", "pages": [32, 34, 47], "unitId": "u2", "sectionIndexes": [8], "terms": ["Vertex distance", "Contact lens conversion", "Effective power"], "keyPoints": ["把眼鏡處方換到角膜平面，可用 FCL＝Fs/(1−dFs)，d 以 m 計。−8.00 D、頂點 12 mm 時，FCL＝−8/1.096≈−7.30 D；負度數絕對值變小。", "若 Fs＝+8.00 D，同樣 12 mm，FCL＝8/0.904≈+8.85 D，正度數需更大。散光處方應分兩主子午線換算，最後仍需接觸鏡驗配與 over-refraction。"], "clinicalLink": "數學換算提供起始值，不能代替鏡片合適度及實際視力。", "pitfall": "把 12 mm 直接當 12 m 帶入會產生荒謬結果。", "recall": {"question": "高負鏡改成接觸鏡通常更負還是較不負？", "answer": "較不負，但最終度數仍依驗配確認。"}, "relatedTopics": ["notes-01"], "sourceIds": ["an02-clinical", "cov02-contacts"]}, {"id": "c26", "title": "鏡片對中、傾斜與視線偏移", "pages": [32, 33, 47], "unitId": "u2", "sectionIndexes": [9], "terms": ["Centration", "Tilt", "Pantoscopic angle", "Prismatic effect"], "keyPoints": ["眼鏡光學中心若未對準瞳孔或實際視線，就會引入非預期稜鏡；度數愈高，同樣偏移的影響通常愈大。鏡架滑落與單眼 PD 也可能改變配戴效果。", "鏡片傾斜會改變有效球面力並誘發散光，不能只靠處方紙判斷配鏡品質。接觸鏡隨眼球移動可減少部分問題，但仍可能偏心、轉動或不合。"], "clinicalLink": "換鏡後不適先核對鏡片與配戴位置，再決定是否改度數。", "pitfall": "接觸鏡並非完全沒有對中與像差問題。", "recall": {"question": "處方正確卻戴新鏡暈，應檢查哪些非處方因素？", "answer": "PD、光學中心、鏡架高度、傾斜、頂點距離及實際鏡片。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov02-prism", "an02-clinical"]}, {"id": "c27", "title": "Prentice rule 與屈光參差造成的垂直不平衡", "pages": [33, 47], "unitId": "u2", "sectionIndexes": [9], "terms": ["Prentice rule", "Anisophoria", "Base down", "Base up"], "keyPoints": ["Prentice rule：誘發稜鏡 Δ＝偏心距離 c（cm）×鏡片力 F（D），大小可先取絕對值，方向再依鏡片形狀判斷。−6 D 鏡片往下 1 cm 看，約產生 6Δ base down。", "若另眼為 −2 D，同樣下視產生 2Δ base down，雙眼有約 4Δ 垂直差，可能造成 anisophoria 與閱讀不適。球柱鏡需用該偏移方向相關的子午線力。"], "clinicalLink": "接觸鏡、合適光學設計或專業稜鏡調整可減少某些不平衡，需實際驗配。", "pitfall": "此處比較的是雙眼誘發稜鏡的差，不是兩片鏡片的總和。", "recall": {"question": "−6 D 與 −2 D 下視各 1 cm，垂直差是多少？", "answer": "約 4Δ，兩側皆 base down 但大小不同。"}, "relatedTopics": ["notes-04"], "sourceIds": ["cov02-prism"]}, {"id": "c28", "title": "Aniseikonia 與 Knapp 定律的適用範圍", "pages": [33, 34, 47], "unitId": "u2", "sectionIndexes": [9], "terms": ["Anisometropia", "Aniseikonia", "Knapp law"], "keyPoints": ["屈光參差是兩眼屈光狀態不同；aniseikonia 是感覺影像大小或形狀不同。眼鏡的放大／縮小效應、眼軸及視網膜本身都可能參與，兩者不能直接畫等號。", "Knapp 定律是理想純軸性屈光異常在眼前焦平面矯正時可減少像大小差的模型，並非保證所有視差眼都能完全匹配。接觸鏡常可改善眼鏡相關不平衡，但未必消除視網膜性像差。"], "clinicalLink": "詢問重影、頭暈及空間扭曲，結合雙眼功能與黃斑檢查。", "pitfall": "不要沿用「戴接觸鏡就完全沒有成像大小差」。", "recall": {"question": "一眼黃斑前膜造成大小不同，換接觸鏡必然好嗎？", "answer": "不必然；視網膜性 aniseikonia 不一定能由光學矯正完全改善。"}, "relatedTopics": ["notes-04", "notes-10"], "sourceIds": ["cov02-aniseikonia"]}, {"id": "c29", "title"
